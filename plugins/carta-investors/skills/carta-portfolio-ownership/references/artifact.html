<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{FIRM_NAME}} — Portfolio Ownership</title>
    <!-- SangBleu Versailles is Carta's brand serif but isn't licensed for distribution
         outside Carta's environments, so it's referenced as the first font-family
         option for staff-machine fidelity and falls back to EB Garamond / Georgia
         everywhere else. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light dark;
            --page-padding: 48px;
            /* Ink tokens — values copied verbatim from theme-with-ink/tokens.css.
               Inline only what this view uses. */
            --ink-color-global-surface-background-default: light-dark(#FFFFFF, rgb(18 18 18));
            --ink-color-global-surface-background-underlay: light-dark(#F1F1F1, #2D2D2D);
            --ink-color-global-surface-lightgray-hover: light-dark(#DEDFDF, #2D2D2D);
            --ink-color-global-feedback-negative-strong: light-dark(#E52431, #FAD9D7);
            --ink-color-global-text-default: light-dark(#1A1A1A, #EDEDED);
            --ink-color-global-text-subtle: light-dark(#656B6B, #A7AAAA);
            --ink-color-global-border-default: light-dark(#A7AAAA, #656B6B);
            --ink-color-global-border-subtle: light-dark(#DEDFDF, #2D2D2D);
            --ink-color-global-border-focus-default: light-dark(#285DA3, #8BABD6);
            --ink-color-global-border-focus-light: light-dark(#C0D1E9, #1A3E6D);
            --ink-color-global-link-default: light-dark(#285DA3, #8BABD6);
            --ink-color-global-link-hover: light-dark(#1A3E6D, #4176BC);
            --ink-color-global-surface-disabled: light-dark(#EDEDED, #394040);
            --ink-color-global-text-disabled: light-dark(#CECFCF, #656B6B);
            --ink-color-global-feedback-info-subtle: light-dark(#EAF0F8, #122948);
            --ink-color-global-feedback-info-strong: light-dark(#285DA3, #2C67B5);
            --ink-button-background-color-primary-base-default: light-dark(#1A1A1A, #FFFFFF);
            --ink-button-background-color-primary-base-hover: light-dark(#202020, #CECFCF);
            --ink-button-font-color-primary-base: light-dark(#FFFFFF, #1A1A1A);
            --ink-color-global-brand-white: #FFFFFF;
            --ink-color-global-brand-gray-70: #9C9F9F;
            --ink-color-global-brand-gray-90: #394040;
            --ink-color-global-brand-brown-10: #FBFAF9;
            /* Sand (Ink's brown-10) for fund rows and the As of menu. Light mode only:
               a dark brown reads as loud on this near-monochrome dark theme, so dark
               mode uses Ink's underlay dark arm. */
            --ownership-surface-sand: light-dark(var(--ink-color-global-brand-brown-10), #2D2D2D);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Fallback for any borderless focusable element (links, native buttons) —
           bordered controls get their own border-recolor + ring instead. */
        :focus-visible {
            outline: 2px solid var(--ink-color-global-border-focus-default);
            box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--ink-color-global-surface-background-default);
            color: var(--ink-color-global-text-default);
            padding: var(--page-padding);
        }

        .container { max-width: 1600px; margin: 0 auto; }

        /* ── Header ── */
        .header { margin-bottom: 24px; }

        .carta-logo {
            display: block;
            width: 64px;
            height: 32px;
            margin-bottom: 24px;
            color: var(--ink-color-global-text-default);
        }

        .header-eyebrow {
            font-size: 13px;
            font-weight: 400;
            color: var(--ink-color-global-text-subtle);
            letter-spacing: 0.02em;
            margin-bottom: 2px;
        }

        .header h1 {
            font-family: "SangBleu Versailles", 'EB Garamond', Georgia, "Times New Roman", serif;
            font-size: 28px;
            font-weight: 400;
            line-height: 48px;
            color: var(--ink-color-global-text-default);
        }

        /* ── Shimmer loading state ── */
        @keyframes shimmer {
            0% { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }

        .shimmer-bone {
            background: linear-gradient(90deg, var(--ink-color-global-surface-background-underlay) 25%, var(--ink-color-global-border-default) 50%, var(--ink-color-global-surface-background-underlay) 75%);
            background-size: 800px 100%;
            animation: shimmer 1.5s infinite ease-in-out;
            border-radius: 4px;
        }

        .loading-status { font-size: 13px; color: var(--ink-color-global-text-subtle); margin-bottom: 12px; }

        .shimmer-toolbar { height: 32px; width: 220px; margin-bottom: 12px; }

        .shimmer-table-header {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--ink-color-global-border-subtle);
            margin-bottom: 4px;
        }

        .shimmer-row {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--ink-color-global-surface-background-underlay);
        }

        .shimmer-cell { height: 14px; flex: 1; }
        .shimmer-cell:first-child { flex: 2; }

        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

        .content-area { display: none; }
        .content-area.loaded { display: block; animation: fade-in 0.3s ease; }

        /* ── Fund filter ── */
        .switcher-row { margin-bottom: 16px; }

        .fund-switcher {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            max-width: 100%;
            padding: 7px 12px;
            background-color: var(--ink-color-global-surface-background-default);
            border: 1px solid var(--ink-color-global-border-subtle);
        }

        .fund-switcher-label {
            font-size: 13px;
            color: var(--ink-color-global-text-subtle);
            font-weight: 500;
            white-space: nowrap;
        }

        /* ── Combobox ──
           A native <select> can't be searched, which stops scaling once a firm has
           dozens of funds: a trigger, a filterable listbox, and keyboard support. */
        .combo { position: relative; display: inline-flex; min-width: 0; }

        .combo-trigger {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 320px;
            padding: 0;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-color-global-text-default);
            cursor: pointer;
            text-align: left;
        }

        .combo-trigger:focus-visible {
            outline: 2px solid var(--ink-color-global-border-focus-default);
            outline-offset: 3px;
            box-shadow: none;
        }

        .combo-trigger-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Multi-select trigger. A slightly wider budget than the single-select one
           because it carries an overflow count as well as a name, but still one
           line that never wraps — Fund and As of read as a single unit, and a
           wrapping trigger would change the toolbar's height on every pick. */
        .combo-trigger--multi {
            max-width: 320px;
            white-space: nowrap;
        }

        /* Ink Bubble, count variant: 18px pill, info colors, tabular figures.
           The same treatment Ink's GlobalFilter uses for an applied-filter count.
           It never shrinks — the count is the only signal that the trigger's label
           isn't the whole selection, so it must not be what gets ellipsed away. */
        .bub {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 18px;
            min-width: 18px;
            padding: 0 6px;
            border: 1px solid var(--ink-color-global-feedback-info-strong);
            border-radius: 999px;
            background: var(--ink-color-global-feedback-info-subtle);
            color: var(--ink-color-global-feedback-info-strong);
            font-size: 12px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: 0.01em;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ── Ink Checkbox ──
           20px box at radius-subtle. The box stays white in both themes and the
           glyph is a dark stroke — Ink does not fill the box on check. */
        .ink-chk {
            position: relative;
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
        }

        .ink-chk > input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 20px;
            height: 20px;
            margin: 0;
        }

        .ink-chk > .ink-chk-box {
            width: 20px;
            height: 20px;
            border: 1px solid var(--ink-color-global-border-default);
            border-radius: 4px;
            background: var(--ink-color-global-brand-white);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.12s, box-shadow 0.12s;
        }

        .ink-chk > .ink-chk-box > svg {
            display: block;
            opacity: 0;
            color: var(--ink-color-global-brand-gray-90);
        }

        .combo-option:hover .ink-chk > .ink-chk-box { border-color: light-dark(var(--ink-color-global-brand-gray-90), var(--ink-color-global-brand-gray-70)); }
        .ink-chk.is-checked > .ink-chk-box > .ink-chk-check,
        .ink-chk.is-mixed > .ink-chk-box > .ink-chk-dash { opacity: 1; }

        .ink-chk > input:focus-visible + .ink-chk-box {
            border-color: var(--ink-color-global-border-focus-default);
            box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light);
        }

        /* Ink's Dropdown.Trigger caret: 16px, in the trigger's own color. */
        .combo-chevron {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: currentColor;
            flex-shrink: 0;
        }

        .combo-panel {
            position: absolute;
            top: calc(100% + 10px);
            left: -12px;
            z-index: 50;
            /* Grows with the longest fund name up to 560px; longer names are
               middle-truncated by fitComboLabels, which keeps the distinguishing
               suffix (", LP", "-A") visible. */
            width: max-content;
            min-width: 320px;
            max-width: min(560px, calc(100vw - 32px));
            background: var(--ink-color-global-surface-background-default);
            border: 1px solid var(--ink-color-global-border-subtle);
            border-radius: 4px;
            box-shadow: 0 4px 20px 0 rgb(0 0 0 / 0.1);
            padding: 4px 0;
        }

        .combo-panel.align-right { left: auto; right: 0; }

        .combo-search-wrap { padding: 8px; border-bottom: 1px solid var(--ink-color-global-border-subtle); }

        .combo-search {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            font-family: inherit;
            font-size: 14px;
            color: var(--ink-color-global-text-default);
            background: var(--ink-color-global-surface-background-default);
            border: 1px solid var(--ink-color-global-border-default);
            border-radius: 4px;
            outline: none;
        }

        .combo-search:focus {
            border-color: var(--ink-color-global-border-focus-default);
            box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light);
        }

        .combo-list {
            max-height: 340px;
            overflow-y: auto;
            /* Reserve the scrollbar's width so it can't cover the vintage column. */
            scrollbar-gutter: stable;
            list-style: none;
        }

        .combo-list:focus-visible { outline: none; box-shadow: none; }
        .combo-panel:focus { outline: none; }

        .combo-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            font-size: 14px;
            line-height: 24px;
            color: var(--ink-color-global-text-default);
            cursor: pointer;
        }

        .combo-option:hover,
        .combo-option.active { background: var(--ink-color-global-surface-background-underlay); }

        .combo-option-label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
        }

        .combo-option.is-family > .combo-option-label { font-weight: 600; }
        .combo-option.is-member { padding-left: 40px; }

        .combo-option.is-all {
            border-bottom: 1px solid var(--ink-color-global-border-subtle);
            margin-bottom: 2px;
            padding-bottom: 10px;
        }

        .combo-meta {
            font-size: 12px;
            color: var(--ink-color-global-text-subtle);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .combo-empty, .combo-footer {
            padding: 10px 12px;
            font-size: 12px;
            color: var(--ink-color-global-text-subtle);
        }

        /* Only multi-select panels get a footer, and it pairs Clear all with Apply. */
        .combo-footer {
            border-top: 1px solid var(--ink-color-global-border-subtle);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .combo-clear-all {
            border: 0;
            background: none;
            padding: 0;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: normal;
            text-transform: none;
            color: var(--ink-color-global-link-default);
            cursor: pointer;
        }

        .combo-clear-all:hover { color: var(--ink-color-global-link-hover); text-decoration: underline; }
        .combo-clear-all:focus-visible {
            outline: 2px solid var(--ink-color-global-border-focus-default);
            outline-offset: 2px;
        }
        .combo-clear-all:disabled {
            color: var(--ink-color-global-text-subtle);
            cursor: default;
            text-decoration: none;
            opacity: 0.6;
        }

        /* Ink Button, primary + small. Black in light mode, white in dark — the
           action color. Never blue; blue stays reserved for links and focus. */
        .ink-btn--primary {
            height: 32px;
            padding: 0 12px;
            border: 1px solid transparent;
            border-radius: 4px;
            background: var(--ink-button-background-color-primary-base-default);
            color: var(--ink-button-font-color-primary-base);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            cursor: pointer;
            appearance: none;
        }

        .ink-btn--primary:hover { background: var(--ink-button-background-color-primary-base-hover); }
        .ink-btn--primary:focus-visible {
            outline: 0;
            border-color: var(--ink-color-global-border-focus-default);
            box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light);
        }
        .ink-btn--primary:disabled {
            background: var(--ink-color-global-surface-disabled);
            color: var(--ink-color-global-text-disabled);
            cursor: not-allowed;
        }


        @media (max-width: 640px) {
            .fund-switcher { display: flex; width: 100%; }
            .combo { position: static; flex: 1; }
            .combo-trigger { max-width: 100%; }
            .combo-panel,
            .combo-panel.align-right { left: 0; right: 0; width: auto; min-width: 0; max-width: none; }
        }

        /* ── Toolbar ── */
        .toolbar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .search-wrapper { position: relative; display: flex; align-items: center; }

        .search-icon {
            position: absolute;
            left: 10px;
            color: var(--ink-color-global-text-subtle);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .search-input {
            height: 32px;
            padding: 0 10px 0 30px;
            border: 1px solid var(--ink-color-global-border-subtle);
            background: var(--ink-color-global-surface-background-default);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            width: 220px;
            color: var(--ink-color-global-text-default);
            transition: border-color 0.15s;
        }

        .search-input::placeholder { color: var(--ink-color-global-text-subtle); }

        .search-input:focus {
            border-color: var(--ink-color-global-border-focus-default);
            box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light);
        }

        /* Ink ghost button — transparent at rest, light gray on hover. */
        .ink-btn--ghost {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            padding: 0 12px;
            border: 1px solid transparent;
            border-radius: 4px;
            background: transparent;
            color: var(--ink-color-global-text-default);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            appearance: none;
        }

        .ink-btn--ghost:hover { background: var(--ink-color-global-surface-lightgray-hover); }
        .ink-btn--ghost:focus-visible {
            outline: 0;
            border-color: var(--ink-color-global-border-focus-default);
            box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light);
        }
        .ink-btn--ghost[hidden] { display: none; }

        .toolbar-end {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar-status { font-size: 13px; color: var(--ink-color-global-text-subtle); }

        /* ── As of ── */
        .as-of-wrap { position: relative; }

        .ink-btn--ghost.as-of-trigger { border-color: var(--ink-color-global-border-subtle); }

        .as-of-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            z-index: 50;
            width: 300px;
            background: var(--ownership-surface-sand);
            border: 1px solid var(--ink-color-global-border-subtle);
            border-radius: 4px;
            box-shadow: 0 4px 20px 0 rgb(0 0 0 / 0.1);
            overflow: hidden;
        }

        .as-of-option {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 12px;
            border: 0;
            background: none;
            font-family: inherit;
            text-align: left;
            color: var(--ink-color-global-text-default);
            cursor: pointer;
        }

        .as-of-option + .as-of-option,
        .as-of-custom { border-top: 1px solid var(--ink-color-global-border-subtle); }

        .as-of-option:hover,
        .as-of-option:focus-visible {
            outline: 0;
            box-shadow: none;
            background: var(--ink-color-global-surface-background-underlay);
        }

        .as-of-text {
            flex: 1;
            font-size: 13px;
            line-height: 18px;
            white-space: nowrap;
        }

        .as-of-text strong { font-weight: 600; }

        .as-of-sub { margin-left: 6px; font-size: 12px; font-style: italic; color: var(--ink-color-global-text-subtle); }


        .as-of-custom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            font-size: 13px;
        }

        .as-of-custom input {
            height: 28px;
            padding: 0 6px;
            font-family: inherit;
            font-size: 13px;
            color: var(--ink-color-global-text-default);
            background: var(--ink-color-global-surface-background-default);
            border: 1px solid var(--ink-color-global-border-default);
            border-radius: 4px;
        }

        /* ── Table ── */
        .table-scroll-wrap { position: relative; }

        /* Scrolling sideways already makes this box the table's scroll container, so
           the header can only stick inside it: bound its height to the window and
           let it scroll vertically too. */
        .table-scroll {
            overflow: auto;
            max-height: calc(100vh - 2 * var(--page-padding));
        }

        /* Right-edge fade hinting there's more to see on horizontal scroll. On the
           non-scrolling wrapper so it stays pinned instead of scrolling away. */
        .table-scroll-wrap::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 32px;
            pointer-events: none;
            background: linear-gradient(to right, transparent, var(--ink-color-global-surface-background-default));
            opacity: 0;
            transition: opacity 0.15s;
        }

        .table-scroll-wrap.has-more-right::after { opacity: 1; }

        table { min-width: 100%; border-collapse: collapse; }

        th {
            background: var(--ink-color-global-surface-background-default);
            padding: 8px 12px;
            text-align: left;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-color-global-text-default);
            /* A shadow, not a border: collapsed borders scroll away from a sticky cell. */
            box-shadow: inset 0 -1px 0 var(--ink-color-global-text-default);
            height: 40px;
            line-height: 20px;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 3;
        }

        th.number { text-align: right; }

        th.sortable { cursor: pointer; user-select: none; transition: color 0.12s; }

        th.sortable:hover,
        th.sortable.dimmed { color: var(--ink-color-global-text-subtle); }

        .th-inner { display: inline-flex; align-items: center; gap: 6px; }

        th.number .th-inner { justify-content: flex-end; }

        .sort-indicator {
            display: inline-flex;
            color: var(--ink-color-global-border-default);
            transition: color 0.12s;
        }

        th.sortable.active .sort-indicator { color: var(--ink-color-global-text-default); }

        td {
            padding: 8px 12px;
            font-size: 13px;
            color: var(--ink-color-global-text-default);
            line-height: 22px;
            height: 40px;
            vertical-align: middle;
            white-space: nowrap;
            border-bottom: 1px solid var(--ink-color-global-border-subtle);
        }

        tbody tr:last-child td { border-bottom: none; }

        /* ── Sticky first column ── */
        th:first-child,
        td:first-child {
            position: sticky;
            left: 0;
            z-index: 2;
            background: var(--ink-color-global-surface-background-default);
            padding-left: 8px;
            min-width: 320px;
            max-width: 46%;
            white-space: normal;
            word-wrap: break-word;
        }

        th:first-child { z-index: 4; }

        th:first-child::after,
        td:first-child::after {
            content: '';
            position: absolute;
            top: 0;
            right: -6px;
            bottom: 0;
            width: 6px;
            pointer-events: none;
            box-shadow: inset 6px 0 6px -6px rgba(0,0,0,0.08);
            opacity: 0;
            transition: opacity 0.15s;
        }

        .table-scroll.scrolled th:first-child::after,
        .table-scroll.scrolled td:first-child::after { opacity: 1; }

        /* ── Company and fund rows ── */
        tr.company-row { cursor: pointer; user-select: none; }

        tr.company-row:hover td { background: var(--ink-color-global-surface-background-underlay); }

        .fund-row-name { font-weight: 500; }

        .ink-icon {
            display: inline-flex;

            align-items: center;
            justify-content: center;
            width: 16px;
            color: var(--ink-color-global-border-default);

        tr.company-row:hover .expand-icon { color: var(--ink-color-global-text-subtle); }

        .no-cap-table-tag {

            line-height: 20px;

        }

        /* ── Expand-all toggle (header) ── */
        .th-expand { display: inline-flex; align-items: center; }

        .expand-all-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-color-global-border-default);
            cursor: pointer;
            transition: color 0.12s;
            flex-shrink: 0;
        }

        .expand-all-toggle:hover { color: var(--ink-color-global-text-default); }

        .number { font-variant-numeric: tabular-nums; text-align: right; }

        /* ── Tooltip ── */
        .tooltip-trigger {
            text-decoration: underline;
            text-decoration-style: dotted;
            text-decoration-color: var(--ink-color-global-border-default);
            text-underline-offset: 3px;
            cursor: default;
        }

        tr.company-row .tooltip-trigger { cursor: pointer; }

        .tooltip-popup {
            position: fixed;
            background: var(--ink-color-global-text-default);
            color: var(--ink-color-global-surface-background-default);
            font-size: 12px;
            font-weight: 400;
            line-height: 18px;
            padding: 6px 10px;
            border-radius: 4px;
            white-space: pre;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 100;
        }

        .tooltip-popup.visible { opacity: 1; }

        /* ── Empty / error states ──
           Neutral status is --text-subtle, errors are --negative-strong. Retry
           controls are links, so they take the link color, not the error's. */
        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: var(--ink-color-global-text-subtle);
            white-space: normal;
        }

        .empty-state.error { color: var(--ink-color-global-feedback-negative-strong); }

        .retry-link {
            margin-left: 6px;
            padding: 0;
            border: none;
            background: none;
            font: inherit;
            color: var(--ink-color-global-link-default);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 2px;
            cursor: pointer;
        }

        .retry-link:hover { color: var(--ink-color-global-link-hover); }

        .retry-link:focus-visible {
            outline: 2px solid var(--ink-color-global-border-focus-default);
            outline-offset: 2px;
            box-shadow: none;
        }
    </style>
</head>
