    :root {
      color-scheme: light dark;
      --ink-color-global-text-default:               light-dark(#1A1A1A, #EDEDED);
      --ink-color-global-text-subtle:                light-dark(#656B6B, #A7AAAA);
      --ink-color-global-surface-background-default: light-dark(#FFFFFF, rgb(18 18 18));
      /* Local, intentionally non-Ink: the elevated card surface used in dark mode.
         #2C3030 is not the value of any Ink surface token, so it carries a --carta-*
         name rather than shadowing an Ink token name with an invented value.
         Rendered pixels are unchanged. */
      --carta-surface-card-elevated:                 #2C3030;
      /* One step further up the elevation stack: a card nested INSIDE a card
         (e.g. .tearsheet-preview). Light arg is Ink's light surface-background-
         underlay, so light mode is unchanged; dark arg is Ink's dark
         surface-darkgray-default, the nearest Ink step to #444 — the next one
         up, surface-lightgray-active (#656B6B), overshoots badly. Keeps the
         nested card readable as elevated against the #2C3030 card. */
      --carta-surface-card-nested:                   light-dark(#F1F1F1, #394040);
      --ink-color-global-border-subtle:              light-dark(#DEDFDF, #2D2D2D);
      --ink-color-global-border-default:             light-dark(#A7AAAA, #656B6B);
      --ink-elevation-global-shadow-small:           0 4px 12px 0 rgb(0 0 0 / 0.08);
      --ink-elevation-global-shadow-medium:          0 4px 20px 0 rgb(0 0 0 / 0.1);
      --ink-elevation-global-shadow-large:           0 4px 20px 0 rgb(0 0 0 / 0.2);
      --ink-font-global-family-prominent:            "SangBleu Versailles", Georgia, serif;
      --ink-font-global-size-display-1:              28px;
      --ink-font-global-leading-display-1:           48px;
      --ink-size-global-radius-flat:                 0;
      --ink-size-global-radius-subtle:               4px;
      --ink-size-global-radius-default:              8px;
      --ink-radius-pill:                             9999px;
      /* Single-valued on purpose: the toast and the perf tooltip are
         permanently-dark surfaces, so they must NOT flip with the theme —
         light-dark() pairs there put dark text on a dark surface. */
      --ink-color-global-brand-black:                #1A1A1A;
      --ink-color-global-brand-white:                #FFFFFF;
      /* Button tokens (Ink primary) */
      --ink-button-background-color-primary-base-default: light-dark(#1A1A1A, #FFFFFF);
      --ink-button-background-color-primary-base-hover:   light-dark(#202020, #CECFCF);
      --ink-button-font-color-primary-base:               light-dark(#FFFFFF, #1A1A1A);
      /* Info feedback (for What's New banner) */
      --ink-color-global-feedback-info-subtle:       light-dark(#EAF0F8, #122948);
      /* Feedback semantics — both deliberately depart from Ink's own values.
         Ink ships feedback-positive-strong single-valued at green-70 (#2D9E90)
         and negative-strong at red-70/red-40. As SMALL TEXT those miss WCAG AA
         on the surfaces this artifact actually puts them on, so each arg is
         moved along the same Ink brand ramp until it clears 4.5:1 on every one.
         Signed values render on: light #FFFFFF (card), #F1F1F1 (SOI asset rows,
         nested card) and #DEDFDF (row hover); dark #121212 (page, .ts-kpi),
         #2C3030 (card) and #2D2D2D (SOI rows, row hover).
           positive light green-90 #105242 -> 9.10 / 8.06 / 6.82
                    dark  green-50 #5BC0B3 -> 8.60 / 6.13 / 6.32
           negative light red-80   #A82020 -> 7.26 / 6.43 / 5.44
                    dark  red-60   #EF7171 -> 6.49 / 4.62 / 4.77
         Ink's own steps scored 3.28 / 2.90 / 2.46 and 4.54 / 4.02 / 3.40.
         Nothing signed renders on --carta-surface-card-nested (#394040), where
         red-60 would be 3.67:1 — keep it that way. */
      --ink-color-global-feedback-positive-strong:   light-dark(#105242, #5BC0B3);
      --ink-color-global-feedback-positive-subtle:   light-dark(#EBF7F6, #063A32);
      --ink-color-global-feedback-negative-strong:   light-dark(#A82020, #EF7171);
      --ink-color-global-feedback-negative-subtle:   light-dark(#FFEEEF, #401018);
      --ink-color-global-feedback-warning-subtle:    light-dark(#FFFCED, #341C00);
      /* Surfaces */
      --ink-color-global-surface-background-underlay: light-dark(#F1F1F1, #2D2D2D);
      --ink-color-global-surface-lightgray-default:  light-dark(#F1F1F1, #202020);
      --ink-color-global-surface-lightgray-hover:    light-dark(#DEDFDF, #2D2D2D);
      --ink-color-global-surface-lightgray-active:   light-dark(#CECFCF, #656B6B);
      --ink-color-global-surface-background-overlay:  light-dark(rgb(0 0 0 / 0.8), rgb(80 80 80 / 0.8));
      /* Text / links / borders */
      --ink-color-global-border-active:              light-dark(#1A1A1A, #CECFCF);
      /* Focus. This artifact never links tokens.css, so Ink's focus pair has to
         be declared locally for the :focus-visible model below. */
      --ink-color-global-border-focus-default:       light-dark(#285DA3, #8BABD6);
      --ink-color-global-border-focus-light:         light-dark(#C0D1E9, #1A3E6D);
      /* Warning text, always paired with feedback-warning-subtle behind it.
         accessibility.md mandates yellow-80 (#B58A00) as the warning-text step
         and forbids yellow-60/70 — but on its own light warning-subtle
         (#FFFCED) yellow-80 is only 3.09:1. Dark keeps the mandated yellow-80
         (5.03:1 on #341C00); light steps one darker to yellow-90 (7.17:1),
         which is the direction the rule intends rather than the yellow-60/70 it
         forbids. Carries a --carta-* name because the value is no longer a
         single Ink palette step. */
      --carta-warning-text:                          light-dark(#705010, #B58A00);
      /* Chart chrome (axis ticks + legend labels). Canvas text is painted by
         Chart.js, which cannot read light-dark() out of a custom property —
         carta-home.html resolves this token through inkColor(). */
      --carta-chart-label-color:                     light-dark(#656B6B, #A7AAAA);
      /* Chart series, in order: the indigo / teal / pink of Carta's entity-structure
         charts, then grey and a light indigo for a fourth and fifth fund. Each has a
         lighter dark-mode arm so lines stay visible on the dark surface. */
      --carta-series-blue:                           light-dark(#1E3CAF, #8A9AE6);
      --carta-series-teal:                           light-dark(#3A8F7F, #6FC2B0);
      --carta-series-pink:                           light-dark(#C74E7E, #E58BAE);
      --carta-series-gray:                           light-dark(#8C8C8C, #A7AAAA);
      --carta-series-lilac:                          light-dark(#7F8CDB, #B3BCF0);
      /* Peer chart: the P25–P75 band is the fund indigo as a soft wash, the median a mid grey. */
      --carta-peer-band:                             light-dark(rgb(30 60 175 / 0.16), rgb(138 154 230 / 0.2));
      --carta-peer-median:                           light-dark(#656B6B, #A7AAAA);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      background: var(--ink-color-global-surface-background-default);
      color: var(--ink-color-global-text-default);
      min-height: 100vh;
    }

    /* Bordered controls take Ink's real treatment instead: recolor the 1px
       border, add the 4px ring outside it, drop the outline. */
    select:focus-visible,
    #soi-page-search:focus-visible,
    #soi-page-fund-select:focus-visible,
    #perf-page-fund-select:focus-visible {
      border-color: var(--ink-color-global-border-focus-default);
      box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light);
      outline: none;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 32px 64px;
    }

    /* ── Page frame and header: the Schedule of Investments layout ── */
    .perf-container { --perf-page-pad: 48px; width: 100%; max-width: 1600px; margin: 0 auto; padding: var(--perf-page-pad); box-sizing: border-box; }
    .back-to-home {
      display: inline-flex; align-items: center; gap: 4px; margin-bottom: 16px;
      font-size: 13px; font-weight: 500; line-height: 1.4;
      color: var(--ink-color-global-text-subtle); text-decoration: none; cursor: pointer;
    }
    .back-to-home:hover { color: var(--ink-color-global-text-default); }
    .back-to-home[hidden] { display: none; }
    .perf-header { margin-bottom: 24px; }
    .perf-header-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .carta-logo { display: block; width: 64px; height: 32px; color: var(--ink-color-global-text-default); }
    .perf-as-of { font-size: 13px; line-height: 20px; color: var(--ink-color-global-text-subtle); white-space: nowrap; }
    .perf-back-link {
      padding: 0; border: 0; background: none; cursor: pointer;
      font: inherit; font-weight: 500; letter-spacing: inherit; color: var(--ink-color-global-text-subtle);
    }
    .perf-back-link:hover { color: var(--ink-color-global-text-default); }
    .perf-back-link[hidden], #perf-firm-name-label[hidden] { display: none; }
    .perf-header-eyebrow { font-size: 13px; color: var(--ink-color-global-text-subtle); letter-spacing: 0.02em; margin-bottom: 2px; min-height: 20px; }
    .page-title {
      font-family: var(--ink-font-global-family-prominent);
      font-size: var(--ink-font-global-size-display-1);
      font-weight: 400;
      line-height: var(--ink-font-global-leading-display-1);
      color: var(--ink-color-global-text-default);
    }
    @media (max-width: 640px) { .perf-container { --perf-page-pad: 24px; padding: var(--perf-page-pad) 16px; } }

    /* ── Fund switcher (SOI's): a bordered "Fund <name>" segment with a searchable list ── */
    .perf-view-toggle { display: inline-flex; align-items: center; gap: 8px; }
    .perf-view-toggle[hidden] { display: none; }
    .perf-family-note, .perf-list-note { margin: 0 0 12px; font-size: 12px; line-height: 18px; color: var(--ink-color-global-text-subtle); }
    /* The member names wrap inside the width the fund names set: zero width keeps a long
       family from widening the column and pushing the last columns off the table. */
    .perf-family-sub { display: block; width: 0; min-width: 100%; white-space: normal; font-size: 11px; line-height: 14px; color: var(--ink-color-global-text-subtle); font-weight: 400; }
    .switcher-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .fund-switcher {
      position: relative;
      display: inline-flex; align-items: stretch; width: fit-content; max-width: 100%;
      background: var(--ink-color-global-surface-background-default);
      border: 1px solid var(--ink-color-global-border-subtle);
    }
    .switcher-segment { display: flex; align-items: center; gap: 8px; padding: 7px 12px; min-width: 0; }
    .fund-switcher-label { font-size: 13px; color: var(--ink-color-global-text-subtle); font-weight: 500; white-space: nowrap; }
    .combo { display: inline-flex; min-width: 0; }
    .combo-trigger {
      display: inline-flex; align-items: center; gap: 6px; max-width: 320px; padding: 0;
      border: none; background: transparent; font-family: inherit; font-size: 13px; font-weight: 500;
      color: var(--ink-color-global-text-default); cursor: pointer; text-align: left;
    }
    .combo-trigger:focus-visible { outline: 2px solid var(--ink-color-global-border-focus-default); outline-offset: 3px; }
    .combo-trigger-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .combo-chevron { display: inline-flex; flex-shrink: 0; }
    .combo-panel {
      position: absolute; top: calc(100% + 6px); left: -1px; z-index: 50;
      width: max-content; min-width: 320px; max-width: min(560px, calc(100vw - 32px));
      background: var(--ink-color-global-surface-background-default);
      border: 1px solid var(--ink-color-global-border-subtle); border-radius: 4px;
      box-shadow: var(--ink-elevation-global-shadow-medium); padding: 4px 0;
    }
    .combo-panel[hidden] { display: none; }
    .combo-search-wrap { padding: 8px; border-bottom: 1px solid var(--ink-color-global-border-subtle); }
    .combo-search {
      width: 100%; height: 40px; padding: 0 12px; font-family: inherit; font-size: 14px; line-height: 1;
      color: var(--ink-color-global-text-default); background: var(--ink-color-global-surface-background-default);
      border: 1px solid var(--ink-color-global-border-default); border-radius: 4px; outline: none;
    }
    .combo-search:focus { border-color: var(--ink-color-global-border-focus-default); box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light); }
    .combo-list { max-height: 340px; overflow-y: auto; list-style: none; margin: 0; padding: 0; }
    /* The active row's highlight shows keyboard position; the list itself needs no ring. */
    .combo-list:focus-visible { outline: none; box-shadow: none; }
    .combo-option {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      font-size: 14px; line-height: 24px; color: var(--ink-color-global-text-default); cursor: pointer;
    }
    .combo-check { width: 14px; flex-shrink: 0; display: flex; align-items: center; visibility: hidden; }
    .combo-option[aria-selected="true"] .combo-check { visibility: visible; }
    .combo-option[aria-selected="true"] { font-weight: 600; }
    .combo-option:hover, .combo-option.active { background: var(--ink-color-global-surface-background-underlay); }
    .combo-option-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .combo-empty { padding: 10px 12px; font-size: 12px; color: var(--ink-color-global-text-subtle); }
    @media (max-width: 640px) {
      .fund-switcher, .switcher-segment { width: 100%; }
      .combo-trigger { max-width: 100%; }
    }

    /* Company logo on a light chip, overlaid bottom-left of a Plugin news thumb
       when the card is a live content item (live-content.js). */
    .cs-logo-chip {
      position: absolute;
      left: 12px;
      bottom: 12px;
      background: #FFFFFF;
      border-radius: var(--ink-size-global-radius-subtle);
      padding: 5px 8px;
      box-shadow: var(--ink-elevation-global-shadow-small);
      max-width: 60%;
    }
    .gl-pos { color: var(--ink-color-global-feedback-positive-strong); }
    .gl-neg { color: var(--ink-color-global-feedback-negative-strong); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--ink-color-global-brand-black);
      color: var(--ink-color-global-brand-white);
      font-size: 13px;
      padding: 10px 20px;
      border-radius: var(--ink-size-global-radius-subtle);
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ── Customize popover (floating, no backdrop) ── */
    #customize-popover {
      display: none;
      position: fixed;
      top: 64px; /* just below the sticky page header */
      right: 16px;
      width: 360px;
      max-height: 480px;
      overflow-y: auto;
      z-index: 400;
      background: var(--ink-color-global-surface-background-default);
      border: 1px solid var(--ink-color-global-border-subtle);
      box-shadow: var(--ink-elevation-global-shadow-medium);
      padding: 18px 20px;
    }
    #customize-popover.open { display: block; }
    .customize-popover-header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
      margin-bottom: 2px;
    }
    .customize-title { font-size: 13px; font-weight: 600; }
    .customize-subtitle { font-size: 12px; color: var(--ink-color-global-text-subtle); line-height: 1.5; margin-bottom: 14px; }
    .customize-close {
      background: none; border: none; cursor: pointer; padding: 2px; flex-shrink: 0;
      color: var(--ink-color-global-text-subtle);
    }
    /* No underline: the uppercase, letter-spaced type carries the hierarchy on
       its own, and the rule separated nothing structural (Ink rule 7). */
    .cust-section-label {
      font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
      color: var(--ink-color-global-text-subtle); margin: 16px 0 8px;
    }
    .cust-section-label:first-child { margin-top: 0; }
    .cust-prompt-card {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px;
      border: 1px solid var(--ink-color-global-border-subtle);
      margin-bottom: 5px;
      background: var(--ink-color-global-surface-background-default);
      transition: background 0.12s;
    }
    .cust-prompt-card:hover { background: var(--ink-color-global-surface-lightgray-hover); }
    .cust-prompt-text {
      flex: 1; font-size: 13px; color: var(--ink-color-global-text-default); line-height: 1.35;
    }
    .cust-copy-btn {
      flex-shrink: 0; background: none; border: 1px solid var(--ink-color-global-border-subtle);
      border-radius: var(--ink-size-global-radius-subtle); padding: 4px 9px; cursor: pointer;
      color: var(--ink-color-global-text-subtle); font-size: 11px; font-family: inherit;
      display: flex; align-items: center; gap: 4px;
      transition: border-color 0.12s, color 0.12s; white-space: nowrap;
    }
    .cust-copy-btn:hover { border-color: var(--ink-color-global-border-default); color: var(--ink-color-global-text-default); }
    .cust-copy-btn.copied { border-color: var(--ink-color-global-feedback-positive-strong); color: var(--ink-color-global-feedback-positive-strong); }

    /* ── Fund peer chart card ── */
    .perf-peer-card { margin-bottom: 24px; }
    .perf-peer-summary { font-size: 14px; line-height: 20px; margin: 0 0 10px; min-height: 20px; color: var(--ink-color-global-text-default); }
    .perf-peer-summary strong { font-weight: 600; }
    .perf-peer-detail { color: var(--ink-color-global-text-subtle); }
    .perf-peer-band-key { width: 14px; height: 10px; background: var(--carta-peer-band); border-radius: 2px; }
    .perf-peer-cohort { margin-top: 10px; min-height: 18px; font-size: 12px; line-height: 18px; color: var(--ink-color-global-text-subtle); }
    .perf-chart-card {
      border: 1px solid var(--ink-color-global-border-subtle);
      border-radius: 0; padding: 16px 20px;
      background: light-dark(var(--ink-color-global-surface-background-default), var(--carta-surface-card-elevated));
    }
    .perf-chart-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; gap: 8px; }
    /* Ink heading-3: 16px semibold, no extra tracking. */
    .perf-chart-title { font-size: 16px; font-weight: 600; line-height: 24px; color: var(--ink-color-global-text-default); }
    .perf-chart-wrap { position: relative; height: 180px; }
    .perf-chart-wrap.tall { height: 240px; }
    /* Metrics strip: SOI's, with the IRR tile first. All five across from 1200px. Between
       641px and 1199px the IRR tile is a full-width hero row, with room for its gross
       figure and fee note, and the four capital tiles sit in a 2x2 grid under it, all
       the same height. Below 641px everything stacks, IRR first. */
    .perf-metrics-strip {
      display: grid; grid-template-columns: 1fr; column-gap: 16px; row-gap: 12px;
      border: 1px solid var(--ink-color-global-border-subtle);
      background: var(--ink-color-global-surface-background-default);
      padding: 14px 16px; margin-bottom: 24px;
    }
    .perf-metric { min-width: 0; }
    @media (max-width: 1199px) {
      .perf-metric-irr .perf-metric-val { font-size: 28px; line-height: 36px; }
    }
    @media (min-width: 641px) and (max-width: 1199px) {
      .perf-metrics-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .perf-metric-irr { grid-column: 1 / -1; }
      /* Hero row and the first capital row carry a rule beneath; the left capital column a rule beside. */
      .perf-metric:nth-child(-n+3) { border-bottom: 1px solid var(--ink-color-global-border-subtle); padding-bottom: 12px; }
      .perf-metric:nth-child(even) { border-right: 1px solid var(--ink-color-global-border-subtle); padding-right: 16px; }
    }
    @media (min-width: 1200px) {
      .perf-metrics-strip { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .perf-metric { border-right: 1px solid var(--ink-color-global-border-subtle); padding-right: 16px; }
      .perf-metric:last-child { border-right: none; padding-right: 0; }
    }
    @media (max-width: 640px) {
      .perf-metric { border-bottom: 1px solid var(--ink-color-global-border-subtle); padding-bottom: 12px; }
      .perf-metric:last-child { border-bottom: none; padding-bottom: 0; }
    }
    .perf-metric-label { font-size: 13px; font-weight: 500; line-height: 20px; color: var(--ink-color-global-text-subtle); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .perf-irr-gross { font-size: 13px; font-weight: 400; color: var(--ink-color-global-text-subtle); }
    .perf-irr-note { margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--ink-color-global-text-subtle); }
    .perf-metric-val { font-size: 20px; font-weight: 500; line-height: 28px; font-variant-numeric: tabular-nums; color: var(--ink-color-global-text-default); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* ── Fund detail metrics table ── */
    .perf-detail-table { border-collapse: collapse; width: 100%; margin-bottom: 24px; table-layout: auto; font-variant-numeric: tabular-nums; }
    .perf-detail-table thead th:first-child { text-align: left; }
    .perf-detail-table thead th:not(:first-child) { width: 160px; text-align: right; }
    .perf-detail-table tbody td:not(:first-child) { text-align: right; }
    .perf-legend-dot { width: 10px; height: 3px; border-radius: 1px; flex-shrink: 0; }

    /* ── All-funds overview graph (list view) ── */
    /* Springy ease-out shared by every entrance: fast start, soft landing. */
    :root { --perf-ease-spring: cubic-bezier(0.22, 1, 0.36, 1); }
    .perf-overview-card { margin-bottom: 24px; animation: perf-rise .52s var(--perf-ease-spring) both; }
    @keyframes perf-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    /* Min-heights match the filled rows, so the table below doesn't jump when the graph loads. */
    .perf-overview-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; min-height: 28px; }
    .perf-seg {
      display: inline-flex; gap: 2px; padding: 2px;
      background: var(--ink-color-global-surface-lightgray-default);
      border-radius: var(--ink-size-global-radius-subtle);
    }
    .perf-seg-btn, .perf-switch, .perf-overview-chip {
      font: inherit; cursor: pointer;
      transition: background .15s, color .15s, box-shadow .15s, transform .12s var(--perf-ease-spring);
    }
    .perf-seg-btn:active, .perf-switch:active, .perf-overview-chip:active { transform: scale(.96); }
    .perf-seg-btn {
      border: none; background: none; padding: 3px 10px; border-radius: 3px;
      font-size: 12px; font-weight: 500; color: var(--ink-color-global-text-subtle);
    }
    .perf-seg-btn:hover { color: var(--ink-color-global-text-default); }
    .perf-seg-btn[aria-checked="true"] {
      background: light-dark(var(--ink-color-global-surface-background-default), var(--ink-color-global-surface-lightgray-active));
      color: var(--ink-color-global-text-default);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.12);
    }
    .perf-switch-label { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-color-global-text-subtle); }
    .perf-switch {
      position: relative; width: 28px; height: 16px; padding: 0; border: none; border-radius: var(--ink-radius-pill);
      background: var(--ink-color-global-border-default);
    }
    .perf-switch[aria-checked="true"] { background: var(--ink-color-global-border-active); }
    .perf-switch:disabled { opacity: .4; cursor: not-allowed; }
    .perf-switch::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
      background: var(--ink-color-global-surface-background-default);
      /* Slight overshoot, so the knob settles like a spring. */
      transition: transform .28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .perf-switch[aria-checked="true"]::after { transform: translateX(12px); }
    .perf-overview-legend { margin-bottom: 10px; min-height: 52px; }
    .perf-compare-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; font-size: 12px; }
    .perf-compare-rule { color: var(--ink-color-global-text-subtle); }
    .perf-compare-reset { background: none; border: none; padding: 0; font: inherit; color: var(--ink-color-global-text-default); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
    .perf-compare-chips { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
    /* Each fund is an eye toggle: shown funds read in full colour, hidden ones go quiet. */
    .perf-overview-chip {
      display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px;
      background: none; border: 1px solid transparent; border-radius: var(--ink-size-global-radius-subtle);
      font-size: 12px; color: var(--ink-color-global-text-default);
    }
    .perf-overview-chip:hover { background: var(--ink-color-global-surface-lightgray-hover); }
    .perf-overview-chip .perf-legend-dot { background: var(--c); }
    .perf-overview-chip[aria-pressed="false"] { color: var(--ink-color-global-text-subtle); }
    .perf-overview-chip[aria-pressed="false"] .perf-legend-dot { background: transparent; box-shadow: inset 0 0 0 1px var(--c); }
    .perf-overview-chip[aria-disabled="true"] { cursor: not-allowed; }
    .perf-overview-chip[aria-disabled="true"]:hover { background: none; }
    .perf-compare-eye { display: inline-flex; color: var(--ink-color-global-text-subtle); }
    .perf-overview-chip[aria-pressed="true"] .perf-compare-eye { color: var(--ink-color-global-text-default); }
    .perf-overview-chip.is-new, .perf-overview-peer-key.is-new { animation: perf-pop .36s var(--perf-ease-spring) both; animation-delay: calc(var(--i, 0) * 40ms); }
    .perf-overview-chip:focus-visible { outline: 2px solid var(--ink-color-global-border-focus-default); box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light); }
    .perf-overview-peer-key[hidden] { display: none; }
    .perf-overview-peer-key { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; font-size: 12px; color: var(--ink-color-global-text-subtle); }
    .perf-overview-dash { width: 14px; height: 0; border-top: 2px dashed var(--ink-color-global-text-subtle); }
    /* The fund chart's median line is drawn in --carta-peer-median, so its key is too. */
    .perf-peer-card .perf-overview-dash { border-top-color: var(--carta-peer-median); }
    @keyframes perf-pop { from { opacity: 0; transform: translateY(4px) scale(.92); } to { opacity: 1; transform: none; } }
    /* ── Loading skeleton: SOI's shimmer bones ── */
    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    .shimmer-bone {
      background: linear-gradient(90deg, var(--ink-color-global-surface-background-underlay) 25%, var(--ink-color-global-border-default) 50%, var(--ink-color-global-surface-background-underlay) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.5s infinite ease-in-out;
      border-radius: 4px;
    }
    .shimmer-table-header { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--ink-color-global-border-subtle); }
    .shimmer-row { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--ink-color-global-surface-background-underlay); }
    .shimmer-th, .shimmer-td { height: 14px; flex: 1; }
    .shimmer-th:first-child, .shimmer-td:first-child { flex: 2; }
    .shimmer-val { display: inline-block; height: 14px; width: 72px; vertical-align: middle; }
    .perf-metric-val .shimmer-val { height: 22px; width: 110px; }
    /* Chart placeholders fill their frame until the chart lands, then fade. */
    .perf-chart-bone { position: absolute; inset: 0; transition: opacity .3s ease; pointer-events: none; }
    .perf-chart-bone.is-done { opacity: 0; }
    /* Narrow-screen overrides */
    @media (max-width: 600px) {
      .perf-chart-wrap { height: 160px; }
      .perf-chart-wrap.tall { height: 200px; }
    }
    /* ── Perf page all-funds table (Ink Table, matching SOI and LP Summary) ── */
    /* Labels are regular-weight secondary grey; values stay primary so nothing reads disabled. */
    .perf-table-wrap { position: relative; }
    /* Scrolling sideways already makes this box the table's scroll container, so the
       header can only stick inside it: bound its height to the window and scroll both ways. */
    .perf-table-scroll {
      overflow: auto;
      max-height: calc(100vh - 2 * var(--perf-page-pad));
    }
    /* Cells follow the Schedule of Investments table: 13px, 40px rows, a dark rule under
       the header, the Fund column (and Net IRR on wider windows) pinned while the rest scroll. */
    /* Separate borders: Chromium drops collapsed borders under the pinned columns. */
    .perf-funds-table {
      min-width: 100%; border-collapse: separate; border-spacing: 0; table-layout: auto; font-variant-numeric: tabular-nums;
      /* One row colour, set here so the header row inherits it too: the pinned cue column
         and its fade match the row they end, hovered or not. */
      --perf-row-bg: var(--ink-color-global-surface-background-default);
      /* The Fund column's exact width: Net IRR pins right beside it at this offset. */
      --perf-name-col: 288px;
    }
    .perf-funds-table th, .perf-detail-table th {
      background: var(--ink-color-global-surface-background-default);
      padding: 8px 12px; height: 40px; text-align: right;
      font-size: 13px; font-weight: 500; line-height: 20px; color: var(--ink-color-global-text-default);
      white-space: nowrap;
      /* A shadow, not a border: collapsed borders scroll away from a sticky cell. */
      box-shadow: inset 0 -1px 0 var(--ink-color-global-text-default);
    }
    .perf-funds-table td, .perf-detail-table td {
      background: var(--ink-color-global-surface-background-default);
      padding: 8px 12px; height: 40px; vertical-align: middle;
      font-size: 13px; line-height: 22px; color: var(--ink-color-global-text-default);
      border-bottom: 1px solid var(--ink-color-global-border-subtle); white-space: nowrap; text-align: right;
      transition: background .15s;
    }
    .perf-funds-table th:first-child, .perf-funds-table td:first-child,
    .perf-detail-table th:first-child, .perf-detail-table td:first-child { text-align: left; padding-left: 8px; }
    /* Fund names wrap inside a fixed width, so Net IRR can pin at a known offset. */
    .perf-funds-table th:first-child, .perf-funds-table td:first-child {
      position: sticky; left: 0; z-index: 2; width: var(--perf-name-col); min-width: var(--perf-name-col); max-width: var(--perf-name-col); white-space: normal;
    }
    /* The column flagged `pinned` in _PERF_COLS stays beside the fund name when the table
       scrolls sideways; the other columns scroll under it. Phones pin only Fund: with Net IRR
       and the cue column too, almost no room is left to read the rest. */
    @media (min-width: 601px) {
      .perf-funds-table .perf-pin-col { position: sticky; left: var(--perf-name-col); z-index: 2; }
      .perf-funds-table thead th.perf-pin-col { z-index: 4; }
    }
    /* Header row pinned above the body rows; the Fund header (and the pinned column's, on wider
       windows) pins both ways, so it sits on top. A header that scrolls sideways stays below Fund. */
    .perf-funds-table thead th { position: sticky; top: 0; z-index: 3; }
    .perf-funds-table thead th:first-child { z-index: 4; }
    .perf-detail-table td:first-child { font-weight: 500; }
    .perf-funds-table tbody tr:last-child td, .perf-detail-table tbody tr:last-child td { border-bottom: none; }
    /* Ink sortable header: a transparent button whose 5px padding is cancelled by its
       margin, so the label stays on the cell's text edge while the hover box bleeds. */
    .perf-funds-table .perf-sort-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 0 5px; margin: 0 -5px;
      background: transparent; border: 0; border-radius: var(--ink-size-global-radius-subtle);
      font: inherit; color: inherit; cursor: pointer; white-space: nowrap;
      transition: background-color 80ms ease-out;
    }
    .perf-funds-table .perf-sort-btn:hover { background: var(--ink-color-global-surface-lightgray-hover); }
    .perf-funds-table .perf-sort-btn:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light); }
    .perf-sort-icon { flex-shrink: 0; }
    .perf-sort-asc, .perf-sort-desc { fill: var(--ink-color-global-border-default); }
    th[aria-sort="ascending"] .perf-sort-asc, th[aria-sort="descending"] .perf-sort-desc { fill: var(--ink-color-global-text-default); }
    /* The whole row opens the fund; the fund name is the keyboard-reachable button. */
    .perf-funds-table tbody tr { cursor: pointer; }

<script>/* __MCP_UI_TRACKER_JS__ */</script>
<script>
// Resolved from the runtime on first call: the connector display name granted at publish,
// which is not always "Carta".
let CARTA_MCP_SERVER = null;

let _mcpNsPromise = null;
// For sync render paths: null while resolving, then true/false. Unknown behaves like
// live, since each such path re-renders once enrichment settles.
let _mcpLive = null;

// Wait up to timeoutMs for window.claude to appear (guards against the race where
// the script runs before the artifact runtime installs window.claude).
function _waitForClaude(timeoutMs) {
  if (window.claude?.use) return Promise.resolve(window.claude);
  // `claude` without `.use` is a surface that never serves MCP, so don't spend the full
  // budget there — a chat viewer would sit on loading state before the degraded view.
  const budget = window.claude ? Math.min(timeoutMs, 300) : timeoutMs;
  return new Promise(resolve => {
    const id = setInterval(() => {
      if (window.claude?.use) { clearInterval(id); clearTimeout(tid); resolve(window.claude); }
    }, 20);
    const tid = setTimeout(() => { clearInterval(id); resolve(null); }, budget);
  });
}

// null = mcp not granted, not served, or failed. Null is not cached — callers may retry.
function _mcpNamespace() {
  if (_mcpNsPromise) return _mcpNsPromise;
  _mcpNsPromise = _waitForClaude(5000)
    .then(claude => claude ? claude.use("mcp") : null)
    .catch(() => null)
    .then(ns => {
      _mcpLive = !!ns;
      if (!ns) _mcpNsPromise = null; // don't cache failure — allow retry
      return ns;
    });
  return _mcpNsPromise;
}

// Gate every data path on this instead of probing window.claude members.
async function mcpAvailable() {
  return !!(await _mcpNamespace());
}

_mcpNamespace();  // start resolving at load so the sync render paths see a settled answer

// listTools() lists the manifest's connector by display name, and never prompts.
// Claude's own per-artifact servers list there too and are not the connector.
async function _cartaServer(mcp) {
  if (CARTA_MCP_SERVER) return CARTA_MCP_SERVER;
  const { servers = [] } = (await mcp.listTools()) || {};
  const carta = servers.find(s => s?.server && s.kind !== "artifact");
  if (!carta) throw Object.assign(new Error("No Carta connector is available to this page"), { code: "server_not_connected" });
  CARTA_MCP_SERVER = carta.server;
  initUiTracker("carta-fund-performance", CARTA_MCP_SERVER);
  trackUi("render", "FundPerformance.View");
  return CARTA_MCP_SERVER;
}

// Carta MCP wrapper: injects _instrumentation_v2 required since 2026-07-27
async function _mcp(tool, args) {
  const mcp = await _mcpNamespace();
  if (!mcp) throw new Error("Carta connector unavailable in this view");
  const server = await _cartaServer(mcp);
  try {
    return await mcp.callTool(
      server,
      tool,
      Object.assign({}, args, { _instrumentation_v2: { skills: ['carta-investors:carta-fund-performance'], from_ui: true } })
    );
  } catch (err) {
    // A failed tool belongs to the card that asked, so return an envelope. Connector
    // codes (needs_reauth, server_not_connected) rethrow — those are page-level.
    if (err?.code === "tool_error") return { isError: true, code: err.code, result: err.result, content: [{ type: "text", text: err.message ?? "tool error" }] };
    throw err;
  }
}

// ── Skill metadata ──
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2800);
}

// ── Wire run buttons (only those with a data-prompt attribute) ──
function inkColor(token, fallback) {
  const probe = document.createElement("span");
  probe.style.cssText = `position:absolute;visibility:hidden;color:var(${token})`;
  document.body.appendChild(probe);
  const resolved = getComputedStyle(probe).color;
  probe.remove();
  return resolved || fallback;
}
const chartLabelColor = () => inkColor("--carta-chart-label-color", "#656B6B");
// Backstop for any canvas text not given an explicit color — Chart.js otherwise
// defaults to a hardcoded #666, which is unreadable on the dark surface.
if (window.Chart) Chart.defaults.color = chartLabelColor();

function _fmtQtr(dateStr) {
  const dt = new Date(dateStr + "T00:00:00");
  return `Q${Math.ceil((dt.getMonth()+1)/3)}’${String(dt.getFullYear()).slice(2)}`;
}

// `curr` comes from FUND_REPORTING_CURRENCY. With no currency we render a bare
// number rather than a symbol, because guessing one misstates the amount.
function _fmtAmount(v, curr, opts) {
  const num = parseFloat(v);
  if (isNaN(num)) return '—';
  return new Intl.NumberFormat(undefined, curr ? { ...opts, style: 'currency', currency: curr } : opts).format(num);
}
function fmtFull(v, curr) {
  return _fmtAmount(v ?? 0, curr, { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
// Amounts the way the app's fund list writes them: compact with one decimal at most ($88.2M, $515K).
function fmtCompact(v, curr) {
  return _fmtAmount(v, curr, { notation: 'compact', maximumFractionDigits: 1 });
}

function parseDWH(res) {
  const text = unwrapEnvelope(res?.content?.[0]?.text ?? "");
  const rows = parseNdjson(text).rows;
  return rows.map(r => {
    const out = {};
    Object.keys(r).forEach(k => { out[k.toUpperCase()] = r[k]; });
    return out;
  });
}

// Tearsheet DWH queries are now run inside fetchLiveData (see below).

function parseNdjson(text) {
  const rows = [];
  let nextOffset = null;
  if (!text) return { rows, nextOffset };

  let body = text;
  const stripped = text.trimStart();
  const firstLine = stripped.split('\n')[0] || '';
  if (firstLine.startsWith('total_rows:') && text.includes('\n\n')) {
    const m = firstLine.match(/next_offset:\s*(\d+)/);
    if (m) nextOffset = parseInt(m[1], 10);
    body = text.slice(text.indexOf('\n\n') + 2);
  }

  for (const raw of body.split('\n')) {
    const line = raw.trim();
    if (!line || line.startsWith('(Result truncated')) continue;
    try {
      const obj = JSON.parse(line);
      if (obj && typeof obj === 'object' && !Array.isArray(obj)) rows.push(obj);
    } catch (e) {
      console.warn('parseNdjson: skipping malformed line', e);
    }
  }
  return { rows, nextOffset };
}
function escHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// A dotted label that shows `text` in the shared #perf-tip tooltip; callers escape `body`.
const _perfTip = (text, body, extraClass = '') =>
  `<button type="button" class="${extraClass ? extraClass + ' ' : ''}tooltip-trigger" aria-describedby="perf-tip" data-tip="${escHtml(text)}">${body}</button>`;

// ── SOI page state ──
let customizeSource = null; // 'soi' | 'perf'

const CUSTOMIZE_PROMPTS = {
  soi: {
    data: [
      "Show only investments where unrealized gain / loss is negative, sorted by largest loss first. Update the Schedule of Investments dashboard with this.",
      "Group holdings by sector and show sector-level subtotals for cost basis and current value. Update the Schedule of Investments dashboard with this.",
      "Add a 'Days held' column and sort the table by oldest investment first. Update the Schedule of Investments dashboard with this.",
    ],
    ui: [
      "Color each row green when gain/loss is positive and red when negative, with a subtle row tint. Update the Schedule of Investments dashboard with this.",
      "Add a mini sparkline column showing value trend over the last 4 quarters for each company. Update the Schedule of Investments dashboard with this.",
      "Export this table to Excel with a separate tab per fund. Update the Schedule of Investments dashboard with this.",
    ],
  },
  perf: {
    data: [
      "Show Net IRR, TVPI, and DPI for all my funds in a single side-by-side comparison table. Update the Fund Performance dashboard with this.",
      "Add a scatter plot of MOIC vs holding period for each portfolio company. Update the Fund Performance dashboard with this.",
      "Compare my fund's DPI progression against the P50 benchmark, quarter by quarter. Update the Fund Performance dashboard with this.",
    ],
    ui: [
      "Shade the area between P25 and P75 as a benchmark band behind the IRR line. Update the Fund Performance dashboard with this.",
      "Show only the last 8 quarters in each chart and add a toggle to view all time. Update the Fund Performance dashboard with this.",
      "Make the legend interactive — click a line label to show or hide that series. Update the Fund Performance dashboard with this.",
    ],
  },
};

function openCustomize(source) {
  trackUi("click", "FundPerformance.Customize.Open." + (source === "soi" ? "SOI" : "Perf"));
  customizeSource = source;
  const popover = document.getElementById('customize-popover');
  const body = document.getElementById('customize-body');
  const prompts = CUSTOMIZE_PROMPTS[source] || CUSTOMIZE_PROMPTS.soi;

  body.innerHTML = Object.entries(prompts).map(([group, items]) => `
    <div class="cust-section-label">${group === 'data' ? 'Data' : 'Layout &amp; UI'}</div>
    ${items.map(p => `
      <div class="cust-prompt-card">
        <div class="cust-prompt-text">${escHtml(p.split('. Update the ')[0] + '.')}</div>
        <button class="cust-copy-btn" data-prompt="${escHtml(p)}" onclick="copyPrompt(this)"><svg width="11" height="11" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="9" height="9" rx="1" stroke="currentColor" stroke-width="1.4"/><path d="M11 5V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Copy</button>
      </div>
    `).join('')}
  `).join('');

  popover.classList.add('open');
}

function closeCustomize() {
  const popover = document.getElementById('customize-popover');
  if (popover) popover.classList.remove('open');
}

function copyPrompt(btn) {
  trackUi("click", "FundPerformance.Customize.CopyPrompt." + (customizeSource === "perf" ? "Perf" : "SOI"));
  const text = btn.dataset.prompt || '';
  const fallback = (str) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = str;
      ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch(e) { return false; }
  };
  const feedback = () => {
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="9" height="9" rx="1" stroke="currentColor" stroke-width="1.4"/><path d="M11 5V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Copy';
      btn.classList.remove('copied');
    }, 2000);
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(feedback).catch(() => {
      fallback(text) ? feedback() : showToast('Could not copy to clipboard');
    });
  } else {
    fallback(text) ? feedback() : showToast('Could not copy to clipboard');
  }
}

document.addEventListener('click', function(e) {
  const popover = document.getElementById('customize-popover');
  if (popover?.classList.contains('open') &&
      !popover.contains(e.target) &&
      !e.target.closest('[onclick*="openCustomize"]')) {
    closeCustomize();
  }
});

// ── Fund-family roll-up ──
// Pure functions: no page, no queries. tests/carta-investors/test_fund_performance_family_rollup.py
// runs everything between the two perf-rollup markers in node.
// A family is every fund sharing a FUND_FAMILY_ID (FUND_ADMIN.FUNDS). Its dollar columns add up
// and its ratios are recomputed from those sums, never averaged. Net IRR cannot be built from
// the funds' IRRs, so a family row carries none.
// perf-rollup:start
const PERF_FAMILY_KEY = 'family:';
const PERF_LIST_ROWS = 50;
// Dollar columns that add up across a family. A column any member lacks stays empty for the
// family, so a total is never short a fund.
const PERF_SUMMED_COLS = [
  'FUND_SIZE', 'TOTAL_VALUE', 'ENDING_TOTAL_NAV', 'TOTAL_CAP_CONTRIBUTION', 'TOTAL_DISTRIBUTION',
  'TOTAL_COST_OF_INVESTMENTS', 'LP_VALUE', 'ENDING_LP_NAV', 'TOTAL_LP_CAP_CONTRIBUTION', 'TOTAL_LP_DISTRIBUTION',
  'PARTNER_COUNT',
];
// Every fund id the page puts into SQL, and the date it reads Carta's family IRR at, passes one of these first.
const _PERF_UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const _PERF_DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
// A query value as a finite number, else null.
const _perfNum = v => { const n = v == null ? NaN : parseFloat(v); return isFinite(n) ? n : null; };
// A month-end as YYYY-MM-DD. The header date, the peer chart's last quarter and a family's
// Net IRR date all read it through _perfDay and ask _perfMonthToDate whether that month is still
// running; the header and the family date also share _perfValidDays.
const _perfDay = d => String(d).substring(0, 10);
// Carta stamps the current month's figures with that month's last day, a date that
// hasn't happened yet: those figures are month to date.
const _perfMonthToDate = (d, todayIso) => _perfDay(d) > todayIso;
// The valid month-ends among `dates`, sorted and unique: the header's "As of" label and its
// "some funds report earlier" tooltip both read this one list.
const _perfValidDays = dates => [...new Set(dates.map(d => _perfDay(d || '')).filter(d => _PERF_DAY_RE.test(d)))].sort();
// The latest of them, or null: the family Net IRR date starts from it.
const _perfLatestDay = dates => _perfValidDays(dates).pop() ?? null;
const _pfSum = (rows, key) => {
  let total = 0;
  for (const r of rows) { const n = _perfNum(r[key]); if (n == null) return null; total += n; }
  return total;
};
const _pfRatio = (top, bottom) => (top != null && bottom != null && bottom > 0 ? top / bottom : null);
// Gross MOIC is value ÷ cost of investments, so each fund's value is its MOIC × its cost;
// the family's MOIC is the summed values over the summed costs.
function _pfMoic(rows) {
  let value = 0, cost = 0;
  for (const r of rows) {
    const moic = _perfNum(r.TOTAL_MOIC), c = _perfNum(r.TOTAL_COST_OF_INVESTMENTS);
    if (moic == null || c == null) return null;
    value += moic * c; cost += c;
  }
  return _pfRatio(value, cost);
}

// A fund's partners as the app's fund list counts them: its limited partners and its general partner(s).
const perfPartnerCount = r => {
  const lps = _perfNum(r.COUNT_LPS), gps = _perfNum(r.COUNT_GPS);
  return lps == null || gps == null ? null : lps + gps;
};
const perfWithPartners = r => ({ ...r, PARTNER_COUNT: perfPartnerCount(r) });

// Funds sharing a family id, for families of two or more: Map(familyId → fund rows).
function perfFamilyGroups(fundRows) {
  const groups = new Map();
  fundRows.forEach(r => {
    if (!r.FUND_FAMILY_ID) return;
    if (!groups.has(r.FUND_FAMILY_ID)) groups.set(r.FUND_FAMILY_ID, []);
    groups.get(r.FUND_FAMILY_ID).push(r);
  });
  for (const [id, rows] of groups) if (rows.length < 2) groups.delete(id);
  return groups;
}

// Amounts in different currencies never add up, so a family is rolled up only when every
// fund reports the same currency. A fund with no reporting currency matches nothing, so a
// family with one (or all) of them is not rolled up either.
const perfFamilyCurrencies = members => [...new Set(members.map(m => m.FUND_REPORTING_CURRENCY ?? null))];
const perfFamilyCombinable = members => {
  const currencies = perfFamilyCurrencies(members);
  return currencies.length === 1 && currencies[0] != null;
};

// Peer benchmark percentiles come per fund and cannot be merged across cohorts, so the
// family is benchmarked against one member's cohort: the earliest vintage (the family's
// first close, whose cohort covers every quarter the family has existed), the larger fund
// on a tie.
function perfBenchmarkFund(members) {
  const vintage = m => (m.VINTAGE_DATE ? _perfDay(m.VINTAGE_DATE) : '9999-99-99');
  return members.slice().sort((a, b) =>
    vintage(a).localeCompare(vintage(b)) || (_perfNum(b.FUND_SIZE) ?? -1) - (_perfNum(a.FUND_SIZE) ?? -1)
    || String(a.FUND_UUID).localeCompare(String(b.FUND_UUID)))[0];
}

function perfRollupFamily(members) {
  const first = members[0];
  const days = members.map(m => m.MONTH_END_DATE).filter(Boolean);
  const vintages = members.map(m => m.VINTAGE_DATE).filter(Boolean).sort();
  const row = {
    FUND_NAME: first.FUND_FAMILY_NAME || first.FUND_NAME,
    FUND_UUID: PERF_FAMILY_KEY + first.FUND_FAMILY_ID,
    FUND_FAMILY_ID: first.FUND_FAMILY_ID,
    FUND_FAMILY_NAME: first.FUND_FAMILY_NAME,
    FUND_REPORTING_CURRENCY: first.FUND_REPORTING_CURRENCY ?? null,
    MONTH_END_DATE: days.length ? days.slice().sort().pop() : null,
    VINTAGE_DATE: vintages[0] ?? null,
    // Net and gross IRR can't be added or averaged: perfLoadFamilyIrr fills in the family's
    // Net IRR later, and gross IRR stays unavailable. LP MOIC has no published formula, so it
    // can't be rebuilt from the summed columns either.
    NET_LP_IRR: null, DEAL_IRR: null, LP_MOIC: null,
    // The app leaves a family's vintage year blank: its funds have different ones.
    VINTAGE_YEAR: null,
    _family: true,
    _asOfDates: days,
    _members: members.map(m => ({ uuid: m.FUND_UUID, name: m.FUND_NAME,
                                  monthEnd: m.MONTH_END_DATE ? _perfDay(m.MONTH_END_DATE) : null })),
    _benchmarkUuid: perfBenchmarkFund(members).FUND_UUID,
    _benchmarkName: perfBenchmarkFund(members).FUND_NAME,
  };
  PERF_SUMMED_COLS.forEach(k => { row[k] = _pfSum(members, k); });
  row.LP_TVPI = _pfRatio(row.LP_VALUE, row.TOTAL_LP_CAP_CONTRIBUTION);
  row.LP_DPI = _pfRatio(row.TOTAL_LP_DISTRIBUTION, row.TOTAL_LP_CAP_CONTRIBUTION);
  row.LP_RVPI = _pfRatio(row.ENDING_LP_NAV, row.TOTAL_LP_CAP_CONTRIBUTION);
  row.TOTAL_MOIC = _pfMoic(members);
  return row;
}

// The rows the list shows, largest NAV first. view 'family': each family of two or more funds
// becomes one row (a family whose funds do not all report one currency stays as its funds and
// is named in notices); every other fund stays as itself. view 'fund': the funds as queried.
function perfGroupEntities(fundRows, view) {
  const notices = [];
  let entities = fundRows.slice();
  if (view === 'family') {
    const groups = perfFamilyGroups(fundRows);
    const done = new Set();
    entities = [];
    for (const r of fundRows) {
      const members = groups.get(r.FUND_FAMILY_ID);
      if (!members) { entities.push(r); continue; }
      if (done.has(r.FUND_FAMILY_ID)) continue;
      done.add(r.FUND_FAMILY_ID);
      if (perfFamilyCombinable(members)) entities.push(perfRollupFamily(members));
      else {
        notices.push({ familyName: r.FUND_FAMILY_NAME, currencies: perfFamilyCurrencies(members).filter(Boolean) });
        entities.push(...members);
      }
    }
  }
  const nav = e => _perfNum(e.ENDING_TOTAL_NAV);
  entities.sort((a, b) => (nav(a) == null) - (nav(b) == null) || (nav(b) ?? 0) - (nav(a) ?? 0));
  return { entities: entities.slice(0, PERF_LIST_ROWS), notices };
}

// Quarter helpers on YYYY-MM-DD strings (no Date, so no time-zone drift).
function _pfQuarterStart(day) {
  const month = parseInt(day.substring(5, 7), 10);
  return `${day.substring(0, 4)}-${String(Math.floor((month - 1) / 3) * 3 + 1).padStart(2, '0')}-01`;
}
// The last day of the quarter a day falls in.
function _pfQuarterEnd(day) {
  const start = _pfQuarterStart(day);
  const y = parseInt(start.substring(0, 4), 10), m = parseInt(start.substring(5, 7), 10);
  return new Date(Date.UTC(y, m + 2, 0)).toISOString().substring(0, 10);
}

// The family's quarterly LP TVPI and DPI. A fund's quarterly ratio is its LP value (or LP
// distributions) over its LP paid-in capital, so the family's is the funds' ratios weighted by
// each fund's LP paid-in at that quarter-end: the pooled value over the pooled paid-in.
// `memberRows` are the funds' rows of the quarterly benchmark table, `paidIn` their LP paid-in
// at quarter-ends. A fund with no paid-in yet adds nothing; one with paid-in but no ratio or no
// weight leaves that quarter empty, so a fund is never silently left out. Gross MOIC would need
// each fund's cost by quarter, which the warehouse does not keep, so a family has none.
function perfFamilySeries(memberRows, paidIn, memberUuids, todayIso) {
  const byFundQuarter = (rows, field) => new Map(rows.filter(r => r[field]).map(r => [`${r.FUND_UUID}|${_pfQuarterStart(_perfDay(r[field]))}`, r]));
  const ratios = byFundQuarter(memberRows, 'PERFORMANCE_QUARTER_START_DATE');
  const capital = byFundQuarter(paidIn, 'MONTH_END_DATE');
  const quarters = [...new Set(memberRows
    .filter(r => memberUuids.includes(r.FUND_UUID) && r.PERFORMANCE_QUARTER_START_DATE)
    .map(r => _pfQuarterStart(_perfDay(r.PERFORMANCE_QUARTER_START_DATE))))]
    .sort().filter(q => _pfQuarterEnd(q) <= todayIso);
  const pooled = (q, key) => {
    let value = 0, weight = 0;
    for (const uuid of memberUuids) {
      const w = _perfNum((capital.get(`${uuid}|${q}`) || {}).LP_PAID_IN);
      const ratio = _perfNum((ratios.get(`${uuid}|${q}`) || {})[key]);
      if (w === 0 || (w == null && ratio == null)) continue;
      if (w == null || w < 0 || ratio == null) return null;
      value += ratio * w; weight += w;
    }
    return weight > 0 ? value / weight : null;
  };
  // Dated by quarter-end, as the warehouse dates its rows, so a family's line shares the graph's axis with the funds'.
  return quarters.map(q => ({ PERFORMANCE_QUARTER_START_DATE: _pfQuarterEnd(q), LP_TVPI: pooled(q, 'LP_TVPI'), LP_DPI: pooled(q, 'LP_DPI'), MOIC: null }));
}

// Benchmark-table columns of a peer cohort and of a fund's own row. A family takes the cohort
// columns (percentiles, size of the cohort) from its benchmark fund, and has no own Net IRR
// figures of its own until Carta's are read in (perfFamilyBenchmarkRows).
const PERF_PEER_COLS = ['NET_LP_IRR_25TH', 'NET_LP_IRR_50TH', 'NET_LP_IRR_75TH', 'LP_TVPI_25', 'LP_TVPI_50', 'LP_TVPI_75',
  'LP_DPI_25', 'LP_DPI_50', 'LP_DPI_75', 'MOIC_25', 'MOIC_50', 'MOIC_75'];
const PERF_COHORT_COLS = ['VINTAGE_YEAR', 'ENTITY_TYPE_NAME', 'FUND_AUM_BUCKET', 'FUND_COUNT'];
const PERF_OWN_IRR_COLS = ['NET_LP_IRR', 'NET_IRR'];

// The family's series in the shape of benchmark-table rows, so the charts read it like a fund's:
// each quarter carries the benchmark fund's percentiles for the same quarter and, when Carta's
// family Net IRR for it is known (`netIrrByQuarter`: quarter start -> percent), that figure.
function perfFamilyBenchmarkRows(key, series, benchmarkRows, netIrrByQuarter) {
  const peers = new Map(benchmarkRows.filter(r => r.PERFORMANCE_QUARTER_START_DATE)
    .map(r => [_pfQuarterStart(_perfDay(r.PERFORMANCE_QUARTER_START_DATE)), r]));
  const last = benchmarkRows[benchmarkRows.length - 1] || {};
  return series.map(s => {
    const quarter = _pfQuarterStart(_perfDay(s.PERFORMANCE_QUARTER_START_DATE));
    const peer = peers.get(quarter) || {};
    const row = { FUND_UUID: key, ...s };
    PERF_OWN_IRR_COLS.forEach(k => { row[k] = null; });
    row.NET_LP_IRR = netIrrByQuarter.get(quarter) ?? null;
    PERF_PEER_COLS.forEach(k => { row[k] = peer[k] ?? null; });
    PERF_COHORT_COLS.forEach(k => { row[k] = last[k] ?? null; });
    return row;
  });
}

// The quarter-end dates Carta's family Net IRR is read for: each quarter of the series, newest
// `limit` of them.
const perfFamilyIrrDates = (series, limit) => series.map(s => _pfQuarterEnd(s.PERFORMANCE_QUARTER_START_DATE)).slice(-limit);
// ── A family's LP Net IRR ──
// IRRs can't be added or averaged, so the family's is Carta's own: fund-admin pools every member
// fund's cash flows into one figure (fa:get:fund-irr with family: true on any member fund), the
// same one the app's fund list shows on the family row.

// The date Carta's family figure is read at: the latest month-end the funds report through, or
// today when that month is still running, so it matches the app on the day it is opened.
function perfFamilyIrrAsOf(members, todayIso) {
  const last = _perfLatestDay(members.map(m => m.monthEnd));
  return last && _perfMonthToDate(last, todayIso) ? todayIso : last;
}

// A connector result's text with its {"result": "<payload>"} envelope removed: the one place the
// envelope is defined, for warehouse rows (parseDWH) and fund-admin reads alike.
function unwrapEnvelope(text) {
  const s = (text || '').trimStart();
  if (!s.startsWith('{')) return text;
  try { const o = JSON.parse(s); if (o && typeof o.result === 'string') return o.result; } catch (_) {}
  return text;
}

// The JSON object a connector tool answered with, or null. FastMCP sends a string result as
// content text and again as structuredContent.result, so the payload is always text: the content
// text, else that string. The structuredContent object itself is only its wrapper, never the answer.
function _perfToolJson(res) {
  if (!res || res.isError) return null;
  const parse = t => { try { return JSON.parse(t); } catch (_) { return null; } };
  const texts = (Array.isArray(res.content) ? res.content : []).filter(c => c && c.type === 'text').map(c => c.text);
  if (res.structuredContent && typeof res.structuredContent.result === 'string') texts.push(res.structuredContent.result);
  for (const v of texts.map(t => parse(unwrapEnvelope(t)))) {
    if (v && typeof v === 'object') return v;
  }
  return null;
}

// The family's Carta id from fa:get:fund-irr's answer, or null: the quarter-by-quarter reads name
// the family by it instead of asking carta-mcp to find it from a fund each time.
function perfFamilyCartaPk(res) {
  const pk = (_perfToolJson(res) || {}).fund_family_carta_pk;
  return Number.isInteger(pk) && pk > 0 ? pk : null;
}

// fa:get:fund-irr's net_irr is a fraction as a string ("0.1674"); the page holds percent.
function perfFamilyIrrFromCarta(res) {
  const irr = _perfNum((_perfToolJson(res) || {}).net_irr);
  return irr == null ? null : Math.round(irr * 1e6) / 1e4;
}

// Every benchmark-table column a fund or family page reads, for the queries to select.
const PERF_BENCH_COLS = ['PERFORMANCE_QUARTER_START_DATE', 'LP_TVPI', 'LP_DPI', 'MOIC',
  ...PERF_OWN_IRR_COLS, ...PERF_PEER_COLS, ...PERF_COHORT_COLS].join(', ');
// perf-rollup:end

// ── Fund Performance page ──
let perfFunds = [];
let perfCurrentFundUuid = null;
// Funds roll up into their fund family by default; 'fund' lists the underlying funds.
const PERF_VIEWS = { family: { label: 'Fund family' }, fund: { label: 'Underlying funds' } };
let _perfView = 'family';
let _perfFundRows = [];        // one row per underlying fund, as queried
let _perfEntities = new Map(); // key (fund uuid, or family:<id>) → the row the list shows

function _perfShowListView() {
  document.getElementById('perf-page').scrollTop = 0;
  document.getElementById('perf-list-view').style.display = 'block';
  document.getElementById('perf-detail-view').style.display = 'none';
  perfCurrentFundUuid = null;
  perfRenderFundSwitcher();
  _perfSetAsOf(_perfListAsOf);
  perfLoadAllFunds();
}

function perfOpenFundDetail(uuid, name) {
  trackUi("click", "FundPerformance.FundRow.Open");
  document.getElementById('perf-page').scrollTop = 0;
  document.getElementById('perf-list-view').style.display = 'none';
  document.getElementById('perf-detail-view').style.display = 'block';
  perfCurrentFundUuid = uuid;
  if (!perfFunds.some(f => f.uuid === uuid)) perfFunds.push({ uuid, name });
  perfRenderFundSwitcher();
  perfLoadFund(uuid);
}

// "As of" in the header: the month-end the figures on screen run through. In the list,
// funds can report through different month-ends, so it names the latest and says so.
let _perfListAsOf = [];
const _perfToday = () => new Date().toISOString().substring(0, 10);
function _perfFmtDate(d, opts = { month: 'short', day: 'numeric', year: 'numeric' }) {
  const dt = new Date(_perfDay(d) + 'T00:00:00');
  return isNaN(dt) ? null : dt.toLocaleDateString('en-US', opts);
}
function _perfSetAsOf(dates) {
  const el = document.getElementById('perf-as-of');
  if (!el) return;
  const days = _perfValidDays(dates);
  const lastDay = days[days.length - 1] ?? null;
  const latest = lastDay ? _perfFmtDate(lastDay) : null;
  if (!latest) { el.innerHTML = ''; return; }
  const label = _perfMonthToDate(lastDay, _perfToday())
    ? `As of ${_perfFmtDate(lastDay, { month: 'short', year: 'numeric' })}, month to date`
    : `As of ${latest}`;
  el.innerHTML = days.length > 1
    ? _perfTip('Latest month-end; some funds report earlier.', escHtml(label))
    : escHtml(label);
}

// ── Fund switcher: SOI's "Fund <name>" combobox, listing the firm's funds. Getting
// back to the list is the "← All funds" link's job, not an option here. ──
const PERF_CHEVRON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const PERF_CHECK = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// SOI adds a search box once the list is long enough to need one.
const PERF_COMBO_SEARCH_THRESHOLD = 8;
let _perfComboQuery = '';

function _perfComboItems() {
  const q = _perfComboQuery.trim().toLowerCase();
  const funds = perfFunds.filter(f => !q || String(f.name).toLowerCase().includes(q));
  return funds;
}

function perfRenderFundSwitcher() {
  const mount = document.getElementById('perf-fund-combo');
  if (!mount) return;
  const current = perfFunds.find(f => f.uuid === perfCurrentFundUuid);
  mount.innerHTML = `
    <button type="button" class="combo-trigger" id="perf-fund-combo-trigger" aria-haspopup="listbox" aria-expanded="false"
            aria-labelledby="perf-fund-switcher-label perf-fund-combo-trigger">
      <span class="combo-trigger-value" title="${escHtml(current ? current.name : 'All funds')}">${escHtml(current ? current.name : 'All funds')}</span>
      <span class="combo-chevron">${PERF_CHEVRON}</span>
    </button>
    <div class="combo-panel" id="perf-fund-combo-panel" hidden>
      ${perfFunds.length >= PERF_COMBO_SEARCH_THRESHOLD ? `
      <div class="combo-search-wrap">
        <input type="text" class="combo-search" id="perf-fund-combo-search" placeholder="Search funds…" autocomplete="off" aria-controls="perf-fund-combo-list">
      </div>` : ''}
      <ul class="combo-list" role="listbox" id="perf-fund-combo-list" tabindex="-1" aria-labelledby="perf-fund-switcher-label"></ul>
    </div>`;
  // The firm's name shows on the list; on a fund the same slot links back to all funds.
  const firm = document.getElementById('perf-firm-name-label');
  const back = document.getElementById('perf-all-funds-link');
  if (firm) firm.hidden = !!current;
  if (back) back.hidden = !current;
}

function _perfRenderComboList() {
  const list = document.getElementById('perf-fund-combo-list');
  if (!list) return;
  const items = _perfComboItems();
  const selected = perfCurrentFundUuid || '';
  list.innerHTML = items.length ? items.map((f, i) => `
    <li class="combo-option" role="option" id="perf-fund-opt-${i}" data-uuid="${escHtml(f.uuid)}" aria-selected="${f.uuid === selected}">
      <span class="combo-check">${PERF_CHECK}</span><span class="combo-option-label" title="${escHtml(f.name)}">${escHtml(f.name)}</span>
    </li>`).join('') : '<li class="combo-empty">No funds match</li>';
}

function _perfComboOpen() {
  const panel = document.getElementById('perf-fund-combo-panel');
  if (!panel || !panel.hidden) return;
  _perfComboQuery = '';
  panel.hidden = false;
  document.getElementById('perf-fund-combo-trigger').setAttribute('aria-expanded', 'true');
  _perfRenderComboList();
  const opts = [...panel.querySelectorAll('.combo-option')];
  _perfComboSetActive(Math.max(0, opts.findIndex(o => o.getAttribute('aria-selected') === 'true')));
  (document.getElementById('perf-fund-combo-search') || document.getElementById('perf-fund-combo-list')).focus();
}

function _perfComboClose(refocus) {
  const panel = document.getElementById('perf-fund-combo-panel');
  if (!panel || panel.hidden) return;
  panel.hidden = true;
  const trigger = document.getElementById('perf-fund-combo-trigger');
  trigger.setAttribute('aria-expanded', 'false');
  if (refocus) trigger.focus();
}

function _perfComboSetActive(i) {
  const list = document.getElementById('perf-fund-combo-list');
  const opts = [...list.querySelectorAll('.combo-option')];
  opts.forEach((o, j) => o.classList.toggle('active', j === i));
  if (opts[i]) { list.setAttribute('aria-activedescendant', opts[i].id); opts[i].scrollIntoView({ block: 'nearest' }); }
}

function _perfComboPick(uuid) {
  _perfComboClose(false);
  trackUi("change", "FundPerformance.FundSelect");
  const f = perfFunds.find(x => x.uuid === uuid);
  if (f) perfOpenFundDetail(f.uuid, f.name);
  // Navigation re-renders the switcher, so focus the trigger that exists now.
  document.getElementById('perf-fund-combo-trigger')?.focus();
}

(function wireFundSwitcher() {
  const mount = document.getElementById('perf-fund-combo');
  if (!mount) return;
  mount.addEventListener('click', e => {
    if (e.target.closest('.combo-trigger')) {
      const panel = document.getElementById('perf-fund-combo-panel');
      if (panel.hidden) _perfComboOpen(); else _perfComboClose(true);
      return;
    }
    const opt = e.target.closest('.combo-option');
    if (opt) _perfComboPick(opt.dataset.uuid);
  });
  mount.addEventListener('input', e => {
    if (!e.target.classList.contains('combo-search')) return;
    _perfComboQuery = e.target.value;
    _perfRenderComboList();
    _perfComboSetActive(0);
  });
  mount.addEventListener('keydown', e => {
    const panel = document.getElementById('perf-fund-combo-panel');
    if (e.target.closest('.combo-trigger') && panel.hidden) {
      if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); _perfComboOpen(); }
      return;
    }
    if (panel.hidden) return;
    const opts = [...panel.querySelectorAll('.combo-option')];
    const i = opts.findIndex(o => o.classList.contains('active'));
    if (e.key === 'ArrowDown') { e.preventDefault(); _perfComboSetActive(Math.min(opts.length - 1, i + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); _perfComboSetActive(Math.max(0, i - 1)); }
    else if (e.key === 'Enter') { e.preventDefault(); if (opts[i]) _perfComboPick(opts[i].dataset.uuid); }
    else if (e.key === 'Escape') { e.preventDefault(); _perfComboClose(true); }
    else if (e.key === 'Tab') _perfComboClose(false);
  });
  document.addEventListener('click', e => { if (!e.target.closest?.('#perf-fund-combo')) _perfComboClose(false); });
  document.getElementById('perf-all-funds-link')?.addEventListener('click', () => {
    trackUi("click", "FundPerformance.AllFunds");
    _perfShowListView();
    // The link hides on the list, so keep keyboard focus on the page's next control.
    document.getElementById('perf-fund-combo-trigger')?.focus();
  });
})();

let _perfAllFundsLoaded = false;
let _firmContextSet = false;
let _perfFirmName = null;    // shown above the page title, as on the Schedule of Investments

async function ensureFirmContext() {
  if (_firmContextSet) return;
  try {
    const r = await _mcp("list_contexts", {});
    let firmId, firmName;
    const sc = r?.structuredContent;
    if (sc?.firms?.length) {
      const active = sc.firms.find(f => f.is_active) ?? sc.firms[0];
      firmId = active.firm_id;
      firmName = active.firm_name;
    } else {
      try {
        const parsed = JSON.parse(r?.content?.[0]?.text ?? '');
        firmId = parsed?.active_firm_id ?? parsed?.firms?.[0]?.firm_id;
      } catch (_) {}
    }
    if (firmName) _perfFirmName = firmName;
    if (firmId) {
      await _mcp("set_context", { firm_id: firmId });
      _firmContextSet = true;
    }
  } catch (e) {
    console.warn('[perf] ensureFirmContext failed:', e);
  }
}

// The list view's loading state: the graph card's frame and a table of shimmer bones,
// sized like the loaded page so nothing jumps when the data lands.
const PERF_CONTROLS_BONE = '<div class="shimmer-bone" style="height:28px;width:420px;max-width:100%;"></div>';
const PERF_LEGEND_BONE = '<div class="shimmer-bone" style="height:14px;width:220px;margin:0 0 8px;"></div><div class="shimmer-bone" style="height:26px;width:480px;max-width:100%;"></div>';
function _perfListSkeleton() {
  const row = cls => `<div class="${cls}">${'<div class="shimmer-bone shimmer-td"></div>'.repeat(6)}</div>`;
  return `
    <section class="perf-chart-card perf-overview-card" aria-busy="true" aria-label="Loading fund performance">
      <div class="perf-chart-header"><div class="shimmer-bone" style="height:20px;width:180px;margin:2px 0;"></div></div>
      <div class="perf-overview-controls">${PERF_CONTROLS_BONE}</div>
      <div class="perf-overview-legend">${PERF_LEGEND_BONE}</div>
      <div class="perf-chart-wrap tall"><div class="shimmer-bone perf-chart-bone"></div></div>
    </section>
    <div class="shimmer-table">${row('shimmer-table-header').replace(/shimmer-td/g, 'shimmer-th')}${row('shimmer-row').repeat(6)}</div>`;
}

// Every column the fund page reads from a fund's latest month-end row: the list needs them
// all so a family's row (and its detail page) can be summed from its funds' rows.
const PERF_SNAPSHOT_COLS = `MONTH_END_DATE, FUND_REPORTING_CURRENCY,
          FUND_SIZE, TOTAL_MOIC, NET_LP_IRR, LP_DPI,
          TOTAL_VALUE, ENDING_TOTAL_NAV, TOTAL_CAP_CONTRIBUTION, TOTAL_DISTRIBUTION,
          TOTAL_COST_OF_INVESTMENTS, DEAL_IRR, VINTAGE_DATE, VINTAGE_YEAR, COUNT_LPS, COUNT_GPS,
          LP_TVPI, LP_RVPI, LP_MOIC,
          LP_VALUE, ENDING_LP_NAV, TOTAL_LP_CAP_CONTRIBUTION, TOTAL_LP_DISTRIBUTION`;
// Fund rows are grouped into families before the list is cut to PERF_LIST_ROWS, so the
// query reads past that. It returns family funds first, so this limit can only ever drop
// standalone funds and never splits a family.
const PERF_FUND_QUERY_LIMIT = 500;

// One row per fund (its latest month-end), with its family from FUND_ADMIN.FUNDS.
function _perfFundListSql(withFamily) {
  if (!withFamily) {
    return `SELECT
          FUND_NAME, FUND_UUID, ${PERF_SNAPSHOT_COLS}
        FROM FUND_ADMIN.AGGREGATE_FUND_METRICS
        WHERE FUND_UUID IS NOT NULL
        QUALIFY ROW_NUMBER() OVER (PARTITION BY FUND_UUID ORDER BY MONTH_END_DATE DESC NULLS LAST) = 1
        ORDER BY ENDING_TOTAL_NAV DESC NULLS LAST`;
  }
  const cols = PERF_SNAPSHOT_COLS.split(',').map(c => 'm.' + c.trim()).join(', ');
  return `SELECT
          m.FUND_NAME, m.FUND_UUID, f.FUND_FAMILY_ID, f.FUND_FAMILY_NAME, ${cols}
        FROM FUND_ADMIN.AGGREGATE_FUND_METRICS m
        LEFT JOIN FUND_ADMIN.FUNDS f ON f.FUND_UUID = m.FUND_UUID
        WHERE m.FUND_UUID IS NOT NULL
        QUALIFY ROW_NUMBER() OVER (PARTITION BY m.FUND_UUID ORDER BY m.MONTH_END_DATE DESC NULLS LAST) = 1
        ORDER BY (f.FUND_FAMILY_ID IS NULL), m.ENDING_TOTAL_NAV DESC NULLS LAST`;
}

// One promise per family key, made on first ask and shared by every later caller, so a family is read
// once however often the views are switched.
const _perfOncePerFamily = (cache, family, load) => {
  if (!cache.has(family.FUND_UUID)) cache.set(family.FUND_UUID, load());
  return cache.get(family.FUND_UUID);
};

// key (family:<id>) → Promise of { irr, pk } (the family's Net IRR in percent and its Carta id) or null.
const _perfFamilyIrr = new Map();
// The fields a family row carries once Carta has answered: its Net IRR, or null.
const _perfFamilyIrrState = irr => ({ NET_LP_IRR: irr, _irrPending: false });
// One read of the family's Net IRR through any member fund; a failure leaves the family at N/A
// rather than retrying.
function perfLoadFamilyCarta(family) {
  return _perfOncePerFamily(_perfFamilyIrr, family, async () => {
    const asOf = perfFamilyIrrAsOf(family._members, _perfToday());
    const member = family._members.find(m => _PERF_UUID_RE.test(m.uuid || ''));
    if (!asOf || !member) return null;
    try {
      const res = await _mcp('fetch', {
        command: 'fa:get:fund-irr', params: { as_of_date: asOf, fund_uuid: member.uuid, family: true },
      });
      return { irr: perfFamilyIrrFromCarta(res), pk: perfFamilyCartaPk(res) };
    } catch (_) { return null; }
  });
}
const perfLoadFamilyIrr = family => perfLoadFamilyCarta(family).then(carta => (carta ? carta.irr : null));

// The family's Net IRR at each quarter-end of its series (Carta's figure, as for today's), newest
// PERF_FAMILY_IRR_QUARTERS quarters, a few reads at a time. Resolves to Map(quarter start -> percent);
// a quarter Carta can't answer is left out, and without the family's Carta id the map is empty.
const PERF_FAMILY_IRR_QUARTERS = 40;
const PERF_FAMILY_IRR_PARALLEL = 4;
const _perfFamilyIrrHistory = new Map();
function perfLoadFamilyIrrHistory(family, series) {
  return _perfOncePerFamily(_perfFamilyIrrHistory, family, async () => {
    const byQuarter = new Map();
    const carta = await perfLoadFamilyCarta(family);
    if (!carta || !carta.pk) return byQuarter;
    const dates = perfFamilyIrrDates(series, PERF_FAMILY_IRR_QUARTERS);
    let next = 0;
    const worker = async () => {
      while (next < dates.length) {
        const date = dates[next++];
        try {
          const irr = perfFamilyIrrFromCarta(await _mcp('fetch', {
            command: 'fa:get:fund-irr', params: { as_of_date: date, fund_family_carta_pk: carta.pk },
          }));
          if (irr != null) byQuarter.set(_pfQuarterStart(date), irr);
        } catch (_) { /* this quarter stays empty */ }
      }
    };
    await Promise.all(Array.from({ length: Math.min(PERF_FAMILY_IRR_PARALLEL, dates.length) }, worker));
    return byQuarter;
  });
}

// Fills a family row's Net IRR once Carta has answered, and redraws the table if it still shows that row.
function _perfFillFamilyIrr(family) {
  family._irrPending = true;
  perfLoadFamilyIrr(family).then(irr => {
    Object.assign(family, _perfFamilyIrrState(irr));
    const body = document.getElementById('perf-funds-tbody');
    if (body && _perfTableRows.includes(family)) body.innerHTML = _perfFundRowsHtml(perfSortRows(_perfTableRows, _perfSort.key, _perfSort.dir));
  });
}

// Draws the list for the current view from the funds already queried: the switcher, the
// graph and the table all read the same rows.
function _perfRenderList(listEl) {
  const { entities, notices } = perfGroupEntities(_perfFundRows, _perfView);
  entities.filter(e => e._family).forEach(_perfFillFamilyIrr);
  _perfEntities = new Map(entities.map(e => [e.FUND_UUID, e]));
  perfFunds = entities.map(e => ({ name: e.FUND_NAME, uuid: e.FUND_UUID }));
  _perfListAsOf = entities.flatMap(e => e._asOfDates || [e.MONTH_END_DATE]);
  _perfSetAsOf(_perfListAsOf);
  _perfAllFundsLoaded = true;
  _perfRenderViewToggle();
  perfRenderFundSwitcher();
  _perfRenderFundsTable(entities, listEl, notices);
  perfLoadOverviewChart(entities);
}

// "View: Fund family | Underlying funds", shown only when the firm has a family to roll up.
function _perfRenderViewToggle() {
  const el = document.getElementById('perf-view-toggle');
  if (!el) return;
  el.hidden = perfFamilyGroups(_perfFundRows).size === 0;
  el.innerHTML = `<span class="fund-switcher-label">View</span>
    <div class="perf-seg" role="radiogroup" aria-label="View">${_perfSegButtons(PERF_VIEWS, 'view')}</div>`;
  el.querySelectorAll('.perf-seg-btn').forEach(b => b.setAttribute('aria-checked', String(b.dataset.value === _perfView)));
}

document.getElementById('perf-view-toggle')?.addEventListener('click', e => {
  const btn = e.target.closest('.perf-seg-btn');
  if (!btn || btn.dataset.value === _perfView || !_perfFundRows.length) return;
  _perfView = btn.dataset.value;
  trackUi("change", "FundPerformance.View." + _perfView);
  // A family has no counterpart in the other view, so the toggle always lands on the list.
  _perfShowListView();
  _perfRenderList(document.getElementById('perf-list-view'));
  document.querySelector(`#perf-view-toggle .perf-seg-btn[data-value="${_perfView}"]`)?.focus();
});

async function perfLoadAllFunds() {
  const listEl = document.getElementById('perf-list-view');
  if (!listEl) return;
  if (_perfAllFundsLoaded && listEl.querySelector('table.perf-funds-table')) return;
  listEl.innerHTML = _perfListSkeleton();
  if (!(await mcpAvailable())) {
    listEl.innerHTML = '<div class="perf-list-status">Live data not available in preview mode.</div>';
    return;
  }
  await ensureFirmContext();
  const eyebrow = document.getElementById('perf-firm-name-label');
  if (eyebrow && _perfFirmName) eyebrow.textContent = _perfFirmName;
  try {
    // The family columns come from FUND_ADMIN.FUNDS. If that query is refused the page
    // falls back to the plain fund query, where every fund is its own row.
    for (const withFamily of [true, false]) {
      const rows = ((await _perfQueryRows(_perfFundListSql(withFamily), PERF_FUND_QUERY_LIMIT)) || []).filter(row => row.FUND_UUID).map(perfWithPartners);
      if (rows.length > 0) {
        _perfFundRows = rows;
        _perfRenderList(listEl);
        return;
      }
    }
  } catch (_) {}
  listEl.innerHTML = '<div class="perf-list-status">No performance data available.</div>';
}

// One format per measure for the whole page: the funds table, both charts' tooltips and
// axes, and the fund's detail table all call these.
// Multiples (TVPI, DPI, RVPI, MOIC): two decimals in figures, one on chart axes.
const _perfMultiple = { fmt: v => v.toFixed(2) + 'x', tick: v => v.toFixed(1) + 'x' };
// A table cell's multiple, from the raw query value.
