const _perfMultipleCell = v => { const n = _perfNum(v); return n != null ? _perfMultiple.fmt(n) : '—'; };
// Net IRR, in percent: two decimals as the app shows it, + on gains (Ink rule 6), exact zero unsigned.
const _perfIrr = n => `${n > 0 ? '+' : ''}${n.toFixed(2)}%`;
// A table cell's Net IRR, from the raw query value.
const _perfIrrCell = v => { const n = _perfNum(v); return n != null ? _perfIrr(n) : '—'; };
// The same with the feedback colour of the funds table: green on a gain, red on a loss, neutral at
// exact zero or when missing.
const _perfIrrToned = v => {
  const n = _perfNum(v), txt = _perfIrrCell(v);
  return n == null || n === 0 ? txt : `<span class="${n > 0 ? 'gl-pos' : 'gl-neg'}">${txt}</span>`;
};

// A table cell's whole number (a year, a count), from the raw query value.
const _perfWholeCell = v => { const n = _perfNum(v); return n != null ? String(n) : '—'; };
const _perfCompactCell = (v, row) => (v != null ? fmtCompact(v, row && row.FUND_REPORTING_CURRENCY) : '—');

const _PERF_COLS = [
  // Net IRR is signed, so it carries the positive/negative feedback color, a family's too.
  { key: 'NET_LP_IRR',           label: 'Net IRR',              group: 'returns', pinned: true,
    fmt: (v, row) => (row && row._family ? _perfFamilyIrrHtml(row, v, _perfIrrToned) : _perfIrrToned(v)),
    tip: 'Annualized return to LPs from contributions, distributions and current NAV, net of carry.' },
  { key: 'LP_TVPI',              label: 'TVPI (LP only)',       group: 'returns', fmt: _perfMultipleCell, tip: 'LPs\' total value (distributions + NAV) ÷ LPs\' capital paid in.' },
  { key: 'LP_DPI',               label: 'DPI (LP only)',        group: 'returns', fmt: _perfMultipleCell, tip: 'Distributions to LPs ÷ LPs\' capital paid in.' },
  { key: 'LP_RVPI',              label: 'RVPI (LP only)',       group: 'returns', fmt: _perfMultipleCell, tip: 'LPs\' NAV ÷ LPs\' capital paid in.' },
  { key: 'TOTAL_MOIC',           label: 'MOIC',                 group: 'returns', fmt: _perfMultipleCell, tip: 'Gross total value ÷ invested capital, before fees and carry.' },
  { key: 'TOTAL_VALUE',          label: 'Total value',          group: 'capital', fmt: (v, row) => v != null ? fmtFull(parseFloat(v), row && row.FUND_REPORTING_CURRENCY) : '—',        tip: 'Distributions to date + NAV.' },
  { key: 'ENDING_TOTAL_NAV',     label: 'NAV',                  group: 'capital', fmt: (v, row) => v != null ? fmtFull(parseFloat(v), row && row.FUND_REPORTING_CURRENCY) : '—',        tip: 'Assets minus liabilities (ending partners\' capital).' },
  { key: 'TOTAL_CAP_CONTRIBUTION',label: 'Contributions',        group: 'capital', fmt: (v, row) => v != null ? fmtFull(parseFloat(v), row && row.FUND_REPORTING_CURRENCY) : '—',        tip: 'Capital called from investors, counted on the call due date.' },
  { key: 'TOTAL_DISTRIBUTION',   label: 'Distributions',        group: 'capital', fmt: (v, row) => v != null ? fmtFull(parseFloat(v), row && row.FUND_REPORTING_CURRENCY) : '—',        tip: 'Cash and in-kind returned to investors.' },
  // As the app's fund list: a family's vintage year is blank, its partners and size add up.
  { key: 'VINTAGE_YEAR',         label: 'Vintage year',         group: 'fund',    fmt: _perfWholeCell, tip: "The year of the fund's vintage. A fund family has none: its funds have different ones." },
  { key: 'PARTNER_COUNT',        label: 'Partners',             group: 'fund',    fmt: _perfWholeCell, tip: 'Limited partners plus the general partner(s).' },
  { key: 'FUND_SIZE',            label: 'Total size',           group: 'capital', fmt: _perfCompactCell, tip: 'Capital partners have committed (the fund\'s total size).' },
];
// See perfLoadFamilyIrr for where a family's Net IRR comes from.
const PERF_FAMILY_IRR_REASON = "Net IRR can't be added or averaged across funds, so a family's is Carta's own figure for the family, pooled from every fund's cash flows. It reads N/A when Carta can't provide it.";
const PERF_FAMILY_IRR_SHOWN_TIP = "Carta's Net IRR for the whole family, pooled from every fund's cash flows: the figure the app's fund list shows on the family row.";
// A family row's Net IRR as every surface draws it: a placeholder while Carta is asked,
// then Carta's figure, or N/A. `v` is the figure the surface would show.
// `render` writes the figure: plain by default, coloured in the funds table.
function _perfFamilyIrrHtml(row, v, render = _perfIrrCell) {
  if (row._irrPending) return '<span class="shimmer-bone shimmer-val"></span>';
  return _perfNum(v) == null ? _perfTip(PERF_FAMILY_IRR_TIP, 'N/A') : _perfTip(PERF_FAMILY_IRR_SHOWN_TIP, render(v));
}
// The overview graph draws no Net IRR line for a family: Carta's quarterly figures for it are read on its own page.
const PERF_FAMILY_IRR_HISTORY = "The graph has no Net IRR line for a fund family; open the family to chart its Net IRR by quarter.";
const PERF_FAMILY_METHOD = 'Dollar amounts, total size and partner counts are added together; TVPI, DPI, RVPI and MOIC are recalculated from the combined amounts. A family has no vintage year.';
// What the family's charts are built from.
const PERF_FAMILY_CHARTS = "TVPI and DPI by quarter combine the funds' own figures, weighted by their LP paid-in capital; Net IRR by quarter is Carta's figure for the family at each quarter-end.";
const PERF_FAMILY_MOIC = "MOIC by quarter can't be combined across funds: it needs each fund's cost by quarter, which isn't kept. The family's current MOIC is in the table above.";
const PERF_FAMILY_IRR_TIP = PERF_FAMILY_IRR_REASON + " Switch to Underlying funds to see each fund's Net IRR.";
// A measure's name, as the funds table heads its column.
const _perfColLabel = key => _PERF_COLS.find(c => c.key === key).label;

// ── Sortable all-funds table (Ink's sortable Table) ──
// A header click cycles none → ascending → descending → none; "none" is the order the
// query returns (largest NAV first). Funds with no value sort last either way.
let _perfSort = { key: null, dir: 'none' };
let _perfTableRows = [];
const PERF_SORT_ICON = '<svg class="perf-sort-icon" width="10" height="14" viewBox="0 0 10 14" aria-hidden="true" focusable="false"><path class="perf-sort-asc" d="M5 1L9 6H1Z"/><path class="perf-sort-desc" d="M5 13L1 8H9Z"/></svg>';

function perfSortRows(rows, key, dir) {
  if (!key || dir === 'none') return rows.slice();
  const sign = dir === 'ascending' ? 1 : -1;
  const val = r => (key === 'FUND_NAME' ? (r.FUND_NAME ?? null) : (r[key] == null || !isFinite(parseFloat(r[key])) ? null : parseFloat(r[key])));
  return rows.slice().sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null || y == null) return (x == null) - (y == null);
    return sign * (typeof x === 'string' ? x.localeCompare(y) : x - y);
  });
}

function _perfFundRowsHtml(rows) {
  // The whole row opens the fund (see the container's click handler); the fund name is
  // a real <button> so the row is reachable and announced by keyboard.
  const chevron = '<svg class="perf-row-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  return rows.map(row => {
    const name = escHtml(row.FUND_NAME ?? 'Fund');
    const sub = row._family ? `<span class="perf-family-sub">${escHtml(row._members.map(m => m.name).join(' + '))}</span>` : '';
    const cells = _PERF_COLS.map(c => `<td${c.pinned ? ' class="perf-pin-col"' : ''}>${c.fmt(row[c.key], row)}</td>`).join('');
    return `<tr data-uuid="${escHtml(row.FUND_UUID ?? '')}">
      <td><button type="button" class="perf-fund-name-link">${name}</button>${sub}</td>${cells}
      <td class="perf-row-action-col"><span class="perf-row-action" aria-hidden="true"><span class="perf-row-action-label">View</span>${chevron}</span></td>
    </tr>`;
  }).join('');
}

function _perfSortBy(key) {
  const order = ['none', 'ascending', 'descending'];
  const dir = _perfSort.key === key ? order[(order.indexOf(_perfSort.dir) + 1) % 3] : 'ascending';
  _perfSort = { key: dir === 'none' ? null : key, dir };
  trackUi("click", "FundPerformance.Table.Sort");
  document.querySelectorAll('.perf-funds-table th[data-sort-key]').forEach(th =>
    th.setAttribute('aria-sort', th.dataset.sortKey === _perfSort.key ? _perfSort.dir : 'none'));
  const body = document.getElementById('perf-funds-tbody');
  if (body) body.innerHTML = _perfFundRowsHtml(perfSortRows(_perfTableRows, _perfSort.key, _perfSort.dir));
}

function _perfRenderFundsTable(rows, container, notices = []) {
  _perfTableRows = rows;
  const ariaSort = key => (_perfSort.key === key ? _perfSort.dir : 'none');
  // Numeric headers put the icon before the label, as Ink's sortable Table does. Each
  // label is also its definition's tooltip trigger, so hover explains and click sorts.
  const colHeaderCells = _PERF_COLS.map(c =>
    `<th${c.pinned ? ' class="perf-pin-col"' : ''} data-sort-key="${c.key}" aria-sort="${ariaSort(c.key)}">${_perfTip(c.tip, PERF_SORT_ICON + c.label, 'perf-sort-btn')}</th>`
  ).join('');
  const nameHeader = `<th data-sort-key="FUND_NAME" aria-sort="${ariaSort('FUND_NAME')}"><button type="button" class="perf-sort-btn">Fund${PERF_SORT_ICON}</button></th>`;
  const bodyRows = _perfFundRowsHtml(perfSortRows(rows, _perfSort.key, _perfSort.dir));
  const nameByUuid = new Map(rows.map(row => [row.FUND_UUID, row.FUND_NAME ?? 'Fund']));
  container.onclick = e => {
    const th = e.target.closest('th[data-sort-key]');
    if (th) { _perfSortBy(th.dataset.sortKey); return; }
    const tr = e.target.closest('tbody tr[data-uuid]');
    if (tr && nameByUuid.has(tr.dataset.uuid)) perfOpenFundDetail(tr.dataset.uuid, nameByUuid.get(tr.dataset.uuid));
  };

  if (perfOverviewChartInst) { perfOverviewChartInst.destroy(); perfOverviewChartInst = null; }
  // What a family row is built from, and any family kept as its funds.
  const listNotes = [];
  if (rows.some(r => r._family)) listNotes.push(`Fund family rows combine their funds. ${PERF_FAMILY_METHOD} ${PERF_FAMILY_IRR_REASON}`);
  notices.forEach(n => listNotes.push(`${n.familyName} is shown as separate funds because its funds do not all report one known currency${n.currencies.length ? ' (' + n.currencies.join(', ') + ')' : ''}; amounts in different currencies are never added together.`));
  container.innerHTML = `
    <section class="perf-chart-card perf-overview-card" id="perf-overview-card" aria-labelledby="perf-overview-title">
      <div class="perf-chart-header"><h2 class="perf-chart-title" id="perf-overview-title">Net IRR</h2></div>
      <div class="perf-overview-controls" id="perf-overview-controls">${PERF_CONTROLS_BONE}</div>
      <div class="perf-overview-legend" id="perf-overview-legend">${PERF_LEGEND_BONE}</div>
      <div class="perf-chart-wrap tall">
        <canvas id="perf-overview-chart" role="img" aria-labelledby="perf-overview-title"></canvas>
        <div class="shimmer-bone perf-chart-bone" id="perf-overview-skeleton"></div>
      </div>
    </section>
    ${listNotes.map(t => `<p class="perf-list-note">${escHtml(t)}</p>`).join('')}
    <div class="perf-table-wrap">
    <div class="perf-table-scroll">
      <table class="perf-funds-table">
        <thead><tr>${nameHeader}${colHeaderCells}<th class="perf-row-action-col"><span class="sr-only">Open</span></th></tr></thead>
        <tbody id="perf-funds-tbody">${bodyRows}</tbody>
      </table>
    </div>
    </div>`;
  const scroller = container.querySelector('.perf-table-scroll');
  const hint = () => scroller.parentElement.classList.toggle('has-more-right', scroller.scrollLeft + scroller.clientWidth < scroller.scrollWidth - 1);
  scroller.addEventListener('scroll', hint, { passive: true });
  window.addEventListener('resize', hint);
  hint();
}

// ── All-funds overview graph ──
// One solid line per fund and a dashed peer-median (P50) line in the same colour, laid
// out like Carta Home's Fund Performance tile. It plots the funds table's measures (see
// PERF_OVERVIEW_METRICS), so a line's last point is the fund's figure at the last
// benchmark quarter.
// Quarter labels on both charts sit on a fixed 45° diagonal, so they read the same
// at every width instead of flipping between flat and slanted as the chart resizes.
const PERF_QUARTER_TICKS = { minRotation: 45, maxRotation: 45 };
// Chrome both charts share, so they hover, morph and read alike.
const PERF_MORPH = { duration: 450, easing: 'easeInOutCubic' };
// A dashed vertical rule through the hovered quarter.
const PERF_CROSSHAIR = {
  id: 'crosshair',
  afterDraw(chart) {
    if (!chart.tooltip?._active?.length) return;
    const { ctx, scales: { x, y } } = chart;
    const xPos = chart.tooltip._active[0].element.x;
    ctx.save(); ctx.beginPath();
    ctx.moveTo(xPos, y.top); ctx.lineTo(xPos, y.bottom);
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(128,128,128,0.25)';
    ctx.setLineDash([3, 3]); ctx.stroke(); ctx.restore();
  },
};
const PERF_CHART_FONT = 'Inter,system-ui,sans-serif';
// Each chart spreads this into its tooltip and adds its own itemSort and callbacks.
function _perfTooltipChrome() {
  return {
    backgroundColor: 'rgba(26,26,26,0.94)',
    titleColor: '#9C9F9F', titleFont: { size: 11, family: PERF_CHART_FONT },
    bodyColor: '#FFFFFF', bodyFont: { size: 12, family: PERF_CHART_FONT },
    borderColor: 'rgba(255,255,255,0.08)', borderWidth: 1,
    padding: { top: 8, bottom: 8, left: 12, right: 12 },
    cornerRadius: 4, caretSize: 4,
    // No white backing square, so a peer swatch reads as hollow.
    multiKeyBackground: 'transparent',
  };
}
// Both charts' axes. A fresh object per chart, since each later swaps its own y tick format.
function _perfScales(color, tick) {
  const font = () => ({ size: 12, family: PERF_CHART_FONT });
  return {
    x: { ticks: { color, font: font(), ...PERF_QUARTER_TICKS }, grid: { display: false }, border: { display: false } },
    y: { ticks: { color, font: font(), callback: tick }, grid: { color: 'rgba(128,128,128,0.12)' }, border: { display: false } },
  };
}
const _BENCH_COLORS = ["var(--carta-series-blue)","var(--carta-series-teal)","var(--carta-series-pink)","var(--carta-series-gray)","var(--carta-series-lilac)"];
// More lines than this stop being readable on one chart.
const PERF_OVERVIEW_MAX_FUNDS = 5;
const PERF_OVERVIEW_DEFAULT_FUNDS = 3;
// The benchmark query covers this many of the largest funds, each over its whole life
// in quarters.
const PERF_OVERVIEW_QUERY_FUNDS = 20;
// dwh:execute:query returns 1,000 rows unless told otherwise, and rows come oldest first,
// so a cut-off would drop the newest quarters. Ask for the DWH ceiling instead; split
// across PERF_OVERVIEW_QUERY_FUNDS funds it is far more quarters than any fund has.
const PERF_OVERVIEW_QUERY_LIMIT = 10000;
// Each metric reads the same measure as the table's column of that name (LP net IRR,
// LP DPI, LP TVPI). The table shows the latest month-end; a line ends at the last
// benchmark quarter, so the two can differ by the months since.
const PERF_OVERVIEW_METRICS = {
  NET_IRR: { label: _perfColLabel('NET_LP_IRR'), value: 'NET_LP_IRR', peer: 'NET_LP_IRR_50TH',
             fmt: _perfIrr, tick: v => v + '%' },
  TVPI:    { label: _perfColLabel('LP_TVPI'), value: 'LP_TVPI', peer: 'LP_TVPI_50', ..._perfMultiple },
  DPI:     { label: _perfColLabel('LP_DPI'),  value: 'LP_DPI',  peer: 'LP_DPI_50', ..._perfMultiple },
};
// Quarters kept per period; null keeps the whole series the query returns, which is each
// fund's full history.
const PERF_OVERVIEW_PERIODS = {
  '1Y': { label: '1Y',  quarters: 4 },
  '3Y': { label: '3Y',  quarters: 12 },
  ALL:  { label: 'All', quarters: null },
};
let perfOverviewChartInst = null;
let _perfOverviewRows = [];
let _perfOverviewFunds = [];   // [{ uuid, name, label, color }] funds with series rows, NAV order
// The filters the graph opens on.
const _perfOverviewDefaults = () => ({ metric: 'NET_IRR', fundUuids: [], period: 'ALL', showPeer: true });
let _perfOverview = _perfOverviewDefaults();

// Series colours are light-dark() tokens so each has a dark-mode arm. Canvas can't read
// var(), so chart colours resolve through inkColor at draw time.
const _perfCanvasColor = c => (c.startsWith('var(') ? inkColor(c.slice(4, -1), '#8C8C8C') : c);

const _perfReducedMotion = () => !!window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;

// Fund lines draw no points, so a series with a single value would draw nothing; that
// one value gets a dot. Builders call this on every update, since datasets are reused.
const _perfSoloRadius = data => data.filter(v => v != null).length === 1 ? 3 : 0;

// Short legend names: drop the ", L.P." suffix and the words every fund shares at the
// front, but keep each name's last two words so "Fund I" / "Fund II" never shrink to "I".
function _perfShortFundLabels(names) {
  const words = names.map(n => n.replace(/,? L\.?P\.?$/, '').trim().split(/\s+/));
  let shared = 0;
  if (words.length > 1) {
    while (words.every(w => w[shared] === words[0][shared] && shared < w.length)) shared++;
    shared = Math.max(0, Math.min(shared, ...words.map(w => w.length - 2)));
  }
  return words.map((w, i) => w.slice(shared).join(' ') || names[i]);
}

// Builds Chart.js { labels, datasets } for the current filters. Pure: reads only its arguments.
function perfOverviewSeries(rows, state, funds) {
  const m = PERF_OVERVIEW_METRICS[state.metric];
  const picked = funds.filter(f => state.fundUuids.includes(f.uuid));
  const byFund = {};
  rows.forEach(r => {
    if (r[m.value] == null) return;
    (byFund[r.FUND_UUID] = byFund[r.FUND_UUID] || {})[r.PERFORMANCE_QUARTER_START_DATE] = r;
  });
  let dates = Array.from(new Set(picked.flatMap(f => Object.keys(byFund[f.uuid] || {})))).sort();
  const keep = PERF_OVERVIEW_PERIODS[state.period].quarters;
  if (keep) dates = dates.slice(-keep);
  const num = v => (v == null ? null : parseFloat(v));
  const line = (f, key, peer) => {
    const data = dates.map(d => num(byFund[f.uuid]?.[d]?.[key]));
    return {
      // Matched on across updates; labels can repeat (parallel vehicles), fund ids can't.
      _perfKey: `${f.uuid}:${peer ? 'p50' : 'fund'}`,
      label: peer ? `${f.label} P50` : f.label,
      data,
      borderColor: f.color,
      borderWidth: peer ? 1.2 : 2.5,
      borderDash: peer ? [4, 4] : [],
      pointRadius: _perfSoloRadius(data), pointHoverRadius: peer ? 4 : 5, pointHoverBackgroundColor: f.color,
      fill: false, tension: 0.4, spanGaps: true,
      _perfPeer: peer,
    };
  };
  const solid = picked.map(f => line(f, m.value, false));
  const dashed = state.showPeer
    ? picked.map(f => line(f, m.peer, true)).filter(ds => ds.data.some(v => v != null))
    : [];
  return { labels: dates.map(_fmtQtr), datasets: [...solid, ...dashed] };
}

// The rows of one dwh query, or null when it failed.
async function _perfQueryRows(sql, limit) {
  try {
    const r = await _mcp("fetch", {
      command: 'dwh:execute:query',
      params: { sql, format: 'ndjson', response_mode: 'inline', ...(limit ? { limit } : {}) },
    });
    return r && !r.isError ? parseDWH(r) : null;
  } catch (_) { return null; }
}
const _perfInList = uuids => uuids.filter(u => _PERF_UUID_RE.test(u || '')).map(u => `'${u}'`).join(', ');

// The one query for TEMPORAL_FUND_COHORT_BENCHMARKS series: the overview graph, a fund's detail
// page and a family's benchmark fund all read it.
const _perfSeriesSql = uuids => `SELECT FUND_UUID, FUND_NAME, ${PERF_BENCH_COLS}
                FROM FUND_ADMIN.TEMPORAL_FUND_COHORT_BENCHMARKS
                WHERE FUND_UUID IN (${_perfInList(uuids)})
                ORDER BY PERFORMANCE_QUARTER_START_DATE, FUND_NAME`;

// The funds' LP paid-in capital at each quarter-end: the weights their quarterly ratios combine by.
const _perfFamilyPaidInSql = uuids => `SELECT FUND_ID AS FUND_UUID, MONTH_END_DATE, SUM(CUMULATIVE_TOTAL_CONTRIBUTIONS) AS LP_PAID_IN
                FROM FUND_ADMIN.PARTNER_MONTHLY_NAV_CALCULATIONS
                WHERE FUND_ID IN (${_perfInList(uuids)}) AND IS_LIMITED_PARTNER AND MONTH(MONTH_END_DATE) IN (3, 6, 9, 12)
                GROUP BY FUND_ID, MONTH_END_DATE
                ORDER BY MONTH_END_DATE`;

// key (family:<id>) → Promise of { memberRows, paidIn }, so the overview graph and the family's page
// share one read. A read that fails is not kept: the next visit asks again.
const _perfFamilyHistory = new Map();
function perfLoadFamilyHistory(family) {
  return _perfOncePerFamily(_perfFamilyHistory, family, () => {
    const uuids = family._members.map(m => m.uuid);
    return Promise.all([
      _perfQueryRows(_perfSeriesSql(uuids), PERF_OVERVIEW_QUERY_LIMIT),
      _perfQueryRows(_perfFamilyPaidInSql(uuids), PERF_OVERVIEW_QUERY_LIMIT),
    ]).then(([memberRows, paidIn]) => {
      if (memberRows && paidIn) return { memberRows, paidIn };
      _perfFamilyHistory.delete(family.FUND_UUID);
      return null;
    });
  });
}

// A family's quarterly series as benchmark-table rows (see perfFamilyBenchmarkRows), or null when
// its funds' history can't be read. `netIrrByQuarter` is Carta's family Net IRR by quarter, if read.
function _perfFamilyRows(family, history, netIrrByQuarter) {
  if (!history) return null;
  const series = perfFamilySeries(history.memberRows, history.paidIn, family._members.map(m => m.uuid), _perfToday());
  const benchmark = history.memberRows.filter(r => r.FUND_UUID === family._benchmarkUuid);
  return perfFamilyBenchmarkRows(family.FUND_UUID, series, benchmark, netIrrByQuarter);
}

let _perfOverviewLoad = 0;
async function perfLoadOverviewChart(entityRows) {
  const load = ++_perfOverviewLoad;
  const shown = entityRows.slice(0, PERF_OVERVIEW_QUERY_FUNDS);
  const families = shown.filter(e => e._family);
  // Funds are read from the benchmark table; a family is built from its funds' quarterly rows
  // there, with the peer percentiles of its benchmark fund. Its Net IRR line is on its own page.
  const fundIds = shown.filter(e => !e._family).map(e => e.FUND_UUID);
  const [fundRowsRaw, ...familyHistories] = await Promise.all([
    fundIds.length ? _perfQueryRows(_perfSeriesSql(fundIds), PERF_OVERVIEW_QUERY_LIMIT) : Promise.resolve([]),
    ...families.map(perfLoadFamilyHistory),
  ]);
  if (load !== _perfOverviewLoad) return;
  const rows = [...(fundRowsRaw || [])];
  families.forEach((f, i) => { rows.push(...(_perfFamilyRows(f, familyHistories[i], new Map()) || [])); });
  const card = document.getElementById('perf-overview-card');
  if (!card) return;
  const withData = new Set(rows.map(r => r.FUND_UUID));
  // NAV order, same as the table underneath.
  const funds = shown.filter(r => withData.has(r.FUND_UUID));
  if (!funds.length) { card.remove(); return; }
  const labels = _perfShortFundLabels(funds.map(r => String(r.FUND_NAME ?? 'Fund')));
  _perfOverviewRows = rows;
  _perfLegendAnimated = false;
  _perfOverviewFunds = funds.map((r, i) => ({
    uuid: r.FUND_UUID, name: r.FUND_NAME, label: labels[i], color: null, family: !!r._family,
  }));
  _perfOverview = _perfOverviewDefaults();
  // A family has no Net IRR line, so a graph that includes one opens on TVPI.
  if (_perfOverviewFunds.some(f => f.family)) _perfOverview.metric = 'TVPI';
  _perfShowFunds(_perfDefaultFunds());
  _perfWireOverviewCard(card);
  _perfRenderOverviewControls();
  _perfRenderOverviewLegend();
  perfDrawOverviewChart({ entrance: true });
  document.getElementById('perf-overview-skeleton')?.classList.add('is-done');
}

// First draw: each line draws left to right, one fund after another, and the dashed
// peer lines follow once the solid ones land (Chart.js's progressive-line recipe).
function _perfEntranceAnimations(solidCount, pointCount) {
  const lineMs = 900;
  const stepMs = lineMs / Math.max(1, pointCount);
  const staggerMs = 120;
  const startOf = ctx => {
    const i = ctx.datasetIndex;
    return i < solidCount ? i * staggerMs : solidCount * staggerMs + lineMs * 0.6 + (i - solidCount) * staggerMs;
  };
  const prevY = ctx => {
    if (ctx.index === 0) return ctx.chart.scales.y.getPixelForValue(ctx.chart.scales.y.min);
    return ctx.chart.getDatasetMeta(ctx.datasetIndex).data[ctx.index - 1].getProps(['y'], true).y;
  };
  const delay = flag => ctx => {
    if (ctx.type !== 'data' || ctx[flag]) return 0;
    ctx[flag] = true;
    return startOf(ctx) + ctx.index * stepMs;
  };
  return {
    x: { type: 'number', easing: 'linear', duration: stepMs, from: NaN, delay: delay('_perfX') },
    y: { type: 'number', easing: 'easeOutQuart', duration: stepMs * 2, from: prevY, delay: delay('_perfY') },
  };
}

// Whether any fund on the graph has a peer median for the current metric and period.
// Without one, the title, the switch and the legend key don't promise a comparison.
function _perfOverviewHasPeer() {
  const all = perfOverviewSeries(_perfOverviewRows, Object.assign({}, _perfOverview, { showPeer: true }), _perfOverviewFunds);
  return all.datasets.some(ds => ds._perfPeer);
}

// Chart.js rebuilds a line from the baseline when its dataset object is replaced, so
// lines still on the graph keep their objects and only their values change.
function _perfApplyOverviewData(chart, data, m) {
  const current = new Map(chart.data.datasets.map(ds => [ds._perfKey, ds]));
  chart.data.labels = data.labels;
  chart.data.datasets = data.datasets.map(ds => {
    const kept = current.get(ds._perfKey);
    return kept ? Object.assign(kept, ds) : ds;
  });
  chart.options.scales.y.ticks.callback = m.tick;
}

// The series for the current filters, with colours resolved for the canvas.
function _perfOverviewData() {
  const data = perfOverviewSeries(_perfOverviewRows, _perfOverview, _perfOverviewFunds);
  data.datasets.forEach(ds => { ds.borderColor = ds.pointHoverBackgroundColor = _perfCanvasColor(ds.borderColor); });
  return data;
}

let _perfFadeTimer = null;
// The fade-out before a cross-faded redraw; the timer swaps the data once it ends.
const PERF_FADE_MS = 120;
function perfDrawOverviewChart({ entrance = false, fade = false } = {}) {
  const canvas = document.getElementById('perf-overview-chart');
  if (!canvas || !window.Chart) return;
  const m = PERF_OVERVIEW_METRICS[_perfOverview.metric];
  const data = _perfOverviewData();
  const title = document.getElementById('perf-overview-title');
  if (title) title.textContent = _perfOverviewHasPeer() ? `${m.label} vs peer median` : m.label;
  const still = _perfReducedMotion();

  if (perfOverviewChartInst && !entrance) {
    const chart = perfOverviewChartInst;
    // Lines morph between values only when every point keeps its quarter; a new set of
    // quarters re-indexes the points, and peer lines switched on would rise from the
    // baseline, so those changes cross-fade instead.
    const sameQuarters = chart.data.labels.join() === data.labels.join();
    if (still || (sameQuarters && !fade)) {
      _perfApplyOverviewData(chart, data, m);
      chart.options.animations = { x: PERF_MORPH, y: PERF_MORPH };
      chart.update(still ? 'none' : undefined);
      return;
    }
    clearTimeout(_perfFadeTimer);
    canvas.style.transition = `opacity ${PERF_FADE_MS}ms ease-out`;
    canvas.style.opacity = '0';
    _perfFadeTimer = setTimeout(() => {
      // Re-read the filters: another change may have landed during the fade-out.
      _perfApplyOverviewData(chart, _perfOverviewData(), PERF_OVERVIEW_METRICS[_perfOverview.metric]);
      chart.update('none');
      canvas.style.transition = 'opacity .24s var(--perf-ease-spring)';
      canvas.style.opacity = '1';
    }, PERF_FADE_MS);
    return;
  }
  if (perfOverviewChartInst) { perfOverviewChartInst.destroy(); perfOverviewChartInst = null; }
  const textColor = chartLabelColor();
  const solidCount = data.datasets.filter(ds => !ds._perfPeer).length;
  perfOverviewChartInst = new Chart(canvas.getContext("2d"), {
    type: "line",
    plugins: [PERF_CROSSHAIR],
    data,
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: still ? false : PERF_MORPH,
      animations: still || !entrance ? { x: PERF_MORPH, y: PERF_MORPH } : _perfEntranceAnimations(solidCount, data.labels.length),
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          ..._perfTooltipChrome(),
          enabled: true, mode: "index", intersect: false,
          // Each fund sits directly above its own peer median, highest fund first.
          itemSort: (a, b) => {
            const fundY = item => item.chart.data.datasets.find(ds => !ds._perfPeer && ds.borderColor === item.dataset.borderColor)?.data[item.dataIndex] ?? item.parsed.y;
            return (fundY(b) - fundY(a)) || (a.dataset._perfPeer ? 1 : 0) - (b.dataset._perfPeer ? 1 : 0);
          },
          callbacks: {
            label(item) {
              if (item.parsed.y == null) return null;
              return ` ${item.dataset.label}: ${PERF_OVERVIEW_METRICS[_perfOverview.metric].fmt(item.parsed.y)}`;
            },
            // Peer lines get a hollow dashed swatch, matching the dashed line on the graph.
            labelColor(item) {
              return item.dataset._perfPeer
                ? { borderColor: item.dataset.borderColor, backgroundColor: 'transparent', borderWidth: 1, borderDash: [2, 2], borderRadius: 2 }
                : { borderColor: item.dataset.borderColor, backgroundColor: item.dataset.borderColor, borderWidth: 2, borderDash: [], borderRadius: 2 };
            },
          },
        },
      },
      scales: _perfScales(textColor, m.tick),
    },
  });
}

// A segmented control's buttons, one per entry of a { value: { label } } map. The
// caller sets aria-checked.
function _perfSegButtons(map, group) {
  const groupAttr = group ? ` data-group="${group}"` : '';
  return Object.entries(map).map(([value, { label }]) =>
    `<button type="button" class="perf-seg-btn" role="radio"${groupAttr} data-value="${value}" aria-checked="false">${label}</button>`).join('');
}

// The controls render once; each change syncs their state in place, so the segmented
// and switch transitions play instead of the row being rebuilt.
function _perfRenderOverviewControls() {
  const el = document.getElementById('perf-overview-controls');
  if (!el) return;
  const seg = (group, label, map) => `
    <div class="perf-seg" role="radiogroup" aria-label="${label}">${_perfSegButtons(map, group)}</div>`;
  el.innerHTML = `
    ${seg('metric', 'Metric', PERF_OVERVIEW_METRICS)}
    ${seg('period', 'Period', PERF_OVERVIEW_PERIODS)}
    <span class="perf-switch-label">
      <button type="button" class="perf-switch" role="switch" aria-checked="true" aria-label="Peer median"></button>
      Peer median
    </span>`;
  _perfSyncOverviewControls();
}

function _perfSyncOverviewControls() {
  const el = document.getElementById('perf-overview-controls');
  if (!el) return;
  const s = _perfOverview;
  el.querySelectorAll('.perf-seg-btn').forEach(b => b.setAttribute('aria-checked', String(s[b.dataset.group] === b.dataset.value)));
  const sw = el.querySelector('.perf-switch');
  if (sw) {
    const hasPeer = _perfOverviewHasPeer();
    sw.setAttribute('aria-checked', String(s.showPeer && hasPeer));
    sw.disabled = !hasPeer;
    sw.title = hasPeer ? '' : 'No peer benchmark for these funds yet';
  }
}

const PERF_EYE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const PERF_EYE_OFF = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 5.2A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.6M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5-1.4M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>';
// Sets the funds on the graph, in NAV order so each line keeps its place. Colours belong
// to shown funds: a fund keeps its colour while shown, and a newly shown fund takes the
// first colour no shown fund is using, so no two lines ever share one.
function _perfShowFunds(uuids) {
  const shown = _perfOverviewFunds.filter(f => uuids.includes(f.uuid));
  _perfOverviewFunds.forEach(f => { if (!uuids.includes(f.uuid)) f.color = null; });
  shown.forEach(f => { if (!f.color) f.color = _BENCH_COLORS.find(c => !shown.some(o => o.color === c)); });
  _perfOverview.fundUuids = shown.map(f => f.uuid);
}

const _perfDefaultFunds = () => _perfOverviewFunds.slice(0, PERF_OVERVIEW_DEFAULT_FUNDS).map(f => f.uuid);

// "Compare funds": every queried fund with quarterly history, each with an eye to show or hide its line.
// It starts on the stated rule (the largest funds by NAV) and says when it no longer does.
let _perfLegendAnimated = false;
function _perfRenderOverviewLegend() {
  const el = document.getElementById('perf-overview-legend');
  if (!el) return;
  const shown = _perfOverview.fundUuids;
  const atCap = shown.length >= PERF_OVERVIEW_MAX_FUNDS;
  const isDefault = shown.join() === _perfDefaultFunds().join();
  const rule = isDefault
    ? `${Math.min(PERF_OVERVIEW_DEFAULT_FUNDS, _perfOverviewFunds.length)} largest funds by NAV`
    : `${shown.length} of ${_perfOverviewFunds.length} funds · <button type="button" class="perf-compare-reset">Reset to ${PERF_OVERVIEW_DEFAULT_FUNDS} largest</button>`;
  const pop = _perfLegendAnimated ? '' : ' is-new';
  const chips = _perfOverviewFunds.map((f, i) => {
    const on = shown.includes(f.uuid);
    // Past the cap a hidden fund can't be shown, and the last fund shown can't be hidden.
    const locked = on ? shown.length === 1 : atCap;
    const why = on ? (locked ? 'At least one fund stays on the graph' : `Hide ${f.name}`)
                   : (locked ? `Show up to ${PERF_OVERVIEW_MAX_FUNDS} funds at once` : `Show ${f.name}`);
    return `<button type="button" class="perf-overview-chip${pop}" style="--i:${i}" data-uuid="${escHtml(f.uuid)}" aria-pressed="${on}"${locked ? ' aria-disabled="true"' : ''} title="${escHtml(why)}">
      <span class="perf-compare-eye">${on ? PERF_EYE : PERF_EYE_OFF}</span><span class="perf-legend-dot" style="--c:${f.color || 'var(--ink-color-global-border-default)'}"></span>${escHtml(f.label)}
    </button>`;
  }).join('');
  const peerKey = _perfOverview.showPeer && _perfOverviewHasPeer()
    ? `<span class="perf-overview-peer-key${pop}" style="--i:${_perfOverviewFunds.length}"><span class="perf-overview-dash"></span>Dashed line = peer median (P50)</span>`
    : '';
  const familyIrr = _perfOverview.metric === 'NET_IRR' && _perfOverviewFunds.some(f => f.family && shown.includes(f.uuid))
    ? `<p class="perf-list-note">${escHtml(PERF_FAMILY_IRR_HISTORY)} Pick TVPI or DPI to see a family\u2019s line.</p>` : '';
  el.innerHTML = `
    <div class="perf-compare-head"><span class="fund-switcher-label">Compare funds</span><span class="perf-compare-rule">${rule}</span></div>
    <div class="perf-compare-chips" role="group" aria-label="Compare funds">${chips}${peerKey}</div>${familyIrr}`;
  _perfLegendAnimated = true;
}

// One set of listeners on the card.
function _perfWireOverviewCard(card) {
  if (card.dataset.wired) return;
  card.dataset.wired = '1';
  const rerender = (event) => {
    trackUi("change", "FundPerformance.Overview." + event);
    _perfSyncOverviewControls();
    _perfRenderOverviewLegend();
    perfDrawOverviewChart({ fade: event === 'Period' || event === 'Peer' });
  };
  card.addEventListener('click', e => {
    const segBtn = e.target.closest('.perf-seg-btn');
    if (segBtn) {
      const { group, value } = segBtn.dataset;
      if (_perfOverview[group] === value) return;
      _perfOverview[group] = value;
      rerender(group === 'metric' ? 'Metric' : 'Period');
      return;
    }
    if (e.target.closest('.perf-switch')) {
      _perfOverview.showPeer = !_perfOverview.showPeer;
      rerender('Peer');
      return;
    }
    if (e.target.closest('.perf-compare-reset')) {
      _perfShowFunds(_perfDefaultFunds());
      rerender('Funds');
      return;
    }
    const chip = e.target.closest('.perf-overview-chip');
    if (!chip) return;
    const uuid = chip.dataset.uuid;
    const shown = _perfOverview.fundUuids;
    const list = shown.includes(uuid) ? shown.filter(u => u !== uuid) : [...shown, uuid];
    if (!list.length || list.length > PERF_OVERVIEW_MAX_FUNDS) return;
    _perfShowFunds(list);
    rerender('Funds');
    card.querySelector(`.perf-overview-chip[data-uuid="${uuid}"]`)?.focus();
  });
}

// ── Fixed-position tooltip manager for .tooltip-trigger (escapes overflow:hidden containers) ──
(function() {
  let tip = null;
  function ensureTip() {
    // The template ships a #perf-tip; fall back to creating one so this keeps
    // working if the markup ever drops it.
    if (!tip) {
      tip = document.getElementById('perf-tip');
    }
    if (!tip) {
      tip = document.createElement('div');
      tip.id = 'perf-tip';
      document.body.appendChild(tip);
    }
    return tip;
  }
  function showTip(el) {
    const t = ensureTip();
    t.textContent = el.getAttribute('data-tip') || '';
    const r = el.getBoundingClientRect();
    // Above the label, starting at its left edge, so it never covers the value under
    // a KPI label or the first table row; below the label only when there's no room.
    let top = r.top - t.offsetHeight - 6;
    if (top < 8) top = r.bottom + 6;
    let left = Math.min(r.left, window.innerWidth - t.offsetWidth - 8);
    if (left < 8) left = 8;
    t.style.top  = top + 'px';
    t.style.left = left + 'px';
    t.classList.add('visible');
  }
  function hideTip() {
    if (tip) tip.classList.remove('visible');
  }
  function onEnter(e) {
    const el = e.target.closest?.('.tooltip-trigger');
    if (!el) return;
    showTip(el);
  }
  function onLeave(e) {
    const el = e.target.closest?.('.tooltip-trigger');
    if (!el) return;
    hideTip();
  }
  document.addEventListener('mouseover', onEnter);
  document.addEventListener('mouseout', onLeave);
  // Keyboard parity: the definitions must be reachable without a pointer.
  document.addEventListener('focusin', onEnter);
  document.addEventListener('focusout', onLeave);
})();

function perfSetStatus(msg) {
  const el = document.getElementById('perf-page-status');
  if (!el) return;
  if (msg) { el.textContent = msg; el.style.display = ''; }
  else { el.style.display = 'none'; }
}

async function perfLoadFund(uuid) {
  // Everything on the fund page describes the fund open now: clear the last fund's
  // chart data, date and cohort here, and drop any response that lands after the
  // viewer has opened another fund or gone back to the list.
  const stale = () => perfCurrentFundUuid !== uuid;
  // The id goes into SQL below, so only a well-formed UUID is queried.
  // A fund family is built from its funds, which each pass the same check.
  const family = _perfEntities.get(uuid)?._family ? _perfEntities.get(uuid) : null;
  const queryable = family ? family._members.every(m => _PERF_UUID_RE.test(m.uuid || '')) : _PERF_UUID_RE.test(uuid || '');
  const familyNote = document.getElementById('perf-family-note');
  if (familyNote) {
    familyNote.hidden = !family;
    familyNote.textContent = family
      ? `Fund family view of ${family._members.map(m => m.name).join(' + ')}. ${PERF_FAMILY_METHOD} ${PERF_FAMILY_IRR_REASON} ${PERF_FAMILY_CHARTS} Peer benchmarks use the cohort of ${family._benchmarkName}.`
      : '';
  }
  if (perfPeerChartInst) { perfPeerChartInst.destroy(); perfPeerChartInst = null; }
  _perfPeerData = null;
  _perfSetAsOf([]);
  _perfShowPeerPromise(false);
  const cohortLabel = document.getElementById('perf-cohort-label');
  if (cohortLabel) cohortLabel.textContent = '';
  // Skeleton: the real labels with shimmer bones where the values will land.
  perfRenderMetrics(null, true);
  perfRenderMetricsTable(null, true);
  document.querySelector('#perf-peer-card .perf-chart-bone')?.classList.remove('is-done');
  const peerSummary = document.getElementById('perf-peer-summary');
  if (peerSummary) peerSummary.innerHTML = '<span class="shimmer-bone shimmer-val" style="width:320px;max-width:100%;"></span>';

  let seriesData = null;
  let familyRows = null;   // a family's quarterly rows, to read Carta's Net IRR for each quarter
  let snapshotRow = null;
  let fundNetIrr = null;
  let fundNetIrrDate = null;

  if (queryable && await mcpAvailable()) {
    if (stale()) return;
    // ── Helper: parse series rows ──
    // Net IRR, TVPI and DPI are the LP measures, as in the table and the snapshot point below,
    // so the line, its last point and the table all describe the same thing.
    const _parseSeriesRows = (rows) => rows.map(row => ({
      QUARTER_END_DATE: _fmtQtr(row.PERFORMANCE_QUARTER_START_DATE),
      QUARTER_START_DATE: _pfQuarterStart(_perfDay(row.PERFORMANCE_QUARTER_START_DATE)),
      NET_IRR: row.NET_LP_IRR != null ? row.NET_LP_IRR / 100 : null,
      TVPI: row.LP_TVPI != null ? parseFloat(row.LP_TVPI) : null,
      DPI: row.LP_DPI != null ? parseFloat(row.LP_DPI) : null,
      MOIC: row.MOIC != null ? parseFloat(row.MOIC) : null,
      BENCHMARK_P25_NET_IRR: row.NET_LP_IRR_25TH != null ? row.NET_LP_IRR_25TH / 100 : null,
      BENCHMARK_P50_NET_IRR: row.NET_LP_IRR_50TH != null ? row.NET_LP_IRR_50TH / 100 : null,
      BENCHMARK_P75_NET_IRR: row.NET_LP_IRR_75TH != null ? row.NET_LP_IRR_75TH / 100 : null,
      BENCHMARK_P25_TVPI: row.LP_TVPI_25 != null ? parseFloat(row.LP_TVPI_25) : null,
      BENCHMARK_P50_TVPI: row.LP_TVPI_50 != null ? parseFloat(row.LP_TVPI_50) : null,
      BENCHMARK_P75_TVPI: row.LP_TVPI_75 != null ? parseFloat(row.LP_TVPI_75) : null,
      BENCHMARK_P25_DPI: row.LP_DPI_25 != null ? parseFloat(row.LP_DPI_25) : null,
      BENCHMARK_P50_DPI: row.LP_DPI_50 != null ? parseFloat(row.LP_DPI_50) : null,
      BENCHMARK_P75_DPI: row.LP_DPI_75 != null ? parseFloat(row.LP_DPI_75) : null,
      BENCHMARK_P25_MOIC: row.MOIC_25 != null ? parseFloat(row.MOIC_25) : null,
      BENCHMARK_P50_MOIC: row.MOIC_50 != null ? parseFloat(row.MOIC_50) : null,
      BENCHMARK_P75_MOIC: row.MOIC_75 != null ? parseFloat(row.MOIC_75) : null,
    }));

    // ── Fire both queries in parallel ──
    // Include MONTH_END_DATE so we can use the snapshot as a trailing data point
    // on charts when TEMPORAL_FUND_COHORT_BENCHMARKS lags behind.
    // A family's snapshot is its row in the list, already summed from its funds.
    const snapPromise = family ? null : _mcp("fetch", {
      command: 'dwh:execute:query',
      params: {
        sql: `SELECT ${PERF_SNAPSHOT_COLS}
        FROM FUND_ADMIN.AGGREGATE_FUND_METRICS
        WHERE FUND_UUID = '${uuid}'
        ORDER BY MONTH_END_DATE DESC NULLS LAST
        LIMIT 1`,
        format: 'ndjson',
      },
    });

    // One statement for the first call and its retry, so the two can't drift apart.
    // uuid passed the _PERF_UUID_RE check above (queryable) before reaching here.
    const seriesSql = _perfSeriesSql([uuid]);
    const seriesPromise = family
      ? perfLoadFamilyHistory(family).then(history => _perfFamilyRows(family, history, new Map()))
      : _mcp("fetch", {
          command: 'dwh:execute:query',
          params: {
            sql: seriesSql,
            format: 'ndjson',
          },
        });

    // ── Render snapshot (metrics strip + table) as soon as it resolves ──
    try {
      const rS = family ? null : await snapPromise;
      if (family) {
        snapshotRow = { ...family };
      } else if (rS && !rS.isError) {
        const rows = parseDWH(rS);
        if (rows.length > 0) snapshotRow = rows[0];
      } else {
        // Fallback to confirmed-only columns
        const rFallback = await _mcp("fetch", {
          command: 'dwh:execute:query',
          params: {
            sql: `SELECT
              FUND_SIZE, TOTAL_MOIC, NET_LP_IRR, LP_DPI, LP_TVPI, LP_RVPI,
              TOTAL_VALUE, ENDING_TOTAL_NAV, TOTAL_CAP_CONTRIBUTION, TOTAL_DISTRIBUTION
            FROM FUND_ADMIN.AGGREGATE_FUND_METRICS
            WHERE FUND_UUID = '${uuid}'
            LIMIT 1`,
            format: 'ndjson',
            response_mode: 'inline',
          },
        });
        if (!rFallback.isError) {
          const rows = parseDWH(rFallback);
          if (rows.length > 0) snapshotRow = rows[0];
        }
      }
    } catch (_) {}
    if (stale()) return;

    // Render metrics strip + table immediately — don't wait for charts
    if (snapshotRow) {
      _perfSetAsOf(snapshotRow._asOfDates || [snapshotRow.MONTH_END_DATE]);
      perfSetStatus(null);
      perfRenderMetrics(snapshotRow);
      perfRenderMetricsTable(snapshotRow);
    }

    // A family's Net IRR is read with the list. It fills the KPI tile and the detail table
    // when it lands, without holding up the charts, and stays out of the chart series.
    let familyIrr = {};
    if (family && snapshotRow) {
      const base = snapshotRow;
      perfLoadFamilyIrr(family).then(irr => {
        if (stale()) return;
        familyIrr = _perfFamilyIrrState(irr);
        perfRenderMetrics({ ...base, ...familyIrr });
        perfRenderMetricsTable({ ...base, ...familyIrr, FUND_NET_IRR: fundNetIrr, FUND_NET_IRR_DATE: fundNetIrrDate });
      });
    }

    // ── Now await the series query and render charts ──
    try {
      let rows = null;
      if (family) {
        rows = await seriesPromise;
      } else {
        let r = await seriesPromise;
        if (!r || r.isError) {
          r = await _mcp("fetch", {
            command: 'dwh:execute:query',
            params: {
              sql: seriesSql,
              format: 'ndjson',
              response_mode: 'inline',
            },
          });
        }
        if (r && !r.isError) rows = parseDWH(r);
      }
      if (rows && rows.length > 0) {
        seriesData = _parseSeriesRows(rows);
        if (family) familyRows = rows;
        const lastRow = rows[rows.length - 1];
        const lastIrr = [...rows].reverse().find(row => row.NET_IRR != null);
        if (lastIrr) {
          fundNetIrr = lastIrr.NET_IRR;
          fundNetIrrDate = lastIrr.PERFORMANCE_QUARTER_START_DATE;
        }
        seriesData._cohort = {
          vintageYear: lastRow.VINTAGE_YEAR,
          entityType: lastRow.ENTITY_TYPE_NAME,
          aumBucket: lastRow.FUND_AUM_BUCKET,
          fundCount: lastRow.FUND_COUNT,
          benchmarkName: family ? family._benchmarkName : null,
        };
      }
    } catch (_) {}
    if (stale()) return;
    // The total-fund IRR comes with the quarterly series, so the table's IRR row
    // completes once it lands.
    if (snapshotRow) perfRenderMetricsTable({ ...snapshotRow, ...familyIrr, FUND_NET_IRR: fundNetIrr, FUND_NET_IRR_DATE: fundNetIrrDate });

    // ── Extend the chart to the snapshot's quarter ──
    // TEMPORAL_FUND_COHORT_BENCHMARKS is batch-computed and can lag the fund's latest
    // figures, so the snapshot adds one trailing point, placed in the quarter of its
    // own month-end so the line ends at the As of date. Without a month-end (the
    // fallback query) there's no honest place for it, so it is left off.
    // A month-end after today is the current, unfinished month: its figures are month
    // to date, so they stay in the KPIs and table but don't extend the chart.
    if (snapshotRow && snapshotRow.MONTH_END_DATE && !_perfMonthToDate(snapshotRow.MONTH_END_DATE, _perfToday())) {
      const snapQLabel = _fmtQtr(_perfDay(snapshotRow.MONTH_END_DATE));
      // Convert "Q3'26" → sortable integer 202603.
      // Use string indexing instead of regex to avoid apostrophe character-encoding issues
      // (the curly-quote U+2019 used in _fmtQtr templates doesn't match a straight-quote regex).
      const qToNum = s => {
        if (!s || s.length < 5) return 0;
        const q = parseInt(s[1], 10);      // s = "Q3'26" → s[1] = '3'
        const y = parseInt(s.slice(-2), 10); // s.slice(-2) = '26'
        return (!isNaN(q) && !isNaN(y)) ? (2000 + y) * 10 + q : 0;
      };
      const lastLabel = seriesData && seriesData.length > 0
        ? seriesData[seriesData.length - 1].QUARTER_END_DATE
        : null;
      if (qToNum(snapQLabel) > qToNum(lastLabel)) {
        const snapPoint = {
          QUARTER_END_DATE: snapQLabel,
          // A family's Net IRR is one figure, not a history, so its chart has no Net IRR point.
          NET_IRR:  !family && snapshotRow.NET_LP_IRR != null ? snapshotRow.NET_LP_IRR / 100 : null,
          TVPI:     snapshotRow.LP_TVPI      != null ? parseFloat(snapshotRow.LP_TVPI)      : null,
          DPI:      snapshotRow.LP_DPI       != null ? parseFloat(snapshotRow.LP_DPI)       : null,
          MOIC:     snapshotRow.TOTAL_MOIC   != null ? parseFloat(snapshotRow.TOTAL_MOIC)   : null,
          BENCHMARK_P25_NET_IRR: null, BENCHMARK_P50_NET_IRR: null, BENCHMARK_P75_NET_IRR: null,
          BENCHMARK_P25_TVPI:    null, BENCHMARK_P50_TVPI:    null, BENCHMARK_P75_TVPI:    null,
          BENCHMARK_P25_DPI:     null, BENCHMARK_P50_DPI:     null, BENCHMARK_P75_DPI:     null,
          BENCHMARK_P25_MOIC:    null, BENCHMARK_P50_MOIC:    null, BENCHMARK_P75_MOIC:    null,
        };
        if (!seriesData) {
          // No benchmark history at all — create series from snapshot only
          seriesData = [snapPoint];
          seriesData._cohort = null;
        } else {
          seriesData.push(snapPoint);
        }
      }
    }
  }

  // Every path without a series settles the peer card here, with one message.
  if (!seriesData) {
    document.querySelector('#perf-peer-card .perf-chart-bone')?.classList.add('is-done');
    if (peerSummary) peerSummary.textContent = 'No quarterly history or peer benchmark for this fund yet.';
  }

  if (!seriesData && !snapshotRow) {
    perfSetStatus(null);
    const container = document.getElementById('perf-page-metrics');
    if (container) container.innerHTML = '<div style="color:var(--ink-color-global-text-subtle);font-size:13px;padding:20px 0;">Select a fund above to view performance data.</div>';
    perfRenderMetricsTable(null);
    return;
  }

  // Snapshot already rendered eagerly above; clear loading status and draw charts
  perfSetStatus(null);
  if (!snapshotRow) {
    // No snapshot data at all — still render empty state
    perfRenderMetrics(null);
    perfRenderMetricsTable(null);
  }
  if (seriesData) {
    seriesData._family = !!family;
    // A family's Net IRR line is Carta's figure at each quarter-end: the chart draws without it and
    // fills it in as it is read.
    seriesData._irrPending = !!familyRows;
    perfDrawCharts(seriesData);
    if (familyRows) {
      perfLoadFamilyIrrHistory(family, familyRows).then(byQuarter => {
        if (stale()) return;
        seriesData.forEach(d => { const irr = byQuarter.get(d.QUARTER_START_DATE); if (irr != null) d.NET_IRR = irr / 100; });
        seriesData._irrPending = false;
        perfDrawCharts(seriesData);
      });
    }
    // Show cohort label below metrics strip
    const cohortEl = document.getElementById('perf-cohort-label');
    if (cohortEl && seriesData._cohort) {
    const c = seriesData._cohort;
    const hasBenchmarkData = seriesData.some(d => d.BENCHMARK_P50_NET_IRR != null || d.BENCHMARK_P50_TVPI != null);
    const parts = [];
    if (c.benchmarkName) parts.push(`${c.benchmarkName} cohort`);
    if (c.vintageYear) parts.push(c.vintageYear);
    if (c.entityType)  parts.push(c.entityType);
    if (c.aumBucket)   parts.push(c.aumBucket.replace(/-/g, '\u2013') + ' AUM');
    if (c.fundCount)   parts.push(c.fundCount + ' funds in cohort');
    if (hasBenchmarkData) {
      cohortEl.textContent = parts.length ? 'Benchmarks: ' + parts.join(' \u00b7 ') : '';

    } else if (parts.length) {
      cohortEl.innerHTML = 'Cohort: ' + parts.map(escHtml).join(' \u00b7 ') + ' &mdash; <em>peer benchmark data not yet available for this cohort</em>';
    } else {
      cohortEl.textContent = '';
    }
  }
  }
}

// The IRR callout compares bases, not holders: the LPs' net IRR (the figure the funds
// table, the peer chart and the quartile all use) against the fund's gross deal IRR.
const PERF_IRR_TIPS = {
  net: 'Net IRR: return on LP cash flows, after fees and carry.',
  gross: "Gross IRR: return on the fund's investments, before management fees, expenses and carry.",
  missing: 'Carta has no IRR on this basis for this fund.',
  young: 'Within about two years of the first capital call, fees dominate and IRRs swing widely.',
};
// Funds younger than this get an "early-stage" note on the IRR callout.
const PERF_YOUNG_FUND_MONTHS = 24;

// The gap a reader would otherwise work out in their head, in percentage points so it
// can't read as a relative change. Gross above net is what went to fees and carry; when
// net comes out ahead (credit-line timing, fee offsets) the line stays neutral.
function perfIrrSpread(net, gross) {
  const n = net == null ? NaN : parseFloat(net), g = gross == null ? NaN : parseFloat(gross);
  if (!isFinite(n) || !isFinite(g)) return null;
  const pts = Math.round((g - n) * 10) / 10;
  if (pts > 0) return `${pts.toFixed(1)} pts to fees & carry`;
  return `${pts < 0 ? '\u2212' : ''}${Math.abs(pts).toFixed(1)} pts`;
}

function perfIsYoungFund(s) {
  if (!s?.VINTAGE_DATE || !s?.MONTH_END_DATE) return false;
  const start = new Date(_perfDay(s.VINTAGE_DATE) + 'T00:00:00'), end = new Date(_perfDay(s.MONTH_END_DATE) + 'T00:00:00');
  if (isNaN(start) || isNaN(end)) return false;
  return (end.getFullYear() - start.getFullYear()) * 12 + end.getMonth() - start.getMonth() < PERF_YOUNG_FUND_MONTHS;
}

// KPI tiles above the detail table. Total value shares its definition with the
// all-funds table column. The IRR callout tile leads the strip.
// In story order: what was committed, what's invested, what's left to invest, then
// what it's all worth now. Uncalled capital is Committed capital minus Contributions,
// so it is exact for every fund and matches the Contributions row below.
const _PERF_KPIS = [
  { key: 'FUND_SIZE',                 label: 'Committed capital',      tip: null },
  { key: 'TOTAL_COST_OF_INVESTMENTS', label: 'Invested (cost basis)',  tip: 'Cost of investments to date, excluding fees and expenses.' },
  { key: 'UNCALLED',                  label: 'Uncalled capital',       tip: 'Committed capital not yet called from partners: Committed − Contributions.',
    value: s => (s.FUND_SIZE != null && s.TOTAL_CAP_CONTRIBUTION != null) ? parseFloat(s.FUND_SIZE) - parseFloat(s.TOTAL_CAP_CONTRIBUTION) : null },
  { key: 'TOTAL_VALUE',               label: 'Total value',            tip: null },
];

function perfRenderMetrics(s, loading = false) {
  const strip = document.getElementById('perf-page-metrics');
  if (!strip) return;
  if (!s && !loading) { strip.innerHTML = ''; return; }
  const tipOf = k => k.tip ?? _PERF_COLS.find(c => c.key === k.key).tip;
  // The return is the headline, so the IRR tile comes first and is read first.
  strip.innerHTML = _perfIrrCallout(s, loading) + _PERF_KPIS.map(k => {
    const raw = loading ? null : (k.value ? k.value(s) : s[k.key]);
    const v = loading ? '<span class="shimmer-bone shimmer-val"></span>'
      : (raw != null ? fmtFull(parseFloat(raw), s.FUND_REPORTING_CURRENCY) : '—');
    return `<div class="perf-metric"><div class="perf-metric-label">${_perfTip(tipOf(k), k.label)}</div><div class="perf-metric-val">${v}</div></div>`;
  }).join('');
}

// Net IRR as the headline, gross beside it, and the gap spelled out under both. A
// missing figure says "not reported" rather than a bare dash.
function _perfIrrCallout(s, loading) {
  const label = `<div class="perf-metric-label">${_perfTip(PERF_IRR_TIPS.net, 'Net IRR')}</div>`;
  if (loading) return `<div class="perf-metric perf-metric-irr">${label}<div class="perf-metric-val"><span class="shimmer-bone shimmer-val"></span></div></div>`;
  if (s._family) {
    const val = _perfFamilyIrrHtml(s, s.NET_LP_IRR);
    return `<div class="perf-metric perf-metric-irr">${label}
    <div class="perf-metric-val">${val}</div>
  </div>`;
  }
  const net = _perfIrrCell(s.NET_LP_IRR), gross = _perfIrrCell(s.DEAL_IRR);
  const grossPart = gross === '—'
    ? _perfTip(PERF_IRR_TIPS.missing, 'Gross not reported')
    : `vs ${gross} ${_perfTip(PERF_IRR_TIPS.gross, 'gross')}`;
  const notes = [perfIrrSpread(s.NET_LP_IRR, s.DEAL_IRR), perfIsYoungFund(s) && _perfTip(PERF_IRR_TIPS.young, 'early-stage, IRR volatile')].filter(Boolean);
  return `<div class="perf-metric perf-metric-irr">${label}
    <div class="perf-metric-val">${net === '—' ? _perfTip(PERF_IRR_TIPS.missing, 'Not reported') : net} <span class="perf-irr-gross">${grossPart}</span></div>
    ${notes.length ? `<div class="perf-irr-note">${notes.join(' · ')}</div>` : ''}
  </div>`;
}

// Each column of the detail table reads one holder: the LPs' share, or the whole fund.
const PERF_DETAIL_SIDES = {
  lp:    { value: 'LP_VALUE',    nav: 'ENDING_LP_NAV',    contrib: 'TOTAL_LP_CAP_CONTRIBUTION', dist: 'TOTAL_LP_DISTRIBUTION', moic: 'LP_MOIC',    irr: 'NET_LP_IRR' },
  total: { value: 'TOTAL_VALUE', nav: 'ENDING_TOTAL_NAV', contrib: 'TOTAL_CAP_CONTRIBUTION',    dist: 'TOTAL_DISTRIBUTION',    moic: 'TOTAL_MOIC', irr: 'FUND_NET_IRR', irrDate: 'FUND_NET_IRR_DATE' },
};

// FUND_NET_IRR is the latest fund-level net IRR from the quarterly series; it is
// undefined until that series has answered (shown as a placeholder) and null when the
// fund has none. FUND_NET_IRR_DATE is its quarter: the series can lag the snapshot,
// so a figure from an earlier quarter than the As of date names its quarter.
function perfRenderMetricsTable(s, loading = false) {
  const container = document.getElementById('perf-detail-metrics-table');
  if (!container) return;
  if (!s && !loading) { container.innerHTML = ''; return; }
  const bone = '<span class="shimmer-bone shimmer-val"></span>';
  const num = key => { const n = s?.[key] == null ? NaN : parseFloat(s[key]); return isFinite(n) ? n : null; };
  // The multiples are worked out from the dollar rows below them, so each column
  // reconciles on the page: TVPI = Total value ÷ Contributions, DPI = Distributions ÷
  // Contributions, RVPI = NAV ÷ Contributions.
  const per = (top, c) => { const t = num(top), d = num(c.contrib); return t != null && d > 0 ? t / d : null; };
  const x = v => loading ? bone : _perfMultipleCell(v);
  const irrQuarter = (v, c) => {
    const d = c.irrDate && s?.[c.irrDate], asOf = s?.MONTH_END_DATE;
    if (_perfIrrCell(v) === '—' || !d || !asOf) return '';
    const q = _fmtQtr(_perfDay(d));
    return q !== _fmtQtr(_perfDay(asOf)) && _perfDay(d) < _perfDay(asOf) ? ` (${q})` : '';
  };
  const irr = (v, c) => loading || v === undefined ? bone
    // Carta's family figure is the LPs' net IRR; the total-fund column has none.
    : s._family ? _perfFamilyIrrHtml(s, c === PERF_DETAIL_SIDES.lp ? v : null)
    : _perfIrrCell(v) + irrQuarter(v, c);
  const dlr = v => loading ? bone : v != null ? fmtFull(parseFloat(v), s.FUND_REPORTING_CURRENCY) : '—';
  // [label, value for one side, formatter(value, side)]
  const rows = [
    ['Total Value to Paid-in Capital (TVPI)',    c => per(c.value, c), x],
    ['Distributions to Paid-in Capital (DPI)',   c => per(c.dist, c), x],
    ['Residual Value to Paid-in Capital (RVPI)', c => per(c.nav, c), x],
    ['Net Internal Rate of Return (IRR)',        c => s?.[c.irr], irr],
    ['Multiple on Invested Capital (MOIC)',      c => s?.[c.moic], x],
    [_perfColLabel('TOTAL_VALUE'),               c => s?.[c.value], dlr],
    [_perfColLabel('ENDING_TOTAL_NAV'),          c => s?.[c.nav], dlr],
    [_perfColLabel('TOTAL_CAP_CONTRIBUTION'),    c => s?.[c.contrib], dlr],
    [_perfColLabel('TOTAL_DISTRIBUTION'),        c => s?.[c.dist], dlr],
  ];
  const { lp, total } = PERF_DETAIL_SIDES;
  const bodyRows = rows.map(([label, val, fmt]) =>
    `<tr><td>${label}</td><td>${fmt(val(lp), lp)}</td><td>${fmt(val(total), total)}</td></tr>`
  ).join('');
  container.innerHTML = `
    <table class="perf-detail-table">
      <thead><tr><th>Metric</th><th>LP only</th><th>Total fund</th></tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>
  `;
}

// ── Single-fund peer chart ──
// The fund's line against its vintage cohort: P25–P75 shaded, P50 dashed, and one
// line saying which quartile the fund sits in, so the chart says by how much.
// Labels come from the overview graph and tooltip formats from the page's shared
// formatters (_perfIrr, _perfMultiple), so both charts read like the tables.
// The peer series holds Net IRR as a fraction (0.15) where the overview holds percent (15).
// The axis gets its own unsigned tick format, as on the overview.
const PERF_PEER_METRICS = {
  NET_IRR: { label: PERF_OVERVIEW_METRICS.NET_IRR.label, fmt: v => _perfIrr(v * 100), tick: v => (v * 100).toFixed(0) + '%' },
  TVPI:    { label: PERF_OVERVIEW_METRICS.TVPI.label, ..._perfMultiple },
  DPI:     { label: PERF_OVERVIEW_METRICS.DPI.label, ..._perfMultiple },
  MOIC:    { label: 'MOIC', ..._perfMultiple },
};
const PERF_QUARTILE_NAMES = ['1st quartile (top 25%)', '2nd quartile', '3rd quartile', '4th quartile (bottom 25%)'];
let perfPeerChartInst = null;
let _perfPeerData = null;
let _perfPeerMetric = 'NET_IRR';

// The fund's quartile at the latest quarter that has both its value and the cohort's
// percentiles; null when no such quarter exists. Higher is better for every metric.
function perfPeerQuartile(data, metric) {
  for (let i = data.length - 1; i >= 0; i--) {
    const d = data[i];
    const v = d[metric], p25 = d['BENCHMARK_P25_' + metric], p50 = d['BENCHMARK_P50_' + metric], p75 = d['BENCHMARK_P75_' + metric];
    if (v == null || p25 == null || p50 == null || p75 == null) continue;
    const quartile = v >= p75 ? 1 : v >= p50 ? 2 : v >= p25 ? 3 : 4;
    return { quartile, quarter: d.QUARTER_END_DATE };
  }
  return null;
}

function _perfPeerSummary() {
  const el = document.getElementById('perf-peer-summary');
  if (!el) return;
  const m = PERF_PEER_METRICS[_perfPeerMetric];
  const q = perfPeerQuartile(_perfPeerData, _perfPeerMetric);
  const c = _perfPeerData._cohort || {};
  if (_perfPeerData._family && _perfPeerMetric === 'MOIC') { el.textContent = PERF_FAMILY_MOIC; return; }
  if (_perfPeerData._family && _perfPeerMetric === 'NET_IRR' && _perfPeerData._irrPending) { el.textContent = "Reading Carta's Net IRR for the family, quarter by quarter\u2026"; return; }
  if (_perfPeerData._family && _perfPeerMetric === 'NET_IRR' && !_perfPeerData.some(d => d.NET_IRR != null)) { el.textContent = "Carta's Net IRR by quarter isn't available for this family."; return; }
  if (!q) {
    el.textContent = _perfPeerData._family
      ? `No peer benchmark yet for the cohort of ${c.benchmarkName}, so ${m.label} shows the family alone.`
      : `No peer benchmark yet for this fund's cohort, so ${m.label} shows the fund alone.`;
    return;
  }
  const peers = [c.vintageYear && `${c.vintageYear} vintage`, c.entityType].filter(Boolean).join(' ');
  const detail = [c.benchmarkName && `${c.benchmarkName}\u2019s cohort`, c.fundCount && `${c.fundCount} funds`, `as of ${q.quarter}`].filter(Boolean).join(', ');
  el.innerHTML = `${escHtml(m.label)}: <strong>${PERF_QUARTILE_NAMES[q.quartile - 1]}</strong> vs ${escHtml(peers || 'peer')} funds <span class="perf-peer-detail">(${escHtml(detail)})</span>`;
}

// What the chart's own line is called: a family's is the family.
const _perfPeerSelf = () => (_perfPeerData._family ? 'This family' : 'This fund');

function _perfPeerDatasets() {
  const k = _perfPeerMetric;
  const col = key => _perfPeerData.map(d => d[key]);
  const band = _perfCanvasColor('var(--carta-peer-band)');
  const median = _perfCanvasColor('var(--carta-peer-median)');
  const fund = _perfCanvasColor('var(--carta-series-blue)');
  return [
    // P25 is the band's floor; P75 fills down to it.
    { label: 'P25', data: col('BENCHMARK_P25_' + k), borderWidth: 0, pointRadius: 0, pointHoverRadius: 0, fill: false, tension: 0.4, spanGaps: true },
    { label: 'P75', data: col('BENCHMARK_P75_' + k), borderWidth: 0, pointRadius: 0, pointHoverRadius: 0, backgroundColor: band, fill: '-1', tension: 0.4, spanGaps: true },
    { label: 'Peer median (P50)', data: col('BENCHMARK_P50_' + k), borderColor: median, borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: median, fill: false, tension: 0.4, spanGaps: true },
    { label: _perfPeerSelf(), data: col(k), borderColor: fund, borderWidth: 2.5, pointRadius: _perfSoloRadius(col(k)), pointHoverRadius: 5, pointHoverBackgroundColor: fund, fill: false, tension: 0.4, spanGaps: true },
  ];
}

// The fund chart's title and peer keys mention peers only once a draw has found peer
// data for the current metric; loading, empty and newly opened states promise nothing.
function _perfShowPeerPromise(hasPeer) {
  const m = PERF_PEER_METRICS[_perfPeerMetric];
  const title = document.getElementById('perf-peer-title');
  if (title) title.textContent = hasPeer ? `${m.label} vs peers` : m.label;
  document.querySelectorAll('#perf-peer-card .perf-peer-only').forEach(el => { el.hidden = !hasPeer; });
}

function perfDrawCharts(data) {
  _perfPeerData = data;
  document.querySelector('#perf-peer-card .perf-chart-bone')?.classList.add('is-done');
  _perfShowPeerPromise(data.some(d => d['BENCHMARK_P50_' + _perfPeerMetric] != null));
  const canvas = document.getElementById('perf-peer-chart');
  if (!canvas || !window.Chart) return;
  const m = PERF_PEER_METRICS[_perfPeerMetric];
  _perfSyncPeerMetric();
  _perfPeerSummary();
  const selfLabel = document.getElementById('perf-peer-self-label');
  if (selfLabel) selfLabel.textContent = _perfPeerSelf();
  const datasets = _perfPeerDatasets();
  const labels = data.map(d => d.QUARTER_END_DATE);
  if (perfPeerChartInst) {
    // Same quarters, new metric: keep the dataset objects so the lines morph.
    perfPeerChartInst.data.labels = labels;
    perfPeerChartInst.data.datasets.forEach((ds, i) => Object.assign(ds, datasets[i]));
    perfPeerChartInst.options.scales.y.ticks.callback = m.tick;
    perfPeerChartInst.update(_perfReducedMotion() ? 'none' : undefined);
    return;
  }
  const textColor = chartLabelColor();
  perfPeerChartInst = new Chart(canvas.getContext('2d'), {
    type: 'line', plugins: [PERF_CROSSHAIR],
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: _perfReducedMotion() ? false : PERF_MORPH,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          ..._perfTooltipChrome(),
          // Top to bottom as drawn: P75, fund, median, P25 sorted by value.
          itemSort: (a, b) => b.parsed.y - a.parsed.y,
          callbacks: {
            label(item) { return item.parsed.y == null ? null : ` ${item.dataset.label}: ${PERF_PEER_METRICS[_perfPeerMetric].fmt(item.parsed.y)}`; },
            labelColor(item) {
              const c = item.dataset.borderColor || item.chart.data.datasets[1].backgroundColor;
              return { borderColor: c, backgroundColor: item.dataset.borderWidth ? c : 'transparent', borderWidth: 1, borderDash: item.dataset.borderDash || [], borderRadius: 2 };
            },
          },
        },
      },
      scales: _perfScales(textColor, m.tick),
    },
  });
}

function _perfSyncPeerMetric() {
  document.querySelectorAll('#perf-peer-metric .perf-seg-btn').forEach(b => b.setAttribute('aria-checked', String(b.dataset.value === _perfPeerMetric)));
}
const _perfPeerMetricEl = document.getElementById('perf-peer-metric');
if (_perfPeerMetricEl) _perfPeerMetricEl.innerHTML = _perfSegButtons(PERF_PEER_METRICS);
_perfSyncPeerMetric();
_perfPeerMetricEl?.addEventListener('click', e => {
  const btn = e.target.closest('.perf-seg-btn');
  if (!btn || btn.dataset.value === _perfPeerMetric || !_perfPeerData) return;
  _perfPeerMetric = btn.dataset.value;
  trackUi("change", "FundPerformance.PeerChart.Metric");
  perfDrawCharts(_perfPeerData);
});

// ── User enrichment (get_current_user) → entitlement-gated skill directory ──
// Fetch the signed-in user's Carta profile, log the FULL payload where the LLM client
// can read it (Cowork surfaces artifact console output), and keep the product flags
// that decide which Skill Directory categories are shown.

// ── Standalone bootstrap ──
// The perf page is the whole artifact here, so it renders in flow rather than
// as the overlay it is inside Carta Home.
perfLoadAllFunds();
perfRenderFundSwitcher();
// Links to the Carta Home page that built this one, stamped in at render.
(function () {
  const HOME_URL = "{{HOME_URL}}";
  const homeBtn = document.getElementById('perf-home-btn');
  if (!homeBtn || !HOME_URL) return;
  homeBtn.href = HOME_URL;
  homeBtn.hidden = false;
  homeBtn.addEventListener('click', () => trackUi("click", "FundPerformance.BackToHome"));
})();
window.matchMedia?.("(prefers-color-scheme: dark)")?.addEventListener?.("change", () => {
  if (perfCurrentFundUuid) perfLoadFund(perfCurrentFundUuid);
  // Axis labels are painted on the canvas, so the overview graph redraws in the new scheme.
  if (perfOverviewChartInst) { perfOverviewChartInst.destroy(); perfOverviewChartInst = null; perfDrawOverviewChart(); }
});
