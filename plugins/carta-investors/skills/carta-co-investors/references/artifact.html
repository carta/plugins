          fetchAllRows(buildSummarySql, 'Query S'),
          fetchAllRows(buildRoundsSql, 'Query R'),
          // Query T supplies Live/Exited status, HAS_SPA and every coverage figure,
          // but not the co-investor table, so it must never fail the report. On
          // error the table still renders; the Live/Exited tabs and the header's
          // coverage sentence are left out and the tile reads "Coverage unavailable".
          fetchAllRows(buildStatusSql, 'Query T').catch(err => {
            console.warn('status query failed; Live/Exited filter and coverage disabled', err);
            return [];
          }),
          // Without vehicles the firm name is still excluded, so a failure here
          // degrades the report rather than blocking it.
          fetchAllRows(buildVehiclesSql, 'Query V').catch(err => {
            console.warn('vehicles query failed; excluding the firm name only', err);
            return [];
          }),
          // Cap tables add holders to the SPA picture, so a failure here degrades
          // the report to SPA-only rather than blocking it.
          fetchAllRows(buildCapTableSql, 'Query C').catch(err => {
            console.warn('cap table query failed; showing SPA data only', err);
            return [];
          }),
        ]);
      } catch (error) {
        showError(
          "Couldn't load your co-investor data just now. Try reloading in a moment. " +
          'If it keeps happening, contact your Carta representative.',
          error.message
        );
        return;
      }

      // Zero rows from both sources is ambiguous — nothing on file, or a firm
      // context that resolved to nothing. Say both rather than asserting the first.
      if (summaryRows.length === 0 && capRows.length === 0) {
        showError(
          'No SPA documents or detailed cap tables were found for ' + FIRM_NAME + '. Either none ' +
          'have been uploaded or shared yet, or your account does not have access to ' +
          "this firm's documents."
        );
        return;
      }

      setLoadingStatus('Building your report…');

      setFirmVehicles(vehicleRows);
      const { coInvestors, companyHolders, capCompanies } = buildCoInvestors(summaryRows, capRows);
      const summaryTotal = portfolioSizeFromSummary(summaryRows);
      const companyRounds = buildCompanyRounds(roundsRows);
      const companyStatus = statusRows.length ? buildCompanyStatus(statusRows) : null;
      // With no SPAs the summary carries no denominator; the portfolio list does.
      const total = summaryTotal || (companyStatus ? Object.keys(companyStatus).length : 0);
      const spaCompanies = new Set(Object.keys(companyRounds));
      coInvestors.forEach(inv => inv.companies.forEach(c => { if (inv.evidence[c].spa) spaCompanies.add(c); }));
      buildSpaMatchedCompanies(statusRows).forEach(c => spaCompanies.add(c));

      const now = new Date();
      const generatedAt = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      DATA = {
        meta: {
          firmName: FIRM_NAME,
          firmCartaId: FIRM_CARTA_ID,
          totalCompanies: total,
          // Only multi-name merges are worth explaining in the tooltip.
          groupings: coInvestors.filter(inv => inv.rawNames.length > 1)
                        .map(inv => ({ canonical: inv.name, merged: inv.rawNames })),
          generatedAt,
        },
        coInvestors,
        companyRounds,
        companyHolders,
        capCompanies,
        spaCompanies: [...spaCompanies].sort(),
      };
      if (companyStatus) DATA.companyStatus = companyStatus;

      refresh();
      showContent();
    }

    // ── Helpers ──────────────────────────────────────────────────────────────

    // Amounts carry their round's currency. With none on the SPA the number
    // shows bare: a guessed symbol would misstate a non-USD round.
    function fmt(n, currency) {
      if (!n || n === 0) return '—';
      const rounded = Math.round(n);
      if (!currency) return rounded.toLocaleString('en-US');
      try {
        return new Intl.NumberFormat('en-US', {
          style: 'currency', currency, minimumFractionDigits: 0, maximumFractionDigits: 0,
        }).format(rounded);
      } catch (_) {
        return rounded.toLocaleString('en-US') + ' ' + currency;
      }
    }

    function pct(n) {
      if (!n || n === 0) return '—';
      return (n * 100).toFixed(1) + '%';
    }

    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function escAttr(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }

    // The browser decodes an attribute's entities before running it as script,
    // so a quote needs a JS escape underneath escAttr's HTML one.
    function jsString(s) {
      return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function entityTagClass(entityType) {
      const t = (entityType || '').toLowerCase();
      if (t.indexOf('accelerator') !== -1 || t.indexOf('corporate') !== -1) return 'tag tag-blue';
      if (t.indexOf('hedge') !== -1 || t.indexOf('growth') !== -1) return 'tag tag-yellow';
      return 'tag tag-neutral';
    }

    function entityTag(entityType) {
      if (!entityType || entityType === '—') return '<span class="tag tag-neutral">—</span>';
      return '<span class="' + entityTagClass(entityType) + '">' + esc(entityType) + '</span>';
    }

    function hasDate(d) { return d && d !== '—'; }

    function roundLabel(shareClass, closingDate) {
      return hasDate(closingDate) ? shareClass + ' · ' + closingDate : shareClass;
    }

    // ── Filter logic ─────────────────────────────────────────────────────────

    // Returns true (live), false (exited), or null (unknown/not in status map)
    function companyStatus(name) {
      const s = DATA.companyStatus;
      if (!s || !(name in s)) return null;
      return s[name];
    }

    function passesFilter(companyName, filter) {
      if (filter === 'all') return true;
      const status = companyStatus(companyName);
      if (status === null) return false; // unknown — exclude from live/exited tabs
      return filter === 'live' ? status === true : status === false;
    }

    // Returns a filtered + re-sorted copy of DATA.coInvestors for a given filter
    // Companies past this count collapse behind a "+N more" toggle.
    const CHIP_LIMIT = 8;

    function hasDrawer(c) {
      return Boolean((DATA.companyRounds && DATA.companyRounds[c]) || (DATA.companyHolders && DATA.companyHolders[c]));
    }

    function companyChip(c) {
      // A company with neither round data nor cap table holders has nothing to
      // show in the drawer — render it inert rather than as a button that opens nothing.
      if (hasDrawer(c)) {
        return '<button class="company-link" onclick="openDrawer(\'' + escAttr(jsString(c)) + '\')">' + esc(c) + '</button>';
      }
      return '<span class="company-link" style="cursor:default;opacity:0.5;pointer-events:none">' + esc(c) + '</span>';
    }

    function expandChips(id, btn) {
      document.getElementById(id).style.display = 'inline';
      btn.remove();
    }

    // Every co-investor the tab has anything to say about. A row must keep at
    // least one company or it would render with an empty overlap cell.
    function sourcePasses(evidence) {
      if (currentSource === 'spa') return evidence.spa;
      if (currentSource === 'cap') return evidence.cap;
      return true;
    }

    function getFilteredCoInvestors(filter) {
      return DATA.coInvestors
        .filter(inv => !(hideIndividuals && inv.individual))
        .map(inv => {
          const filtered = inv.companies.filter(c => passesFilter(c, filter) && sourcePasses(inv.evidence[c]));
          return { ...inv, companies: filtered, companyCount: filtered.length };
        })
        .filter(inv => inv.companyCount > 0)
        .sort((a, b) => (b.companyCount - a.companyCount) || a.name.localeCompare(b.name));
    }

    // What the table shows for a filter. `total` is every co-investor the tab
    // has; `shown` is the whole list unless it is long (LONG_LIST_ROWS or more) and
    // there are investors at two or more companies to narrow it to. `trimmable`
    // is true when the toggle has something to switch.
    // Together these bound the tooltip's height; keep `.tooltip-wide .tt-body` max-height in the CSS above in step.
    const TOOLTIP_MAX_MERGES = 5;
    const TOOLTIP_MAX_MERGED_NAMES = 3;

    function visibleCoInvestors(filter) {
      const all = getFilteredCoInvestors(filter);
      const multi = all.filter(inv => inv.companyCount >= 2);
      const trimmable = all.length >= LONG_LIST_ROWS && multi.length > 0 && multi.length < all.length;
      return { all, total: all.length, shown: trimmable && !showSingles ? multi : all, trimmable };
    }

    // Portfolio companies covered by each source for a filter, as three disjoint
    // groups: SPA only, cap table only, both. They sum to `covered` because all
    // three are read off the same two name sets.
    //
    // `spaCompanies` can hold an SPA issuer that matched no portfolio investment
    // (Query R canonicalises it to the raw SPA name), so both sets are cut to the
    // portfolio -- the keys of `companyStatus`, which comes from the SOI. Cap
    // table companies carry the SOI's name, so the overlap with the SPA side is an
    // exact name match. With no status map there is no portfolio, so the function
    // returns null: coverage is unknown, not zero, and callers must say so.
    function coverageForFilter(filter) {
      if (!DATA.companyStatus) return null;
      const inScope = n => companyStatus(n) !== null && passesFilter(n, filter);
      const spaSet = new Set(DATA.spaCompanies.filter(inScope));
      const capSet = new Set(DATA.capCompanies.filter(inScope));
      let spaOnly = 0, capOnly = 0, both = 0;
      spaSet.forEach(n => { if (capSet.has(n)) both++; else spaOnly++; });
      capSet.forEach(n => { if (!spaSet.has(n)) capOnly++; });
      return { spaOnly, capOnly, both, covered: spaOnly + capOnly + both, total: totalForFilter(filter) };
    }

    function coverageSentence(c) {
      return c.spaOnly + ' companies from SPAs only, ' + c.capOnly + ' from cap tables only, ' + c.both +
        ' from both, ' + c.covered + ' covered in total';
    }

    function companySourceLabel(name) {
      const spa = DATA.spaCompanies.includes(name);
      const cap = DATA.capCompanies.includes(name);
      if (spa && cap) return 'From SPAs and cap table';
      return cap ? 'From cap table' : 'From SPAs';
    }

    // Total portfolio companies that match a filter (from companyStatus map)
    function totalForFilter(filter) {
      if (filter === 'all') return DATA.meta.totalCompanies;
      const s = DATA.companyStatus || {};
      return Object.values(s).filter(v => filter === 'live' ? v === true : v === false).length;
    }

    // ── Render functions ─────────────────────────────────────────────────────

    function renderHeader() {
      const m = DATA.meta;
      const c = coverageForFilter('all');
      const coveredPct = c && c.total > 0 ? Math.round(c.covered / c.total * 100) : 0;
      document.getElementById('page-header').innerHTML =
        '<h1>' + esc(m.firmName) + ' — Co-Investor Analysis</h1>' +
        (c ? '<p>' + c.covered + ' of your ' + c.total + ' portfolio companies have an SPA or detailed cap table on file (' + coveredPct + '%)</p>' : '');
    }

    function renderFilterBar() {
      const s = DATA.companyStatus;
      // Query T is optional. Without it every Live/Exited tab would read 0 and
      // filter the table down to nothing, so render no tabs at all.
      let html = '';
      if (s && Object.keys(s).length > 0) {
        const allCount = Object.keys(s).length;
        const liveCount = Object.values(s).filter(v => v === true).length;
        const exitedCount = Object.values(s).filter(v => v === false).length;

        const tab = (id, label, count) => {
          const active = currentFilter === id ? ' active' : '';
          return '<button class="filter-tab' + active + '" onclick="setFilter(\'' + id + '\')">' +
            label + '<span class="filter-count">' + count + '</span></button>';
        };
        html += tab('all', 'All', allCount) + tab('live', 'Live', liveCount) + tab('exited', 'Exited', exitedCount);
      }

      // The source filter only means something when a cap table was readable.
      const option = (id, label) => '<option value="' + id + '"' + (currentSource === id ? ' selected' : '') + '>' + label + '</option>';
      const sourceSelect = DATA.capCompanies.length
        ? '<select class="filter-select" aria-label="Source" onchange="setSource(this.value)">' +
            option('all', 'All sources') + option('spa', 'SPAs') + option('cap', 'Cap tables') + '</select>'
        : '';
      const view = visibleCoInvestors(currentFilter);
      const singlesToggle = view.trimmable
        ? singlesToggleButton('filter-btn', 'Show all ' + formatCount(view.total) + ' co-investors')
        : '';
      html += '<div class="filter-controls">' + singlesToggle + sourceSelect +
        '<label class="filter-check"><input type="checkbox" onchange="setHideIndividuals(this.checked)"' +
        (hideIndividuals ? ' checked' : '') + '> Hide individuals</label></div>';
      document.getElementById('filter-bar').innerHTML = html;
    }

    function renderMetrics(filter) {
      const m = DATA.meta;
      const ci = getFilteredCoInvestors(filter);
      const uniqueCount = ci.length;

      // Coverage tile
      const cov = coverageForFilter(filter);
      const coverageLabel = filter === 'live' ? 'Live Coverage' : filter === 'exited' ? 'Exited Coverage' : 'Portfolio Coverage';
      const coverageIntro = 'Co-investor analysis covers portfolio companies with a Stock Purchase Agreement (SPA) uploaded to Carta, or a detailed cap table shared with you.';
      let coverageValue, coverageSub, coverageTooltip;
      if (cov) {
        const total = cov.total;
        const coveredPct = total > 0 ? Math.round(cov.covered / total * 100) : 0;
        const missing = Math.max(total - cov.covered, 0);
        coverageValue = cov.covered + ' / ' + total + ' — ' + coveredPct + '%';
        coverageSub = coverageSentence(cov);
        coverageTooltip = coverageIntro + ' ' +
          cov.covered + ' of ' + total + (filter === 'all' ? ' portfolio' : filter === 'live' ? ' live' : ' exited') + ' companies are covered' +
          (missing > 0 ? ' — the remaining ' + missing + ' are not yet visible in this report.' : '.');
      } else {
        coverageValue = 'Coverage unavailable';
        coverageSub = '';
        coverageTooltip = coverageIntro + ' The portfolio list did not load, so coverage could not be computed.';
      }

      // Top co-investor
      const top = ci[0];
      const topName = top ? top.name : '—';
      const topCount = top ? top.companyCount : 0;
      const topSub = top ? topCount + (topCount === 1 ? ' company' : ' companies') : '';

      // Unique co-investors tooltip (always based on full data)
      const groupings = m.groupings || [];
      let groupingsHTML = '<div class="tt-intro">Some firms invest through multiple legal vehicles (separate fund entities). We grouped them under one canonical name so each firm counts once.</div>';
      if (groupings.length > 0) {
        const mergeWord = groupings.length === 1 ? 'merge' : 'merges';
        const shownNote = groupings.length > TOOLTIP_MAX_MERGES ? ' · ' + TOOLTIP_MAX_MERGES + ' largest shown' : '';
        groupingsHTML += '<div class="tt-section-label">' + groupings.length + ' ' + mergeWord + ' applied' + shownNote + '</div>';
        // A firm with hundreds of vehicles would otherwise list every one: show
        // the biggest merges and say so in the label.
        const biggest = groupings.slice().sort(function (a, b) { return (b.merged || []).length - (a.merged || []).length; });
        biggest.slice(0, TOOLTIP_MAX_MERGES).forEach(function (g) {
          const names = g.merged || [];
          const lines = names.slice(0, TOOLTIP_MAX_MERGED_NAMES).map(function (n) { return '· ' + esc(n); });
          if (names.length > TOOLTIP_MAX_MERGED_NAMES) lines.push('<span class="tt-more">+' + (names.length - TOOLTIP_MAX_MERGED_NAMES) + ' more</span>');
          groupingsHTML += '<div class="tt-group"><div class="tt-group-canonical">' + esc(g.canonical) + '</div><div class="tt-group-merged">' + lines.join('<br>') + '</div></div>';
        });
      } else {
        groupingsHTML += '<div class="tt-empty">No multi-vehicle merges in this report.</div>';
      }

      document.getElementById('metrics-grid').innerHTML =
        '<div class="metric-card has-tooltip" tabindex="0" aria-describedby="unique-tooltip">' +
          '<div class="metric-label">Unique Co-Investors <span class="tooltip-icon" aria-hidden="true">i</span></div>' +
          '<div class="metric-value">' + uniqueCount + '</div>' +
          '<div class="tooltip tooltip-wide" id="unique-tooltip" role="tooltip"><div class="tt-body">' + groupingsHTML + '</div></div>' +
        '</div>' +
        '<div class="metric-card">' +
          '<div class="metric-label">Top Co-Investor</div>' +
          '<div class="metric-value-text">' + esc(topName) + '</div>' +
          '<div class="metric-sub">' + esc(topSub) + '</div>' +
        '</div>' +
        '<div class="metric-card has-tooltip" tabindex="0" aria-describedby="coverage-tooltip">' +
          '<div class="metric-label">' + esc(coverageLabel) + ' <span class="tooltip-icon" aria-hidden="true">i</span></div>' +
          '<div class="metric-value" style="font-size:20px;line-height:40px">' + esc(coverageValue) + '</div>' +
          '<div class="metric-sub">' + esc(coverageSub) + '</div>' +
          '<div class="tooltip" id="coverage-tooltip" role="tooltip">' + esc(coverageTooltip) + '</div>' +
        '</div>';
    }

    // "No rows" and "no co-investors" are different claims. Say which one it is.
    function emptyStateMessage(filter) {
      const scope = filter === 'all' ? 'portfolio' : filter;
      const cov = coverageForFilter(filter);
      if (cov && cov.covered === 0) {
        return 'None of your ' + scope + ' companies have an SPA or detailed cap table on file, so there is' +
          ' nothing to compare here.';
      }
      return 'The SPAs and cap tables for your ' + scope + ' companies name no investor other than' +
        ' your own vehicles.';
    }

    function renderMainTable(filter) {
      const view = visibleCoInvestors(filter);
      const ci = view.shown;
      if (ci.length === 0) {
        document.getElementById('main-table').innerHTML =
          '<p style="padding:24px;color:var(--text-subtle);font-size:14px">' +
          esc(emptyStateMessage(filter)) + '</p>';
        return;
      }
      let html = '<table><thead><tr><th>#</th><th>Co-investor</th><th style="text-align:right">Companies</th><th>Type</th><th>Portfolio companies</th></tr></thead><tbody>';
      ci.forEach((inv, i) => {
        let cell = inv.companies.slice(0, CHIP_LIMIT).map(companyChip).join('');
        const overflow = inv.companies.slice(CHIP_LIMIT);
        if (overflow.length) {
          const id = 'chips-more-' + i;
          cell += '<span id="' + id + '" style="display:none">' + overflow.map(companyChip).join('') + '</span>';
          cell += ' <button class="chip-more" onclick="expandChips(\'' + id + '\', this)">+' + overflow.length + ' more</button>';
        }
        html += '<tr><td>' + (i+1) + '</td><td style="font-weight:500">' + esc(inv.name) + '</td><td class="number">' + inv.companyCount + '</td><td>' + entityTag(inv.entityType) + '</td><td>' + cell + '</td></tr>';
      });
      html += '</tbody></table>';
      document.getElementById('main-table').innerHTML = html;
    }

    function renderFooter(filter) {
      const m = DATA.meta;
      let html = '<a class="carta-link" href="' + BASE_URL + '/investors/firm/' + m.firmCartaId + '/portfolio/documents/" target="_blank">View SPA source documents in Carta ↗</a>';
      // The counts are the tab's, never the portfolio total.
      const scope = filter === 'all' ? 'portfolio' : filter;
      const view = visibleCoInvestors(filter);
      const note = view.shown.length < view.total
        ? 'Showing ' + formatCount(view.shown.length) + ' of ' + formatCount(view.total) + ' co-investors at 2 or more of your ' +
            scope + ' companies.'
        : 'Showing all ' + formatCount(view.total) + ' co-investors named on the SPAs and cap tables for your ' +
            scope + ' companies.';
      // The filter bar's toggle is easy to miss, so the sentence that says the
      // list is trimmed carries the way out of it.
      const toggle = !view.trimmable ? ''
        : ' ' + singlesToggleButton('carta-link', 'Show all ' + formatCount(view.total));
      html += '<div class="footer-note">' + esc(note) + toggle + '</div>';
      document.getElementById('page-footer').innerHTML = html;
    }

    // ── Filter switching ──────────────────────────────────────────────────────

    function refresh() {
      renderHeader();
      renderFilterBar();
      renderMetrics(currentFilter);
      renderMainTable(currentFilter);
      renderFooter(currentFilter);
    }

    function setFilter(filter) {
      currentFilter = filter;
      refresh();
    }

    function setSource(source) {
      currentSource = source;
      refresh();
    }

    function formatCount(n) {
      return n.toLocaleString('en-US');
    }

    // One markup for the filter bar's toggle and the footer's: only the class and the
    // "show everything" label differ.
    function singlesToggleButton(cls, showAllLabel) {
      return '<button class="' + cls + '" onclick="setShowSingles(' + !showSingles + ')">' +
        (showSingles ? 'Show only investors at 2+ companies' : showAllLabel) + '</button>';
    }

    function setShowSingles(show) {
      showSingles = show;
      refresh();
    }

    function setHideIndividuals(hide) {
      hideIndividuals = hide;
      refresh();
    }

    // ── Drawer ────────────────────────────────────────────────────────────────

    function currentHoldersHtml(cap) {
      let html = '<div class="drawer-round-label">Current holders</div>';
      if (cap.holders.length === 0) {
        html += '<p class="drawer-subtitle">No investor holders on the current cap table.</p>';
      } else {
        html += '<div class="table-container"><table><thead><tr><th>Investor</th><th style="text-align:right">Current fully diluted ownership</th></tr></thead><tbody>';
        cap.holders.forEach(h => {
          html += '<tr><td>' + esc(h.name) + '</td><td class="number">' + pct(h.ownership) + '</td></tr>';
        });
        html += '</tbody></table></div>';
      }
      if (cap.past.length) {
        html += '<div class="drawer-round-label">Past investors</div>' +
          '<p class="drawer-subtitle">' + cap.past.map(esc).join(' · ') + '</p>';
      }
      return html;
    }

    function roundsHtml(rounds) {
      let html = '';
      rounds.forEach((round) => {
        html += '<div class="drawer-round-label">' + esc(roundLabel(round.shareClass, round.closingDate)) + '</div>';
        html += '<div class="table-container"><table><thead><tr><th>Investor</th><th>Type</th><th style="text-align:right">% of round</th><th style="text-align:right">Amount paid</th></tr></thead><tbody>';
        const sorted = [...round.investors].sort((a, b) => (b.pctOfRound || 0) - (a.pctOfRound || 0));
        sorted.forEach(inv => {
          const bold = inv.isFirm ? 'font-weight:600' : '';
          const badge = inv.isFirm ? ' <span class="you-badge">You</span>' : '';
          html += '<tr><td style="' + bold + '">' + esc(inv.name) + badge + '</td><td>' + entityTag(inv.entityType) + '</td><td class="number">' + pct(inv.pctOfRound) + '</td><td class="number">' + fmt(inv.amountPaid, round.currency) + '</td></tr>';
        });
        const seen = new Set();
        let total = 0;
        round.investors.forEach(inv => {
          if (!seen.has(inv.name) && inv.amountPaid) { total += inv.amountPaid; seen.add(inv.name); }
        });
        html += '</tbody><tfoot><tr><td colspan="3">Total raised</td><td class="number">' + fmt(total, round.currency) + '</td></tr></tfoot></table></div>';
      });
      return html;
    }

    function openDrawer(name) {
      const rounds = DATA.companyRounds && DATA.companyRounds[name];
      const cap = DATA.companyHolders && DATA.companyHolders[name];
      if (!rounds && !cap) return;

      document.getElementById('drawer-title').textContent = name;
      document.getElementById('drawer-subtitle').textContent = companySourceLabel(name);
      document.getElementById('drawer-content').innerHTML =
        (cap ? currentHoldersHtml(cap) : '') + (rounds ? roundsHtml(rounds) : '');
      document.getElementById('drawer').classList.add('open');
      document.getElementById('backdrop').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('backdrop').classList.remove('open');
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    // Nothing renders synchronously: the page opens on the shimmer and bootstrap
    // swaps in the content once Carta answers.

    bootstrap();
  </script>
