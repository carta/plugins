              ...memo.map(l => ({ label: l.bucket, amount: amount(sum(l.byMonth)), kind: 'memo' })),
            ],
          };
        }),
      };
    }

    // Draws text the PDF's standard fonts cannot encode, so a name in any script still reads
    // correctly. Four device pixels per point keeps it sharp when printed.
    function rasterizeText(text, size, bold) {
      const SCALE = 4;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext && canvas.getContext('2d');
      if (!ctx) return null;
      const font = `${bold ? 'bold ' : ''}${size * SCALE}px Helvetica, Arial, sans-serif`;
      ctx.font = font;
      canvas.width = Math.max(1, Math.ceil(ctx.measureText(text).width) + 2);
      canvas.height = Math.ceil(size * 1.25 * SCALE);
      ctx.font = font;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#000';
      ctx.fillText(text, 1, size * SCALE);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const hex = [];
      for (let i = 0; i < data.length; i += 4) hex.push((((data[i] + data[i + 1] + data[i + 2]) / 3) | 0).toString(16).padStart(2, '0'));
      return { width: canvas.width, height: canvas.height, hex: hex.join(''), ptWidth: canvas.width / SCALE, ptHeight: canvas.height / SCALE };
    }

    // ── capital call ──
    function renderCall(out) {
      const list = scopedFunds();
      if (!list.length) return emptyState(out);
      const before = beginningDate();
      const after = endingDate();
      let html = '';
      const exportRows = [];
      const headers = ['Fund / investor', 'Commitment at ' + after, 'Funded at ' + before, 'Contributions ' + periodLabel(), 'Funded at ' + after, '% funded',
        'Unfunded at ' + before, 'Unfunded at ' + after, 'Called, not yet received at ' + after, 'Deferred capital call at ' + after];
      html += '<div class="tablewrap"><table><thead><tr>' +
        `<th class="l" data-col="0">${sortHeader()}</th>` + headers.slice(1).map((h, i) => `<th data-col="${i + 1}">${esc(h)}</th>`).join('') + '</tr></thead><tbody>';
      const totals = new Map();
      list.forEach(fund => {
        const code = fund.currency_code || '';
        const grand = currencyTotalFor(totals, fund, () => Array(8).fill(0));
        const rows = ledgerByFund.get(fund.fund_uuid) || [];
        const commitments = effectiveCommitments(fund.fund_uuid, state.end);
        const cc = capitalCall(rows, commitments, state.start, state.end);
        const partners = orderPartners(Array.from(cc, ([id, p]) => ({ id, ...partnerInfo(fund.fund_uuid, id), ...p }))
          .filter(p => p.commitment != null || p.fundedEnd !== 0), state.sort);
        const t = (k) => sum(partners.map(p => p[k] || 0));
        const tot = [t('commitment'), t('fundedBegin'), t('contributed'), t('fundedEnd'), t('commitment') ? t('fundedEnd') / t('commitment') : null,
          t('unfundedBegin'), t('unfundedEnd'), t('receivable'), t('deferred')];
        const open = state.expandAll !== null ? state.expandAll : (state.expanded.has(fund.fund_uuid) || list.length === 1);
        const cells = v => v.map((x, i) => i === 4 ? `<td class="num">${percent(x)}</td>` : numCell(money(x, code), x)).join('');
        html += `<tr class="fund" data-fund="${esc(fund.fund_uuid)}"><td class="l" title="${esc(fund.fund_name)}"><span aria-hidden="true">${open ? '▾' : '▸'}</span> ${esc(fund.fund_name)}</td>${cells(tot)}</tr>`;
        exportRows.push([fund.fund_name, '(fund total)', code, ...tot.map((x, i) => i === 4 ? (x == null ? '' : (x * 100).toFixed(2) + '%') : x.toFixed(2))]);
        tot.forEach((x, i) => { if (i !== 4) grand[i < 4 ? i : i - 1] += x; });
        partners.forEach(p => {
          const v = [p.commitment, p.fundedBegin, p.contributed, p.fundedEnd, p.commitment ? p.fundedEnd / p.commitment : null,
            p.unfundedBegin, p.unfundedEnd, p.receivable, p.deferred];
          const label = recordLabel(fund.fund_uuid, p.id);
          if (open) html += `<tr class="partner"><td class="l" style="padding-left:32px" title="${esc(label)}">${esc(label)}</td>${cells(v)}</tr>`;
          exportRows.push([fund.fund_name, label, code, ...v.map((x, i) => x == null ? '' : i === 4 ? (x * 100).toFixed(2) + '%' : x.toFixed(2))]);
        });
      });
      if (list.length > 1) {
        for (const { code, label, total: grand } of currencyTotals(totals)) {
          const g = [...grand.slice(0, 4), grand[0] ? grand[3] / grand[0] : null, ...grand.slice(4)];
          html += `<tr class="total"><td class="l">${esc(label)}</td>${g.map((x, i) => i === 4 ? `<td class="num">${percent(x)}</td>` : numCell(money(x, code), x)).join('')}</tr>`;
          exportRows.push([label, '', code, ...g.map((x, i) => i === 4 ? (x == null ? '' : (x * 100).toFixed(2) + '%') : x.toFixed(2))]);
        }
      }
      out.innerHTML = html + '</tbody></table></div>';
      // The export splits the first column into Fund and Investor and adds Currency, as the rollforward export does.
      lastExport = { headers: ['Fund', 'Investor', 'Currency', ...headers.slice(1)], rows: exportRows };
      document.getElementById('footnote').textContent =
        `Beginning is the close of the month before "From" (${before}); ending is the close of the "To" month (${after}). Unfunded = commitment less capital contributed within it; contributions outside the commitment do not reduce it. Commitment is the one in force at ${after}.`;
    }

    function emptyState(out) {
      out.innerHTML = '<div class="empty">No funds match this filter.</div>';
      lastExport = { headers: [], rows: [] };
    }

    function noRecords(out) {
      out.innerHTML = '<div class="empty">This investor has no partner records in the selected funds.</div>';
      lastExport = { headers: [], rows: [] };
    }

    // ── controls ──
    const $ = id => document.getElementById(id);

    function syncControls() {
      for (const tab of document.querySelectorAll('.tab')) tab.setAttribute('aria-selected', String(tab.dataset.view === state.view));
      for (const f of document.querySelectorAll('[data-for]')) f.hidden = !f.dataset.for.split(' ').includes(state.view);
      $('start').value = state.start; $('end').value = state.end;
      $('mode').value = state.mode;

      if (state.compare !== 'none') state.compare = resolveComparison(state.compare, state.start, state.end);
      $('compare').innerHTML = comparisonOptions(state.start, state.end)
        .map(k => `<option value="${k}"${k === state.compare ? ' selected' : ''}>${COMPARE_LABELS[k]}</option>`).join('');

      $('funds-label').textContent = pickerLabel(fundPickerEntries(funds, state.sort), state.selected);

      // A statement is always for one investor, so it opens on the largest; the walk can show everyone.
      const investors = investorChoices();
      if (state.investor && !investors.some(o => o.key === state.investor)) state.investor = '';
      // The statement's own pick is not carried to the walk, which opens on every investor.
      if (state.view !== 'statement' && state.investorAuto) { state.investor = ''; state.investorAuto = false; }
      if (state.view === 'statement' && !state.investor && investors.length) { state.investor = investors[0].key; state.investorAuto = true; }
      $('investor').innerHTML = (state.view === 'statement' ? '' : '<option value="">All investors</option>') +
        investors.map(o => `<option value="${esc(o.key)}"${o.key === state.investor ? ' selected' : ''}>${esc(o.label)}</option>`).join('');

      $('cols-pop').innerHTML = viewColumns(state.view)
        .map(c => `<label><input type="checkbox" data-col="${esc(c.hide)}"${state.hidden.has(c.hide) ? '' : ' checked'}> ${esc(c.label)}${isMemoBucket(c.label) ? ' (memo)' : ''}</label>`).join('') +
        (state.view === 'rollforward' ? `<label><input type="checkbox" id="memo-toggle"${state.includeMemo ? ' checked' : ''}> Show memo items (receivables, payables, deferrals)</label>` : '');
      syncExportButtons();
    }

    function syncExportButtons() {
      $('export').hidden = !downloads;
      $('export-pdf').hidden = !downloads || state.view !== 'statement';
    }

    // ── fund picker ──
    // Ticks are staged in `picker.pending` while the panel is open; Apply makes them the
    // selection, and closing any other way discards them.
    const picker = { pending: null, query: '' };
    const allFundIds = () => funds.map(f => f.fund_uuid);

    function openPicker() {
      picker.pending = state.selected.size === 0 ? new Set(allFundIds()) : new Set(state.selected);
      picker.query = '';
      $('funds-search').value = '';
      $('funds-panel').hidden = false;
      $('funds-label').setAttribute('aria-expanded', 'true');
      renderPicker();
      $('funds-search').focus();
    }

    function closePicker() {
      picker.pending = null;
      $('funds-panel').hidden = true;
      $('funds-label').setAttribute('aria-expanded', 'false');
    }

    function applyPicker() {
      if (!picker.pending || !canApplyPicker(picker.pending, state.selected, allFundIds())) return;
      state.selected = pickerSelection(picker.pending, allFundIds());
      state.expandAll = null;
      closePicker();
      render();
    }

    function checkbox(attrs, label, kind, meta) {
      return `<li class="combo-option${kind ? ' ' + kind : ''}" role="option"><label><input type="checkbox" ${attrs}> ` +
        `<span>${esc(label)}</span>${meta ? `<span class="combo-meta">${esc(meta)}</span>` : ''}</label></li>`;
    }

    function renderPicker() {
      const pending = picker.pending;
      const entries = fundPickerEntries(funds, state.sort);
      const visible = filterPickerEntries(entries, picker.query);
      const allIds = allFundIds();
      const rows = [];
      if (!picker.query) rows.push(checkbox(`data-all data-state="${familyState(pending, allIds)}"`, 'All funds', 'is-all'));
      for (const e of visible) {
        if (e.kind === 'fund') { rows.push(checkbox(`data-fund="${esc(e.fund.fund_uuid)}"${pending.has(e.fund.fund_uuid) ? ' checked' : ''}`, e.fund.fund_name)); continue; }
        const family = entries.find(x => x.kind === 'family' && x.id === e.id);
        const ids = family.members.map(f => f.fund_uuid);
        rows.push(checkbox(`data-family="${esc(e.id)}" data-state="${familyState(pending, ids)}"`, e.name, 'is-family', 'Fund family · ' + ids.length + ' funds'));
        for (const f of e.members) rows.push(checkbox(`data-fund="${esc(f.fund_uuid)}"${pending.has(f.fund_uuid) ? ' checked' : ''}`, f.fund_name, 'is-member'));
      }
      $('funds-list').innerHTML = rows.length > (picker.query ? 0 : 1) ? rows.join('')
        : `<li class="combo-empty">No funds match “${esc(picker.query)}”.</li>`;
      // A partly ticked family (or "All funds") shows a half-filled box, which only JS can set.
      for (const box of $('funds-list').querySelectorAll('input[data-state]')) {
        box.checked = box.dataset.state === 'all';
        box.indeterminate = box.dataset.state === 'some';
      }
      $('funds-clear').disabled = pending.size === 0;
      $('funds-apply').disabled = !canApplyPicker(pending, state.selected, allIds);
      $('funds-apply').textContent = pending.size ? `Apply (${pending.size})` : 'Apply';
    }

    function togglePickerBox(box) {
      const entries = fundPickerEntries(funds, state.sort);
      if (box.dataset.all !== undefined) picker.pending = toggleFamily(picker.pending, allFundIds());
      else if (box.dataset.family) {
        const family = entries.find(e => e.kind === 'family' && e.id === box.dataset.family);
        picker.pending = toggleFamily(picker.pending, family.members.map(f => f.fund_uuid));
      } else if (box.dataset.fund) {
        box.checked ? picker.pending.add(box.dataset.fund) : picker.pending.delete(box.dataset.fund);
      }
      renderPicker();
    }

    // ── header definitions ──
    // One tip box, fixed to the window so the table's scroll area and sticky cells never clip it.
    // It opens from an info icon on hover, keyboard focus or a tap, and closes on Escape or scroll.
    const TIP_MARGIN = 8;

    function showTip(icon) {
      const tip = $('tip');
      tip.innerHTML = '<b></b><span></span>';
      tip.firstChild.textContent = icon.dataset.term;
      tip.lastChild.textContent = icon.dataset.help;
      tip.hidden = false;
      const at = icon.getBoundingClientRect();
      const width = tip.offsetWidth;
      const height = tip.offsetHeight;
      const left = Math.min(Math.max(TIP_MARGIN, at.left + at.width / 2 - width / 2), window.innerWidth - width - TIP_MARGIN);
      const below = at.bottom + TIP_MARGIN;
      tip.style.left = left + 'px';
      tip.style.top = (below + height > window.innerHeight - TIP_MARGIN ? Math.max(TIP_MARGIN, at.top - TIP_MARGIN - height) : below) + 'px';
    }

    function hideTip() { $('tip').hidden = true; }

    // ── column widths ──
    // Widths come from columnWidths; a long name ends in "…" with the full name on hover. A dragged
    // width lasts per tab until a double-click on the column's edge resets it.
    const COLUMN_MIN = 48;

    function sizeColumns(table, view) {
      const heads = Array.from(table.tHead.rows[0].cells);
      const saved = state.widths[view] || (state.widths[view] = {});
      const widths = columnWidths(heads.map(th => Math.ceil(th.getBoundingClientRect().width)), heads.map(th => th.dataset.col), saved);
      table.insertAdjacentHTML('afterbegin', '<colgroup>' + widths.map(w => `<col style="width:${w}px">`).join('') + '</colgroup>');
      table.style.width = sum(widths) + 'px';
      table.classList.add('sized');
      heads.forEach((th, i) => {
        if (!th.querySelector('[title], .info')) th.title = th.textContent.trim();
        th.insertAdjacentHTML('beforeend', `<span class="col-resize" data-resize="${i}" title="Drag to resize; double-click to reset"></span>`);
      });
      for (const row of table.tBodies[0].rows) {
        if (row.cells[0] && !row.cells[0].title) row.cells[0].title = row.cells[0].textContent.trim();
      }
    }

    function startColumnResize(e, handle) {
      e.preventDefault();
      const table = handle.closest('table');
      const col = table.querySelectorAll('col')[Number(handle.dataset.resize)];
      const key = handle.parentElement.dataset.col;
      const view = state.view;
      const startX = e.clientX;
      const startWidth = parseFloat(col.style.width);
      const startTable = parseFloat(table.style.width);
      const move = ev => {
        const width = Math.max(COLUMN_MIN, Math.round(startWidth + ev.clientX - startX));
        col.style.width = width + 'px';
        table.style.width = (startTable - startWidth + width) + 'px';
        state.widths[view][key] = width;
      };
      const stop = () => { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', stop); };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', stop);
    }

    function render() {
      syncControls();
      hideTip();
      const out = $('out');
      lastStatements = [];
      if (state.start > state.end) { out.innerHTML = '<div class="empty">The start month is after the end month.</div>'; lastExport = { headers: [], rows: [] }; return; }
      ({ rollforward: renderRollforward, walk: renderWalk, statement: renderStatement, call: renderCall })[state.view](out);
      const table = out.querySelector('table');
      if (table) sizeColumns(table, state.view);
      const notes = [];
      if (new Set(scopedFunds().map(f => f.currency_code || '')).size > 1) {
        notes.push('<div class="banner warn">These funds report in more than one currency, so totals are shown per currency and never added across them.</div>');
      }
      for (const n of loadNotes) notes.push(`<div class="banner warn">${esc(n)}</div>`);
      $('notes').innerHTML = notes.join('');
    }

    function wire() {
      $('tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) { state.view = t.dataset.view; render(); } });
      $('funds-label').addEventListener('click', () => (picker.pending ? closePicker() : openPicker()));
      $('funds-search').addEventListener('input', e => { picker.query = e.target.value; renderPicker(); });
      $('funds-list').addEventListener('change', e => { if (e.target.matches('input[type="checkbox"]')) togglePickerBox(e.target); });
      $('funds-clear').addEventListener('click', () => { picker.pending = new Set(); renderPicker(); });
      $('funds-apply').addEventListener('click', applyPicker);
      document.addEventListener('click', e => { if (picker.pending && !$('funds-combo').contains(e.target)) closePicker(); });
      document.addEventListener('keydown', e => {
        if (!picker.pending) return;
        if (e.key === 'Escape') { closePicker(); $('funds-label').focus(); }
        else if (e.key === 'Enter' && e.target === $('funds-search')) applyPicker();
      });
      $('investor').addEventListener('change', e => { state.investor = e.target.value; state.investorAuto = false; render(); });
      $('start').addEventListener('change', e => { if (e.target.value) { state.start = e.target.value; render(); } });
      $('end').addEventListener('change', e => { if (e.target.value) { state.end = e.target.value; render(); } });
      $('mode').addEventListener('change', e => { state.mode = e.target.value; render(); });
      $('compare').addEventListener('change', e => { state.compare = e.target.value; render(); });
      $('cols-pop').addEventListener('change', e => {
        if (e.target.id === 'memo-toggle') state.includeMemo = e.target.checked;
        else if (e.target.dataset.col) { e.target.checked ? state.hidden.delete(e.target.dataset.col) : state.hidden.add(e.target.dataset.col); }
        render();
        document.querySelector('#cols-pop').closest('details').open = true;
      });
      const withInfo = show => e => { const icon = e.target.closest('.info'); if (icon) show(icon); };
      $('out').addEventListener('mouseover', withInfo(showTip));
      $('out').addEventListener('mouseout', withInfo(hideTip));
      $('out').addEventListener('focusin', withInfo(showTip));
      $('out').addEventListener('focusout', withInfo(hideTip));
      $('out').addEventListener('click', withInfo(showTip));
      document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
      document.addEventListener('scroll', hideTip, true);
      $('out').addEventListener('pointerdown', e => { const handle = e.target.closest('.col-resize'); if (handle) startColumnResize(e, handle); });
      $('out').addEventListener('dblclick', e => {
        const handle = e.target.closest('.col-resize');
        if (handle) { delete state.widths[state.view][handle.parentElement.dataset.col]; render(); }
      });
      $('out').addEventListener('click', e => {
        if (e.target.closest('.col-resize')) return;
        if (e.target.closest('[data-sort]')) { state.sort = state.sort === 'name' ? 'size' : 'name'; render(); return; }
        const row = e.target.closest('tr.fund');
        if (!row) return;
        state.expandAll = null;
        const id = row.dataset.fund;
        state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
        render();
      });
      $('export').addEventListener('click', () => {
        if (lastExport.headers.length) saveFile('partner-rollforward-' + state.view + '.csv', csvFile(lastExport.headers, lastExport.rows));
      });
      $('export-pdf').addEventListener('click', () => {
        if (lastStatements.length) saveFile('capital-account-statement.pdf', pdfDocument(statementPdfPages(statementPdfDoc(lastStatements), rasterizeText)));
      });
      // The viewer saves files only through its downloads capability; without it there is no export.
      Promise.resolve(window.claude?.use?.('downloads') ?? null).catch(() => null).then(d => { downloads = d; syncExportButtons(); });
    }

    let downloads = null;
    const SAVE_UNAVAILABLE = new Set(['unavailable', 'not_granted', 'capability_disabled', 'capability_removed']);

    async function saveFile(filename, data) {
      if (!downloads) return;
      try {
        await downloads.save({ filename, data });
      } catch (err) {
        const code = err && err.code;
        if (code === 'declined') return;
        if (SAVE_UNAVAILABLE.has(code)) { downloads = null; syncExportButtons(); }
        status(code === 'rate_limited' ? 'A save is already waiting for you to confirm.' : 'Could not export from this view.');
        setTimeout(() => status(''), 4000);
      }
    }

    async function ensureSession() {
      if (!welcomeCalled) {
        try {
          const res = await callCartaTool(WELCOME_TOOL, {});
          if (!res || !res.isError) welcomeCalled = true;
        } catch (err) { console.warn('welcome failed: ' + (err && err.message ? err.message : err)); }
      }
      if (!FIRM_CONTEXT_ID) return;
      try {
        const ctx = await callCartaTool('set_context', { firm_id: FIRM_CONTEXT_ID });
        if (ctx && ctx.isError) console.warn('could not pin the firm context; rows may be another firm\'s');
      } catch (err) { console.warn('could not pin the firm context: ' + (err && err.message ? err.message : err)); }
    }

    function index(rows, into, keep) {
      for (const r of rows) {
        if (!into.has(r.fund_uuid)) into.set(r.fund_uuid, []);
        into.get(r.fund_uuid).push(keep(r));
      }
    }

    function currentMonth() {
      const now = new Date();
      return now.getUTCFullYear() + '-' + String(now.getUTCMonth() + 1).padStart(2, '0');
    }

    async function init() {
      $('scope').textContent = CONFIG.firm_name ? CONFIG.firm_name + ' · all funds' : '';
      status('Connecting to Carta…');
      if (!(await mcpNamespace())) { fail(new Error('this report reads live data, and no Carta connector is available in this view')); return; }
      await ensureSession();
      try {
        status('Loading funds…');
        const fundRes = await queryAll(fundsSql(), 'Loading funds');
        funds = fundRes.rows;
        if (!funds.length) { fail(new Error('no funds with partner activity were found for this firm')); return; }
        currencyRanking = currencyOrder(funds);

        let dropped = fundRes.skipped;
        let loaded = 0;
        await forEachLimited(funds, LOAD_CONCURRENCY, async fund => {
          const label = `Loading ${fund.fund_name}`;
          const [partnerRes, navRes, ledgerRes] = await Promise.all([
            queryAll(partnersSql(fund.fund_uuid), label),
            queryAll(navSql(fund.fund_uuid), label),
            queryAll(allocationsSql(fund.fund_uuid), label),
          ]);
          const partners = new Map();
          for (const p of partnerRes.rows) partners.set(p.partner_id, p);
          partnersByFund.set(fund.fund_uuid, partners);
          index(navRes.rows, navByFund, r => ({ partner_id: r.partner_id, month: r.month, commitment: r.commitment, ending_nav: r.ending_nav }));
          index(ledgerRes.rows, ledgerByFund, r => ({ partner_id: r.partner_id, bucket: r.bucket, month: r.month, amount: Number(r.amount) || 0 }));
          dropped += partnerRes.skipped + navRes.skipped + ledgerRes.skipped;
          status(`Loaded ${++loaded} of ${funds.length} funds…`);
        });
        for (const [fundId, rows] of ledgerByFund) for (const r of rows) {
          if (!dataMonths.min || r.month < dataMonths.min) dataMonths.min = r.month;
          if (!dataMonths.max || r.month > dataMonths.max) dataMonths.max = r.month;
          if (!firstMonthByFund.has(fundId) || r.month < firstMonthByFund.get(fundId)) firstMonthByFund.set(fundId, r.month);
        }
        // Funds are ordered here, after the ledger is read: newest vintage first, a fund
        // with no vintage date by its first month of ledger activity.
        for (const f of funds) {
          const first = firstMonthByFund.get(f.fund_uuid);
          f.recency = f.vintage_date ? String(f.vintage_date).slice(0, 10) : first ? first + '-01' : '';
        }
        if (dropped) loadNotes.push(dropped + ' row(s) could not be read and were left out, so some balances may not tie out.');
        Object.assign(state, defaultPeriod(dataMonths.min, dataMonths.max, currentMonth()));
        status('');
        $('app').hidden = false;
        wire();
        render();
        // Natural widths are measured from the rendered text, so measure again once the web font is in.
        if (document.fonts) document.fonts.ready.then(render);
      } catch (err) { fail(err); }
    }

    init();
  </script>
</body>
</html>
