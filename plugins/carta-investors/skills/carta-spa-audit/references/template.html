<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>{{STYLES}}</style>
</head>
<body>
  <div class="container">
    <div class="header" id="page-header"></div>

    <div class="coverage-bar-section" id="coverage-bar"></div>

    <div class="metrics-grid" id="metrics-grid"></div>

    <div id="upload-cta"></div>

    <div class="status-bar" id="status-bar"></div>

    <div class="table-title">Portfolio companies — SPA coverage</div>
    <div class="table-toolbar">
      <div class="filter-group">
        <div class="filter-bar" id="filter-bar"></div>
        <div class="fund-filter-wrap" id="fund-filter-wrap"></div>
        <div class="fund-filter-wrap" id="geo-filter-wrap"></div>
      </div>
      <div class="table-search">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="6" cy="6" r="4.5"/>
          <path d="M9.5 9.5 L12.5 12.5" stroke-linecap="round"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search companies…" aria-label="Search companies" oninput="setSearch(this.value)">
      </div>
    </div>
    <div class="table-container" id="main-table"></div>
    <div class="footer-note" id="footer-note"></div>

    <div class="page-footer" id="page-footer"></div>
  </div>

  <div class="drawer-backdrop" id="backdrop" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <button class="drawer-close" onclick="closeDrawer()" aria-label="Close drawer">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <path d="M2 2 L10 10 M10 2 L2 10"/>
      </svg>
    </button>
    <h2 id="drawer-title"></h2>
    <div class="drawer-subtitle" id="drawer-subtitle"></div>
    <div id="drawer-content"></div>
  </div>

  <script>
    const DATA = {{DATA}};

    // ---------- Formatters ----------
    function fmtMoney(n) {
        if (n === null || n === undefined) return '—';
        if (n === 0) return '$0';
        return '$' + Math.round(n).toLocaleString('en-US');
    }
    function fmtPrice(n) {
        if (n === null || n === undefined) return '—';
        return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function fmtNum(n) {
        if (n === null || n === undefined) return '—';
        return n.toLocaleString('en-US');
    }
    // Compact variants — used in the drawer to keep the Shares / Amount paid
    // columns narrow. Full-precision value is surfaced via a `title` tooltip.
    function compactSuffix(n) {
        const abs = Math.abs(n);
        if (abs >= 1e9) return [n / 1e9, 'B'];
        if (abs >= 1e6) return [n / 1e6, 'M'];
        if (abs >= 1e3) return [n / 1e3, 'K'];
        return [n, ''];
    }
    function trim1(x) { return x.toFixed(1).replace(/\.0$/, ''); }
    function fmtMoneyCompact(n) {
        if (n === null || n === undefined) return '—';
        if (n === 0) return '$0';
        const [v, suf] = compactSuffix(n);
        return suf ? '$' + trim1(v) + suf : '$' + Math.round(v).toLocaleString('en-US');
    }
    function fmtNumCompact(n) {
        if (n === null || n === undefined) return '—';
        const [v, suf] = compactSuffix(n);
        return suf ? trim1(v) + suf : Math.round(v).toLocaleString('en-US');
    }
    // SPA amounts are denominated in whatever currency the document stated, so
    // they render with an explicit code rather than a hardcoded '$'. A null
    // code means the document named no currency: show the bare number and let
    // the caller footnote it, rather than implying one.
    function ccyTag(ccy) { return ccy ? ' ' + ccy : '*'; }
    function fmtAmountCcy(n, ccy) {
        if (n === null || n === undefined) return '—';
        return Math.round(n).toLocaleString('en-US') + ccyTag(ccy);
    }
    function fmtPriceCcy(n, ccy) {
        if (n === null || n === undefined) return '—';
        return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ccyTag(ccy);
    }
    function fmtAmountCcyCompact(n, ccy) {
        if (n === null || n === undefined) return '—';
        if (n === 0) return '0' + ccyTag(ccy);
        const [v, suf] = compactSuffix(n);
        return (suf ? trim1(v) + suf : Math.round(v).toLocaleString('en-US')) + ccyTag(ccy);
    }
    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escAttr(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }

    // ---------- External links ----------
    // The Claude Desktop preview pane sandboxes the artifact and blocks
    // <a target="_blank"> navigation to non-localhost URLs. The save server
    // runs as a local process OUTSIDE the sandbox and exposes POST /open-url,
    // which opens the URL in the system default browser. We POST as text/plain
    // to avoid a CORS preflight; if the save server is unreachable (e.g. Cowork,
    // or SAVE_PORT not substituted) we fall back to window.open().
    const SAVE_PORT = '{{SAVE_PORT}}';
    // Base Carta web URL for the environment this audit was built from
    // (resolved at generation time). Falls back to production if unsubstituted.
    const RAW_BASE_URL = '{{BASE_URL}}';
    const CARTA_BASE_URL = /^https:\/\//.test(RAW_BASE_URL) ? RAW_BASE_URL.replace(/\/$/, '') : 'https://app.carta.com';
    function openExternal(url) {
        const fallback = () => window.open(url, '_blank', 'noopener');
        if (!/^\d+$/.test(SAVE_PORT)) { fallback(); return; }
        fetch('http://127.0.0.1:' + SAVE_PORT + '/open-url', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ url: url })
        }).then(r => { if (!r.ok) fallback(); }).catch(fallback);
    }

    // ---------- Bucket metadata ----------
    // Four bucket tiles. Pending-extraction is NOT a bucket — pending docs
    // can't be attributed to specific portfolio companies until extraction
    // completes (the issuer_name comes from extraction), so promoting them
    // to a bucket tile would imply a precision we don't have. The pending
    // count is surfaced as an FYI pill in the page-header instead (see
    // renderHeader below).
    const BUCKETS = [
        { key: 'executed',   label: 'Executed',   filterLabel: 'Executed SPA',     icon: '✓', cardClass: 'bucket-executed',   muted: true  },
        { key: 'unexecuted', label: 'Unexecuted', filterLabel: 'SPA not executed', icon: '○', cardClass: 'bucket-unexecuted', muted: false },
        { key: 'missing',    label: 'Missing',    filterLabel: 'Missing SPA',      icon: '✕', cardClass: 'bucket-missing',    muted: false },
        { key: 'notNeeded',  label: 'No SPA Needed', filterLabel: 'No SPA needed', icon: '—', cardClass: 'bucket-not-needed', muted: true,
          helpText: 'Covers investments that don\'t use Stock Purchase Agreements: SAFEs, convertible notes, fund / LP positions, tokens, and warrants. These have their own document types and don\'t need an SPA on file. SAFEs and convertible notes will move into a different bucket if and when they convert into preferred or common equity.' },
    ];

    // ---------- Status filter (All / Live / Exited) ----------
    let STATUS_FILTER = 'all';

    function passesStatusFilter(companyName) {
        if (STATUS_FILTER === 'all') return true;
        const s = DATA.companyStatus;
        if (!s || !(companyName in s)) return false;
        return STATUS_FILTER === 'live' ? s[companyName] === true : s[companyName] === false;
    }

    function filteredBucketRows(b) {
        const rows = DATA.buckets[b.key] || [];
        if (STATUS_FILTER === 'all' || !DATA.companyStatus) return rows;
        return rows.filter(r => passesStatusFilter(r.company));
    }

    function filteredBucketRowsByKey(key) {
        const b = BUCKETS.find(bkt => bkt.key === key);
        return b ? filteredBucketRows(b) : [];
    }

    function bucketCount(b) {
        return filteredBucketRows(b).length;
    }

    // ---------- Header (firm name + coverage line + pending pill) ----------
    // Coverage % rides in the page header as a small contextual line. When
    // there are pending-extraction docs, a hover-tooltipped pill chip sits
    // inline in the subtitle to surface the count without claiming any
    // company-level attribution.
    function renderHeader() {
        const m = DATA.meta;
        const c = DATA.coverage;
        const pending = c.pendingExtractionDocs || 0;
        const pendingPill = pending > 0
            ? ' · <span class="pending-pill has-tooltip" tabindex="0" aria-describedby="pending-tooltip">' +
                '<span class="pending-pill-icon" aria-hidden="true">ⓘ</span>' +
                '<span class="pending-pill-text">' + pending + ' pending extraction</span>' +
                '<span class="tooltip" id="pending-tooltip" role="tooltip">' +
                    'Heads up: ' + pending + ' SPA documents are still being processed by Carta\'s Document Intelligence. ' +
                    'Once extraction completes, they\'ll appear in this audit and may move companies out of "Missing SPA."' +
                '</span>' +
              '</span>'
            : '';
        const orphaned = c.orphanedSpas || 0;
        const orphanedNames = c.orphanedSpaNames || [];
        const orphanWord = orphaned === 1 ? 'SPA' : 'SPAs';
        const orphanedPill = orphaned > 0
            ? ' · <span class="orphaned-pill has-tooltip" tabindex="0" aria-describedby="orphaned-tooltip">' +
                '<span class="orphaned-pill-icon" aria-hidden="true">ⓘ</span>' +
                '<span class="orphaned-pill-text">' + orphaned + ' unmatched ' + orphanWord + '</span>' +
                '<span class="tooltip" id="orphaned-tooltip" role="tooltip">' +
                    orphaned + ' ' + orphanWord + ' on file couldn\'t be linked to a portfolio company. ' +
                    'Typically name mismatches (e.g. SPA filed under "Acme Holdings Inc." vs. investment recorded as "Acme"), ' +
                    'parent vs. subsidiary entities, or SPAs uploaded for investments not yet booked. ' +
                    'Compare names in your portfolio against the source SPA documents to reconcile.' +
                    (orphanedNames.length > 0
                        ? '<ul style="margin:6px 0 0;padding-left:14px;list-style:disc;">' +
                            orphanedNames.map(n => '<li>' + esc(n) + '</li>').join('') +
                          '</ul>'
                        : '') +
                '</span>' +
              '</span>'
            : '';
        // Coverage subtitle removed per design — coverage now lives in the
        // "Coverage by cost basis" section directly below the title. The
        // pending-extraction and unmatched-SPA FYI pills (when present) still
        // surface as their own line beneath the title.
        const fyiPills = (pendingPill + orphanedPill).replace(/^ · /, '');
        const fyiLine = fyiPills ? '<p>' + fyiPills + '</p>' : '';
        document.getElementById('page-header').innerHTML =
            '<h1>' + esc(m.firmName) + ' — SPA coverage audit</h1>' + fyiLine;
    }

    // ---------- Stat tiles — one per bucket ----------
    // Four tiles in a single auto-fit row. Gap buckets (Missing / Unexecuted)
    // read at full visual weight; the trailing two (Executed / No SPA needed)
    // use muted styling so the user's eye lands on the gaps first.
    function bucketTotal(key) {
        return filteredBucketRowsByKey(key).reduce((s, r) => s + (r.costBasis || 0), 0);
    }
    function renderMetricsGrid() {
        // Grand total across all buckets — each tile's cost basis is shown as
        // a share of this, rather than an absolute dollar figure.
        const grandTotal = BUCKETS.reduce((s, b) => s + bucketTotal(b.key), 0);
        const html = BUCKETS.map((b, i) => {
            const count = bucketCount(b);
            const total = bucketTotal(b.key);
            let sub = '';
            if (filteredBucketRows(b).length > 0) {
                const pct = grandTotal > 0 ? (total / grandTotal * 100) : 0;
                sub = pct.toFixed(1) + '% of total cost basis';
            }
            // Optional info icon + hover tooltip — used by tiles whose label
            // doesn't fully convey what's in the bucket (notably "No SPA
            // Needed" which covers SAFEs / convertibles / fund LPs / tokens).
            const helpIcon = b.helpText
                ? ' <span class="help-icon has-tooltip" tabindex="0" aria-describedby="tile-help-' + b.key + '">' +
                    'ⓘ' +
                    '<span class="tooltip tooltip--tile" id="tile-help-' + b.key + '" role="tooltip">' + esc(b.helpText) + '</span>' +
                  '</span>'
                : '';
            return '<div class="metric-card ' + b.cardClass + (b.muted ? ' metric-card--muted' : '') + '">' +
                '<div class="metric-label">' + b.icon + ' ' + esc(b.label) + helpIcon + '</div>' +
                '<div class="metric-value">' + count + '</div>' +
                (sub ? '<div class="metric-sub">' + sub + '</div>' : '') +
            '</div>';
        }).join('');
        document.getElementById('metrics-grid').innerHTML = html;
    }

    // ---------- Coverage bar — stacked bar with by-value / by-count toggle ----------
    let BAR_MODE = 'weight'; // 'weight' | 'count'
    function setBarMode(mode) { BAR_MODE = mode; renderCoverageBar(); }

    function renderCoverageBar() {
        const grand = BUCKETS.reduce((s, b) => s + bucketTotal(b.key), 0);
        if (grand <= 0) { document.getElementById('coverage-bar').innerHTML = ''; return; }

        const coveredVal = bucketTotal('executed') + bucketTotal('unexecuted');
        const valuePct = coveredVal / grand * 100;

        const covered = filteredBucketRowsByKey('executed').length + filteredBucketRowsByKey('unexecuted').length;
        const notNeededCount = filteredBucketRowsByKey('notNeeded').length;
        const totalCos = BUCKETS.reduce((s, b) => s + filteredBucketRows(b).length, 0);
        const equityCos = totalCos - notNeededCount;
        const countPct = equityCos > 0 ? Math.round(covered / equityCos * 100) : 0;

        const ORDER = [
            { key: 'executed',   label: 'Executed' },
            { key: 'unexecuted', label: 'Unexecuted' },
            { key: 'missing',    label: 'Missing' },
            { key: 'notNeeded',  label: 'No SPA needed' },
        ];

        const useCount = BAR_MODE === 'count';
        const totalForBar = useCount ? totalCos : grand;

        let segs = '', legend = '';
        ORDER.forEach(o => {
            const v = useCount ? filteredBucketRowsByKey(o.key).length : bucketTotal(o.key);
            if (v <= 0) return;
            const p = v / totalForBar * 100;
            const titleAttr = useCount
                ? escAttr(o.label + ': ' + v + ' companies (' + p.toFixed(1) + '%)')
                : escAttr(o.label + ': ' + fmtMoney(v) + ' (' + p.toFixed(1) + '%)');
            segs += '<div class="coverage-bar-seg ' + o.key + '" style="width:' + p + '%" title="' + titleAttr + '"></div>';
            legend += '<span class="item"><span class="swatch ' + o.key + '"></span>' +
                esc(o.label) + ' ' + p.toFixed(1) + '%</span>';
        });

        const headerValue = useCount
            ? countPct + '% of companies covered'
            : valuePct.toFixed(1) + '% of total cost basis covered';

        const toggleHtml =
            '<div class="bar-mode-toggle">' +
                '<button class="bar-mode-btn' + (!useCount ? ' active' : '') + '" onclick="setBarMode(\'weight\')" type="button">By value</button>' +
                '<button class="bar-mode-btn' + (useCount ? ' active' : '') + '" onclick="setBarMode(\'count\')" type="button">By count</button>' +
            '</div>';

        document.getElementById('coverage-bar').innerHTML =
            '<div class="coverage-bar-head">' +
                '<span class="label">Coverage</span>' +
                toggleHtml +
                '<span class="value">' + headerValue + '</span>' +
            '</div>' +
            '<div class="coverage-bar-track">' + segs + '</div>' +
            '<div class="coverage-legend">' + legend + '</div>';
    }

    // ---------- Upload CTAs — softer, action-oriented, split by gap type ----------
    function renderUploadCta() {
        const missing = filteredBucketRowsByKey('missing').length;
        const unexecuted = filteredBucketRowsByKey('unexecuted').length;
        const el = document.getElementById('upload-cta');
        if (missing === 0 && unexecuted === 0) {
            el.innerHTML = '';
            return;
        }
        const m = DATA.meta;
        const docsUrl = CARTA_BASE_URL + '/investors/firm/' + esc(m.firmCartaId) + '/portfolio/documents/';
        let html = '<div class="cta-row">';

        if (missing > 0) {
            const companyWord = missing === 1 ? 'company' : 'companies';
            html +=
                '<div class="cta-card cta-card--missing">' +
                    '<div class="cta-card-body">' +
                        '<div class="cta-card-title">Close the coverage gap</div>' +
                        '<div class="cta-card-text">Upload Stock Purchase Agreements for ' +
                            '<strong>' + missing + ' ' + companyWord + '</strong> ' +
                            'missing an SPA — unlocks co-investor analysis and more downstream skills.</div>' +
                    '</div>' +
                    '<button type="button" class="cta-card-action" onclick="openExternal(\'' + escAttr(docsUrl) + '\')">' +
                        'Upload missing SPAs <span aria-hidden="true">↗</span>' +
                    '</button>' +
                '</div>';
        }

        if (unexecuted > 0) {
            const spaWord = unexecuted === 1 ? 'SPA is' : 'SPAs are';
            const btnLabel = missing > 0 ? 'Upload SPAs' : 'Upload signed copy';
            html +=
                '<div class="cta-card cta-card--unexecuted">' +
                    '<div class="cta-card-body">' +
                        '<div class="cta-card-title">Get executed copies on file</div>' +
                        '<div class="cta-card-text"><strong>' + unexecuted + ' ' + spaWord + '</strong> ' +
                            'marked unexecuted — if you already have a signed copy, upload it now. If not, follow up with the issuer to get it signed.</div>' +
                    '</div>' +
                    '<button type="button" class="cta-card-action cta-card-action--secondary" onclick="openExternal(\'' + escAttr(docsUrl) + '\')">' +
                        btnLabel + ' <span aria-hidden="true">↗</span>' +
                    '</button>' +
                '</div>';
        }

        html += '</div>';
        el.innerHTML = html;
    }

    // ---------- Filter pills + search + sort state ----------
    let ACTIVE_FILTER = 'all';
    let SEARCH_QUERY = '';
    // Default sort: cost basis descending (matches what most users want first)
    let SORT_KEY = 'costBasis';
    let SORT_DIR = 'desc';

    // Enrichment-backed filters and columns only render when they have something
    // to show. A dropdown with one option can't narrow anything and a column
    // that's empty for every company is noise, so both stay hidden — which also
    // covers Query E being skipped entirely (no funds, no regions, no SOI values).
    function eachRow(fn) {
        Object.values(DATA.buckets).forEach(arr => arr.forEach(fn));
    }

    // Fund multi-select filter (needs 2+ funds to be able to narrow anything)
    let FUND_FILTER = [];  // empty = all funds shown
    const ALL_FUNDS = (() => {
        const s = new Set();
        eachRow(r => (r.funds || []).forEach(f => s.add(f)));
        return Array.from(s).sort();
    })();

    // Geography multi-select filter (needs 2+ populated region tags)
    let GEOGRAPHY_FILTER = [];  // empty = all regions shown
    const ALL_REGIONS = (() => {
        const s = new Set();
        eachRow(r => { if (r.regionTag && r.regionTag !== '—') s.add(r.regionTag.trim()); });
        return Array.from(s).sort();
    })();

    // SOI valuation column — hidden when no company has a value (every position
    // fully exited, or Query E skipped).
    const HAS_SOI_VALUATION = (() => {
        let found = false;
        eachRow(r => { if (r.soiValuation !== null && r.soiValuation !== undefined) found = true; });
        return found;
    })();

    // Sortable column definitions — keys must match row field names from process.py
    const COLUMNS = [
        { key: 'rowNum',        label: '#',              align: 'left',  sortable: false },
        { key: 'company',       label: 'Company',        align: 'left',  sortable: true,  type: 'string' },
        { key: 'bucketKey',     label: 'Status',         align: 'left',  sortable: true,  type: 'bucket' },
        { key: 'firstInvested', label: 'First invested', align: 'left',  sortable: true,  type: 'date' },
        { key: 'costBasis',     label: 'Cost basis',     align: 'right', sortable: true,  type: 'number' },
        { key: 'soiValuation',  label: 'SOI valuation',  align: 'right', sortable: true,  type: 'number' },
    ].filter(c => c.key !== 'soiValuation' || HAS_SOI_VALUATION);

    // Used for bucket-status sort ordering (lower = listed higher when ASC)
    const BUCKET_ORDER = { missing: 0, unexecuted: 1, executed: 2, notNeeded: 3 };

    function renderStatusFilterBar() {
        const s = DATA.companyStatus;
        // Query T is optional. Without it the Live/Exited tabs would show 0 and
        // filter the table to nothing, so render no bar when status is absent.
        if (!s || Object.keys(s).length === 0) {
            document.getElementById('status-bar').innerHTML = '';
            return;
        }
        const allCount = Object.keys(s).length;
        const liveCount = Object.values(s).filter(v => v === true).length;
        const exitedCount = Object.values(s).filter(v => v === false).length;

        function tab(id, label, count) {
            const active = STATUS_FILTER === id ? ' active' : '';
            return '<button class="status-tab' + active + '" onclick="setStatusFilter(\'' + id + '\')">' +
                label + '<span class="status-tab-count">' + count + '</span></button>';
        }

        document.getElementById('status-bar').innerHTML =
            tab('all', 'All', allCount) +
            tab('live', 'Live', liveCount) +
            tab('exited', 'Exited', exitedCount);
    }

    function setStatusFilter(filter) {
        STATUS_FILTER = filter;
        renderStatusFilterBar();
        renderMetricsGrid();
        renderCoverageBar();
        renderUploadCta();
        renderFilterBar();
        renderMainTable();
    }

    function renderFilterBar() {
        const total = BUCKETS.reduce((s, b) => s + filteredBucketRows(b).length, 0);
        let opts = '<option value="all"' + (ACTIVE_FILTER === 'all' ? ' selected' : '') + '>All companies (' + total + ')</option>';
        BUCKETS.forEach(b => {
            const count = filteredBucketRows(b).length;
            const sel = ACTIVE_FILTER === b.key ? ' selected' : '';
            opts += '<option value="' + b.key + '"' + sel + '>' + esc(b.filterLabel) + ' (' + count + ')</option>';
        });
        document.getElementById('filter-bar').innerHTML =
            '<label class="filter-select-label" for="filter-select">Show</label>' +
            '<select id="filter-select" class="filter-select" aria-label="Filter by SPA status" onchange="setFilter(this.value)">' + opts + '</select>';
    }
    function setFilter(key) {
        ACTIVE_FILTER = key;
        renderFilterBar();
        renderMainTable();
    }
    function setSearch(q) {
        SEARCH_QUERY = (q || '').toLowerCase().trim();
        renderMainTable();
    }
    // ── Fund filter ──────────────────────────────────────────────────────────
    // Panel markup is built once. Selection changes go through syncFundFilter()
    // instead of a rebuild: regenerating the panel drops its `open` class, which
    // would close the dropdown after every checkbox click.
    function renderFundFilter() {
        const wrap = document.getElementById('fund-filter-wrap');
        if (!wrap || ALL_FUNDS.length < 2) return;
        let items = '<label class="fund-option">'
            + '<input type="checkbox" data-fund-all onchange="clearFundFilter()">'
            + 'All funds</label><hr class="fund-sep">';
        ALL_FUNDS.forEach(f => {
            items += '<label class="fund-option">'
                + '<input type="checkbox" data-fund="' + escAttr(f) + '" onchange="toggleFundInput(this)">'
                + esc(f) + '</label>';
        });
        wrap.innerHTML =
            '<button class="fund-filter-btn" onclick="toggleFundDropdown()" aria-haspopup="listbox"></button>'
            + '<div class="fund-dropdown-panel" id="fund-dropdown-panel">' + items + '</div>';
        syncFundFilter();
    }
    function syncFundFilter() {
        const wrap = document.getElementById('fund-filter-wrap');
        if (!wrap) return;
        const none = FUND_FILTER.length === 0;
        const label = none ? 'Fund'
            : FUND_FILTER.length === 1 ? FUND_FILTER[0]
            : FUND_FILTER.length + ' funds';
        const btn = wrap.querySelector('.fund-filter-btn');
        if (btn) {
            btn.classList.toggle('active', !none);
            btn.innerHTML = esc(label) + ' <span class="fund-caret">▾</span>';
        }
        const all = wrap.querySelector('input[data-fund-all]');
        if (all) all.checked = none;
        wrap.querySelectorAll('input[data-fund]').forEach(cb => {
            cb.checked = FUND_FILTER.includes(cb.dataset.fund);
        });
    }
    function toggleFundDropdown() {
        const p = document.getElementById('fund-dropdown-panel');
        if (p) p.classList.toggle('open');
    }
    function toggleFundInput(el) { toggleFund(el.dataset.fund, el.checked); }
    function toggleFund(fund, checked) {
        if (checked) { if (!FUND_FILTER.includes(fund)) FUND_FILTER.push(fund); }
        else { FUND_FILTER = FUND_FILTER.filter(f => f !== fund); }
        syncFundFilter();
        renderMainTable();
    }
    function clearFundFilter() {
        FUND_FILTER = [];
        syncFundFilter();
        renderMainTable();
    }

    // ── Geography filter ──────────────────────────────────────────────────────
    function renderGeographyFilter() {
        const wrap = document.getElementById('geo-filter-wrap');
        if (!wrap || ALL_REGIONS.length < 2) return;
        let items = '<label class="fund-option">'
            + '<input type="checkbox" data-region-all onchange="clearGeographyFilter()">'
            + 'All regions</label><hr class="fund-sep">';
        ALL_REGIONS.forEach(r => {
            items += '<label class="fund-option">'
                + '<input type="checkbox" data-region="' + escAttr(r) + '" onchange="toggleRegionInput(this)">'
                + esc(r) + '</label>';
        });
        wrap.innerHTML =
            '<button class="fund-filter-btn" onclick="toggleGeoDropdown()" aria-haspopup="listbox"></button>'
            + '<div class="fund-dropdown-panel" id="geo-dropdown-panel">' + items + '</div>';
        syncGeographyFilter();
    }
    function syncGeographyFilter() {
        const wrap = document.getElementById('geo-filter-wrap');
        if (!wrap) return;
        const none = GEOGRAPHY_FILTER.length === 0;
        const label = none ? 'Geography'
            : GEOGRAPHY_FILTER.length === 1 ? GEOGRAPHY_FILTER[0]
            : GEOGRAPHY_FILTER.length + ' regions';
        const btn = wrap.querySelector('.fund-filter-btn');
        if (btn) {
            btn.classList.toggle('active', !none);
            btn.innerHTML = esc(label) + ' <span class="fund-caret">▾</span>';
        }
        const all = wrap.querySelector('input[data-region-all]');
        if (all) all.checked = none;
        wrap.querySelectorAll('input[data-region]').forEach(cb => {
            cb.checked = GEOGRAPHY_FILTER.includes(cb.dataset.region);
        });
    }
    function toggleGeoDropdown() {
        const p = document.getElementById('geo-dropdown-panel');
        if (p) p.classList.toggle('open');
    }
    function toggleRegionInput(el) { toggleGeography(el.dataset.region, el.checked); }
    function toggleGeography(region, checked) {
        if (checked) { if (!GEOGRAPHY_FILTER.includes(region)) GEOGRAPHY_FILTER.push(region); }
        else { GEOGRAPHY_FILTER = GEOGRAPHY_FILTER.filter(r => r !== region); }
        syncGeographyFilter();
        renderMainTable();
    }
    function clearGeographyFilter() {
        GEOGRAPHY_FILTER = [];
        syncGeographyFilter();
        renderMainTable();
    }

    function setSort(key) {
        if (SORT_KEY === key) {
            // Toggle direction on repeat click
            SORT_DIR = SORT_DIR === 'asc' ? 'desc' : 'asc';
        } else {
            SORT_KEY = key;
            // Numeric columns default to descending; string/date default ascending
            const col = COLUMNS.find(c => c.key === key);
            SORT_DIR = (col && col.type === 'number') ? 'desc' : 'asc';
        }
        renderMainTable();
    }

    // ---------- Main table ----------
    function renderMainTable() {
        // Flatten visible buckets into one sortable list, respecting both the
        // bucket filter (ACTIVE_FILTER) and the status filter (STATUS_FILTER).
        let rows = [];
        BUCKETS.forEach(b => {
            if (ACTIVE_FILTER === 'all' || ACTIVE_FILTER === b.key) {
                filteredBucketRows(b).forEach(r => {
                    rows.push({ ...r, bucketKey: b.key, bucketLabel: b.filterLabel });
                });
            }
        });

        // Apply search filter (substring match on company name, case-insensitive)
        if (SEARCH_QUERY) {
            rows = rows.filter(r => r.company.toLowerCase().includes(SEARCH_QUERY));
        }

        // Apply fund filter (multi-select; empty = all funds shown)
        if (FUND_FILTER.length > 0) {
            rows = rows.filter(r => {
                const rowFunds = r.funds || [];
                return FUND_FILTER.some(f => rowFunds.includes(f));
            });
        }

        // Apply geography filter (multi-select; empty = all regions shown)
        if (GEOGRAPHY_FILTER.length > 0) {
            rows = rows.filter(r => GEOGRAPHY_FILTER.includes((r.regionTag || '').trim()));
        }

        // Apply active sort
        const col = COLUMNS.find(c => c.key === SORT_KEY) || COLUMNS[4];
        const dir = SORT_DIR === 'asc' ? 1 : -1;
        rows.sort((a, b) => {
            let av, bv;
            if (col.type === 'number') {
                av = a[col.key] || 0;
                bv = b[col.key] || 0;
                if (av !== bv) return (av - bv) * dir;
            } else if (col.type === 'bucket') {
                av = BUCKET_ORDER[a.bucketKey] ?? 99;
                bv = BUCKET_ORDER[b.bucketKey] ?? 99;
                if (av !== bv) return (av - bv) * dir;
            } else if (col.type === 'date') {
                // firstInvested is "Mmm yyyy" — parse to a comparable yyyy-mm string
                av = parseMonthYear(a.firstInvested);
                bv = parseMonthYear(b.firstInvested);
                if (av !== bv) return av < bv ? -1 * dir : 1 * dir;
            } else {
                av = (a[col.key] || '').toString();
                bv = (b[col.key] || '').toString();
                if (av !== bv) return av.localeCompare(bv) * dir;
            }
            // Stable tiebreaker: cost basis DESC, then company ASC
            const cbDiff = (b.costBasis || 0) - (a.costBasis || 0);
            if (cbDiff !== 0) return cbDiff;
            return a.company.localeCompare(b.company);
        });

        if (rows.length === 0) {
            const empty = SEARCH_QUERY
                ? 'No companies match "' + esc(SEARCH_QUERY) + '".'
                : 'No companies in this view.';
            document.getElementById('main-table').innerHTML =
                '<div class="empty-bucket">' + empty + '</div>';
            return;
        }

        // Header row with sort indicators
        let html = '<table><thead><tr>';
        COLUMNS.forEach(c => {
            const alignStyle = c.align === 'right' ? ' style="text-align:right"' : '';
            if (!c.sortable) {
                html += '<th' + alignStyle + '>' + esc(c.label) + '</th>';
            } else {
                const active = SORT_KEY === c.key;
                const caret = active ? (SORT_DIR === 'asc' ? '▲' : '▼') : '↕';
                const cls = 'sortable' + (active ? ' sort-active' : '');
                html += '<th class="' + cls + '"' + alignStyle + ' onclick="setSort(\'' + c.key + '\')" aria-sort="' + (active ? SORT_DIR + 'ending' : 'none') + '">' + esc(c.label) + '<span class="sort-caret">' + caret + '</span></th>';
            }
        });
        html += '</tr></thead><tbody>';

        rows.forEach((r, i) => {
            // Drill-down dict is keyed by the SPA-side ISSUER_NAME, which often
            // differs from the audit-side company name (e.g. "Polaris Robotics"
            // vs "Polaris Robotics, Inc."). process.py stamps drillDownKey onto
            // bucket entries from Query A's SPA_NAME column; fall back to the
            // company name for exact-match cases and pre-drillDownKey caches.
            const dKey = r.drillDownKey || r.company;
            const hasDrillDown = !!DATA.companies[dKey];
            const clickAttr = hasDrillDown
                ? ' class="clickable" onclick="openDrawer(\'' + escAttr(dKey) + '\')"'
                : '';
            const badgeClass = r.bucketKey === 'notNeeded' ? 'notNeeded' : r.bucketKey;
            html += '<tr' + clickAttr + '>' +
                '<td>' + (i + 1) + '</td>' +
                '<td class="company-name">' + esc(r.company) + (hasDrillDown ? '<span class="row-caret" aria-hidden="true">›</span>' : '') + '</td>' +
                '<td><span class="bucket-badge ' + badgeClass + '">' + esc(r.bucketLabel) + '</span></td>' +
                '<td>' + esc(r.firstInvested) + '</td>' +
                '<td class="number">' + fmtMoney(r.costBasis) + '</td>' +
                (HAS_SOI_VALUATION ? '<td class="number">' + fmtMoney(r.soiValuation) + '</td>' : '') +
                '</tr>';
        });
        html += '</tbody></table>';
        document.getElementById('main-table').innerHTML = html;
    }

    // Parse "Mmm yyyy" → "yyyy-mm" for date sorting. Unparseable values sort first when ASC.
    function parseMonthYear(s) {
        if (!s || s === '—') return '0000-00';
        const m = s.match(/^([A-Za-z]{3})\s+(\d{4})$/);
        if (!m) return s;
        const months = { Jan:'01', Feb:'02', Mar:'03', Apr:'04', May:'05', Jun:'06',
                         Jul:'07', Aug:'08', Sep:'09', Oct:'10', Nov:'11', Dec:'12' };
        return m[2] + '-' + (months[m[1]] || '00');
    }

    // ---------- Footer note + page footer ----------
    function renderFooterNote() {
        document.getElementById('footer-note').innerHTML =
            'Click any company with a Status of "Executed SPA" or "SPA not executed" to view the underlying SPA documents and purchaser breakdown.';
    }
    function renderPageFooter() {
        const m = DATA.meta;
        const docsUrl = CARTA_BASE_URL + '/investors/firm/' + esc(m.firmCartaId) + '/portfolio/documents/';
        const html = '<a class="carta-link" href="#" onclick="openExternal(\'' + escAttr(docsUrl) + '\'); return false;">View SPA source documents in Carta ↗</a>';
        document.getElementById('page-footer').innerHTML = html;
    }

    // ---------- Drawer ----------
    function openDrawer(company) {
        const data = DATA.companies[company];
        if (!data || !data.spas || data.spas.length === 0) return;
        document.getElementById('drawer-title').textContent = company;
        const spaWord = data.spas.length === 1 ? 'SPA' : 'SPAs';
        document.getElementById('drawer-subtitle').textContent =
            data.spas.length + ' ' + spaWord + ' on file · First invested ' + data.firstInvested + ' · ' + fmtMoney(data.costBasis) + ' cost basis';

        let html = '';
        data.spas.forEach(spa => {
            const execChip = spa.executed
                ? '<span class="bucket-badge executed">Executed</span>'
                : '<span class="bucket-badge unexecuted">Not executed</span>';
            const meta = [
                spa.shareClass !== '—' ? spa.shareClass : null,
                spa.transactionDate !== '—' ? 'Closed ' + spa.transactionDate : null,
                spa.uploadDate !== '—' ? 'Uploaded ' + spa.uploadDate : null,
            ].filter(Boolean).join(' · ');
            html +=
                '<div class="drawer-spa-label">' +
                    '<span>SPA #' + spa.num + '</span>' +
                    execChip +
                    (meta ? '<span class="drawer-spa-meta">' + esc(meta) + '</span>' : '') +
                '</div>';

            if (spa.purchasers.length === 0) {
                html += '<div class="empty-bucket" style="margin: 0 0 12px;">No purchaser rows extracted from this SPA.</div>';
                return;
            }

            // Compute totalAmount before the row loop so we can show % of round per purchaser
            const totalAmount = spa.purchasers.reduce((s, p) => s + (p.amountPaid || 0), 0);
            html += '<div class="table-container"><table><thead><tr>' +
                '<th>Purchaser</th>' +
                '<th>Type</th>' +
                '<th style="text-align:right">Shares</th>' +
                '<th style="text-align:right">Price/share</th>' +
                '<th style="text-align:right">Amount paid</th>' +
                '<th style="text-align:right">% of round</th>' +
                '</tr></thead><tbody>';
            const sorted = [...spa.purchasers].sort((a, b) => (b.shares || 0) - (a.shares || 0));
            sorted.forEach(p => {
                const pct = totalAmount > 0 && p.amountPaid != null
                    ? (p.amountPaid / totalAmount * 100).toFixed(1) + '%'
                    : '—';
                html += '<tr>' +
                    '<td class="purchaser-name">' + esc(p.name) + '</td>' +
                    '<td class="entity-type"><span class="tag tag-neutral">' + esc(p.entityType || '—') + '</span></td>' +
                    '<td class="number" title="' + escAttr(fmtNum(p.shares)) + '">' + fmtNumCompact(p.shares) + '</td>' +
                    '<td class="number">' + fmtPriceCcy(p.pricePerShare, spa.currency) + '</td>' +
                    '<td class="number" title="' + escAttr(fmtAmountCcy(p.amountPaid, spa.currency)) + '">' + fmtAmountCcyCompact(p.amountPaid, spa.currency) + '</td>' +
                    '<td class="number">' + pct + '</td>' +
                    '</tr>';
            });
            // Safe to total: every purchaser row within one SPA shares that
            // SPA's currency. Never total across SPAs.
            const totalShares = spa.purchasers.reduce((s, p) => s + (p.shares || 0), 0);
            html += '</tbody><tfoot><tr><td colspan="2">Total raised</td><td class="number" title="' + escAttr(fmtNum(totalShares)) + '">' + fmtNumCompact(totalShares) + '</td><td></td><td class="number" title="' + escAttr(fmtAmountCcy(totalAmount, spa.currency)) + '">' + fmtAmountCcyCompact(totalAmount, spa.currency) + '</td><td class="number">100%</td></tr></tfoot></table></div>';
            if (!spa.currency) {
                html += '<div class="drawer-spa-footnote">* currency not stated in the source document</div>';
            }
        });

        document.getElementById('drawer-content').innerHTML = html;
        document.getElementById('drawer').classList.add('open');
        document.getElementById('backdrop').classList.add('open');
    }
    function closeDrawer() {
        document.getElementById('drawer').classList.remove('open');
        document.getElementById('backdrop').classList.remove('open');
    }
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeDrawer();
    });

    // ---------- Powered-by watermark — only visible at page bottom ----------
    function setupPoweredBy() {
        const el = document.querySelector('.powered-by-carta');
        if (!el) return;
        const update = () => {
            const atBottom = (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 4);
            el.classList.toggle('visible', atBottom);
        };
        window.addEventListener('scroll', update, { passive: true });
        window.addEventListener('resize', update);
        update();
    }
    window.addEventListener('load', setupPoweredBy);

    // ---------- Init ----------
    renderHeader();
    renderStatusFilterBar();
    renderMetricsGrid();
    renderCoverageBar();
    renderUploadCta();
    renderFilterBar();
    renderFundFilter();
    renderGeographyFilter();
    renderMainTable();
    renderFooterNote();
    renderPageFooter();
    // Close every dropdown the click landed outside of. A click inside a filter
    // wrap — including on its checkboxes — leaves that wrap's own panel open.
    document.addEventListener('click', e => {
        const wrap = e.target.closest('.fund-filter-wrap');
        document.querySelectorAll('.fund-dropdown-panel').forEach(p => {
            if (!wrap || !wrap.contains(p)) p.classList.remove('open');
        });
    });
  </script>
