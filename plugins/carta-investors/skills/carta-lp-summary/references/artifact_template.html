    // The firm's main currency: the one most of its funds report in, then the one with the most
    // LP accounts. The overview's amounts and shares are in it, as amounts never add across currencies.
    function mainCurrency(records) {
      const funds = new Map(), accounts = new Map();
      for (const r of records) {
        const code = r.currency || '';
        if (!funds.has(code)) funds.set(code, new Set());
        funds.get(code).add(r.fund_uuid);
        accounts.set(code, (accounts.get(code) || 0) + 1);
      }
      let best = null;
      for (const [code, set] of funds) {
        const lead = best === null ? null : funds.get(best).size;
        if (best === null || set.size > lead || (set.size === lead && accounts.get(code) > accounts.get(best))) best = code;
      }
      return best;
    }

    // code: the main currency. commitments: its committed total, how many LPs hold it, and every other
    // currency's total apart. unfunded: its amount and share of committed, and every other
    // currency's amount apart. distributions: what LPs have received in the main currency and the
    // net DPI it makes (null before any capital is paid in), every other currency apart. concentration: the top LPs' share of commitments (and of unfunded) in the
    // main currency, null when the firm has too few LPs for "top 3" to mean anything.
    function overviewModel(families) {
      const records = families.flatMap(f => f.records);
      const code = mainCurrency(records);
      const lines = Array.from(currencyGroups(records), ([c, rs]) => ({
        code: c, committed: sumBy(rs, r => r.committed), unfunded: sumBy(rs, unfundedOf),
        distributed: sumBy(rs, r => r.nav_distributed), dpi: multiples(rs).dpi,
      }));
      const main = lines.find(l => l.code === code) || { code, committed: 0, unfunded: 0, distributed: 0, dpi: null };
      const others = lines.filter(l => l.code !== code);
      // Each LP's records in the main currency, once: counted for Total commitments, ranked for concentration.
      const held = families.map(f => ({ name: f.name, rs: f.records.filter(r => (r.currency || '') === code) })).filter(x => x.rs.length);
      const ranked = held.map(x => ({ name: x.name, committed: sumBy(x.rs, r => r.committed), unfunded: sumBy(x.rs, unfundedOf) }))
        .filter(x => x.committed > 0).sort((a, b) => b.committed - a.committed || a.name.localeCompare(b.name));
      let concentration = null;
      if (ranked.length > CONCENTRATION_TOP && main.committed > 0) {
        const top = ranked.slice(0, CONCENTRATION_TOP);
        concentration = {
          share: sumBy(top, x => x.committed) / main.committed,
          top: top.map(x => ({ name: x.name, share: x.committed / main.committed })),
          unfundedShare: main.unfunded > 0 ? sumBy(top, x => x.unfunded) / main.unfunded : null,
        };
      }
      return {
        code, mixed: lines.length > 1,
        commitments: { amount: main.committed, lps: held.length, others: others.map(l => ({ code: l.code, amount: l.committed })) },
        unfunded: { amount: main.unfunded, share: ratio(main.unfunded, main.committed), others: others.map(l => ({ code: l.code, amount: l.unfunded })) },
        distributions: { amount: main.distributed, dpi: main.dpi, others: others.map(l => ({ code: l.code, amount: l.distributed, dpi: l.dpi })) },
        concentration,
      };
    }

    // ── LP profile PDF ──
    // A fixed US Letter layout in points, the same for every LP. jsPDF's built-in Helvetica
    // draws only Latin-1, so pdfText() spells out what it cannot (an em dash becomes "-").
    const PDF = { w: 612, h: 792, margin: 48, foot: 40 };
    // A branded PDF's logo fits this box (points), top-left in the header.
    const PDF_LOGO_BOX = { w: 160, h: 32 };
    // The Powered by Carta lockup on a branded PDF: 13.5% of the page's shorter side, 20pt in.
    const PDF_POWERED_BY = { w: 83, h: 15, inset: 20 };
    const PDF_EXPOSURE_TOP = 10;
    const PDF_INK = [26, 26, 26], PDF_SUBTLE = [101, 107, 107], PDF_RULE = [222, 223, 223], PDF_WASH = [233, 234, 234];

    // ── firm branding (PDF export only) ──
    const BRAND_LOGO = /^data:image\/(png|jpe?g|webp|gif|svg\+xml)[;,]/i;
    const BRAND_FONT_FILE = /^data:[a-z0-9.+\/-]+;base64,[A-Za-z0-9+\/=]+$/i;

    function hexRgb(hex) {
      const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
      return m ? [0, 2, 4].map(i => parseInt(m[1].slice(i, i + 2), 16)) : null;
    }

    // WCAG contrast of a colour against white.
    function contrastOnWhite(rgb) {
      const lin = c => { const v = c / 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
      const L = 0.2126 * lin(rgb[0]) + 0.7152 * lin(rgb[1]) + 0.0722 * lin(rgb[2]);
      return 1.05 / (L + 0.05);
    }

    // The page data's brand ({firmName, logoDataUri, accentHex, displayFont?, displayFontTtf?}),
    // checked: null without a firm name. The accent colours text only where it clears AA on
    // white; otherwise just bars and rules. A display font needs its embedded TTF.
    function normalizeBrand(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const firmName = typeof raw.firmName === 'string' ? raw.firmName.trim() : '';
      if (!firmName) return null;
      const accent = hexRgb(raw.accentHex);
      const family = typeof raw.displayFont === 'string' && /^[A-Za-z0-9 ]{1,40}$/.test(raw.displayFont.trim()) ? raw.displayFont.trim() : null;
      return {
        firmName,
        logoDataUri: typeof raw.logoDataUri === 'string' && BRAND_LOGO.test(raw.logoDataUri) ? raw.logoDataUri : null,
        accent,
        accentText: !!accent && contrastOnWhite(accent) >= 4.5,
        displayFont: family && typeof raw.displayFontTtf === 'string' && BRAND_FONT_FILE.test(raw.displayFontTtf) ? { family, ttf: raw.displayFontTtf } : null,
      };
    }

    // What the dialog's "Copy setup prompt" copies for the viewer to paste in chat, what the tip
    // says after a copy, and how long it stays up.
    const COPIED_PROMPT = 'Copied. Paste in chat.';
    const COPIED_TIP_MS = 2200;
    const COPY_FAILED = 'Could not copy';
    const copiedNote = ok => (ok ? COPIED_PROMPT : COPY_FAILED);
    function brandPrompt(firmName) { return "Brand my LP profiles with " + firmName + "'s branding"; }

    // A logo's size inside a box, keeping its shape.
    function fitBox(w, h, box) {
      if (!(w > 0 && h > 0)) return null;
      const k = Math.min(box.w / w, box.h / h);
      return { w: w * k, h: h * k };
    }

    function pdfText(s) {
      return String(s == null ? '' : s).replace(/[—–]/g, '-').replace(/€/g, 'EUR ').replace(/[“”]/g, '"')
        .replace(/[‘’]/g, "'").replace(/…/g, '...').replace(/[^\x00-\xFF]/g, '?');
    }

    function fileSlug(name) {
      const slug = String(name || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase()
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60).replace(/-+$/, '');
      return slug || 'lp';
    }

    function profileFilename(fam, today) { return fileSlug(fam.name) + '-lp-profile-' + today + '.pdf'; }
    function combinedFilename(firmName, today) { return fileSlug(firmName) + '-lp-profiles-' + today + '.pdf'; }

    // Everything one LP's PDF prints, as text, in print order. Amounts are exact throughout.
    function profileModel(fam, ctx, fundLabel) {
      const groups = currencyGroups(fam.records);
      const pf = familyProfile(fam.records);
      const asOf = asOfSummary(fam.records);
      const c = fam.contact;
      return {
        name: fam.name,
        asOf: asOf.date ? 'As of ' + dateLabel(asOf.date) : '',
        earlier: asOf.earlier.length ? 'Some funds valued earlier: ' + asOf.earlier.map(e => e.fund + ' (' + dateLabel(e.date) + ')').join(', ') : '',
        identity: pf,
        contact: { name: (c && c.name) || '—', email: (c && c.email) || '—' },
        mixed: groups.size > 1,
        bands: figures(fam.records).lines.map(l => {
          const irr = xirr(lpFlows(groups.get(l.code) || []));
          return {
            code: l.code, calledPct: calledPct(l.called, l.committed),
            committed: moneyExact(l.committed, l.code), called: moneyExact(l.called, l.code), unfunded: moneyExact(l.unfunded, l.code),
            nav: moneyExact(l.nav, l.code), tvpi: multiple(l.tvpi), dpi: multiple(l.dpi), irr: irrText(irr), irrNegative: irr != null && irr < 0,
          };
        }),
        positions: fam.records.map(r => {
          const f = figures([r]).primary;
          const irr = fundIrr(r);
          return {
            fund: r.fund_short, vintage: r.vintage_year == null ? '—' : String(r.vintage_year),
            committed: moneyExact(f.committed, f.code), unfunded: moneyExact(f.unfunded, f.code),
            tvpi: multiple(f.tvpi), irr: irrText(irr), irrNegative: irr != null && irr < 0,
          };
        }),
        exposure: Array.from(groups, ([code, rs]) => {
          const lt = lookThrough(rs, ctx);
          const view = exposureView(lt, { mode: 'company', showAll: true, fundLabel });
          const rows = view.rows.filter(r => r.value > 0).slice(0, PDF_EXPOSURE_TOP);
          const printRow = (r, max, total) => ({ name: r.name, value: moneyExact(r.value, code), pct: pctOf(r.value, total), moic: multiple(r.moic), bar: barFraction(r.value, max) });
          const geoView = lt.totalNav > 0 && geographyAvailable(lt, ctx.geo) ? geographyView(lt, ctx.geo, { showAll: true }) : null;
          return {
            code, hasNav: lt.totalNav > 0, more: view.rows.filter(r => r.value > 0).length - rows.length, writtenOff: writtenOffCompanies(lt).map(w => w.name),
            other: view.other ? printRow({ name: OTHER_EXPOSURE, value: view.other, moic: null }, view.max, view.total) : null,
            rows: rows.map(r => printRow(r, view.max, view.total)),
            geography: geoView ? {
              note: geoView.note, rows: geoView.rows.map(r => printRow(r, geoView.max, geoView.total)),
              other: geoView.other ? printRow({ name: OTHER_EXPOSURE, value: geoView.other, moic: null }, geoView.max, geoView.total) : null,
            } : null,
          };
        }),
      };
    }

    // Draws each model on its own pages of a jsPDF document, then the footer on every page.
    //   meta: {firm, generated, brand?}; brand (a branded export): {firmName, logo: {data, w, h}
    //   or null, accent, accentText, fontFamily or null, poweredBy: {data} or null}. Body and
    //   table text are never branded.
    function drawProfiles(doc, models, meta) {
      const brand = meta.brand || null;
      const accent = brand && brand.accent ? brand.accent : null;
      const titleFont = (size, color) => {
        if (brand && brand.fontFamily) { doc.setFont(brand.fontFamily, 'normal'); doc.setFontSize(size); doc.setTextColor(...(color || PDF_INK)); }
        else font(size, 'bold', color);
      };
      const M = PDF.margin, W = PDF.w - 2 * M, bottom = PDF.h - PDF.foot - 20;
      let y = M, current = null;
      const font = (size, style, color) => { doc.setFont('helvetica', style || 'normal'); doc.setFontSize(size); doc.setTextColor(...(color || PDF_INK)); };
      const text = (s, x, yy, opts) => doc.text(pdfText(s), x, yy, opts);
      const fit = (s, width) => {
        let t = pdfText(s);
        if (doc.getTextWidth(t) <= width) return t;
        while (t && doc.getTextWidth(t + '...') > width) t = t.slice(0, -1);
        return t + '...';
      };
      // Section rules and bars take the brand accent; row rules stay grey.
      const rule = (yy, color) => { doc.setDrawColor(...(color || accent || PDF_RULE)); doc.setLineWidth(0.75); doc.line(M, yy, M + W, yy); };
      const bar = (x, yy, width, fraction) => {
        doc.setFillColor(...PDF_WASH); doc.roundedRect(x, yy, width, 5, 2.5, 2.5, 'F');
        if (fraction > 0) { doc.setFillColor(...(accent || PDF_INK)); doc.roundedRect(x, yy, Math.max(5, width * fraction), 5, 2.5, 2.5, 'F'); }
      };
      const newPage = () => {
        doc.addPage();
        y = M;
        font(8, 'normal', PDF_SUBTLE);
        text(meta.firm + ' · LP Profile · ' + current.name + ' (continued)', M, y + 8);
        y += 28;
      };
      // Room for `h` more points, or a new page; `again` redraws a table's header after a break.
      const ensure = (h, again) => { if (y + h > bottom) { newPage(); if (again) again(); } };
      const sectionTitle = (title, note) => {
        ensure(72);
        y += 28;
        font(12, 'bold'); text(title, M, y);
        if (note) { const w = doc.getTextWidth(pdfText(title)); font(9, 'normal', PDF_SUBTLE); text(note, M + w + 6, y); }
        y += 12;
      };

      // A branded header leads with the firm's logo (or, if it would not load, its name).
      function header(m) {
        doc.setFillColor(...(accent || PDF_INK)); doc.rect(M, y, W, 3, 'F');
        y += 14;
        if (brand && brand.logo) {
          doc.addImage(brand.logo.data, 'PNG', M, y, brand.logo.w, brand.logo.h);
          y += brand.logo.h + 18;
        } else if (brand) {
          font(14, 'bold'); text(fit(brand.firmName, W), M, y + 12);
          y += 30;
        } else y += 8;
        titleFont(9, PDF_SUBTLE); text(meta.firm + ' · LP Profile', M, y);
        y += 26;
        titleFont(22, brand && brand.accentText ? accent : PDF_INK); text(fit(m.name, W), M, y);
        y += 18;
        font(10, 'normal', PDF_SUBTLE);
        if (m.asOf) { text(m.asOf, M, y); y += 14; }
        if (m.earlier) { font(9, 'normal', PDF_SUBTLE); for (const line of doc.splitTextToSize(pdfText(m.earlier), W)) { text(line, M, y); y += 12; } }
      }

      // Labelled pairs in two columns: the profile on the left, the contact on the right.
      function identity(m) {
        const right = M + W / 2, label = 92;
        const pair = (x, yy, name, value, width) => {
          font(9.5, 'normal', PDF_SUBTLE); text(name, x, yy);
          font(9.5, 'normal'); text(fit(value, width - label), x + label, yy);
        };
        y += 14;
        pair(M, y, 'Investor type', m.identity.investorType, W / 2);
        pair(right, y, 'Primary contact', m.contact.name, W / 2);
        y += 15;
        pair(M, y, 'Location', m.identity.location, W / 2);
        pair(right, y, 'Email', m.contact.email, W / 2);
        y += 15;
        pair(M, y, 'LP since', m.identity.lpSince, W / 2);
        y += 4;
      }

      // Capital | Performance, a band per currency, as on the page.
      function bands(m) {
        const col = (W - 32) / 2, right = M + col + 32;
        for (const b of m.bands) {
          ensure(130);
          y += 24;
          if (m.mixed) { font(9, 'normal', PDF_SUBTLE); text('Amounts in ' + (b.code || 'fund currency'), M, y); y += 16; }
          const top = y;
          font(8, 'bold', PDF_SUBTLE);
          text('CAPITAL', M, y, { charSpace: 0.6 }); text('PERFORMANCE', right, y, { charSpace: 0.6 });
          y += 24;
          font(18, 'bold'); text(b.committed, M, y); text(b.nav, right, y);
          y += 13;
          font(9, 'normal', PDF_SUBTLE); text('Committed', M, y); text('NAV', right, y);
          y += 12;
          bar(M, y, col, b.calledPct / 100);
          y += 24;
          const figs = (items, x, width) => items.forEach(([value, label, negative], i) => {
            const fx = x + i * (width / items.length);
            font(11, 'bold', negative ? [163, 48, 29] : PDF_INK); text(value, fx, y);
            font(8.5, 'normal', PDF_SUBTLE); text(label, fx, y + 12);
          });
          figs([[b.called, 'Called · ' + b.calledPct + '%'], [b.unfunded, 'Unfunded']], M, col);
          figs([[b.tvpi, 'TVPI'], [b.dpi, 'DPI'], [b.irr, 'IRR', b.irrNegative]], right, col);
          y += 16;
          doc.setDrawColor(...PDF_RULE); doc.setLineWidth(0.75); doc.line(M + col + 16, top - 8, M + col + 16, y);
        }
      }

      // Every fund, no truncation; the header repeats on each page the table runs onto.
      function positions(m) {
        const cols = [['Fund', 202, 'left'], ['Vintage', 44, 'left'], ['Committed', 84, 'right'], ['Unfunded', 84, 'right'], ['Net TVPI', 50, 'right'], ['Net IRR', 52, 'right']];
        const xs = []; cols.reduce((x, c) => { xs.push(x); return x + c[1]; }, M);
        const cellX = i => (cols[i][2] === 'right' ? xs[i] + cols[i][1] - 8 : xs[i]);
        const head = () => {
          font(8.5, 'bold', PDF_SUBTLE);
          cols.forEach((c, i) => text(c[0], cellX(i), y, { align: c[2] }));
          y += 6; rule(y); y += 14;
        };
        sectionTitle('Fund positions');
        y += 6;
        head();
        for (const p of m.positions) {
          ensure(20, head);
          font(9.5, 'normal');
          text(fit(p.fund, cols[0][1] - 8), cellX(0), y);
          text(p.vintage, cellX(1), y);
          text(p.committed, cellX(2), y, { align: 'right' });
          text(p.unfunded, cellX(3), y, { align: 'right' });
          text(p.tvpi, cellX(4), y, { align: 'right' });
          font(9.5, 'normal', p.irrNegative ? [163, 48, 29] : PDF_INK); text(p.irr, cellX(5), y, { align: 'right' });
          y += 6; rule(y, PDF_WASH); y += 14;
        }
      }

      // The top companies by estimated NAV, a block per currency, then any written off.
      function exposure(m) {
        const cols = [['Company', 190, 'left'], ['', 130, 'left'], ['Est. NAV', 96, 'right'], ['% of NAV', 50, 'right'], ['MOIC', 50, 'right']];
        const xs = []; cols.reduce((x, c) => { xs.push(x); return x + c[1]; }, M);
        const cellX = i => (cols[i][2] === 'right' ? xs[i] + cols[i][1] - 4 : xs[i]);
        const head = () => {
          font(8.5, 'bold', PDF_SUBTLE);
          cols.forEach((c, i) => c[0] && text(c[0], cellX(i), y, { align: c[2] }));
          y += 6; rule(y); y += 14;
        };
        for (const block of m.exposure) {
          sectionTitle('Exposure', '(estimated)' + (m.mixed ? ' · in ' + (block.code || 'fund currency') : '') + ' · top ' + PDF_EXPOSURE_TOP + ' companies by Est. NAV');
          y += 6;
          if (!block.hasNav) { font(9.5, 'normal', PDF_SUBTLE); text('There is no NAV to look through.', M, y); y += 14; continue; }
          if (block.rows.length) head();
          else { font(9.5, 'normal', PDF_SUBTLE); text('No holdings to show.', M, y); y += 14; }
          for (const r of block.rows) {
            ensure(20, head);
            font(9.5, 'normal');
            text(fit(r.name, cols[0][1] - 8), cellX(0), y);
            bar(xs[1], y - 5, cols[1][1] - 12, r.bar);
            text(r.value, cellX(2), y, { align: 'right' });
            text(r.pct, cellX(3), y, { align: 'right' });
            text(r.moic, cellX(4), y, { align: 'right' });
            y += 6; rule(y, PDF_WASH); y += 14;
          }
          if (block.more > 0) { ensure(16); font(9, 'normal', PDF_SUBTLE); text('+ ' + block.more + ' more ' + (block.more === 1 ? 'company' : 'companies') + ' not shown', M, y); y += 14; }
          if (block.other) otherLine(block.other, cellX);
          if (block.writtenOff.length) {
            const n = block.writtenOff.length;
            const lines = doc.splitTextToSize(pdfText('Written off: ' + n + (n === 1 ? ' company' : ' companies') + ' — ' + block.writtenOff.join(', ')), W);
            ensure(lines.length * 12 + 4);
            font(9, 'normal', PDF_SUBTLE);
            for (const line of lines) { text(line, M, y); y += 12; }
          }
        }
      }

      // The reconciling Other line under a table: ruled above, muted, no bar.
      function otherLine(o, cellX) {
        ensure(22);
        y += 2; rule(y - 12, PDF_RULE);
        font(9.5, 'normal', PDF_SUBTLE);
        text(o.name, cellX(0), y);
        text(o.value, cellX(2), y, { align: 'right' });
        text(o.pct, cellX(3), y, { align: 'right' });
        text('-', cellX(4), y, { align: 'right' });
        y += 8; rule(y, PDF_WASH); y += 14;
      }

      // Every geography group, then the source note; only where Geography is offered.
      function geography(m) {
        const cols = [['Geography', 190, 'left'], ['', 130, 'left'], ['Est. NAV', 96, 'right'], ['% of NAV', 50, 'right'], ['MOIC', 50, 'right']];
        const xs = []; cols.reduce((x, c) => { xs.push(x); return x + c[1]; }, M);
        const cellX = i => (cols[i][2] === 'right' ? xs[i] + cols[i][1] - 4 : xs[i]);
        const head = () => {
          font(8.5, 'bold', PDF_SUBTLE);
          cols.forEach((c, i) => c[0] && text(c[0], cellX(i), y, { align: c[2] }));
          y += 6; rule(y); y += 14;
        };
        for (const block of m.exposure) {
          if (!block.geography) continue;
          sectionTitle('Geography', '(estimated)' + (m.mixed ? ' · in ' + (block.code || 'fund currency') : ''));
          y += 6;
          head();
          for (const r of block.geography.rows) {
            ensure(20, head);
            font(9.5, 'normal');
            text(fit(r.name, cols[0][1] - 8), cellX(0), y);
            bar(xs[1], y - 5, cols[1][1] - 12, r.bar);
            text(r.value, cellX(2), y, { align: 'right' });
            text(r.pct, cellX(3), y, { align: 'right' });
            text(r.moic, cellX(4), y, { align: 'right' });
            y += 6; rule(y, PDF_WASH); y += 14;
          }
          if (block.geography.other) otherLine(block.geography.other, cellX);
          ensure(16); font(9, 'normal', PDF_SUBTLE); text(block.geography.note, M, y); y += 14;
        }
      }

      models.forEach((m, i) => {
        current = m;
        if (i > 0) doc.addPage();
        y = M;
        header(m); identity(m); bands(m); positions(m); exposure(m); geography(m);
      });
      const pages = doc.getNumberOfPages();
      // A branded export keeps Carta's credit: the Powered by Carta lockup bottom-right,
      // the page number beside it.
      const badge = brand && brand.poweredBy ? PDF_POWERED_BY : null;
      for (let p = 1; p <= pages; p++) {
        doc.setPage(p);
        rule(PDF.h - PDF.foot, PDF_RULE);
        font(8, 'normal', PDF_SUBTLE);
        text('Generated from Carta · ' + meta.generated, M, PDF.h - PDF.foot + 14);
        text('Page ' + p + ' of ' + pages, M + W - (badge ? badge.w + 12 : 0), PDF.h - PDF.foot + 14, { align: 'right' });
        if (badge) doc.addImage(brand.poweredBy.data, 'PNG', PDF.w - badge.inset - badge.w, PDF.h - badge.inset - badge.h, badge.w, badge.h);
      }
      return doc;
    }

    // ── export runs ──
    // One export at a time, whichever control starts it: a run asked for while another is going
    // resolves to {done: false, error: ''} without starting.
    function exportLock() {
      let busy = false;
      return {
        busy: () => busy,
        async run(task) {
          if (busy) return { done: false, error: '' };
          busy = true;
          try { return await task(); } finally { busy = false; }
        },
      };
    }

    // Saves `files` in turn, each waiting for the last: saveOne resolves to 'saved', 'declined',
    // 'unavailable' or a failure message. Resolves to {done: true, saved} when every file saved,
    // else {done: false, saved, outcome} with the outcome that stopped it.
    async function saveAll(files, saveOne, progress) {
      let saved = 0;
      for (const [i, file] of files.entries()) {
        progress(files.length > 1 ? 'Saving ' + (i + 1) + ' of ' + files.length + '…' : 'Saving…');
        const outcome = await saveOne(file);
        if (outcome !== 'saved') return { done: false, saved, outcome };
        saved += 1;
      }
      return { done: true, saved };
    }

    // Paging stops on a short page or once every row the query reports has come back. Rows the
    // parser could not read still came back, so they count: a full page with one unreadable row
    // is not the last page.
    function isLastPage(pageRows, pageSkipped, pageSize, seenSoFar, total) {
      if (pageRows + pageSkipped < pageSize) return true;
      return total != null && seenSoFar >= total;
    }
    // </lps-core>
  </script>
  <script>
    const CONFIG = JSON.parse(document.getElementById('lp-summary-data').textContent);
    const CARTA_MCP_SERVER = CONFIG.mcp_server;
    const CALL_TOOL = 'call_tool';
    const WELCOME_TOOL = 'welcome';
    const INSTRUMENTATION_V2 = { skills: ['carta-investors:carta-lp-summary'], from_ui: true };
    // Matches .claude-plugin/skill-versions.json; the update banner compares it to the published one.
    const ARTIFACT_VERSION = '1.2.0';

    // Config values land in SQL, so only plain identifiers are accepted.
    const IDENT = /^[A-Za-z0-9_.]+$/;
    function table(name) {
      const value = CONFIG.tables && CONFIG.tables[name];
      if (typeof value !== 'string' || !IDENT.test(value)) throw new Error('the table name for ' + name + ' is missing or invalid');
      return value;
    }

    // Pinned in the context AND in the SQL, then verified on every page: the context is
    // per-user state that another tab can rewrite mid-load, and another firm's LPs under
    // this firm's heading is the failure this guards against.
    // An id written as a number or a string reads the same; a missing one stops the page
    // before any query runs (init), so neither guard is ever skipped.
    const configId = v => (v == null ? '' : String(v).trim());
    const FIRM_CONTEXT_ID = configId(CONFIG.firm_context_id);
    const FIRM_ROW_ID = configId(CONFIG.firm_warehouse_id);

    function firmPin(alias) {
      if (!FIRM_ROW_ID) throw new Error('the page config names no firm, so it cannot pin its queries');
      return ` AND ${alias}.FIRM_ID = '${String(FIRM_ROW_ID).replace(/'/g, "''")}'`;
    }

    function assertFirm(rows) {
      if (!FIRM_ROW_ID) throw new Error('the page config names no firm, so it cannot check its rows');
      if (!rows || rows.length === 0) return rows;
      // A row with no firm id is as unverifiable as another firm's, so it is refused too.
      const foreign = rows.filter(r => r.firm_id == null || String(r.firm_id) !== FIRM_ROW_ID);
      if (foreign.length) {
        throw new Error('the warehouse returned ' + foreign.length + ' row(s) belonging to another firm — the Carta ' +
                        'session changed firms while this page was loading. Reload to fetch this firm again.');
      }
      return rows;
    }

    let _mcpNsPromise = null;
    function mcpNamespace() {
      if (!_mcpNsPromise) {
        _mcpNsPromise = (async () => {
          for (let i = 0; i < 5; i++) {
            try {
              const mcp = await Promise.resolve(window.claude?.use?.('mcp') ?? null);
              if (mcp) return mcp;
            } catch (_) {}
            if (i < 4) await new Promise(r => setTimeout(r, 500));
          }
          return null;
        })();
      }
      return _mcpNsPromise;
    }

    async function callCartaTool(tool, args) {
      const mcp = await mcpNamespace();
      if (!mcp) throw new Error('this page reads live data and no Carta connector is available in this view');
      try {
        return await mcp.callTool(CARTA_MCP_SERVER, tool, { ...args, _instrumentation_v2: INSTRUMENTATION_V2 });
      } catch (err) {
        if (err && err.code === 'tool_error') {
          return { isError: true, code: err.code, result: err.result, content: [{ type: 'text', text: err.message || 'tool error' }] };
        }
        throw err;
      }
    }

    // ── usage analytics ──
    // The renderer inlines the shared UI tracker and its trackUi/initUiTracker helpers at the marker
    // above. They relay each event through the connector's track_ui_event tool, stamped with this
    // skill like every other call. Event ids are fixed labels: never an LP, fund or firm name, an
    // amount or typed text. A page published without the tracker (5d) simply sends nothing.
    const TRACK_ID = 'LPSummary.';
    const PROMPT_SOURCE_STATIC = 'static';
    // How this page was requested when it was built: Carta Home's card, or the user asking Claude.
    const ORIGIN = CONFIG.origin === 'home' ? 'FromHome' : 'FromChat';
    // Never throws: analytics must not break the page.
    function track(action, id, value) {
      try { if (typeof trackUi === 'function') trackUi(action, TRACK_ID + id, Number.isFinite(value) ? { value } : undefined); } catch (_) {}
    }
    // The suggested prompt text only, so analytics can match the copy to the prompt the user runs next.
    function trackPrompt(id, prompt) {
      if (!prompt) return track('click', id);
      try { if (typeof trackUiPrompt === 'function') trackUiPrompt(TRACK_ID + id, { prompt: String(prompt), source: PROMPT_SOURCE_STATIC }); } catch (_) {}
    }
    // A table column or mode key as a plain label, never free text.
    const trackLabel = key => String(key || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 40);
    let searchTracked = false;
    // Unverified-email events: a Show per LP whose flagged contacts were viewed, a Tooltip once per page load.
    const unverifiedShown = new Set();
    let unverifiedTipTracked = false;
    function trackUnverifiedTip(e) {
      if (unverifiedTipTracked || !(e.target instanceof Element) || !e.target.closest('[data-unverified]')) return;
      unverifiedTipTracked = true;
      track('click', 'Detail.EmailUnverified.Tooltip');
    }

    let welcomeCalled = false;
    let welcomeRetried = false;

    function status(text) {
      const el = document.getElementById('status');
      el.textContent = text || '';
      el.hidden = !text;
    }

    function fail(err) {
      track('render', 'Unavailable.LoadError');
      status('');
      const el = document.getElementById('error');
      el.textContent = 'Could not load the LP Summary: ' + (err && err.message ? err.message : String(err));
      el.hidden = false;
      renderAll();
    }

    const TRANSIENT = /no reply|timed? ?out|timeout|econnreset|network|socket|temporarily|503|502|504|gateway/i;
    const RETRIES = 2;
    const BACKOFF_MS = [700, 2100];

    async function withRetry(run, label) {
      for (let attempt = 0; ; attempt++) {
        try { return await run(); } catch (err) {
          if (attempt >= RETRIES || !TRANSIENT.test((err && err.message) || String(err || ''))) throw err;
          status(`${label} — connection dropped, retrying (${attempt + 1} of ${RETRIES})…`);
          await new Promise(r => setTimeout(r, BACKOFF_MS[attempt] || BACKOFF_MS[BACKOFF_MS.length - 1]));
        }
      }
    }

    async function callMcpWithWelcomeRetry(tool, args) {
      const first = await callCartaTool(tool, args);
      if (!first || !first.isError) return first;
      const text = (first.content && first.content[0] && first.content[0].text) || '';
      if (!/welcome/i.test(text) || welcomeRetried) return first;
      welcomeRetried = true;
      status('Reconnecting to Carta…');
      const welcomed = await callCartaTool(WELCOME_TOOL, {});
      if (welcomed && welcomed.isError) throw new Error('could not start a Carta session');
      return await callCartaTool(tool, args);
    }

    function unwrap(result) {
      if (typeof result === 'string') return result;
      if (!result || typeof result !== 'object') throw new Error('unexpected response shape');
      if (result.isError) throw new Error((result.content && result.content[0] && result.content[0].text) || 'query failed');
      if (result.content && result.content[0] && typeof result.content[0].text === 'string') return result.content[0].text;
      if (typeof result.payload === 'string') return result.payload;
      if (result.payload && typeof result.payload.result === 'string') return result.payload.result;
      if (result.structuredContent && typeof result.structuredContent.result === 'string') return result.structuredContent.result;
      throw new Error('no table in the response');
    }

    // Names can contain a literal ' | ' (the markdown separator); fold overflow into the
    // first free-text column so the row survives with that name garbled rather than lost.
    const TEXT_COLUMNS = ['fund_name', 'family_name', 'partner_name', 'issuer_name', 'asset_name', 'contact_name', 'contact_email', 'entity_type', 'country', 'state', 'industry', 'tag', 'category'];

    function reconcileOverflow(cells, headers) {
      if (cells.length === headers.length) return cells;
      const overflow = cells.length - headers.length;
      if (overflow <= 0) return null;
      const textIdx = headers.findIndex(h => TEXT_COLUMNS.indexOf(h) !== -1);
      if (textIdx === -1) return null;
      const merged = cells.slice(0, textIdx)
        .concat([cells.slice(textIdx, textIdx + overflow + 1).join(' | ')])
        .concat(cells.slice(textIdx + overflow + 1));
      return merged.length === headers.length ? merged : null;
    }

    // Identifiers and names stay strings; only amounts become numbers.
    const STRING_COLUMNS = new Set(['fund_uuid', 'family_id', 'firm_id', 'issuer_id', 'master_uuid', 'partner_id']);

    function coerce(raw, header) {
      const flat = typeof raw === 'string' ? raw.trim().toUpperCase() : raw;
      if (flat === 'NULL' || flat === '') return null;
      if (STRING_COLUMNS.has(header) || TEXT_COLUMNS.includes(header)) return String(raw).trim();
      if (flat === 'TRUE') return true;
      if (flat === 'FALSE') return false;
      if (/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(raw)) {
        const n = parseFloat(raw);
        if (Number.isFinite(n)) return n;
      }
      return raw;
    }

    function parseTable(text) {
      if (!text || typeof text !== 'string') return { rows: [], skipped: 0 };
      const lines = text.split(/\r?\n/).map(l => l.trimEnd()).filter(l => l.length > 0);
      if (lines.length === 0) return { rows: [], skipped: 0 };
      const head = lines[0].startsWith('total_rows:') ? 1 : 0;
      if (head >= lines.length) return { rows: [], skipped: 0 };
      const headers = lines[head].split(' | ').map(h => h.trim().toLowerCase());
      let start = head + 1;
      if (lines.length > start && /^[\s\-|]+$/.test(lines[start])) start++;
      const rows = [];
      let skipped = 0;
      for (let i = start; i < lines.length; i++) {
        const cells = reconcileOverflow(lines[i].split(' | ').map(c => c.trim()), headers);
        if (!cells) { skipped++; continue; }
        const row = {};
        headers.forEach((h, j) => { row[h] = coerce(cells[j], h); });
        rows.push(row);
      }
      return { rows, skipped };
    }

    function totalRows(text) {
      const match = ((text || '').split(/\r?\n/)[0] || '').match(/total_rows:\s*(\d+)/);
      return match ? parseInt(match[1], 10) : null;
    }

    const PAGE_SIZE = 500;
    const MAX_PAGES = 200;

    async function queryOnce(sql, opts) {
      const args = { sql, format: 'markdown' };
      if (opts && opts.limit !== undefined) args.limit = opts.limit;
      if (opts && opts.offset !== undefined) args.offset = opts.offset;
      const text = unwrap(await callMcpWithWelcomeRetry(CALL_TOOL, { name: 'dwh__execute__query', arguments: args }));
      const parsed = parseTable(text);
      return { rows: parsed.rows, skipped: parsed.skipped, total: totalRows(text) };
    }

    const query = (sql, opts) => withRetry(() => queryOnce(sql, opts), (opts && opts.label) || 'Loading');

    // Pages until a short page. Reports truncation and dropped rows instead of showing a
    // silent subset.
    async function queryAll(sql, label) {
      const rows = [];
      let skipped = 0;
      for (let page = 0; page < MAX_PAGES; page++) {
        const result = await query(sql, { limit: PAGE_SIZE, offset: page * PAGE_SIZE, label });
        assertFirm(result.rows);
        rows.push(...result.rows);
        skipped += result.skipped || 0;
        if (isLastPage(result.rows.length, result.skipped || 0, PAGE_SIZE, rows.length + skipped, result.total)) return { rows, truncated: false, skipped };
      }
      return { rows, truncated: true, skipped };
    }

    // A supplementary load that the page renders without: on any failure it resolves to
    // `failed: true` instead of throwing.
    async function queryOptional(sql, label) {
      try { return { ...(await queryAll(sql, label)), failed: false }; }
      catch (err) { return { rows: [], truncated: false, skipped: 0, failed: true, error: err }; }
    }

    // ── queries ──
    // Read-only, keyed by fund UUID and partner id, each pinned to the firm and selecting
    // firm_id so assertFirm can check every page.
    // Deliberately not pinned: it reads which firm the session's row access is on, so assertFirm
    // can refuse a session that has moved to another firm. (Not named *Sql, which must all pin.)
    function firmProbe() {
      return `SELECT DISTINCT p.FIRM_ID AS firm_id FROM ${table('partners')} p WHERE ${LP_ROWS}`;
    }

    // A session that moved to another firm returns its rows, which assertFirm refuses, or — once
    // the pin filters them — none at all, which would read as empty figures. Either stops the load.
    async function assertSessionOnFirm() {
      const probe = await queryAll(firmProbe(), 'Checking the firm');
      if (!probe.rows.length) throw new Error('the Carta session changed firms while this page was loading. Reload to fetch this firm again.');
    }

    function fundsSql() {
      return `SELECT f.FUND_UUID AS fund_uuid, f.FUND_NAME AS fund_name, f.REPORTING_CURRENCY AS currency_code,
                     f.VINTAGE_YEAR AS vintage_year, f.FIRM_ID AS firm_id
              FROM ${table('funds')} f
              WHERE (f.SERVICE_STOP_DATE IS NULL OR f.SERVICE_STOP_DATE > CURRENT_DATE())${firmPin('f')}
              ORDER BY f.FUND_NAME, f.FUND_UUID`;
    }

    // The LP accounts the page covers. Wire rows join back to partner rows by fund and partner,
    // so both queries read this one filter.
    const LP_ROWS = 'p.IS_LIMITED_PARTNER AND p.IS_ACTIVE';

    function partnersSql() {
      return `SELECT p.FUND_UUID AS fund_uuid, p.PARTNER_ID AS partner_id, p.PARTNER_NAME AS partner_name,
                     p.FIRM_PARTNER_GROUP_ID AS family_id, p.FIRM_PARTNER_GROUP_NAME AS family_name,
                     p.PARTNER_ENTITY_TYPE AS entity_type, p.PARTNER_COUNTRY AS country, p.PARTNER_STATE AS state,
                     TO_CHAR(p.EARLIEST_COMMITMENT_DATE, 'YYYY-MM-DD') AS first_commitment_date,
                     p.TOTAL_CAPITAL_COMMITMENT_AMOUNT_CURRENT AS committed, p.TOTAL_CAP_CONTRIBUTION AS called,
                     p.TOTAL_DISTRIBUTION AS distributed, p.FIRM_ID AS firm_id
              FROM ${table('partners')} p
              WHERE ${LP_ROWS}${firmPin('p')}
              ORDER BY p.FUND_UUID, p.PARTNER_ID`;
    }

    // Separate from partnersSql: a viewer whose role cannot read wire data still sees the
    // rest of the page, with wire cells marked Restricted.
    function wiresSql() {
      return `SELECT p.FUND_UUID AS fund_uuid, p.PARTNER_ID AS partner_id,
                     p.HAS_CONFIRMED_WIRE_INSTRUCTIONS AS has_confirmed, p.HAS_WIRE_SETUP AS has_setup,
                     TO_CHAR(p.WIRE_CONFIRMATION_DATE, 'YYYY-MM-DD') AS confirmed_date,
                     TO_CHAR(p.WIRE_INSTRUCTIONS_ADDED_DATE, 'YYYY-MM-DD') AS added_date, p.FIRM_ID AS firm_id
              FROM ${table('partners')} p
              WHERE ${LP_ROWS}${firmPin('p')}
              ORDER BY p.FUND_UUID, p.PARTNER_ID`;
    }

    // Each partner's latest month: NAV and cumulative paid-in and distributions for the net
    // multiples, plus every partner's NAV (GPs included) for the fund totals look-through
    // divides by.
    function latestNavSql() {
      return `SELECT n.FUND_ID AS fund_uuid, n.PARTNER_ID AS partner_id, n.IS_LIMITED_PARTNER AS is_lp,
                     TO_CHAR(n.MONTH_END_DATE, 'YYYY-MM-DD') AS nav_date, n.ENDING_TOTAL_NAV AS nav,
                     n.CUMULATIVE_TOTAL_CONTRIBUTIONS AS paid_in, n.CUMULATIVE_TOTAL_DISTRIBUTIONS AS nav_distributed,
                     n.FIRM_ID AS firm_id
              FROM ${table('nav')} n
              WHERE n.MONTH_END_DATE <= LAST_DAY(CURRENT_DATE())${firmPin('n')}
              QUALIFY ROW_NUMBER() OVER (PARTITION BY n.FUND_ID, n.PARTNER_ID ORDER BY n.MONTH_END_DATE DESC) = 1
              ORDER BY n.FUND_ID, n.PARTNER_ID`;
    }

    // Only months with money moving, so the row count follows capital activity, not age.
    function flowsSql() {
      return `SELECT n.FUND_ID AS fund_uuid, n.PARTNER_ID AS partner_id, TO_CHAR(n.MONTH_END_DATE, 'YYYY-MM-DD') AS flow_date,
                     n.TOTAL_CONTRIBUTIONS AS contributions, n.TOTAL_DISTRIBUTIONS AS distributions, n.FIRM_ID AS firm_id
              FROM ${table('nav')} n
              WHERE n.IS_LIMITED_PARTNER AND n.MONTH_END_DATE <= LAST_DAY(CURRENT_DATE())
                AND (n.TOTAL_CONTRIBUTIONS <> 0 OR n.TOTAL_DISTRIBUTIONS <> 0)${firmPin('n')}
              ORDER BY n.FUND_ID, n.PARTNER_ID, n.MONTH_END_DATE`;
    }

    // Every contact on each LP account, primary first: the detail pane shows the primary and
    // lists the rest under "+N contacts".
    function contactsSql() {
      return `SELECT c.FUND_ID AS fund_uuid, c.PARTNER_ID AS partner_id, c.CONTACT_FULL_NAME AS contact_name,
                     c.CONTACT_EMAIL AS contact_email, c.IS_PRIMARY_CONTACT AS is_primary,
                     c.IS_CONTACT_EMAIL_MISMATCHED AS email_mismatch, c.FIRM_ID AS firm_id
              FROM ${table('contacts')} c
              WHERE (c.CONTACT_FULL_NAME IS NOT NULL OR c.CONTACT_EMAIL IS NOT NULL)${firmPin('c')}
              ORDER BY c.FUND_ID, c.PARTNER_ID, c.IS_PRIMARY_CONTACT DESC, c.CONTACT_FULL_NAME, c.CONTACT_EMAIL, c.IS_CONTACT_EMAIL_MISMATCHED`;
    }

    // One row per security, in the fund's own currency. A position already in that currency
    // reads its native value and cost: the base-currency columns are not populated for those
    // (mostly 0 or empty). Only a foreign-currency position reads the converted columns, and
    // one with no converted value is counted, not guessed.
    const SAME_CURRENCY = '(i.BASE_CURRENCY_CODE IS NULL OR i.CURRENCY_CODE = i.BASE_CURRENCY_CODE)';
    function holdingsSql() {
      return `SELECT i.FUND_UUID AS fund_uuid, i.GENERAL_LEDGER_ISSUER_ID AS issuer_id, MAX(i.ISSUER_NAME) AS issuer_name,
                     i.ASSET_NAME AS asset_name, BOOLOR_AGG(COALESCE(i.IS_INVESTMENT_IN_FUND, FALSE)) AS is_fund,
                     SUM(IFF(${SAME_CURRENCY}, i.REMAINING_VALUE, i.BASE_CURRENCY_REMAINING_VALUE)) AS value,
                     IFF(COUNT_IF(IFF(${SAME_CURRENCY}, i.TOTAL_COST, i.BASE_CURRENCY_TOTAL_COST) IS NULL) > 0, NULL,
                         SUM(IFF(${SAME_CURRENCY}, i.TOTAL_COST, i.BASE_CURRENCY_TOTAL_COST))) AS cost,
                     COUNT_IF(NOT ${SAME_CURRENCY} AND i.BASE_CURRENCY_REMAINING_VALUE IS NULL) AS unconverted,
                     TO_CHAR(MIN(i.LATEST_FMV_EFFECTIVE_DATE), 'YYYY-MM-DD') AS fmv_date, i.FIRM_ID AS firm_id
              FROM ${table('investments')} i
              WHERE i.IS_ACTIVE_INVESTMENT${firmPin('i')}
              GROUP BY i.FUND_UUID, i.GENERAL_LEDGER_ISSUER_ID, i.ASSET_NAME, i.FIRM_ID
              ORDER BY i.FUND_UUID, i.GENERAL_LEDGER_ISSUER_ID, i.ASSET_NAME`;
    }

    // Which of this firm's funds a fund-of-fund holding is (a feeder's master).
    function mastersSql() {
      return `SELECT DISTINCT u.FUND_UUID AS fund_uuid, u.PARENT_ISSUER_ID AS issuer_id, u.UNDERLYING_FUND_UUID AS master_uuid, u.FIRM_ID AS firm_id
              FROM ${table('underlying')} u
              WHERE u.UNDERLYING_FUND_UUID IS NOT NULL${firmPin('u')}
              ORDER BY u.FUND_UUID, u.PARENT_ISSUER_ID, u.UNDERLYING_FUND_UUID`;
    }

    // Carta's broad industry for each company the firm holds.
    function industriesSql() {
      return `SELECT l.GENERAL_LEDGER_ISSUER_ID AS issuer_id, MAX(c.INDUSTRY_BROAD) AS industry, l.FIRM_ID AS firm_id
              FROM ${table('entity_links')} l
              JOIN ${table('companies')} c ON c.CORPORATION_UUID = l.CORPORATION_ID
              WHERE c.INDUSTRY_BROAD IS NOT NULL${firmPin('l')}
              GROUP BY l.GENERAL_LEDGER_ISSUER_ID, l.FIRM_ID
              ORDER BY l.GENERAL_LEDGER_ISSUER_ID`;
    }

    // The firm's own Geography, Region and Country tags, one value per category per company
    // (a tag's value is a list; its first entry, trimmed).
    function geoTagsSql() {
      return `SELECT t.GENERAL_LEDGER_ISSUER_ID AS issuer_id, LOWER(TRIM(f.key)) AS category,
                     MIN(NULLIF(TRIM(IFF(IS_ARRAY(f.value), f.value[0], f.value)::STRING), '')) AS tag, t.FIRM_ID AS firm_id
              FROM ${table('tags')} t, LATERAL FLATTEN(input => t.TAGS_JSON) f
              WHERE LOWER(TRIM(f.key)) IN ('geography', 'region', 'country')${firmPin('t')}
              GROUP BY t.GENERAL_LEDGER_ISSUER_ID, LOWER(TRIM(f.key)), t.FIRM_ID
              ORDER BY t.GENERAL_LEDGER_ISSUER_ID, category`;
    }

    // Each company's HQ country (ISO-3), the geography fallback when the firm has no such tags.
    function hqCountrySql() {
      return `SELECT l.GENERAL_LEDGER_ISSUER_ID AS issuer_id, MAX(b.COUNTRY) AS country, l.FIRM_ID AS firm_id
              FROM ${table('entity_links')} l
              JOIN ${table('corporations')} b ON b.CORPORATION_UUID = l.CORPORATION_ID
              WHERE b.COUNTRY IS NOT NULL${firmPin('l')}
              GROUP BY l.GENERAL_LEDGER_ISSUER_ID, l.FIRM_ID
              ORDER BY l.GENERAL_LEDGER_ISSUER_ID`;
    }

    // The firm's own Industry or Sector tag, for companies Carta has no industry for.
    function tagsSql() {
      return `SELECT t.GENERAL_LEDGER_ISSUER_ID AS issuer_id, MIN(f.value[0]::STRING) AS tag, t.FIRM_ID AS firm_id
              FROM ${table('tags')} t, LATERAL FLATTEN(input => t.TAGS_JSON) f
              WHERE LOWER(TRIM(f.key)) IN ('industry', 'sector')${firmPin('t')}
              GROUP BY t.GENERAL_LEDGER_ISSUER_ID, t.FIRM_ID
              ORDER BY t.GENERAL_LEDGER_ISSUER_ID`;
    }

    // ── state ──
    const data = {
      loaded: false, firmName: CONFIG.firm_name || '', today: new Date().toISOString().slice(0, 10),
      families: [], funds: new Map(), fundDates: [], wireRestricted: false, ctx: null, notes: [],
    };
    // The All Limited Partners table opens sorted by committed capital, largest first, with
    // every column's sort icon at rest until one is clicked (ui.sortKey stays null till then).
    const DEFAULT_SORT = { key: 'commit', dir: 'desc' };
    const tableSort = () => (ui.sortKey ? { key: ui.sortKey, dir: ui.sortDir } : DEFAULT_SORT);
    // menu: the one open popover ('contacts', 'x-fund' or 'filter'), or null.
    const ui = {
      view: 'list', q: '', sel: null, showDetail: false, menu: null,
      // exportBusy: an export is running (the Export button shows its progress, and the controls
      // that start an export wait); exportNote: the last one's outcome beside it; exportBrand: the viewer's
      // branding choice.
      exportBusy: '', exportNote: '', exportNoteError: false, exportBrand: 'carta',
      // tableChecked: LP rows ticked in the table, which the Export dialog opens with ticked.
      // dlg: the export dialog's picks, search and progress while it is open.
      tableChecked: new Set(), dlg: null,
      xMode: 'company', xFund: null, xOpen: new Set(), xAll: false, posAll: false,
      listW: null, sortKey: null, sortDir: null, open: new Set(), more: new Set(),
      // collapsed: the header is folded; foldH: the height folding gives back (null until measured).
      collapsed: false, foldH: null,
      // pinnedFold: the viewer started picking LPs, so the overview stays folded until they reopen it.
      pinnedFold: false,
      // wires, funds: the LP pane's filters (wire issues; picked fund uuids, none = all funds).
      // selBefore: the LP selected before a filter moved the selection, restored when filters clear.
      wires: false, funds: [], selBefore: null,
      // wiresSeen: the wire-issue count the viewer last saw by opening the filter menu. The button's
      // dot reads as a notification, so it clears once seen and returns only if the count grows.
      wiresSeen: 0,
    };

    const NO_LPS = 'No limited partners were found for this firm.';
    const NO_RETURNS_YET = 'No capital called yet';
    const noMatch = (q, who = 'Limited Partners') => `No ${who} match “${esc(q.trim())}”.`;
    // The list's and table's empty text: with a filter on, it names the filters too.
    function emptyRows() {
      if (!data.families.length) return NO_LPS;
      if (!ui.wires && !ui.funds.length) return noMatch(ui.q);
      return ui.q.trim() ? noMatch(ui.q, 'LPs in these filters') : 'No Limited Partners match these filters.';
    }
    const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => HTML_ESCAPES[ch]);
    const $ = id => document.getElementById(id);

    const ICON = {
      warning: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
      chevron: '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg>',
      chevronDown: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
      close: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
      download: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
      copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8h12v12H8zM16 8V4H4v12h4"/></svg>',
      copied: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
      check: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      checkbox: '<svg class="is-tick" width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M2 6.2l2.6 2.6L10 3.4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="is-dash" width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M2.5 6h7" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>',
      sortIdle: 'M21 16l-4 4-4-4M17 20V4M3 8l4-4 4 4M7 4v16',
      sortAsc: 'M5 12l7-7 7 7M12 19V5',
      sortDesc: 'M12 5v14M19 12l-7 7-7-7',
      expandAll: 'M1 7h12M7 5V1M5 2.5L7 .5 9 2.5M7 9v4M5 11.5L7 13.5 9 11.5',
      collapseAll: 'M1 7h12M7 1v4M5 3.5L7 5.5 9 3.5M7 13V9M5 10.5L7 8.5 9 10.5',
    };

    const SEP = '<span class="sep" aria-hidden="true">·</span>';

    function moneyLines(lines, key, fmt) {
      if (lines.length === 1) return esc(fmt(lines[0][key], lines[0].code));
      return '<span class="multi">' + lines.map(l => '<span>' + esc(fmt(l[key], l.code)) + '</span>').join('') + '</span>';
    }

    function familyView(fam) {
      return { fam, fig: figures(fam.records), wire: familyWire(fam.records.map(r => r.wire)) };
    }

    // Sortable table columns, each reading one currency's figures line, so LPs and their fund
    // rows sort by the same rules.
    const SORT_GETTERS = {
      commit: f => f.committed,
      funded: f => f.called,
      unfunded: f => f.unfunded,
      tvpi: f => (f.tvpi == null ? -Infinity : f.tvpi),
    };

    function sortValue(v, key) {
      if (key === 'name') return v.fam.name.toLowerCase();
      if (key === 'tvpi' && v.fig.mixed) return -Infinity;
      return SORT_GETTERS[key](v.fig.primary);
    }

    const compareFamilies = (key, dir) => (a, b) => compareValues(sortValue(a, key), sortValue(b, key), dir) || a.fam.name.localeCompare(b.fam.name);

    function sortRecords(records, key, dir) {
      const value = r => (key === 'name' ? String(r.fund_short).toLowerCase() : SORT_GETTERS[key](figures([r]).primary));
      return records.slice().sort((a, b) => compareValues(value(a), value(b), dir) || String(a.fund_short).localeCompare(String(b.fund_short)));
    }

    const fundMatches = (r, q) => r.fund_short.toLowerCase().includes(q) || String(r.fund_name).toLowerCase().includes(q);

    // The LP list: every LP whose name or any fund matches, in the table's order (largest
    // commitment first until the table is sorted otherwise), so switching views keeps it.
    // An LP matches the search by its name or any of its funds; an empty search matches every LP.
    function matchesSearch(fam, query) {
      const q = query.trim().toLowerCase();
      return !q || fam.name.toLowerCase().includes(q) || fam.records.some(r => fundMatches(r, q));
    }

    function listFamilies() {
      // Picked funds narrow each LP's figures here too, as they do in the table.
      return data.families.filter(f => passesFilters(f, ui.wires, ui.funds) && matchesSearch(f, ui.q))
        .map(f => { const rs = fundRecords(f, ui.funds); return familyView(rs === f.records ? f : { ...f, records: rs }); })
        .sort(compareFamilies(tableSort().key, tableSort().dir));
    }

    // The table: each LP narrowed to its funds that pass the fund filter and the text filter.
    function tableFamilies() {
      const q = ui.q.trim().toLowerCase();
      const out = [];
      for (const fam of data.families) {
        if (!passesFilters(fam, ui.wires, ui.funds)) continue;
        // The table narrows an LP to its positions in the picked funds.
        let records = fundRecords(fam, ui.funds);
        if (q && !fam.name.toLowerCase().includes(q)) records = records.filter(r => fundMatches(r, q));
        if (!records.length) continue;
        out.push(familyView(records === fam.records ? fam : { ...fam, records }));
      }
      out.sort(compareFamilies(tableSort().key, tableSort().dir));
      return out;
    }

    function fundLabel(fundUuid) {
      const f = data.funds.get(fundUuid);
      return f ? shortFundName(f.fund_name, data.firmName) : 'Fund';
    }

    // ── shared pieces ──
    // A wire state's pill classes, shared by every pill and the wire chip.
    function pillClass(state) { return `pill pill--${state.toLowerCase()}`; }

    function pill(state, label, tooltip, tipClass) {
      const p = `<span class="${pillClass(state)}">${esc(label || state)}</span>`;
      if (!tooltip) return p;
      return `<span class="ink-tooltip-wrap" tabindex="0"><span class="ink-tooltip${tipClass ? ' ' + tipClass : ''}" role="tooltip">${esc(tooltip)}</span>${p}</span>`;
    }

    // A dropdown built on the Ink secondary button: options are {key, label}; '' is "All funds".
    function dropdownHtml(id, label, options, current, menuClass, extraClass, name) {
      const open = ui.menu === id;
      const items = options.map(o => `<button class="menu-option" type="button" role="menuitemradio" aria-checked="${o.key === current}" data-option="${esc(o.key)}"><span>${esc(o.label)}</span>${ICON.check}</button>`).join('');
      return `<button class="ink-btn-secondary is-dropdown ${extraClass}" type="button" data-menu="${id}" aria-haspopup="menu" aria-expanded="${open}" aria-label="${esc(name)}: ${esc(label)}">${esc(label)}${ICON.chevronDown}</button>
        ${open ? `<div class="menu ${menuClass}" role="menu" data-menu-for="${id}">${items}</div>` : ''}`;
    }

    // The fund dropdowns' options, "All funds" first, and the one `selected` names.
    function fundOptions(funds, selected) {
      const options = [{ key: '', label: 'All funds' }].concat(funds);
      return { options, current: options.find(o => o.key === (selected || '')) || options[0] };
    }

    function notesHtml() {
      return data.notes.map(n => `<p class="note">${esc(n)}</p>`).join('');
    }

    // "As of <date>", with "· some funds earlier" and each earlier fund's month in a tooltip
    // when the funds are not all valued at the same month.
    function asOfHtml(fundDates) {
      const s = asOfSummary(fundDates);
      if (!s.date) return '';
      const base = 'As of ' + esc(dateLabel(s.date));
      if (!s.earlier.length) return base;
      const tip = s.earlier.map(e => esc(e.fund) + ': ' + esc(dateLabel(e.date))).join('<br>');
      return `${base} · <span class="ink-tooltip-wrap as-of-mixed" tabindex="0"><span class="ink-tooltip is-multiline is-end" role="tooltip">${tip}</span>some funds earlier</span>`;
    }

    // ── rendering: header ──
    // The funds the LPs hold, by name, for the filter menu.
    function filterFunds() {
      const used = new Set(data.families.flatMap(f => f.records.map(r => r.fund_uuid)));
      return Array.from(data.funds.values()).filter(f => used.has(f.fund_uuid))
        .map(f => ({ key: f.fund_uuid, label: fundLabel(f.fund_uuid) })).sort((a, b) => a.label.localeCompare(b.label));
    }

    // The filter button beside the search (its menu while open) and the chips for active filters.
    const FILTER_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/></svg>';
    function renderFilter() {
      const box = $('filter'), chips = $('pane-chips');
      if (!data.loaded) { box.innerHTML = ''; chips.innerHTML = ''; return; }
      const funds = filterFunds();
      const c = filterCounts(data.families.filter(f => matchesSearch(f, ui.q)), ui.wires, ui.funds, funds.map(f => f.key));
      const active = ui.wires || ui.funds.length > 0;
      const open = ui.menu === 'filter';
      if (open) ui.wiresSeen = Math.max(ui.wiresSeen, c.wires);
      const dot = c.wires > ui.wiresSeen && !ui.wires;
      const opt = (attrs, checked, label, n, extra = '', disabled = false) =>
        `<button class="menu-option" type="button" role="menuitemcheckbox" aria-checked="${checked}" ${attrs}${disabled ? ' disabled' : ''}>${ICON.check}<span>${label}${extra}</span><span class="n">${n}</span></button>`;
      const menu = !open ? '' : `<div class="menu filter-menu" role="menu" aria-label="Filter Limited Partners" data-menu-for="filter">
          <div class="menu-head">Status</div>
          ${opt('data-filter-wires', ui.wires, 'Wire issues', c.wires, c.wires ? '<span class="wire-dot" aria-hidden="true"></span>' : '', !c.wires && !ui.wires)}
          <hr><div class="menu-head">Fund</div>
          ${opt('data-filter-fund=""', !ui.funds.length, 'All funds', c.allFunds)}
          ${funds.map(f => opt(`data-filter-fund="${esc(f.key)}"`, ui.funds.includes(f.key), esc(f.label), c.funds[f.key])).join('')}
          <div class="menu-foot"><button class="menu-option clear-all" type="button" data-filter-clear${active ? '' : ' disabled'}><span>Clear all</span></button></div>
        </div>`;
      const label = 'Filter Limited Partners' + (dot ? ', ' + c.wires + ' with wire issues' : '') + (active ? ', filters on' : '');
      box.innerHTML = `<button class="filter-btn${active ? ' is-active' : ''}" type="button" data-menu="filter" aria-haspopup="menu" aria-expanded="${open}" aria-label="${label}" title="Filter">${FILTER_ICON}${dot ? '<span class="wire-dot filter-dot" aria-hidden="true"></span>' : ''}</button>${menu}`;
      const chip = (text, attrs) => `<span class="f-chip">${text}<button type="button" ${attrs} aria-label="Remove ${text} filter">${ICON.close.replace('width="20" height="20"', 'width="14" height="14"')}</button></span>`;
      chips.innerHTML = (ui.wires ? chip('Wire issues', 'data-chip-wires') : '')
        + ui.funds.map(k => chip(esc(fundLabel(k)), `data-chip-fund="${esc(k)}"`)).join('');
    }

    // A filter change re-checks the selection (pick clears selBefore, so an LP the viewer picked
    // while filtered stays when the filters clear).
    // The detail always shows an LP the list shows. When the filters or the search hide the
    // selected LP, the first one left is selected (none when nothing is left); once every filter
    // and the search clear, the LP from before returns.
    function syncSelection() {
      if (!ui.wires && !ui.funds.length && !ui.q.trim()) {
        if (ui.selBefore && findFamilyKey(ui.selBefore)) selectFamily(ui.selBefore);
        ui.selBefore = null;
        return;
      }
      const shown = listFamilies();
      if (shown.some(v => v.fam.key === ui.sel)) return;
      if (ui.selBefore == null && ui.sel != null) ui.selBefore = ui.sel;
      selectFamily(shown.length ? shown[0].fam.key : null);
    }

    function setFilters(wires, funds) {
      Object.assign(ui, { wires, funds });
      syncSelection();
      renderFilter();
      renderList();
      renderDetail();
      renderTable();
    }

    // The overview's figures; nothing until the data has loaded.
    function renderOverview() {
      const box = $('overview');
      // The figures set the header's height, so its fold height is measured again.
      ui.foldH = null;
      if (!data.loaded || !data.families.length) { box.innerHTML = ''; return; }
      const m = overviewModel(data.families);
      const item = (label, value) => `<div class="ov-item"><dt class="ov-label">${label}</dt><dd class="ov-value">${value}</dd></div>`;
      const tipped = (text, tip, cls) => `<span class="ink-tooltip-wrap as-of-mixed ${cls || ''}" tabindex="0"><span class="ink-tooltip is-multiline is-below is-start" role="tooltip">${tip}</span>${text}</span>`;
      const pct = x => Math.round(x * 100) + '%';

      // "+ EUR" after a main-currency figure: the other currencies' amounts, never added in.
      const otherNote = (others, line) => !others.length ? '' : ' · ' + tipped(esc(others.length === 1 ? '+ ' + others[0].code : '+ ' + others.length + ' currencies'),
        others.map(line).join('<br>'));
      const figure = n => `<span class="ov-num num" title="${esc(moneyExact(n, m.code))}">${esc(moneyRounded(n, m.code))}</span>`;
      const k = m.commitments, u = m.unfunded, d = m.distributions;
      const commitments = figure(k.amount)
        + `<span class="ov-sub">${k.lps} LP${k.lps === 1 ? '' : 's'}${otherNote(k.others, o => esc(moneyRounded(o.amount, o.code)) + ' committed in ' + esc(o.code) + ' funds')}</span>`;
      const unfunded = figure(u.amount)
        + `<span class="ov-sub">${u.share == null ? '' : pct(u.share) + ' of committed'}${otherNote(u.others, o => esc(moneyRounded(o.amount, o.code)) + ' unfunded in ' + esc(o.code) + ' funds')}</span>`;
      const distributions = figure(d.amount)
        + `<span class="ov-sub">${d.dpi == null ? esc(NO_RETURNS_YET) : esc(multiple(d.dpi)) + ' DPI'}${otherNote(d.others, o => esc(moneyRounded(o.amount, o.code)) + ' in ' + esc(o.code) + ' funds' + (o.dpi == null ? '' : ' · ' + esc(multiple(o.dpi)) + ' DPI'))}</span>`;

      const items = [item('Total commitments', commitments), item('Unfunded commitments', unfunded), item('Distributions', distributions)];
      const c = m.concentration;
      if (c) {
        const tip = c.top.map(t => esc(t.name) + ' · ' + pct(t.share)).join('<br>')
          + (c.unfundedShare == null ? '' : '<br><br>They owe ' + pct(c.unfundedShare) + ' of your unfunded' + (m.mixed ? ' in ' + esc(m.code) + ' funds' : '') + '.');
        items.push(item('Concentration', tipped(`<span class="ov-num num">${pct(c.share)}</span>`, tip)
          + `<span class="ov-sub">top ${CONCENTRATION_TOP} LPs${m.mixed ? ' in ' + esc(m.code) + ' funds' : ''}</span>`));
      }
      box.innerHTML = items.join('');
    }

    // The header collapses while a pane the current view shows is scrolled down, and opens again
    // at the top. Folding gives the panes the header's spare height, which shortens their scroll
    // range; a pane only collapses it when it would still be scrolled past the threshold after
    // that, or the header would fold and unfold on every scroll step.
    const COLLAPSE_AT = 60;

    // The scrolling panes the current view shows.
    function shownPanes() {
      return ui.view === 'table' ? Array.from(document.querySelectorAll('.t-scroll')) : [$('lp-list'), $('detail-pane')];
    }

    // How much height the header gives back when it folds, measured with transitions off so the
    // reading is the end state, not a frame of the animation. Cached until the layout changes.
    function foldHeight() {
      if (ui.foldH != null) return ui.foldH;
      const top = document.querySelector('.top');
      const was = top.classList.contains('is-collapsed');
      // Folding lengthens every pane, shown or hidden (the hidden view is still laid out), which
      // clamps their scroll; put each back where it was.
      const panes = [$('lp-list'), $('detail-pane'), ...document.querySelectorAll('.t-scroll')].filter(Boolean);
      const scrolls = panes.map(el => el.scrollTop);
      top.classList.add('is-measuring');
      top.classList.remove('is-collapsed');
      const open = top.offsetHeight;
      top.classList.add('is-collapsed');
      const shut = top.offsetHeight;
      top.classList.toggle('is-collapsed', was);
      void top.offsetHeight;
      panes.forEach((el, i) => { el.scrollTop = scrolls[i]; });
      top.classList.remove('is-measuring');
      ui.foldH = open - shut;
      return ui.foldH;
    }

    // Picking LPs means the viewer has read the overview, so the header folds at once to give the
    // panes room. After a mouse click on a row (holdRow, which the caller decides from the header's
    // state before the pick), the header folds in one step and a spacer at the list's top takes the
    // exact lift in the same frame, so that row stays put; it eases away SPACER_HOLD_MS later, or
    // sooner when the pointer leaves the LP pane.
    function foldForPick(holdRow) {
      if (ui.pinnedFold || isPhone()) return;
      const list = $('lp-list');
      if (!holdRow || !list) { ui.pinnedFold = true; syncCollapse(); setListSpacer(0); return; }
      const top = document.querySelector('.top');
      // Folding lengthens the list, which clamps its scroll; the spacer gives the range back, so
      // the old scroll is restored with it.
      const listTop = list.getBoundingClientRect().top, scroll = list.scrollTop;
      top.classList.add('is-measuring');
      list.classList.add('is-holding');
      ui.pinnedFold = true;
      syncCollapse();
      setListSpacer(Math.max(0, listTop - list.getBoundingClientRect().top));
      list.scrollTop = scroll;
      void list.offsetHeight;
      top.classList.remove('is-measuring');
      list.classList.remove('is-holding');
      // The spacer only bridges the fold: it never stays as a blank band while the viewer browses.
      spacerTimer = setTimeout(() => setListSpacer(0), SPACER_HOLD_MS);
    }

    // How long the clicked row is held in place: a beat for the eye to move to the detail.
    const SPACER_HOLD_MS = 450;

    // The pending ease-away of the last hold. Any reset of the spacer (setListSpacer) cancels it, so
    // an older timer never cuts a later hold short.
    let spacerTimer = null;

    function setListSpacer(px) {
      clearTimeout(spacerTimer);
      const list = $('lp-list');
      if (!list) return;
      list.style.setProperty('--list-spacer', px + 'px');
    }

    // The folded header, a click on it, or scrolling up from the top of a pane opens the overview again.
    function unfold() {
      if (!ui.pinnedFold) return;
      ui.pinnedFold = false;
      setListSpacer(0);
      syncCollapse();
    }

    function syncCollapse() {
      const panes = shownPanes();
      // On a phone the page scrolls as a whole and the header scrolls away with it.
      const byScroll = panes.some(el => el && el.scrollTop > COLLAPSE_AT
        && el.scrollHeight - el.clientHeight > COLLAPSE_AT + (ui.collapsed ? 0 : foldHeight()));
      const collapsed = !isPhone() && (ui.pinnedFold || byScroll);
      const top = document.querySelector('.top');
      // The reopen cue shows only while the pin alone holds the header folded, so using it always opens it.
      top.classList.toggle('is-pinned', collapsed && ui.pinnedFold && !byScroll);
      if (collapsed === ui.collapsed) return;
      ui.collapsed = collapsed;
      top.classList.toggle('is-collapsed', collapsed);
    }

    function renderView() {
      const split = $('split');
      split.classList.toggle('is-table', ui.view === 'table');
      split.classList.toggle('is-detail', ui.showDetail);
      for (const b of split.querySelectorAll('[data-view]')) b.setAttribute('aria-pressed', String(b.dataset.view === ui.view));
      // The view that is hidden leaves the keyboard order too.
      $('view-list').inert = ui.view !== 'list';
      $('view-table').inert = ui.view !== 'table';
      $('detail-pane').inert = ui.view !== 'list';
      syncCollapse();
    }

    // The LPs the dialog opens with ticked: the table's ticked rows in Table view, else the current LP.
    function defaultPicks() {
      if (ui.view === 'table' && ui.tableChecked.size) return data.families.filter(f => ui.tableChecked.has(f.key));
      const fam = selectedFamily();
      return fam ? [fam] : [];
    }

    // Export where the view can save files; elsewhere the same controls copy a table.
    const exportVerb = () => (downloads ? 'Export' : 'Copy');
    function exportLabel(n) { return exportVerb() + ' ' + (n === 1 ? 'profile' : n + ' profiles'); }

    // The header's Export button opens the dialog, where the PDF is previewed before it is saved.
    function renderExport() {
      const ready = data.loaded && data.families.length > 0;
      $('export').innerHTML = `<button class="ink-btn-secondary" type="button" data-export-dialog aria-haspopup="dialog"${ready && !ui.exportBusy ? '' : ' disabled'}>${ICON.download}${esc(ui.exportBusy || exportLabel(1))}</button>
        <span class="export-status${ui.exportNoteError ? ' is-error' : ''}" role="status" aria-live="polite">${esc(ui.exportNote)}</span>`;
    }

    // A list that scrolls fades at its bottom edge until it is scrolled to the end.
    function fadeExportList() {
      const list = $('dialog-list');
      if (!list) return;
      list.classList.toggle('is-faded', list.scrollHeight - list.clientHeight - list.scrollTop > 2);
    }

    // ── rendering: export dialog ──
    function dialogVisible() {
      const q = ui.dlg.q.trim().toLowerCase();
      return exportOrder().filter(f => !q || f.name.toLowerCase().includes(q));
    }

    function renderDialogList() {
      const d = ui.dlg;
      const rows = dialogVisible();
      $('dialog-list').innerHTML = rows.length ? rows.map(f => `<label class="check-row"><input type="checkbox" data-dialog-pick="${esc(f.key)}"${d.pick.has(f.key) ? ' checked' : ''}>
          <span class="ink-checkbox" aria-hidden="true">${ICON.checkbox}</span><span class="name" title="${esc(f.name)}">${esc(f.name)}</span>${f.key === ui.sel ? '<span class="tag">Current</span>' : ''}</label>`).join('')
        : `<div class="empty">${noMatch(d.q)}</div>`;
      const all = $('dialog-all');
      const n = d.pick.size;
      all.nextElementSibling.innerHTML = ICON.checkbox;
      all.checked = n === data.families.length;
      all.indeterminate = n > 0 && n < data.families.length;
      $('dialog-all-label').textContent = 'All (' + data.families.length + ')';
      fadeExportList();
    }

    // The Profiles select shows the one LP chosen, or how many.
    function renderProfilesValue() {
      const chosen = exportOrder().filter(f => ui.dlg.pick.has(f.key));
      $('profiles-value').textContent = chosen.length === 1 ? chosen[0].name : chosen.length ? chosen.length + ' profiles' : 'Choose profiles';
    }

    function setProfilesOpen(open) {
      ui.dlg.profilesOpen = open;
      $('profiles-panel').hidden = !open;
      $('profiles-trigger').setAttribute('aria-expanded', String(open));
      if (open) { renderDialogList(); $('dialog-q').focus(); }
    }

    // Template cards: Carta always; the firm's once its branding is set up, else a dashed slot
    // that copies the setup prompt for the viewer to paste in chat. A copied table has no
    // template, so the cards show only where the PDF can be saved.
    function renderTemplates() {
      const card = (key, thumb, title, sub) => `<button class="template-card" type="button" role="radio" aria-checked="${ui.exportBrand === key}" data-template="${key}">${thumb}<span class="template-text"><strong>${esc(title)}</strong><span>${esc(sub)}</span></span></button>`;
      const lines = '<i></i><i style="width:70%"></i><i style="width:50%"></i>';
      // With no accent the thumbnail keeps the stylesheet's default ink.
      const accent = BRAND && BRAND.accent ? ` style="--thumb-accent:rgb(${BRAND.accent.join(',')})"` : '';
      const firm = !BRAND ? '' : `<span class="template-thumb"${accent}><i></i>${BRAND.logoDataUri ? `<img src="${esc(BRAND.logoDataUri)}" alt="">` : '<span class="mark"></span>'}<i style="width:70%"></i></span>`;
      $('dialog-templates').innerHTML = !downloads ? '<span class="note">Copied as a table, with no template.</span>'
        : card('carta', `<span class="template-thumb">${lines}</span>`, 'Carta', 'Standard layout')
          + (BRAND ? card('firm', firm, BRAND.firmName, 'Your logo and colors')
            : `<div class="template-slot"><div><span class="template-thumb is-empty"></span><span class="template-text"><strong>Your firm</strong><span>Logo and colors, set up in Claude</span></span></div>
                <button class="ink-btn-secondary" type="button" data-brand-prompt>Copy setup prompt</button></div>`);
    }

    function renderDialogFoot() {
      const d = ui.dlg;
      const n = d.pick.size;
      $('dialog-count').innerHTML = (n ? '' : '<span class="is-error">Select at least one LP</span>')
        + (downloads && n > COMBINE_FROM && !d.busy ? '<button class="link-btn" type="button" data-dialog-combined>Save as one PDF instead</button>' : '')
        + (d.error ? `<span class="is-error" role="alert">${esc(d.error)}</span>` : '');
      const go = $('dialog-go');
      go.textContent = d.busy || exportLabel(n);
      go.disabled = !n || !!d.busy || !!ui.exportBusy;
    }

    function renderDialog() {
      if (!ui.dlg) return;
      // A copied table has no page to preview, so the stage shows only where the PDF can be saved.
      $('dialog-stage').hidden = !downloads;
      renderProfilesValue();
      if (ui.dlg.profilesOpen) renderDialogList();
      renderTemplates();
      renderDialogFoot();
      renderPreview();
    }

    // The preview is the export's own first page: drawProfiles paints onto a canvas through the
    // same calls it makes on a jsPDF document.
    let previewRun = 0;
    async function renderPreview() {
      const canvas = $('dialog-preview');
      const d = ui.dlg;
      const fam = d && (exportOrder().find(f => d.pick.has(f.key)) || selectedFamily());
      if (!downloads || !fam) return;
      const run = ++previewRun;
      const doc = new CanvasDoc(canvas, 300);
      // The preview follows the chosen template as it changes.
      const brand = await exportBrandAssets(doc, ui.exportBrand);
      await doc.ready(brand);
      if (run !== previewRun) return;
      doc.mount();
      drawProfiles(doc, [profileModel(fam, data.ctx, fundLabel)], { firm: data.firmName, generated: dateLabel(data.today), brand });
    }

    // Each preview font loads once for the page, however often the preview redraws.
    const previewFonts = new Map();

    // A canvas standing in for a jsPDF document: page one only, in points scaled to `width`.
    // Helvetica is jsPDF's built-in face, so the canvas uses the same family.
    class CanvasDoc {
      constructor(canvas, width) {
        this.canvas = canvas; this.width = width; this.k = width / PDF.w;
        // A scratch context until mount(): measuring works on it, drawing waits for mount().
        this.ctx = document.createElement('canvas').getContext('2d');
        this.page = 1; this.pages = 1; this.size = 10; this.face = 'helvetica'; this.style = 'normal';
        this.fill = '#000'; this.stroke = '#000'; this.textFill = '#000'; this.images = new Map(); this.fonts = [];
      }
      // Images and a display font load before drawing, which is synchronous like jsPDF's.
      async ready(brand) {
        const load = src => new Promise(res => { const img = new Image(); img.onload = () => res(img); img.onerror = () => res(null); img.src = src; });
        for (const src of [brand && brand.logo && brand.logo.data, brand && brand.poweredBy && brand.poweredBy.data].filter(Boolean)) this.images.set(src, await load(src));
        await Promise.all(this.fonts);
      }
      // Sizing a canvas clears it, so this runs only just before drawing: the old preview stays
      // up until the new one is ready to replace it.
      mount() {
        const dpr = window.devicePixelRatio || 1, canvas = this.canvas;
        canvas.width = Math.round(this.width * dpr * 2); canvas.height = Math.round(PDF.h * this.k * dpr * 2);
        canvas.style.width = this.width + 'px'; canvas.style.height = Math.round(PDF.h * this.k) + 'px';
        this.ctx = canvas.getContext('2d');
        this.ctx.setTransform(this.k * dpr * 2, 0, 0, this.k * dpr * 2, 0, 0);
        this.ctx.fillStyle = '#fff'; this.ctx.fillRect(0, 0, PDF.w, PDF.h);
      }
      on() { return this.page === 1; }
      rgb(c) { return 'rgb(' + c.join(',') + ')'; }
      cssFont() {
        const family = this.face === 'helvetica' ? 'Helvetica, Arial, sans-serif' : '"' + this.face + '", Helvetica, sans-serif';
        return (this.style === 'bold' ? '700 ' : '400 ') + this.size + 'px ' + family;
      }
      setFont(face, style) { this.face = face; this.style = style || 'normal'; }
      setFontSize(n) { this.size = n; }
      setTextColor(...c) { this.textFill = this.rgb(c); }
      setFillColor(...c) { this.fill = this.rgb(c); }
      setDrawColor(...c) { this.stroke = this.rgb(c); }
      setLineWidth(w) { this.lineWidth = w; }
      getTextWidth(t) { this.ctx.font = this.cssFont(); return this.ctx.measureText(t).width; }
      splitTextToSize(t, width) {
        const words = String(t).split(' '), lines = [];
        let line = '';
        for (const w of words) { const next = line ? line + ' ' + w : w; if (line && this.getTextWidth(next) > width) { lines.push(line); line = w; } else line = next; }
        return line ? lines.concat(line) : lines;
      }
      text(t, x, y, opts) {
        if (!this.on()) return;
        const c = this.ctx;
        c.font = this.cssFont(); c.fillStyle = this.textFill;
        c.textAlign = opts && opts.align === 'right' ? 'right' : 'left';
        c.letterSpacing = opts && opts.charSpace ? opts.charSpace + 'px' : '0px';
        c.fillText(t, x, y);
      }
      line(x1, y1, x2, y2) { if (!this.on()) return; const c = this.ctx; c.strokeStyle = this.stroke; c.lineWidth = this.lineWidth || 1; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
      rect(x, y, w, h) { if (!this.on()) return; this.ctx.fillStyle = this.fill; this.ctx.fillRect(x, y, w, h); }
      roundedRect(x, y, w, h, r, _ry, style) {
        if (!this.on()) return;
        const c = this.ctx;
        c.beginPath(); c.roundRect(x, y, w, h, r);
