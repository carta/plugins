    :root {
      color-scheme: light dark;
      /* The header's fold timing; the LP list's spacer eases away on the same curve. */
      --fold: 150ms ease-out;
      --ink-color-global-text-default:                light-dark(#1A1A1A, #EDEDED);
      --ink-color-global-text-subtle:                 light-dark(#656B6B, #A7AAAA);
      --ink-color-global-text-inverse:                light-dark(#FFFFFF, #1A1A1A);
      --ink-color-global-text-disabled:               light-dark(#CECFCF, #656B6B);
      --ink-color-global-surface-background-default:  light-dark(#FFFFFF, rgb(18 18 18));
      --ink-color-global-surface-darkgray-default:    light-dark(#1A1A1A, #394040);
      --ink-color-global-surface-lightgray-default:   light-dark(#F1F1F1, #202020);
      --ink-color-global-surface-disabled:            light-dark(#EDEDED, #394040);
      --ink-color-global-border-subtle:               light-dark(#DEDFDF, #2D2D2D);
      --ink-color-global-border-default:              light-dark(#A7AAAA, #656B6B);
      --ink-color-global-border-hover:                light-dark(#656B6B, #9C9F9F);
      --ink-color-global-border-active:               light-dark(#1A1A1A, #CECFCF);
      --ink-color-global-border-focus-default:        light-dark(#285DA3, #8BABD6);
      --ink-color-global-border-focus-light:          light-dark(#C0D1E9, #1A3E6D);
      --ink-color-global-link-default:                light-dark(#285DA3, #8BABD6);
      --ink-color-global-feedback-negative-subtle:    light-dark(#FFEEEF, #401018);
      --ink-color-global-feedback-negative-strong:    light-dark(#E52431, #FAD9D7);
      --ink-color-global-feedback-positive-strong:    light-dark(#2D9E90, #2D9E90);
      --ink-color-global-feedback-warning-subtle:     light-dark(#FFFCED, #341C00);
      --ink-color-global-feedback-info-subtle:        light-dark(#EAF0F8, #122948);
      --ink-color-global-feedback-neutral-subtle:     light-dark(#F1F1F1, #202020);
      --ink-button-background-color-primary-base-default: light-dark(#1A1A1A, #FFFFFF);
      --ink-button-font-color-primary-base:           light-dark(#FFFFFF, #1A1A1A);
      --ink-elevation-global-shadow-medium:           0 4px 20px 0 rgb(0 0 0 / 0.1);
      --ink-size-global-radius-subtle:                4px;
      --ink-font-global-family-base:                  Inter, system-ui, sans-serif;
      --ink-font-global-family-prominent:             "SangBleu Versailles", Georgia, serif;
      /* Ink type scale (theme-with-ink tokens.css): every font size on the page is one of these. */
      --ink-font-global-size-small-1:                        12px;
      --ink-font-global-size-body-1:                         14px;
      --ink-font-global-size-heading-3:                      16px;
      --ink-font-global-size-heading-2-desktop:              20px;
      --ink-font-global-size-heading-1-mobile:               24px;
      --ink-font-global-size-heading-1-desktop:              28px;
      --ink-font-global-size-display-1:                      28px;
      --ink-font-global-leading-display-1:            48px;
      /* The overview figures: 36px on a wide window, above the 28px title, scaling down to 26px,
         always above the 24px LP name. */
      --local-font-size-kpi:                          clamp(26px, 2.5vw, 36px);
      --ink-font-global-weight-heading-1:             400;
      /* Row rules and the soft control wash: gray-30 in light, gray-90 in dark. */
      --local-color-wash: light-dark(#E9EAEA, #394040);
      --local-color-row-hover: light-dark(#F7F7F7, #202020);
      /* All Limited Partners table geometry: the "+N more" row and the footer line up with it. */
      --local-table-min: 960px;
      /* The page's left and right inset: the header, the LP pane's content and the table all
         start on this line, while the pane's background and dividers run edge to edge. */
      --local-page-x: 48px;
      --local-fund-indent: 44px;
      --local-t-first: minmax(280px, 2.2fr);
      --local-color-row-selected: light-dark(#FAFAFA, #1A1A1A);
      --local-color-negative-text: light-dark(#A3301D, #FAD9D7);
      /* Ink Bubble feedback colours (theme-with-ink tokens.css), verbatim. */
      --ink-color-global-feedback-positive-subtle:    light-dark(#EBF7F6, #063A32);
      --ink-color-global-feedback-neutral-strong:     light-dark(#1A1A1A, #9C9F9F);
      --ink-color-global-brand-yellow-80:             #B58A00;
      /* Wire pill text: each family's darker step, AA on its subtle fill in both themes. */
      --local-color-pill-positive-text: light-dark(#1F6B45, #D6EFEC);
      --local-color-pill-pending-text:  light-dark(#705010, #FCEFB6);
      --local-color-pill-negative-text: light-dark(#A82020, #FAD9D7);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--ink-color-global-surface-background-default);
      color: var(--ink-color-global-text-default);
      font-family: var(--ink-font-global-family-base);
    }
    button, input { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--ink-color-global-border-focus-default); box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
    .num { font-variant-numeric: tabular-nums; }
    .sep { color: var(--ink-color-global-border-default); }
    .note { margin: 0; font-size: var(--ink-font-global-size-small-1); line-height: 20px; color: var(--ink-color-global-text-subtle); }

    /* The page fills the window: the header stays, each pane scrolls on its own. */
    .app { height: 100vh; display: flex; flex-direction: column; }
    .top { position: relative; z-index: 5; padding: 40px var(--local-page-x) 0; box-shadow: inset 0 -1px 0 var(--ink-color-global-border-subtle); background: var(--ink-color-global-surface-background-default); display: flex; flex-direction: column; gap: 16px; transition: padding var(--fold), gap var(--fold), box-shadow var(--fold); }
    .carta-logo { display: block; width: 64px; height: 32px; color: var(--ink-color-global-text-default); }
    #update-banner-slot:empty { display: none; }
    .title-row { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; transition: margin var(--fold), gap var(--fold); }
    .title-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; }
    .eyebrow { font: 400 var(--ink-font-global-size-body-1)/20px var(--ink-font-global-family-base); color: var(--ink-color-global-text-subtle); }
    h1 { margin: 0; font: var(--ink-font-global-weight-heading-1) var(--ink-font-global-size-display-1)/40px var(--ink-font-global-family-prominent); transition: font-size var(--fold), line-height var(--fold); }
    .top-tools { grid-column: 10 / 13; justify-self: end; display: flex; align-items: center; }
    /* A block that folds away when the header collapses: its row eases from full height to none. */
    .fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--fold), opacity var(--fold); }
    .fold > div { min-height: 0; overflow: hidden; }
    /* Overview: up to four figures under the title, Export on their right. */
    /* The header's 12-column grid: the figures share the first 9 columns, Export the last 3. */
    .overview-row { margin-top: 12px; padding-bottom: 32px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; align-items: center; transition: padding var(--fold), margin var(--fold); }
    /* Label and figure rows are shared, so a label that wraps on a narrow window keeps the four figures level. */
    .overview { margin: 0; grid-column: 1 / 10; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: auto auto; column-gap: 24px; row-gap: 4px; }
    .overview:empty { display: none; }
    .ov-item { display: grid; grid-row: span 2; grid-template-rows: subgrid; row-gap: 4px; min-width: 0; }
    .ov-label { align-self: end; transition: font-size var(--fold); font: 600 var(--ink-font-global-size-small-1)/16px var(--ink-font-global-family-base); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-color-global-text-subtle); }
    /* The figure, then its qualifier on the line under it, the same for all four. */
    .ov-value { margin: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
    .ov-num { font: 600 var(--local-font-size-kpi)/1.2 var(--ink-font-global-family-base); letter-spacing: -.01em; transition: font-size var(--fold), line-height var(--fold); }
    .ov-num.is-negative { color: var(--local-color-negative-text); }
    .ov-sub { transition: font-size var(--fold); font: 400 var(--ink-font-global-size-body-1)/20px var(--ink-font-global-family-base); color: var(--ink-color-global-text-subtle); }
    .ov-item .as-of-mixed { text-decoration-color: var(--ink-color-global-border-default); }
    /* Once either pane scrolls, the header collapses: logo and firm name fold away, the title and
       figures step down the type scale, and the figures stay in view. */
    /* The folded logo keeps its 12px flex gap, so 4px of padding puts the title 16px down. */
    .top.is-collapsed { padding-top: 4px; gap: 12px; box-shadow: inset 0 -1px 0 var(--ink-color-global-border-subtle), 0 2px 8px rgb(0 0 0 / 0.06); }
    .top.is-collapsed .fold { grid-template-rows: 0fr; opacity: 0; }
    /* Folded by an LP pick alone, the header opens again on a click, and a Show overview button
       offers the same to the keyboard. */
    .top.is-collapsed.is-pinned { cursor: pointer; }
    .top.is-collapsed.is-pinned:hover { background: var(--local-color-row-hover); }
    /* 28px, the folded title's line, so showing it never changes the folded header's height. */
    .ink-btn-secondary.is-small.reopen-btn { display: none; align-self: center; height: 28px; }
    .top.is-collapsed.is-pinned .ink-btn-secondary.reopen-btn { display: inline-flex; }
    .top.is-measuring, .top.is-measuring * { transition: none !important; }
    .top.is-collapsed .title-row { margin-top: 0; gap: 0; }
    .top.is-collapsed h1 { font-size: var(--ink-font-global-size-heading-2-desktop); line-height: 28px; }
    .top.is-collapsed .overview-row { margin-top: 0; padding-bottom: 14px; }
    .top.is-collapsed .ov-item { row-gap: 0; }
    .top.is-collapsed .ov-num { font-size: var(--ink-font-global-size-heading-3); line-height: 24px; }
    .top.is-collapsed .ov-sub { font-size: var(--ink-font-global-size-small-1); line-height: 24px; }
    .top.is-collapsed .ov-value { flex-direction: row; align-items: baseline; column-gap: 8px; }
    .top.is-collapsed .export-wrap .ink-btn-secondary { height: 32px; font-size: var(--ink-font-global-size-small-1); }
    .as-of { font: 400 var(--ink-font-global-size-small-1)/20px var(--ink-font-global-family-base); color: var(--ink-color-global-text-subtle); white-space: nowrap; }
    .as-of-mixed { text-decoration: underline dotted; text-underline-offset: 3px; cursor: default; }
    .alerts { padding: 16px var(--local-page-x) 0; display: flex; flex-direction: column; gap: 8px; }
    .alerts:not(:has(> :not([hidden]))) { display: none; }
    /* Ink Alert. */
    .ink-alert { padding: 16px; font-size: var(--ink-font-global-size-body-1); line-height: 20px; }
    .ink-alert--negative { background: var(--ink-color-global-feedback-negative-subtle); }

    /* Ink secondary button and the dropdown trigger built on it. */
    .ink-btn-secondary { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--ink-color-global-border-default); border-radius: var(--ink-size-global-radius-subtle); background: var(--ink-color-global-surface-background-default); font: 500 var(--ink-font-global-size-body-1)/20px var(--ink-font-global-family-base); color: var(--ink-color-global-text-default); white-space: nowrap; transition: border-color 120ms ease-out; }
    .ink-btn-secondary:hover { border-color: var(--ink-color-global-border-active); }
    .ink-btn-secondary:focus-visible { border-color: var(--ink-color-global-border-focus-default); box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light); outline: none; }
    .ink-btn-secondary.is-dropdown { padding: 0 10px 0 12px; }
    .ink-btn-secondary.is-small { height: 32px; font-size: var(--ink-font-global-size-small-1); }
    .ink-btn-primary { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; height: 36px; padding: 0 12px; border-radius: var(--ink-size-global-radius-subtle); background: var(--ink-button-background-color-primary-base-default); color: var(--ink-button-font-color-primary-base); font: 500 var(--ink-font-global-size-body-1)/20px var(--ink-font-global-family-base); }
    .ink-btn-primary:disabled { cursor: not-allowed; background: var(--ink-color-global-surface-disabled); color: var(--ink-color-global-text-disabled); }
    .ink-btn-primary:focus-visible { box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light); }
    /* Ink Dropdown menu. */
    .menu-wrap { position: relative; flex: none; }
    .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--ink-color-global-surface-background-default); border: 1px solid var(--ink-color-global-border-subtle); border-radius: var(--ink-size-global-radius-subtle); box-shadow: var(--ink-elevation-global-shadow-medium); padding: 6px 0; display: flex; flex-direction: column; max-height: min(320px, 60vh); overflow: auto; }
    .menu.is-start { right: auto; left: 0; }
    .menu-option { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 6px 12px; min-height: 32px; font: 400 var(--ink-font-global-size-body-1)/20px var(--ink-font-global-family-base); color: var(--ink-color-global-text-default); white-space: nowrap; }
    .menu-option:hover { background: var(--local-color-wash); }
    .menu-option:focus-visible { box-shadow: inset 0 0 0 2px var(--ink-color-global-border-focus-default); }
    .menu-option[aria-checked="true"] { font-weight: 500; }
    .menu-option > span { flex: 1; }
    .menu-option svg { opacity: 0; }
    .menu-option[aria-checked="true"] svg { opacity: 1; }
    .menu-title { font: 600 var(--ink-font-global-size-body-1)/24px var(--ink-font-global-family-base); color: var(--ink-color-global-text-default); }
    .contacts-menu, .fund-menu { box-sizing: content-box; }
    .link-btn { all: unset; cursor: pointer; font: 400 var(--ink-font-global-size-small-1)/20px var(--ink-font-global-family-base); color: var(--ink-color-global-link-default); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
    .link-btn:focus-visible { outline: 2px solid var(--ink-color-global-border-focus-default); }
    /* Export: one button that opens the Export profiles dialog. */
    .export-status { font: 400 var(--ink-font-global-size-small-1)/20px var(--ink-font-global-family-base); color: var(--ink-color-global-text-subtle); }
    .export-status:empty { display: none; }
    .export-status.is-error { color: var(--local-color-negative-text); }
    /* Ink Checkbox (with an indeterminate state for "All"). */
    .check-row { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; cursor: pointer; font: 400 var(--ink-font-global-size-body-1)/20px var(--ink-font-global-family-base); }
    .check-row:hover { background: var(--local-color-row-hover); }
    .check-row input, .t-check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .ink-checkbox { width: 20px; height: 20px; flex: none; border-radius: var(--ink-size-global-radius-subtle); border: 1px solid var(--ink-color-global-border-default); background: var(--ink-color-global-surface-background-default); display: inline-flex; align-items: center; justify-content: center; color: var(--ink-color-global-text-inverse); }
    .ink-checkbox svg { display: none; }
    input:checked + .ink-checkbox, input:indeterminate + .ink-checkbox { border-color: var(--ink-color-global-text-default); background: var(--ink-color-global-text-default); }
    input:checked:not(:indeterminate) + .ink-checkbox .is-tick, input:indeterminate + .ink-checkbox .is-dash { display: block; }
    input:focus-visible + .ink-checkbox { box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light); border-color: var(--ink-color-global-border-focus-default); }
    .check-row .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .check-row .tag { margin-left: auto; flex: none; font-size: var(--ink-font-global-size-small-1); color: var(--ink-color-global-text-subtle); }
    .check-row.is-all { border-bottom: 1px solid var(--ink-color-global-border-subtle); font-weight: 500; }
    /* Ink structured Modal on a native <dialog>: header, body, footer. */
    .ink-modal { width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 0; border-radius: 8px; background: var(--ink-color-global-surface-background-default); color: var(--ink-color-global-text-default); box-shadow: 0 8px 24px rgb(0 0 0 / 0.12); }
    .ink-modal[open] { display: flex; flex-direction: column; }
    .ink-modal::backdrop { background: rgb(0 0 0 / 0.5); }
    .ink-modal__header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; border-bottom: 1px solid var(--ink-color-global-border-subtle); }
    .ink-modal__header h2 { margin: 0; font: 600 var(--ink-font-global-size-heading-2-desktop)/28px var(--ink-font-global-family-base); }
    .ink-modal__close { width: 32px; height: 32px; }
    .ink-modal__body { flex: 1; min-height: 0; overflow: auto; padding: 20px 24px; }
    .ink-modal__footer { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; padding: 16px 24px; border-top: 1px solid var(--ink-color-global-border-subtle); }
    /* Export dialog: Profiles and Template on the left, the first page's live preview on the right. */
    .export-body { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; }
    .export-left { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
    .export-group { display: flex; flex-direction: column; gap: 8px; }
    .export-label { font: 500 var(--ink-font-global-size-body-1)/20px var(--ink-font-global-family-base); }
    /* Profiles: an Ink select whose panel holds the LP checklist. */
    .profiles-wrap { position: relative; }
    .profiles-select { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px 0 12px; border: 1px solid var(--ink-color-global-border-default); border-radius: var(--ink-size-global-radius-subtle); background: var(--ink-color-global-surface-background-default); font: 400 var(--ink-font-global-size-body-1)/20px var(--ink-font-global-family-base); }
    .profiles-select > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .profiles-select svg { flex: none; color: var(--ink-color-global-text-subtle); }
    .profiles-select:hover { border-color: var(--ink-color-global-border-active); }
    .profiles-select:focus-visible { border-color: var(--ink-color-global-border-focus-default); box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light); }
    .profiles-panel { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; display: flex; flex-direction: column; gap: 8px; padding: 8px; background: var(--ink-color-global-surface-background-default); border: 1px solid var(--ink-color-global-border-subtle); border-radius: var(--ink-size-global-radius-subtle); box-shadow: var(--ink-elevation-global-shadow-medium); }
    .profiles-panel .search { height: 36px; }
    .export-checks { border: 1px solid var(--ink-color-global-border-subtle); border-radius: var(--ink-size-global-radius-subtle); }
    .export-list { max-height: 240px; overflow: auto; }
    .export-list.is-faded { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 32px), transparent); }
    .export-list .empty { padding: 24px 12px; }
    /* Template: Ink SelectableList cards; the whole card is the control. */
    .template-card { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--ink-color-global-border-default); border-radius: var(--ink-size-global-radius-subtle); }
    .template-card[aria-checked="true"] { border-color: var(--ink-color-global-text-default); box-shadow: inset 0 0 0 1px var(--ink-color-global-text-default); }
    .template-card:hover { border-color: var(--ink-color-global-border-active); }
    .template-card:focus-visible { box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light); border-color: var(--ink-color-global-border-focus-default); }
    .template-cards { display: flex; flex-direction: column; gap: 8px; }
    .template-text { display: flex; flex-direction: column; min-width: 0; }
    .template-text strong { font: 500 var(--ink-font-global-size-body-1)/20px var(--ink-font-global-family-base); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .template-text span { font: 400 var(--ink-font-global-size-small-1)/16px var(--ink-font-global-family-base); color: var(--ink-color-global-text-subtle); }
    /* A 36x46 page in miniature: the template's top rule, then its lines. */
    .template-thumb { flex: none; box-sizing: border-box; width: 36px; height: 46px; padding: 4px; display: flex; flex-direction: column; gap: 3px; border: 1px solid var(--ink-color-global-border-subtle); background: #FFFFFF; }
    .template-thumb i { display: block; height: 2px; background: var(--ink-color-global-border-subtle); }
    .template-thumb i:first-child { background: var(--thumb-accent, #1A1A1A); }
    .template-thumb .mark { width: 6px; height: 6px; background: var(--thumb-accent, #1A1A1A); }
    .template-thumb img { display: block; max-width: 26px; max-height: 8px; object-fit: contain; object-position: left; }
    .template-thumb.is-empty { border-style: dashed; border-color: var(--ink-color-global-border-default); background: none; }
    /* The firm's slot before its branding is set up: not selectable; it offers the setup prompt. */
    .template-slot { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px dashed var(--ink-color-global-border-default); border-radius: var(--ink-size-global-radius-subtle); }
    .template-slot > div { display: flex; align-items: center; gap: 12px; }
    .template-slot .ink-btn-secondary { justify-content: center; width: 100%; height: 32px; }
    .export-stage { display: flex; align-items: flex-start; justify-content: center; padding: 20px; border-radius: var(--ink-size-global-radius-subtle); background: var(--local-color-row-hover); }
    /* Copying a table: no preview, so the left column has the dialog to itself. */
    #export-dialog:has(.export-stage[hidden]) { width: min(440px, calc(100vw - 32px)); }
    .export-body:has(> .export-stage[hidden]) { grid-template-columns: minmax(0, 1fr); }
    .export-preview { display: block; max-width: 100%; height: auto !important; background: #FFFFFF; box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }
    /* "Copied" confirms in a brief dark tooltip above the button, which itself never changes. */
    .copied-tip { position: fixed; z-index: 60; left: 0; top: 0; transform: translate(-50%, calc(-100% - 2px)); background: var(--ink-color-global-surface-darkgray-default); color: #FFFFFF; padding: 6px 10px; border-radius: var(--ink-size-global-radius-subtle); font: 500 var(--ink-font-global-size-small-1)/1.4 var(--ink-font-global-family-base); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s ease, transform .3s cubic-bezier(.34,1.56,.64,1); }
    .copied-tip.is-on { opacity: 1; transform: translate(-50%, calc(-100% - 10px)); }
    .export-count { font: 400 var(--ink-font-global-size-body-1)/20px var(--ink-font-global-family-base); color: var(--ink-color-global-text-subtle); display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
    .export-count .is-error { color: var(--local-color-negative-text); }
    .export-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    @media (max-width: 640px) {
      .export-body { grid-template-columns: minmax(0, 1fr); }
      .export-stage { padding: 12px; }
      .ink-modal__body, .ink-modal__header, .ink-modal__footer { padding-left: 16px; padding-right: 16px; }
    }
    /* Table rows can be ticked; the Export dialog opens with them ticked. */
    .t-check { position: relative; flex: none; display: inline-flex; align-items: center; height: 21px; cursor: pointer; }

    /* Ink Tooltip. */
    .ink-tooltip-wrap { position: relative; display: inline-flex; }
    .ink-tooltip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); z-index: 30; background: var(--ink-color-global-surface-darkgray-default); color: #FFFFFF; padding: 6px 10px; font: 500 var(--ink-font-global-size-small-1)/1.4 var(--ink-font-global-family-base); border-radius: var(--ink-size-global-radius-subtle); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .16s ease-out; }
    .ink-tooltip-wrap:hover .ink-tooltip, .ink-tooltip-wrap:focus-within .ink-tooltip { opacity: 1; }
    .ink-tooltip.is-multiline { white-space: normal; width: max-content; max-width: 280px; text-align: left; }
    .ink-tooltip.is-end { left: auto; right: 0; transform: none; }
    .ink-tooltip.is-start { left: 0; transform: none; }
    .wire-tip-item { display: flex; flex-direction: column; }
    .wire-tip-item + .wire-tip-item { margin-top: 8px; }
    .wire-tip-item strong { font-weight: 600; }
    .ink-tooltip.is-below { bottom: auto; top: calc(100% + 8px); }
    /* Wire pill: Ink <Bubble>, feedback variants (h18, px-2, text-xs medium, rounded max). The fill
       is the variant's subtle colour and the 1px border its strong colour; the text takes a darker
       step so 12px labels clear AA, which the strong colours do not. Confirmed = positive,
       Unverified and Stale = pending, Missing = negative, Restricted = neutral. */
    .pill { display: inline-flex; height: 18px; align-items: center; padding: 0 8px; border: 1px solid currentColor; border-radius: 999px; font: 500 var(--ink-font-global-size-small-1)/1 var(--ink-font-global-family-base); white-space: nowrap; cursor: default; }
    .pill--confirmed  { background: var(--ink-color-global-feedback-positive-subtle); border-color: var(--ink-color-global-feedback-positive-strong); color: var(--local-color-pill-positive-text); }
    .pill--unverified, .pill--stale { background: var(--ink-color-global-feedback-warning-subtle); border-color: var(--ink-color-global-brand-yellow-80); color: var(--local-color-pill-pending-text); }
    .pill--missing    { background: var(--ink-color-global-feedback-negative-subtle); border-color: var(--ink-color-global-feedback-negative-strong); color: var(--local-color-pill-negative-text); }
    .pill--restricted { background: var(--ink-color-global-feedback-neutral-subtle); color: var(--ink-color-global-feedback-neutral-strong); }
    /* Ink Shimmer while rows load. */
    @keyframes shimRoll { 0% { background-position: 150% 0; } 100% { background-position: -50% 0; } }
    .sh { display: block; height: 16px; border-radius: 4px; background: var(--local-color-wash); background-image: linear-gradient(to right, var(--local-color-wash) 0%, var(--ink-color-global-surface-lightgray-default) 20%, var(--local-color-wash) 60%, var(--local-color-wash) 100%); background-repeat: no-repeat; background-size: 200% 100%; animation: shimRoll 1.4s linear infinite; }
    .empty { padding: 48px 20px; text-align: center; color: var(--ink-color-global-text-subtle); font-size: var(--ink-font-global-size-body-1); }
    .icon-btn { all: unset; box-sizing: border-box; cursor: pointer; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--ink-size-global-radius-subtle); color: var(--ink-color-global-text-subtle); }
    .icon-btn:hover { background: var(--local-color-wash); color: var(--ink-color-global-text-default); }
    .icon-btn:focus-visible { outline: 2px solid var(--ink-color-global-border-focus-default); }
    /* Ink Input with a leading search icon. */
    .search { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 1px solid var(--ink-color-global-border-default); border-radius: var(--ink-size-global-radius-subtle); color: var(--ink-color-global-text-subtle); }
    .search:hover { border-color: var(--ink-color-global-border-hover); }
    .search:focus-within { border-color: var(--ink-color-global-border-focus-default); box-shadow: 0 0 0 4px var(--ink-color-global-border-focus-light); }
    .search svg { flex: none; }
    .search input { all: unset; flex: 1; min-width: 0; font: 400 var(--ink-font-global-size-body-1)/20px var(--ink-font-global-family-base); color: var(--ink-color-global-text-default); }
    .search input::placeholder { color: var(--ink-color-global-text-subtle); }
    .search.is-small { height: 36px; width: 300px; max-width: 100%; }

    /* ── By Limited Partner: list | detail ── */
    /* The List | Table toggle: the LP pane slides open over the detail into the full table and
       back. The pane's tools row and column-header row keep one height in both views, and the
       table is laid out at its final width from the start, so no line moves while it opens. */
    .split { --list-w: calc(332px + 2 * var(--local-page-x)); --head-h: 40px; --open: 340ms cubic-bezier(.22,1,.36,1); position: relative; flex: 1; min-height: 0; }
    .lp-pane { position: absolute; inset: 0 auto 0 0; z-index: 2; width: var(--list-w); overflow: hidden; display: flex; flex-direction: column; background: var(--ink-color-global-surface-background-default); border-right: 1px solid var(--ink-color-global-border-subtle); transition: width var(--open), border-color var(--open); }
    .split.is-table .lp-pane { width: 100%; border-right-color: transparent; }
    .pane-tools { flex: none; display: flex; gap: 16px; padding: 16px var(--local-page-x) 15px; border-bottom: 1px solid var(--ink-color-global-border-subtle); }
    .pane-tools-main { flex: none; width: calc(var(--list-w) - 2 * var(--local-page-x)); display: flex; flex-wrap: wrap; gap: 12px 16px; }
    /* A narrowed pane puts the filter under the toggle rather than squeezing it. */
    .pane-tools .ink-btn-secondary { height: 40px; }
    /* List | Table: the shared Ink ButtonGroup (.seg), small and icon-only: 32px tall, square
       segments, each inside its tooltip wrapper. */
    .seg.view-toggle { flex: none; align-self: center; }
    .view-toggle > .ink-tooltip-wrap { display: flex; }
    .seg.view-toggle button { justify-content: center; width: 32px; padding: 0; }
    .view-toggle .ink-tooltip { bottom: auto; top: calc(100% + 8px); }
    .pane-body { position: relative; flex: 1; min-height: 0; }
    /* The search and the filter button read as one field: the button sits on its right edge. */
    .search-group { flex: 1 1 140px; min-width: 140px; display: flex; position: relative; }
    .search-group .search { flex: 1; min-width: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .filter-btn { all: unset; box-sizing: border-box; position: relative; flex: none; width: 44px; height: 40px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--ink-color-global-border-default); border-left: 0; border-radius: 0 var(--ink-size-global-radius-subtle) var(--ink-size-global-radius-subtle) 0; color: var(--ink-color-global-text-default); }
    .filter-btn:hover, .filter-btn[aria-expanded="true"] { background: var(--local-color-wash); }
    /* While a filter is on, the button keeps the search's border and shows it with a soft wash and a filled icon. */
    .filter-btn.is-active { background: var(--local-color-wash); }
    .filter-btn.is-active svg path { fill: currentColor; }
    .filter-btn:focus-visible { outline: 2px solid var(--ink-color-global-border-focus-default); outline-offset: 2px; }
    /* A yellow dot on the icon while some LP has wire issues and the filter is not showing them. */
    .wire-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-color-global-brand-yellow-80); }
    .filter-dot { position: absolute; top: 9px; right: 11px; box-shadow: 0 0 0 1.5px var(--ink-color-global-surface-background-default); }
    /* The menu scrolls past many funds; Clear all stays pinned to its bottom edge. */
    .filter-menu { right: 0; left: auto; min-width: 260px; padding: 6px 0 0; }
    .filter-menu .menu-foot { position: sticky; bottom: 0; margin-top: 6px; padding: 6px 0; border-top: 1px solid var(--ink-color-global-border-subtle); background: var(--ink-color-global-surface-background-default); }
    .filter-menu .menu-head { padding: 10px 16px 4px; font: 600 var(--ink-font-global-size-small-1)/16px var(--ink-font-global-family-base); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-color-global-text-subtle); }
    .filter-menu .menu-option { padding: 6px 16px; }
    .filter-menu .menu-option .n { flex: none; color: var(--ink-color-global-text-subtle); font-variant-numeric: tabular-nums; }
    .filter-menu .menu-option:disabled { cursor: default; color: var(--ink-color-global-text-subtle); }
    .filter-menu .menu-option:disabled:hover { background: none; }
    .filter-menu .wire-dot { margin-left: 8px; vertical-align: middle; }
    .filter-menu hr { margin: 6px 0; border: 0; border-top: 1px solid var(--ink-color-global-border-subtle); }
    .filter-menu .clear-all { font-weight: 500; }
    /* Active filters as Ink Tags (flex blue), each removable. */

    .bar { flex: 1; position: relative; height: 6px; }
    .bar-track { height: 100%; border-radius: 3px; background: var(--local-color-wash); overflow: hidden; }
    .bar-fill { height: 100%; background: var(--ink-color-global-text-default); }
    .bar-tip { position: absolute; bottom: 6px; display: flex; align-items: flex-start; gap: 4px; transform: translate(-100%, 3px); opacity: 0; transition: opacity .16s ease-out, transform .2s cubic-bezier(.22,1,.36,1); pointer-events: none; color: var(--ink-color-global-text-default); }
    .bar-tip span:first-child { font: 500 var(--ink-font-global-size-small-1)/1 var(--ink-font-global-family-base); white-space: nowrap; }
    .bar-tip span:last-child { width: 1px; height: 16px; background: var(--ink-color-global-text-default); }
    .called:hover .bar-tip { opacity: 1; transform: translate(-100%, 0); }
    .called .amount { white-space: nowrap; min-width: 56px; text-align: right; }
    .wire-cell { display: flex; align-items: center; height: 21px; }
    /* "View details" slides in at the row's end on hover or keyboard focus. */
    .t-more { padding: 9px 0 9px calc(var(--local-page-x) + var(--local-fund-indent)); border-bottom: 1px solid var(--local-color-wash); min-width: var(--local-table-min); }
    .t-more button { all: unset; cursor: pointer; font: 500 var(--ink-font-global-size-body-1)/1.4 var(--ink-font-global-family-base); }
    .t-more button:hover { text-decoration: underline; }
    .t-more button:focus-visible { outline: 2px solid var(--ink-color-global-border-focus-default); }
    .t-foot { position: sticky; bottom: 0; z-index: 3; align-items: center; padding-top: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--ink-color-global-border-subtle); background: var(--ink-color-global-feedback-info-subtle); font: 400 var(--ink-font-global-size-body-1) var(--ink-font-global-family-base); }
    .t-foot b { font-weight: 600; }
    .t-foot > span:first-child { padding-left: calc(var(--local-page-x) + var(--local-fund-indent)); }

    /* Update banner. */
    .update-banner { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; background: var(--ink-color-global-feedback-info-subtle); font-size: var(--ink-font-global-size-small-1); line-height: 1.5; }
    .update-banner p { margin: 0; }
    .update-banner .title { font-weight: 600; }
    .update-banner .msg { color: var(--ink-color-global-text-subtle); }
    .update-banner .icon-btn { width: 24px; height: 24px; margin-left: auto; }

    /* Phone and narrow windows: one pane at a time, the page scrolls as a whole. Last in the
       sheet so it overrides the layout above. */
    @media (max-width: 760px) {
      .app { height: auto; min-height: 100vh; }
      :root { --local-page-x: 20px; }
      .top { padding: 24px var(--local-page-x) 0; }
      .title-row { margin-top: 8px; }
      .overview-row { padding-bottom: 16px; }
      .overview-row { display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
      .overview { display: flex; flex-direction: column; gap: 16px; }
      .ov-item { display: flex; flex-direction: column; gap: 4px; }
      .top-tools { justify-self: auto; }
      h1 { font-size: var(--ink-font-global-size-display-1); }
      .top-tools { width: 100%; }
      .export-wrap .menu { right: auto; left: 0; }

      /* One column: the toggle swaps the views in place, and the list and an LP's detail take turns. */
      .split { --list-w: 100%; position: static; }
      .lp-pane, .detail-pane, .pane-view { position: static; width: auto; }
      .lp-pane { border-right: 0; overflow: visible; }
      .pane-tools { flex-wrap: wrap; }
      .pane-tools-main { width: 100%; }
      .split.is-table .view-list, .split:not(.is-table) .view-table { display: none; }
      .split.is-detail:not(.is-table) .lp-pane, .split:not(.is-detail) .detail-pane, .split.is-table .detail-pane { display: none; }
      .detail { padding: 24px 20px 48px; }
      .pane-resize { display: none; }
      .m-back { display: inline-flex; }
      .d-name { font-size: var(--ink-font-global-size-heading-2-desktop); }
      /* Fund positions keep fund, committed, IRR and wire; Exposure drops its bars. */
      :root { --local-t-first: minmax(200px, 2.2fr); }
    }
    /* A detail too narrow for every column: Fund positions keep fund, committed, IRR and wire,
       and Exposure drops its bars. */
    @container detail (max-width: 760px) {
      .pos-table { grid-template-columns: minmax(0, 1fr) auto auto auto; column-gap: 12px; }
      .pos-unfunded, .pos-tvpi { display: none; }
      .x-grid { grid-template-columns: var(--x-chev) minmax(0, 1fr) 60px 64px 48px; }
      .x-bar-cell { display: none; }
    }
    /* At the narrowest the fund's vintage goes under its name, leaving the name the whole column. */
    @container detail (max-width: 440px) {
      .pos-name { flex-direction: column; align-items: flex-start; gap: 0; }
      .pos-name > span:first-child { max-width: 100%; }

    /* Narrower still: Capital above Performance. */
    @container detail (max-width: 600px) {

      .figs-col:first-child { padding-right: 0; border-right: 0; }
      .figs-col:last-child { padding-left: 0; margin-top: 32px; }
      .figs-col:last-child .called-bar { display: none; }
    }

  <script>/* __MCP_UI_TRACKER_JS__ */</script>
  <script>
    // <lps-core>
    // Pure arithmetic and display rules. No DOM and no CONFIG here, so the tests load this
    // block alone. Dates are 'YYYY-MM-DD' strings; they compare lexicographically.

    // Instructions confirmed longer ago than this read as stale.
    const STALE_WIRE_MONTHS = 12;
    // Severity order: an LP shows its funds' worst state.
    const WIRE_RANK = ['Confirmed', 'Unverified', 'Stale', 'Missing', 'Restricted'];
    const RESTRICTED_TEXT = "You don't have access to wire details.";
    const FUND_INVESTMENTS_SECTOR = 'Fund investments';
    const UNCLASSIFIED = 'Unclassified';
    // The detail pane's capped lists (Fund positions, every Exposure view) show this many rows first.
    const DETAIL_TOP = 4;
    // The table shows this many fund rows under an opened LP before "+N more".
    const FUNDS_SHOWN = 5;
    // Exposure lists: largest value first, ties alphabetical.
    const byValueDesc = (a, b) => b.value - a.value || a.name.localeCompare(b.name);
    const PASS_THROUGH_DEPTH = 4;
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;

    function addMonths(iso, n) {
      const [y, m, d] = iso.split('-').map(Number);
      const t = y * 12 + (m - 1) + n;
      return Math.floor(t / 12) + '-' + String((t % 12) + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    }

    function dateLabel(iso) {
      if (!iso || !ISO_DATE.test(iso)) return '';
      const [y, m, d] = iso.split('-').map(Number);
      return MONTHS[m - 1] + ' ' + d + ', ' + y;
    }

    // A row whose wire fields come back as anything but dates and booleans is masked for
    // this viewer, and reads as Restricted rather than as missing instructions.
    function isMaskedWire(w) {
      const dateOk = v => v == null || (typeof v === 'string' && ISO_DATE.test(v));
      const boolOk = v => v == null || typeof v === 'boolean';
      return !(dateOk(w.confirmed_date) && dateOk(w.added_date) && boolOk(w.has_confirmed) && boolOk(w.has_setup));
    }

    // { state, date } for one partner record in one fund.
    function wireState(w, today) {
      if (!w || w.restricted || isMaskedWire(w)) return { state: 'Restricted', date: null };
      const added = w.added_date || null;
      const confirmed = w.confirmed_date || null;
      if (!added && !confirmed && !w.has_setup) return { state: 'Missing', date: null };
      if (!w.has_confirmed || !confirmed) return { state: 'Unverified', date: added };
      if (added && added > confirmed) return { state: 'Unverified', date: added };
      if (confirmed < addMonths(today, -STALE_WIRE_MONTHS)) return { state: 'Stale', date: confirmed };
      return { state: 'Confirmed', date: confirmed };
    }

    // What is wrong with a wire, without its date.
    function wireProblem(state) {
      switch (state) {
        case 'Missing': return 'Missing wire instructions';
        case 'Unverified': return 'Unverified wire instructions';
        case 'Stale': return 'Stale wire instructions';
        case 'Restricted': return RESTRICTED_TEXT;
        default: return 'Wire instructions confirmed';
      }
    }

    // The words in a wire pill's tooltip: the date says what happened on it.
    function wireTooltip(ws) {
      const d = dateLabel(ws.date);
      const p = wireProblem(ws.state);
      switch (ws.state) {
        case 'Missing':
        case 'Restricted': return p;
        case 'Unverified': return p + (d ? ' · added on ' + d : '');
        case 'Stale': return p + ' · last confirmed on ' + d;
        default: return p + ' on ' + d;
      }
    }

    // One comparison for every sortable list: text alphabetically, numbers by size.
    function compareValues(x, y, dir) {
      const sign = dir === 'asc' ? 1 : -1;
      if (typeof x === 'string' || typeof y === 'string') return sign * String(x).localeCompare(String(y));
      return sign * (x - y);
    }

    // The latest month any of these records is valued at.
    function latestNavDate(records) {
      return records.reduce((m, r) => (r.nav_date && (!m || r.nav_date > m) ? r.nav_date : m), null);
    }

    // The as-of date for a set of fund records, and the funds valued at an earlier month
    // (funds close their books on their own schedules), newest first.
    function asOfSummary(records) {
      const date = latestNavDate(records);
      const earlier = records.filter(r => r.nav_date && r.nav_date < date)
        .sort((a, b) => (a.nav_date < b.nav_date ? 1 : -1) || String(a.fund_short).localeCompare(String(b.fund_short)))
        .map(r => ({ fund: r.fund_short, date: r.nav_date }));
      return { date, earlier };
    }

    // An LP across its funds: the worst state, with a short count for the tooltip.
    function familyWire(states) {
      const worst = states.reduce((a, s) => (WIRE_RANK.indexOf(s.state) > WIRE_RANK.indexOf(a) ? s.state : a), 'Confirmed');
      if (worst === 'Restricted') return { worst, text: 'Restricted', tooltip: RESTRICTED_TEXT };
      const bad = states.filter(s => s.state !== 'Confirmed');
      if (!bad.length) {
        return { worst, text: '', tooltip: states.length === 1 ? wireTooltip(states[0]) : 'All wire instructions confirmed' };
      }
      const lower = s => s.toLowerCase();
      const same = bad.every(s => s.state === bad[0].state);
      let text;
      if (states.length === 1) text = lower(bad[0].state);
      else if (same) text = bad.length + ' of ' + states.length + ' ' + lower(bad[0].state);
      else text = bad.length + ' of ' + states.length + ' need review';
      return { worst, text, tooltip: states.length === 1 ? wireTooltip(bad[0]) : text.charAt(0).toUpperCase() + text.slice(1) };
    }

    // An LP needs attention when any fund's wire is missing, unverified or stale. Restricted means
    // the viewer cannot read wire data, so it never counts.
    function needsAttention(fam) {
      const worst = familyWire(fam.records.map(r => r.wire)).worst;
      return worst !== 'Confirmed' && worst !== 'Restricted';
    }

    // The LP pane's filters: wire issues (needsAttention) and funds (an LP passes with a position in
    // any picked fund; none picked means all funds). Each menu row counts the LPs in it under the
    // other filters (and the search, which the caller applies first).
    // An LP's positions in the picked funds; every position when no fund is picked.
    function fundRecords(fam, funds) {
      return funds.length ? fam.records.filter(r => funds.includes(r.fund_uuid)) : fam.records;
    }

    function passesFilters(fam, wires, funds) {
      return (!wires || needsAttention(fam)) && fundRecords(fam, funds).length > 0;
    }

    function filterCounts(families, wires, funds, fundKeys) {
      const count = (w, f) => families.filter(fam => passesFilters(fam, w, f)).length;
      return {
        wires: count(true, funds),
        allFunds: count(wires, []),
        funds: Object.fromEntries(fundKeys.map(k => [k, count(wires, [k])])),
      };
    }

    // The detail's wire status beside the LP's profile: its worst state, with how many of its
    // funds that covers ("1 of 2 wires stale").
    function lpWireLabel(states) {
      const w = familyWire(states);
      if (w.worst === 'Restricted') return 'Wire details restricted';
      const bad = states.filter(s => s.state !== 'Confirmed');
      if (!bad.length) return states.length === 1 ? 'Wire confirmed' : 'Wires confirmed';
      if (states.length === 1) return w.worst + ' wires';
      const same = bad.every(s => s.state === bad[0].state);
      return bad.length + ' of ' + states.length + ' wires ' + (same ? bad[0].state.toLowerCase() : 'need review');
    }

    // Who that status is about, for its tooltip: each fund whose wire needs attention, with the
    // partner's own name when it differs from the LP's, and what is wrong in the pill's words.
    function lpWireDetails(records, lpName) {
      if (familyWire(records.map(r => r.wire)).worst === 'Restricted') return [];
      return records.filter(r => r.wire.state !== 'Confirmed').map(r => ({
        who: r.fund_short + (r.partner_name && r.partner_name !== lpName ? ' · ' + r.partner_name : ''),
        what: wireTooltip(r.wire),
      }));
    }

    // A tooltip that opens rightward from its label opens leftward instead where it would run
    // past the pane's right edge (less a small margin), which would clip it.
    function tooltipOpensLeft(labelLeft, tipWidth, paneRight) {
      return labelLeft + tipWidth > paneRight - 8;
    }

    function sumBy(list, f) { return list.reduce((a, x) => a + (Number(f(x)) || 0), 0); }

    // Unfunded is committed less called.
    function unfundedOf(r) { return (Number(r.committed) || 0) - (Number(r.called) || 0); }

    // Amounts in different currencies are never added: one total per currency, in the
    // order the currencies first appear.
    function totalsByCurrency(records, f) {
      const out = new Map();
      for (const r of records) {
        const code = r.currency || '';
        out.set(code, (out.get(code) || 0) + (Number(f(r)) || 0));
      }
      return out;
    }

    function ratio(num, den) { return den > 0 ? num / den : null; }

    // Net multiples for a set of fund records in one currency; null when nothing is called.
    function multiples(records) {
      const paid = sumBy(records, r => r.paid_in);
      const dist = sumBy(records, r => r.nav_distributed);
      const nav = sumBy(records, r => r.nav);
      return { tvpi: ratio(dist + nav, paid), dpi: ratio(dist, paid) };
    }

    // XIRR over dated flows (negative = paid in, positive = received). Null when the flows
    // never change sign or the solver does not settle.
    function xirr(flows) {
      const fs = flows.filter(f => f.amount && ISO_DATE.test(f.date)).sort((a, b) => (a.date < b.date ? -1 : 1));
      if (fs.length < 2 || !fs.some(f => f.amount < 0) || !fs.some(f => f.amount > 0)) return null;
      const t0 = Date.parse(fs[0].date + 'T00:00:00Z');
      const years = fs.map(f => (Date.parse(f.date + 'T00:00:00Z') - t0) / (365 * 86400000));
      const npv = r => fs.reduce((a, f, i) => a + f.amount / Math.pow(1 + r, years[i]), 0);
      let lo = -0.9999, hi = 10;
      let flo = npv(lo), fhi = npv(hi);
      if (!Number.isFinite(flo) || !Number.isFinite(fhi) || flo * fhi > 0) return null;
      for (let i = 0; i < 200; i++) {
        const mid = (lo + hi) / 2;
        const fm = npv(mid);
        if (Math.abs(fm) < 1e-7 || hi - lo < 1e-10) return mid;
        if (flo * fm < 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
      }
      return (lo + hi) / 2;
    }

    // Cash flows for the LP: monthly paid-in and distributions, then today's NAV as if
    // received at the as-of date.
    function lpFlows(records) {
      const flows = [];
      for (const r of records) {
        for (const f of r.flows || []) {
          if (f.contributions) flows.push({ date: f.date, amount: -f.contributions });
          if (f.distributions) flows.push({ date: f.date, amount: f.distributions });
        }
        if (r.nav && r.nav_date) flows.push({ date: r.nav_date, amount: r.nav });
      }
      return flows;
    }

    // Net IRR of one fund position: XIRR over that fund's own flows.
    function fundIrr(record) { return xirr(lpFlows([record])); }

    // Fund names drop the firm's own name when they start with it ("Acme Fund I, LP" under
    // Acme reads "Fund I, LP"), as the fund rows do in the app.
    function shortFundName(fundName, firmName) {
      const name = String(fundName || '');
      const firm = String(firmName || '').trim();
      if (firm && name.toLowerCase().startsWith(firm.toLowerCase() + ' ') && name.length > firm.length + 1) {
        return name.slice(firm.length + 1);
      }
      return name;
    }

    // An LP's contacts across its fund records (largest commitment first): the first primary
    // contact, then everyone else once each, matched by email (or name when there is none).
    // PARTNER_CONTACTS carries no role or title, so a contact is a name and an email.
    function familyContacts(records) {
      const seen = new Set();
      let primary = null;
      const others = [];
      for (const wantPrimary of [true, false]) {
        for (const r of records) {
          for (const c of r.contacts || []) {
            if (!!c.is_primary !== wantPrimary) continue;
            const key = String(c.email || c.name || '').trim().toLowerCase();
            if (!key || seen.has(key)) continue;
            seen.add(key);
            const person = { name: c.name || null, email: c.email || null };
            // The email notices go to differs from the one on the contact's Carta account.
            if (c.mismatch) person.mismatch = true;
            if (wantPrimary && !primary) primary = person; else others.push(person);
          }
        }
      }
      return { primary, others };
    }

    // records: one per partner per fund. A family is FIRM_PARTNER_GROUP_ID; a record with
    // no group stands alone.
    function buildFamilies(records) {
      const byKey = new Map();
      for (const r of records) {
        const key = r.family_id != null && r.family_id !== '' ? 'g:' + r.family_id : 'p:' + r.fund_uuid + ':' + r.partner_id;
        if (!byKey.has(key)) byKey.set(key, { key, records: [] });
        byKey.get(key).records.push(r);
      }
      const families = [];
      for (const fam of byKey.values()) {
        fam.records.sort((a, b) => (Number(b.committed) || 0) - (Number(a.committed) || 0) || String(a.fund_name).localeCompare(String(b.fund_name)));
        const lead = fam.records[0];
        fam.name = lead.family_name || lead.partner_name;
        const people = familyContacts(fam.records);
        fam.contact = people.primary;
        fam.otherContacts = people.others;
        families.push(fam);
      }
      return families;
    }

    // ── LP profile ──
    // One spelling per country, so a firm that tagged "USA", "United States" and "United States of
    // America" gets one geography row. Keys are lower case with dots dropped and spaces collapsed;
    // only spellings of the same country are here (Cayman Islands stays apart from the UK, England
    // from the UK). A value not listed keeps its own spelling.
    const COUNTRY_ALIASES = new Map([
      ['United States', ['us', 'usa', 'united states', 'united states of america', 'united sates', 'unites states']],
      ['United Kingdom', ['uk', 'united kingdom']],
      ['Cayman Islands', ['cayman', 'cayman island', 'cayman islands']],
      ['British Virgin Islands', ['bvi', 'british virgin islands', 'virgin islands (british)']],
      ['United Arab Emirates', ['uae', 'united arab emirates']],
      ['South Korea', ['korea', 'south korea', 'korea, south']],
      ['Netherlands', ['netherlands', 'the netherlands']],
    ].flatMap(([name, keys]) => keys.map(k => [k, name])));
    const countryKey = value => String(value).replace(/\./g, '').replace(/\s+/g, ' ').trim().toLowerCase();
    const canonicalCountry = value => COUNTRY_ALIASES.get(countryKey(value)) || String(value).replace(/\s+/g, ' ').trim();
    // One US rule for the page: an LP's location and exposure by geography both read it.
    const isUS = country => canonicalCountry(country) === 'United States';
    // Commitment dates before this are placeholders in the source, not real first commitments.
    const EARLIEST_REAL_COMMITMENT = '1900-01-01';

    // One field across a family's fund records: the value when they agree (case and spacing
    // aside), "Mixed (n)" when they don't, "—" when none has one.
    function distinctValues(values) {
      const distinct = new Map();
      for (const v of values) {
        const s = v == null ? '' : String(v).trim();
        if (s && !distinct.has(s.toLowerCase())) distinct.set(s.toLowerCase(), s);
      }
      return Array.from(distinct.values());
    }

    // What a profile detail reads when no fund record gives it.
    const NOT_ON_FILE = '—';

    function profileValue(values) {
      const distinct = distinctValues(values);
      if (!distinct.length) return NOT_ON_FILE;
      if (distinct.length === 1) return distinct[0];
      return 'Mixed (' + distinct.length + ')';
    }

    // The names the Carta app shows for Fund Admin's partner entity types, keyed by code in
    // lower case (fund_admin.lp_crm.constants.EntityTypes.choices).
    const INVESTOR_TYPE_LABELS = {
      individual: 'Individual',
      joint_spouses: 'Joint (spouses)',
      joint_other: 'Joint (other)',
      personal_trust_taxable_to_grantor: 'Personal trust (taxable to grantor)',
      personal_trust_other: 'Personal trust (non-grantor trust)',
      personal_trust_non_grantor_trust: 'Complex trust (non-grantor trust)',
      individual_retirement_account: 'Individual retirement account',
      charitable_trust: 'Charitable trust',
      private_tax_exempt_foundation: 'Private tax-exempt foundation',
      tax_exempt_endowment: 'Tax-exempt endowment',
      other_tax_exempt_organization: 'Other tax-exempt organization',
      employee_benefit_plan_self_directed: 'Employee benefit plan (self-directed)',
      employee_benefit_plan_trustee_directed: 'Employee benefit plan (trustee directed)',
      fund_of_funds: 'Fund of funds',
      family_partnership_partnership_or_llc: 'Family partnership, partnership or LLC',
      llc_taxed_as_partnership: 'LLC taxed as a Partnership',
      llc_taxed_as_c_corporation: 'LLC taxed as a C-corporation',
      llc_taxed_as_s_corporation: 'LLC taxed as an S-corporation',
      llc_single_member: 'Single-Member LLC',
      partnership: 'Partnership',
      estate: 'Estate',
      corporation_c: 'Corporation - "C"',
      corporation_s: 'Corporation - "S"',
      business_entity_other: 'Business entity (other)',
      au_family_trust: 'Family Trust (Discretionary Trust)',
      au_unit_trust: 'Unit Trust',
      au_bare_trust: 'Bare Trust',
      au_testamentary_trust: 'Testamentary Trust',
      au_superannuation_fund: 'Superannuation Fund (inc. SMSF)',
      au_wholesale_scheme: 'Wholesale Scheme',
      au_govt_super_fund: 'Government Superannuation Fund',
      au_registered_scheme: 'Registered Scheme',
      au_proprietary_company: 'Proprietary company',
      au_public_company: 'Public company',
      au_partnership: 'Partners in a partnership',
      au_government_body: 'Government body',
    };

    // An entity type as the Carta app names it. Anything missing from the list reads as words
    // in sentence case ("some_new_type" → "Some new type"); a blank one is not on file ('').
    function investorTypeLabel(value) {
      const s = value == null ? '' : String(value).trim();
      if (Object.hasOwn(INVESTOR_TYPE_LABELS, s.toLowerCase())) return INVESTOR_TYPE_LABELS[s.toLowerCase()];
      const words = s.replace(/_+/g, ' ').trim();
      return words.charAt(0).toUpperCase() + words.slice(1);
    }

    // A US partner reads its state; anyone else its country.
    function partnerLocation(r) {
      const country = r.country == null ? '' : String(r.country).trim();
      if (isUS(country)) return r.state == null || !String(r.state).trim() ? null : String(r.state).trim();
      return country || null;
    }

    function monthYearLabel(iso) {
      if (!iso || !ISO_DATE.test(iso)) return NOT_ON_FILE;
      const [y, m] = iso.split('-').map(Number);
      return MONTHS[m - 1] + ' ' + y;
    }

    // The family's profile, from every fund it is in.
    // Carta records no headquarters, so an LP's HQ is the location most of its fund records
    // give, and on a tie the one on its largest commitment (records arrive largest first).
    function headquarters(locations) {
      const counts = new Map();
      for (const l of locations) {
        const name = l == null ? '' : String(l).trim();
        if (!name) continue;
        const seen = counts.get(name.toLowerCase()) || { name, n: 0 };
        counts.set(name.toLowerCase(), { name: seen.name, n: seen.n + 1 });
      }
      let best = null;
      for (const c of counts.values()) if (!best || c.n > best.n) best = c;
      return best ? best.name : NOT_ON_FILE;
    }

    function familyProfile(records) {
      const firsts = records.map(r => r.first_commitment_date).filter(d => d && ISO_DATE.test(d) && d >= EARLIEST_REAL_COMMITMENT).sort();
      const places = records.map(partnerLocation);
      const location = headquarters(places);
      return {
        investorType: profileValue(records.map(r => investorTypeLabel(r.entity_type))),
        location,
        // The LP's other locations, shown on hover beside its HQ.
        otherLocations: distinctValues(places).filter(l => l.toLowerCase() !== location.toLowerCase()),
        lpSince: monthYearLabel(firsts[0]),
      };
    }

    // The details the LP detail names as missing instead of showing a dash for each, in reading
    // order. "contact" only when the LP has none at all, primary or not.
    function missingDetails(pf, fam) {
      return [[pf.lpSince, 'start date'], [pf.investorType, 'investor type'], [pf.location, 'location']]
        .filter(([value]) => value === NOT_ON_FILE).map(([, name]) => name)
        .concat(fam.contact || (fam.otherContacts || []).length ? [] : ['contact']);
    }

    // "No start date, investor type or location on file"; '' when nothing is missing.
    function notOnFileText(names) {
      if (!names.length) return '';
      const list = names.length === 1 ? names[0] : names.slice(0, -1).join(', ') + ' or ' + names[names.length - 1];
      return 'No ' + list + ' on file';
    }

    // Value of each company a fund holds, with fund-of-fund holdings passed through to the
    // master when the master is one of this firm's funds (a feeder); any other keeps its own
    // name, and groups under "Fund investments" by sector. Each company carries `via`, the fund that holds it directly.
    //   holdings: fund_uuid -> [{issuer_id, name, value, is_fund, fmv_date}]
    //   masterOf: (fund_uuid, holding) -> master fund_uuid or null
    //   fundNav:  fund_uuid -> total partners' NAV
    //   currencyOf: fund_uuid -> currency code
    function scaleSecurities(securities, share) {
      return (securities || []).map(s => ({ name: s.name, value: s.value * share, cost: s.cost == null ? null : s.cost * share }));
    }

    function expandHoldings(fundUuid, ctx, depth, seen) {
      const out = [];
      depth = depth || 0;
      seen = seen || new Set([fundUuid]);
      for (const h of ctx.holdings.get(fundUuid) || []) {
        const master = h.is_fund ? ctx.masterOf(fundUuid, h) : null;
        const masterNav = master ? ctx.fundNav.get(master) : null;
        const passes = master && !seen.has(master) && depth < PASS_THROUGH_DEPTH && masterNav > 0
          && (ctx.currencyOf.get(master) || '') === (ctx.currencyOf.get(fundUuid) || '');
        if (passes) {
          const share = (Number(h.value) || 0) / masterNav;
          const nextSeen = new Set(seen); nextSeen.add(master);
          for (const c of expandHoldings(master, ctx, depth + 1, nextSeen)) out.push({ ...c, value: c.value * share, securities: scaleSecurities(c.securities, share) });
          continue;
        }
        out.push({
          key: h.is_fund ? 'fund:' + (h.issuer_id || h.name) : 'co:' + (h.issuer_id || h.name),
          name: h.name, value: Number(h.value) || 0, is_fund: !!h.is_fund, issuer_id: h.issuer_id,
          fmv_date: h.fmv_date || null, via: fundUuid, securities: h.securities || [],
        });
      }
      return out;
    }

    // Security rows ({fund_uuid, issuer_id, issuer_name, asset_name, value, cost, unconverted,
    // is_fund, fmv_date}) grouped into one holding per fund and company, each carrying its
    // securities. A security with no value in its fund's currency is left out (the page notes
    // how many) rather than read as $0; one with no cost keeps its value and its cost stays unknown.
    function groupHoldings(rows) {
      const byFund = new Map();
      for (const row of rows) {
        if (row.value == null && Number(row.unconverted) > 0) continue;
        if (!byFund.has(row.fund_uuid)) byFund.set(row.fund_uuid, new Map());
        const issuers = byFund.get(row.fund_uuid);
        const key = row.issuer_id || row.issuer_name;
        let h = issuers.get(key);
        if (!h) {
          h = { issuer_id: row.issuer_id, name: row.issuer_name || 'Unnamed holding', value: 0, is_fund: false, fmv_date: null, securities: [] };
          issuers.set(key, h);
        }
        const value = Number(row.value) || 0;
        h.value += value;
        h.is_fund = h.is_fund || row.is_fund === true;
        if (row.fmv_date && (!h.fmv_date || row.fmv_date < h.fmv_date)) h.fmv_date = row.fmv_date;
        h.securities.push({ name: row.asset_name || 'Unnamed security', value, cost: row.cost == null ? null : Number(row.cost) });
      }
      return new Map(Array.from(byFund, ([fund, issuers]) => [fund, Array.from(issuers.values())]));
    }

    function sectorOf(company, sectors) {
      if (company.is_fund) return FUND_INVESTMENTS_SECTOR;
      const s = sectors.get(company.issuer_id) || {};
      return s.industry || s.tag || UNCLASSIFIED;
    }

    // Look-through for one set of LP fund records sharing a currency: the LP's share of
    // each fund's NAV times the fund's value in each company, summed across funds.
    function lookThrough(records, ctx) {
      const companies = new Map();
      const totalNav = sumBy(records, r => r.nav);
      for (const r of records) {
        const fundNav = ctx.fundNav.get(r.fund_uuid);
        if (!(fundNav > 0) || !(Number(r.nav) > 0)) continue;
        const share = Number(r.nav) / fundNav;
        for (const c of expandHoldings(r.fund_uuid, ctx)) {
          let row = companies.get(c.key);
          if (!row) {
            row = { key: c.key, name: c.name, is_fund: c.is_fund, issuer_id: c.issuer_id, sector: sectorOf(c, ctx.sectors), value: 0, held: false, fmv_date: c.fmv_date, breakdown: new Map(), securities: new Map() };
            companies.set(c.key, row);
          }
          row.held = true;
          if (c.fmv_date && (!row.fmv_date || c.fmv_date < row.fmv_date)) row.fmv_date = c.fmv_date;
          const v = c.value * share;
          row.value += v;
          row.breakdown.set(c.via, (row.breakdown.get(c.via) || 0) + v);
          // The LP's share of each security; a cost unknown in any fund stays unknown.
          for (const s of scaleSecurities(c.securities, share)) {
            const prev = row.securities.get(s.name) || { name: s.name, value: 0, cost: 0 };
            row.securities.set(s.name, { name: s.name, value: prev.value + s.value, cost: prev.cost == null || s.cost == null ? null : prev.cost + s.cost });
          }
        }
      }
      const all = Array.from(companies.values());
      const named = all.filter(c => c.value > 0).sort(byValueDesc);
      const writtenOff = all.filter(c => !(c.value > 0)).sort((a, b) => a.name.localeCompare(b.name));
      return { named, writtenOff, totalNav };
    }

    // The part of a holding whose cost is recorded: those securities' scaled value and the
    // LP's share of their cost. MOIC reads over that part; with no cost recorded it is unknown.
    function costedPart(securities) {
      const known = securities.filter(s => s.cost != null);
      return { value: sumBy(known, s => s.value), cost: known.length ? sumBy(known, s => s.cost) : null };
    }

    // Value over cost; null (reads "—") when the cost is unknown or nothing was paid.
    function moic(value, cost) {
      return cost == null || !(cost > 0) ? null : value / cost;
    }

    function bySector(named) {
      const groups = new Map();
      for (const c of named) {
        let g = groups.get(c.sector);
        if (!g) { g = { key: 's:' + c.sector, name: c.sector, value: 0, companies: [] }; groups.set(c.sector, g); }
        g.value += c.value;
        g.companies.push(c);
      }
      for (const g of groups.values()) g.companies.sort(byValueDesc);
      return Array.from(groups.values()).sort(byValueDesc);
    }

    // The detail pane's Exposure list. Rows are companies or sectors with an estimated value,
    // largest first, each with its MOIC over the part whose cost is recorded; a company opens to the funds it is held through, a
    // sector to its companies. The % column is a share of `lt.totalNav`, the NAV in scope;
    // bars are scaled to `max`, the largest row, so the top row is a full bar.
    //   opts: {mode: 'company'|'sector', showAll, fundLabel}
    // Written off, as Portfolio Analytics counts it: no value left and a cost recorded. These stay
    // in every Exposure view at $0 rather than disappearing.
    const OTHER_EXPOSURE = 'Other (cash, fees and other assets)';
    const OTHER_EXPOSURE_TOOLTIP = 'Net value of cash, receivables, payables, and unvalued holdings.';

    function writtenOffCompanies(lt) {
      return lt.writtenOff.filter(c => costedPart(Array.from(c.securities ? c.securities.values() : [])).cost > 0);
    }

    // What the NAV in scope holds outside named companies (cash, fees, other assets), so the
    // rows and this one add up to 100% of it; 0 when the companies account for it all.
    function otherValue(lt) {
      const rest = lt.totalNav - sumBy(lt.named, c => c.value);
      return rest > 0.5 ? rest : 0;
    }

    function exposureView(lt, opts) {
      const companies = lt.named.concat(writtenOffCompanies(lt)).map(c => ({ ...c, costed: costedPart(Array.from(c.securities ? c.securities.values() : [])) }));
      const rows = (opts.mode === 'sector'
        ? bySector(companies).map(g => ({
          key: 'sector:' + g.name, name: g.name, value: g.value,
          costed: costedPart(g.companies.map(c => c.costed)),
          children: g.companies.map(c => ({ name: c.name, value: c.value })),
        }))
        : companies.map(c => ({
          key: 'company:' + c.key, name: c.name, value: c.value, costed: c.costed,
          children: Array.from(c.breakdown || []).map(([via, v]) => ({ name: opts.fundLabel(via), value: v })),
        })))
        .map(({ costed, ...r }) => ({ ...r, moic: moic(costed.value, costed.cost), children: r.children.sort(byValueDesc) }))
        .sort(byValueDesc);
      const { shown, toggle } = topN(rows, DETAIL_TOP, opts.showAll);
      return { rows: shown, count: rows.length, moreLabel: toggle, total: lt.totalNav, max: rows.length ? rows[0].value : 0, other: otherValue(lt) };
    }

    // ── geography ──
    // Exposure by geography follows Portfolio Analytics: the firm's own tags, else each
    // company's HQ country as US / Non-US. One source per view, never a guessed country.
    const UNKNOWN_GEOGRAPHY = 'Unknown';

    // The firm's source, from its tags (issuer -> {geography, region, country}): its Geography or
    // Region tags if it uses either, else its Country tags, else company HQ country.
    function geographySource(tags) {
      const used = new Set();
      for (const t of tags.values()) for (const k of ['geography', 'region', 'country']) if (t[k]) used.add(k);
      const preferred = ['geography', 'region'].filter(k => used.has(k));
      const title = k => k.charAt(0).toUpperCase() + k.slice(1);
      if (preferred.length) return { kind: 'tags', categories: preferred, note: "Grouped by your firm's " + preferred.map(title).join(' and ') + ' tags' };
      if (used.has('country')) return { kind: 'tags', categories: ['country'], note: "Grouped by your firm's Country tags" };
      return { kind: 'hq', categories: [], note: 'Grouped by company HQ country (US / Non-US)' };
    }

    // A company's group: its first tag value in the source's categories, or with no tags its HQ
    // country as US / Non-US; Unknown when the source has nothing for it.
    //   geo: {source, tags: issuer -> {geography, region, country}, hq: issuer -> country}
    function companyGeography(company, geo) {
      if (geo.source.kind === 'tags') {
        const t = geo.tags.get(company.issuer_id) || {};
        const value = geo.source.categories.map(k => t[k]).find(v => v && String(v).trim());
        return value ? canonicalCountry(value) : UNKNOWN_GEOGRAPHY;
      }
      const country = geo.hq.get(company.issuer_id);
      if (!country || !String(country).trim()) return UNKNOWN_GEOGRAPHY;
      return isUS(country) ? 'US' : 'Non-US';
    }

    // Non-US only on a recorded country (HQ, else the firm's Country tag), never inferred.
    function isNonUSCompany(company, geo) {
      const country = geo.hq.get(company.issuer_id) || (geo.tags.get(company.issuer_id) || {}).country;
      return !!(country && String(country).trim()) && !isUS(country);
    }

    // Geography is offered only when the look-through holds at least one non-US company.
    function geographyAvailable(lt, geo) {
      return !!geo && lt.named.concat(lt.writtenOff).some(c => isNonUSCompany(c, geo));
    }

    // Groups by estimated value, largest first, with Unknown last whatever its size. Each opens to
    // its companies; written-off ones (no value left, a cost recorded) stay in their group at $0.
    function geographyView(lt, geo, opts) {
      const groups = new Map();
      const add = (c, value) => {
        const name = companyGeography(c, geo);
        if (!groups.has(name)) groups.set(name, { key: 'geo:' + name, name, value: 0, costed: [], children: [] });
        const g = groups.get(name);
        g.value += value;
        g.costed.push(costedPart(Array.from(c.securities ? c.securities.values() : [])));
        g.children.push({ name: c.name, value });
      };
      for (const c of lt.named) add(c, c.value);
      for (const c of writtenOffCompanies(lt)) add(c, 0);
      const rows = Array.from(groups.values())
        .map(({ costed, ...g }) => {
          const pooled = costedPart(costed);
          return { ...g, moic: moic(pooled.value, pooled.cost), children: g.children.sort(byValueDesc) };
        })
        .sort((a, b) => (a.name === UNKNOWN_GEOGRAPHY) - (b.name === UNKNOWN_GEOGRAPHY) || byValueDesc(a, b));
      const { shown, toggle } = topN(rows, DETAIL_TOP, opts && opts.showAll);
      const max = rows.reduce((m, r) => Math.max(m, r.value), 0);
      return { rows: shown, count: rows.length, moreLabel: toggle, total: lt.totalNav, max, other: otherValue(lt), note: geo.source.note };
    }

    // A bar's length as a fraction of the longest one, 0–1.
    function barFraction(value, max) {
      return max > 0 ? Math.max(0, Math.min(1, value / max)) : 0;
    }

    // The toggle under a capped list: "Show N more" while capped, "Show less" once opened,
    // '' when nothing is past the cap.
    function moreToggleLabel(extra, expanded) {
      return !extra ? '' : expanded ? 'Show less' : 'Show ' + extra + ' more';
    }

    // First `limit` items unless everything is to be shown, with the label of the toggle beneath.
    function topN(items, limit, showAll) {
      const extra = Math.max(0, items.length - limit);
      const shown = extra && !showAll ? items.slice(0, limit) : items;
      return { shown, toggle: moreToggleLabel(extra, shown.length === items.length) };
    }

    // ── display ──
    // Committed, called, unfunded and NAV print exact; the LP list's committed and exposure
    // values print rounded, with the exact amount on hover.
    function currencySymbol(code) {
      if (!code) return '';
      try {
        const part = new Intl.NumberFormat('en-US', { style: 'currency', currency: code }).formatToParts(0).find(p => p.type === 'currency');
        return part ? part.value : code + ' ';
      } catch (_) { return code + ' '; }
    }

    function moneyExact(n, code) {
      if (n == null || !Number.isFinite(Number(n))) return '—';
      const v = Math.round(Number(n));
      const digits = Math.abs(v).toLocaleString('en-US');
      return (v < 0 ? '-' : '') + currencySymbol(code) + digits;
    }

    function moneyRounded(n, code) {
      if (n == null || !Number.isFinite(Number(n))) return '—';
      const v = Number(n), a = Math.abs(v), sign = v < 0 ? '-' : '';
      let body;
      if (a >= 995000) body = (a / 1e6).toFixed(1) + 'M';
      else if (a >= 1e3) body = Math.round(a / 1e3) + 'K';
      else body = String(Math.round(a));
      return sign + currencySymbol(code) + body;
    }

    function multiple(x) { return x == null || !Number.isFinite(x) ? '—' : x.toFixed(2) + 'x'; }
    function irrText(x) { return x == null || !Number.isFinite(x) ? '—' : (x >= 0 ? '+' : '') + (x * 100).toFixed(1) + '%'; }
    function pctOf(part, whole) { return whole > 0 ? (part / whole * 100).toFixed(1) + '%' : '—'; }

    function calledPct(called, committed) {
      if (!(committed > 0)) return 0;
      return Math.max(0, Math.min(100, Math.round(called / committed * 100)));
    }

    // ── export: copy as table ──
    // The chosen LPs as tab-separated rows, one per fund position, for pasting into a
    // spreadsheet. Amounts are plain numbers in the fund's currency (its own column), so the
    // sheet can add and sort them; a missing figure is an empty cell.
    const PROFILE_COLUMNS = ['Limited Partner', 'Fund', 'Currency', 'Committed', 'Called', 'Unfunded', 'Distributed', 'NAV',
      'Net TVPI', 'Net DPI', 'Net IRR', 'Wire status', 'Investor type', 'Location', 'LP since', 'Primary contact', 'Primary email'];

    function profilesTsv(families, asOf) {
      // A text cell starting with =, +, - or @ gets a leading apostrophe unless the whole cell is
      // a plain number (a "-12.0%" IRR stays a number), so a name like "=HYPERLINK(…)" or
      // "-2+3+cmd" stays text.
      const cell = v => {
        if (v == null || v === NOT_ON_FILE) return '';
        const s = String(v).replace(/[\t\r\n]+/g, ' ');
        return typeof v === 'string' && /^[=+\-@]/.test(s) && !/^-?\d+(?:\.\d+)?%?$/.test(s) ? "'" + s : s;
      };
      const amount = n => (n == null || !Number.isFinite(Number(n)) ? null : Math.round(Number(n) * 100) / 100);
      const ratioCell = x => (x == null ? null : x.toFixed(2));
      const lines = [PROFILE_COLUMNS.join('\t')];
      for (const fam of families) {
        const pf = familyProfile(fam.records);
        const c = fam.contact || {};
        for (const r of fam.records) {
          const m = multiples([r]);
          const irr = fundIrr(r);
          lines.push([
            fam.name, r.fund_short, r.currency, amount(r.committed), amount(r.called), amount(unfundedOf(r)),
            amount(r.distributed), amount(r.nav), ratioCell(m.tvpi), ratioCell(m.dpi), irr == null ? null : (irr * 100).toFixed(1) + '%',
            r.wire.state, pf.investorType, pf.location, pf.lpSince, c.name, c.email,
          ].map(cell).join('\t'));
        }
      }
      if (asOf) lines.push('', 'As of ' + dateLabel(asOf) + '. NAV and net figures are estimates from Carta Fund Admin.');
      return lines.join('\n');
    }

    // ── figures ──
    // Records grouped by their fund's currency, in the order the currencies first appear.
    function currencyGroups(records) {
      const groups = new Map();
      for (const r of records) {
        const code = r.currency || '';
        if (!groups.has(code)) groups.set(code, []);
        groups.get(code).push(r);
      }
      return groups;
    }

    // Per-currency figures for a set of fund records. Ratios across currencies are left out.
    function figures(records) {
      const groups = currencyGroups(records);
      const lines = Array.from(groups, ([code, rs]) => {
        const committed = sumBy(rs, r => r.committed), called = sumBy(rs, r => r.called);
        const m = multiples(rs);
        return { code, committed, called, unfunded: sumBy(rs, unfundedOf), nav: sumBy(rs, r => r.nav), tvpi: m.tvpi, dpi: m.dpi };
      });
      return { lines, mixed: lines.length > 1, primary: lines[0] };
    }

    // The LP column's heading, with how many LPs the view shows once they have loaded.
    function lpHeading(n) { return n == null ? 'Limited Partner' : 'Limited Partner (' + n + ')'; }

    // ── overview ──
    // The strip under the title: what LPs still owe, what has gone back to them, and how much of
    // the commitments sit with the largest few LPs.
    const CONCENTRATION_TOP = 3;
