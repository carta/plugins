        c.fillStyle = this.fill; c.fill();
        if (style === 'FD') { c.strokeStyle = this.stroke; c.lineWidth = this.lineWidth || 1; c.stroke(); }
      }
      addImage(src, _type, x, y, w, h) { const img = this.images.get(src); if (this.on() && img) this.ctx.drawImage(img, x, y, w, h); }
      addFileToVFS(name, b64) { this.vfs = Object.assign(this.vfs || {}, { [name]: b64 }); }
      addFont(file, family) {
        if (typeof FontFace !== 'function') throw new Error('no FontFace');
        if (!previewFonts.has(family)) previewFonts.set(family, new FontFace(family, 'url(data:font/ttf;base64,' + this.vfs[file] + ')').load().then(f => document.fonts.add(f)).catch(() => {}));
        this.fonts.push(previewFonts.get(family));
      }
      addPage() { this.pages += 1; this.page = this.pages; }
      setPage(p) { this.page = p; }
      getNumberOfPages() { return this.pages; }
    }

    // ── rendering: LP list ──
    function renderList() {
      const ul = $('lp-list');
      if (!data.loaded) {
        $('lp-head-name').textContent = lpHeading(null);
        const row = '<li aria-hidden="true"><div class="lp-item"><span class="sh"></span></div></li>';
        ul.innerHTML = $('error').hidden ? row.repeat(6) : '';
        return;
      }
      const views = listFamilies();
      $('lp-head-name').textContent = lpHeading(views.length);
      if (!views.length) {
        ul.innerHTML = `<li class="empty">${emptyRows()}</li>`;
        return;
      }
      ul.innerHTML = views.map(({ fam, fig }) => {
        const commits = fig.lines.map(l => `<span class="num" title="${esc(moneyExact(l.committed, l.code))}">${esc(moneyRounded(l.committed, l.code))}</span>`).join('');
        return `<li><button class="lp-item" type="button" data-pick="${esc(fam.key)}" aria-current="${fam.key === ui.sel}">
          <span class="lp-item-main"><span class="lp-item-name">${esc(fam.name)}</span></span>
          <span class="lp-item-figs">${commits}</span>
        </button></li>`;
      }).join('');
    }

    // ── rendering: detail ──
    const DETAIL_SHIMMER = '<div aria-hidden="true" style="display:flex;flex-direction:column;gap:16px"><span class="sh" style="width:55%;height:36px"></span><span class="sh" style="width:40%"></span><span class="sh" style="height:120px;margin-top:24px"></span></div>';

    function selectedFamily() { return data.families.find(f => f.key === ui.sel) || null; }

    // An email as its mailto link and the copy button beside it.
    function emailHtml(email) {
      return `<span class="email-wrap"><a href="mailto:${esc(email)}">${esc(email)}</a><button class="icon-btn copy-btn" type="button" data-copy="${esc(email)}" title="Copy email" aria-label="Copy ${esc(email)}">${ICON.copy}</button></span>`;
    }

    // The warehouse gives only a yes/no: the account email itself is never exposed to the GP.
    const UNVERIFIED_EMAIL = 'Unverified email';
    const UNVERIFIED_EMAIL_TIP = "This email doesn't match their Carta account. Notices may not reach them.";
    const unverifiedCount = fam => [fam.contact, ...(fam.otherContacts || [])].filter(p => p && p.mismatch).length;
    // In the contacts menu the tooltip opens from the label's start, since the menu scrolls and clips.
    function unverifiedHtml(person, inMenu) {
      if (!person || !person.mismatch) return '';
      return `<span class="ink-tooltip-wrap unverified" tabindex="0" data-unverified><span class="ink-tooltip is-multiline ${inMenu ? 'is-start' : 'is-end'}" role="tooltip">${esc(UNVERIFIED_EMAIL_TIP)}</span>${ICON.warning}${esc(UNVERIFIED_EMAIL)}</span>`;
    }

    function contactLineHtml(fam, missing) {
      const c = fam.contact;
      const parts = [];
      if (c && c.name) parts.push(`<span class="d-strong">${esc(c.name)}</span>`);
      if (c && c.email) {
        if (c.name) parts.push(SEP);
        parts.push(emailHtml(c.email));
        parts.push(unverifiedHtml(c, false));
      }
      // An LP with no contact at all has its contact line name everything missing; any other
      // LP gets a note under its contacts.
      const inLine = missing.includes('contact');
      if (inLine) parts.push(`<span class="d-none">${esc(notOnFileText(missing))}</span>`);
      const others = fam.otherContacts || [];
      if (others.length) {
        const shown = parts.length > 0 && !inLine;
        if (shown) parts.push(SEP);
        const flagged = others.filter(o => o.mismatch).length;
        const more = (shown ? `+${others.length} more` : `+${others.length} contact${others.length === 1 ? '' : 's'}`) + (flagged ? ` (${flagged} need${flagged === 1 ? 's' : ''} review)` : '');
        const open = ui.menu === 'contacts';
        const list = others.map(o => `<div class="contact">${o.name ? `<span class="d-strong">${esc(o.name)}</span>` : ''}${o.email ? `<span class="contact-email">${emailHtml(o.email)}</span>${unverifiedHtml(o, true)}` : ''}</div>`).join('');
        parts.push(`<span class="menu-wrap"><button class="contacts-btn" type="button" data-menu="contacts" aria-haspopup="dialog" aria-expanded="${open}">${more}</button>
          ${open ? `<div class="menu contacts-menu" role="dialog" aria-label="Additional contacts" data-menu-for="contacts"><div class="menu-title">Additional contacts</div>${list}</div>` : ''}</span>`);
      }
      const note = !inLine && missing.length ? `<span class="d-missing">${esc(notOnFileText(missing))}</span>` : '';
      // The contact reads on its own line under the profile, named by a small label.
      const label = (c && (c.name || c.email)) || others.length ? '<span class="d-label">Contact</span>' : '';
      return `<span class="d-line is-contact">${label}${parts.join('')}</span>${note}`;
    }

    function fig(value, label, negative, tip) {
      const shown = tip ? `<span class="ink-tooltip-wrap as-of-mixed" tabindex="0"><span class="ink-tooltip" role="tooltip">${esc(tip)}</span>${esc(value)}</span>` : esc(value);
      return `<div class="fig"><strong class="num${negative ? ' is-negative' : ''}">${shown}</strong><span>${esc(label)}</span></div>`;
    }

    // Capital and Performance, a block per currency.
    function figuresHtml(records) {
      // Net IRR solves over every cash flow, so it is computed only here, where it is shown.
      const groups = currencyGroups(records);
      const lines = figures(records).lines;
      return lines.map(l => {
        const irr = xirr(lpFlows(groups.get(l.code) || []));
        const pct = calledPct(l.called, l.committed);
        // Before any source shows capital paid in, each return's dash says why on hover.
        const why = l.called > 0 || l.tvpi != null ? '' : NO_RETURNS_YET;
        const label = lines.length > 1 ? `<p class="note cur-label">Amounts in ${esc(l.code || 'fund currency')}</p>` : '';
        return label + `<section class="figs" aria-label="Capital and performance">
          <div class="figs-col">
            <div class="headline"><strong class="num">${esc(moneyExact(l.committed, l.code))}</strong><span>Committed</span></div>
            <div class="called-bar" role="img" aria-label="${pct}% called"><div><div style="width:${pct}%"></div></div></div>
            <div class="figs-row is-2">${fig(moneyExact(l.called, l.code), 'Called · ' + pct + '%')}${fig(moneyExact(l.unfunded, l.code), 'Unfunded')}</div>
          </div>
          <div class="figs-col">
            <div class="headline"><strong class="num">${esc(moneyExact(l.nav, l.code))}</strong><span>NAV</span></div>
            <div class="called-bar" aria-hidden="true"></div>
            <div class="figs-row is-3">${fig(multiple(l.tvpi), 'TVPI', false, why)}${fig(multiple(l.dpi), 'DPI', false, why)}${fig(irrText(irr), 'IRR', irr != null && irr < 0, why)}</div>
          </div>
        </section>`;
      }).join('');
    }

    function positionsHtml(fam) {
      const { shown, toggle } = topN(fam.records, DETAIL_TOP, ui.posAll);
      const rows = shown.map(r => {
        const f = figures([r]).primary;
        const irr = fundIrr(r);
        return `<div class="pos-grid pos-row num" role="row">
          <span class="pos-name" role="cell" title="${esc(r.fund_short)}"><span>${esc(r.fund_short)}</span>${r.vintage_year == null ? '' : `<span class="pos-vintage">${esc(r.vintage_year)}</span>`}</span>
          <span class="r" role="cell">${esc(moneyExact(f.committed, f.code))}</span>
          <span class="r pos-unfunded" role="cell">${esc(moneyExact(f.unfunded, f.code))}</span>
          <span class="r pos-tvpi" role="cell">${multiple(f.tvpi)}</span>
          <span class="r${irr != null && irr < 0 ? ' is-negative' : ''}" role="cell">${irrText(irr)}</span>
          <span class="pos-wire" role="cell">${pill(r.wire.state, null, wireTooltip(r.wire), 'is-end')}</span>
        </div>`;
      }).join('');
      return `<h2 class="section-title" id="positions-title">Fund positions</h2>
        <div class="pos-table" role="table" aria-label="Fund positions">
          <div class="pos-grid pos-head" role="row"><span role="columnheader">Fund</span><span class="r" role="columnheader">Committed</span><span class="r pos-unfunded" role="columnheader">Unfunded</span><span class="r pos-tvpi" role="columnheader">Net TVPI</span><span class="r" role="columnheader">Net IRR</span><span class="pos-wire" role="columnheader">Wire</span></div>
          ${rows}
        </div>
        ${toggle ? `<button class="more-btn" type="button" data-pos-more aria-expanded="${ui.posAll}">${esc(toggle)}</button>` : ''}`;
    }

    function exposureRowHtml(row, view, code) {
      const key = code + '|' + row.key;
      const open = ui.xOpen.has(key);
      const children = open ? `<div class="x-children">${row.children.map(ch => `<div class="x-child num"><span>${esc(ch.name)}</span><span title="${esc(moneyExact(ch.value, code))}">${esc(moneyRounded(ch.value, code))}</span></div>`).join('')}</div>` : '';
      return `<div class="x-item"><div class="x-grid x-row num" role="button" tabindex="0" data-x-toggle="${esc(key)}" aria-expanded="${open}">
          <span class="x-chev" aria-hidden="true">›</span><span class="x-name" title="${esc(row.name)}">${esc(row.name)}</span>
          <div class="x-bar-cell" aria-hidden="true"><div class="x-bar"><div style="width:${(barFraction(row.value, view.max) * 100).toFixed(1)}%"></div></div></div>
          <span class="r" title="${esc(moneyExact(row.value, code))}">${esc(moneyRounded(row.value, code))}</span>
          <span class="r">${pctOf(row.value, view.total)}</span>
          <span class="r">${multiple(row.moic)}</span>
        </div>${children}</div>`;
    }

    // Everything else in the NAV: a reconciling line, not a holding, so it sits outside the
    // ranking and the bar scale, pinned below the whole list (and its toggle) in muted text.
    function otherRowHtml(view, code) {
      return `<div class="x-grid x-other num">
          <span></span>
          <span class="x-name"><span class="ink-tooltip-wrap as-of-mixed" tabindex="0"><span class="ink-tooltip is-multiline" role="tooltip">${esc(OTHER_EXPOSURE_TOOLTIP)}</span>${esc(OTHER_EXPOSURE)}</span></span>
          <span class="x-bar-cell" aria-hidden="true"></span>
          <span class="r" title="${esc(moneyExact(view.other, code))}">${esc(moneyRounded(view.other, code))}</span>
          <span class="r">${pctOf(view.other, view.total)}</span>
          <span class="r">—</span>
        </div>`;
    }

    // Exposure for the LP, or for the one fund the dropdown picks; a block per currency.
    function exposureHtml(fam) {
      const scoped = ui.xFund ? fam.records.filter(r => r.record_key === ui.xFund) : fam.records;
      const { options, current } = fundOptions(fam.records.map(r => ({ key: r.record_key, label: r.fund_short })), ui.xFund);
      const groups = currencyGroups(scoped);
      const lts = new Map(Array.from(groups, ([code, rs]) => [code, lookThrough(rs, data.ctx)]));
      // Geography is offered only with non-US exposure in this scope; leaving such a scope while
      // on Geography goes back to Company.
      const geoOn = Array.from(lts.values()).some(lt => geographyAvailable(lt, data.ctx.geo));
      if (ui.xMode === 'geography' && !geoOn) Object.assign(ui, { xMode: 'company', xOpen: new Set(), xAll: false });
      const modes = [['company', 'Company'], ['sector', 'Sector']].concat(geoOn ? [['geography', 'Geography']] : []);
      const head = `<div class="x-head">
          <div class="x-title"><h2>Exposure</h2><span>(estimated)</span></div>
          <div class="seg" role="group" aria-label="Group exposure by">
            ${modes.map(([mode, label]) => `<button type="button" data-x-mode="${mode}" aria-pressed="${ui.xMode === mode}">${label}</button>`).join('')}
          </div>
          <div class="menu-wrap">${dropdownHtml('x-fund', current.label, options, current.key, 'fund-menu', 'is-small', 'Fund')}</div>
        </div>`;
      const blocks = Array.from(groups, ([code]) => {
        const lt = lts.get(code);
        const label = groups.size > 1 ? `<p class="note" style="margin-top:16px">Amounts in ${esc(code || 'fund currency')}</p>` : '';
        if (!(lt.totalNav > 0)) return label + `<p class="note" style="margin-top:16px">The NAV here is ${esc(moneyRounded(lt.totalNav, code))}, so there is nothing to look through.</p>`;
        const view = ui.xMode === 'geography'
          ? geographyView(lt, data.ctx.geo, { showAll: ui.xAll })
          : exposureView(lt, { mode: ui.xMode, showAll: ui.xAll, fundLabel });
        if (!view.rows.length) return label + '<div class="empty">No holdings to show.</div>';
        return label + `<div class="x-table">
            <div class="x-grid x-cols" aria-hidden="true"><span></span><span>${{ sector: 'Sector', geography: 'Geography' }[ui.xMode] || 'Company'}</span><span class="x-bar-cell"></span><span class="r">Est. NAV</span><span class="r">% of NAV</span><span class="r">MOIC</span></div>
            ${view.rows.map(row => exposureRowHtml(row, view, code)).join('')}
            ${view.moreLabel ? `<button class="more-btn is-indented" type="button" data-x-all aria-expanded="${ui.xAll}">${esc(view.moreLabel)}</button>` : ''}
            ${view.other ? otherRowHtml(view, code) : ''}
            ${view.note ? `<p class="note x-source">${esc(view.note)}</p>` : ''}
          </div>`;
      });
      return head + blocks.join('');
    }

    // The LP's wire status beside its name: the wire pill ("1 of 2 wires stale"), as a button
    // that takes the reader to the Wire column of Fund positions. Hovering it names who and why.
    function lpWireChip(fam) {
      const states = fam.records.map(r => r.wire);
      const worst = familyWire(states).worst;
      const tip = lpWireDetails(fam.records, fam.name).map(d => `<span class="wire-tip-item"><strong>${esc(d.who)}</strong>${esc(d.what)}</span>`).join('');
      const chip = `<button class="${pillClass(worst)} wire-chip" type="button" data-wire-jump>${esc(lpWireLabel(states))}</button>`;
      return tip ? `<span class="ink-tooltip-wrap"><span class="ink-tooltip is-multiline is-start" role="tooltip" data-fit>${tip}</span>${chip}</span>` : chip;
    }

    // The HQ, with the LP's other locations in a tooltip.
    function locationHtml(pf) {
      if (!pf.otherLocations.length) return `<span>${esc(pf.location)}</span>`;
      return `<span class="ink-tooltip-wrap as-of-mixed" tabindex="0"><span class="ink-tooltip" role="tooltip">${esc('Also in ' + pf.otherLocations.join(', '))}</span>${esc(pf.location)}</span>`;
    }

    // Details not on file drop out of the profile line; the contact line names them once.
    function profileLineHtml(pf, fam) {
      return [
        pf.lpSince !== NOT_ON_FILE && `<span>Limited Partner since ${esc(pf.lpSince)}</span>`,
        pf.investorType !== NOT_ON_FILE && `<span>${esc(pf.investorType)}</span>`,
        pf.location !== NOT_ON_FILE && locationHtml(pf),
      ].filter(Boolean).join(SEP);
    }

    // The wire chip's target: bring Fund positions into view and flash its Wire column.
    // Every fund the chip counts is shown first, since Fund positions lists only the top few.
    function jumpToWires() {
      const fam = selectedFamily();
      if (fam && !ui.posAll && fam.records.length > DETAIL_TOP) {
        ui.posAll = true;
        renderDetail();
        // The re-render replaced the focused chip; focus its replacement without undoing the scroll below.
        $('detail').querySelector('[data-wire-jump]').focus({ preventScroll: true });
      }
      const title = $('positions-title');
      if (!title) return;
      title.scrollIntoView({ behavior: REDUCED_MOTION.matches ? 'auto' : 'smooth', block: 'start' });
      for (const cell of document.querySelectorAll('#detail .pos-wire')) {
        cell.classList.remove('is-flash');
        void cell.offsetWidth;
        cell.classList.add('is-flash');
      }
    }

    function renderDetail() {
      const el = $('detail');
      if (!data.loaded) { el.innerHTML = $('error').hidden ? DETAIL_SHIMMER : ''; return; }
      const fam = selectedFamily();
      if (!fam) { el.innerHTML = data.families.length ? '' : `<div class="empty">${NO_LPS}</div>`; return; }
      const pf = familyProfile(fam.records);
      if (unverifiedCount(fam) && !unverifiedShown.has(fam.key)) { unverifiedShown.add(fam.key); track('render', 'Detail.EmailUnverified.Show'); }
      el.innerHTML = `<button class="m-back" type="button" data-back><span aria-hidden="true">←</span>All Limited Partners</button>
        <div class="d-title"><h2 class="d-name">${esc(fam.name)}</h2>${lpWireChip(fam)}</div>
        <div class="d-meta">
          <span class="d-line">${profileLineHtml(pf, fam)}</span>
          ${contactLineHtml(fam, missingDetails(pf, fam))}
        </div>
        ${figuresHtml(fam.records)}
        ${positionsHtml(fam)}
        ${exposureHtml(fam)}
        <div class="notes">${notesHtml()}</div>`;

    // ── rendering: All Limited Partners ──
    // A first click sorts descending (largest first), a second flips it.
    function sortButton(key, label) {
      const active = ui.sortKey === key;
      const d = active ? (ui.sortDir === 'asc' ? ICON.sortAsc : ICON.sortDesc) : ICON.sortIdle;
      return `<button class="sort-btn" type="button" data-sort="${key}">${esc(label)} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg></button>`;
    }

    function ariaSort(key) { return ui.sortKey === key ? (ui.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'; }


    function renderHead(anyOpen, n) {
      const toggleLabel = anyOpen ? 'Collapse all' : 'Expand all';
      const th = (key, label, cls) => `<div class="${cls || ''}" role="columnheader" aria-sort="${ariaSort(key)}">${sortButton(key, label)}</div>`;
      $('thead').innerHTML = `<div class="t-grid t-head" role="row">
        <div class="t-frozen" role="columnheader" aria-sort="${ariaSort('name')}">
          <span class="t-check" aria-hidden="true" style="visibility:hidden"><span class="ink-checkbox"></span></span>
          <button class="icon-btn toggle-all" type="button" id="toggle-all" title="${toggleLabel}" aria-label="${toggleLabel}"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${anyOpen ? ICON.collapseAll : ICON.expandAll}"/></svg></button>
          ${sortButton('name', lpHeading(n))}</div>
        ${th('commit', 'Committed', 'r')}${th('funded', 'Called')}${th('unfunded', 'Unfunded', 'r')}${th('tvpi', 'Net TVPI', 'r')}
        <div class="th" role="columnheader">Wire status</div>
      </div>`;
    }

    function calledCell(called, committed, code) {
      const pct = calledPct(called, committed);
      return `<div class="called"><div class="bar"><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-tip num" style="left:${pct}%"><span>${pct}%</span><span></span></div></div>
        <span class="amount num">${esc(moneyExact(called, code))}</span></div>`;
    }

    function calledLines(lines) {
      if (lines.length === 1) return calledCell(lines[0].called, lines[0].committed, lines[0].code);
      return '<div class="multi">' + lines.map(l => calledCell(l.called, l.committed, l.code)).join('') + '</div>';
    }

    const VIEW_HINT = '<span class="t-view" aria-hidden="true">View<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';

    function renderTable() {
      const tbody = $('tbody');
      if (!data.loaded) {
        renderHead(false);
        const shimmer = '<div><span class="sh"></span></div>';
        tbody.innerHTML = $('error').hidden ? `<div class="t-grid t-row" aria-hidden="true">${shimmer.repeat(6)}</div>`.repeat(4) : '';
        $('foot').hidden = true;
        return;
      }
      const views = tableFamilies();
      const anyOpen = views.some(v => v.fam.records.length > 1 && ui.open.has(v.fam.key));
      renderHead(anyOpen, views.length);
      if (!views.length) {
        const msg = emptyRows();
        tbody.innerHTML = `<div class="empty" role="row">${msg}</div>`;
        $('foot').hidden = true;
        return;
      }
      const rows = [];
      for (const { fam, fig, wire } of views) {
        const multi = fam.records.length > 1;
        const open = multi && ui.open.has(fam.key);
        const key = esc(fam.key);
        const contact = fam.contact && fam.contact.name ? esc(fam.contact.name) + ' · ' : '';
        const sub = multi ? fam.records.length + ' Funds' : esc(fam.records[0].fund_short);
        rows.push(`<div class="t-grid t-row" role="row" tabindex="0" data-open="${key}">
          <div class="t-frozen" role="cell">
            <label class="t-check"><input type="checkbox" data-table-check="${key}"${ui.tableChecked.has(fam.key) ? ' checked' : ''} aria-label="Select ${esc(fam.name)} for export"><span class="ink-checkbox" aria-hidden="true">${ICON.checkbox}</span></label>
            <button class="icon-btn chevron${multi ? '' : ' is-placeholder'}" type="button" data-toggle="${key}" aria-expanded="${open}" aria-label="${open ? 'Collapse' : 'Expand'} ${esc(fam.name)}"${multi ? '' : ' tabindex="-1" aria-hidden="true"'}>${ICON.chevron}</button>
            <div class="t-name"><span class="name" title="${esc(fam.name)}">${esc(fam.name)}</span><span class="sub" title="${contact}${sub}">${contact}${sub}</span></div>
          </div>
          <div class="r num" role="cell">${moneyLines(fig.lines, 'committed', moneyExact)}</div>
          <div role="cell">${calledLines(fig.lines)}</div>
          <div class="r num strong" role="cell">${moneyLines(fig.lines, 'unfunded', moneyExact)}</div>
          <div class="r num" role="cell">${fig.mixed ? '—' : multiple(fig.primary.tvpi)}</div>
          <div class="wire-cell" role="cell">${pill(wire.worst, null, wire.tooltip, 'is-end')}</div>
          ${VIEW_HINT}
        </div>`);
        if (!open) continue;
        const { shown, toggle } = topN(sortRecords(fam.records, tableSort().key, tableSort().dir), FUNDS_SHOWN, ui.more.has(fam.key));
        for (const r of shown) {
          const f = figures([r]).primary;
          rows.push(`<div class="t-grid t-row is-fund" role="row" tabindex="0" data-open="${key}">
            <div class="t-frozen" role="cell"><span title="${esc(r.fund_short)}">${esc(r.fund_short)}</span></div>
            <div class="r num" role="cell">${esc(moneyExact(f.committed, f.code))}</div>
            <div role="cell">${calledCell(f.called, f.committed, f.code)}</div>
            <div class="r num" role="cell">${esc(moneyExact(f.unfunded, f.code))}</div>
            <div class="r num" role="cell">${multiple(f.tvpi)}</div>
            <div class="wire-cell" role="cell">${pill(r.wire.state, null, wireTooltip(r.wire), 'is-end')}</div>
            ${VIEW_HINT}
          </div>`);
        }
        // The LP's own chevron folds its funds away, so the table offers "+N more" only.
        if (toggle && shown.length < fam.records.length) rows.push(`<div class="t-more" role="row"><button type="button" data-more="${key}">+${fam.records.length - shown.length} more</button></div>`);
      }
      tbody.innerHTML = rows.join('');
      renderFoot(views);
    }

    function joinTotals(map, fmt) {
      return Array.from(map, ([code, v]) => fmt(v, code)).join(' / ');
    }

    function renderFoot(views) {
      const records = views.flatMap(v => v.fam.records);
      const committed = totalsByCurrency(records, r => r.committed);
      const unfunded = totalsByCurrency(records, unfundedOf);
      const n = views.length;
      $('foot').innerHTML = `<span>Showing <b>${n} Limited Partner${n === 1 ? '' : 's'}</b></span>
        <b class="r num">${esc(joinTotals(committed, moneyExact))}</b><span></span>
        <b class="r num">${esc(joinTotals(unfunded, moneyExact))}</b><span></span><span></span>`;
      $('foot').hidden = false;
    }

    function renderAll() {
      renderView();
      renderExport();
      renderOverview();
      renderFilter();
      renderList();
      renderDetail();
      renderTable();
      $('table-notes').innerHTML = notesHtml();
    }

    // ── actions ──
    // The sandbox may refuse the async clipboard; a selected textarea and execCommand is the fallback.
    // An open modal dialog makes the rest of the page inert, so the textarea goes inside it; focus
    // returns to the control that started the copy.
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; } catch (_) {
        const area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.position = 'fixed'; area.style.opacity = '0';
        const prev = document.activeElement;
        (document.querySelector('dialog[open]') || document.body).appendChild(area);
        area.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (__) { ok = false; }
        area.remove();
        if (prev && prev.focus) prev.focus();
        return ok;
      }
    }

    // Re-rendering replaces the element that had focus; put focus back on its replacement.
    function refocus(selector, opts) {
      const el = document.querySelector(selector);
      if (el) el.focus(opts);
    }

    const PHONE = window.matchMedia('(max-width: 760px)');
    const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)');
    const isPhone = () => PHONE.matches;

    // ── LP pane width ──
    // null keeps the stylesheet's width; a dragged width is kept between visits and clamped so
    // the list keeps its toggle and the detail keeps LIST_W.detailMin of room.
    const LIST_W = { min: 300, max: 720, step: 24, detailMin: 360, key: 'cartaLpSummarySplit.listWidth' };

    function savedListWidth() {
      try { const v = Number(localStorage.getItem(LIST_W.key)); return v > 0 ? v : null; } catch (_) { return null; }
    }

    function listWidthBounds(split) {
      return { min: LIST_W.min, max: Math.max(LIST_W.min, Math.min(LIST_W.max, split.clientWidth - LIST_W.detailMin)) };
    }

    function setListWidth(px, persist) {
      const split = $('split'), handle = $('pane-resize');
      const { min, max } = listWidthBounds(split);
      const current = () => Math.round(split.querySelector('.lp-pane').getBoundingClientRect().width);
      ui.listW = px == null ? null : Math.round(Math.max(min, Math.min(max, px)));
      if (ui.listW == null) split.style.removeProperty('--list-w'); else split.style.setProperty('--list-w', ui.listW + 'px');
      handle.setAttribute('aria-valuemin', String(min));
      handle.setAttribute('aria-valuemax', String(max));
      if (ui.view === 'list') handle.setAttribute('aria-valuenow', String(current()));
      if (!persist) return;
      try { if (ui.listW == null) localStorage.removeItem(LIST_W.key); else localStorage.setItem(LIST_W.key, String(ui.listW)); } catch (_) {}
    }

    function wireResize(split, handle) {
      const paneWidth = () => split.querySelector('.lp-pane').getBoundingClientRect().width;
      handle.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        track('click', 'List.Resize');
        e.preventDefault();
        handle.setPointerCapture(e.pointerId);
        split.classList.add('is-resizing');
        const left = split.getBoundingClientRect().left;
        const move = ev => setListWidth(ev.clientX - left, false);
        const end = () => {
          handle.removeEventListener('pointermove', move);
          split.classList.remove('is-resizing');
          setListWidth(ui.listW, true);
        };
        handle.addEventListener('pointermove', move);
        handle.addEventListener('pointerup', end, { once: true });
        handle.addEventListener('pointercancel', end, { once: true });
      });
      handle.addEventListener('dblclick', () => setListWidth(null, true));
      handle.addEventListener('keydown', e => {
        const { min, max } = listWidthBounds(split);
        // From the width last set, not the measured one, which lags while the pane animates.
        const from = ui.listW == null ? paneWidth() : ui.listW;
        const next = { ArrowLeft: from - LIST_W.step, ArrowRight: from + LIST_W.step, Home: min, End: max }[e.key];
        if (next == null) return;
        e.preventDefault();
        setListWidth(next, true);
      });
      setListWidth(savedListWidth(), false);
    }

    // Selecting an LP, by any path, starts its detail fresh: its own Exposure scope, nothing
    // expanded, at the top.
    function selectFamily(key) {
      Object.assign(ui, { sel: key, xFund: null, xOpen: new Set(), xAll: false, posAll: false });
      const pane = $('detail-pane');
      if (pane) pane.scrollTop = 0;
    }

    function pick(familyKey) {
      if (!findFamilyKey(familyKey)) return;
      selectFamily(familyKey);
      // The viewer chose this LP, so clearing the filters later keeps it.
      Object.assign(ui, { showDetail: true, menu: null, selBefore: null });
      renderView();
      renderList();
      renderDetail();
      renderExport();
      if (isPhone()) { window.scrollTo(0, 0); refocus('[data-back]'); }
    }

    function findFamilyKey(key) { return data.families.some(f => f.key === key); }

    // A table row folds back to List (the pane's glide shows the switch), selects that LP and
    // brings it into view in the list.
    function openFromTable(familyKey) {
      setView('list');
      pick(familyKey);
      foldForPick(false);
      const item = $('lp-list').querySelector(`[data-pick="${CSS.escape(familyKey)}"]`);
      if (!item) return;
      item.focus({ preventScroll: true });
      item.scrollIntoView({ block: 'nearest', behavior: REDUCED_MOTION.matches ? 'auto' : 'smooth' });
    }

    function setView(view) {
      if (ui.view === view) return;
      const was = ui.menu;
      ui.view = view;
      ui.menu = null;
      if (was) renderMenu(was);
      renderView();
      renderFilter();
      renderExport();
    }

    function renderMenu(id) {
      if (id === 'filter') renderFilter();
      else renderDetail();
    }

    function toggleMenu(id) {
      const was = ui.menu;
      ui.menu = was === id ? null : id;
      if (was && was !== id) renderMenu(was);
      renderMenu(id);
      // Opening moves focus into the menu; closing returns it to the trigger.
      if (ui.menu) refocus(`[data-menu-for="${id}"] input, [data-menu-for="${id}"] button:not(:disabled), [data-menu-for="${id}"] a`);
      else refocus(`[data-menu="${id}"]`);
    }

    function closeMenu() {
      const was = ui.menu;
      if (!was) return;
      ui.menu = null;
      renderMenu(was);
    }

    function pickOption(menu, key) {
      ui.menu = null;
      if (menu === 'x-fund') {
        Object.assign(ui, { xFund: key || null, xOpen: new Set(), xAll: false });
        renderDetail();
      }
      refocus(`[data-menu="${menu}"]`);
    }

    // ── export ──
    // The firm's brand from the page data (the skill embeds it on request); export only.
    const BRAND = normalizeBrand(CONFIG.brand);

    function savedExportBrand() {
      if (!BRAND) return 'carta';
      try { return localStorage.getItem(EXPORT_BRAND_KEY) === 'carta' ? 'carta' : 'firm'; } catch (_) { return 'firm'; }
    }

    // An image as a PNG fitted to `box`, drawn through a canvas so SVG, WebP or GIF logos reach
    // the PDF as PNG; null when it will not load or decode.
    const rasterized = new Map();
    function rasterize(src, box) {
      const key = box.w + 'x' + box.h + ':' + src;
      if (!rasterized.has(key)) rasterized.set(key, rasterizeOnce(src, box));
      return rasterized.get(key);
    }

    function rasterizeOnce(src, box) {
      return new Promise(resolve => {
        const img = new Image();
        let timer = null;
        const done = v => { clearTimeout(timer); resolve(v); };
        timer = setTimeout(() => done(null), 5000);
        img.onload = () => {
          try {
            const size = fitBox(img.naturalWidth || img.width, img.naturalHeight || img.height, box);
            if (!size) return done(null);
            const scale = 4;
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(size.w * scale); canvas.height = Math.round(size.h * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            done({ data: canvas.toDataURL('image/png'), w: size.w, h: size.h });
          } catch (_) { done(null); }
        };
        img.onerror = () => done(null);
        img.src = src;
      });
    }

    // What a branded PDF draws with for `brandKey` ('firm' or 'carta'), the choice an export
    // read when it started. A display font that jsPDF cannot register is left out, so the
    // title falls back to the standard face.
    async function exportBrandAssets(doc, brandKey) {
      if (!BRAND || brandKey !== 'firm') return null;
      const [logo, poweredBy] = await Promise.all([
        BRAND.logoDataUri ? rasterize(BRAND.logoDataUri, PDF_LOGO_BOX) : Promise.resolve(null),
        rasterize('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(POWERED_BY_SVG), PDF_POWERED_BY),
      ]);
      let fontFamily = null;
      if (BRAND.displayFont) {
        try {
          doc.addFileToVFS('brand-display.ttf', BRAND.displayFont.ttf.split(',')[1]);
          doc.addFont('brand-display.ttf', 'BrandDisplay', 'normal');
          doc.setFont('BrandDisplay', 'normal');
          fontFamily = 'BrandDisplay';
        } catch (_) { fontFamily = null; }
      }
      return { firmName: BRAND.firmName, logo, accent: BRAND.accent, accentText: BRAND.accentText, fontFamily, poweredBy };
    }
    // The viewer saves files only through its downloads capability (granted on publish); where it
    // resolves to null, or turns out unavailable, export copies a table instead.
    let downloads = null;
    const SAVE_UNAVAILABLE = new Set(['unavailable', 'not_granted', 'capability_disabled', 'capability_removed']);
    // Each save asks the viewer to confirm, so past this many LPs one combined PDF is offered too.
    const COMBINE_FROM = 5;
    const RATE_LIMIT_RETRIES = 5;
    const RATE_LIMIT_WAIT_MS = 1500;
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // The current LP first, then the list's order.
    function exportOrder() {
      return data.families.filter(f => f.key === ui.sel).concat(data.families.filter(f => f.key !== ui.sel));
    }

    async function profilePdf(families, brandKey) {
      const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
      const models = families.map(f => profileModel(f, data.ctx, fundLabel));
      const brand = await exportBrandAssets(doc, brandKey);
      return drawProfiles(doc, models, { firm: data.firmName, generated: dateLabel(data.today), brand });
    }

    // 'saved', 'declined', 'unavailable', or the failure's message. A rate-limited save waits
    // and tries the same file again.
    async function saveFile(filename, blob) {
      for (let attempt = 0; ; attempt++) {
        try { await downloads.save({ filename, data: blob }); return 'saved'; } catch (err) {
          const code = err && err.code;
          if (code === 'declined') return 'declined';
          if (SAVE_UNAVAILABLE.has(code)) return 'unavailable';
          if (code === 'rate_limited' && attempt < RATE_LIMIT_RETRIES) { await sleep(RATE_LIMIT_WAIT_MS * (attempt + 1)); continue; }
          return 'Could not save ' + filename + '. Try again.';
        }
      }
    }

    const exports = exportLock();

    // Saves one PDF per LP (or one for all), one at a time, each waiting for the viewer's
    // confirmation; without the downloads capability it copies a table instead. Only one runs
    // at a time; while it does, the Export button shows `progress` and the controls that start
    // an export are disabled. Every file uses the branding chosen when the run started; the
    // dialog's branding toggle stays live but only steers its preview and the next run. Resolves to {done: true, note} when every file saved or the table copied, else
    // {done: false, error} (error '' when the viewer declined or another export was running).
    function runExport(families, combined, progress) {
      return exports.run(async () => {
        const brandKey = ui.exportBrand;
        const show = label => { ui.exportBusy = label; renderExport(); progress(label); };
        try {
          if (!downloads) {
            // The label goes up before the first wait, so the controls disable for the whole run.
            show('Copying…');
            const ok = await copyText(profilesTsv(families, latestNavDate(data.fundDates)));
            return ok ? { done: true, note: 'Copied — paste into a spreadsheet' } : { done: false, error: COPY_FAILED };
          }
          const files = combined
            ? [{ filename: combinedFilename(data.firmName, data.today), families }]
            : families.map(f => ({ filename: profileFilename(f, data.today), families: [f] }));
          const result = await saveAll(files, async file => {
            try { return await saveFile(file.filename, (await profilePdf(file.families, brandKey)).output('blob')); } catch (_) { return 'Could not make ' + file.filename + '.'; }
          }, show);
          if (result.done) return { done: true, note: files.length > 1 ? 'Exported ' + files.length + ' PDFs' : 'Exported' };
          if (result.outcome === 'unavailable') { downloads = null; return { done: false, error: "This view can't save files; export again to copy a table instead." }; }
          return { done: false, error: result.outcome === 'declined' ? '' : result.outcome };
        } finally {
          ui.exportBusy = '';
          renderExport();
        }
      });
    }

    function openExportDialog() {
      ui.menu = null;
      renderExport();
      // Picks and search start fresh each time; the branding choice is kept.
      ui.dlg = { pick: new Set(defaultPicks().map(f => f.key)), q: '', busy: '', error: '', profilesOpen: false };
      $('dialog-q').value = '';
      $('profiles-panel').hidden = true;
      $('profiles-trigger').setAttribute('aria-expanded', 'false');
      renderDialog();
      $('export-dialog').showModal();
      $('profiles-trigger').focus();
    }

    // A dialog closed mid-run lets the run finish; its outcome then shows beside the Export button.
    async function dialogExport(combined) {
      const d = ui.dlg;
      const chosen = exportOrder().filter(f => d.pick.has(f.key));
      if (!chosen.length || exports.busy()) return;
      d.exporting = true;
      track('click', combined ? 'Export.GoCombined' : 'Export.Go', chosen.length);
      d.error = '';
      const result = await runExport(chosen, combined, label => { d.busy = label; if (ui.dlg === d) renderDialogFoot(); });
      d.busy = '';
      track('render', result.done ? 'Export.Done' : result.error ? 'Export.Failed' : 'Export.Declined');
      if (ui.dlg === d && !result.done) { d.exporting = false; d.error = result.error; renderDialog(); return; }
      if (ui.dlg === d) $('export-dialog').close();
      Object.assign(ui, { exportNote: result.done ? result.note : result.error, exportNoteError: !result.done });
      renderExport();
    }

    // Copies the setup prompt; a brief dark tooltip, centred above the button, confirms it and
    // the button stays as it is.
    async function copyBrandPrompt(button) {
      const ok = await copyText(brandPrompt(data.firmName));
      const tip = $('copied-tip');
      const r = button.getBoundingClientRect();
      tip.style.left = (r.left + r.width / 2) + 'px';
      tip.style.top = r.top + 'px';
      tip.textContent = copiedNote(ok);
      tip.classList.add('is-on');
      clearTimeout(copyBrandPrompt.timer);
      copyBrandPrompt.timer = setTimeout(() => tip.classList.remove('is-on'), COPIED_TIP_MS);
    }

    function setExportBrand(key) {
      ui.exportBrand = key === 'firm' && BRAND ? 'firm' : 'carta';
      try { localStorage.setItem(EXPORT_BRAND_KEY, ui.exportBrand); } catch (_) {}
    }

    async function copyEmail(button) {
      const ok = await copyText(button.dataset.copy);
      button.innerHTML = ok ? ICON.copied : ICON.copy;
      button.title = ok ? 'Copied' : COPY_FAILED;
      button.setAttribute('aria-label', button.title);
      clearTimeout(button._timer);
      button._timer = setTimeout(() => { button.innerHTML = ICON.copy; button.title = 'Copy email'; button.setAttribute('aria-label', 'Copy ' + button.dataset.copy); }, 1500);
    }

    // ── events ──
    function onClick(e) {
      const t = e.target;
      const menuBtn = t.closest('[data-menu]');
      if (ui.menu && !menuBtn && !t.closest('.menu')) closeMenu();
      if (menuBtn) {
        if (!menuBtn.disabled) {
          if (ui.menu !== menuBtn.dataset.menu) { if (menuBtn.dataset.menu === 'contacts') track('click', 'Detail.Contacts.Open'); else if (menuBtn.dataset.menu === 'filter') track('click', 'Filter.Open'); else track('click', 'Exposure.Fund.Open'); }
          toggleMenu(menuBtn.dataset.menu);
        }
        return;
      }
      const option = t.closest('[data-option]');
      if (option) { track('click', 'Exposure.Fund.Pick'); pickOption(option.closest('[data-menu-for]').dataset.menuFor, option.dataset.option); return; }
      const view = t.closest('[data-view]');
      if (view) {
        if (ui.view !== view.dataset.view) track('click', 'View.Switch.' + trackLabel(view.dataset.view));
        setView(view.dataset.view);
        return;
      }
      const lp = t.closest('[data-pick]');
      if (lp) {
        const rows = Array.from($('lp-list').querySelectorAll('[data-pick]'));
        track('click', 'List.PickLP', rows.indexOf(lp) + 1);
        // Read before the pick: picking resets the detail's scroll, which can open a header a
        // scroll had folded for a moment, and a header already folded leaves no row to hold.
        const held = e.pointerType === 'mouse' && !ui.collapsed;
        pick(lp.dataset.pick);
        foldForPick(held);
        // The list redraws on a pick; focus stays on the picked row rather than falling to the page.
        refocus(`#lp-list [data-pick="${CSS.escape(ui.sel)}"]`, { preventScroll: true });
        return;
      }
      // The button hides once the header opens, so focus goes to the picked LP's row when the List
      // will show it in view once the header has opened, else to the current view's toggle, never to the page.
      if (t.closest('[data-reopen]')) {
        track('click', 'Header.Overview.Reopen');
        unfold();
        const list = $('lp-list');
        const row = ui.view === 'list' && list.querySelector(`[data-pick="${CSS.escape(ui.sel || '')}"]`);
        // Opening moves the rows down by the fold height while the list's bottom stays put; a row
        // that would end up out of view leaves focus to the view toggle instead.
        const box = row && row.getBoundingClientRect(), view = list.getBoundingClientRect();
        if (row && box.top >= view.top && box.bottom + foldHeight() <= view.bottom) row.focus({ preventScroll: true });
        else refocus(`[data-view="${ui.view}"]`);
        return;
      }
      if (t.closest('.top.is-pinned') && !t.closest('button, a, .ink-tooltip-wrap, .menu')) { track('click', 'Header.Overview.Reopen'); unfold(); return; }
      if (t.closest('[data-back]')) {
        track('click', 'Detail.Back');
        ui.showDetail = false;
        renderView();
        refocus(`[data-pick="${CSS.escape(ui.sel || '')}"]`);
        return;
      }
      const copy = t.closest('[data-copy]');
      if (copy) { track('click', 'Detail.CopyEmail'); copyEmail(copy); return; }
      const mode = t.closest('[data-x-mode]');
      if (mode) { if (mode.dataset.xMode !== ui.xMode) track('click', 'Exposure.Mode.' + trackLabel(mode.dataset.xMode)); Object.assign(ui, { xMode: mode.dataset.xMode, xOpen: new Set(), xAll: false }); renderDetail(); refocus(`[data-x-mode="${mode.dataset.xMode}"]`); return; }
      const xRow = t.closest('[data-x-toggle]');
      if (xRow) {
        const key = xRow.dataset.xToggle;
        if (!ui.xOpen.has(key)) track('click', 'Exposure.Row.Expand');
        if (ui.xOpen.has(key)) ui.xOpen.delete(key); else ui.xOpen.add(key);
        renderDetail();
        refocus(`[data-x-toggle="${CSS.escape(key)}"]`);
        return;
      }
      if (t.closest('[data-x-all]')) { track('click', 'Exposure.ShowAll'); ui.xAll = !ui.xAll; renderDetail(); refocus('[data-x-all]'); return; }
      if (t.closest('[data-wire-jump]')) { track('click', 'Detail.WireStatus.Jump'); jumpToWires(); return; }
      if (t.closest('[data-pos-more]')) { track('click', 'Detail.Positions.More'); ui.posAll = !ui.posAll; renderDetail(); refocus('[data-pos-more]'); return; }
      if (ui.dlg && ui.dlg.profilesOpen && !t.closest('.profiles-wrap')) setProfilesOpen(false);
      if (t.closest('[data-filter-wires]')) {
        track('click', ui.wires ? 'Filter.Attention.Off' : 'Filter.Attention.On');
        setFilters(!ui.wires, ui.funds); refocus('[data-filter-wires]'); return;
      }
      const fundOpt = t.closest('[data-filter-fund]');
      if (fundOpt) {
        const k = fundOpt.dataset.filterFund;
        track('click', 'Filter.Fund.Pick');
        setFilters(ui.wires, !k ? [] : ui.funds.includes(k) ? ui.funds.filter(x => x !== k) : ui.funds.concat(k));
        refocus(`[data-filter-fund="${CSS.escape(k)}"]`); return;
      }
      if (t.closest('[data-filter-clear]')) { track('click', 'Filter.Clear'); ui.menu = null; setFilters(false, []); refocus('[data-menu="filter"]'); return; }
      if (t.closest('[data-chip-wires]')) { track('click', 'Filter.Attention.Off'); setFilters(false, ui.funds); refocus('#pane-chips button, [data-menu="filter"]'); return; }
      const fundChip = t.closest('[data-chip-fund]');
      if (fundChip) { track('click', 'Filter.Fund.Remove'); setFilters(ui.wires, ui.funds.filter(x => x !== fundChip.dataset.chipFund)); refocus('#pane-chips button, [data-menu="filter"]'); return; }
      if (t.closest('[data-export-dialog]')) { track('click', 'Export.Open', ui.tableChecked.size || undefined); openExportDialog(); return; }
      const brandPromptBtn = t.closest('[data-brand-prompt]');
      if (brandPromptBtn) { trackPrompt('Brand.CopyPrompt', brandPrompt('<firm>')); copyBrandPrompt(brandPromptBtn); return; }
      if (t.closest('[data-dialog-close]')) { $('export-dialog').close(); return; }
      const template = t.closest('[data-template]');
      if (template) { if (template.dataset.template !== ui.exportBrand) track('click', 'Export.Template.' + trackLabel(template.dataset.template)); setExportBrand(template.dataset.template); renderTemplates(); renderPreview(); refocus(`[data-template="${ui.exportBrand}"]`); return; }
      if (t.closest('#profiles-trigger')) { setProfilesOpen(!ui.dlg.profilesOpen); if (!ui.dlg.profilesOpen) refocus('#profiles-trigger'); return; }
      if (t.closest('#dialog-go')) { dialogExport(false); return; }
      if (t.closest('[data-dialog-combined]')) { dialogExport(true); return; }
      // A table row's checkbox ticks it for export; it does not open the LP.
      if (t.closest('.t-check')) return;
      if (t.closest('#toggle-all')) {
        track('click', 'Table.ExpandAll');
        const views = tableFamilies().filter(v => v.fam.records.length > 1);
        const anyOpen = views.some(v => ui.open.has(v.fam.key));
        ui.open = anyOpen ? new Set() : new Set(views.map(v => v.fam.key));
        renderTable();
        refocus('#toggle-all');
        return;
      }
      const sort = t.closest('[data-sort]');
      if (sort) {
        const key = sort.dataset.sort;
        track('click', 'Table.Sort.' + trackLabel(key));
        ui.sortDir = ui.sortKey === key && ui.sortDir === 'desc' ? 'asc' : 'desc';
        ui.sortKey = key;
        renderTable();
        refocus(`[data-sort="${key}"]`);
        return;
      }
      const toggle = t.closest('[data-toggle]');
      if (toggle) {
        const key = toggle.dataset.toggle;
        if (!ui.open.has(key)) track('click', 'Table.Expand');
        if (ui.open.has(key)) ui.open.delete(key); else ui.open.add(key);
        renderTable();
        refocus(`button[data-toggle="${CSS.escape(key)}"]`);
        return;
      }
      const more = t.closest('[data-more]');
      if (more) { track('click', 'Table.More'); ui.more.add(more.dataset.more); renderTable(); return; }
      // The rest of a table row (not its chevron or "+N more") opens the LP.
      const open = t.closest('[data-open]');
      if (open) { track('click', 'Table.OpenLP'); openFromTable(open.dataset.open); }
    }

    function fitTooltip(e) {
      const wrap = e.target.closest && e.target.closest('.ink-tooltip-wrap');
      const tip = wrap && wrap.querySelector('.ink-tooltip[data-fit]');
      const pane = tip && wrap.closest('.detail-pane');
      if (!pane) return;
      const left = tooltipOpensLeft(wrap.getBoundingClientRect().left, tip.offsetWidth, pane.getBoundingClientRect().right);
      tip.classList.toggle('is-start', !left);
      tip.classList.toggle('is-end', left);
    }

    function wire() {
      document.addEventListener('click', onClick);
      document.addEventListener('mouseover', fitTooltip);
      document.addEventListener('focusin', fitTooltip);
      document.addEventListener('mouseover', trackUnverifiedTip);
      document.addEventListener('focusin', trackUnverifiedTip);
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && ui.menu) { const id = ui.menu; closeMenu(); refocus(`[data-menu="${id}"]`); return; }
        const row = e.target.closest && (e.target.closest('[data-x-toggle]') || (e.target.matches('[data-open]') && e.target));
        if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); row.click(); }
      });
      document.addEventListener('scroll', e => {
        if (e.target.matches && e.target.matches('[data-export-list]')) fadeExportList();
        else syncCollapse();
      }, true);
      // The spacer that held the clicked row in place eases away once the pointer leaves the LP pane.
      document.querySelector('.lp-pane').addEventListener('pointerleave', () => setListSpacer(0));
      // Scrolling up from the top of a shown pane opens a pinned overview again.
      document.addEventListener('wheel', e => {
        if (!ui.pinnedFold || e.deltaY >= 0) return;
        const pane = shownPanes().find(el => el && el.contains(e.target));
        if (pane && pane.scrollTop === 0) unfold();
      }, { passive: true });
      // A new width can change the header's fold height and whether it folds at all.
      const relayout = () => { ui.foldH = null; if (isPhone()) setListSpacer(0); syncCollapse(); };
      window.addEventListener('resize', relayout);
      PHONE.addEventListener('change', relayout);
      document.addEventListener('change', e => {
        const tableBox = e.target.closest('[data-table-check]');
        if (tableBox) {
          if (tableBox.checked) track('click', 'Table.Select');
          if (tableBox.checked) ui.tableChecked.add(tableBox.dataset.tableCheck); else ui.tableChecked.delete(tableBox.dataset.tableCheck);
          renderExport();
          return;
        }
        if (!ui.dlg) return;
        if (e.target.id === 'dialog-all') {
          if (e.target.checked) track('click', 'Export.SelectAll');
          ui.dlg.pick = e.target.checked ? new Set(data.families.map(f => f.key)) : new Set();
        } else {
          const box = e.target.closest('[data-dialog-pick]');
          if (!box) return;
          if (box.checked) ui.dlg.pick.add(box.dataset.dialogPick); else ui.dlg.pick.delete(box.dataset.dialogPick);
        }
        renderDialogList();
        renderProfilesValue();
        renderDialogFoot();
        renderPreview();
        refocus(e.target.id === 'dialog-all' ? '#dialog-all' : `[data-dialog-pick="${CSS.escape(e.target.dataset.dialogPick)}"]`);
      });
      $('q').addEventListener('input', e => { if (!searchTracked) { searchTracked = true; track('click', 'List.Search'); } ui.q = e.target.value; syncSelection(); renderFilter(); renderList(); renderDetail(); renderTable(); });
      $('dialog-q').addEventListener('input', e => { if (ui.dlg) { ui.dlg.q = e.target.value; renderDialogList(); } });
      // Esc, the close button or Cancel close it; an export already running finishes and reports
      // beside the Export button. Focus goes back to the Export button.
      $('export-dialog').addEventListener('close', () => { if (ui.dlg && !ui.dlg.exporting) track('click', 'Export.Close'); ui.dlg = null; refocus('[data-export-dialog]'); });
      // Esc closes an open Profiles panel first, and the dialog only after.
      $('export-dialog').addEventListener('cancel', e => {
        if (!ui.dlg || !ui.dlg.profilesOpen) return;
        e.preventDefault();
        setProfilesOpen(false);
        refocus('#profiles-trigger');
      });
      // The table is laid out at the full width it opens to, so it never reflows while opening.
      const split = $('split');
      new ResizeObserver(() => { split.style.setProperty('--split-w', split.clientWidth + 'px'); setListWidth(ui.listW, false); }).observe(split);
      wireResize(split, $('pane-resize'));
    }

    // ── load ──
    async function ensureSession() {
      if (!welcomeCalled) {
        try {
          const res = await callCartaTool(WELCOME_TOOL, {});
          if (!res || !res.isError) welcomeCalled = true;
        } catch (err) { console.warn('welcome failed: ' + (err && err.message ? err.message : err)); }
      }
      // Rows follow the viewer's active firm, and the SQL pin then filters any other firm's to
      // nothing, so an unswitched session would read as "no LPs". It stops the load instead.
      const ctx = await withRetry(() => callCartaTool('set_context', { firm_id: FIRM_CONTEXT_ID }), 'Connecting to Carta');
      if (!ctx || ctx.isError) throw new Error('could not switch Carta to this firm, so its rows cannot be read; reopen the page to try again');
    }

    const recordKey = (fund, partner) => fund + ':' + partner;

    function assemble(res) {
      for (const f of res.funds.rows) data.funds.set(f.fund_uuid, f);
      const latest = new Map(res.latest.rows.map(r => [recordKey(r.fund_uuid, r.partner_id), r]));
      const flows = new Map();
      for (const f of res.flows.rows) {
        const k = recordKey(f.fund_uuid, f.partner_id);
        if (!flows.has(k)) flows.set(k, []);
        flows.get(k).push({ date: f.flow_date, contributions: Number(f.contributions) || 0, distributions: Number(f.distributions) || 0 });
      }
      const contacts = new Map();
      for (const c of res.contacts.rows) {
        const k = recordKey(c.fund_uuid, c.partner_id);
        if (!contacts.has(k)) contacts.set(k, []);
        contacts.get(k).push({ name: c.contact_name, email: c.contact_email, is_primary: c.is_primary === true, mismatch: c.email_mismatch === true });
      }
      data.wireRestricted = res.wires.failed;
      const wires = new Map(res.wires.rows.map(w => [recordKey(w.fund_uuid, w.partner_id), w]));

      // Fund NAV for look-through: every partner's NAV at the fund's latest month.
      const fundMonth = new Map();
      for (const r of res.latest.rows) if (!fundMonth.has(r.fund_uuid) || r.nav_date > fundMonth.get(r.fund_uuid)) fundMonth.set(r.fund_uuid, r.nav_date);
      const fundNav = new Map();
      for (const r of res.latest.rows) {
        if (r.nav_date !== fundMonth.get(r.fund_uuid)) continue;
        fundNav.set(r.fund_uuid, (fundNav.get(r.fund_uuid) || 0) + (Number(r.nav) || 0));
      }

      const records = [];
      for (const p of res.partners.rows) {
        const fund = data.funds.get(p.fund_uuid);
        if (!fund) continue;
        const k = recordKey(p.fund_uuid, p.partner_id);
        const l = latest.get(k) || {};
        records.push({
          ...p, record_key: k, fund_name: fund.fund_name, fund_short: shortFundName(fund.fund_name, data.firmName), vintage_year: fund.vintage_year,
          currency: fund.currency_code || '', nav: Number(l.nav) || 0, nav_date: l.nav_date || null,
          paid_in: Number(l.paid_in) || 0, nav_distributed: Number(l.nav_distributed) || 0,
          flows: flows.get(k) || [], contacts: contacts.get(k) || [],
          wire: wireState(data.wireRestricted ? { restricted: true } : (wires.get(k) || { has_setup: false }), data.today),
        });
      }
      // The LP list opens largest commitment first.
      data.families = buildFamilies(records).map(familyView)
        .sort(compareFamilies(DEFAULT_SORT.key, DEFAULT_SORT.dir))
        .map(v => v.fam);
      // The header's as-of: each fund's latest LP valuation month.
      const byFund = new Map();
      for (const r of records) if (r.nav_date && (!byFund.has(r.fund_uuid) || r.nav_date > byFund.get(r.fund_uuid).nav_date)) byFund.set(r.fund_uuid, { fund_short: r.fund_short, nav_date: r.nav_date });
      data.fundDates = Array.from(byFund.values());

      const holdings = groupHoldings(res.holdings.rows);
      const unconverted = sumBy(res.holdings.rows, h => h.unconverted);
      if (unconverted) data.notes.push(unconverted + ' holding position(s) have no value in their fund\'s currency and are left out of exposure.');
      const masters = new Map(res.masters.rows.map(m => [m.fund_uuid + ':' + m.issuer_id, m.master_uuid]));
      const fundByName = new Map(Array.from(data.funds.values()).map(f => [String(f.fund_name).trim().toLowerCase(), f.fund_uuid]));
      const masterOf = (fundUuid, h) => {
        const linked = masters.get(fundUuid + ':' + h.issuer_id);
        if (linked && data.funds.has(linked)) return linked;
        return fundByName.get(String(h.name).trim().toLowerCase()) || null;
      };
      const sectors = new Map();
      for (const t of res.tags.rows) sectors.set(t.issuer_id, { tag: t.tag });
      for (const i of res.industries.rows) sectors.set(i.issuer_id, { ...(sectors.get(i.issuer_id) || {}), industry: i.industry });
      const currencyOf = new Map(Array.from(data.funds.values()).map(f => [f.fund_uuid, f.currency_code || '']));
      const geoTags = new Map();
      for (const t of res.geoTags.rows) {
        if (!geoTags.has(t.issuer_id)) geoTags.set(t.issuer_id, {});
        geoTags.get(t.issuer_id)[t.category] = t.tag;
      }
      const hq = new Map(res.hq.rows.map(h => [h.issuer_id, h.country]));
      // Geography needs one source for every company; with neither load it is not offered.
      const geo = res.geoTags.failed && res.hq.failed ? null : { tags: geoTags, hq, source: geographySource(geoTags) };
      data.ctx = { holdings, masterOf, fundNav, sectors, currencyOf, geo };

      const results = Object.values(res);
      const dropped = sumBy(results, r => r.skipped);
      if (dropped) data.notes.push(dropped + ' row(s) could not be read and were left out, so some figures may not tie out.');
      if (results.some(r => r.truncated)) data.notes.push('This firm is larger than one load can hold, so the figures are partial.');
      if (res.industries.failed && res.tags.failed) data.notes.push('Sectors are unavailable in this view, so every company reads Unclassified.');
      if (res.contacts.failed) data.notes.push('Contacts are unavailable in this view.');
      if (res.wires.failed) data.notes.push('Wire status could not be loaded in this view, so every fund reads Restricted.');
    }

    async function init() {
      $('firm-name').textContent = data.firmName;
      wire();
      renderAll();
      status('Connecting to Carta…');
      if (!(await mcpNamespace())) { fail(new Error('this page reads live data, and no Carta connector is available in this view')); return; }
      try { if (typeof initUiTracker === 'function') initUiTracker('carta-lp-summary', CARTA_MCP_SERVER); } catch (_) {}
      if (!FIRM_ROW_ID || !FIRM_CONTEXT_ID) { fail(new Error('the page config does not name its firm, so it will not load any rows; ask Claude to rebuild the LP Summary')); return; }
      try { await ensureSession(); } catch (err) { fail(err); return; }
      try {
        status('Loading limited partners…');
        await assertSessionOnFirm();
        const [funds, partners, latest, flows, contacts, holdings, wires, masters, industries, tags, geoTags, hq] = await Promise.all([
          queryAll(fundsSql(), 'Loading funds'),
          queryAll(partnersSql(), 'Loading limited partners'),
          queryAll(latestNavSql(), 'Loading NAV'),
          queryAll(flowsSql(), 'Loading capital activity'),
          queryOptional(contactsSql(), 'Loading contacts'),
          queryAll(holdingsSql(), 'Loading holdings'),
          queryOptional(wiresSql(), 'Loading wire status'),
          queryOptional(mastersSql(), 'Loading fund links'),
          queryOptional(industriesSql(), 'Loading sectors'),
          queryOptional(tagsSql(), 'Loading tags'),
          queryOptional(geoTagsSql(), 'Loading geography tags'),
          queryOptional(hqCountrySql(), 'Loading company countries'),
        ]);
        // The queries ran in parallel; a firm switch during them leaves some empty, not foreign.
        await assertSessionOnFirm();
        assemble({ funds, partners, latest, flows, contacts, holdings, wires, masters, industries, tags, geoTags, hq });
        data.loaded = true;
        ui.sel = data.families.length ? data.families[0].key : null;
        // A search typed while the page loaded applies to the first selection too.
        syncSelection();
        $('as-of').innerHTML = asOfHtml(data.fundDates);
        status('');
        renderAll();
        track('render', 'View.' + ORIGIN);
        if (!data.families.length) track('render', 'Empty');
      } catch (err) { fail(err); }
    }

    // ── update banner ──
    // A rendered artifact is a frozen copy and the sandbox blocks outbound fetches, so the
    // Carta connector reads the published version and this compares it to the stamp.
    const UPDATE_DISMISS_KEY = 'cartaLpSummarySplit.dismissedUpdateVersion';
    const UPDATE_PROMPT_TEXT = 'Rebuild my LP Summary';

    function parseMajorMinor(v) {
      const m = /^(\d+)\.(\d+)\.\d+$/.exec(String(v || ''));
      return m ? [Number(m[1]), Number(m[2])] : null;
    }

    // Patch ships copy and style nudges; banner-worthy change starts at minor.
    function updateAvailable(current, latest) {
      const c = parseMajorMinor(current), l = parseMajorMinor(latest);
      if (!c || !l) return false;
      if (l[0] !== c[0]) return l[0] > c[0];
      return l[1] > c[1];
    }

    // Silent on every failure: a banner the user cannot act on is worse than none.
    async function checkForUpdate() {
      try {
        const res = JSON.parse(unwrap(await callMcpWithWelcomeRetry('read_tool', { name: 'plugin__get__version', arguments: { plugin: 'carta-investors', skill: 'carta-lp-summary' } })));
        const latest = res && typeof res.version === 'string' ? res.version : null;
        if (!latest || !updateAvailable(ARTIFACT_VERSION, latest)) return;
        try { if (localStorage.getItem(UPDATE_DISMISS_KEY) === latest) return; } catch (_) {}
        const slot = $('update-banner-slot');
        slot.innerHTML = `<div class="update-banner" role="status"><div><p class="title">A newer LP Summary is available</p>
          <p class="msg">${res.headline ? esc(res.headline) + ' ' : ''}Ask Claude to rebuild it: “${esc(UPDATE_PROMPT_TEXT)}”</p></div>
          <button class="icon-btn" type="button" aria-label="Dismiss">${ICON.close}</button></div>`;
        track('render', 'Update.Show');
        slot.querySelector('button').addEventListener('click', () => {
          track('click', 'Update.Dismiss');
          try { localStorage.setItem(UPDATE_DISMISS_KEY, latest); } catch (_) {}
          slot.innerHTML = '';
        });
      } catch (e) { console.log('[carta-lp-summary] update check unavailable:', e && e.message); }
    }

    // PDF export needs both the viewer's downloads capability and the inlined jsPDF.
    ui.exportBrand = savedExportBrand();
    Promise.resolve(window.claude?.use?.('downloads') ?? null).catch(() => null)
      .then(d => { downloads = d && window.jspdf ? d : null; renderExport(); });
    init().then(() => setTimeout(checkForUpdate, 0));
  </script>
</body>
</html>
