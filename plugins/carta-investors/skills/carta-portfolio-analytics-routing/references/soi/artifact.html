                        <td class="number">${fxIcon(a.fxGl, 'Base currency unrealized G/L')}${glCell(a.gl, a.currency)}${currencyTag}</td>
                        <td class="number">${fmtDec(a.cps, a.currency)}</td>
                        <td class="number">${fmtDec(a.vps, a.currency)}</td>
                    `;
                    tbody.appendChild(ar);

                    if (isExpandable) {
                        tbody.appendChild(renderUnderlyingRows(underlyingKey, i, a, c.name, isExpanded));
                    }
                });
            });

            if (!filterText) {
                const t = computeTotals(data);
                const totalCost  = viewMixedCurrency ? '<span class="mixed-badge">Mixed</span>' : fmt(t.cost);
                const totalValue = viewMixedCurrency ? '<span class="mixed-badge">Mixed</span>' : fmt(t.value);
                const totalGl    = viewMixedCurrency ? '<span class="mixed-badge">Mixed</span>' : glCell(t.gl);
                const heldByTotalsCell = isPooledUuid(currentFundUuid) ? '<td></td>' : '';
                const tr = document.createElement('tr');
                tr.className = 'totals-row';
                tr.innerHTML = `
                    <td>${data.length} companies, ${t.assets} positions</td>
                    ${heldByTotalsCell}
                    <td></td>
                    <td></td>
                    <td class="number">${totalCost}</td>
                    <td class="number">${totalValue}</td>
                    <td></td>
                    <td class="number">${totalGl}</td>
                    <td></td>
                    <td></td>
                `;
                tbody.appendChild(tr);
            }
        }

        function toggle(i) {
            const rows = document.querySelectorAll(`.asset-group-${i}`);
            const expanding = !rows[0]?.classList.contains('visible');
            rows.forEach(r => r.classList.toggle('visible', expanding));
            const icon = document.getElementById(`icon-${i}`);
            if (icon) icon.innerHTML = inkIcon(expanding ? 'down' : 'forward', 10);

            // Sync allExpanded to actual state so the header icon doesn't lie
            // when the user expand-alls then collapses one (or vice-versa).
            const allRows = document.querySelectorAll('.asset-row');
            allExpanded = allRows.length > 0 && Array.from(allRows).every(r => r.classList.contains('visible'));
            const t = document.getElementById('expandAllToggle');
            if (t) t.innerHTML = inkIcon(allExpanded ? 'collapse-all' : 'expand-all', 16);
        }

        function toggleAll() {
            allExpanded = !allExpanded;
            document.querySelectorAll('.asset-row, .underlying-row').forEach(r => r.classList.toggle('visible', allExpanded));
            // Exclude .underlying-toggle — a FUND_INVESTMENT row's own drill-down
            // expand/collapse is independent of the company-row expand-all state.
            document.querySelectorAll('.expand-icon:not(.underlying-toggle)').forEach(ic => {
                ic.innerHTML = inkIcon(allExpanded ? 'down' : 'forward', 10);
            });
            const t = document.getElementById('expandAllToggle');
            if (t) t.innerHTML = inkIcon(allExpanded ? 'collapse-all' : 'expand-all', 16);
        }

        function filterCompanies(val) {
            filterText = val;
            render();
            scheduleGlobalSearch(val);
        }

        // ── Look-through drill-down: render + fetch ──

        // Renders the underlying-holdings rows for one expanded FUND_INVESTMENT asset.
        // Returns a DocumentFragment (possibly empty when collapsed) so render() can
        // append it directly to tbody alongside the flat company/asset rows — no
        // nested <table>, so sticky-first-column and sort/filter logic don't need to
        // know this level exists.
        function renderUnderlyingRows(key, companyIdx, asset, parentIssuerName, isExpanded) {
            const frag = document.createDocumentFragment();
            if (!isExpanded) return frag;

            const colCount = getColumns().length;
            const cacheKey = `${asset.fundUuid}::${parentIssuerName}::${currentAsOfDate || 'current'}`;
            const cached = underlyingCache.get(cacheKey);
            const showHeldBy = isPooledUuid(currentFundUuid);

            // underlying rows carry the same `asset-group-${companyIdx}` class as the
            // asset row above them, so toggle()/toggleAll() (which operate on that
            // class, oblivious to nesting level) hide/show them together with the
            // rest of the company's rows — a collapsed company row shouldn't leave
            // its look-through rows visible underneath it.
            const groupClass = `asset-group-${companyIdx}`;
            const visibleClass = allExpanded ? ' visible' : '';

            const statusRow = (text, isError) => {
                const tr = document.createElement('tr');
                tr.className = `underlying-row underlying-group-${key} ${groupClass}${visibleClass}`;
                tr.innerHTML = `<td colspan="${colCount}" class="underlying-status${isError ? ' error' : ''}">${escHtml(text)}</td>`;
                return tr;
            };

            if (cached === undefined || cached === 'loading') {
                frag.appendChild(statusRow('Loading underlying holdings…', false));
                return frag;
            }
            if (cached instanceof Error) {
                frag.appendChild(statusRow("Couldn't load underlying holdings: " + cached.message, true));
                return frag;
            }
            if (!Array.isArray(cached) || cached.length === 0) {
                frag.appendChild(statusRow('No look-through holdings available for this position — sharing may not be enabled, or the underlying fund isn’t Carta-administered.', false));
                return frag;
            }

            cached.forEach(u => {
                const tr = document.createElement('tr');
                tr.className = `underlying-row underlying-group-${key} ${groupClass}${visibleClass}`;
                const pct = u.ownership_fraction != null ? u.ownership_fraction * 100 : null;
                const pctTip = pct != null
                    ? `${STATE.firm_name}'s look-through share of ${u.underlying_fund_name || parentIssuerName}: ${pct.toFixed(2)}%`
                    : 'Ownership share unavailable — figures shown unprorated';
                const sourceLabel = u.source === 'LPPA' ? 'self-reported' : 'Carta-administered';
                const shares = u.count_remaining_shares || 0;
                const cost = u.cost_basis || 0;
                const cps = shares > 0 ? cost / shares : null;
                const heldByCell = showHeldBy ? '<td>—</td>' : '';
                tr.innerHTML = `
                    <td><span class="underlying-name tooltip-trigger" data-tooltip="${escHtml(pctTip)}">${escHtml(u.underlying_issuer_name)}</span><span class="underlying-source">${sourceLabel}</span></td>
                    ${heldByCell}
                    <td>—</td>
                    <td class="number">${fmtShares(u.count_remaining_shares)}</td>
                    <td class="number">${fmt(cost, u.currency_code)}</td>
                    <td class="number">${fmt(u.fmv || 0, u.currency_code)}</td>
                    <td>—</td>
                    <td class="number">${glCell(u.unrealized_gain_loss || 0, u.currency_code)}</td>
                    <td class="number">${fmtDec(cps, u.currency_code)}</td>
                    <td class="number">${fmtDec(u.remaining_value_per_share, u.currency_code)}</td>
                `;
                frag.appendChild(tr);
            });
            return frag;
        }

        // Expand/collapse one FUND_INVESTMENT asset's underlying holdings, fetching
        // (and caching) from UNDERLYING_INVESTMENTS on first expand. Re-renders after
        // both the optimistic "loading" state and the resolved result/error so the
        // user sees progress rather than a frozen row.
        async function toggleUnderlying(key, fundUuid, parentIssuerName) {
            if (expandedUnderlying.has(key)) {
                expandedUnderlying.delete(key);
                render();
                return;
            }
            expandedUnderlying.add(key);

            // This is the fallback path — the normal path is loadFund's bulk prefetch,
            // which already populates underlyingCache (with an explicit [] for
            // positions with no look-through data) before the table renders. This
            // per-row fetch only fires if that bulk prefetch missed this key, e.g. it
            // partially failed.
            const cacheKey = `${fundUuid}::${parentIssuerName}::${currentAsOfDate || 'current'}`;
            if (!underlyingCache.has(cacheKey)) {
                underlyingCache.set(cacheKey, 'loading');
                render();
                try {
                    const result = await callMcpWithWelcomeRetry(CALL_TOOL, {
                        name: 'dwh__execute__query',
                        arguments: { sql: buildUnderlyingSql(fundUuid, parentIssuerName, currentAsOfDate) },
                    });
                    const rows = parseDwhQueryResult(result);
                    underlyingCache.set(cacheKey, rows);
                } catch (err) {
                    underlyingCache.set(cacheKey, err instanceof Error ? err : new Error(String(err)));
                }
            }
            render();
        }

        // ── Global (cross-fund) search ──
        // Debounced so every keystroke doesn't fire a warehouse query. Runs
        // independently of the local top-level company filter — the two answer
        // different questions ("which of THIS fund's top-level positions match" vs.
        // "which of ANY fund's look-through holdings match").

        function scheduleGlobalSearch(term) {
            globalSearchTerm = (term || '').trim();
            clearTimeout(globalSearchDebounce);
            if (globalSearchTerm.length < 2) {
                globalSearchResults = null;
                globalSearchError = null;
                globalSearchLoading = false;
                renderGlobalSearchPanel();
                return;
            }
            globalSearchDebounce = setTimeout(() => runGlobalSearch(globalSearchTerm), 400);
        }

        async function runGlobalSearch(term) {
            if (term !== globalSearchTerm) return; // superseded by a later keystroke
            globalSearchLoading = true;
            globalSearchError = null;
            renderGlobalSearchPanel();
            try {
                const result = await callMcpWithWelcomeRetry(CALL_TOOL, {
                    name: 'dwh__execute__query',
                    arguments: { sql: buildGlobalUnderlyingSearchSql(term, 200, currentAsOfDate) },
                });
                const rows = parseDwhQueryResult(result);
                if (term !== globalSearchTerm) return; // stale by the time it resolved
                globalSearchResults = rows;
            } catch (err) {
                if (term !== globalSearchTerm) return;
                globalSearchError = (err && err.message) || String(err);
                globalSearchResults = null;
            } finally {
                if (term === globalSearchTerm) {
                    globalSearchLoading = false;
                    renderGlobalSearchPanel();
                }
            }
        }

        function renderGlobalSearchPanel() {
            const panel = document.getElementById('globalSearchPanel');
            if (!panel) return;

            if (!globalSearchTerm || globalSearchTerm.length < 2) {
                panel.style.display = 'none';
                panel.innerHTML = '';
                return;
            }
            panel.style.display = 'block';

            if (globalSearchLoading) {
                panel.innerHTML = '<div class="global-search-status">Searching underlying holdings across all your funds…</div>';
                return;
            }
            if (globalSearchError) {
                panel.innerHTML = `<div class="global-search-status error">Couldn't search underlying holdings: ${escHtml(globalSearchError)}</div>`;
                return;
            }
            if (!globalSearchResults || globalSearchResults.length === 0) {
                panel.innerHTML = `<div class="global-search-status">No underlying (look-through) holdings match "${escHtml(globalSearchTerm)}".</div>`;
                return;
            }

            const rowsHtml = globalSearchResults.map(r => {
                const value = fmt(r.fmv || 0, r.currency_code);
                return `<div class="global-search-row" onclick="jumpToMatch('${escJs(r.fund_uuid)}', '${escJs(r.parent_issuer_name)}', '${escJs(r.underlying_issuer_name)}')">
                    <div class="gsr-main">
                        <span class="gsr-company">${escHtml(r.underlying_issuer_name)}</span>
                        <span class="gsr-via">via ${escHtml(r.parent_issuer_name)}</span>
                    </div>
                    <div class="gsr-fund">${escHtml(r.fund_name)}</div>
                    <div class="gsr-value">${value}</div>
                </div>`;
            }).join('');

            const count = globalSearchResults.length;
            panel.innerHTML = `<div class="global-search-header">Also held (look-through) across your funds — ${count} match${count === 1 ? '' : 'es'}</div>${rowsHtml}`;
        }

        // Switches to the matched fund (if needed), expands the matched parent LP
        // interest's underlying holdings, and scrolls it into view. The local text
        // filter is cleared so the parent row isn't hidden by an unrelated filter
        // term left over from before the fund switch; the global search box itself
        // (and its panel) are left alone so the user can keep browsing other matches.
        async function jumpToMatch(fundUuid, parentIssuerName, underlyingIssuerName) {
            if (fundUuid && fundUuid !== currentFundUuid) {
                await loadFund(fundUuid);
                // loadFund rebuilds the DOM (ensureContentSkeleton), which wipes the
                // search input and the global-search panel — restore both so the
                // panel the user clicked from is still visible after the jump.
                const input = document.getElementById('searchInput');
                if (input) input.value = globalSearchTerm;
                renderGlobalSearchPanel();
            }
            filterText = '';

            const idx = companies.findIndex(c => c.name === parentIssuerName);
            if (idx === -1) { render(); return; }

            const assetIdx = companies[idx].assets.findIndex(a => a.isFundInvestment);
            render();

            if (assetIdx !== -1) {
                const key = `${idx}-${assetIdx}`;
                if (!expandedUnderlying.has(key)) {
                    await toggleUnderlying(key, fundUuid, parentIssuerName);
                }
            }

            requestAnimationFrame(() => {
                const groupRows = document.querySelectorAll(`.asset-group-${idx}`);
                const companyRows = document.querySelectorAll('tr.company-row');
                const target = groupRows[0] || companyRows[idx];
                if (target && target.scrollIntoView) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        }

        // ── Loading / error / empty-fund states ──

        // Swap shimmer for the real content area. Used by every terminal state
        // (success, error, empty fund) so the shimmer never gets stranded.
        function showContent() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('contentArea').classList.add('loaded');
            setLoadingStatus(null);
        }

        // Show or clear a status caption above the shimmer. Used to explain the
        // brief extra delay when the artifact has to re-initialize the MCP session
        // via the welcome tool before retrying a failed call.
        function setLoadingStatus(msg) {
            const el = document.getElementById('loadingStatus');
            if (!el) return;
            if (msg) {
                el.textContent = msg;
                el.style.display = 'block';
            } else {
                el.textContent = '';
                el.style.display = 'none';
            }
        }

        // The Carta MCP asks us to call `welcome` when the user's session state has
        // expired (typically after a few days of inactivity). Match on the word
        // "welcome" — narrow enough to avoid false positives on unrelated dwh errors,
        // loose enough to survive minor wording tweaks from the MCP team.
        function isWelcomeRequiredMessage(text) {
            return typeof text === 'string' && /welcome/i.test(text);
        }

        // Every Carta MCP call — call_tool, set_context, welcome alike — must carry
        // _instrumentation_v2 or the MCP rejects it with an "attach it to every
        // call" error. Centralized here so every call site (including the retry
        // and the welcome recovery call) gets it, instead of each caller having to
        // remember it individually.
        const INSTRUMENTATION_V2 = { skills: ['carta-investors:carta-soi'], from_ui: true };

        function withInstrumentation(args) {
            return { ...args, _instrumentation_v2: INSTRUMENTATION_V2 };
        }

        let _mcpNsPromise = null;
        // null means this view cannot run mcp — not granted, not served, or failed to load.
        // Polls up to 5 attempts, 4 × 500 ms gaps (2 s max) to handle window.claude not yet ready on first render.
        function mcpNamespace() {
            if (!_mcpNsPromise) {
                _mcpNsPromise = (async () => {
                    for (let i = 0; i < 5; i++) {
                        try {
                            const mcp = await Promise.resolve(window.claude?.use?.('mcp') ?? null);
                            if (mcp) return mcp;
                        } catch (_) {}
                        if (i < 4 && typeof setTimeout === 'function') await new Promise(r => setTimeout(r, 500));
                    }
                    return null;
                })();
            }
            return _mcpNsPromise;
        }

        // A tool that ran and reported failure comes back as an isError envelope so the
        // welcome recovery below can read its message. Connector-level codes
        // (needs_reauth, server_not_connected) rethrow — those are page-level.
        async function callCartaTool(toolName, args) {
            const mcp = await mcpNamespace();
            if (!mcp) {
                throw new Error('No live Carta connector in this view — the page cannot load data');
            }
            try {
                return await mcp.callTool(CARTA_MCP_SERVER, toolName, withInstrumentation(args || {}));
            } catch (err) {
                if (err && err.code === 'tool_error') {
                    return { isError: true, code: err.code, result: err.result, content: [{ type: 'text', text: err.message || 'tool error' }] };
                }
                // server_not_connected means the name this page was published with doesn't
                // match any connector the viewer has. It fails every call, so raise it as a self-explaining,
                // user-facing error the callers show verbatim instead of a bare code that
                // reads as a stuck load.
                if (err && err.code === 'server_not_connected') {
                    const e = new Error('Could not reach the Carta connector "' + CARTA_MCP_SERVER + '". Its name may not match the Carta connector in your Claude settings. Ask whoever shared this dashboard to re-publish it. (server_not_connected)');
                    e.userFacing = true;
                    throw e;
                }
                throw err;
            }
        }

        // Transparently recovers from "please call welcome first" errors. On the first
        // such failure per artifact load, call welcome to re-initialize the session and
        // retry the original call once. Any other error passes through untouched, and
        // `welcomeCalledThisSession` stops a loop if welcome didn't fix the cause.
        async function callMcpWithWelcomeRetry(toolName, args) {
            const result = await callCartaTool(toolName, args);
            if (!result || !result.isError) return result;

            const errorText = (result.content && result.content[0] && result.content[0].text) || '';
            if (!isWelcomeRequiredMessage(errorText) || welcomeCalledThisSession) {
                return result;
            }

            setLoadingStatus('Reconnecting to Carta…');
            welcomeCalledThisSession = true;
            const welcomeResult = await callCartaTool(WELCOME_TOOL, {});
            if (welcomeResult && welcomeResult.isError) {
                const msg = (welcomeResult.content && welcomeResult.content[0] && welcomeResult.content[0].text) || '<no message>';
                throw new Error('Failed to initialize MCP session: ' + msg);
            }

            return await callCartaTool(toolName, args);
        }

        // Idempotent rebuild of contentArea's child structure. Called from every render
        // path so that whatever the prior state was (shimmer, empty, error, populated
        // table), the next render has a clean skeleton to write into. Doing it here
        // rather than only in the cache-miss path means that an empty-fund or error
        // state doesn't permanently destroy the fund switcher — the user can always
        // switch to a different fund.
        function ensureContentSkeleton() {
            if (document.getElementById('tableBody')) return;
            const area = document.getElementById('contentArea');
            area.innerHTML = `
                <div class="fund-switcher" id="fundSwitcher">
                    <span class="fund-switcher-label">Fund:</span>
                    <div class="select-wrapper"><select class="fund-select" id="fundSelect" onchange="switchFund(this.value)"></select><span class="select-chevron"><svg viewBox="0 0 10 6" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"/></svg></span></div>
                </div>
                <div id="metricsContainer"></div>
                <div class="toolbar" id="toolbar">
                    <div class="search-wrapper">
                        <span class="search-icon" id="searchIcon"></span>
                        <input type="text" class="search-input" id="searchInput" placeholder="Search companies...">
                    </div>
                </div>
                <div class="table-scroll">
                    <table>
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            `;
            document.getElementById('searchIcon').innerHTML = inkIcon('search', 14);
            populateFundSelect();
        }

        function showError(msg) {
            // Don't wipe contentArea — the user needs the fund switcher above to escape
            // from an error state. Write the error into the table area only.
            ensureContentSkeleton();
            document.getElementById('metricsContainer').innerHTML = '';
            document.getElementById('tableHead').innerHTML = '';
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            td.colSpan = getColumns().length;
            td.className = 'empty-state error';
            td.textContent = msg;
            tr.appendChild(td);
            tbody.appendChild(tr);
            showContent();
        }

        function renderEmptyFund() {
            ensureContentSkeleton();
            document.getElementById('metricsContainer').innerHTML = '';
            document.getElementById('tableHead').innerHTML = '';
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = `<tr><td colspan="${getColumns().length}" class="empty-state">This fund has no active investments.</td></tr>`;
            showContent();
        }

        // ── Fetch and render ──

        // Page through the warehouse query until we hit a short page (or the safety cap).
        // Stops as soon as a page returns fewer rows than PAGE_SIZE, which signals we've
        // read the last batch.
        async function fetchAllPages(buildSql) {
            const allRows = [];
            for (let page = 0; page < MAX_PAGES; page++) {
                const result = await callMcpWithWelcomeRetry(CALL_TOOL, {
                    name: 'dwh__execute__query',
                    arguments: { sql: buildSql(page * PAGE_SIZE, PAGE_SIZE) },
                });
                // Parser unwraps { content: [{ text: <markdown> }], isError? }
                // and throws on error envelopes.
                const pageRows = parseDwhQueryResult(result);
                allRows.push(...pageRows);
                if (pageRows.length < PAGE_SIZE) return allRows;
            }
            console.warn(`SOI fetch hit MAX_PAGES (${MAX_PAGES}); results may be truncated at ${MAX_PAGES * PAGE_SIZE} rows.`);
            return allRows;
        }

        // Sort key for vintage-descending order. Funds with no vintage_date sort
        // last (below every dated fund), as a plain-string fallback that is always
        // lexicographically smaller than a real ISO date.
        function vintageSortKey(f) {
            return f.vintage_date || '0000-00-00';
        }

        // Group funds by fund_family_name (present) vs standalone (absent/null).
        // Members within a family, and standalone funds, are each sorted by
        // vintage — most recent first, undated last, then alphabetically.
        function groupFundsByFamily() {
            const families = new Map();
            const standalone = [];
            FUNDS.forEach(f => {
                if (f.fund_family_name) {
                    if (!families.has(f.fund_family_name)) families.set(f.fund_family_name, []);
                    families.get(f.fund_family_name).push(f);
                } else {
                    standalone.push(f);
                }
            });
            const byVintageThenName = (a, b) =>
                vintageSortKey(b).localeCompare(vintageSortKey(a)) || a.name.localeCompare(b.name);
            families.forEach(members => members.sort(byVintageThenName));
            standalone.sort(byVintageThenName);
            return { families, standalone };
        }

        function makeOption(value, label, selectedUuid) {
            const opt = document.createElement('option');
            opt.value = value;
            opt.textContent = label;
            if (value === selectedUuid) opt.selected = true;
            return opt;
        }

        function populateFundSelect() {
            const select = document.getElementById('fundSelect');
            if (!select) return;
            select.innerHTML = '';

            // "All Entities" only makes sense with more than one fund to combine.
            if (FUNDS.length > 1) {
                select.appendChild(makeOption(ALL_ENTITIES_VALUE, 'All Entities', currentFundUuid));
            }

            const { families, standalone } = groupFundsByFamily();

            // Build one unified, orderable list of dropdown entries — a fund family
            // is positioned by its most-recent member's vintage — then sort the
            // whole list together so the dropdown reads most-recent-vintage-first
            // end to end, not "all families, then all standalone funds."
            const entries = [];
            families.forEach((members, name) => {
                entries.push({ kind: 'family', name, members, sortKey: vintageSortKey(members[0]) });
            });
            standalone.forEach(f => {
                entries.push({ kind: 'fund', fund: f, sortKey: vintageSortKey(f) });
            });
            entries.sort((a, b) => b.sortKey.localeCompare(a.sortKey));

            entries.forEach(entry => {
                if (entry.kind === 'family') {
                    if (entry.members.length > 1) {
                        // The family name itself is the rollup option: an <optgroup> label renders
                        // the family but cannot be selected, so pooling would need a second row.
                        const header = makeOption(FAMILY_PREFIX + entry.name, entry.name, currentFundUuid);
                        header.style.fontWeight = 'bold';
                        select.appendChild(header);
                        // Non-breaking spaces — leading plain whitespace collapses in some browsers.
                        entry.members.forEach(f => select.appendChild(makeOption(f.uuid, '\u00a0\u00a0\u00a0\u00a0' + f.name, currentFundUuid)));
                    } else {
                        // A family of one fund has nothing to pool, so it reads as a plain fund.
                        entry.members.forEach(f => select.appendChild(makeOption(f.uuid, f.name, currentFundUuid)));
                    }
                } else {
                    select.appendChild(makeOption(entry.fund.uuid, entry.fund.name, currentFundUuid));
                }
            });

            // Only the Fund dropdown hides for a single-fund firm — the As of
            // dropdown is always relevant, regardless of fund count.
            const fundPart = document.getElementById('fundSwitcherFundPart');
            if (fundPart) fundPart.hidden = FUNDS.length <= 1;

            populateAsOfSelect();
        }

        // Builds the last N quarter-end dates (most recent completed quarter first)
        // plus a leading "Current" option. Computed from the viewer's local clock —
        // there's no server-side "as of" catalog to read, so this is an assumption
        // (calendar quarters, not fiscal quarters) rather than a fetched fact.
        function computeQuarterOptions(count) {
            const opts = [{ value: '', label: 'Current' }];
            const now = new Date();
            let year = now.getFullYear();
            let qEndMonth = Math.floor(now.getMonth() / 3) * 3 + 2; // 2,5,8,11 → Mar/Jun/Sep/Dec
            let d = new Date(year, qEndMonth + 1, 0); // last day of that month
            if (d > now) {
                qEndMonth -= 3;
                if (qEndMonth < 0) { qEndMonth += 12; year -= 1; }
                d = new Date(year, qEndMonth + 1, 0);
            }
            for (let i = 0; i < count; i++) {
                const y = d.getFullYear();
                const m = d.getMonth();
                const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                const q = Math.floor(m / 3) + 1;
                opts.push({ value: iso, label: `Q${q} ${y} (${iso})` });
                let nm = m - 3, ny = y;
                if (nm < 0) { nm += 12; ny -= 1; }
                d = new Date(ny, nm + 1, 0);
            }
            return opts;
        }

        function populateAsOfSelect() {
            const select = document.getElementById('asOfSelect');
            if (!select) return;
            select.innerHTML = '';
            computeQuarterOptions(12).forEach(opt => {
                const el = document.createElement('option');
                el.value = opt.value;
                el.textContent = opt.label;
                if (opt.value === (currentAsOfDate || '')) el.selected = true;
                select.appendChild(el);
            });
        }

        // Reloads the current fund at a different as-of date. A quarter-end pulls
        // from the point-in-time history tables (AGGREGATE_INVESTMENTS_HISTORY /
        // UNDERLYING_INVESTMENTS_HISTORY) instead of the live current-state tables —
        // see buildSoiSql / buildUnderlyingBulkSql. Cached independently per
        // (fund, as-of) pair, so flipping back and forth doesn't re-fetch.
        function switchAsOf(value) {
            const newAsOf = value || null;
            if (newAsOf === currentAsOfDate) return;
            currentAsOfDate = newAsOf;
            filterText = '';
            sortCol = null;
            sortDir = 'asc';
            allExpanded = false;
            expandedUnderlying = new Set();
            clearTimeout(globalSearchDebounce);
            globalSearchTerm = '';
            globalSearchResults = null;
            globalSearchError = null;
            globalSearchLoading = false;
            loadFund(currentFundUuid);
        }

        // Show the shimmer skeleton again (used when switching to an uncached fund).
        function showLoading() {
            ensureContentSkeleton();
            document.getElementById('loadingState').style.display = '';
            document.getElementById('contentArea').classList.remove('loaded');
        }

        async function loadFund(fundUuid) {
            currentFundUuid = fundUuid;
            ensureContentSkeleton();  // Recovers DOM if prior render was empty/error.
            // Keep the <select>'s selected attribute in sync with state. The live
            // `.value` is already correct via the user's change event, but the
            // attribute can lag — set it explicitly so programmatic reads and any
            // future "reset" of the dropdown reflect the active fund.
            const select = document.getElementById('fundSelect');
            if (select) select.value = fundUuid;

            const isPooled = isPooledUuid(fundUuid);
            const pooled = isPooled ? pooledFunds(fundUuid) : [];

            if (isPooled) {
                // A pooled selection's funds aren't guaranteed to share one reporting
                // currency. currentCurrency stays meaningful (for fmt() call sites that
                // don't have a specific row's currency handy) only when every fund
                // agrees; otherwise per-row/per-company currency drives display instead.
                const uniqueCurrencies = new Set(pooled.map(f => f.currency).filter(Boolean));
                viewMixedCurrency = uniqueCurrencies.size > 1;
                currentCurrency = uniqueCurrencies.size === 1 ? [...uniqueCurrencies][0] : null;
            } else {
                viewMixedCurrency = false;
                // Resolve fund currency from the injected FUNDS list (authoritative reporting currency).
                const fundMeta = FUNDS.find(f => f.uuid === fundUuid);
                currentCurrency = fundMeta ? fundMeta.currency : null;
            }

            const cacheKey = `${fundUuid}::${currentAsOfDate || 'current'}`;

            // Cache hit → render immediately (underlying holdings were already
            // prefetched and cached the first time this fund/as-of pair was loaded).
            if (fundCache.has(cacheKey)) {
                companies = fundCache.get(cacheKey);
                expandedUnderlying = defaultExpandedUnderlying(companies);
                if (companies.length === 0) { renderEmptyFund(); return; }
                renderMetrics();
                render();
                showContent();
                return;
            }

            // Cache miss → shimmer + fetch.
            showLoading();
            try {
                let transformed;
                const scopeFundUuids = isPooled ? pooled.map(f => f.uuid) : [fundUuid];
                if (isPooled) {
                    const fundMetaByUuid = {};
                    pooled.forEach(f => { fundMetaByUuid[f.uuid] = { name: f.name, currency: f.currency }; });
                    const investments = await fetchAllPages((offset, limit) =>
                        buildSoiSqlAllFunds(scopeFundUuids, offset, limit, currentAsOfDate));
                    transformed = transformData(investments, fundMetaByUuid);
                } else {
                    const investments = await fetchAllPages((offset, limit) => buildSoiSql(fundUuid, offset, limit, currentAsOfDate));
                    transformed = transformData(investments, null, fundUuid);
                }

                // Automatically calculate look-through holdings for every
                // FUND_INVESTMENT position in one bulk query, instead of waiting for
                // the user to expand each one — see buildUnderlyingBulkSql.
                setLoadingStatus('Calculating underlying (look-through) holdings…');
                await prefetchUnderlyingHoldings(transformed, scopeFundUuids, currentAsOfDate);

                fundCache.set(cacheKey, transformed);
                companies = transformed;
                expandedUnderlying = defaultExpandedUnderlying(companies);
                if (companies.length === 0) { renderEmptyFund(); return; }
                renderMetrics();
                render();
                showContent();
            } catch (error) {
                showError(error && error.userFacing ? error.message : 'Error loading SOI: ' + error.message);
            }
        }

        // Every FUND_INVESTMENT position starts expanded — its underlying holdings
        // are already computed by the time the table renders, so there's nothing to
        // wait for. Keyed by `${companyIdx}-${assetIdx}`, matching toggleUnderlying.
        function defaultExpandedUnderlying(companiesList) {
            const keys = new Set();
            companiesList.forEach((c, ci) => {
                c.assets.forEach((a, ai) => {
                    if (a.isFundInvestment) keys.add(`${ci}-${ai}`);
                });
            });
            return keys;
        }

        // One bulk query for every FUND_INVESTMENT position across the funds in
        // scope, grouped client-side by (fund_uuid, parent_issuer_name) and written
        // straight into underlyingCache. Positions with no look-through rows get an
        // explicit [] (not left undefined) so they render "no data" instead of a
        // perpetual loading state; positions the query never reached because it threw
        // get an explicit Error so they render a retryable failure instead.
        async function prefetchUnderlyingHoldings(companiesList, fundUuids, asOfDate) {
            const targets = [];
            companiesList.forEach(c => {
                c.assets.forEach(a => {
                    if (a.isFundInvestment) targets.push({ fundUuid: a.fundUuid, parentIssuerName: c.name });
                });
            });
            if (targets.length === 0) return;

            try {
                const rows = await fetchAllPages((offset, limit) =>
                    buildUnderlyingBulkSql(fundUuids, offset, limit, asOfDate));
                const grouped = new Map();
                rows.forEach(r => {
                    const key = `${r.fund_uuid}::${r.parent_issuer_name}::${asOfDate || 'current'}`;
                    if (!grouped.has(key)) grouped.set(key, []);
                    grouped.get(key).push(r);
                });
                targets.forEach(t => {
                    const key = `${t.fundUuid}::${t.parentIssuerName}::${asOfDate || 'current'}`;
                    if (!underlyingCache.has(key)) underlyingCache.set(key, grouped.get(key) || []);
                });
            } catch (err) {
                const asError = err instanceof Error ? err : new Error(String(err));
                targets.forEach(t => {
                    const key = `${t.fundUuid}::${t.parentIssuerName}::${asOfDate || 'current'}`;
                    if (!underlyingCache.has(key)) underlyingCache.set(key, asError);
                });
            }
        }

        function switchFund(fundUuid) {
            if (fundUuid === currentFundUuid) return;
            // Reset transient view state when changing data sources; filter/sort/expand
            // are properties of "this view of this fund", not global preferences.
            filterText = '';
            sortCol = null;
            sortDir = 'asc';
            allExpanded = false;
            expandedUnderlying = new Set();
            clearTimeout(globalSearchDebounce);
            globalSearchTerm = '';
            globalSearchResults = null;
            globalSearchError = null;
            globalSearchLoading = false;
            loadFund(fundUuid);
        }

        async function bootstrap() {
            if (!INITIAL_FUND_UUID) {
                showError('No initial fund UUID provided. The skill must inject an initial fund when creating the artifact.');
                return;
            }
            if (!FIRM_UUID) {
                showError('No firm UUID provided. The skill must inject a firm_uuid when creating the artifact.');
                return;
            }
            if (!CARTA_MCP_SERVER) {
                showError('No Carta connector name provided. The skill must inject the connector display name when publishing the artifact.');
                return;
            }
            if (!Array.isArray(FUNDS) || FUNDS.length === 0) {
                showError('No funds configured. The skill must inject at least one fund.');
                return;
            }

            populateFundSelect();

            // Pin firm context once for the artifact's lifetime — set_context is
            // firm-scoped and the artifact is firm-scoped, so we don't re-fire on
            // fund switches. If the MCP session has expired this is the first
            // place we'd notice; the wrapper handles the welcome-then-retry.
            try {
                const contextResult = await callMcpWithWelcomeRetry(SET_CONTEXT_TOOL, { firm_id: FIRM_UUID });
                if (contextResult && contextResult.isError) {
                    const msg = (contextResult.content && contextResult.content[0] && contextResult.content[0].text) || '<no message>';
                    throw new Error(msg);
                }
            } catch (error) {
                showError(error && error.userFacing ? error.message : 'Error pinning firm context: ' + error.message);
                return;
            }

            await loadFund(INITIAL_FUND_UUID);
        }

        // ── Init ──

        document.getElementById('searchIcon').innerHTML = inkIcon('search', 14);

        // Use capture-phase delegation on document — the .table-scroll element gets
        // rebuilt when we show the shimmer between fund switches, so binding directly
        // to it would leak listeners across switches and miss events on the new node.
        // Scroll events don't bubble; capture phase reaches them.
        document.addEventListener('scroll', e => {
            const scroller = e.target.closest && e.target.closest('.table-scroll');
            if (scroller) scroller.classList.toggle('scrolled', scroller.scrollLeft > 0);
        }, true);

        // Delegate the search-box 'input' listener too, for the same DOM-rebuild
        // reason. Also more robust against any Cowork-side rewriting of inline
        // event-handler attributes between artifact updates — we don't depend on
        // `oninput=` surviving the round-trip.
        document.addEventListener('input', e => {
            if (e.target && e.target.id === 'searchInput') {
                filterCompanies(e.target.value);
            }
        });

        // Tooltip (body-appended popup, no layout impact)
        const tip = document.createElement('div');
        tip.className = 'tooltip-popup';
        document.body.appendChild(tip);

        document.addEventListener('mouseover', e => {
            const trigger = e.target.closest('.tooltip-trigger');
            if (!trigger) return;
            tip.textContent = trigger.dataset.tooltip;
            tip.classList.add('visible');
            const rect = trigger.getBoundingClientRect();
            const tipW = tip.offsetWidth;
            const tipH = tip.offsetHeight;
            // Position above the trigger; flip horizontally to stay in viewport.
            let left = rect.left;
            if (left + tipW > window.innerWidth - 8) left = rect.right - tipW;
            if (left < 8) left = 8;
            tip.style.left = left + 'px';
            tip.style.top = rect.top - tipH - 6 + 'px';
        });

        document.addEventListener('mouseout', e => {
            if (e.target.closest('.tooltip-trigger')) tip.classList.remove('visible');
        });

        // The shimmer in #loadingState covers the table during the fetch, so
        // the table head doesn't need to render until data arrives. render()
        // calls renderHead() itself once data is in.
        bootstrap();
    </script>
</body>
</html>
