<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule of Investments</title>
    <!-- SangBleu Versailles is Carta's brand serif but isn't licensed for distribution
         outside Carta's environments, so it's referenced as the first font-family
         option for staff-machine fidelity and falls back to EB Garamond / Georgia
         everywhere else. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light dark;
            --surface-bg: light-dark(#FFFFFF, rgb(18 18 18));
            --surface-underlay: light-dark(#F1F1F1, #2D2D2D);
            --surface-info-subtle: light-dark(#EAF0F8, #122948);
            /* Sand (Ink's "brown" scale, steps 10/20/30/40) for the asset/underlying
               row backgrounds specifically — not a site-wide swap of
               --surface-underlay, which stays the cooler gray everywhere else
               (hover states, shimmer, tile backgrounds, and now asset-row's own
               hover too — every level's hover reads as the same neutral gray,
               only the resting backgrounds carry the sand distinction). Light
               mode only: a saturated brown reads as loud against this page's
               otherwise near-monochrome dark theme, so dark mode falls back to
               the same restrained neutral grays (gray-90/100) used elsewhere
               on the page rather than a dark variant of the brown scale. */
            --surface-sand: light-dark(#FBFAF9, #2D2D2D);
            --surface-sand-deep: light-dark(#F8F8F7, #202020);
            --text-default: light-dark(#1A1A1A, #EDEDED);
            --text-subtle: light-dark(#656B6B, #A7AAAA);
            --border-default: light-dark(#A7AAAA, #656B6B);
            --border-subtle: light-dark(#DEDFDF, #2D2D2D);
            --border-focus-default: light-dark(#285DA3, #8BABD6);
            --border-focus-light: light-dark(#C0D1E9, #1A3E6D);
            --negative-strong: light-dark(#E52431, #FAD9D7);
            --positive-strong: light-dark(#2D9E90, #2D9E90);
            --link-default: light-dark(#285DA3, #8BABD6);
            --link-hover: light-dark(#1A3E6D, #4176BC);
            /* Ink feedback-info-strong. Close to --link-default in light mode but a
               different value in dark, so the Bubble can't just borrow the link color. */
            --feedback-info-strong: light-dark(#285DA3, #2C67B5);
            --surface-lightgray-hover: light-dark(#DEDFDF, #2D2D2D);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Fallback for any borderless focusable element (links, native buttons) —
           bordered controls get their own border-recolor + ring above instead. */
        :focus-visible {
            outline: 2px solid var(--border-focus-default);
            box-shadow: 0 0 0 4px var(--border-focus-light);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--surface-bg);
            color: var(--text-default);
            padding: 48px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ── Header ── */
        .header {
            margin-bottom: 24px;
        }

        .carta-logo {
            display: block;
            width: 64px;
            height: 32px;
            margin-bottom: 24px;
            color: var(--text-default);
        }

        .header-eyebrow {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-subtle);
            letter-spacing: 0.02em;
            margin-bottom: 2px;
        }

        .header h1 {
            font-family: "SangBleu Versailles", 'EB Garamond', Georgia, "Times New Roman", serif;
            font-size: 28px;
            font-weight: 400;
            line-height: 48px;
            color: var(--text-default);
        }

        /* ── Shimmer loading state ── */
        @keyframes shimmer {
            0% { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }

        .shimmer-bone {
            background: linear-gradient(90deg, var(--surface-underlay) 25%, var(--border-default) 50%, var(--surface-underlay) 75%);
            background-size: 800px 100%;
            animation: shimmer 1.5s infinite ease-in-out;
            border-radius: 4px;
        }

        .shimmer-metrics {
            display: flex;
            border-left: 4px solid var(--border-subtle);
            background: var(--surface-underlay);
            padding: 14px 16px;
            margin-bottom: 24px;
            gap: 16px;
        }

        .shimmer-metric-item { flex: 1; }
        .shimmer-metric-label { height: 14px; width: 70px; margin-bottom: 8px; }
        .shimmer-metric-value { height: 22px; width: 110px; }

        .shimmer-toolbar { height: 32px; width: 220px; margin-bottom: 12px; }

        .shimmer-table { width: 100%; }
        .shimmer-table-header {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 4px;
        }
        .shimmer-th { height: 14px; flex: 1; }
        .shimmer-th:first-child { flex: 2; }

        .shimmer-row {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--surface-underlay);
        }
        .shimmer-td { height: 14px; flex: 1; }
        .shimmer-td:first-child { flex: 2; }

        .content-area { opacity: 0; transition: opacity 0.3s ease; }
        .content-area.loaded { opacity: 1; }

        /* ── Metrics strip ── */
        /* CSS grid, not flex-wrap — a wrapping row can strand the last tile
           alone on its own line at in-between widths. Three fixed tiers, no
           free-wrap state between them: 2x2 by default (the realistic width
           for an artifact panel is too narrow for four full dollar amounts
           side by side — 4-up truncates), 4-across once there's genuinely
           room (900px+), and the existing single-column mobile stack below
           640px, unchanged. */
        .metrics-strip {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 16px;
            row-gap: 12px;
            border: 1px solid var(--border-subtle);
            background: var(--surface-bg);
            padding: 14px 16px;
            margin-bottom: 24px;
        }

        .metric-item { min-width: 0; }

        /* Each tier owns its dividers inside its own width range. Putting any of
           them in the base layer instead would leak: a media query adds no
           specificity, so a base `:nth-child()` rule outranks a plain
           `.metric-item` override inside one and the wrong dividers survive. */

        /* 2x2: divider down the middle, divider between the two rows. */
        @media (min-width: 641px) and (max-width: 899px) {
            .metric-item {
                border-right: 1px solid var(--border-subtle);
                padding-right: 16px;
            }
            .metric-item:nth-child(2n) {
                border-right: none;
                padding-right: 0;
            }
            .metric-item:nth-child(-n+2) {
                border-bottom: 1px solid var(--border-subtle);
                padding-bottom: 12px;
            }
        }

        /* 4-across: one row, so vertical dividers only. */
        @media (min-width: 900px) {
            .metrics-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .metric-item {
                border-right: 1px solid var(--border-subtle);
                padding-right: 16px;
            }
            .metric-item:last-child {
                border-right: none;
                padding-right: 0;
            }
        }

        /* Stacked: one column, so horizontal dividers only. */
        @media (max-width: 640px) {
            .metrics-strip { grid-template-columns: 1fr; }
            .metric-item {
                border-bottom: 1px solid var(--border-subtle);
                padding-bottom: 12px;
            }
            .metric-item:last-child {
                border-bottom: none;
                padding-bottom: 0;
            }
        }

        .metric-label {
            font-size: 13px;
            color: var(--text-subtle);
            margin-bottom: 4px;
            font-weight: 500;
            line-height: 20px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .metric-value {
            font-size: 20px;
            font-weight: 500;
            line-height: 28px;
            color: var(--text-default);
            font-variant-numeric: tabular-nums;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ── Fund switcher ──
           The two controls read as one grouped object: the container owns the
           border, each segment is divided by a hairline. It wraps rather than
           overflows, which is the narrow-sidebar case. */
        /* The picker and its reset share a row; the reset sits outside the bordered
           unit so its scope reads as the whole toolbar rather than either segment.
           It wraps below the picker when there isn't room. */
        .switcher-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .fund-switcher {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: stretch;
            width: fit-content;
            max-width: 100%;
            background-color: var(--surface-bg);
            border: 1px solid var(--border-subtle);
        }

        /* Ink ghost button — transparent at rest, light gray on hover. Ink's own
           GlobalFilter pairs a ghost Reset with a primary Apply, the same pairing
           as this panel's footer. Deliberately not a blue link: Clear all in the
           panel is the link, and two blue controls with different scopes would
           read as one control shown twice. */
        .ink-btn--ghost {
            height: 32px;
            padding: 0 12px;
            border: 1px solid transparent;
            border-radius: 4px;
            background: transparent;
            color: var(--text-default);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            line-height: 18px;
            cursor: pointer;
            appearance: none;
        }

        .ink-btn--ghost:hover { background: var(--surface-lightgray-hover); }
        .ink-btn--ghost:focus-visible {
            outline: 0;
            border-color: var(--border-focus-default);
            box-shadow: 0 0 0 4px var(--border-focus-light);
        }
        .ink-btn--ghost[hidden] { display: none; }

        .switcher-segment {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            min-width: 0;
        }

        .switcher-segment + .switcher-segment {
            border-left: 1px solid var(--border-subtle);
        }

        /* Stacked, the segments are full-width rows: a left divider would double
           up against the container edge, so it becomes a top divider. The label
           min-width lines both values up on the same left edge. */
        @media (max-width: 640px) {
            .fund-switcher { width: 100%; }
            .switcher-segment { width: 100%; }
            /* Stacked below the switcher, the button's own left padding would hang
               its label 12px inside the switcher's border. Pull the box left so the
               text lines up with the edge above it and the hover fill stays centred. */
            .switcher-row .ink-btn--ghost { margin-left: -12px; }
            .switcher-segment + .switcher-segment {
                border-left: none;
                border-top: 1px solid var(--border-subtle);
            }
            .fund-switcher-label { min-width: 48px; }
            .switcher-segment { position: relative; }
        }

        /* `hidden` on a flex element needs an explicit override. */
        .switcher-segment[hidden] { display: none; }

        .fund-switcher-label {
            font-size: 13px;
            color: var(--text-subtle);
            font-weight: 500;
            white-space: nowrap;
        }

        /* ── Combobox ──
           A native <select> can't be searched, which stops scaling once a firm
           has dozens of funds. This is the minimum that replaces it: a trigger,
           a filterable listbox, and full keyboard support. */
        .combo {
            position: relative;
            display: inline-flex;
            min-width: 0;
        }

        .combo-trigger {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 260px;
            padding: 0;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-default);
            cursor: pointer;
            text-align: left;
        }

        .combo-trigger:focus-visible {
            outline: 2px solid var(--border-focus-default);
            outline-offset: 3px;
        }

        .combo-trigger-value {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Multi-select trigger. A slightly wider budget than the single-select one
           because it carries an overflow count as well as a name, but still one
           line that never wraps — Fund and As of read as a single unit, and a
           wrapping trigger would change the toolbar's height on every pick. */
        .combo-trigger--multi {
            max-width: 320px;
            white-space: nowrap;
        }

        /* Ink Bubble, count variant: 18px pill, info colors, tabular figures.
           The same treatment Ink's GlobalFilter uses for an applied-filter count.
           It never shrinks — the count is the only signal that the trigger's label
           isn't the whole selection, so it must not be what gets ellipsed away. */
        .bub {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 18px;
            min-width: 18px;
            padding: 0 6px;
            border: 1px solid var(--feedback-info-strong);
            border-radius: 999px;
            background: var(--surface-info-subtle);
            color: var(--feedback-info-strong);
            font-size: 12px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: 0.01em;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ── Ink Checkbox ──
           20px box at radius-subtle. The box stays white in both themes and the
           glyph is a dark stroke — Ink does not fill the box on check. */
        .ink-chk {
            position: relative;
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
        }

        .ink-chk > input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 20px;
            height: 20px;
            margin: 0;
        }

        .ink-chk > .ink-chk-box {
            width: 20px;
            height: 20px;
            border: 1px solid var(--border-default);
            border-radius: 4px;
            background: #FFFFFF;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.12s, box-shadow 0.12s;
        }

        .ink-chk > .ink-chk-box > svg {
            display: block;
            opacity: 0;
            color: #394040;
        }

        .combo-option:hover .ink-chk > .ink-chk-box { border-color: light-dark(#394040, #9C9F9F); }
        .ink-chk.is-checked > .ink-chk-box > .ink-chk-check,
        .ink-chk.is-mixed > .ink-chk-box > .ink-chk-dash { opacity: 1; }

        .ink-chk > input:focus-visible + .ink-chk-box {
            border-color: var(--border-focus-default);
            box-shadow: 0 0 0 4px var(--border-focus-light);
        }

        /* Ink's Dropdown.Trigger caret: 16px, inheriting the trigger's own color
           rather than a lighter gray — it reads as part of the label, not as a
           border. Ink rotates it only when a menu opens upward, so a downward
           panel leaves it alone. */
        .combo-chevron {
            width: 16px;
            height: 16px;
            margin-left: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: currentColor;
            flex-shrink: 0;
        }

        .combo-panel {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            z-index: 50;
            min-width: 320px;
            max-width: 380px;
            background: var(--surface-bg);
            border: 1px solid var(--border-subtle);
            /* Ink Dropdown surface: radius-subtle + elevation shadow-medium. */
            border-radius: 4px;
            box-shadow: 0 4px 20px 0 rgb(0 0 0 / 0.1);
            padding: 4px 0;
        }

        /* Right-anchored when the trigger sits near the viewport edge. */
        .combo-panel.align-right { left: auto; right: 0; }

        .combo-search-wrap { padding: 8px; border-bottom: 1px solid var(--border-subtle); }

        /* Ink Input: 40px tall, radius-subtle, and the interactive border weight —
           an input reads as clickable, a container border doesn't. */
        .combo-search {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1;
            color: var(--text-default);
            background: var(--surface-bg);
            border: 1px solid var(--border-default);
            border-radius: 4px;
            outline: none;
        }

        .combo-search:focus {
            border-color: var(--border-focus-default);
            box-shadow: 0 0 0 4px var(--border-focus-light);
        }

        .combo-list {
            max-height: 340px;
            overflow-y: auto;
            /* Reserve the scrollbar's width so it can't sit on top of the
               right-aligned vintage column. */
            scrollbar-gutter: stable;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* Ink menu item: 400 14px/24px with 8px 12px padding. The 8px gap is the
           checkbox's own label gap, so the box and label sit at Ink's spacing. */
        .combo-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            font-size: 14px;
            line-height: 24px;
            color: var(--text-default);
            cursor: pointer;
        }

        /* Reserves the tick column so labels align whether or not a row is selected. */
        .combo-check {
            width: 14px;
            flex-shrink: 0;
            color: var(--text-default);
            visibility: hidden;
            display: flex;
            align-items: center;
        }

        .combo-option[aria-selected="true"] .combo-check { visibility: visible; }
        .combo-option[aria-selected="true"] { font-weight: 600; }
        /* In the multi list the checkbox already carries the state, so bolding every
           ticked fund on top of it just makes a long selection look shouty. */
        .combo-list[aria-multiselectable="true"] .combo-option[aria-selected="true"] { font-weight: 400; }
        .combo-list[aria-multiselectable="true"] .combo-option.is-family > .combo-option-label { font-weight: 600; }

        /* Pointer hover and keyboard focus share one highlight, so arrowing
           through the list reads the same as moving the mouse. */
        .combo-option:hover,
        .combo-option.active { background: var(--surface-underlay); }

        .combo-option-label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .combo-option.is-family > .combo-option-label { font-weight: 600; }
        .combo-option.is-member > .combo-option-label { padding-left: 16px; }

        /* Firm-wide sits above the fund list rather than inside it, so it gets a
           rule under it — the one divider here that belongs to a component. */
        .combo-option.is-all {
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 2px;
            padding-bottom: 10px;
        }
        .combo-option.is-all > .combo-option-label { font-weight: 500; }

        .combo-meta {
            font-size: 12px;
            color: var(--text-subtle);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .combo-empty, .combo-footer {
            padding: 10px 12px;
            font-size: 12px;
            color: var(--text-subtle);
        }

        .combo-footer {
            border-top: 1px solid var(--border-subtle);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* Multi-select footer pairs the selection count with Clear all. */
        .combo-footer--split {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .combo-clear-all {
            border: 0;
            background: none;
            padding: 0;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: normal;
            text-transform: none;
            color: var(--link-default);
            cursor: pointer;
        }

        .combo-clear-all:hover { color: var(--link-hover); text-decoration: underline; }
        .combo-clear-all:focus-visible {
            outline: 2px solid var(--border-focus-default);
            outline-offset: 2px;
        }
        .combo-clear-all:disabled {
            color: var(--text-subtle);
            cursor: default;
            text-decoration: none;
            opacity: 0.6;
        }

        /* Ink Button, primary + small. Black in light mode, white in dark — the
           action color. Never blue; blue stays reserved for links and focus. */
        .ink-btn--primary {
            height: 32px;
            padding: 0 12px;
            border: 1px solid transparent;
            border-radius: 4px;
            background: light-dark(#1A1A1A, #FFFFFF);
            color: light-dark(#FFFFFF, #1A1A1A);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            cursor: pointer;
            appearance: none;
        }

        .ink-btn--primary:hover { background: light-dark(#202020, #CECFCF); }
        .ink-btn--primary:focus-visible {
            outline: 0;
            border-color: var(--border-focus-default);
            box-shadow: 0 0 0 4px var(--border-focus-light);
        }
        .ink-btn--primary:disabled {
            background: light-dark(#EDEDED, #394040);
            color: light-dark(#CECFCF, #656B6B);
            cursor: not-allowed;
        }

        /* Must follow the .combo rules above to win at equal specificity.
           Stacked, each segment spans the full width, so anchoring the panel to
           the segment keeps it on-screen — anchored to the trigger it is wider
           than its own offset from the edge and clips. */
        @media (max-width: 640px) {
            .combo { position: static; flex: 1; min-width: 0; }
            .combo-trigger { max-width: 100%; }
            .combo-panel,
            .combo-panel.align-right {
                left: 0;
                right: 0;
                min-width: 0;
                max-width: none;
            }
        }

        /* Hidden until FUNDS has > 1 entry — keeps the single-fund case visually clean. */
        .fund-switcher.hidden { display: none; }

        /* ── Toolbar ── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            color: var(--text-subtle);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .search-input {
            padding: 6px 10px 6px 30px;
            border: 1px solid var(--border-subtle);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            width: 220px;
            line-height: 20px;
            color: var(--text-default);
            transition: border-color 0.15s;
        }

        .search-input::placeholder { color: var(--text-subtle); }
        .search-input:focus {
            border-color: var(--border-focus-default);
            box-shadow: 0 0 0 4px var(--border-focus-light);
        }

        /* ── Table ── */
        .table-scroll-wrap {
            position: relative;
        }

        .table-scroll {
            overflow-x: auto;
        }

        /* Right-edge fade hinting there's more to see on horizontal scroll.
           Positioned on the non-scrolling wrapper (not .table-scroll itself)
           so it stays pinned to the viewport edge instead of scrolling away
           with the table content. */
        .table-scroll-wrap::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 32px;
            pointer-events: none;
            background: linear-gradient(to right, transparent, var(--surface-bg));
            opacity: 0;
            transition: opacity 0.15s;
        }

        .table-scroll-wrap.has-more-right::after {
            opacity: 1;
        }

        table {
            min-width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--surface-bg);
            padding: 8px 12px;
            text-align: left;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            color: var(--text-default);
            border-bottom: 1px solid var(--text-default);
            height: 40px;
            line-height: 20px;
            white-space: nowrap;
        }

        th.number { text-align: right; }

        th.sortable {
            cursor: pointer;
            user-select: none;
            transition: color 0.12s;
        }

        th.sortable:hover { color: var(--text-subtle); }
        th.sortable.dimmed { color: var(--text-subtle); }

        th.sortable .th-inner {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        th.sortable.number .th-inner {
            justify-content: flex-end;
        }

        .sort-indicator {
            display: inline-flex;
            color: var(--border-default);
            transition: color 0.12s;
        }

        th.sortable.active .sort-indicator { color: var(--text-default); }

        td {
            padding: 8px 12px;
            font-size: 13px;
            color: var(--text-default);
            line-height: 22px;
            height: 40px;
            vertical-align: middle;
            white-space: nowrap;
            border-bottom: 1px solid var(--border-subtle);
        }

        tbody tr:last-child:not(.totals-row) td { border-bottom: none; }

        /* ── Sticky first column ── */
        th:first-child,
        td:first-child {
            position: sticky;
            left: 0;
            z-index: 2;
            background: var(--surface-bg);
            padding-left: 8px;
            /* Investment is the densest column — full company names, partnership
               interests, and an inline source tag all share it. Give it real
               room so those stay on one line; the numeric columns are narrow
               and fixed-width, so the space comes cheaply. */
            min-width: 380px;
            max-width: 46%;
            white-space: normal;
            word-wrap: break-word;
        }

        th:first-child { z-index: 3; }

        th:first-child::after,
        td:first-child::after {
            content: '';
            position: absolute;
            top: 0;
            right: -6px;
            bottom: 0;
            width: 6px;
            pointer-events: none;
            box-shadow: inset 6px 0 6px -6px rgba(0,0,0,0.08);
            opacity: 0;
            transition: opacity 0.15s;
        }

        .table-scroll.scrolled th:first-child::after,
        .table-scroll.scrolled td:first-child::after {
            opacity: 1;
        }

        /* ── Company rows ── */
        tr.company-row {
            cursor: pointer;
            user-select: none;
        }

        tr.company-row:hover td,
        tr.company-row:hover td:first-child { background: var(--surface-underlay); }

        /* ── Asset rows ── */
        /* Two classes, not one: `.visible` flips display so the row occupies
           layout space; `.shown` (added a frame later) drives the opacity
           transition. Adding both at once would animate from the same paint,
           i.e. no animation — see setRowVisible() in the script below. */
        tr.asset-row { display: none; opacity: 0; transition: opacity 0.15s ease; }
        tr.asset-row.visible { display: table-row; }
        tr.asset-row.visible.shown { opacity: 1; }

        tr.asset-row td,
        tr.asset-row td:first-child { background: var(--surface-sand); }

        /* Each level's disclosure sits directly under its parent's label: one
           28px step (16px icon + 12px gap) per depth. An underlying row has no
           disclosure of its own, so its name takes that slot. */
        tr.asset-row td:first-child { padding-left: 36px; }

        tr.asset-row:hover td,
        tr.asset-row:hover td:first-child { background: var(--surface-underlay); }

        /* ── Ink icons ── */
        .ink-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .ink-icon svg { display: block; }

        /* ── Expand icon (row-level) ── */
        .expand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            color: var(--border-default);
            transition: color 0.15s;
            margin-right: 12px;
            flex-shrink: 0;
        }

        tr.company-row:hover .expand-icon { color: var(--text-subtle); }

        .company-cell {
            display: flex;
            align-items: center;
        }

        .company-name {
            font-weight: 600;
            color: var(--text-default);
        }

        /* ── Expand-all toggle (header) ── */
        .th-expand {
            display: inline-flex;
            align-items: center;
            margin-right: 6px;
        }

        .expand-all-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--border-default);
            cursor: pointer;
            transition: color 0.12s;
            flex-shrink: 0;
        }

        .expand-all-toggle:hover { color: var(--text-default); }

        /* ── Asset name ── */
        .asset-name {
            color: var(--text-default);
        }

        /* Name + its own secondary informational line (e.g. tranche count) —
           stacked vertically instead of crammed inline, so long names and
           their annotations each get full column width to wrap into. */
        .asset-name-stack {
            display: inline-flex;
            flex-direction: column;
        }

        .tranche-note {
            font-size: 11px;
            color: var(--text-subtle);
            margin-top: 2px;
        }

        /* ── Numeric cells ── */
        .number {
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        /* ── Gain / Loss ── */
        .gl-value {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-variant-numeric: tabular-nums;
        }

        .gl-value.gain { color: var(--positive-strong); }
        .gl-value.loss { color: var(--negative-strong); }

        .gl-arrow {
            font-size: 12px;
            line-height: 1;
        }

        /* ── Totals row ── */
        .totals-row td {
            border-top: none;
            border-bottom: none;
            font-weight: 500;
            height: 40px;
            background: var(--surface-info-subtle);
            vertical-align: middle;
        }

        .totals-row td:first-child {
            padding-left: 36px;
            background: var(--surface-info-subtle);
            color: var(--text-default);
            font-weight: 500;
        }

        /* ── Tooltip ── */
        .tooltip-trigger {
            text-decoration: underline;
            text-decoration-style: dotted;
            text-decoration-color: var(--border-default);
            text-underline-offset: 3px;
            cursor: default;
        }

        .tooltip-popup {
            position: fixed;
            background: var(--text-default);
            color: var(--surface-bg);
            font-size: 12px;
            font-weight: 400;
            line-height: 18px;
            padding: 6px 10px;
            border-radius: 4px;
            white-space: pre;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 100;
        }

        /* ── FX icon (foreign currency investment indicator) ── */
        .fx-icon {
            display: inline-flex;
            align-items: center;
            font-size: 14px;
            color: var(--text-default);
            cursor: default;
            margin-right: 5px;
            text-decoration: none !important;
            vertical-align: middle;
            line-height: 1;
        }

        .tooltip-popup.visible { opacity: 1; }

        /* ── Currency tags (All Entities view) ── */
        .currency-tag {
            font-size: 11px;
            color: var(--text-subtle);
            margin-left: 4px;
        }

        .mixed-badge { color: var(--text-subtle); }

        .mixed-line { color: var(--text-default); }
        .mixed-sep { color: var(--text-subtle); margin: 0 10px; }

        /* ── Empty / loading / error states ──
           One convention everywhere: neutral status is --text-subtle, errors are
           --negative-strong, and nothing is italic (Ink has no italic idiom).
           Retry controls are links, so they take the link color, not the error's. */
        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: var(--text-subtle);
        }

        .empty-state.error {
            color: var(--negative-strong);
        }

        /* ── Underlying (look-through) rows — one level deeper than asset rows ──
           Hidden by default like .asset-row; shown via the shared asset-group-N
           class so collapsing the parent company row hides these too. */
        tr.underlying-row { display: none; opacity: 0; transition: opacity 0.15s ease; }
        tr.underlying-row.visible { display: table-row; }
        tr.underlying-row.visible.shown { opacity: 1; }

        @media (prefers-reduced-motion: reduce) {
            tr.asset-row, tr.underlying-row { transition: none; }
        }
        tr.underlying-row td,
        tr.underlying-row td:first-child { background: var(--surface-sand-deep); }
        tr.underlying-row td:first-child { padding-left: 64px; }

        tr.underlying-row:hover td,
        tr.underlying-row:hover td:first-child { background: var(--surface-underlay); }

        .underlying-status {
            color: var(--text-subtle);
            text-align: left !important;
        }
        .underlying-status.error { color: var(--negative-strong); }

        /* An action, not part of the error — so it takes Ink's link color rather
           than inheriting the message's red. Matches Ink's <a> spec. */
        .retry-link {
            margin-left: 6px;
            padding: 0;
            border: none;
            background: none;
            font: inherit;
            color: var(--link-default);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 2px;
            cursor: pointer;
        }

        .retry-link:hover { color: var(--link-hover); }

        .retry-link:focus-visible {
            outline: 2px solid var(--border-focus-default);
            outline-offset: 2px;
        }

        .underlying-name { font-weight: 400; color: var(--text-default); }
        /* Scaled-down Ink Tag (base/neutral variant: gray-10 bg, text-default,
           radius-subtle) — Ink's own spec is a fixed 28px tall, oversized for
           this table's 40px dense rows, so the box is shrunk while keeping the
           same token-sourced colors and corner treatment. */
        .underlying-source {
            display: inline-flex;
            align-items: center;
            height: 20px;
            padding: 0 6px;
            margin-left: 8px;
            font-size: 11px;
            border-radius: 4px;
            background: var(--surface-underlay);
            color: var(--text-default);
        }

        .asset-name.expandable { cursor: pointer; }
        .underlying-toggle { cursor: pointer; }

        /* ── Global (cross-fund) search results panel ── */
        .global-search-panel {
            margin: -4px 0 12px 0;
            border: 1px solid var(--border-subtle);
            background: var(--surface-bg);
            max-height: 280px;
            overflow-y: auto;
        }
        .global-search-header {
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-subtle);
            background: var(--surface-underlay);
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
        }
        .global-search-status {
            padding: 12px;
            font-size: 13px;
            color: var(--text-subtle);
        }
        .global-search-status.error { color: var(--negative-strong); }
        .global-search-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 12px;
            font-size: 13px;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
        }
        .global-search-row:last-child { border-bottom: none; }
        .global-search-row:hover { background: var(--surface-underlay); }
        .gsr-main { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .gsr-company { font-weight: 500; color: var(--text-default); }
        .gsr-via { font-size: 12px; color: var(--text-subtle); }
        .gsr-fund { font-size: 12px; color: var(--text-subtle); white-space: nowrap; }
        .gsr-value { font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
    </style>
</head>
<body>
    <script type="application/json" id="soi-funds-state">{{FUNDS_JSON}}</script>
    <div class="container">

    <script>
        // === Skill-injected constants (string-replaced at artifact-create time) ===
        // STATE: parsed once from the embedded <script id="soi-funds-state"> block
        //   above. Holds {firm_uuid, firm_name, funds: [{uuid, name}, ...]}. The
        //   funds list is the dropdown's data and also the persistence layer —
        //   when the Python render script re-runs, it extracts this exact block
        //   from the prior HTML to recover state.
        // INITIAL_FUND_UUID: the fund whose SOI to show on first load (last-requested).
        // FIRM_UUID: the firm that owns the funds. The artifact pins the user's MCP
        //   firm context to this on load (via set_context), so the dwh query
        //   succeeds even if the user has switched contexts elsewhere.
        // CARTA_MCP_SERVER: the Carta connector's DISPLAY NAME. The artifact runtime's
        //   mcp capability addresses a connector by display name only — never a UUID and
        //   never an mcp__…__ tool name — because a published page runs for many viewers
        //   and connector ids are per-viewer facts. The skill resolves it at publish time.
        const STATE = JSON.parse(document.getElementById('soi-funds-state').textContent);
        const FUNDS = STATE.funds;
        const INITIAL_FUND_UUID = '{{INITIAL_FUND_UUID}}';
        const FIRM_UUID = '{{FIRM_UUID}}';
        const CARTA_MCP_SERVER = '{{CARTA_MCP_SERVER}}';
        // welcome initializes the user's MCP session (identity, accounts, product
        // access). The server requires it once per session; when the session expires
        // (typically after a few days of inactivity), later calls fail asking us to
        // call welcome. callMcpWithWelcomeRetry below catches that and recovers.
        const CALL_TOOL = 'call_tool';
        const SET_CONTEXT_TOOL = 'set_context';
        const WELCOME_TOOL = 'welcome';

        // SOI query — actively held positions only, ordered for stable pagination.
        // The dwh__execute__query response has a payload size limit (large funds were
        // getting silently truncated mid-result), so we page through with OFFSET and
        // accumulate.
        //
        // ORDER BY note: OFFSET pagination requires a deterministic sort. issuer_name +
        // asset_name *should* be unique per row in AGGREGATE_INVESTMENTS, but if a fund
        // holds multiple tranches in the same issuer + asset_class, ties could shuffle
        // rows across page boundaries. If that bites, add a stable tiebreaker (e.g.
        // an investment uuid) to the ORDER BY.
        const PAGE_SIZE = 200;
        const MAX_PAGES = 50;  // hard cap (10K rows) to prevent runaway loops

        // asOfDate is a 'YYYY-MM-DD' quarter-end string, or null/undefined for the
        // live/current position. Live reads AGGREGATE_INVESTMENTS (is_active_investment
        // scoped); a historical as-of reads the point-in-time AGGREGATE_INVESTMENTS_HISTORY
        // table instead, per the standard "state effective over [effective_date,
        // next_effective_date)" pattern. That table has no investment_date,
        // remaining_value_per_share, or base-currency columns, so those come back NULL
        // for historical snapshots (acquisition date blank; per-share values recomputed
        // client-side in transformData; FX badge simply doesn't appear).
        function buildSoiSql(fundUuid, offset, limit, asOfDate) {
            if (!asOfDate) {
                return `SELECT
                    ISSUER_NAME                        AS issuer_name,
                    ASSET_NAME                         AS asset_name,
                    ASSET_CLASS_TYPE                   AS asset_class_type,
                    INVESTMENT_DATE                    AS acquisition_date,
                    COUNT_REMAINING_SHARES             AS count_remaining_shares,
                    TOTAL_COST_BASIS                   AS cost_basis,
                    REMAINING_VALUE                    AS fmv,
                    TOTAL_UNREALIZED_GAIN_LOSS         AS unrealized_gain_loss,
                    REMAINING_VALUE_PER_SHARE          AS remaining_value_per_share,
                    LATEST_FMV_EFFECTIVE_DATE          AS latest_fmv_effective_date,
                    BASE_CURRENCY_CODE                 AS base_currency_code,
                    BASE_CURRENCY_COST                 AS base_currency_cost,
                    BASE_CURRENCY_REMAINING_VALUE      AS base_currency_remaining_value,
                    BASE_CURRENCY_UNREALIZED_GAIN_LOSS AS base_currency_unrealized_gain_loss
                FROM FUND_ADMIN.AGGREGATE_INVESTMENTS
                WHERE FUND_UUID = '${fundUuid}'
                  AND IS_ACTIVE_INVESTMENT = TRUE
                ORDER BY issuer_name, asset_name
                LIMIT ${limit} OFFSET ${offset}`;
            }
            return `SELECT
                ISSUER_NAME                AS issuer_name,
                ASSET_NAME                 AS asset_name,
                ASSET_CLASS_TYPE           AS asset_class_type,
                NULL                       AS acquisition_date,
                COUNT_REMAINING_SHARES     AS count_remaining_shares,
                TOTAL_COST_BASIS           AS cost_basis,
                REMAINING_VALUE            AS fmv,
                TOTAL_UNREALIZED_GAIN_LOSS AS unrealized_gain_loss,
                NULL                       AS remaining_value_per_share,
                effective_date             AS latest_fmv_effective_date,
                NULL                       AS base_currency_code,
                NULL                       AS base_currency_cost,
                NULL                       AS base_currency_remaining_value,
                NULL                       AS base_currency_unrealized_gain_loss
            FROM FUND_ADMIN.AGGREGATE_INVESTMENTS_HISTORY
            WHERE FUND_UUID = '${fundUuid}'
              AND effective_date <= '${asOfDate}'
              AND (next_effective_date IS NULL OR next_effective_date > '${asOfDate}')
            ORDER BY issuer_name, asset_name
            LIMIT ${limit} OFFSET ${offset}`;
        }

        // Look-through drill-down — one fund-of-funds parent issuer's underlying
        // holdings, prorated by the firm's ownership fraction in the underlying fund.
        // FUND_UUID (not FUND_NAME) scopes the parent side: several firms have entities
        // that share a display name across distinct records, so name-based scoping
        // would silently blend them.
        function escSqlLiteral(str) {
            return String(str).replace(/'/g, "''");
        }

        // LIKE-pattern escape. escSqlLiteral alone only neutralizes quotes, so a
        // search term containing % or _ reaches LIKE as a wildcard — a lone "%"
        // renders '%%' and returns the firm's entire underlying-holdings catalog
        // unfiltered. Backslashes are doubled because the escape passes two
        // parsers: the SQL string literal, then LIKE's own ESCAPE handling.
        function escSqlLikePattern(str) {
            // Neutralize the wildcards for LIKE, then double every backslash so the
            // escape survives the SQL string literal ahead of it.
            const pattern = String(str).replace(/[\\%_]/g, '\\$&');
            return escSqlLiteral(pattern.replace(/\\/g, '\\\\'));
        }

        // asOfDate branches CARTA_INVESTORS' current-state table to its point-in-time
        // history table — same effective_date/next_effective_date pattern as the SOI
        // query above. Default sort is REMAINING_VALUE DESC (highest look-through
        // value first) per (fund, parent issuer) group, per default-sort requirement.
        function buildUnderlyingSql(fundUuid, parentIssuerName, asOfDate) {
            const table = asOfDate ? 'UNDERLYING_INVESTMENTS_HISTORY' : 'UNDERLYING_INVESTMENTS';
            const dateFilter = asOfDate
                ? ` AND EFFECTIVE_DATE <= '${asOfDate}' AND (NEXT_EFFECTIVE_DATE IS NULL OR NEXT_EFFECTIVE_DATE > '${asOfDate}')`
                : '';
            return `SELECT
                FUND_UUID                    AS fund_uuid,
                FUND_NAME                    AS fund_name,
                PARENT_ISSUER_NAME           AS parent_issuer_name,
                UNDERLYING_FUND_NAME         AS underlying_fund_name,
                UNDERLYING_ISSUER_NAME       AS underlying_issuer_name,
                ASSET_NAME                   AS asset_name,
                SOURCE                       AS source,
                OWNERSHIP_FRACTION           AS ownership_fraction,
                IS_PRORATED                  AS is_prorated,
                TOTAL_COST_BASIS             AS cost_basis,
                REMAINING_VALUE              AS fmv,
                TOTAL_UNREALIZED_GAIN_LOSS   AS unrealized_gain_loss,
                COUNT_REMAINING_SHARES       AS count_remaining_shares,
                REMAINING_VALUE_PER_SHARE    AS remaining_value_per_share,
                CURRENCY_CODE                AS currency_code
            FROM FUND_ADMIN.${table}
            WHERE FUND_UUID = '${escSqlLiteral(fundUuid)}'
              AND PARENT_ISSUER_NAME = '${escSqlLiteral(parentIssuerName)}'${dateFilter}
            ORDER BY remaining_value DESC NULLS LAST, underlying_issuer_name
            LIMIT 500`;
        }

        // Bulk look-through fetch — every underlying holding across a set of parent
        // funds in one paginated query, grouped client-side by (fund_uuid,
        // parent_issuer_name). This is what powers automatic drill-down: rather than
        // waiting for the user to expand each fund-of-funds position one at a time,
        // loadFund() calls this once per fund load and every position's underlying
        // holdings are ready before the table renders.
        function buildUnderlyingBulkSql(fundUuids, offset, limit, asOfDate) {
            const table = asOfDate ? 'UNDERLYING_INVESTMENTS_HISTORY' : 'UNDERLYING_INVESTMENTS';
            const dateFilter = asOfDate
                ? ` AND EFFECTIVE_DATE <= '${asOfDate}' AND (NEXT_EFFECTIVE_DATE IS NULL OR NEXT_EFFECTIVE_DATE > '${asOfDate}')`
                : '';
            const uuidList = fundUuids.map(u => `'${escSqlLiteral(u)}'`).join(', ');
            return `SELECT
                FUND_UUID                    AS fund_uuid,
                FUND_NAME                    AS fund_name,
                PARENT_ISSUER_NAME           AS parent_issuer_name,
                UNDERLYING_FUND_NAME         AS underlying_fund_name,
                UNDERLYING_ISSUER_NAME       AS underlying_issuer_name,
                ASSET_NAME                   AS asset_name,
                SOURCE                       AS source,
                OWNERSHIP_FRACTION           AS ownership_fraction,
                IS_PRORATED                  AS is_prorated,
                TOTAL_COST_BASIS             AS cost_basis,
                REMAINING_VALUE              AS fmv,
                TOTAL_UNREALIZED_GAIN_LOSS   AS unrealized_gain_loss,
                COUNT_REMAINING_SHARES       AS count_remaining_shares,
                REMAINING_VALUE_PER_SHARE    AS remaining_value_per_share,
                CURRENCY_CODE                AS currency_code
            FROM FUND_ADMIN.${table}
            WHERE FUND_UUID IN (${uuidList})${dateFilter}
            ORDER BY fund_uuid, parent_issuer_name, remaining_value DESC NULLS LAST
            LIMIT ${limit} OFFSET ${offset}`;
        }

        // Cross-fund search — every look-through holding across every one of the firm's funds
        // (row access is already firm-scoped by the set_context call in bootstrap(),
        // so no explicit fund list is needed here) whose underlying company name
        // matches the search term. Powers "type a portfolio company, see every
        // vehicle in the firm that holds it via a fund-of-funds position."
        function buildGlobalUnderlyingSearchSql(term, limit, asOfDate) {
            const table = asOfDate ? 'UNDERLYING_INVESTMENTS_HISTORY' : 'UNDERLYING_INVESTMENTS';
            const dateFilter = asOfDate
                ? ` AND EFFECTIVE_DATE <= '${asOfDate}' AND (NEXT_EFFECTIVE_DATE IS NULL OR NEXT_EFFECTIVE_DATE > '${asOfDate}')`
                : '';
            return `SELECT
                FUND_UUID                    AS fund_uuid,
                FUND_NAME                    AS fund_name,
                PARENT_ISSUER_NAME           AS parent_issuer_name,
                UNDERLYING_FUND_NAME         AS underlying_fund_name,
                UNDERLYING_ISSUER_NAME       AS underlying_issuer_name,
                TOTAL_COST_BASIS             AS cost_basis,
                REMAINING_VALUE              AS fmv,
                TOTAL_UNREALIZED_GAIN_LOSS   AS unrealized_gain_loss,
                CURRENCY_CODE                AS currency_code
            FROM FUND_ADMIN.${table}
            WHERE LOWER(UNDERLYING_ISSUER_NAME) LIKE '%${escSqlLikePattern(term.toLowerCase())}%' ESCAPE '\\\\'${dateFilter}
            ORDER BY fund_name, parent_issuer_name, remaining_value DESC NULLS LAST
            LIMIT ${limit}`;
        }

        // All-Entities rollup — same shape as buildSoiSql plus FUND_UUID so the
        // transform can tag each row back to its originating fund (name + reporting
        // currency), since a firm's funds aren't guaranteed to share one currency.
        // Uses an explicit IN-list of the firm's own fund UUIDs (already known from
        // FUNDS) rather than a FIRM_UUID column, so it needs no schema assumption
        // beyond what buildSoiSql already relies on.
        function buildSoiSqlAllFunds(fundUuids, offset, limit, asOfDate) {
            const uuidList = fundUuids.map(u => `'${escSqlLiteral(u)}'`).join(', ');
            if (!asOfDate) {
                return `SELECT
                    FUND_UUID                          AS fund_uuid,
                    ISSUER_NAME                        AS issuer_name,
                    ASSET_NAME                          AS asset_name,
                    ASSET_CLASS_TYPE                   AS asset_class_type,
                    INVESTMENT_DATE                    AS acquisition_date,
                    COUNT_REMAINING_SHARES             AS count_remaining_shares,
                    TOTAL_COST_BASIS                   AS cost_basis,
                    REMAINING_VALUE                    AS fmv,
                    TOTAL_UNREALIZED_GAIN_LOSS         AS unrealized_gain_loss,
                    REMAINING_VALUE_PER_SHARE          AS remaining_value_per_share,
                    LATEST_FMV_EFFECTIVE_DATE          AS latest_fmv_effective_date,
                    BASE_CURRENCY_CODE                 AS base_currency_code,
                    BASE_CURRENCY_COST                 AS base_currency_cost,
                    BASE_CURRENCY_REMAINING_VALUE      AS base_currency_remaining_value,
                    BASE_CURRENCY_UNREALIZED_GAIN_LOSS AS base_currency_unrealized_gain_loss
                FROM FUND_ADMIN.AGGREGATE_INVESTMENTS
                WHERE FUND_UUID IN (${uuidList})
                  AND IS_ACTIVE_INVESTMENT = TRUE
                ORDER BY issuer_name, asset_name
                LIMIT ${limit} OFFSET ${offset}`;
            }
            return `SELECT
                FUND_UUID                  AS fund_uuid,
                ISSUER_NAME                AS issuer_name,
                ASSET_NAME                 AS asset_name,
                ASSET_CLASS_TYPE           AS asset_class_type,
                NULL                       AS acquisition_date,
                COUNT_REMAINING_SHARES     AS count_remaining_shares,
                TOTAL_COST_BASIS           AS cost_basis,
                REMAINING_VALUE            AS fmv,
                TOTAL_UNREALIZED_GAIN_LOSS AS unrealized_gain_loss,
                NULL                       AS remaining_value_per_share,
                effective_date             AS latest_fmv_effective_date,
                NULL                       AS base_currency_code,
                NULL                       AS base_currency_cost,
                NULL                       AS base_currency_remaining_value,
                NULL                       AS base_currency_unrealized_gain_loss
            FROM FUND_ADMIN.AGGREGATE_INVESTMENTS_HISTORY
            WHERE FUND_UUID IN (${uuidList})
              AND effective_date <= '${asOfDate}'
              AND (next_effective_date IS NULL OR next_effective_date > '${asOfDate}')
            ORDER BY issuer_name, asset_name
            LIMIT ${limit} OFFSET ${offset}`;
        }

        // === Markdown-table parser ===
        // Carta dwh__execute__query returns the result as a markdown table string inside
        // content[0].text. These four helpers unwrap, parse, and type-coerce per cell.
        // Mirror of /sessions/.../carta-investors/soi-parser.js (40/40 tests passing).

        function parseDwhQueryResult(result) {
            const text = unwrapResponse(result);
            return parseMarkdownTable(text);
        }

        function unwrapResponse(result) {
            if (typeof result === 'string') return result;
            if (!result || typeof result !== 'object') {
                throw new Error('Unexpected response shape: ' + (typeof result));
            }
            if (result.isError) {
                const msg = (result.content && result.content[0] && result.content[0].text) || '<no message>';
                throw new Error('dwh query failed: ' + msg);
            }
            if (result.content && Array.isArray(result.content) && result.content[0] && typeof result.content[0].text === 'string') {
                return result.content[0].text;
            }
            if (result.structuredContent && typeof result.structuredContent.result === 'string') {
                return result.structuredContent.result;
            }
            throw new Error('Could not find text payload in response');
        }

        function parseMarkdownTable(text) {
            if (!text || typeof text !== 'string') return [];
            const lines = text.split(/\r?\n/).map(l => l.trimEnd()).filter(l => l.length > 0);
            if (lines.length === 0) return [];

            // The dwh response now prefixes the markdown table with a metadata line:
            //   total_rows: 11 | offset: 0 | limit: 1000 | format: markdown
            // Skip it so we don't mistake those four "columns" for headers and then
            // silently drop every data row on column-count mismatch.
            const headerIdx = lines[0].startsWith('total_rows:') ? 1 : 0;
            if (headerIdx >= lines.length) return [];

            const headers = lines[headerIdx].split(' | ').map(h => h.trim().toLowerCase());
            let dataStart = headerIdx + 1;
            if (lines.length > dataStart && /^[\s\-|]+$/.test(lines[dataStart])) dataStart++;

            const rows = [];
            for (let i = dataStart; i < lines.length; i++) {
                const cells = lines[i].split(' | ').map(c => c.trim());
                if (cells.length !== headers.length) {
                    // Pipe-in-string is a known limitation; skip the bad row, log, continue.
                    console.warn('parseMarkdownTable: row ' + i + ' has ' + cells.length + ' cells, expected ' + headers.length + '. Skipping.');
                    continue;
                }
                const row = {};
                for (let j = 0; j < headers.length; j++) row[headers[j]] = coerceCell(cells[j]);
                rows.push(row);
            }
            return rows;
        }

        function coerceCell(raw) {
            if (raw === 'NULL') return null;
            if (raw === 'TRUE') return true;
            if (raw === 'FALSE') return false;
            if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
            if (/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(raw)) {
                const n = parseFloat(raw);
                if (Number.isFinite(n)) return n;
            }
            return raw;
        }

        // === Data transform ===
        // Map raw warehouse rows to the renderer's flat shape. Renderer/sort code
        // references field names directly (e.g. c.cost, a.cps), so the schema bridge
        // lives here in one place — when the visual prototype iterates, this transform
        // can stay put.
        //
        // Schema mapping (warehouse → renderer):
        //   issuer_name              → company.name
        //   cost_basis               → company.cost / asset.cost (summed at company level)
        //   fmv                      → company.value / asset.value (summed at company level)
        //   unrealized_gain_loss     → company.gl / asset.gl (summed at company level)
        //   latest_fmv_effective_date → company.lastDate / asset.lastDate (MMM DD, YYYY)
        //   asset_name               → asset.name
        //   acquisition_date         → asset.date (MMM DD, YYYY)
        //   count_remaining_shares   → asset.shares
        //   remaining_value_per_share → asset.vps
        //   cost_basis / shares      → asset.cps (computed; null when shares == 0)
        // fundMetaByUuid is only passed in All-Entities mode ({uuid: {name, currency}}).
        // It lets us tag every row with which fund it came from and in what currency —
        // a firm's funds are not guaranteed to share a reporting currency, so summing
        // raw cost/value across a company's positions is only valid when every
        // contributing row shares one currency. When it isn't, we still compute a sum
        // for internal bookkeeping but mark the company `mixedCurrency: true` so the
        // renderer shows a per-currency breakdown instead of a misleading single total.
        // Fold every FUND_INVESTMENT asset row for one company into a single combined
        // row (summed shares/cost/value/gain-loss; earliest acquisition date; latest
        // last-updated date). A fund-of-funds LP interest built up via an initial
        // commitment plus later capital calls otherwise shows as several separate
        // "Partnership Interest" lines under the same company, each pointing at the
        // exact same underlying look-through position — confusing, and it would
        // trigger the drill-down fetch redundantly. Non-FUND_INVESTMENT assets (direct
        // equity positions) pass through untouched.
        function mergeFundInvestmentAssets(assets) {
            const fundInvestments = assets.filter(a => a.isFundInvestment);
            if (fundInvestments.length <= 1) return assets;
            const others = assets.filter(a => !a.isFundInvestment);

            // Only merge tranches of the same parent fund (repeated capital calls
            // into one LP interest). Two of the firm's own funds can each hold an
            // LP interest in the same underlying fund — those must stay separate
            // rows, each with its own drill-down, not collapse into one that
            // silently drops the other fund's look-through data.
            const byFundUuid = new Map();
            fundInvestments.forEach(a => {
                const key = a.fundUuid;
                if (!byFundUuid.has(key)) byFundUuid.set(key, []);
                byFundUuid.get(key).push(a);
            });

            const mergedRows = Array.from(byFundUuid.values()).map(tranches => {
                const merged = {
                    name: tranches[0].name,
                    date: '',
                    lastDate: '',
                    shares: 0,
                    cost: 0,
                    value: 0,
                    gl: 0,
                    currency: tranches[0].currency,
                    fundName: tranches[0].fundName,
                    fundUuid: tranches[0].fundUuid,
                    assetClassType: 'FUND_INVESTMENT',
                    isFundInvestment: true,
                    tranches: tranches.length,
                    fxCode: null, fxCost: undefined, fxValue: undefined, fxGl: undefined,
                };
                tranches.forEach(a => {
                    merged.shares += a.shares || 0;
                    merged.cost += a.cost || 0;
                    merged.value += a.value || 0;
                    merged.gl += a.gl || 0;
                    if (a.date && (!merged.date || parseDate(a.date) < parseDate(merged.date))) merged.date = a.date;
                    if (a.lastDate && (!merged.lastDate || parseDate(a.lastDate) > parseDate(merged.lastDate))) merged.lastDate = a.lastDate;
                });
                merged.cps = merged.shares > 0 ? merged.cost / merged.shares : null;
                merged.vps = merged.shares > 0 ? merged.value / merged.shares : null;
                return merged;
            });

            return [...others, ...mergedRows];
        }

        function transformData(investments, fundMetaByUuid, singleFundUuid) {
            const byCompany = {};

            investments.forEach(inv => {
                // Coerce to string explicitly — coerceCell turns NULL into JS null,
                // and any cell whose text matches the number regex into a JS number.
                // If we kept those values as-is, downstream `.toLowerCase()` /
                // `.localeCompare()` calls would throw and silently break filter /
                // sort for the whole fund.
                const companyName = inv.issuer_name == null ? 'Unknown' : String(inv.issuer_name);
                const fundMeta = fundMetaByUuid && inv.fund_uuid != null ? fundMetaByUuid[inv.fund_uuid] : null;
                const rowCurrency = fundMeta ? fundMeta.currency : currentCurrency;

                if (!byCompany[companyName]) {
                    byCompany[companyName] = {
                        name: companyName,
                        cost: 0,
                        value: 0,
                        gl: 0,
                        date: '',
                        lastDate: '',
                        assets: [],
                        currencies: new Set(),
                        fundNames: new Set(),
                    };
                }
                const company = byCompany[companyName];
                company.cost  += inv.cost_basis || 0;
                company.value += inv.fmv || 0;
                company.gl    += inv.unrealized_gain_loss || 0;
                company.currencies.add(rowCurrency);
                if (fundMeta) company.fundNames.add(fundMeta.name);

                const shares = inv.count_remaining_shares || 0;
                const cost = inv.cost_basis || 0;
                company.assets.push({
                    name: inv.asset_name == null ? 'Unknown Asset' : String(inv.asset_name),
                    date: formatDateShort(inv.acquisition_date),
                    shares: shares,
                    cost: cost,
                    value: inv.fmv || 0,
                    gl: inv.unrealized_gain_loss || 0,
                    cps: shares > 0 ? cost / shares : null,
                    // Historical (as-of) rows don't carry remaining_value_per_share —
                    // fall back to a client-computed value/shares so per-share figures
                    // still render for a past quarter instead of going blank.
                    vps: inv.remaining_value_per_share != null ? inv.remaining_value_per_share : (shares > 0 ? (inv.fmv || 0) / shares : null),
                    lastDate: formatDateShort(inv.latest_fmv_effective_date),
                    currency: rowCurrency,
                    fundName: fundMeta ? fundMeta.name : null,
                    // Fund identity for the look-through drill-down — the parent
                    // (fund-of-funds) fund's UUID, used to scope the
                    // UNDERLYING_INVESTMENTS query for this row's "Partnership
                    // Interest" / FUND_INVESTMENT asset.
                    fundUuid: inv.fund_uuid != null ? inv.fund_uuid : singleFundUuid,
                    assetClassType: inv.asset_class_type || null,
                    isFundInvestment: inv.asset_class_type === 'FUND_INVESTMENT',
                    // Base currency fields — present when the asset was purchased in a different
                    // currency than the fund. Company summary rows intentionally omit these.
                    fxCode: inv.base_currency_code || null,
                    fxCost: inv.base_currency_cost,
                    fxValue: inv.base_currency_remaining_value,
                    fxGl: inv.base_currency_unrealized_gain_loss,
                });
            });

            // Roll asset-level dates up to the company. company.date is the earliest
            // acquisition date across assets (semantic "when did we first invest?").
            // company.lastDate is the most recent valuation date. Without these, the
            // 'date'/'lastDate' sorts fall back to whichever asset hits assets[0] /
            // gets processed last in iteration order — which is alphabetical by
            // asset_name from the SQL, not chronological.
            Object.values(byCompany).forEach(c => {
                const dates = c.assets.map(a => a.date).filter(Boolean);
                const lastDates = c.assets.map(a => a.lastDate).filter(Boolean);
                if (dates.length) {
                    c.date = dates.reduce((min, d) => parseDate(d) < parseDate(min) ? d : min);
                }
                if (lastDates.length) {
                    c.lastDate = lastDates.reduce((max, d) => parseDate(d) > parseDate(max) ? d : max);
                }
                c.mixedCurrency = c.currencies.size > 1;
                // Combine multiple FUND_INVESTMENT tranches into the same underlying
                // partnership (e.g. an initial commitment plus later capital calls
                // recorded as separate asset rows on different dates) into one
                // "Partnership Interest" line — they're the same look-through position
                // and should get one drill-down, not one per tranche.
                c.assets = mergeFundInvestmentAssets(c.assets);
            });

            return Object.values(byCompany).sort((a, b) => a.name.localeCompare(b.name));
        }

        // Parse ISO YYYY-MM-DD as a local date string (no Date object → no timezone shift).
        const MONTH_ABBRS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                             'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        // ISO date → "Mar 05, 2018". The day stays zero-padded so the
        // right-aligned date columns keep a consistent width. parseDate reads
        // this format back for sorting, so the two must stay in step.
        function formatDateShort(dateStr) {
            if (!dateStr) return '';
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
            if (m) return `${MONTH_ABBRS[Number(m[2]) - 1]} ${m[3]}, ${m[1]}`;
            return dateStr;
        }

        // ── Ink icons (OshFont glyphs, Y-flipped for standalone SVG) ──

        const INK_ICONS = {
            'down': '<svg viewBox="61 206 386 387" fill="currentColor"><path transform="translate(0,512) scale(1,-1)" d="M446 219c-4 4-9 6-15 6-5 0-10-3-14-7l-160-168-161 168c-8 8-20 9-29 1-4-4-6-9-6-15 0-5 2-10 6-14l175-184c4-4 9-6 15-6 5 0 11 2 15 6l175 184c7 8 7 21-1 29z"/></svg>',
            'forward': '<svg viewBox="63 129 384 384" fill="currentColor"><path transform="translate(0,512) scale(1,-1)" d="M164 0c-4 0-8 2-11 5-6 6-6 16 0 22l172 164-172 164c-6 6-6 16 0 22 5 6 15 6 22 0l184-175c3-3 4-7 4-11 0-4-1-8-4-11l-184-176c-3-3-7-4-11-4z"/></svg>',
            'search': '<svg viewBox="0 0 512 512" fill="currentColor"><path transform="translate(0,512) scale(1,-1)" d="M290 173l15 15 4 4c24 29 38 65 38 103 0 87-72 159-160 159-88 0-159-72-159-159 0-88 71-160 159-160 37 0 72 13 100 36z m-103 0c-67 0-121 54-121 122 0 67 54 121 121 121 67 0 122-54 122-121 0-68-55-122-122-122z m121 17l39-37-20-21-40 39z m120-100l-1-2c-9-21-21-30-30-35l-2-1-75 73 34 35z m12-13l-2-3c-7-14-16-25-27-31l-4-2 35-34c5-5 11-7 18-7 6 0 12 2 17 7 9 10 9 25-1 35z m-12 13l-1-2c-9-21-21-30-30-35l-2-1 12-11 4 2c11 6 20 17 27 31l2 3z"/></svg>',
            'up-carat': '<svg viewBox="0 0 512 512" fill="currentColor"><path transform="translate(0,512) scale(1,-1)" d="M67 149c4-4 9-5 14-5l351 0c5 0 10 2 14 5 4 4 6 9 6 15 0 5-2 10-6 14l-175 184c-4 4-9 6-15 6-5 0-11-2-15-6l-175-184c-7-8-7-21 1-29z"/></svg>',
            'down-carat': '<svg viewBox="0 0 512 512" fill="currentColor"><path transform="translate(0,512) scale(1,-1)" d="M446 363c-4 4-9 5-15 5l-351 0c-5 0-9-2-13-5-4-4-6-9-6-15 0-5 2-10 5-14l176-184c4-4 9-6 15-6 5 0 10 2 14 6l176 184c7 8 7 21-1 29z"/></svg>',
            'sort-carat': '<svg viewBox="0 0 512 512" fill="currentColor"><path transform="translate(0,512) scale(1,-1)" d="M111 268l289 0c5 0 9 2 12 5 7 7 7 18 0 25l-144 145c-3 3-7 5-12 5-5 0-9-2-12-5l-144-145c-7-7-7-18 0-25 3-3 7-4 11-5z m290-89l-289 0c-5 0-9-1-12-4-7-7-7-18 0-25l144-145c3-3 7-5 12-5 5 0 9 2 12 5l144 145c7 7 7 18 0 25-3 3-7 4-11 4z"/></svg>',
            'expand-all': '<svg viewBox="0 0 512 512" fill="currentColor"><path transform="translate(0,512) scale(1,-1)" d="M185 362l49 0 0-66c0-4 1-8 4-11 4-4 7-5 11-5l7 0c4 0 8 1 11 5 3 3 4 7 4 11l0 66 49 0c3 0 6 2 8 5 1 1 3 5-1 10l-66 75c-1 2-4 4-8 4-4 0-6-2-7-4l-68-75-1-1c-1-4 0-7 0-9 2-3 5-5 8-5z m136-269l-49 0 0 67c0 4-2 8-5 11-3 3-7 5-11 5l-6 0c-4 0-8-2-11-5-3-3-5-7-5-11l1-67-49 0c-4 0-7-1-8-4-1-1-3-5 1-10l66-75c1-3 4-4 7-4 4 0 7 2 7 3l69 76 0 1c2 3 2 6 0 9-1 3-4 4-7 4z m98 155l-326 0c-11 0-20-9-20-20 0-11 9-20 20-20l326 0c11 0 20 9 20 20 0 11-9 20-20 20z"/></svg>',
            'collapse-all': '<svg viewBox="0 0 512 512" fill="currentColor"><path transform="translate(0,512) scale(1,-1)" d="M245 283c1-1 3-3 7-3 5 0 7 2 7 3l69 75 0 1c2 4 1 7 0 9-1 3-4 5-7 5l-49 0 0 67c0 4-2 7-5 11-3 3-7 5-11 5l-6 0c-4 0-8-2-11-5-3-4-5-7-5-11l1-67-49 0c-4 0-7-1-8-4-2-2-3-6 1-11z m16-111c-2 3-4 4-8 4-4 0-6-2-7-3l-68-76-1-1c-1-3-1-6 0-9 2-3 5-4 8-4l49 0 0-67c0-4 1-8 4-11 4-3 7-5 11-5l7 0c4 0 8 2 11 5 3 3 4 7 4 11l0 67 49 0c4 0 6 1 8 4 1 2 3 6-1 10z m158 76l-326 0c-11 0-20-9-20-20 0-11 9-20 20-20l326 0c11 0 20 9 20 20 0 11-9 20-20 20z"/></svg>'
        };

        function inkIcon(name, size) {
            size = size || 12;
            return `<span class="ink-icon" style="width:${size}px;height:${size}px">${INK_ICONS[name].replace('<svg ', `<svg width="${size}" height="${size}" `)}</span>`;
        }

        // ── State ──

        let companies = [];
        let currentCurrency = null;
        let filterText = '';
        let sortCol = null;
        let sortDir = 'asc';
        let allExpanded = false;

        // Sticky flag: once we've called welcome to re-initialize the MCP session
        // for this artifact load, don't call it again. If a subsequent MCP call
        // still comes back demanding welcome, surface the error instead of looping.
        let welcomeCalledThisSession = false;

        // Active fund + per-fund cache. Cache survives fund switches but not page reloads —
        // the SOI rarely changes within a single sidebar session, so persistent caching
        // isn't worth the complexity yet.
        let currentFundUuid = INITIAL_FUND_UUID;
        // 'YYYY-MM-DD' quarter-end string, or null for the live/current position.
        let currentAsOfDate = null;
        const fundCache = new Map();  // `${fundUuid}::${asOfDate||'current'}` → companies[]

        // ── Look-through drill-down state ──
        // Underlying-holdings cache, keyed by `${fundUuid}::${parentIssuerName}`.
        // Value is one of: undefined (never fetched), 'loading', an array of parsed
        // rows, or an Error (fetch failed — shown inline, doesn't block the rest of
        // the table).
        const underlyingCache = new Map();
        // Which asset-row keys (`${companyIdx}-${assetIdx}`) currently have their
        // underlying holdings expanded. Cleared on fund switch (see switchFund).
        let expandedUnderlying = new Set();

        // Which companies (by their current position in the sorted/filtered
        // list — same index asset-group-N uses) are individually expanded.
        // render() consults this so a manually-expanded company survives a
        // full re-render — critical because toggleUnderlying() re-renders on
        // every open/close of a look-through drill-down, and without this the
        // re-render would only honor the global allExpanded flag, silently
        // collapsing whichever company the user had opened by hand.
        let expandedCompanies = new Set();

        // ── Global (cross-fund) search state ──
        let globalSearchDebounce = null;
        let globalSearchTerm = '';
        let globalSearchResults = null;   // null = not run / cleared; array = last result
        let globalSearchLoading = false;
        let globalSearchError = null;

        // Sentinel dropdown value for the firm-wide rollup. Not a real fund UUID —
        // never sent to the warehouse as FUND_UUID; buildSoiSqlAllFunds below expands
        // it into an IN-list of every real fund UUID instead.
        const ALL_ENTITIES_VALUE = '__all_entities__';
        const ALL_ENTITIES_LABEL = 'All Entities';

        // Sentinel prefix for a fund-family rollup (e.g. 'family::Healthcare Partners
        // Fund V'). Same pooling mechanism as ALL_ENTITIES_VALUE, scoped to the funds
        // sharing one fund_family_name instead of every fund in the firm.
        const FAMILY_PREFIX = 'family::';

        // Sentinel prefix for an arbitrary multi-fund selection (e.g.
        // 'set::<uuid>,<uuid>'). Same pooling mechanism again, over whichever funds
        // the user ticked rather than a family or the whole firm. The uuid list is
        // always in FUNDS order (see canonicalSelectionValue) so one selection has
        // exactly one string form — the value doubles as a cache key, and two
        // spellings of the same set would fetch twice and compare as different.
        const SET_PREFIX = 'set::';

        function isPooledUuid(uuid) {
            return uuid === ALL_ENTITIES_VALUE
                || (typeof uuid === 'string' && (uuid.startsWith(FAMILY_PREFIX) || uuid.startsWith(SET_PREFIX)));
        }

        // Funds backing a pooled selection: every fund for All Entities, the funds
        // sharing a family name for a family selection, or the ticked funds for an
        // arbitrary set.
        function pooledFunds(fundUuid) {
            if (fundUuid === ALL_ENTITIES_VALUE) return FUNDS;
            if (fundUuid.startsWith(FAMILY_PREFIX)) {
                const familyName = fundUuid.slice(FAMILY_PREFIX.length);
                return FUNDS.filter(f => f.fund_family_name === familyName);
            }
            if (fundUuid.startsWith(SET_PREFIX)) {
                const picked = new Set(fundUuid.slice(SET_PREFIX.length).split(','));
                return FUNDS.filter(f => picked.has(f.uuid));
            }
            return [];
        }

        // Collapses a set of ticked fund uuids into the single value the rest of the
        // artifact already understands. One fund stays a plain uuid so a single-fund
        // selection behaves exactly as it always has (no Held By column, one
        // currency) rather than becoming a pool of one.
        //
