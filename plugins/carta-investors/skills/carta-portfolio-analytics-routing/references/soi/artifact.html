        // Returns null for an empty selection: no funds is not a view the table can
        // render, so it has no value form and callers gate Apply on it.
        function canonicalSelectionValue(selection) {
            const ordered = FUNDS.filter(f => selection.has(f.uuid)).map(f => f.uuid);
            if (!ordered.length) return null;
            if (ordered.length === 1) return ordered[0];
            // Every fund ticked *is* the firm-wide view. Checked before the family
            // case so the broader label wins if one family happens to be the whole
            // firm. A one-fund firm is excluded: it isn't offered the firm-wide
            // option, and the render script rejects the sentinel below two funds.
            if (ordered.length === FUNDS.length && FUNDS.length > 1) return ALL_ENTITIES_VALUE;
            // A set that happens to be exactly one family's membership is that
            // family. Identical funds either way, but it lets the trigger say
            // "Cendana Capital IV, L.P." instead of naming one class and counting
            // the others — and it keeps one cache key for one pool, however the
            // user assembled it.
            const { families } = groupFundsByFamily();
            for (const [name, members] of families) {
                if (members.length === ordered.length
                    && members.every(f => selection.has(f.uuid))) {
                    return FAMILY_PREFIX + name;
                }
            }
            return SET_PREFIX + ordered.join(',');
        }

        // Inverse of canonicalSelectionValue: the ticked-fund set a value implies.
        // Firm-wide expands to every fund rather than to nothing, so the rows below
        // "All Entities" show as checked instead of contradicting it.
        function selectionFromValue(value) {
            if (!value) return new Set();
            if (value === ALL_ENTITIES_VALUE) return new Set(FUNDS.map(f => f.uuid));
            if (value.startsWith(FAMILY_PREFIX) || value.startsWith(SET_PREFIX)) {
                return new Set(pooledFunds(value).map(f => f.uuid));
            }
            return new Set([value]);
        }

        // True only while viewing All Entities AND the firm's funds don't share one
        // reporting currency. Drives renderMetrics/render() to show per-row/per-currency
        // breakdowns instead of a single summed total that would silently add
        // incompatible currencies together.
        let viewMixedCurrency = false;

        const BASE_COLUMNS = [
            { key: 'name',     label: 'Investment',          num: false, expandToggle: true },
            { key: 'date',     label: 'Investment date',     num: true  },
            { key: 'shares',   label: 'Shares / Principal',  num: true  },
            { key: 'cost',     label: 'Cost',                num: true  },
            { key: 'value',    label: 'Value',               num: true  },
            { key: 'lastDate', label: 'Last updated',        num: true  },
            { key: 'gl',       label: 'Gain / Loss',         num: true  },
            { key: 'cps',      label: 'Cost per share',      num: true  },
            { key: 'vps',      label: 'Value per share',     num: true  },
        ];

        const HELD_BY_COLUMN = { key: 'heldBy', label: 'Held By', num: false, sortable: false };

        // "Held By" only means something when rows are pooled from more than one
        // fund — insert it right after Investment (matching the cap-table Investments
        // table pattern) only while viewing All Entities.
        function getColumns() {
            if (!isPooledUuid(currentFundUuid)) return BASE_COLUMNS;
            return [BASE_COLUMNS[0], HELD_BY_COLUMN, ...BASE_COLUMNS.slice(1)];
        }

        // ── Formatters ──

        function fmt(val, currency) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: currency || currentCurrency, minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(val);
        }

        function fmtDec(val, currency) {
            if (val == null) return '—';
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: currency || currentCurrency, minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val);
        }

        function fmtShares(val) {
            if (!val) return '—';
            return new Intl.NumberFormat('en-US').format(val);
        }

        // Format an amount in the asset's base currency for the fx tooltip.
        // Shows the raw number with 2 decimal places; the currency code is shown
        // separately in the tooltip so we don't need a currency symbol here.
        function fmtBaseAmount(val) {
            if (val == null) return '—';
            return new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val);
        }

        function glCell(val, currency) {
            if (val === 0) return `<span class="gl-value" style="color:var(--text-subtle)">${fmt(0, currency)}</span>`;
            const cls = val >= 0 ? 'gain' : 'loss';
            const arrow = val >= 0 ? '↑' : '↓';
            return `<span class="gl-value ${cls}"><span class="gl-arrow">${arrow}</span>${fmt(Math.abs(val), currency)}</span>`;
        }

        // DWH strings (company/asset names, dates) flow through innerHTML below;
        // escape before interpolating so a malicious value can't inject markup.
        function escHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Escape a value for safe interpolation as a single-quoted JS string literal
        // sitting inside a double-quoted HTML attribute (onclick="..."). Order matters:
        // escape backslash/quote for the JS string FIRST (producing literal \\ and \'
        // two-character sequences), THEN escape &, <, >, " for the HTML attribute.
        // Escaping the single quote as &#39; (the way escHtml does) would be wrong here —
        // the browser HTML-unescapes attribute values before handing them to the JS
        // parser, so &#39; would decode back to a bare ' and terminate the string early.
        function escJs(str) {
            if (str == null) return '';
            const jsSafe = String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            return jsSafe.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Reads back what formatDateShort renders ("Mar 05, 2018").
        function parseDate(str) {
            if (!str) return 0;
            const m = /^([A-Za-z]{3}) (\d{2}), (\d{4})$/.exec(str);
            if (!m) return 0;
            return new Date(Number(m[3]), MONTH_ABBRS.indexOf(m[1]), Number(m[2])).getTime();
        }

        function computeTotals(rows) {
            return rows.reduce((t, c) => ({
                cost: t.cost + c.cost,
                value: t.value + c.value,
                gl: t.gl + c.gl,
                assets: t.assets + c.assets.length,
            }), { cost: 0, value: 0, gl: 0, assets: 0 });
        }

        // ── Sorting ──

        function sorted(data) {
            if (!sortCol) return data;
            return [...data].sort((a, b) => {
                let va, vb;
                if (sortCol === 'name') {
                    va = a.name.toLowerCase();
                    vb = b.name.toLowerCase();
                    return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
                } else if (sortCol === 'lastDate' || sortCol === 'date') {
                    va = parseDate(a[sortCol]);
                    vb = parseDate(b[sortCol]);
                } else {
                    va = a[sortCol] || 0;
                    vb = b[sortCol] || 0;
                }
                return sortDir === 'asc' ? va - vb : vb - va;
            });
        }

        function setSort(key) {
            if (sortCol === key) {
                sortDir = sortDir === 'asc' ? 'desc' : 'asc';
            } else {
                sortCol = key;
                sortDir = 'asc';
            }
            render();
        }

        function filtered() {
            if (!filterText) return companies;
            const q = filterText.toLowerCase();
            return companies.filter(c => c.name.toLowerCase().includes(q));
        }

        function sortIndicator(key) {
            if (sortCol === key) {
                return sortDir === 'asc' ? inkIcon('up-carat', 10) : inkIcon('down-carat', 10);
            }
            return inkIcon('sort-carat', 10);
        }

        // ── Render ──

        function renderHead() {
            const thead = document.getElementById('tableHead');
            let html = '<tr>';

            getColumns().forEach(col => {
                if (col.sortable === false) {
                    html += `<th><div class="th-inner">${col.label}</div></th>`;
                    return;
                }

                const cls = ['sortable'];
                if (col.num) cls.push('number');
                if (sortCol === col.key) cls.push('active');
                else if (sortCol) cls.push('dimmed');

                if (col.expandToggle) {
                    const expandIcon = allExpanded ? 'collapse-all' : 'expand-all';
                    html += `<th class="${cls.join(' ')}" onclick="setSort('${col.key}')"><div class="th-inner"><span class="th-expand"><span class="expand-all-toggle" id="expandAllToggle" onclick="event.stopPropagation(); toggleAll()">${inkIcon(expandIcon, 16)}</span></span>${col.label}<span class="sort-indicator">${sortIndicator(col.key)}</span></div></th>`;
                } else {
                    html += `<th class="${cls.join(' ')}" onclick="setSort('${col.key}')"><div class="th-inner">${col.label}<span class="sort-indicator">${sortIndicator(col.key)}</span></div></th>`;
                }
            });

            html += '</tr>';
            thead.innerHTML = html;
        }

        function renderMetrics() {
            const t = computeTotals(companies);
            const moic = t.cost > 0 ? (t.value / t.cost).toFixed(2) : '—';

            if (viewMixedCurrency) {
                // Funds in this firm report in more than one currency — a single summed
                // total would silently add incompatible currencies together. Show a
                // per-currency cost breakdown instead and skip a firm-wide MOIC/G-L
                // figure that would be equally misleading.
                const costByCurrency = {};
                companies.forEach(c => c.assets.forEach(a => {
                    if (a.currency) costByCurrency[a.currency] = (costByCurrency[a.currency] || 0) + a.cost;
                }));
                // A middot separator, never '+': these are separate per-currency
                // figures, and an arithmetic operator would imply they sum.
                const breakdown = Object.entries(costByCurrency)
                    .map(([cur, cost]) => `<span class="mixed-line">${fmt(cost, cur)}</span>`)
                    .join('<span class="mixed-sep">·</span>');
                document.getElementById('metricsContainer').innerHTML = `
                    <div class="metrics-strip">
                        <div class="metric-item" style="grid-column: 1 / -1; border-right: none; padding-right: 0; border-bottom: none; padding-bottom: 0;">
                            <div class="metric-label"><span class="tooltip-trigger" data-tooltip="This firm's funds report in more than one currency, so cost/value/gain-loss aren't summed into one figure.">Total cost by currency</span></div>
                            <div class="metric-value mixed-badge">${breakdown || '—'}</div>
                        </div>
                    </div>
                `;
                return;
            }

            document.getElementById('metricsContainer').innerHTML = `
                <div class="metrics-strip">
                    <div class="metric-item">
                        <div class="metric-label">Total cost</div>
                        <div class="metric-value">${fmt(t.cost)}</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">Total value</div>
                        <div class="metric-value">${fmt(t.value)}</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">Gain / Loss</div>
                        <div class="metric-value">${glCell(t.gl)}</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label"><span class="tooltip-trigger" data-tooltip="Multiple on Invested Capital">MOIC</span></div>
                        <div class="metric-value">${moic === '—' ? moic : moic + 'x'}</div>
                    </div>
                </div>
            `;
        }

        function render() {
            const data = sorted(filtered());
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            // render() is the funnel every filter and sort change passes through, so
            // it's the one place the Reset control's visibility can't drift from the
            // state it describes.
            syncResetFiltersVisibility();
            renderHead();

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${getColumns().length}" class="empty-state">No companies match your filter.</td></tr>`;
                updateScrollAffordances();
                return;
            }

            data.forEach((c, i) => {
                // In the All Entities view, a company held across multiple funds in
                // different currencies has no single valid summed cost/value/G-L —
                // show a "Mixed" badge on the company row and let the per-asset rows
                // (each tagged with its own fund's currency) carry the real numbers.
                const mixedBadge = `<span class="mixed-badge tooltip-trigger" data-tooltip="Held in more than one currency — see rows below">Mixed</span>`;
                const singleCur = c.currencies ? [...c.currencies][0] : undefined;
                const companyCost  = c.mixedCurrency ? mixedBadge : fmt(c.cost, singleCur);
                const companyValue = c.mixedCurrency ? mixedBadge : fmt(c.value, singleCur);
                const companyGl    = c.mixedCurrency ? mixedBadge : glCell(c.gl, singleCur);

                // "Held By" mirrors the cap-table Investments table: a collapsed
                // multi-fund company shows "N funds" (with the names on hover);
                // a company held by a single fund just names it.
                const heldByCell = isPooledUuid(currentFundUuid)
                    ? (() => {
                        const names = c.fundNames ? [...c.fundNames] : [];
                        if (names.length > 1) {
                            return `<td><span class="tooltip-trigger" data-tooltip="${escHtml(names.join('\n'))}">${names.length} funds</span></td>`;
                        }
                        return `<td>${escHtml(names[0] || '—')}</td>`;
                    })()
                    : '';

                const cr = document.createElement('tr');
                cr.className = 'company-row';
                cr.onclick = () => toggle(i);
                cr.innerHTML = `
                    <td><div class="company-cell"><span class="expand-icon" id="icon-${i}">${inkIcon(allExpanded ? 'down' : 'forward', 10)}</span><span class="company-name">${escHtml(c.name)}</span></div></td>
                    ${heldByCell}
                    <td></td>
                    <td></td>
                    <td class="number">${companyCost}</td>
                    <td class="number">${companyValue}</td>
                    <td class="number">${escHtml(c.lastDate)}</td>
                    <td class="number">${companyGl}</td>
                    <td></td>
                    <td></td>
                `;
                tbody.appendChild(cr);

                c.assets.forEach((a, ai) => {
                    const underlyingKey = `${i}-${ai}`;
                    const isExpandable = !!a.isFundInvestment;
                    const isExpanded = isExpandable && expandedUnderlying.has(underlyingKey);

                    const ar = document.createElement('tr');
                    ar.className = `asset-row asset-group-${i}`;
                    if (allExpanded || expandedCompanies.has(i)) ar.classList.add('visible', 'shown');
                    if (isExpandable) ar.classList.add('fund-investment-row');

                    // Build fx icon markup for a given base-currency amount and column label.
                    // The tooltip uses &#10; (newline entity) so the browser parses it as \n,
                    // which white-space:pre on .tooltip-popup renders as a line break.
                    const fxIcon = (baseVal, header) => {
                        if (!a.fxCode || a.fxCode === currentCurrency) return '';
                        const tip = `${header}&#10;Amount ${fmtBaseAmount(baseVal)}&#10;Currency ${escHtml(a.fxCode)}`;
                        return `<span class="fx-icon tooltip-trigger" data-tooltip="${tip}">⇄</span>`;
                    };

                    // In a pooled view (All Entities or a fund family) each asset carries
                    // its own fund's currency (a.currency), which may differ from another
                    // row's — pass it explicitly rather than relying on currentCurrency.
                    const currencyTag = isPooledUuid(currentFundUuid) && a.currency
                        ? `<span class="currency-tag">${escHtml(a.currency)}</span>`
                        : '';
                    const assetHeldByCell = isPooledUuid(currentFundUuid)
                        ? `<td>${escHtml(a.fundName || '—')}</td>`
                        : '';

                    // FUND_INVESTMENT rows (a fund-of-funds LP interest, e.g. "Partnership
                    // Interest") get their own expand chevron so a user can drill from the
                    // parent LP interest into the underlying fund's own portfolio companies,
                    // look-through prorated by the firm's ownership fraction.
                    const trancheTag = a.tranches > 1
                        ? `<span class="tranche-note tooltip-trigger" data-tooltip="Combines ${a.tranches} separate investment tranches into this partnership interest">(${a.tranches} tranches)</span>`
                        : '';
                    const nameCell = isExpandable
                        ? `<span class="expand-icon underlying-toggle" id="underlying-icon-${underlyingKey}" onclick="event.stopPropagation(); toggleUnderlying('${underlyingKey}', '${escJs(a.fundUuid)}', '${escJs(c.name)}')">${inkIcon(isExpanded ? 'down' : 'forward', 9)}</span><span class="asset-name-stack"><span class="asset-name expandable" onclick="event.stopPropagation(); toggleUnderlying('${underlyingKey}', '${escJs(a.fundUuid)}', '${escJs(c.name)}')">${escHtml(a.name)}</span>${trancheTag}</span>`
                        : `<span class="asset-name">${escHtml(a.name)}</span>`;

                    ar.innerHTML = `
                        <td>${nameCell}</td>
                        ${assetHeldByCell}
                        <td class="number">${escHtml(a.date)}</td>
                        <td class="number">${fmtShares(a.shares)}</td>
                        <td class="number">${fxIcon(a.fxCost, 'Original purchase')}${fmt(a.cost, a.currency)}${currencyTag}</td>
                        <td class="number">${fxIcon(a.fxValue, 'Base currency value')}${fmt(a.value, a.currency)}${currencyTag}</td>
                        <td class="number">${escHtml(a.lastDate)}</td>
                        <td class="number">${fxIcon(a.fxGl, 'Base currency unrealized G/L')}${glCell(a.gl, a.currency)}${currencyTag}</td>
                        <td class="number">${fmtDec(a.cps, a.currency)}</td>
                        <td class="number">${fmtDec(a.vps, a.currency)}</td>
                    `;
                    tbody.appendChild(ar);

                    if (isExpandable) {
                        tbody.appendChild(renderUnderlyingRows(underlyingKey, i, a, c.name, isExpanded));
                    }
                });
            });

            if (!filterText) {
                const t = computeTotals(data);
                const totalCost  = viewMixedCurrency ? '<span class="mixed-badge">Mixed</span>' : fmt(t.cost);
                const totalValue = viewMixedCurrency ? '<span class="mixed-badge">Mixed</span>' : fmt(t.value);
                const totalGl    = viewMixedCurrency ? '<span class="mixed-badge">Mixed</span>' : glCell(t.gl);
                const heldByTotalsCell = isPooledUuid(currentFundUuid) ? '<td></td>' : '';
                const tr = document.createElement('tr');
                tr.className = 'totals-row';
                tr.innerHTML = `
                    <td>${data.length} companies, ${t.assets} positions</td>
                    ${heldByTotalsCell}
                    <td></td>
                    <td></td>
                    <td class="number">${totalCost}</td>
                    <td class="number">${totalValue}</td>
                    <td></td>
                    <td class="number">${totalGl}</td>
                    <td></td>
                    <td></td>
                `;
                tbody.appendChild(tr);
            }

            updateScrollAffordances();
        }

        // Symmetric fade for asset-row/underlying-row disclosure. `.visible` and
        // `.shown` are deliberately separate (see the CSS comment above
        // tr.asset-row): expanding adds `.visible` first so the row occupies
        // layout space, then `.shown` a frame later so the opacity transition
        // has a starting value to animate from. Collapsing reverses that —
        // drop `.shown` to fade out, then remove `.visible` once the
        // transition actually finishes so display:none doesn't cut it short.
        function setRowVisible(row, show) {
            if (!row) return;
            if (show) {
                row.classList.add('visible');
                requestAnimationFrame(() => requestAnimationFrame(() => row.classList.add('shown')));
            } else {
                row.classList.remove('shown');
                const finish = () => row.classList.remove('visible');
                row.addEventListener('transitionend', finish, { once: true });
                // Fallback for prefers-reduced-motion (transition: none never fires
                // transitionend) and any other case the event doesn't land.
                setTimeout(finish, 200);
            }
        }

        function toggle(i) {
            const rows = document.querySelectorAll(`.asset-group-${i}`);
            const expanding = !rows[0]?.classList.contains('visible');
            rows.forEach(r => setRowVisible(r, expanding));
            if (expanding) expandedCompanies.add(i); else expandedCompanies.delete(i);
            const icon = document.getElementById(`icon-${i}`);
            if (icon) icon.innerHTML = inkIcon(expanding ? 'down' : 'forward', 10);

            // Sync allExpanded to actual state so the header icon doesn't lie
            // when the user expand-alls then collapses one (or vice-versa).
            const allRows = document.querySelectorAll('.asset-row');
            allExpanded = allRows.length > 0 && Array.from(allRows).every(r => r.classList.contains('visible'));
            const t = document.getElementById('expandAllToggle');
            if (t) t.innerHTML = inkIcon(allExpanded ? 'collapse-all' : 'expand-all', 16);
        }

        function toggleAll() {
            allExpanded = !allExpanded;
            if (allExpanded) {
                document.querySelectorAll('.company-row').forEach((_, i) => expandedCompanies.add(i));
            } else {
                expandedCompanies.clear();
            }
            document.querySelectorAll('.asset-row, .underlying-row').forEach(r => setRowVisible(r, allExpanded));
            // Exclude .underlying-toggle — a FUND_INVESTMENT row's own drill-down
            // expand/collapse is independent of the company-row expand-all state.
            document.querySelectorAll('.expand-icon:not(.underlying-toggle)').forEach(ic => {
                ic.innerHTML = inkIcon(allExpanded ? 'down' : 'forward', 10);
            });
            const t = document.getElementById('expandAllToggle');
            if (t) t.innerHTML = inkIcon(allExpanded ? 'collapse-all' : 'expand-all', 16);
        }

        function filterCompanies(val) {
            filterText = val;
            render();
            scheduleGlobalSearch(val);
        }

        // ── Look-through drill-down: render + fetch ──

        // Renders the underlying-holdings rows for one expanded FUND_INVESTMENT asset.
        // Returns a DocumentFragment (possibly empty when collapsed) so render() can
        // append it directly to tbody alongside the flat company/asset rows — no
        // nested <table>, so sticky-first-column and sort/filter logic don't need to
        // know this level exists.
        function renderUnderlyingRows(key, companyIdx, asset, parentIssuerName, isExpanded) {
            const frag = document.createDocumentFragment();
            if (!isExpanded) return frag;

            const colCount = getColumns().length;
            const cacheKey = `${asset.fundUuid}::${parentIssuerName}::${currentAsOfDate || 'current'}`;
            const cached = underlyingCache.get(cacheKey);
            const showHeldBy = isPooledUuid(currentFundUuid);

            // underlying rows carry the same `asset-group-${companyIdx}` class as the
            // asset row above them, so toggle()/toggleAll() (which operate on that
            // class, oblivious to nesting level) hide/show them together with the
            // rest of the company's rows — a collapsed company row shouldn't leave
            // its look-through rows visible underneath it.
            const groupClass = `asset-group-${companyIdx}`;
            const visibleClass = (allExpanded || expandedCompanies.has(companyIdx)) ? ' visible shown' : '';

            // `extra` carries trailing markup (the retry control); the message
            // itself is always escaped.
            const statusRow = (text, isError, extra) => {
                const tr = document.createElement('tr');
                tr.className = `underlying-row underlying-group-${key} ${groupClass}${visibleClass}`;
                tr.innerHTML = `<td colspan="${colCount}" class="underlying-status${isError ? ' error' : ''}">${escHtml(text)}${extra || ''}</td>`;
                return tr;
            };

            if (cached === undefined || cached === 'loading') {
                frag.appendChild(statusRow('Loading look-through holdings…', false));
                return frag;
            }
            if (cached instanceof Error) {
                // The underlying error is deliberately not shown — it's raw warehouse
                // text. It goes to the console at the catch site instead.
                const retry = `<button type="button" class="retry-link" onclick="retryUnderlying('${escJs(asset.fundUuid)}', '${escJs(parentIssuerName)}')">Try again</button>`;
                frag.appendChild(statusRow("Couldn't load look-through holdings.", true, retry));
                return frag;
            }
            if (!Array.isArray(cached) || cached.length === 0) {
                frag.appendChild(statusRow('No look-through holdings available. Sharing may be disabled or the underlying fund isn’t on Carta.', false));
                return frag;
            }

            cached.forEach(u => {
                const tr = document.createElement('tr');
                tr.className = `underlying-row underlying-group-${key} ${groupClass}${visibleClass}`;
                const pct = u.ownership_fraction != null ? u.ownership_fraction * 100 : null;
                const pctTip = pct != null
                    ? `${STATE.firm_name}'s look-through share of ${u.underlying_fund_name || parentIssuerName}: ${pct.toFixed(2)}%`
                    : 'Ownership share unavailable — figures shown unprorated';
                const sourceLabel = u.source === 'LPPA' ? 'self-reported' : 'Carta-administered';
                const shares = u.count_remaining_shares || 0;
                const cost = u.cost_basis || 0;
                const cps = shares > 0 ? cost / shares : null;
                const heldByCell = showHeldBy ? '<td>—</td>' : '';
                tr.innerHTML = `
                    <td><span class="underlying-name tooltip-trigger" data-tooltip="${escHtml(pctTip)}">${escHtml(u.underlying_issuer_name)}</span><span class="underlying-source">${sourceLabel}</span></td>
                    ${heldByCell}
                    <td class="number">—</td>
                    <td class="number">${fmtShares(u.count_remaining_shares)}</td>
                    <td class="number">${fmt(cost, u.currency_code)}</td>
                    <td class="number">${fmt(u.fmv || 0, u.currency_code)}</td>
                    <td class="number">—</td>
                    <td class="number">${glCell(u.unrealized_gain_loss || 0, u.currency_code)}</td>
                    <td class="number">${fmtDec(cps, u.currency_code)}</td>
                    <td class="number">${fmtDec(u.remaining_value_per_share, u.currency_code)}</td>
                `;
                frag.appendChild(tr);
            });
            return frag;
        }

        // Expand/collapse one FUND_INVESTMENT asset's underlying holdings, fetching
        // (and caching) from UNDERLYING_INVESTMENTS on first expand. Re-renders after
        // both the optimistic "loading" state and the resolved result/error so the
        // user sees progress rather than a frozen row.
        async function toggleUnderlying(key, fundUuid, parentIssuerName) {
            if (expandedUnderlying.has(key)) {
                expandedUnderlying.delete(key);
                render();
                return;
            }
            expandedUnderlying.add(key);

            // This is the fallback path — the normal path is loadFund's bulk prefetch,
            // which already populates underlyingCache (with an explicit [] for
            // positions with no look-through data) before the table renders. This
            // per-row fetch only fires if that bulk prefetch missed this key, e.g. it
            // partially failed.
            const cacheKey = `${fundUuid}::${parentIssuerName}::${currentAsOfDate || 'current'}`;
            if (!underlyingCache.has(cacheKey)) {
                await loadUnderlyingInto(cacheKey, fundUuid, parentIssuerName);
            }
            render();
        }

        // Fetches one position's look-through rows into the cache. Shared by the
        // cache-miss path above and by the retry on a failed row.
        async function loadUnderlyingInto(cacheKey, fundUuid, parentIssuerName) {
            underlyingCache.set(cacheKey, 'loading');
            render();
            try {
                const result = await callMcpWithWelcomeRetry(CALL_TOOL, {
                    name: 'dwh__execute__query',
                    arguments: { sql: buildUnderlyingSql(fundUuid, parentIssuerName, currentAsOfDate) },
                });
                underlyingCache.set(cacheKey, parseDwhQueryResult(result));
            } catch (err) {
                console.error('SOI: look-through query failed for', parentIssuerName, err);
                underlyingCache.set(cacheKey, err instanceof Error ? err : new Error(String(err)));
            }
        }

        // The bulk prefetch failed for this fund, so retry with the much narrower
        // single-position query rather than repeating the query that just failed.
        async function retryUnderlying(fundUuid, parentIssuerName) {
            const cacheKey = `${fundUuid}::${parentIssuerName}::${currentAsOfDate || 'current'}`;
            await loadUnderlyingInto(cacheKey, fundUuid, parentIssuerName);
            render();
        }

        // ── Global (cross-fund) search ──
        // Debounced so every keystroke doesn't fire a warehouse query. Runs
        // independently of the local top-level company filter — the two answer
        // different questions ("which of THIS fund's top-level positions match" vs.
        // "which of ANY fund's look-through holdings match").

        function scheduleGlobalSearch(term) {
            globalSearchTerm = (term || '').trim();
            clearTimeout(globalSearchDebounce);
            if (globalSearchTerm.length < 2) {
                globalSearchResults = null;
                globalSearchError = null;
                globalSearchLoading = false;
                renderGlobalSearchPanel();
                return;
            }
            globalSearchDebounce = setTimeout(() => runGlobalSearch(globalSearchTerm), 400);
        }

        async function runGlobalSearch(term) {
            if (term !== globalSearchTerm) return; // superseded by a later keystroke
            globalSearchLoading = true;
            globalSearchError = null;
            renderGlobalSearchPanel();
            try {
                const result = await callMcpWithWelcomeRetry(CALL_TOOL, {
                    name: 'dwh__execute__query',
                    arguments: { sql: buildGlobalUnderlyingSearchSql(term, 200, currentAsOfDate) },
                });
                const rows = parseDwhQueryResult(result);
                if (term !== globalSearchTerm) return; // stale by the time it resolved
                globalSearchResults = rows;
            } catch (err) {
                if (term !== globalSearchTerm) return;
                console.error('SOI: cross-fund look-through search failed', err);
                globalSearchError = true;
                globalSearchResults = null;
            } finally {
                if (term === globalSearchTerm) {
                    globalSearchLoading = false;
                    renderGlobalSearchPanel();
                }
            }
        }

        function renderGlobalSearchPanel() {
            const panel = document.getElementById('globalSearchPanel');
            if (!panel) return;

            if (!globalSearchTerm || globalSearchTerm.length < 2) {
                panel.style.display = 'none';
                panel.innerHTML = '';
                return;
            }
            panel.style.display = 'block';

            if (globalSearchLoading) {
                panel.innerHTML = '<div class="global-search-status">Searching underlying holdings across all your funds…</div>';
                return;
            }
            if (globalSearchError) {
                panel.innerHTML = `<div class="global-search-status error">Couldn't search holdings. <button type="button" class="retry-link" onclick="runGlobalSearch(globalSearchTerm)">Try again</button></div>`;
                return;
            }
            if (!globalSearchResults || globalSearchResults.length === 0) {
                panel.innerHTML = `<div class="global-search-status">No underlying (look-through) holdings match "${escHtml(globalSearchTerm)}".</div>`;
                return;
            }

            const rowsHtml = globalSearchResults.map(r => {
                const value = fmt(r.fmv || 0, r.currency_code);
                return `<div class="global-search-row" onclick="jumpToMatch('${escJs(r.fund_uuid)}', '${escJs(r.parent_issuer_name)}', '${escJs(r.underlying_issuer_name)}')">
                    <div class="gsr-main">
                        <span class="gsr-company">${escHtml(r.underlying_issuer_name)}</span>
                        <span class="gsr-via">via ${escHtml(r.parent_issuer_name)}</span>
                    </div>
                    <div class="gsr-fund">${escHtml(r.fund_name)}</div>
                    <div class="gsr-value">${value}</div>
                </div>`;
            }).join('');

            const count = globalSearchResults.length;
            panel.innerHTML = `<div class="global-search-header">Also held (look-through) across your funds — ${count} match${count === 1 ? '' : 'es'}</div>${rowsHtml}`;
        }

        // Switches to the matched fund (if needed), expands the matched parent LP
        // interest's underlying holdings, and scrolls it into view. The local text
        // filter is cleared so the parent row isn't hidden by an unrelated filter
        // term left over from before the fund switch; the global search box itself
        // (and its panel) are left alone so the user can keep browsing other matches.
        async function jumpToMatch(fundUuid, parentIssuerName, underlyingIssuerName) {
            if (fundUuid && fundUuid !== currentFundUuid) {
                await loadFund(fundUuid);
                // loadFund rebuilds the DOM (ensureContentSkeleton), which wipes the
                // search input and the global-search panel — restore both so the
                // panel the user clicked from is still visible after the jump.
                const input = document.getElementById('searchInput');
                if (input) input.value = globalSearchTerm;
                renderGlobalSearchPanel();
            }
            filterText = '';

            const idx = companies.findIndex(c => c.name === parentIssuerName);
            if (idx === -1) { render(); return; }

            const assetIdx = companies[idx].assets.findIndex(a => a.isFundInvestment);
            render();

            if (assetIdx !== -1) {
                const key = `${idx}-${assetIdx}`;
                if (!expandedUnderlying.has(key)) {
                    await toggleUnderlying(key, fundUuid, parentIssuerName);
                }
            }

            requestAnimationFrame(() => {
                const groupRows = document.querySelectorAll(`.asset-group-${idx}`);
                const companyRows = document.querySelectorAll('tr.company-row');
                const target = groupRows[0] || companyRows[idx];
                if (target && target.scrollIntoView) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        }

        // ── Loading / error / empty-fund states ──

        // Swap shimmer for the real content area. Used by every terminal state
        // (success, error, empty fund) so the shimmer never gets stranded.
        function showContent() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('contentArea').classList.add('loaded');
            setLoadingStatus(null);
        }

        // Show or clear a status caption above the shimmer. Used to explain the
        // brief extra delay when the artifact has to re-initialize the MCP session
        // via the welcome tool before retrying a failed call.
        function setLoadingStatus(msg) {
            const el = document.getElementById('loadingStatus');
            if (!el) return;
            if (msg) {
                el.textContent = msg;
                el.style.display = 'block';
            } else {
                el.textContent = '';
                el.style.display = 'none';
            }
        }

        // The Carta MCP asks us to call `welcome` when the user's session state has
        // expired (typically after a few days of inactivity). Match on the word
        // "welcome" — narrow enough to avoid false positives on unrelated dwh errors,
        // loose enough to survive minor wording tweaks from the MCP team.
        function isWelcomeRequiredMessage(text) {
            return typeof text === 'string' && /welcome/i.test(text);
        }

        // Every Carta MCP call — call_tool, set_context, welcome alike — must carry
        // _instrumentation_v2 or the MCP rejects it with an "attach it to every
        // call" error. Centralized here so every call site (including the retry
        // and the welcome recovery call) gets it, instead of each caller having to
        // remember it individually.
        const INSTRUMENTATION_V2 = { skills: ['carta-investors:carta-soi'], from_ui: true };

        function withInstrumentation(args) {
            return { ...args, _instrumentation_v2: INSTRUMENTATION_V2 };
        }

        let _mcpNsPromise = null;
        // null means this view cannot run mcp — not granted, not served, or failed to load.
        // Polls up to 5 attempts, 4 × 500 ms gaps (2 s max) to handle window.claude not yet ready on first render.
        function mcpNamespace() {
            if (!_mcpNsPromise) {
                _mcpNsPromise = (async () => {
                    for (let i = 0; i < 5; i++) {
                        try {
                            const mcp = await Promise.resolve(window.claude?.use?.('mcp') ?? null);
                            if (mcp) return mcp;
                        } catch (_) {}
                        if (i < 4 && typeof setTimeout === 'function') await new Promise(r => setTimeout(r, 500));
                    }
                    return null;
                })();
            }
            return _mcpNsPromise;
        }

        // A tool that ran and reported failure comes back as an isError envelope so the
        // welcome recovery below can read its message. Connector-level codes
        // (needs_reauth, server_not_connected) rethrow — those are page-level.
        async function callCartaTool(toolName, args) {
            const mcp = await mcpNamespace();
            if (!mcp) {
                throw new Error('No live Carta connector in this view — the page cannot load data');
            }
            try {
                return await mcp.callTool(CARTA_MCP_SERVER, toolName, withInstrumentation(args || {}));
            } catch (err) {
                if (err && err.code === 'tool_error') {
                    return { isError: true, code: err.code, result: err.result, content: [{ type: 'text', text: err.message || 'tool error' }] };
                }
                // server_not_connected means the name this page was published with doesn't
                // match any connector the viewer has. It fails every call, so raise it as a self-explaining,
                // user-facing error the callers show verbatim instead of a bare code that
                // reads as a stuck load.
                if (err && err.code === 'server_not_connected') {
                    const e = new Error('Could not reach the Carta connector "' + CARTA_MCP_SERVER + '". Its name may not match the Carta connector in your Claude settings. Ask whoever shared this dashboard to re-publish it. (server_not_connected)');
                    e.userFacing = true;
                    throw e;
                }
                throw err;
            }
        }

        // Transparently recovers from "please call welcome first" errors. On the first
        // such failure per artifact load, call welcome to re-initialize the session and
        // retry the original call once. Any other error passes through untouched, and
        // `welcomeCalledThisSession` stops a loop if welcome didn't fix the cause.
        async function callMcpWithWelcomeRetry(toolName, args) {
            const result = await callCartaTool(toolName, args);
            if (!result || !result.isError) return result;

            const errorText = (result.content && result.content[0] && result.content[0].text) || '';
            if (!isWelcomeRequiredMessage(errorText) || welcomeCalledThisSession) {
                return result;
            }

            setLoadingStatus('Reconnecting to Carta…');
            welcomeCalledThisSession = true;
            const welcomeResult = await callCartaTool(WELCOME_TOOL, {});
            if (welcomeResult && welcomeResult.isError) {
                const msg = (welcomeResult.content && welcomeResult.content[0] && welcomeResult.content[0].text) || '<no message>';
                throw new Error('Failed to initialize MCP session: ' + msg);
            }

            return await callCartaTool(toolName, args);
        }

        // Lucide chevron-down, which is what Ink's `down-bold` icon maps to, inlined
        // verbatim — the artifact sandbox blocks the Lucide CDN. Ink's Dropdown.Trigger
        // renders it at 16px with a 1.5 stroke on the 24-unit box.
        const CHEVRON_SVG_INNER = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
        const CHECK_SVG = '<svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7.5l3.5 3.5L12 3.5"/></svg>';
        // Ink checkbox glyphs — a check and an indeterminate dash, both 14px strokes
        // sitting on the white box rather than filling it.
        const CHECK_SVG_SMALL = '<svg class="ink-chk-check" viewBox="0 0 12 12" width="14" height="14" fill="none"><path d="M2 6.2l2.6 2.6L10 3.4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        const DASH_SVG = '<svg class="ink-chk-dash" viewBox="0 0 12 12" width="14" height="14" fill="none"><path d="M2.5 6h7" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>';

        // Single source for the switcher. Both the initial page shell and
        // ensureContentSkeleton() render this, so the two can't drift apart.
        function switcherMarkup() {
            return `
                <div class="switcher-row">
                    <div class="fund-switcher" id="fundSwitcher">
                        <span class="switcher-segment" id="fundSwitcherFundPart">
                            <span class="fund-switcher-label" id="fundComboLabel">Fund</span>
                            <div class="combo" id="fundCombo"></div>
                        </span>
                        <span class="switcher-segment">
                            <span class="fund-switcher-label" id="asOfComboLabel">As of</span>
                            <div class="combo" id="asOfCombo"></div>
                        </span>
                    </div>
                    <button type="button" class="ink-btn--ghost" id="resetFilters" hidden>Reset filters</button>
                </div>`;
        }

        // True when anything the Reset button would undo is actually set. A control
        // that's permanently visible but can't do anything is just toolbar noise, so
        // it stays hidden at the default view.
        function viewIsFiltered() {
            return currentFundUuid !== ALL_ENTITIES_VALUE
                || currentAsOfDate !== null
                || filterText !== ''
                || sortCol !== null
                || globalSearchTerm !== '';
        }

        function syncResetFiltersVisibility() {
            const btn = document.getElementById('resetFilters');
            if (!btn) return;
            // A single-fund firm can't reach the firm-wide view, so "reset" has no
            // fund component and the whole control would be misleading.
            btn.hidden = FUNDS.length <= 1 || !viewIsFiltered();
        }

        // Puts the whole toolbar back to how the artifact opens: firm-wide funds,
        // current period, no company filter, default sort. Expansions and the
        // cross-fund search go with it — loadFund clears those anyway, and leaving
        // them behind would contradict "reset".
        function resetFilters() {
            const needsReload = currentFundUuid !== ALL_ENTITIES_VALUE || currentAsOfDate !== null;
            currentAsOfDate = null;
            filterText = '';
            sortCol = null;
            sortDir = 'asc';
            allExpanded = false;
            expandedUnderlying = new Set();
            expandedCompanies = new Set();
            clearTimeout(globalSearchDebounce);
            globalSearchTerm = '';
            globalSearchResults = null;
            globalSearchError = null;
            globalSearchLoading = false;
            if (needsReload) {
                loadFund(ALL_ENTITIES_VALUE);
            } else {
                // Same data, so re-render rather than refetch — but the combos still
                // need re-syncing because the As of value may have moved.
                populateFundSelect();
                render();
            }
        }

        // Idempotent rebuild of contentArea's child structure. Called from every render
        // path so that whatever the prior state was (shimmer, empty, error, populated
        // table), the next render has a clean skeleton to write into. Doing it here
        // rather than only in the cache-miss path means that an empty-fund or error
        // state doesn't permanently destroy the fund switcher — the user can always
        // switch to a different fund.
        function ensureContentSkeleton() {
            if (document.getElementById('tableBody')) return;
            const area = document.getElementById('contentArea');
            area.innerHTML = `
                <div id="switcherMount"></div>
                <div id="metricsContainer"></div>
                <div class="toolbar" id="toolbar">
                    <div class="search-wrapper">
                        <span class="search-icon" id="searchIcon"></span>
                        <input type="text" class="search-input" id="searchInput" placeholder="Filter by company...">
                    </div>
                </div>
                <div class="table-scroll-wrap">
                    <div class="table-scroll">
                        <table>
                            <thead id="tableHead"></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            `;
            document.getElementById('searchIcon').innerHTML = inkIcon('search', 14);
            populateFundSelect();
        }

        // `onRetry`, when given, adds a Try again control that re-runs it.
        function showError(msg, onRetry) {
            // Don't wipe contentArea — the user needs the fund switcher above to escape
            // from an error state. Write the error into the table area only.
            ensureContentSkeleton();
            document.getElementById('metricsContainer').innerHTML = '';
            document.getElementById('tableHead').innerHTML = '';
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            td.colSpan = getColumns().length;
            td.className = 'empty-state error';
            td.textContent = msg;
            if (onRetry) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'retry-link';
                btn.textContent = 'Try again';
                btn.addEventListener('click', onRetry);
                td.append(' ', btn);
            }
            tr.appendChild(td);
            tbody.appendChild(tr);
            showContent();
        }

        function renderEmptyFund() {
            ensureContentSkeleton();
            document.getElementById('metricsContainer').innerHTML = '';
            document.getElementById('tableHead').innerHTML = '';
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = `<tr><td colspan="${getColumns().length}" class="empty-state">This fund has no active investments.</td></tr>`;
            showContent();
        }

        // ── Fetch and render ──

        // Page through the warehouse query until we hit a short page (or the safety cap).
        // Stops as soon as a page returns fewer rows than PAGE_SIZE, which signals we've
        // read the last batch.
        async function fetchAllPages(buildSql) {
            const allRows = [];
            for (let page = 0; page < MAX_PAGES; page++) {
                const result = await callMcpWithWelcomeRetry(CALL_TOOL, {
                    name: 'dwh__execute__query',
                    arguments: { sql: buildSql(page * PAGE_SIZE, PAGE_SIZE) },
                });
                // Parser unwraps { content: [{ text: <markdown> }], isError? }
                // and throws on error envelopes.
                const pageRows = parseDwhQueryResult(result);
                allRows.push(...pageRows);
                if (pageRows.length < PAGE_SIZE) return allRows;
            }
            console.warn(`SOI fetch hit MAX_PAGES (${MAX_PAGES}); results may be truncated at ${MAX_PAGES * PAGE_SIZE} rows.`);
            return allRows;
        }

        // Sort key for vintage-descending order. Funds with no vintage_date sort
        // last (below every dated fund), as a plain-string fallback that is always
        // lexicographically smaller than a real ISO date.
        function vintageSortKey(f) {
            return f.vintage_date || '0000-00-00';
        }

        // Group funds by fund_family_name (present) vs standalone (absent/null).
        // Members within a family, and standalone funds, are each sorted by
        // vintage — most recent first, undated last, then alphabetically.
        function groupFundsByFamily() {
            const families = new Map();
            const standalone = [];
            FUNDS.forEach(f => {
                if (f.fund_family_name) {
                    if (!families.has(f.fund_family_name)) families.set(f.fund_family_name, []);
                    families.get(f.fund_family_name).push(f);
                } else {
                    standalone.push(f);
                }
            });
            const byVintageThenName = (a, b) =>
                vintageSortKey(b).localeCompare(vintageSortKey(a)) || a.name.localeCompare(b.name);
            families.forEach(members => members.sort(byVintageThenName));
            standalone.sort(byVintageThenName);
            return { families, standalone };
        }


        // Fills an empty #switcherMount. Both render paths reach this through
        // populateFundSelect, so the switcher is never half-built.
        function ensureSwitcherMounted() {
            if (document.getElementById('fundCombo')) return;
            const mount = document.getElementById('switcherMount');
            if (!mount) return;
            mount.innerHTML = switcherMarkup();
            // Bound here rather than delegated from document: the switcher is rebuilt
            // wholesale on every skeleton rebuild, so the listener has to come back
            // with it.
            const reset = document.getElementById('resetFilters');
            if (reset) reset.addEventListener('click', resetFilters);
        }

        // ── Combobox ──
        // State per instance, keyed by the mount element's id. Rebuilding the
        // switcher (see ensureContentSkeleton) discards the old DOM, so each
        // combo is re-created from its items rather than resurrected.
        const combos = new Map();

        // A search box on a handful of options is noise; past this it earns its place.
        const COMBO_SEARCH_THRESHOLD = 8;

        function comboSelectedLabel(state) {
            const hit = state.items.find(i => i.value === state.value);
            return hit ? hit.label : '';
        }

        // The multi-select trigger summarises the applied selection as text: the
        // firm-wide label, one fund's name, or the first name plus a count bubble.
        // It reads the *applied* value, not the staged one — the trigger describes
        // what the table below is showing, and staged edits aren't showing anything
        // until Apply.
        function comboSummaryMarkup(state) {
            const label = v => `<span class="combo-trigger-value">${escHtml(v)}</span>`;
            if (!state.value || state.value === ALL_ENTITIES_VALUE) return label(ALL_ENTITIES_LABEL);
            // A family rollup names the family — it's one choice, not N funds, so a
            // count would be describing something the user didn't pick one by one.
            if (state.value.startsWith(FAMILY_PREFIX)) {
                return label(state.value.slice(FAMILY_PREFIX.length));
            }
            const picked = FUNDS.filter(f => selectionFromValue(state.value).has(f.uuid));
            if (!picked.length) return label(ALL_ENTITIES_LABEL);
            const rest = picked.length - 1;
            return label(picked[0].name)
                + (rest > 0 ? `<span class="bub">+${rest}</span>` : '');
        }

        function setCombo(mountId, config) {
            const mount = document.getElementById(mountId);
            if (!mount) return;
            const prev = combos.get(mountId);
            const state = Object.assign({ mountId, query: '', open: false, activeIndex: -1 }, prev, config);
            combos.set(mountId, state);
            renderComboTrigger(state);
            if (state.open) renderComboList(state);
        }

        function renderComboTrigger(state) {
            const mount = document.getElementById(state.mountId);
            if (!mount) return;
            // Both variants are a plain <button>: the multi trigger only ever holds
            // text and a count, so there's nothing nested inside it that would need
            // its own controls (and a <button> can't legally nest in a <button>).
            mount.innerHTML = `
                <button type="button" class="combo-trigger${state.multi ? ' combo-trigger--multi' : ''}"
                        id="${state.mountId}-trigger"
                        aria-haspopup="listbox" aria-expanded="${state.open}"
                        aria-labelledby="${state.labelId} ${state.mountId}-trigger">
                    ${state.multi
                        ? comboSummaryMarkup(state)
                        : `<span class="combo-trigger-value">${escHtml(comboSelectedLabel(state))}</span>`}
                    <span class="combo-chevron">${CHEVRON_SVG_INNER}</span>
                </button>
                <div class="combo-panel" id="${state.mountId}-panel" hidden>
                    ${state.items.length >= COMBO_SEARCH_THRESHOLD ? `
                    <div class="combo-search-wrap">
                        <input type="text" class="combo-search" id="${state.mountId}-search"
                               placeholder="${escHtml(state.searchPlaceholder)}" autocomplete="off"
                               aria-controls="${state.mountId}-list">
                    </div>` : ''}
                    <ul class="combo-list" role="listbox" id="${state.mountId}-list" tabindex="-1"
                        ${state.multi ? 'aria-multiselectable="true"' : ''}
                        aria-labelledby="${state.labelId}"></ul>
                    <div class="combo-footer${state.multi ? ' combo-footer--split' : ''}" id="${state.mountId}-footer"></div>
                </div>`;

            mount.querySelector('.combo-trigger').addEventListener('click', () => toggleCombo(state.mountId));
            mount.querySelector('.combo-trigger').addEventListener('keydown', e => onComboTriggerKey(e, state.mountId));

            const search = mount.querySelector('.combo-search');
            if (search) {
                search.addEventListener('input', e => {
                    const s = combos.get(state.mountId);
                    s.query = e.target.value;
                    s.activeIndex = 0;
                    renderComboList(s);
                });
                search.addEventListener('keydown', e => onComboPanelKey(e, state.mountId));
            }
            mount.querySelector('.combo-list').addEventListener('keydown', e => onComboPanelKey(e, state.mountId));
        }

        // The fund uuids an option stands for: itself for a plain fund, every member
        // for a family rollup, and none for All Entities — which clears the selection
        // rather than adding to it.
        function comboItemUuids(item) {
            if (item.value === ALL_ENTITIES_VALUE) return [];
            if (item.value.startsWith(FAMILY_PREFIX)) return pooledFunds(item.value).map(f => f.uuid);
            return [item.value];
        }

        // 'checked' | 'mixed' | 'empty'. A family row reports mixed when only some of
        // its members are ticked, which is what earns it the indeterminate dash.
        function comboItemSelectState(state, item) {
            if (item.value === ALL_ENTITIES_VALUE) {
                // Firm-wide is a plain roll-up of the rows beneath it: checked when
                // every fund is, mixed the moment one is dropped, empty when none
                // are. Nothing special-cased — untick a fund and this follows.
                const n = state.selection.size;
                if (n === 0) return 'empty';
                return n === FUNDS.length ? 'checked' : 'mixed';
            }
            const uuids = comboItemUuids(item);
            const hits = uuids.filter(u => state.selection.has(u)).length;
            if (!hits) return 'empty';
            return hits === uuids.length ? 'checked' : 'mixed';
        }

        function comboCheckboxMarkup(state, item) {
            const sel = comboItemSelectState(state, item);
            const cls = sel === 'checked' ? ' is-checked' : (sel === 'mixed' ? ' is-mixed' : '');
            // Exactly one glyph goes in the box. Emitting both and toggling opacity
            // puts two 14px children in a 20px flex box, so centering centres the
            // pair and the visible glyph sits off to one side.
            const glyph = sel === 'checked' ? CHECK_SVG_SMALL : (sel === 'mixed' ? DASH_SVG : '');
            return `<span class="ink-chk${cls}">
                <input type="checkbox" tabindex="-1" ${sel === 'checked' ? 'checked' : ''}
                       aria-hidden="true">
                <span class="ink-chk-box">${glyph}</span>
            </span>`;
        }

        // An item survives filtering on its own text, and a family's members stay
        // visible when the family name matches (and vice versa) so a matched group
        // never renders as a header with nothing under it.
        function comboVisibleItems(state) {
            const q = state.query.trim().toLowerCase();
            if (!q) return state.items;
            const matches = i => (i.label + ' ' + (i.meta || '')).toLowerCase().includes(q);
            const matchedGroups = new Set(state.items.filter(i => i.isFamily && matches(i)).map(i => i.label));
            return state.items.filter(i =>
                matches(i) ||
                (i.groupName && matchedGroups.has(i.groupName)) ||
                (i.isFamily && state.items.some(c => c.groupName === i.label && matches(c))));
        }

        function renderComboList(state) {
            const list = document.getElementById(state.mountId + '-list');
            const footer = document.getElementById(state.mountId + '-footer');
            if (!list) return;
            const visible = comboVisibleItems(state);

            if (!visible.length) {
                list.innerHTML = `<li class="combo-empty">No ${escHtml(state.unit.toLowerCase())} match “${escHtml(state.query)}”.</li>`;
            } else {
                list.innerHTML = visible.map((item, idx) => {
                    const cls = ['combo-option'];
                    if (item.value === ALL_ENTITIES_VALUE) cls.push('is-all');
                    if (item.isFamily) cls.push('is-family');
                    if (item.groupName) cls.push('is-member');
                    if (idx === state.activeIndex) cls.push('active');
                    const control = state.multi
                        ? comboCheckboxMarkup(state, item)
                        : `<span class="combo-check">${CHECK_SVG}</span>`;
                    return `<li class="${cls.join(' ')}" role="option" id="${state.mountId}-opt-${idx}"
                                aria-selected="${state.multi ? comboItemSelectState(state, item) === 'checked' : item.value === state.value}"
                                data-value="${escHtml(item.value)}">
                        ${control}
                        <span class="combo-option-label">${escHtml(item.label)}</span>
                        ${item.meta ? `<span class="combo-meta">${escHtml(item.meta)}</span>` : ''}
                    </li>`;
                }).join('');
                list.querySelectorAll('.combo-option').forEach(li => {
                    li.addEventListener('click', e => {
                        if (state.multi) {
                            // Toggling re-renders the list, which detaches this <li>.
                            // The document-level click-outside handler runs after
                            // that and would see a target no longer inside the mount
                            // — closing the panel on every tick. Stop here instead:
                            // a click inside the panel is never an outside click.
                            e.stopPropagation();
                            toggleComboValue(state.mountId, li.dataset.value);
                        } else {
                            chooseComboValue(state.mountId, li.dataset.value);
                        }
                    });
                });
            }

            if (footer) {
                if (state.multi) {
                    const n = state.selection.size;
                    const next = canonicalSelectionValue(state.selection);
                    // Nothing ticked has nothing to show, and a selection identical
                    // to what's on screen has nothing to do — Apply is dead in both
                    // cases. The count is dropped at zero because "Apply (0)" reads
                    // like a broken button.
                    const canApply = next !== null && next !== state.value;
                    footer.innerHTML = `
                        <button type="button" class="combo-clear-all" ${n === 0 ? 'disabled' : ''}>Clear all</button>
                        <button type="button" class="ink-btn--primary combo-apply" ${canApply ? '' : 'disabled'}>
                            Apply${n > 0 ? ` (${n})` : ''}
                        </button>`;
                    const clear = footer.querySelector('.combo-clear-all');
                    if (clear) clear.addEventListener('click', e => {
                        e.stopPropagation();   // same detach-then-close trap as the options
                        clearComboSelection(state.mountId);
                    });
                    const apply = footer.querySelector('.combo-apply');
                    if (apply) apply.addEventListener('click', e => {
                        e.stopPropagation();
                        applyComboSelection(state.mountId);
                    });
                } else {
                    // The ratio only says something while filtering; unfiltered it would
                    // print the same number twice and read as static chrome.
                    footer.textContent = visible.length === state.items.length
                        ? `${state.items.length} ${state.unit}`
                        : `${visible.length} of ${state.items.length} ${state.unit}`;
                }
            }
            const active = list.querySelector('.combo-option.active');
            if (active) {
                active.scrollIntoView({ block: 'nearest' });
                const input = document.getElementById(state.mountId + '-search');
                if (input) input.setAttribute('aria-activedescendant', active.id);
            }
        }

        function openCombo(mountId) {
            combos.forEach((s, id) => { if (id !== mountId && s.open) closeCombo(id, false); });
            const state = combos.get(mountId);
            if (!state) return;
            state.open = true;
            state.query = '';
            // Start staging from what's actually applied, so a panel reopened after
            // a dismissed edit shows the loaded view rather than the abandoned one.
            if (state.multi) state.selection = selectionFromValue(state.value);
            const visible = comboVisibleItems(state);
            state.activeIndex = Math.max(0, visible.findIndex(i => i.value === state.value));
            const panel = document.getElementById(mountId + '-panel');
            const trigger = document.getElementById(mountId + '-trigger');
            panel.hidden = false;
            trigger.setAttribute('aria-expanded', 'true');
            alignComboPanel(panel);
            renderComboList(state);
            const search = document.getElementById(mountId + '-search');
            if (search) { search.value = ''; search.focus(); } else { document.getElementById(mountId + '-list').focus(); }
        }

        function closeCombo(mountId, refocus) {
            const state = combos.get(mountId);
            if (!state || !state.open) return;
            state.open = false;
            const panel = document.getElementById(mountId + '-panel');
            const trigger = document.getElementById(mountId + '-trigger');
            if (panel) panel.hidden = true;
            if (trigger) {
                trigger.setAttribute('aria-expanded', 'false');
                if (refocus) trigger.focus();
            }
            // Apply is the only way to commit, so any other close discards whatever
            // was staged. applyComboSelection calls this too — it reads the staged
            // value before closing, so the discard here is a no-op for that path.
            discardComboSelection(mountId);
        }

        function toggleCombo(mountId) {
            const state = combos.get(mountId);
            if (state && state.open) closeCombo(mountId, true); else openCombo(mountId);
        }

        function chooseComboValue(mountId, value) {
            const state = combos.get(mountId);
            if (!state) return;
            closeCombo(mountId, true);
            if (value === state.value) return;
            state.value = value;
            renderComboTrigger(state);
            state.onChange(value);
        }

        // Ticks or unticks an option without closing the panel — picking several
        // funds is the whole point, so the menu has to survive each click. Nothing
        // is fetched until Apply: every commit refetches from the warehouse, and
        // reloading five times while someone assembles a five-fund view is waste.
        function toggleComboValue(mountId, value) {
            const state = combos.get(mountId);
            if (!state) return;
            const item = state.items.find(i => i.value === value);
            if (!item) return;

            if (value === ALL_ENTITIES_VALUE) {
                // Select-all behaviour: anything short of complete fills in the rest,
                // so getting back to the whole firm never means hunting down the one
                // fund you unticked. Only a fully-checked row clears.
                const complete = comboItemSelectState(state, item) === 'checked';
                state.selection = complete ? new Set() : new Set(FUNDS.map(f => f.uuid));
            } else {
                const uuids = comboItemUuids(item);
                // A family row moves all of its members together: partially selected
                // or empty, it fills in; fully selected, it clears.
                const turnOn = comboItemSelectState(state, item) !== 'checked';
                uuids.forEach(u => turnOn ? state.selection.add(u) : state.selection.delete(u));
            }

            // Only the list and footer move: the trigger reports the applied value,
            // which staging hasn't changed. Leaving the trigger alone also keeps the
            // panel's DOM (and the focused search box) intact.
            renderComboList(state);
        }

        function clearComboSelection(mountId) {
            const state = combos.get(mountId);
            if (!state || !state.selection.size) return;
            state.selection.clear();
            renderComboList(state);
        }

        // Applies the staged selection and closes. The only path that commits.
        function applyComboSelection(mountId) {
            const state = combos.get(mountId);
            if (!state || !state.multi) return;
            const next = canonicalSelectionValue(state.selection);
            // No funds ticked has no view to show. Apply is disabled in that state;
            // this is the guard for a keyboard or programmatic route past the button.
            if (next === null) return;
            const changed = next !== state.value;
            // Promote the staged value *before* closing: closeCombo discards back to
            // state.value, which would otherwise undo the very selection being
            // applied. With the new value in place that discard is a no-op.
            state.value = next;
            closeCombo(mountId, true);
            if (!changed) return;
            renderComboTrigger(state);
            state.onChange(next);
        }

        // Flips the panel when it would otherwise run past the right edge.
        function alignComboPanel(panel) {
            const rect = panel.getBoundingClientRect();
            panel.classList.toggle('align-right', rect.right > window.innerWidth - 8);
        }

        // Throws away staged ticks, putting the panel back in step with what's
        // actually loaded. Called on every close that isn't an Apply, so dismissing
        // the panel never silently changes the view.
        function discardComboSelection(mountId) {
            const state = combos.get(mountId);
            if (!state || !state.multi) return;
            state.selection = selectionFromValue(state.value);
        }

        function onComboTriggerKey(e, mountId) {
            if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openCombo(mountId);
            }
        }

        function onComboPanelKey(e, mountId) {
            const state = combos.get(mountId);
            if (!state) return;
            const visible = comboVisibleItems(state);
            if (e.key === 'Escape') {
                e.preventDefault();
                closeCombo(mountId, true);
            } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (!visible.length) return;
                const step = e.key === 'ArrowDown' ? 1 : -1;
                state.activeIndex = (state.activeIndex + step + visible.length) % visible.length;
                renderComboList(state);
            } else if (e.key === 'Enter'
                       || (e.key === ' ' && state.multi && !e.target.classList.contains('combo-search'))) {
                // Space toggles the active row, but not while the search box has
                // focus — fund names have spaces in them, and swallowing the key
                // there would make the filter untypeable.
                e.preventDefault();
                const item = visible[state.activeIndex];
                if (!item) return;
                if (state.multi) toggleComboValue(mountId, item.value);
                else chooseComboValue(mountId, item.value);
            } else if (e.key === 'Tab') {
                closeCombo(mountId, false);
            }
        }

        document.addEventListener('click', e => {
            combos.forEach((state, id) => {
                if (!state.open) return;
                const mount = document.getElementById(id);
                if (mount && !mount.contains(e.target)) closeCombo(id, false);
            });
        });

        // Vintage year as the option's trailing metadata. Fund size isn't part of
        // the injected fund list, so the year is all we can show truthfully.
        function fundMeta(f) {
            return f.vintage_date ? String(f.vintage_date).slice(0, 4) : '';
        }

        function populateFundSelect() {
            ensureSwitcherMounted();
            if (!document.getElementById('fundCombo')) return;

            const items = [];

            // "All Entities" only makes sense with more than one fund to combine.
            if (FUNDS.length > 1) {
                items.push({ value: ALL_ENTITIES_VALUE, label: ALL_ENTITIES_LABEL });
            }

            const { families, standalone } = groupFundsByFamily();

            // Build one unified, orderable list of dropdown entries — a fund family
            // is positioned by its most-recent member's vintage — then sort the
            // whole list together so the dropdown reads most-recent-vintage-first
            // end to end, not "all families, then all standalone funds."
            const entries = [];
            families.forEach((members, name) => {
                entries.push({ kind: 'family', name, members, sortKey: vintageSortKey(members[0]) });
            });
            standalone.forEach(f => {
                entries.push({ kind: 'fund', fund: f, sortKey: vintageSortKey(f) });
            });
            entries.sort((a, b) => b.sortKey.localeCompare(a.sortKey));

            entries.forEach(entry => {
                if (entry.kind === 'family') {
                    if (entry.members.length > 1) {
                        // The family name is itself a selectable rollup option, not a
                        // header — choosing it pools every member fund.
                        items.push({ value: FAMILY_PREFIX + entry.name, label: entry.name, isFamily: true });
                        entry.members.forEach(f => items.push({
                            value: f.uuid, label: f.name, meta: fundMeta(f), groupName: entry.name,
                        }));
                    } else {
                        // A family of one fund has nothing to pool, so it reads as a plain fund.
                        entry.members.forEach(f => items.push({ value: f.uuid, label: f.name, meta: fundMeta(f) }));
                    }
                } else {
                    items.push({ value: entry.fund.uuid, label: entry.fund.name, meta: fundMeta(entry.fund) });
                }
            });

            setCombo('fundCombo', {
                items,
                value: currentFundUuid,
                selection: selectionFromValue(currentFundUuid),
                multi: true,
                labelId: 'fundComboLabel',
                unit: 'funds',
                searchPlaceholder: 'Search funds',
                onChange: switchFund,
            });

            // Only the Fund dropdown hides for a single-fund firm — the As of
            // dropdown is always relevant, regardless of fund count.
            const fundPart = document.getElementById('fundSwitcherFundPart');
            if (fundPart) fundPart.hidden = FUNDS.length <= 1;

            populateAsOfSelect();
            // Fund and As of both feed viewIsFiltered, and neither goes through
            // render() when it changes — the reload path rebuilds the switcher.
            syncResetFiltersVisibility();
        }

        // Builds the last N quarter-end dates (most recent completed quarter first)
