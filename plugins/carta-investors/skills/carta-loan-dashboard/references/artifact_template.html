<!DOCTYPE html>
<!-- This block carries CONFIG — the Carta connector display name, the resolved table
     and column names, and the firm label. Rows are fetched live when the artifact
     opens. The MCP allowlist is passed as `capabilities.mcp` on the Artifact publish.

     IMPORTANT: before substituting the placeholder below, escape the JSON with JSON unicode escapes:
     < -> \u003c   > -> \u003e   & -> \u0026   ' -> \u0027
     Use \uXXXX (NOT HTML entities like &lt; — a <script> block is raw text, so entities are
     not decoded and would corrupt the value). A raw </script> in any string value
     (a firm name) would close this block early and inject HTML (stored XSS).
     JSON.parse decodes \uXXXX back, so the config is unchanged. -->

<script type="application/json" id="loan-data">__LOAN_DATA__</script>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Portfolio Dashboard</title>
  <!-- Inter loader. tokens.css names Inter but does not @font-face it, so without this the
       body silently falls back to system-ui — and the rule is never to name a face you do
       not load. fonts.googleapis.com is inside the claude.ai artifact CSP; rsms.me is not.
       The variable font carries tabular-nums, which every figure column depends on. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- EB Garamond stands in for SangBleu Versailles, Carta's brand serif, which is not
       licensed for distribution outside Carta environments and so cannot be vendored into
       a shared artifact. On a staff machine SangBleu wins; everywhere else the title still
       reads as an editorial serif rather than dropping to Georgia. Same choice as carta-soi. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=EB+Garamond:wght@400;500;600&display=swap">
  <style>
    :root {
      color-scheme: light dark;

      /* Text */
      --ink-color-global-text-default:                light-dark(#1A1A1A, #EDEDED);
      --ink-color-global-text-subtle:                 light-dark(#656B6B, #A7AAAA);

      /* Surfaces */
      --ink-color-global-surface-background-default:  light-dark(#FFFFFF, rgb(18 18 18));
      --ink-color-global-surface-background-underlay: light-dark(#F1F1F1, #2D2D2D);

      /* Borders */
      --ink-color-global-border-subtle:               light-dark(#DEDFDF, #2D2D2D);
      --ink-color-global-border-default:              light-dark(#A7AAAA, #656B6B);

      /* Primary action — inverts for dark, so a fill reads on both themes */
      --ink-button-background-color-primary-base-default: light-dark(#1A1A1A, #FFFFFF);

      /* Links */
      --ink-color-global-link-default:                light-dark(#285DA3, #8BABD6);
      --ink-color-global-link-hover:                  light-dark(#1A3E6D, #4176BC);

      /* Semantic */
      --ink-color-global-feedback-info-subtle:        light-dark(#EAF0F8, #122948);
      --ink-color-global-feedback-info-strong:        light-dark(#285DA3, #2C67B5);

      /* Elevation */
      --ink-elevation-global-shadow-small:            0 4px 12px 0 rgb(0 0 0 / 0.08);

      /* Typography */
      --ink-font-global-family-prominent:             "SangBleu Versailles", "EB Garamond", Georgia, serif;
      --ink-font-global-size-display-1:               28px;
      --ink-font-global-leading-display-1:            48px;
      --ink-font-global-weight-heading-1:             400;

      /* Radius */
      --ink-size-global-radius-flat:                  0;
      --ink-size-global-radius-subtle:                4px;

      /* Three-step emphasis on a loan row: stripe → hover → selected, each step darker
         in light and lighter in dark. Both steps are mixed off the primary token, which
         inverts per theme, so the ramp holds in both directions.
         Why not a smaller hover step: the stripe token is NOT a consistent mix across
         themes — #F1F1F1 is ~6% black over white, #2D2D2D is ~11% white over the page —
         so a percentage that clears the stripe in light can sit under it in dark. Both
         steps therefore start above the higher of the two. */
      --row-hover:    color-mix(in srgb, var(--ink-button-background-color-primary-base-default) 16%, var(--ink-color-global-surface-background-default));
      --row-selected: color-mix(in srgb, var(--ink-button-background-color-primary-base-default) 24%, var(--ink-color-global-surface-background-default));

      --space-s: 8px;
      --space-m: 16px;
      --space-l: 24px;
      --space-xl: 32px;
    }

    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"]  { color-scheme: dark; }

    * { box-sizing: border-box; }

    body {
      background: var(--ink-color-global-surface-background-default);
      color: var(--ink-color-global-text-default);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: 14px;
      margin: 0;
    }

    /* The header stack sits on the page background — never carded. */
    .page {
      margin: 0 auto;
      max-width: 1200px;
      padding: var(--space-xl) var(--space-l);
    }

    .logo { color: var(--ink-color-global-text-default); display: block; }

    h1 {
      font-family: var(--ink-font-global-family-prominent);
      font-size: var(--ink-font-global-size-display-1);
      font-weight: var(--ink-font-global-weight-heading-1);
      line-height: var(--ink-font-global-leading-display-1);
      margin: var(--space-m) 0 0;
    }

    h2 {
      font-size: 18px;
      font-weight: 500;
      margin: var(--space-xl) 0 var(--space-m);
    }

    .scope {
      color: var(--ink-color-global-text-subtle);
      margin: 0 0 var(--space-l);
    }

    .controls {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-m);
      margin: 0 0 var(--space-l);
    }

    .field { align-items: center; display: flex; gap: var(--space-s); }

    /* `hidden` sets display:none from the UA sheet, which ANY author display rule beats on
       specificity — so .field's display:flex silently re-showed the element and the
       currency picker rendered even when it held one option. */
    [hidden] { display: none !important; }

    .field label { color: var(--ink-color-global-text-subtle); }

    /* The currency selector is not just another filter like Lender or Payment window —
       it decides which loans exist on screen at all. It sits on its own line, and the
       prominence lives on the <select> itself (below) rather than a card wrapper around
       it — the label just carries the same info-blue so the two read as one unit. */
    .field.currency-field {
      margin: 0 0 var(--space-l);
    }

    .field.currency-field label {
      color: var(--ink-color-global-feedback-info-strong);
      font-weight: var(--ink-font-global-weight-heading-1, 600);
    }

    /* The <select> itself carries the emphasis: a light-blue fill and blue border, the
       same info color as the banner above it, so the control reads as a scope-changer
       on sight — not just another bordered dropdown in a row of filters. */
    .currency-field select {
      background-color: var(--ink-color-global-feedback-info-subtle);
      border-color: var(--ink-color-global-feedback-info-strong);
      color: var(--ink-color-global-feedback-info-strong);
      font-weight: 700;
    }

    .currency-field select:hover { border-color: var(--ink-color-global-feedback-info-strong); }

    /* Same chevron as every other select, recolored to match the info-blue fill instead
       of the default neutral gray. */
    .currency-field select {
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23285DA3' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
    }

    /* Ink's own Alert/Banner recipe: a flat, tinted "info" surface — no border, no
       radius, no shadow — rather than a bordered card competing with the KPI tiles for
       the same visual language. Every tile, the loan table and the panel all change
       when the currency switches, so this has to be legible before a reader touches
       the dropdown below. */
    .currency-banner {
      align-items: center;
      background: var(--ink-color-global-feedback-info-subtle);
      border: 0;
      border-radius: 0;
      display: flex;
      gap: var(--space-m);
      margin: 0 0 var(--space-m);
      padding: var(--space-m);
    }

    .currency-banner-icon {
      align-items: center;
      background: var(--ink-color-global-feedback-info-strong);
      border-radius: 50%;
      color: #FFFFFF; /* not yet tokenized: white reads on both the light- and dark-mode blue fill */
      display: flex;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 700;
      height: 28px;
      justify-content: center;
      width: 28px;
    }

    .currency-banner-text { color: var(--ink-color-global-text-default); line-height: 1.5; }
    .currency-banner-text strong { color: var(--ink-color-global-feedback-info-strong); font-weight: 700; }

    select,
    input[type="search"] {
      background: var(--ink-color-global-surface-background-default);
      border: 1px solid var(--ink-color-global-border-default);
      border-radius: var(--ink-size-global-radius-subtle);
      color: var(--ink-color-global-text-default);
      font: inherit;
      line-height: 20px;
      padding: 6px var(--space-s);
    }

    /* The native control ignores the tokens, so the chevron is drawn as a
       currentColor SVG that follows the theme. */
    select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23656B6B' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
      background-position: right var(--space-s) center;
      background-repeat: no-repeat;
      padding-right: 28px;
    }

    select:hover,
    input[type="search"]:hover { border-color: var(--ink-color-global-text-subtle); }

    select:focus-visible,
    input[type="search"]:focus-visible {
      border-color: var(--ink-button-background-color-primary-base-default);
      outline: 2px solid var(--ink-button-background-color-primary-base-default);
      outline-offset: 1px;
    }

    input[type="search"] { min-width: 220px; }

    .hint,
    .status {
      color: var(--ink-color-global-text-subtle);
      margin: 0 0 var(--space-m);
    }

    /* Four up, not auto-fit: the tile count varies (5 without obligations, 8 with),
       and auto-fit split 8 into a 5/3 row that read as two unrelated groups. A fixed
       four keeps every row full and the payment tiles on a line of their own. */
    /* A shimmering skeleton, not an empty frame: the fetch is several seconds and a blank
       page reads as broken. Mirrors the real tile and row geometry so nothing jumps when
       the data lands. */
    @keyframes shimmer { to { background-position: 200% 0; } }

    .skeleton {
      animation: shimmer 1.4s linear infinite;
      background: linear-gradient(
        90deg,
        var(--ink-color-global-surface-background-underlay) 25%,
        light-dark(#E8E8E8, #3A3A3A) 37%,
        var(--ink-color-global-surface-background-underlay) 63%);
      background-size: 200% 100%;
      border-radius: var(--ink-size-global-radius-subtle);
      height: 12px;
    }

    .skeleton-tile { height: 76px; }
    .skeleton-cell { height: 12px; margin: 6px 0; }

    /* Staggered widths, so the block reads as text rather than as a progress bar. */
    .skeleton-cell:nth-child(3n)   { width: 62%; }
    .skeleton-cell:nth-child(3n+1) { width: 84%; }
    .skeleton-cell:nth-child(3n+2) { width: 71%; }

    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
    }

    /* Determinate while the row count is known, indeterminate before it is — the loans
       query reports a total, the ones before it do not. */
    .progress {
      background: var(--ink-color-global-surface-background-underlay);
      border-radius: var(--ink-size-global-radius-subtle);
      height: 3px;
      margin: 0 0 var(--space-m);
      overflow: hidden;
    }

    .progress-fill {
      background: var(--ink-button-background-color-primary-base-default);
      height: 100%;
      transition: width 180ms ease;
      width: 0;
    }

    .progress-fill.indeterminate {
      animation: progress-slide 1.1s ease-in-out infinite;
      width: 34%;
    }

    @keyframes progress-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(392%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill.indeterminate { animation: none; width: 100%; opacity: 0.4; }
    }

    .kpis {
      display: grid;
      gap: var(--space-m);
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin: 0 0 var(--space-xl);
    }

    @media (max-width: 900px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      .kpis { grid-template-columns: 1fr; }
    }

    .tile {
      background: light-dark(var(--ink-color-global-surface-background-default), var(--ink-color-global-surface-background-underlay));
      border: 1px solid var(--ink-color-global-border-subtle);
      border-radius: var(--ink-size-global-radius-flat);
      box-shadow: var(--ink-elevation-global-shadow-small);
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: var(--space-m);
    }

    .tile-label {
      color: var(--ink-color-global-text-subtle);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .tile-value {
      font-size: 24px;
      font-variant-numeric: tabular-nums;
    }

    .tile-sub,
    .tile-note {
      color: var(--ink-color-global-text-subtle);
      font-size: 12px;
    }

    .table-wrap {
      border: 1px solid var(--ink-color-global-border-subtle);
      border-radius: var(--ink-size-global-radius-flat);
      max-height: 70vh;
      overflow: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th,
    td {
      padding: 10px var(--space-m);
      text-align: left;
    }

    /* Sticky header, so the columns survive scrolling a whole portfolio. */
    thead th {
      background: var(--ink-color-global-surface-background-default);
      border-bottom: 1px solid var(--ink-color-global-border-default);
      color: var(--ink-color-global-text-subtle);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      position: sticky;
      text-transform: uppercase;
      top: 0;
      white-space: nowrap;
      z-index: 1;
    }

    th.sortable { cursor: pointer; user-select: none; }

    /* The caret is an Ink glyph rendered into the cell, not a ::after character. */
    th.sortable .sort-indicator {
      color: var(--ink-color-global-text-subtle);
      margin-left: 4px;
    }

    th.sortable[aria-sort="ascending"] .sort-indicator,
    th.sortable[aria-sort="descending"] .sort-indicator {
      color: var(--ink-color-global-text-default);
    }

    tbody tr:nth-child(even) { background: var(--ink-color-global-surface-background-underlay); }

    tbody td { border-bottom: 1px solid var(--ink-color-global-border-subtle); }

    .num {
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    /* The name is the control. Styled as a link because that is what a clickable entity
       name reads as, but it is a button: it opens a dialog rather than navigating. */
    .loan-name {
      background: none;
      border: 0;
      color: inherit;
      cursor: pointer;
      font: inherit;
      max-width: 100%;
      overflow: hidden;
      padding: 0;
      text-align: left;
      text-decoration: underline;
      text-decoration-color: var(--ink-color-global-border-default);
      text-overflow: ellipsis;
      text-underline-offset: 3px;
      white-space: nowrap;
    }

    .loan-name:hover,
    .loan-name:focus-visible {
      color: var(--ink-button-background-color-primary-base-default);
      text-decoration-color: currentColor;
    }

    /* Ink glyphs are inline SVG, not text: a Unicode arrow re-renders on every platform
       and shifts with the font, where a vector is identical everywhere. */
    .ink-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .ink-icon svg { display: block; }

    .visually-hidden {
      clip-path: inset(50%);
      height: 1px;
      overflow: hidden;
      position: absolute;
      white-space: nowrap;
      width: 1px;
    }


    /* A link is one of the two surfaces Ink gives a hover state, so it gets one. The
       underline takes currentColor: a link's rule belongs in the link's own colour. */
    .loan-link {
      color: var(--ink-color-global-link-default);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .loan-link:hover { color: var(--ink-color-global-link-hover); }

    /* Names get room and stay on one line rather than wrapping the row open. */
    .name {
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    tfoot td {
      background: var(--ink-color-global-surface-background-default);
      bottom: 0;
      border-top: 2px solid var(--ink-color-global-border-default);
      font-weight: 500;
      position: sticky;
    }

    .empty-row td {
      color: var(--ink-color-global-text-subtle);
      padding: var(--space-l);
      text-align: center;
    }


    /* Utilization reads as a figure first and a bar second: the number ties out, the
       bar is what makes the column scannable down its length. */
    .util {
      align-items: center;
      display: flex;
      gap: var(--space-s);
      justify-content: flex-end;
    }

    .util-figure {
      font-variant-numeric: tabular-nums;
      min-width: 4ch;
      text-align: right;
    }

    /* Translucent, not a flat token: the zebra stripe IS the underlay colour, so a solid
       track vanished on every other row and the bar lost its extent. */
    .util-track {
      background: color-mix(in srgb, var(--ink-color-global-text-subtle) 22%, transparent);
      height: 8px;
      overflow: hidden;
      width: 72px;
    }

    /* The same fill as the load progress bar, so the page's two bars read as one system.
       Utilization is a magnitude, not a verdict — a semantic "positive" green would say
       a heavily drawn loan is good news. */
    /* display:block is load-bearing, not tidiness: the fill is a span, and width has no
       effect on a non-replaced inline element, so the bar rendered 0px wide at every
       percentage. The track escapes this only because it is a flex item of .util. */
    .util-fill {
      background: var(--ink-button-background-color-primary-base-default);
      display: block;
      height: 100%;
    }

    .util-empty { color: var(--ink-color-global-text-subtle); }

    /* Hover belongs to things that respond to a click. Per Ink, a surface only gets a
       hover state when it is a button or link — the drawer's fact sections are read-only
       and deliberately have none, or they would promise a click that does nothing. */
    .loan-row { cursor: pointer; }

    .loan-row:hover td { background: var(--row-hover); }

    .tab:hover { color: var(--ink-color-global-text-default); }

    /* Selection cannot borrow the zebra colour: a selected odd row then looked exactly
       like an unselected even row, so the panel appeared to describe no row in
       particular. Painted on the cells, and declared after the hover rule of equal
       specificity, so a selected row stays selected-looking under the cursor. */
    .loan-row.is-open td { background: var(--row-selected); }

    /* The bar is what actually reads as "this one" — it does not depend on the row's
       parity, and this palette is greyscale, so a tint alone is always a fine distinction.
       Inset shadow rather than border-left: a border would shift the cell's contents. */
    .loan-row.is-open td:first-child {
      box-shadow: inset 3px 0 0 0 var(--ink-button-background-color-primary-base-default);
    }

    /* The details slide in from the right rather than pushing the table apart. An inline
       expansion put six sections between one row and the next, so the reader lost their
       place in the list; the panel leaves the list standing and overlays it. */
    /* visibility, not `hidden`: display:none has no start state to animate from, so the
       attribute would make the panel appear and vanish instantly. Delaying visibility by
       the transform duration lets it slide out before it leaves the a11y tree. */
    .panel {
      background: var(--ink-color-global-surface-background-default);
      border-left: 1px solid var(--ink-color-global-border-subtle);
      bottom: 0;
      box-shadow: -8px 0 24px 0 rgb(0 0 0 / 0.12);
      display: flex;
      flex-direction: column;
      max-width: 100%;
      position: fixed;
      right: 0;
      top: 0;
      transform: translateX(100%);
      transition: transform 220ms cubic-bezier(0.2, 0, 0, 1), visibility 0s linear 220ms;
      visibility: hidden;
      width: min(560px, 100%);
      z-index: 21;
    }

    .panel.is-open {
      transform: translateX(0);
      transition: transform 220ms cubic-bezier(0.2, 0, 0, 1), visibility 0s;
      visibility: visible;
    }

    /* The panel overlays the table, and only reserves width where the WHOLE table still
       fits beside it. Reserving below that threshold is worse than overlaying: it pushes
       the same money columns into the table's own horizontal scroll — so they are no
       more visible than before — while squeezing the KPI tiles until their labels wrap.
       The table needs ~1046px, so the threshold is that plus the panel and the gutters. */
    .page { transition: padding-right 220ms cubic-bezier(0.2, 0, 0, 1); }

    @media (min-width: 1700px) {
      body.has-panel .page { padding-right: calc(560px + var(--space-l)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .page { transition: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .panel { transition: none; }
    }

    .panel-head {
      align-items: flex-start;
      border-bottom: 1px solid var(--ink-color-global-border-subtle);
      display: flex;
      gap: var(--space-m);
      justify-content: space-between;
      padding: var(--space-l);
    }

    .panel-heading { min-width: 0; }

    .panel-title {
      font-family: var(--ink-font-global-family-prominent);
      font-size: 20px;
      font-weight: var(--ink-font-global-weight-heading-1);
      line-height: 28px;
      margin: 0;
    }

    .panel-title-row {
      align-items: baseline;
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-s);
    }

    .panel-ccy {
      border: 1px solid var(--ink-color-global-border-subtle);
      color: var(--ink-color-global-text-subtle);
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 1px 6px;
      text-transform: uppercase;
    }

    .panel-sub {
      color: var(--ink-color-global-text-subtle);
      margin: 4px 0 0;
    }

    /* Drawn as a glyph rather than a character so it renders identically everywhere. */
    .panel-close {
      background: none;
      border: 1px solid transparent;
      border-radius: var(--ink-size-global-radius-subtle);
      color: var(--ink-color-global-text-subtle);
      cursor: pointer;
      flex-shrink: 0;
      font: inherit;
      line-height: 0;
      padding: 6px;
    }

    .panel-close:hover {
      border-color: var(--ink-color-global-border-default);
      color: var(--ink-color-global-text-default);
    }

    .panel-link { margin: var(--space-s) 0 0; }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-l);
    }

    /* One column: the panel is narrow and tall, and a two-up grid at this width put the
       fact lists back into the squeeze that made labels wrap. */
    .drawer-grid {
      display: grid;
      gap: var(--space-m);
      grid-template-columns: 1fr;
    }

    /* Each group of facts is a card, matching the KPI tile surface so the drawer and
       the header read as one system. The hover tints the border only — no lift and no
       pointer cursor, because nothing in here is clickable. */
    /* The four figures a reader opens the panel for, at display size. Everything below is
       reference and stays at body size, which is the hierarchy the six equal cards lacked. */
    /* Rows get more air than columns: two rows of large figures ran together at an even
       gap, which is what made the band feel tight. */
    .panel-summary {
      display: grid;
      gap: var(--space-l) var(--space-m);
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin: 0 0 var(--space-l);
    }

    .sum {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .sum-label {
      color: var(--ink-color-global-text-subtle);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .sum-value {
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      line-height: 28px;
    }

    .sum-note {
      color: var(--ink-color-global-text-subtle);
      font-size: 12px;
      line-height: 16px;
    }

    /* Flat: a hairline and space, not a card. The panel is already a bordered, shadowed
       surface — boxing each group inside it was a container within a container, and the
       chrome alone ran to a quarter of the panel's height. */
    .drawer-grid > section {
      border-top: 1px solid var(--ink-color-global-border-subtle);
      padding-top: var(--space-m);
    }

    .drawer-grid > section:first-child {
      border-top: 0;
      padding-top: 0;
    }

    /* Composition, folded down from a section to one line. */
    .drawer-inline {
      color: var(--ink-color-global-text-subtle);
      margin: var(--space-s) 0 0;
    }

    .drawer h3 {
      font-size: 12px;
      letter-spacing: 0.04em;
      margin: 0 0 var(--space-s);
      text-transform: uppercase;
      color: var(--ink-color-global-text-subtle);
    }

    .drawer dl {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px var(--space-m);
      margin: 0;
    }

    .drawer dt { color: var(--ink-color-global-text-subtle); }

    /* Right-aligned, so the decimal points line up down the column. Left-aligned, every
       figure started at the same x and its decimal landed somewhere different. */
    .drawer dd {
      font-variant-numeric: tabular-nums;
      margin: 0;
      text-align: right;
    }

    .drawer dl .balance-total { font-weight: 600; }

    .drawer-table { border: 1px solid var(--ink-color-global-border-subtle); }

    .drawer-table th,
    .drawer-table td { padding: 6px var(--space-m); }

    .drawer-table thead th {
      position: static;
      border-bottom: 1px solid var(--ink-color-global-border-subtle);
    }

    /* flex-shrink: 0 keeps the picker at its natural height while the body takes the
       remaining space and scrolls under it. */
    .panel-scope {
      align-items: center;
      border-bottom: 1px solid var(--ink-color-global-border-subtle);
      display: flex;
      flex-shrink: 0;
      gap: var(--space-s);
      padding: var(--space-m) var(--space-l);
    }

    .panel-scope label { color: var(--ink-color-global-text-subtle); }

    /* The name can be long and there may be dozens of them, so the control takes the
       width it can get rather than stretching the panel. */
    .panel-scope select {
      flex: 1;
      min-width: 0;
    }

  </style>
</head>
<body>
  <main class="page">
    <svg class="logo" width="64" height="32" viewBox="0 0 64 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carta">
      <rect x="0.64" y="0.64" width="62.72" height="30.72" stroke="currentColor" stroke-width="1.28"/>
      <path d="M8.4 16.62C8.4 13.42 11.1 11.53 13.53 11.53C15.27 11.53 16.9 12.19 17.76 13.69L16.14 14.63C15.86 14.21 15.48 13.86 15.03 13.62C14.58 13.39 14.08 13.26 13.57 13.27C12.14 13.27 10.44 14.38 10.44 16.59C10.44 18.8 12.06 19.93 13.7 19.93C14.84 19.93 15.79 19.3 16.35 18.32L18.01 19.08C17.07 20.78 15.39 21.68 13.44 21.68C10.98 21.67 8.4 19.79 8.4 16.62L8.4 16.62ZM23.94 21.68C25.29 21.68 26.56 21.08 27.22 20.22V21.4H29.23V11.78H27.22V12.97C26.6 12.1 25.29 11.53 23.94 11.53C20.98 11.53 18.92 13.68 18.92 16.6C18.92 19.52 21 21.68 23.94 21.68V21.68ZM24.13 13.36C25.99 13.36 27.26 14.74 27.26 16.6C27.26 18.47 25.99 19.85 24.13 19.85C22.28 19.85 20.96 18.45 20.96 16.57C20.96 14.68 22.28 13.36 24.13 13.36V13.36ZM40.01 13.69H37.93V11.77H40.03V9.26H42.1V11.77H44.2V13.69H42.1V21.4H40.01V13.69ZM49.96 21.68C51.32 21.68 52.59 21.08 53.25 20.22V21.4H55.26V11.78H53.25V12.97C52.62 12.1 51.32 11.53 49.96 11.53C47.01 11.53 44.94 13.68 44.94 16.6C44.94 19.52 47.03 21.68 49.96 21.68V21.68ZM50.16 13.36C52.01 13.36 53.29 14.74 53.29 16.6C53.29 18.47 52.01 19.85 50.16 19.85C48.31 19.85 46.99 18.45 46.99 16.57C46.99 14.68 48.3 13.36 50.16 13.36V13.36ZM33.77 21.39H31.69V11.77H33.6V13.56C34.07 12.5 34.78 11.8 35.94 11.75C36.18 11.74 36.41 11.75 36.65 11.77L36.62 13.7C34.96 13.7 33.77 14.59 33.77 17.07V21.4H33.77L33.77 21.39Z" fill="currentColor"/>
    </svg>
    <h1>Loan Portfolio Dashboard</h1>
    <p class="scope" id="scope"></p>

    <!-- Named once, up top, before the reader touches the dropdown: everything below —
         every KPI tile, the loan table, the loan detail panel — is scoped to whichever
         currency is selected. Hidden along with the picker when there is only one. -->
    <div class="currency-banner" id="currency-banner" role="status" hidden>
      <!-- Currency-neutral on purpose: this portfolio holds EUR, GBP and CAD loans too,
           and a glyph for one currency beside text naming another misreads the scope. -->
      <span class="currency-banner-icon" aria-hidden="true">&#8505;</span>
      <span class="currency-banner-text" id="currency-banner-text"></span>
    </div>

    <!-- Its own line, deliberately outside .controls: it is a scope, not a filter
         alongside Lender / Payments due in / Filter, so it does not share their row. -->
    <span class="field currency-field" id="controls" hidden>
      <label for="currency">Currency (scopes everything below)</label>
      <select id="currency"></select>
    </span>

    <div class="controls">
      <span class="field">
        <label for="lender-filter">Lender</label>
        <select id="lender-filter"></select>
      </span>
      <span class="field">
        <label for="payment-window">Payments due in</label>

          <option value="10">next 10 days</option>

          <option value="90">next 90 days</option>
        </select>
      </span>
      <span class="field">
        <label for="loan-filter">Filter</label>
        <input type="search" id="loan-filter" placeholder="Loan or borrower" autocomplete="off">

    </div>

    <p class="status" id="status">Loading…</p>
    <div class="progress" id="progress" hidden>
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <p class="status" id="error" role="alert" hidden></p>

    <section class="kpis" id="kpis"></section>

    <h2 id="loans-heading">Loans</h2>
    <p class="status" id="loans-note" hidden></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="sortable name" id="sort-loan_name" aria-sort="none">Loan<span class="sort-indicator" id="ind-loan_name"></span></th>
            <th class="sortable name" id="sort-borrower_name" aria-sort="none">Borrower<span class="sort-indicator" id="ind-borrower_name"></span></th>
            <th class="name">Lead Lender</th>
            <th class="sortable num" id="sort-committed" aria-sort="none">Committed<span class="sort-indicator" id="ind-committed"></span></th>
            <th class="sortable num" id="sort-outstanding" aria-sort="descending">Outstanding<span class="sort-indicator" id="ind-outstanding"></span></th>
            <th class="sortable num" id="sort-utilization" aria-sort="none">Utilization<span class="sort-indicator" id="ind-utilization"></span></th>
          </tr>
        </thead>
        <tbody id="loan-rows"></tbody>
        <tfoot hidden id="loan-totals">
          <tr>
            <td colspan="3" id="total-label"></td>
            <td class="num" id="total-committed"></td>
            <td class="num" id="total-outstanding"></td>
            <td class="num" id="total-utilization"></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </main>

  <!-- Non-modal on purpose: the table stays live so a reader can click straight from one
       loan to the next. No scrim, no aria-modal, no focus trap and no scroll lock — those
       belong to a dialog that blocks the page, and claiming them while the page still
       works is worse than not claiming them.
       `drawer` rides along on the body so every .drawer rule still applies: the sections
       inside are the same markup that used to sit in a table row. -->
  <aside class="panel" id="loan-panel" role="complementary" aria-labelledby="panel-title">
    <header class="panel-head">
      <div class="panel-heading">
        <div class="panel-title-row">
          <h2 class="panel-title" id="panel-title"></h2>
          <!-- `$` alone spans USD, CAD, AUD and more, and the panel is a surface people
               screenshot away from the heading that names the currency. -->
          <span class="panel-ccy" id="panel-ccy"></span>
        </div>
        <p class="panel-sub" id="panel-sub"></p>
        <!-- The name in the table opens this panel, so the jump out to Loan Operations
             lives here. Empty when a row has no nanoid or slug to build a URL from. -->
        <p class="panel-link" id="panel-link"></p>
      </div>
      <button type="button" class="panel-close" id="panel-close" aria-label="Close loan details">
        <span class="ink-icon" style="width:14px;height:14px" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 512 512" fill="currentColor">
            <path d="M278 256l120-120c6-6 6-16 0-22-6-6-16-6-22 0l-120 120-120-120c-6-6-16-6-22 0-6 6-6 16 0 22l120 120-120 120c-6 6-6 16 0 22 6 6 16 6 22 0l120-120 120 120c6 6 16 6 22 0 6-6 6-16 0-22z"/>
          </svg>
        </span>
      </button>
    </header>
    <!-- A picker, not tabs: a loan can carry dozens of structures, and a tab strip at
         that count either squeezes each label to an unreadable sliver or scrolls the
         control out of reach. Sits outside the scrolling body so it stays put. -->
    <div class="panel-scope" id="panel-scope" hidden>
      <label for="panel-scope-select">Showing</label>
      <select id="panel-scope-select"></select>
    </div>
    <div class="panel-scope" id="panel-asof">
      <label for="panel-asof-date">Balance as of</label>
      <input type="date" id="panel-asof-date">
      <!-- Filled from the balance itself: the warehouse tables this page reads name no
           loan's lenders, and the balance lists exactly the ones this viewer may see. -->
      <label for="panel-balance-lender" hidden>Lender</label>
      <select id="panel-balance-lender" hidden></select>
    </div>
    <div class="panel-body drawer" id="panel-body"></div>
  </aside>

  <script>
    // Shown in the footer so a rendered artifact can be told apart from an older
    // one at a glance — three rounds of this were lost to stale plugin copies.

    const CONFIG = JSON.parse(document.getElementById('loan-data').textContent);
    // The artifact runtime addresses a connector by display name, never a UUID.
    const CARTA_MCP_SERVER = CONFIG.mcp_server;
    const CALL_TOOL = 'call_tool';
    const WELCOME_TOOL = 'welcome';

    // The firm whose loans this dashboard is for, as a Carta firm UUID. LOAN_OPS row
    // access follows the session's ACTIVE FIRM, and the viewer's connector arrives on
    // whatever firm they last worked on — not on the one this dashboard was built for.
    // The same query returns a DIFFERENT firm's loans depending on which firm is active.
    // Without this the page
    // renders another firm's portfolio under this firm's heading, with no error.
    const FIRM_CONTEXT_ID = typeof CONFIG.firm_context_id === 'string' && CONFIG.firm_context_id
      ? CONFIG.firm_context_id : null;

    // The SAME firm as it is identified ON the warehouse rows — a different id from the
    // context UUID above, so neither can be derived from the other.
    //
    // Pinning the context is not enough on its own: that scope is per-user state shared
    // across a session and can be rewritten while a load is still running, and this
    // dashboard pages a whole portfolio and then loads detail behind it. So the firm is
    // pinned in the SQL too and every row is checked against it — the failure being
    // defended against is silent, another firm's loans under this firm's heading.
    const FIRM_ROW_ID = typeof CONFIG.firm_warehouse_id === 'string' && CONFIG.firm_warehouse_id
      ? CONFIG.firm_warehouse_id : null;

    // Empty when unconfigured, so an older config degrades to the context pin alone
    // rather than emitting broken SQL.
    function firmPin(alias) {
      if (!FIRM_ROW_ID || !COL.lending_firm_id) return '';
      return ` AND ${alias}.${COL.lending_firm_id} = '${String(FIRM_ROW_ID).replace(/'/g, "''")}'`;
    }

    // Refuses a page carrying another firm's rows rather than rendering it: a foreign row
    // means the scope moved underneath the load, which no retry fixes.
    function assertFirm(rows) {
      if (!FIRM_ROW_ID || !rows || rows.length === 0) return rows;
      const foreign = rows.filter(r => r.firm_id && String(r.firm_id) !== FIRM_ROW_ID);
      if (foreign.length) {
        throw new Error('the warehouse returned ' + foreign.length + ' row(s) belonging to another ' +
                        'firm — the Carta session changed firms while this dashboard was loading. ' +
                        'Reload to fetch this firm again.');
      }
      return rows;
    }
    const INSTRUMENTATION_V2 = { skills: ['carta-investors:carta-loan-dashboard'], from_ui: true };

    let _mcpNsPromise = null;
    // null means this view cannot run mcp — not granted, not served, or failed to load.
    // Polls up to 5 attempts, 4 × 500 ms gaps (2 s max) to handle window.claude not yet ready on first render.
    function mcpNamespace() {
      if (!_mcpNsPromise) {
        _mcpNsPromise = (async () => {
          for (let i = 0; i < 5; i++) {
            try {
              const mcp = await Promise.resolve(window.claude?.use?.('mcp') ?? null);
              if (mcp) return mcp;
            } catch (_) {}
            if (i < 4 && typeof setTimeout === 'function') await new Promise(r => setTimeout(r, 500));
          }
          return null;
        })();
      }
      return _mcpNsPromise;
    }

    // A tool that ran and reported failure returns an isError envelope, so callMcp can
    // read its message. Connector codes (needs_reauth, server_not_connected) rethrow.
    async function callCartaTool(tool, args) {
      const mcp = await mcpNamespace();
      if (!mcp) throw new Error('this dashboard reads live data and no Carta connector is available in this view');
      try {
        return await mcp.callTool(CARTA_MCP_SERVER, tool, { ...args, _instrumentation_v2: INSTRUMENTATION_V2 });
      } catch (err) {
        if (err && err.code === 'tool_error') {
          return { isError: true, code: err.code, result: err.result, content: [{ type: 'text', text: err.message || 'tool error' }] };
        }
        throw err;
      }
    }
    const TABLE = CONFIG.loan_table;
    const OBLIGATIONS = CONFIG.obligation_table;
    const ADVANCES = CONFIG.advance_table;
    const STRUCTURES = CONFIG.structure_table;
    const MEMOS = CONFIG.memo_table;
    const COMPANIES = CONFIG.company_table;
    const COL = CONFIG.columns || {};

    // The host the loan lives on, per environment. Validated here rather than trusted:
    // this string goes straight into an href, so anything that is not a plain https
    // origin drops every link instead of rendering a URL we cannot vouch for.
    const LO_BASE_URL = /^https:\/\/[A-Za-z0-9.-]+$/.test(String(CONFIG.lo_base_url || ''))
      ? CONFIG.lo_base_url.replace(/\/$/, '')
      : null;

    // A link is never built from a column the config did not ask for. The slug join runs
    // without links too, because a staff viewer's balance read needs the slug.
    const HAS_SLUG = Boolean(COMPANIES && COL.slug && COL.lending_firm_id);
    const CAN_LINK = Boolean(LO_BASE_URL && COL.loan_nano_id && HAS_SLUG);

    // One aggregate row per currency. Nothing here is ever summed across currencies.
    let byCurrency = [];
    // Two different budgets, deliberately not one flag: `welcomeCalled` records that the
    // proactive welcome ran, `welcomeRetried` records that the reactive one-shot recovery
    // was spent. Sharing a flag let the proactive call consume the retry, so a gateway
    // that still answered "call welcome first" could no longer recover.
    let welcomeCalled = false;
    let welcomeRetried = false;

    // The fetched portfolio for the selected currency, and how it is being viewed.
    let loans = [];
    let currency = null;
    let truncated = false;
    let sortKey = 'outstanding';
    let sortDir = 'desc';
    let filterText = '';

    const SORTABLE = ['loan_name', 'borrower_name', 'committed', 'outstanding', 'utilization'];
    const WINDOWS = [10, 30, 60, 90];
    let payments = [];   // one row per currency, one column per window
    let paymentWindow = 30;
    let lender = '';        // '' = every lender
    // Keyed by loan, not row position: a sort or filter reorders the rows underneath an
    // open panel, and an index would silently start describing a different loan.
    let openLoanId = null;
    const terms = new Map();     // loan_id -> latest interest obligation
    const itd = new Map();       // loan_id -> inception-to-date paid, by type
    const nextDue = new Map();   // loan_id -> next unpaid obligation
    const draws = new Map();      // loan_id -> [advances]
    const structures = new Map(); // loan_id -> [structures]
    // Same datasets, keyed by structure, so a structure panel renders the same sections.
    const termsByStructure = new Map();
    const itdByStructure = new Map();
    const nextDueByStructure = new Map();
    const drawsByStructure = new Map();
    let openTab = 0;              // index into the loan's structures
    // The date the panel's balance is taken at. Kept across loans, so a reader pricing a
    // book at one date does not re-pick it for every position.
    let balanceDate = localToday();
    // The lender whose share the balance shows; '' is the whole balance. Kept across loans
    // for the same reason as the date, since one fund often holds a piece of many loans.
    let balanceLender = '';
    const balances = new Map();   // loan_id|date -> { state, data, message }
    let detailState = 'idle';    // idle | loading | ready | failed

    // ── Ink icons (OshFont glyphs, Y-flipped for standalone SVG) ──

    const INK_ICONS = {
        'up-carat': '<svg viewBox="0 0 512 512" fill="currentColor"><path transform="translate(0,512) scale(1,-1)" d="M67 149c4-4 9-5 14-5l351 0c5 0 10 2 14 5 4 4 6 9 6 15 0 5-2 10-6 14l-175 184c-4 4-9 6-15 6-5 0-11-2-15-6l-175-184c-7-8-7-21 1-29z"/></svg>',
        'down-carat': '<svg viewBox="0 0 512 512" fill="currentColor"><path transform="translate(0,512) scale(1,-1)" d="M446 363c-4 4-9 5-15 5l-351 0c-5 0-9-2-13-5-4-4-6-9-6-15 0-5 2-10 5-14l176-184c4-4 9-6 15-6 5 0 10 2 14 6l176 184c7 8 7 21-1 29z"/></svg>',
        'sort-carat': '<svg viewBox="0 0 512 512" fill="currentColor"><path transform="translate(0,512) scale(1,-1)" d="M111 268l289 0c5 0 9 2 12 5 7 7 7 18 0 25l-144 145c-3 3-7 5-12 5-5 0-9-2-12-5l-144-145c-7-7-7-18 0-25 3-3 7-4 11-5z m290-89l-289 0c-5 0-9-1-12-4-7-7-7-18 0-25l144-145c3-3 7-5 12-5 5 0 9 2 12 5l144 145c7 7 7 18 0 25-3 3-7 4-11 4z"/></svg>',
    };

    function inkIcon(name, size) {
        size = size || 12;
        return `<span class="ink-icon" style="width:${size}px;height:${size}px">${INK_ICONS[name].replace('<svg ', `<svg width="${size}" height="${size}" `)}</span>`;
    }

    // Building an Intl.NumberFormat costs far more than formatting with one, and the
    // tables format thousands of cells, so each distinct option set is built once.
    const numberFormats = new Map();
    function numberFormat(options) {
      const key = JSON.stringify(options);
      if (!numberFormats.has(key)) numberFormats.set(key, new Intl.NumberFormat(undefined, options));
      return numberFormats.get(key);
    }

    function money(n, currencyCode) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      const abs = Math.abs(n);
      const compact = abs >= 1_000_000;
      if (!currencyCode) {
        return numberFormat({
          notation: compact ? 'compact' : 'standard',
          maximumFractionDigits: compact ? 2 : 0,
        }).format(n);
      }
      return numberFormat({
        style: 'currency',
        currency: currencyCode,
        notation: compact ? 'compact' : 'standard',
        maximumFractionDigits: compact ? 2 : 0,
      }).format(n);
    }

    // The summary band reads in whole units. Cents never separate two balances in the
    // tens of millions, and they added three characters to every figure in a 248px cell.
    // Anything that has to tie out uses moneyExact below.
    function moneyWhole(n, currencyCode) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      return numberFormat(currencyCode
        ? { style: 'currency', currency: currencyCode, maximumFractionDigits: 0 }
        : { maximumFractionDigits: 0 }).format(n);
    }

    // Table figures are exact to the cent — a compacted balance cannot be tied out.
    function moneyExact(n, currencyCode) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      return numberFormat(currencyCode
        ? { style: 'currency', currency: currencyCode, minimumFractionDigits: 2, maximumFractionDigits: 2 }
        : { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
    }

    // RATE / CREDIT_SPREAD / BENCHMARK_* are decimal fractions (0.115 = 11.5%).
    // Intl percent does the x100 itself, so passing them through is the whole job.
    // Pricing is quoted in basis points, so two decimals is the meaningful floor; the
    // third is kept for the rare rate that carries sub-basis-point precision.
    function rate(n) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      return numberFormat({
        style: 'percent', minimumFractionDigits: 2, maximumFractionDigits: 3,
      }).format(n);
    }

    // The reader's own calendar day as YYYY-MM-DD, built by hand: the ISO string is the
    // UTC day, already tomorrow on a US evening, and locale formats vary by engine.
    function localToday() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    // Warehouse dates arrive as YYYY-MM-DD strings; parse as UTC so the day never
    // shifts backwards for anyone west of Greenwich.
    function day(value) {
      if (!value) return '—';
      const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(value));
      if (!match) return String(value);
      const d = new Date(Date.UTC(+match[1], +match[2] - 1, +match[3]));
      return new Intl.DateTimeFormat(undefined, {
        month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC',
      }).format(d);
    }

    function num(n) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      return numberFormat({}).format(n);
    }

    function pct(n) {
      if (n === null || n === undefined || isNaN(n)) return 0;
      return Math.max(0, Math.min(100, Number(n)));
    }

    // Not textContent -> innerHTML: that leaves quotes raw, and esc() output also
    // lands inside attribute values (title="…", value="…", href="…").
    const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    function esc(s) {
      return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => HTML_ESCAPES[c]);
    }

    function ratio(part, whole) {
      if (!whole || isNaN(part) || isNaN(whole)) return 0;
      return (Number(part) / Number(whole)) * 100;
    }

    function status(text) {
      const el = document.getElementById('status');
      el.textContent = text || '';
      el.hidden = !text;
    }

    // `done`/`total` known -> a real bar. Called with neither -> indeterminate, which is
    // honest about not knowing rather than inventing a percentage.
    function progress(done, total) {
      const bar = document.getElementById('progress');
      const fill = document.getElementById('progress-fill');
      if (!bar || !fill) return;
      if (done == null) { bar.hidden = true; return; }
      bar.hidden = false;
      // Width rides on the attribute, not `.style`: setAttribute is the one mutation every
      // element supports, and the class already carries the determinate/indeterminate state.
      if (total && total > 0) {
        fill.className = 'progress-fill';
        fill.setAttribute('style', 'width:' + Math.min(100, Math.round((done / total) * 100)) + '%');
      } else {
        fill.className = 'progress-fill indeterminate';
        fill.setAttribute('style', '');
      }
    }

    function fail(err) {
      status('');
      progress(null);
      // The skeleton is a promise that data is coming. Left up beside an error it shimmers
      // forever and buries the message that says why nothing arrived.
      clearSkeleton();
      const el = document.getElementById('error');
      el.textContent = 'Could not load loan data: ' + (err && err.message ? err.message : String(err));
      el.hidden = false;
    }

    function isWelcomeRequired(text) {
      return typeof text === 'string' && /welcome/i.test(text);
    }

    // A transport that gave up, rather than a query the warehouse refused. Only these are
    // worth repeating: retrying a bad column name just fails three times more slowly.
    const TRANSIENT = /no reply|timed? ?out|timeout|econnreset|network|socket|temporarily|503|502|504|gateway/i;

    const RETRIES = 2;                    // three attempts total
    const BACKOFF_MS = [700, 2100];       // the second wait is longer; a busy warehouse needs it

    function isTransient(err) {
      return TRANSIENT.test((err && err.message) || String(err || ''));
    }

    // Bounded on purpose. Past this the failure is reported rather than hidden behind a
    // spinner that never resolves — the reader can retry by reopening.
    async function withRetry(run, label) {
      for (let attempt = 0; ; attempt++) {
        try {
          return await run();
        } catch (err) {
          if (attempt >= RETRIES || !isTransient(err)) throw err;
          const wait = BACKOFF_MS[attempt] || BACKOFF_MS[BACKOFF_MS.length - 1];
          // Say it out loud: a silent retry is indistinguishable from a hang.
          status(`${label} — connection dropped, retrying (${attempt + 1} of ${RETRIES})…`);
          await new Promise(r => setTimeout(r, wait));
        }
      }
    }

    // Recover once from a "call welcome first" envelope, then retry. Any other error
    // passes through, and the flag stops a loop.
    async function callMcp(args) {
      const first = await callCartaTool(CALL_TOOL, args);
      if (!first || !first.isError) return first;
      const text = (first.content && first.content[0] && first.content[0].text) || '';
      if (!isWelcomeRequired(text) || welcomeRetried) return first;
      welcomeRetried = true;
      status('Reconnecting to Carta…');
      const welcomed = await callCartaTool(WELCOME_TOOL, {});
      if (welcomed && welcomed.isError) throw new Error('could not start a Carta session');
      return await callCartaTool(CALL_TOOL, args);
    }

    // Every Carta command this page runs goes through call_tool in this envelope.
    function command(name, args) {
      return { name: name, arguments: args, _instrumentation_v2: INSTRUMENTATION_V2 };
    }

    function unwrap(result) {
      if (typeof result === 'string') return result;
      if (!result || typeof result !== 'object') throw new Error('unexpected response shape');
      if (result.isError) {
        throw new Error((result.content && result.content[0] && result.content[0].text) || 'query failed');
      }
      if (result.content && result.content[0] && typeof result.content[0].text === 'string') {
        return result.content[0].text;
      }
      if (typeof result.payload === 'string') return result.payload;
      if (result.payload && typeof result.payload.result === 'string') return result.payload.result;
      if (result.structuredContent && typeof result.structuredContent.result === 'string') {
        return result.structuredContent.result;
      }
      throw new Error('no table in the response');
    }

    // The response prefixes the table with `total_rows: N | offset: … | format: markdown`.
    // Skip it, or those four read as headers and every data row drops on column mismatch.
    // Skips are counted per parse and carried back to the caller. parseTable serves every
    // query, so a shared counter would blame the loans table for a dropped structure row
    // and would keep accumulating across a currency switch.
    let skippedRows = 0;        // loans table only
    let skippedDetailRows = 0;  // terms, balances, structures, draws

    // Free-text columns where a literal ' | ' is legitimate: some firms name loans
    // "<Deal> | <Loan type> | <date>", which overflows the row against this separator.
    const TEXT_COLUMNS = ['loan_name', 'borrower_name', 'lead_lender_name',
                          'structure_name', 'advance_name', 'benchmark_name'];

    // Folds extra cells back into the row's FIRST free-text column, so a piped name
    // costs that name's precision rather than the whole row. A pipe from a later text
    // column therefore garbles the two names between themselves; nothing outside
    // TEXT_COLUMNS can contain ' | ', so ids, amounts and dates always land correctly.
    // Returns null when no fold is possible — a genuine shape mismatch.
    // long-comment-ok: states which failure the fold trades away, and why it is safe.
    function reconcileOverflow(cells, headers) {
      if (cells.length === headers.length) return cells;
      const overflow = cells.length - headers.length;
      if (overflow <= 0) return null;
      const textIdx = headers.findIndex(h => TEXT_COLUMNS.indexOf(h) !== -1);
      if (textIdx === -1) return null;
      const merged = cells.slice(0, textIdx)
        .concat([cells.slice(textIdx, textIdx + overflow + 1).join(' | ')])
        .concat(cells.slice(textIdx + overflow + 1));
      return merged.length === headers.length ? merged : null;
    }

    function parseTable(text) {
      if (!text || typeof text !== 'string') return { rows: [], skipped: 0 };
      const lines = text.split(/\r?\n/).map(l => l.trimEnd()).filter(l => l.length > 0);
      if (lines.length === 0) return { rows: [], skipped: 0 };
      const head = lines[0].startsWith('total_rows:') ? 1 : 0;
      if (head >= lines.length) return { rows: [], skipped: 0 };
      const headers = lines[head].split(' | ').map(h => h.trim().toLowerCase());
      let start = head + 1;
      if (lines.length > start && /^[\s\-|]+$/.test(lines[start])) start++;
      const rows = [];
      let skipped = 0;
      for (let i = start; i < lines.length; i++) {
        const raw = lines[i].split(' | ').map(c => c.trim());
        const cells = reconcileOverflow(raw, headers);
        if (!cells) {
          // Counted so the UI can admit the gap.
          skipped++;
          continue;
        }
        const row = {};
        headers.forEach((h, j) => { row[h] = coerce(cells[j]); });
        rows.push(row);
      }
      return { rows: rows, skipped: skipped };
    }

    function coerce(raw) {
      // Case varies by column and layer; matching only 'TRUE' left booleans as
      // strings, which read as false everywhere downstream.
      const flat = typeof raw === 'string' ? raw.trim().toUpperCase() : raw;
      if (flat === 'NULL' || flat === '') return null;
      if (flat === 'TRUE') return true;
      if (flat === 'FALSE') return false;
      if (/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(raw)) {
        const n = parseFloat(raw);
        if (Number.isFinite(n)) return n;
      }
      return raw;
    }

    // The response body has a size cap that truncates mid-result, so anything
    // portfolio-sized is paged. `limit`/`offset` are tool arguments, not SQL.
    const PAGE_SIZE = 500;
    const MAX_PAGES = 40;

    // Every warehouse read goes through here, so the retry sits here rather than at each
    // call site — one place to reason about, and no path that quietly skips it.
    async function query(sql, opts) {
      return withRetry(() => queryOnce(sql, opts), (opts && opts.label) || 'Loading');
    }

    async function queryOnce(sql, opts) {
      const args = { sql: sql, format: 'markdown' };
      if (opts && opts.limit !== undefined) args.limit = opts.limit;
      if (opts && opts.offset !== undefined) args.offset = opts.offset;
      const text = unwrap(await callMcp(command('dwh__execute__query', args)));
      const parsed = parseTable(text);
      return { rows: parsed.rows, skipped: parsed.skipped, total: totalRows(text) };
    }

    // `total_rows: N | offset: 0 | limit: 500 | format: markdown`, when present.
    function totalRows(text) {
      const first = (text || '').split(/\r?\n/)[0] || '';
      if (!first.startsWith('total_rows:')) return null;
      const match = first.match(/total_rows:\s*(\d+)/);
      return match ? parseInt(match[1], 10) : null;
    }

    // Stops on a short page. Reports truncation rather than trailing off quietly.
    // `onPage` receives the rows so far after EVERY page, so a caller can paint the first
    // 500 while the rest are still in flight. Waiting for the last page left the table
    // blank for the whole fetch.
    async function queryAll(sql, onProgress, onPage) {
      const rows = [];
      let skipped = 0;
      for (let page = 0; page < MAX_PAGES; page++) {
        const result = await query(sql, { limit: PAGE_SIZE, offset: page * PAGE_SIZE });
        rows.push(...result.rows);
        skipped += result.skipped || 0;
        if (onProgress) onProgress(rows.length, result.total);
        if (onPage) onPage(rows);
        if (result.rows.length < PAGE_SIZE) return { rows: rows, truncated: false, skipped: skipped };
        if (result.total !== null && rows.length >= result.total) {
          return { rows: rows, truncated: false, skipped: skipped };
        }
      }
      return { rows: rows, truncated: true, skipped: skipped };
    }

    // GROUP BY currency, so a cross-currency total is not expressible here.
    function kpiSql() {
      return `SELECT ${COL.currency} AS currency_code, COUNT(*) AS total_loans,
                     COUNT_IF(${COL.active}) AS active_loans,
                     SUM(${COL.committed}) AS total_committed,
                     SUM(${COL.drawn}) AS total_drawn,
                     SUM(${COL.outstanding}) AS total_outstanding
              FROM ${TABLE} l
              WHERE TRUE${firmPin('l')}
              GROUP BY ${COL.currency}
              ORDER BY total_loans DESC`;
    }

    // Every loan in the currency, not a top slice. OFFSET paging needs a total order,
    // so ties break on a stable column; loan_name is the fallback when no id resolved.
    //
    // Closing is the ONLY date LOAN carries. Draw period end lives on STRUCTURE and
    // maturity on ADVANCE, so both are read from those tables in loadDetails. There is
    // no amortization-start column anywhere in LOAN_OPS — see dateRows.
    function loansSql(currency) {
      const tiebreak = COL.loan_id || COL.loan_name;
      const closing = COL.closing ? `, l.${COL.closing} AS closing` : '';
      // Counts so the loan panel can show the same Composition section a structure does.
      const counts = (COL.loan_tranche_count ? `, l.${COL.loan_tranche_count} AS tranche_count` : '') +
                     (COL.loan_lender_count ? `, l.${COL.loan_lender_count} AS lender_count` : '');
      // The deep link needs the slug of the loan's OWN lending firm, so it is resolved
      // per row: a viewer can hold loans across more than one firm, and one global slug
      // would send those rows to another firm's org. COMPANY holds MANY rows per
      // LENDING_FIRM_ID (one per associated company), so IS_LENDING_FIRM
      // below is what keeps this join from multiplying the portfolio.
      // The nanoid is also how the balance is read, so it is fetched whether or not links
      // are on; the slug is what a staff viewer pins Loan Operations to.
      const linkCols = (COL.loan_nano_id ? `, l.${COL.loan_nano_id} AS loan_nano_id` : '') +
                       (HAS_SLUG ? `, c.${COL.slug} AS company_slug` : '');
      const linkJoin = HAS_SLUG
        ? `\n              LEFT JOIN ${COMPANIES} c ON c.${COL.lending_firm_id} = l.${COL.lending_firm_id}` +
          (COL.is_lending_firm ? ` AND c.${COL.is_lending_firm} = TRUE` : '')
        : '';
      return `SELECT l.${COL.loan_id} AS loan_id, l.${COL.loan_name} AS loan_name, l.${COL.borrower} AS borrower_name,
                     l.${COL.lead_lender} AS lead_lender_name, l.${COL.committed} AS committed,
                     l.${COL.drawn} AS drawn, l.${COL.outstanding} AS outstanding,
                     l.${COL.active} AS is_active,
                     l.${COL.lending_firm_id} AS firm_id${closing}${counts}${linkCols}
              FROM ${TABLE} l${linkJoin}
              WHERE l.${COL.currency} = '${currency}' AND l.${COL.active} = TRUE${firmPin('l')}
              ORDER BY l.${COL.outstanding} DESC NULLS LAST, l.${tiebreak}`;
    }

    // A link is rendered only when every segment resolves and matches the shape the
    // loan-operations route expects. The route takes a nanoid and has no UUID fallback,
    // so a half-built URL would 404 — worse than the plain text it replaces.
    // Loan Operations belongs in a browser tab, never in the artifact frame — the frame
    // is the dashboard. A gesture-driven window.open is honoured by hosts that ignore
    // anchor targeting, and the anchor keeps href/target/rel so a modifier-click, a
    // middle-click and "Open link in new tab" all still take the native path.
    // Whether the tab reaches the OS default browser is the host's call, not ours: no
    // artifact runtime capability opens a URL externally.
    function openExternal(url) {
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    function loanUrl(l) {
      if (!CAN_LINK) return null;
      const nano = safeId(l.loan_nano_id);
      const slug = safeSlug(l.company_slug);
      if (!nano || !slug) return null;
      return `${LO_BASE_URL}/org/${slug}/loans/${nano}/overview`;
    }

    // Every window in one pass, so switching the picker re-queries nothing.
    //
    // Most unpaid obligations are IS_PROJECTED — the engine's forward schedule, not a
    // bill anyone has been sent. Each window therefore carries a second sum restricted
    // to billed rows, so a tile can say how much of the figure is actually committed
    // rather than presenting a forecast as though it were due.
    function paymentsSql() {
      const types = [['principal', 'Principal'], ['interest', 'Interest'], ['fees', 'Fee']];
      const billedOnly = COL.obl_projected ? ` AND ${COL.obl_projected} = FALSE` : '';
      const windows = [];
      WINDOWS.forEach(d => types.forEach(([alias, type]) => {
        const inWindow = `${COL.due_date} < DATEADD(day, ${d}, CURRENT_DATE)` +
                         ` AND ${COL.obl_type} = '${type}'`;
        windows.push(`SUM(CASE WHEN ${inWindow} THEN ${COL.amount} END) AS ${alias}_${d}`);
        if (COL.obl_projected) {
          windows.push(`SUM(CASE WHEN ${inWindow}${billedOnly} THEN ${COL.amount} END)` +
                       ` AS ${alias}_${d}_billed`);
        }
      }));
      const windowSql = windows.join(',\n                     ');
      // Grouped by LOAN as well as currency. Aggregated to the currency alone, this tile
      // could not answer the lender filter every other tile honours — it reported the whole
      // book while the table beside it showed one lender.
      return `SELECT ${COL.amount_currency} AS currency_code,
                     ${COL.obl_loan_id} AS loan_id,
                     ${windowSql}
              FROM ${OBLIGATIONS}
              WHERE ${COL.is_paid} = FALSE AND ${COL.due_date} >= CURRENT_DATE
              GROUP BY ${COL.amount_currency}, ${COL.obl_loan_id}`;
    }

    // Codes come from our own aggregate query; the shape check keeps a surprising
    // warehouse value out of the next statement.
    function safeId(id) {
      return typeof id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(id) ? id : null;
    }

    function safeSlug(slug) {
      return typeof slug === 'string' && /^[A-Za-z0-9-]{1,100}$/.test(slug) ? slug : null;
    }

    function safeCurrency(code) {
      return typeof code === 'string' && /^[A-Za-z]{3}$/.test(code) ? code : null;
    }

    // Every drawer's data is fetched once for the whole currency, not per click —
    // a click should open a panel, not start a round-trip.
    //
    // "As of the last memo" is a real join, not an inference: PAYMENT_OBLIGATION.MEMO_ID
    // points at the memo the rate was billed on, and that memo's DUE_DATE is the business
    // date it went out under. Prefer a memo-dated row; fall back to the period in force
    // for a loan that has never been memo'd, and say which basis was used.
    //
    // MEMO.CONFIRMED_AT is deliberately NOT the as-of: every row carries the same
    // warehouse backfill timestamp, so it would date every rate in the book to one day.
    // Only Confirmed memos count — a Draft memo has no dates at all.
    function termsSql(cc) {
      // Every obligation column is table-qualified: MEMO and PAYMENT_OBLIGATION share
      // DUE_DATE, TYPE, STATUS and AMOUNT_CURRENCY, so a bare name would be ambiguous.
      const termCols = o => `${o}${COL.rate} AS rate,
                     ${o}${COL.credit_spread} AS credit_spread, ${o}${COL.benchmark_name} AS benchmark_name,
                     ${o}${COL.benchmark_rate} AS benchmark_rate, ${o}${COL.benchmark_floor} AS benchmark_floor,
                     ${o}${COL.day_count} AS day_count, ${o}${COL.is_pik} AS is_pik`;
      // Without a memo table resolved the rate still renders, dated by its period.
      if (!MEMOS || !COL.obl_memo_id || !COL.memo_id || !COL.memo_due) {
        return `SELECT ${COL.obl_loan_id} AS loan_id, ${termCols('')},
                     ${COL.period_start} AS as_of, 'period' AS as_of_basis
              FROM ${OBLIGATIONS}
              WHERE ${COL.obl_type} = 'Interest' AND ${COL.amount_currency} = '${cc}'
                AND ${COL.period_start} <= CURRENT_DATE
              QUALIFY ROW_NUMBER() OVER (PARTITION BY ${COL.obl_loan_id}
                                         ORDER BY ${COL.period_start} DESC) = 1
              ORDER BY ${COL.obl_loan_id}`;
      }
      const confirmed = COL.memo_status ? ` AND m.${COL.memo_status} = 'Confirmed'` : '';
      // An obligation reaches its structure through its advance, so the same rate rows
      // serve both the loan panel and the per-structure panels. Partition by structure
      // where that is resolvable; the loan-level rate is then the latest across them.
      const viaAdvance = COL.adv_structure_id && COL.obl_advance_id && ADVANCES;
      const structureSelect = viaAdvance ? `, a.${COL.adv_structure_id} AS structure_id` : '';
      const structureJoin = viaAdvance
        ? `\n              LEFT JOIN ${ADVANCES} a ON a.${COL.adv_id} = o.${COL.obl_advance_id}` : '';
      const partition = viaAdvance
        ? `o.${COL.obl_loan_id}, a.${COL.adv_structure_id}` : `o.${COL.obl_loan_id}`;
      return `SELECT o.${COL.obl_loan_id} AS loan_id${structureSelect}, ${termCols('o.')},
                     COALESCE(m.${COL.memo_due}, o.${COL.period_start}) AS as_of,
                     CASE WHEN m.${COL.memo_id} IS NULL THEN 'period' ELSE 'memo' END AS as_of_basis
              FROM ${OBLIGATIONS} o
              LEFT JOIN ${MEMOS} m ON m.${COL.memo_id} = o.${COL.obl_memo_id}${confirmed}${structureJoin}
              WHERE o.${COL.obl_type} = 'Interest' AND o.${COL.amount_currency} = '${cc}'
                AND o.${COL.period_start} <= CURRENT_DATE
              QUALIFY ROW_NUMBER() OVER (PARTITION BY ${partition}
                                         ORDER BY CASE WHEN m.${COL.memo_id} IS NULL THEN 1 ELSE 0 END,
                                                  COALESCE(m.${COL.memo_due}, o.${COL.period_start}) DESC) = 1
              ORDER BY ${partition}`;
    }

    // Repaid balances are columns on ADVANCE, so read them rather than re-summing
    // obligations — the recorded balance also covers repayments with no scheduled row.
    // Grouped by structure as well as loan: ADVANCE carries STRUCTURE_ID, so the same
    // rows roll up to either scope without a second query.
    function itdSql(cc) {
      const byStructure = COL.adv_structure_id ? `, ${COL.adv_structure_id} AS structure_id` : '';
      const groupStructure = COL.adv_structure_id ? `, ${COL.adv_structure_id}` : '';
      return `SELECT ${COL.adv_loan_id} AS loan_id${byStructure},
                     SUM(${COL.adv_principal_repaid}) AS itd_principal,
                     SUM(${COL.adv_interest_repaid}) AS itd_interest,
                     SUM(${COL.adv_pik_repaid}) AS itd_pik,
                     SUM(${COL.adv_pik_compounded}) AS pik_compounded
              FROM ${ADVANCES}
              WHERE ${COL.adv_currency} = '${cc}'
              GROUP BY ${COL.adv_loan_id}${groupStructure}
              ORDER BY ${COL.adv_loan_id}${groupStructure}`;
    }

    // Fees have no repaid column on the advance, so they stay an obligation sum.
    function feesSql(cc) {
      return `SELECT ${COL.obl_loan_id} AS loan_id, SUM(${COL.amount}) AS itd_fees
              FROM ${OBLIGATIONS}
              WHERE ${COL.is_paid} = TRUE AND ${COL.obl_type} = 'Fee'
                AND ${COL.amount_currency} = '${cc}'
              GROUP BY ${COL.obl_loan_id}
              ORDER BY ${COL.obl_loan_id}`;
    }

    // The next payment is grouped by IS_PROJECTED as well as date, so a billed amount is
    // never silently totalled with a forecast one. On a tie the billed row wins (FALSE
    // sorts first); the drawer labels whichever it got. Most unpaid obligations in the
    // book are projected, so without this the "next payment" reads as a bill and is not.
    function nextDueSql(cc) {
      const projected = COL.obl_projected;
      const projectedSelect = projected ? `, o.${projected} AS next_is_projected` : '';
      const projectedGroup = projected ? `, o.${projected}` : '';
      const projectedOrder = projected ? `, o.${projected}` : '';
      const viaAdvance = COL.adv_structure_id && COL.obl_advance_id && ADVANCES;
      const structureSelect = viaAdvance ? `, a.${COL.adv_structure_id} AS structure_id` : '';
      const structureJoin = viaAdvance
        ? `\n              LEFT JOIN ${ADVANCES} a ON a.${COL.adv_id} = o.${COL.obl_advance_id}` : '';
      const structureGroup = viaAdvance ? `, a.${COL.adv_structure_id}` : '';
      const partition = viaAdvance
        ? `o.${COL.obl_loan_id}, a.${COL.adv_structure_id}` : `o.${COL.obl_loan_id}`;
      return `SELECT o.${COL.obl_loan_id} AS loan_id${structureSelect}, o.${COL.due_date} AS next_date,
                     SUM(o.${COL.amount}) AS next_amount${projectedSelect}
              FROM ${OBLIGATIONS} o${structureJoin}
              WHERE o.${COL.is_paid} = FALSE AND o.${COL.due_date} >= CURRENT_DATE
                AND o.${COL.amount_currency} = '${cc}'
              GROUP BY o.${COL.obl_loan_id}${structureGroup}, o.${COL.due_date}${projectedGroup}
              QUALIFY ROW_NUMBER() OVER (PARTITION BY ${partition}
                                         ORDER BY o.${COL.due_date}${projectedOrder}) = 1
              ORDER BY ${partition}`;
    }

    function structuresSql(cc) {
      if (!STRUCTURES) return null;
      const active = COL.str_active ? `, ${COL.str_active} AS is_active` : '';
      const id = COL.str_id ? `, ${COL.str_id} AS structure_id` : '';
      return `SELECT ${COL.str_loan_id} AS loan_id${id}, ${COL.str_name} AS structure_name,
                     ${COL.str_type} AS structure_type, ${COL.str_committed} AS committed,
                     ${COL.str_drawn} AS drawn, ${COL.str_outstanding} AS outstanding,
                     ${COL.str_advance_count} AS advance_count, ${COL.str_tranche_count} AS tranche_count,
                     ${COL.str_lender_count} AS lender_count, ${COL.str_closing} AS closing,
                     ${COL.str_draw_period_end} AS draw_period_end${active}
              FROM ${STRUCTURES}
              WHERE ${COL.str_currency} = '${cc}'
              ORDER BY ${COL.str_loan_id}, ${COL.str_name}${COL.str_id ? `, ${COL.str_id}` : ''}`;
    }

    // Scoped to the currency on screen, like every other detail query. Unscoped, it
    // fetched the whole book: the schedule renders each amount with the displayed
    // currency code, so a foreign advance would print under the wrong symbol, and
    // other-currency rows could crowd the visible ones out of the paging cap.
    function drawsSql(cc) {
      if (!ADVANCES || !COL.adv_date || !COL.adv_amount) return null;
      const active = COL.adv_active ? `, ${COL.adv_active} AS is_active` : '';
      const structure = COL.adv_structure_id ? `, ${COL.adv_structure_id} AS structure_id` : '';
      const scope = COL.adv_currency ? `\n              WHERE ${COL.adv_currency} = '${cc}'` : '';
      return `SELECT ${COL.adv_loan_id} AS loan_id${structure}, ${COL.adv_name} AS advance_name,
                     ${COL.adv_date} AS advance_date, ${COL.adv_amount} AS amount,
                     ${COL.adv_maturity} AS maturity, ${COL.adv_outstanding} AS outstanding${active}
              FROM ${ADVANCES}${scope}
              ORDER BY ${COL.adv_loan_id}, ${COL.adv_date}${COL.adv_id ? `, ${COL.adv_id}` : ''}`;
    }

    // STRUCTURE records committed, drawn and outstanding but NOT undrawn — there is no
    // such column, so this stays a derivation. It mirrors how Loan Operations
    // computes undrawn: past the draw period nothing is available; a revolver's commitment
    // returns on repayment, a term loan's or DDTL's does not. An inactive structure
    // offers no capacity whatever its arithmetic says.
    //
    // One known divergence from the engine: it measures a revolver against outstanding
    // EXCLUDING compounded PIK, and STRUCTURE.OUTSTANDING_PRINCIPAL includes it. On a
    // revolver that has PIK'd, this understates undrawn by the compounded amount. There
    // is no PIK-excluded outstanding column on STRUCTURE to fix it with.
    const today = localToday();

    // Shares structureCommitted's floor with utilization, so the two can never contradict
    // each other on the same row — an add-on that reads as fully drawn must not also report
    // capacity remaining, and the raw column would make that subtraction negative.
    function structureUndrawn(s) {
      if (s.is_active === false) return 0;
      if (s.draw_period_end && String(s.draw_period_end) < today) return 0;
      return structureCommitted(s) - structureUsed(s);
    }

    // A loan's undrawn is the sum of its structures', never a loan-level subtraction.
    function loanUndrawn(loan) {
      const list = structures.get(String(loan.loan_id || ''));
      if (!list || !list.length) return null;
      return list.reduce((acc, s) => acc + structureUndrawn(s), 0);
    }

    // How much of a structure's commitment is in use. Same per-type split as undrawn —
    // a revolver's commitment returns on repayment so its use is what is outstanding,
    // a term loan's does not so its use is what was drawn.
    function structureUsed(s) {
      return s.structure_type === 'Revolver'
        ? (Number(s.outstanding) || 0)
        : (Number(s.drawn) || 0);
    }

    // The commitment utilization measures against. COMMITTED_AMOUNT is a snapshot that an
    // add-on advance does not update: when an upsize is booked as advances, the structure's
    // commitment stays at its original figure and the raw ratio reads over 100%. Taking the larger of the two reads those as fully drawn
    // rather than over-drawn.
    //
    // The warehouse cannot do better than this. Every advance carries COMMITTED_AMOUNT equal
    // to its own DISBURSED_AMOUNT, so summing advances just reproduces
    // DRAWN_AMOUNT — undrawn add-on capacity is recorded nowhere. A
    // half-drawn add-on therefore still reads 100%; only a commitment-bearing column upstream
    // could separate the two.
    function structureCommitted(s) {
      return Math.max(Number(s.committed) || 0, structureUsed(s));
    }

    // Utilization deliberately does NOT inherit undrawn's draw-period and inactive
    // zeroing. Those say no capacity remains, which is a fact about availability; they
    // say nothing about how much was drawn. Zeroing here would report a half-drawn term
    // loan whose draw period lapsed as fully utilized.
    //
    // Summed from the structures rather than taken off the loan, because a loan can mix
    // a revolver with a term loan and the two measure use differently. Null until the
    // structures land, so the column shows an em dash rather than a wrong 0%.
    function loanUtilization(loan) {
      const list = structures.get(String(loan.loan_id || ''));
      if (!list || !list.length) return null;
      // The denominator comes from the same rows as the numerator, so the ratio stays
      // internally consistent even if the loan's own commitment snapshot has drifted.
      // Corrected per structure before summing, never at the loan level: a loan can pair an
      // over-drawn structure with an under-drawn one, and a loan-level max would let the
      // second absorb the first instead of reporting each honestly.
      const committed = list.reduce((acc, s) => acc + structureCommitted(s), 0);
      if (!committed) return null;
      return (list.reduce((acc, s) => acc + structureUsed(s), 0) / committed) * 100;
    }

    function undrawnFor(rows) {
      let total = 0;
      let known = false;
      rows.forEach(l => {
        const u = loanUndrawn(l);
        if (u !== null) { total += u; known = true; }
      });
      return known ? total : null;
    }

    // Tests the raw commitment, not the sign of undrawn: the floor holds undrawn at or above
    // zero, so the sign carries no signal and this notice is the only thing on the page that
    // says the commitment snapshot is behind its advances.
    function staleCommitmentStructures() {
      let n = 0;
