      structures.forEach(list => list.forEach(s => {
        if (structureUsed(s) > (Number(s.committed) || 0)) n++;
      }));
      return n;
    }

    function indexBy(rows, map) {
      map.clear();
      rows.forEach(r => { if (r.loan_id) map.set(String(r.loan_id), r); });
    }

    function groupBy(rows, map) {
      map.clear();
      rows.forEach(r => {
        const key = String(r.loan_id);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(r);
      });
    }

    // The per-structure rows arrive in the same result sets as the loan ones, keyed by
    // structure_id. Indexing them separately lets one panel renderer serve both scopes.
    function indexByStructure(rows, map) {
      map.clear();
      rows.forEach(r => { if (r.structure_id) map.set(String(r.structure_id), r); });
    }

    function groupByStructure(rows, map) {
      map.clear();
      rows.forEach(r => {
        if (!r.structure_id) return;
        const key = String(r.structure_id);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(r);
      });
    }

    // A loan's figure is the roll-up of its structures': the latest rate across them,
    // the earliest next payment, the sum of the recorded balances.
    function foldToLoan(rows, pick) {
      const out = new Map();
      rows.forEach(r => {
        const key = String(r.loan_id || '');
        if (!key) return;
        out.set(key, out.has(key) ? pick(out.get(key), r) : r);
      });
      return out;
    }

    function copyInto(from, target) {
      target.clear();
      from.forEach((v, k) => target.set(k, v));
    }

    // Mirrors the per-structure QUALIFY exactly — memo-dated first, then latest — so the
    // loan's rate is the same row the warehouse would have picked for the loan alone.
    // A loan whose structures carry different rates shows one of them; open a structure
    // tab for that structure's own rate.
    function latestRate(a, b) {
      const rank = r => (r.as_of_basis === 'memo' ? 0 : 1);
      if (rank(a) !== rank(b)) return rank(b) < rank(a) ? b : a;
      return String(b.as_of || '') > String(a.as_of || '') ? b : a;
    }

    // The loan's next payment is what it owes on its earliest date — the sum across its
    // structures, plus any obligation that resolved to no structure at all (a fee carries
    // no advance, so it cannot be attributed to one). Taking a single structure's row
    // here understates the payment: one live loan owes 350,378.56 across three rows that
    // share a date, and picking one of them would report 63,719.94.
    function earliestPayment(a, b) {
      const da = String(a.next_date || '');
      const db = String(b.next_date || '');
      if (!da) return b;
      if (!db) return a;
      if (db < da) return b;
      if (da < db) return a;
      return {
        loan_id: a.loan_id,
        next_date: a.next_date,
        next_amount: (Number(a.next_amount) || 0) + (Number(b.next_amount) || 0),
        // Part forecast means the total is not a bill anyone has been sent.
        next_is_projected: a.next_is_projected === true || b.next_is_projected === true,
      };
    }

    const ITD_KEYS = ['itd_principal', 'itd_interest', 'itd_pik', 'pik_compounded'];

    function sumItd(a, b) {
      const out = { loan_id: a.loan_id };
      ITD_KEYS.forEach(k => {
        const total = (Number(a[k]) || 0) + (Number(b[k]) || 0);
        // A figure absent on both sides stays absent rather than becoming a zero.
        out[k] = (a[k] === null || a[k] === undefined) && (b[k] === null || b[k] === undefined)
          ? null : total;
      });
      return out;
    }

    // Detail gaps are counted apart from loan gaps: a dropped structure row costs a
    // loan its undrawn figure, not its place in the table.
    function tally(result) {
      skippedDetailRows += result.skipped || 0;
      return result.rows;
    }

    // Detail maps are keyed by loan/structure id, not by currency — switching currency
    // just overwrites them in place. Snapshotting one currency's maps and restoring them
    // on the way back is what lets a cached loan-row fetch skip re-querying without also
    // leaving the panel reading a different currency's terms, balances and draws.
    const detailCache = new Map();

    function snapshotDetail() {
      return {
        state: detailState,
        skippedDetailRows: skippedDetailRows,
        terms: new Map(terms), itd: new Map(itd), nextDue: new Map(nextDue),
        draws: new Map(draws), structures: new Map(structures),
        termsByStructure: new Map(termsByStructure), itdByStructure: new Map(itdByStructure),
        nextDueByStructure: new Map(nextDueByStructure), drawsByStructure: new Map(drawsByStructure),
      };
    }

    function restoreDetail(snap) {
      detailState = snap.state;
      skippedDetailRows = snap.skippedDetailRows;
      copyInto(snap.terms, terms); copyInto(snap.itd, itd); copyInto(snap.nextDue, nextDue);
      copyInto(snap.draws, draws); copyInto(snap.structures, structures);
      copyInto(snap.termsByStructure, termsByStructure); copyInto(snap.itdByStructure, itdByStructure);
      copyInto(snap.nextDueByStructure, nextDueByStructure); copyInto(snap.drawsByStructure, drawsByStructure);
    }

    async function loadDetails(cc, token) {
      detailState = 'loading';
      skippedDetailRows = 0;
      renderView();
      try {
        // Each result set carries both keys, so it is fetched once and indexed twice.
        // Every await is a point where a newer currency may have taken the display; a
        // superseded load must not write its rows over the live currency's maps.
        const termRes = await queryAll(termsSql(cc));
        if (superseded(token)) return;
        const termRows = tally(termRes);
        indexByStructure(termRows, termsByStructure);
        copyInto(foldToLoan(termRows, latestRate), terms);

        const itdRes = await queryAll(itdSql(cc));
        if (superseded(token)) return;
        const itdRows = tally(itdRes);
        indexByStructure(itdRows, itdByStructure);
        copyInto(foldToLoan(itdRows, sumItd), itd);

        // Fees almost never carry an advance, so they cannot be attributed to
        // a structure. They stay a loan-level figure and the structure panels say so.
        const feeRes = await queryAll(feesSql(cc));
        if (superseded(token)) return;
        const fees = new Map();
        indexBy(tally(feeRes), fees);
        fees.forEach((row, id) => {
          const existing = itd.get(id) || { loan_id: id };
          existing.itd_fees = row.itd_fees;
          itd.set(id, existing);
        });

        const nextRes = await queryAll(nextDueSql(cc));
        if (superseded(token)) return;
        const nextRows = tally(nextRes);
        indexByStructure(nextRows, nextDueByStructure);
        copyInto(foldToLoan(nextRows, earliestPayment), nextDue);

        const sql = drawsSql(cc);
        if (sql) {
          const drawRes = await queryAll(sql);
          if (superseded(token)) return;
          const drawRows = tally(drawRes);
          groupBy(drawRows, draws);
          groupByStructure(drawRows, drawsByStructure);
        }
        const structureSql = structuresSql(cc);
        if (structureSql) {
          const strRes = await queryAll(structureSql);
          if (superseded(token)) return;
          groupBy(tally(strRes), structures);
        }
        detailState = 'ready';
      } catch (err) {
        console.warn('loan detail unavailable: ' + err.message);
        detailState = 'failed';
      }
      // Only reached on a completed (non-superseded) run — a superseded load returned
      // above and must not cache a partial fetch under the currency it never finished.
      detailCache.set(cc, snapshotDetail());
      renderView();
    }

    // Closing is on the loan, draw period end on the structure, maturity on the advance.
    // There is no loan-level maturity column, so a loan matures when its last advance
    // does — the latest MATURITY_DATE among advances still active. A closed-out advance
    // must not set the loan's maturity, but if every advance is inactive the latest is
    // still better than showing nothing.
    //
    // Amortization start is deliberately not offered. No table in LOAN_OPS records it —
    // not LOAN, STRUCTURE, ADVANCE or TRANCHE — and deriving it from the first Principal
    // obligation is wrong: on a bullet loan that single row is the maturity repayment,
    // which would label a non-amortizing loan as amortizing from its final payment date.
    function dateRows(loan) {
      const id = String(loan.loan_id || '');
      const strs = structures.get(id) || [];
      const advs = draws.get(id) || [];
      const drawEnd = strs.map(s => s.draw_period_end).filter(Boolean).sort().pop();
      const live = advs.filter(a => a.is_active !== false);
      const maturityFrom = live.length ? live : advs;
      const maturity = maturityFrom.map(a => a.maturity).filter(Boolean).sort().pop();
      return [['Closing', loan.closing], ['Draw period end', drawEnd], ['Maturity', maturity]];
    }

    // One scope per structure. The loan roll-up is not offered as a choice — the table
    // row already carries the loan's headline figures — but it remains the fallback below
    // for a loan whose structures did not resolve, so the panel is never empty.
    function tabsFor(loan) {
      return (structures.get(String(loan.loan_id || '')) || [])
        .map(s => ({ label: s.structure_name || s.structure_type || 'Structure', structure: s }));
    }

    // The loan and each of its structures are described by the same six sections, so both
    // are reduced to this shape and rendered by one function. A field a scope genuinely
    // cannot answer is named as such rather than left to read as zero.
    function loanScope(loan) {
      const id = String(loan.loan_id || '');
      const advances = draws.get(id) || [];
      return {
        heading: 'Loan',
        term: terms.get(id), paid: itd.get(id), due: nextDue.get(id),
        dates: dateRows(loan),
        undrawn: loanUndrawn(loan),
        committed: loan.committed, outstanding: loan.outstanding, drawn: loan.drawn,
        advanceCount: advances.length || null,
        trancheCount: loan.tranche_count, lenderCount: loan.lender_count,
        advances: advances,
        feesKnown: true,
        expired: false,
      };
    }

    function structureScope(s) {
      const id = String(s.structure_id || '');
      const advances = drawsByStructure.get(id) || [];
      const live = advances.filter(a => a.is_active !== false);
      const maturity = (live.length ? live : advances)
        .map(a => a.maturity).filter(Boolean).sort().pop();
      return {
        heading: s.structure_type || 'Structure',
        term: termsByStructure.get(id), paid: itdByStructure.get(id),
        due: nextDueByStructure.get(id),
        dates: [['Closing', s.closing], ['Draw period end', s.draw_period_end],
                ['Maturity', maturity]],
        undrawn: structureUndrawn(s),
        committed: s.committed, outstanding: s.outstanding, drawn: s.drawn,
        advanceCount: s.advance_count, trancheCount: s.tranche_count,
        lenderCount: s.lender_count,
        advances: advances,
        // Fees carry no advance, so they cannot be attributed below the loan.
        feesKnown: false,
        expired: !!(s.draw_period_end && String(s.draw_period_end) < today),
        inactive: s.is_active === false,
      };
    }

    // The as-of names its basis: a memo date is the date the rate was billed under,
    // a period date only says which accrual period was in force.
    function asOfText(t) {
      if (!t || !t.as_of) return '';
      const basis = t.as_of_basis === 'memo' ? 'as of last memo' : 'as of period start';
      return `${basis} ${day(t.as_of)}`;
    }

    // The balance on a date is derived by the Loan Operations engine from the loan's terms
    // and payments; the warehouse stores no dated balance, so this is the one figure in the
    // panel that does not come from SQL.
    const BALANCE_COMMAND = 'loan_operations__get__loan_balance';
    const ACTING_FIRM_COMMAND = 'loan_operations__mutate__acting_firm';
    // A staff session reads Loan Operations as the firm it pinned, and a new one has none.
    const NO_ACTING_FIRM = /No lending firm is selected/;
    const BALANCE_ROWS = [
      ['Principal', 'principal'],
      ['Compounded PIK', 'compoundedPIK'],
      ['Accrued PIK', 'accruedPIK'],
      ['Accrued interest', 'accruedInterest'],
      ['Default interest', 'accruedDefaultInterest'],
      ['Fees', 'accruedFees'],
      ['Late fees', 'accruedLateFees'],
    ];

    function balanceKey(loan) {
      return String(loan.loan_id || '') + '|' + balanceDate;
    }

    function firstText(result) {
      return (result && result.content && result.content[0] && result.content[0].text) || '';
    }

    function balancePayload(result) {
      const structured = result && result.structuredContent;
      if (structured && Array.isArray(structured.structures)) return structured;
      const text = unwrap(result);
      let parsed = null;
      try { parsed = JSON.parse(text); } catch (_) {}
      if (parsed && Array.isArray(parsed.structures)) return parsed;
      // A refusal comes back as a line of prose rather than a payload; it is the message
      // to show. Anything longer is a response of some other kind, and printing it would
      // pour raw data into the drawer.
      const refusal = typeof text === 'string' ? text.trim() : '';
      throw new Error(refusal && refusal.length <= 300 && !/[\r\n]/.test(refusal)
        ? refusal
        : 'the balance came back in a shape this dashboard does not read');
    }

    async function readBalance(nano, date) {
      return withRetry(() => callMcp(command(BALANCE_COMMAND, {
        loan_nanoid: nano, as_of_date: date,
      })), 'Loading balance');
    }

    // Lets the reader's own gesture (opening a loan, picking a date) retry a failed read.
    // Never called from a render: loadBalance re-renders when it fails, so that would loop.
    function forgetFailedBalance() {
      const loan = openLoan();
      if (!loan) return;
      const key = balanceKey(loan);
      const entry = balances.get(key);
      if (entry && entry.state === 'failed') balances.delete(key);
    }

    // Pins the acting firm at most once per read: a second refusal means the pin did not
    // take, and asking again would only repeat it.
    async function loadBalance(loan) {
      const key = balanceKey(loan);
      if (balances.has(key)) return;
      const nano = safeId(loan.loan_nano_id);
      if (!nano) {
        balances.set(key, { state: 'failed', message: 'this loan has no Loan Operations id to read it by' });
        return;
      }
      const date = balanceDate;
      balances.set(key, { state: 'loading' });
      try {
        let result = await readBalance(nano, date);
        const slug = safeSlug(loan.company_slug);
        if (NO_ACTING_FIRM.test(firstText(result)) && slug) {
          unwrap(await callMcp(command(ACTING_FIRM_COMMAND, { firm: slug })));
          result = await readBalance(nano, date);
        }
        balances.set(key, { state: 'ready', data: balancePayload(result) });
      } catch (err) {
        balances.set(key, { state: 'failed', message: (err && err.message) || String(err) });
      }
      renderView();
    }

    // Structures on one loan can carry different currencies, and the roll-up only ever
    // adds figures in the currency on screen.
    function sumBalances(list) {
      const out = {};
      BALANCE_ROWS.concat([['Total', 'total']]).forEach(([, k]) => {
        out[k] = Math.round(list.reduce((t, b) => t + Number(b[k] || 0), 0) * 100) / 100;
      });
      return out;
    }

    // Every lender the balance lists, across its structures and its loan-scoped fees. A
    // co-lender's balance lists only its own firm's lenders.
    function balanceLenders(data) {
      const seen = new Map();
      data.structures.concat(data.loanFees ? [data.loanFees] : [])
        .flatMap(b => b.lenders || [])
        .forEach(l => { if (!seen.has(String(l.id))) seen.set(String(l.id), String(l.name || 'Lender')); });
      return Array.from(seen, ([id, name]) => ({ id: id, name: name }));
    }

    // The lenders the open loan's balance lists, and which of them the remembered choice
    // picks. A lender this loan does not list falls back to all lenders.
    function balanceLenderChoice(loan) {
      const entry = balances.get(balanceKey(loan));
      const lenders = entry && entry.state === 'ready' ? balanceLenders(entry.data) : [];
      return { entry: entry, lenders: lenders, chosen: lenders.find(l => l.id === balanceLender) || null };
    }

    // One lender's share of a balance, or the whole balance when no lender is chosen. A
    // lender with no share of it has none to show — never the whole balance in its place.
    function shareOf(balance, lenderId) {
      if (!balance || !lenderId) return balance;
      return (balance.lenders || []).find(l => String(l.id) === lenderId) || null;
    }

    function balanceHtml(loan, structureId, cc) {
      const { entry, chosen } = balanceLenderChoice(loan);
      const lenderId = chosen ? chosen.id : '';
      const heading = `<h3>Balance as of ${esc(day(balanceDate))}${chosen ? ' · ' + esc(chosen.name) : ''}</h3>`;
      if (!entry || entry.state === 'loading') {
        return `<section>${heading}<p class="status">Loading balance…</p></section>`;
      }
      if (entry.state === 'failed') {
        return `<section>${heading}<p class="status">Balance unavailable: ${esc(entry.message)}</p></section>`;
      }
      const data = entry.data;
      let balance = null;
      let code = cc;
      if (structureId) {
        const structure = data.structures.find(s => String(s.id) === structureId) || null;
        balance = shareOf(structure, lenderId);
        code = structure ? structure.currency : cc;
      } else {
        const shares = data.structures.filter(s => s.currency === cc)
          .map(s => shareOf(s, lenderId)).filter(Boolean);
        balance = shares.length ? sumBalances(shares) : null;
      }
      if (!balance) {
        const what = structureId ? 'structure' : 'loan';
        return `<section>${heading}<p class="status">${chosen
          ? `${esc(chosen.name)} holds no share of this ${what}.`
          : `No balance recorded for this ${what}.`}</p></section>`;
      }
      const rows = BALANCE_ROWS.map(([label, k]) =>
        `<dt>${esc(label)}</dt><dd>${moneyExact(Number(balance[k]), code)}</dd>`).join('');
      const total = `<dt class="balance-total">Total</dt>` +
        `<dd class="balance-total"><strong>${moneyExact(Number(balance.total), code)}</strong></dd>`;
      // Loan-scoped fees belong to no structure, so they sit beside the total, never in it.
      const loanFees = shareOf(data.loanFees, lenderId);
      const fees = loanFees
        ? `<p class="drawer-inline">Loan-level fees ${moneyExact(Number(loanFees.total), data.loanFees.currency)}` +
          ' · not attributed to a structure, not in the total</p>'
        : '';
      return `<section>${heading}<dl>${rows}${total}</dl>${fees}</section>`;
    }

    // A summary band, then the detail. The four figures at the top are what a reader
    // opens the panel for — how much is out, how much is left, what it costs, what falls
    // due — so they carry the weight and everything below reads as reference. Six
    // equally-weighted cards gave `Day count: ACTUAL_360` the same voice as the
    // commitment, and spent a quarter of the panel's height on borders and padding.
    function panelHtml(scope, cc) {
      const term = scope.term;
      const paid = scope.paid;
      const due = scope.due;

      const undrawnNote = scope.inactive ? 'structure inactive'
        : scope.expired ? 'draw period ended' : '';
      // A projected obligation is the engine's forward schedule, not a bill that has been
      // issued. Saying which it is keeps a forecast from reading as a commitment.
      const projected = due && due.next_is_projected === true ? ' · projected' : '';

      const figure = (label, value, note) => `
        <div class="sum">
          <span class="sum-label">${esc(label)}</span>
          <span class="sum-value">${value}</span>
          ${note ? `<span class="sum-note">${note}</span>` : ''}
        </div>`;

      // One figure per cell. Three exact amounts stacked in the Outstanding cell wrapped
      // mid-phrase and left the reader three 14-character numbers to separate by eye.
      const summary = `
        <div class="panel-summary">
          ${figure('Outstanding', moneyWhole(scope.outstanding, cc),
              `of ${moneyWhole(scope.committed, cc)} committed`)}
          ${figure('Undrawn', scope.undrawn === null || scope.undrawn === undefined
              ? '—' : moneyWhole(scope.undrawn, cc), undrawnNote)}
          ${figure('Effective rate', term ? rate(term.rate) : '—',
              term ? esc(asOfText(term)) : 'no interest terms recorded')}
          ${figure('Next payment', moneyWhole(due && due.next_amount, cc),
              due ? esc(day(due.next_date)) + projected : 'nothing scheduled')}
        </div>`;

      const termRows = term ? [
        ['Credit spread', rate(term.credit_spread)],
        ['Benchmark', term.benchmark_name ? `${esc(term.benchmark_name)} ${rate(term.benchmark_rate)}` : '—'],
        ['Benchmark floor', term.benchmark_floor === null ? '—' : rate(term.benchmark_floor)],
        ['Day count', term.day_count ? esc(term.day_count) : '—'],
        ['PIK', term.is_pik === true ? 'Yes' : 'No'],
      ] : null;

      // PIK compounded is accrued, not repaid, so this stays "Payments" rather than
      // anything that claims the whole list was paid.
      const paymentRows = [
        ['Drawn to date', moneyExact(scope.drawn, cc)],
        ['ITD principal', moneyExact(paid && paid.itd_principal, cc)],
        ['ITD interest', moneyExact(paid && paid.itd_interest, cc)],
        ['ITD PIK repaid', moneyExact(paid && paid.itd_pik, cc)],
        ['PIK compounded', moneyExact(paid && paid.pik_compounded, cc)],
        ['ITD fees', scope.feesKnown
          ? moneyExact(paid && paid.itd_fees, cc)
          : '<span class="status">loan-level only</span>'],
      ];

      // Three integers did not earn a section of their own.
      const composition = [
        [scope.advanceCount, 'advance', 'advances'],
        [scope.trancheCount, 'tranche', 'tranches'],
        [scope.lenderCount, 'lender', 'lenders'],
      ].filter(([n]) => n !== null && n !== undefined)
       .map(([n, one, many]) => `${num(n)} ${Number(n) === 1 ? one : many}`)
       .join(' · ');

      const dl = rows => `<dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`;

      return summary + `
        <div class="drawer-grid">
          ${scope.balance || ''}
          <section>
            <h3>Key terms</h3>
            ${termRows ? dl(termRows) : '<p class="status">No interest terms recorded.</p>'}
          </section>
          <section>
            <h3>Key dates</h3>
            ${scope.dates.length
              ? dl(scope.dates.map(([k, v]) => [k, day(v)]))
              : '<p class="status">Key dates not available in this context.</p>'}
            ${composition ? `<p class="drawer-inline">${composition}</p>` : ''}
          </section>
          <section>
            <h3>Payments</h3>
            ${dl(paymentRows)}
          </section>
          <section>
            <h3>Schedule of draws</h3>
            ${scope.advances.length ? `
              <table class="drawer-table">
                <thead><tr><th>Advance</th><th>Date</th><th class="num">Amount</th></tr></thead>
                <tbody>${scope.advances.map(d => `
                  <tr><td>${esc(d.advance_name || '—')}</td><td>${day(d.advance_date)}</td>
                      <td class="num">${moneyExact(d.amount, cc)}</td></tr>`).join('')}
                </tbody>
              </table>`
              : `<p class="status">${ADVANCES ? 'No draws recorded.' : 'Draw schedule not available in this context.'}</p>`}
          </section>
        </div>`;
    }

    // The picker and the body have to agree on which scope is showing, so both come out
    // of one call. `options` is null when there is nothing to pick between.
    function panelParts(loan, cc) {
      if (detailState === 'loading') {
        return { options: null, body: '<p class="status">Loading loan detail…</p>' };
      }
      const scopes = tabsFor(loan);
      // No structures resolved — the table is not configured for them, or the query
      // failed. Fall back to the loan roll-up rather than render an empty panel.
      if (!scopes.length) {
        return { options: null,
                 body: panelHtml({ ...loanScope(loan), balance: balanceHtml(loan, null, cc) }, cc) };
      }
      const active = Math.min(openTab, scopes.length - 1);
      // One structure is not a choice, and its own heading names it.
      const options = scopes.length > 1
        ? scopes.map((s, i) =>
            `<option value="${i}"${i === active ? ' selected' : ''}>${esc(s.label)}</option>`).join('')
        : null;
      const structure = scopes[active].structure;
      const balance = balanceHtml(loan, structure.structure_id ? String(structure.structure_id) : null, cc);
      return { options: options, body: panelHtml({ ...structureScope(structure), balance: balance }, cc) };
    }

    // The loan the panel is describing, found by id so it survives a re-sort. Looked up
    // in the whole fetched set, not the visible rows: filtering the list must not blank
    // a panel the reader deliberately opened.
    function openLoan() {
      if (!openLoanId) return null;
      return loans.find(l => String(l.loan_id || '') === openLoanId) || null;
    }

    function showPanel(loanId) {
      const same = openLoanId === loanId;
      openLoanId = loanId;
      forgetFailedBalance();
      // Switching loans starts on the Loan tab; re-opening the same one keeps its place.
      if (!same) openTab = 0;
      // Focus deliberately stays where the reader put it. Pulling it into the panel is
      // modal behaviour: it would strand someone working down the list of names, which
      // is the whole reason the panel is non-modal. The trigger carries aria-controls,
      // so assistive tech can move to the panel on request.
      //
      // But renderView replaces the row, which destroys the element that had focus and
      // drops it to the document body — resetting a keyboard reader to the top of the
      // page mid-list. So note the name and put focus back on its replacement. That
      // restores focus where it already was; it never moves it somewhere new.
      const active = document.activeElement;
      const refocus = active && active.classList && active.classList.contains('loan-name')
        ? String(active.dataset.loanId || '')
        : null;
      renderView();
      if (!refocus) return;
      const again = document.querySelector(`.loan-name[data-loan-id="${cssEscape(refocus)}"]`);
      if (again && again.focus) again.focus();
    }

    function closePanel() {
      const wasOpen = openLoanId;
      const panel = document.getElementById('loan-panel');
      // Only rescue focus if it was inside the panel. Anywhere else and the reader is
      // mid-task — in the filter box, on another row — and moving it would interrupt.
      const focusWasInside = panel && document.activeElement &&
        panel.contains(document.activeElement);
      openLoanId = null;
      renderView();
      if (!focusWasInside) return;
      const back = wasOpen
        ? document.querySelector(`.loan-name[data-loan-id="${cssEscape(wasOpen)}"]`)
        : null;
      const target = back || document.getElementById('loan-filter');
      if (target && target.focus) target.focus();
    }

    // Loan ids are warehouse values reaching a selector. CSS.escape where it exists;
    // otherwise fall back to the shape check the deep link already relies on.
    function cssEscape(value) {
      if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(value);
      return safeId(value) || '\\0';
    }

    // Offered only once the balance has arrived, since the balance is what names them.
    function renderBalanceLenderPicker(loan) {
      const picker = document.getElementById('panel-balance-lender');
      const label = document.querySelector('label[for="panel-balance-lender"]');
      if (!picker || !label) return;
      const { lenders, chosen } = balanceLenderChoice(loan);
      picker.hidden = label.hidden = lenders.length === 0;
      if (!lenders.length) return;
      const selected = chosen ? chosen.id : '';
      const hadFocus = document.activeElement === picker;
      picker.innerHTML = [`<option value=""${selected ? '' : ' selected'}>All lenders</option>`]
        .concat(lenders.map(l =>
          `<option value="${esc(l.id)}"${l.id === selected ? ' selected' : ''}>${esc(l.name)}</option>`))
        .join('');
      if (hadFocus && picker.focus) picker.focus();
    }

    function renderPanel(cc) {
      const panel = document.getElementById('loan-panel');
      const body = document.getElementById('panel-body');
      if (!panel || !body) return;
      const loan = openLoan();
      if (!loan) {
        // The content stays in place while it slides out — clearing it here would empty
        // the panel in front of the reader. It is invisible either way once closed.
        panel.classList.remove('is-open');
        document.body.classList.remove('has-panel');
        return;
      }
      document.getElementById('panel-title').textContent = loan.loan_name || 'Loan';
      // Named once, in the panel, rather than left to a bare currency symbol.
      document.getElementById('panel-ccy').textContent = cc || '';
      document.getElementById('panel-sub').textContent =
        [loan.borrower_name, loan.lead_lender_name].filter(Boolean).join(' · ');
      const url = loanUrl(loan);
      document.getElementById('panel-link').innerHTML = url
        ? `<a class="loan-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">View in Carta</a>`
        : '';
      const asOf = document.getElementById('panel-asof-date');
      if (asOf && asOf.value !== balanceDate) asOf.value = balanceDate;
      if (!balances.has(balanceKey(loan))) loadBalance(loan);
      renderBalanceLenderPicker(loan);
      // Detail arrives after the panel may already be open, so the body re-renders. Keep
      // the scroll position or the reader is thrown back to the top when structures land.
      const parts = panelParts(loan, cc);
      const scopeRow = document.getElementById('panel-scope');
      const picker = document.getElementById('panel-scope-select');
      // One scope is not a choice, and the body already names it.
      scopeRow.hidden = !parts.options;
      if (parts.options) {
        // Rebuilding the options drops focus, and the reader may have just used the
        // keyboard to get here. Put it back if it was theirs.
        const hadFocus = document.activeElement === picker;
        picker.innerHTML = parts.options;
        if (hadFocus && picker.focus) picker.focus();
      }
      const scroll = body.scrollTop;
      body.innerHTML = parts.body;
      body.scrollTop = scroll;
      panel.classList.add('is-open');
      // The page reserves the panel's width while it is open.
      document.body.classList.add('has-panel');
    }

    // Sums the per-loan rows in scope — every loan in the currency, or just the narrowed
    // ones. Returns null when the obligations table was not resolved, which is what drops
    // the tile rather than showing a zero.
    function paymentsFor(cc) {
      const mine = payments.filter(r => r.currency_code === cc);
      if (!mine.length) return null;
      const ids = narrowed()
        ? new Set(tileRows().map(l => String(l.loan_id)))
        : null;
      const scoped = ids ? mine.filter(r => ids.has(String(r.loan_id))) : mine;
      const out = {};
      for (const r of scoped) {
        for (const k of Object.keys(r)) {
          if (k === 'currency_code' || k === 'loan_id') continue;
          const v = Number(r[k]);
          // Absent stays absent: a window with no billed column must not read as zero
          // billed, which would claim the whole amount is projected.
          if (!Number.isFinite(v)) continue;
          out[k] = (out[k] || 0) + v;
        }
      }
      return out;
    }

    // Any narrowing at all — lender or search text — puts the tiles on the rows the
    // table is showing. Honouring only the lender left the headline counting the whole
    // currency while a search emptied the table beneath it.
    function narrowed() {
      return Boolean(lender || filterText.trim());
    }

    // The rows every tile describes: the visible ones when narrowed, else the currency.
    function tileRows() {
      return narrowed() ? visibleRows() : loans;
    }

    // Names what is doing the narrowing, so a scoped headline says what it is scoped to.
    function scopeLabel() {
      const parts = [];
      if (lender) parts.push(`with ${lender}`);
      const needle = filterText.trim();
      if (needle) parts.push(`matching “${needle}”`);
      return parts.join(' ');
    }

    // The aggregate row covers the whole portfolio, inactive loans included, which is
    // what lets the unnarrowed Active Loans tile say "N in portfolio". A narrowed view
    // can only sum the active rows it fetched, so it reports those and names its scope.
    function tileSource(cc) {
      if (!narrowed()) {
        return { row: byCurrency.find(r => r.currency_code === cc) || {}, scope: null };
      }
      const mine = tileRows();
      const sum = key => mine.reduce((acc, l) => acc + (Number(l[key]) || 0), 0);
      return {
        row: {
          total_loans: mine.length, active_loans: mine.length,
          total_committed: sum('committed'), total_drawn: sum('drawn'),
          total_outstanding: sum('outstanding'),
        },
        scope: scopeLabel(),
      };
    }

    // Painted before the first query returns and replaced by the real render. Eight tiles
    // and six rows approximate the common case; being slightly wrong costs one reflow,
    // where showing nothing costs the reader their confidence that it is working.
    function showSkeleton() {
      const kpis = document.getElementById('kpis');
      if (kpis && !kpis.innerHTML) {
        kpis.innerHTML = Array.from({ length: 8 },
          () => '<div class="tile skeleton skeleton-tile"></div>').join('');
      }
      const body = document.getElementById('loan-rows');
      if (body && !body.innerHTML) {
        body.innerHTML = Array.from({ length: 6 }, () =>
          `<tr><td colspan="6">${Array.from({ length: 3 },
            () => '<div class="skeleton skeleton-cell"></div>').join('')}</td></tr>`).join('');
      }
    }

    // Only ever removes the placeholder: a real render replaces it by writing over the same
    // node, so this must not touch anything it did not put there.
    function clearSkeleton() {
      for (const id of ['kpis', 'loan-rows']) {
        const el = document.getElementById(id);
        if (el && el.innerHTML && el.innerHTML.indexOf('skeleton') !== -1) el.innerHTML = '';
      }
    }

    function renderTiles() {
      const cc = currency;
      const picked = tileSource(cc);
      const row = picked.row;
      const tileScope = picked.scope;
      const inactive = (row.total_loans || 0) - (row.active_loans || 0);
      const undrawn = undrawnFor(tileRows());
      // Every label repeats the currency it is scoped to, right in the tile — not just
      // in the banner above — so a screenshot or a glance at one tile alone still says
      // which currency's figures it holds.
      const tiles = [
        {
          label: `Active Loans (${cc})`,
          value: num(row.active_loans),
          sub: tileScope
            ? `active loans ${tileScope}`
            : `${num(row.total_loans)} in portfolio · ${num(inactive)} inactive`,
        },
        { label: `Committed (${cc})`, value: money(row.total_committed, cc) },
        // Each ratio sits under the figure it divides. Reporting outstanding/committed
        // beneath the drawn figure read as utilisation and understated it.
        {
          label: `Drawn (${cc})`,
          value: money(row.total_drawn, cc),
          sub: `${num(Math.round(ratio(row.total_drawn, row.total_committed)))}% of commitment drawn`,
        },
        {
          label: `Outstanding (${cc})`,
          value: money(row.total_outstanding, cc),
          sub: `${num(Math.round(ratio(row.total_outstanding, row.total_committed)))}% of commitment outstanding`,
          note: 'incl. PIK',
        },
        { label: `Undrawn Capacity (${cc})`, value: undrawn === null ? '—' : money(undrawn, cc),
          // A filter that matches no loans has no structures either — that is an empty
          // scope, not a load still in flight, and saying "loading" would never resolve.
          sub: undrawn !== null ? 'by structure type'
               : detailState === 'loading' ? 'loading structures…'
               : 'no structures in scope' },
      ];
      const due = paymentsFor(cc);
      if (due) {
        [['Principal', 'principal'], ['Interest', 'interest'], ['Fees', 'fees']].forEach(([label, key]) => {
          const total = due[`${key}_${paymentWindow}`];
          const billed = due[`${key}_${paymentWindow}_billed`];
          // Most of the window is usually the engine's forward schedule. Naming the
          // billed share stops a forecast being read as money already demanded.
          const hasBilled = billed !== undefined && billed !== null;
          tiles.push({
            label: `${label} Due (${cc})`,
            value: money(total, cc),
            sub: `next ${paymentWindow} days`,
            note: hasBilled ? `${money(billed, cc)} billed · rest projected` : undefined,
          });
        });
      }
      document.getElementById('kpis').innerHTML = tiles.map(t => `
        <div class="tile">
          <span class="tile-label">${esc(t.label)}</span>
          <span class="tile-value">${t.value}</span>
          ${t.sub ? `<span class="tile-sub">${esc(t.sub)}</span>` : ''}
          ${t.note ? `<span class="tile-note">${esc(t.note)}</span>` : ''}
        </div>
      `).join('');
    }

    // Sorting and filtering act on rows already fetched — no re-query.
    function visibleRows() {
      const needle = filterText.trim().toLowerCase();
      const filtered = loans.filter(l => {
        if (lender && String(l.lead_lender_name || '') !== lender) return false;
        if (!needle) return true;
        return String(l.loan_name || '').toLowerCase().includes(needle) ||
               String(l.borrower_name || '').toLowerCase().includes(needle);
      });
      const dir = sortDir === 'asc' ? 1 : -1;
      return filtered.sort((a, b) => dir * compareBy(sortKey, a, b));
    }

    function compareBy(key, a, b) {
      // A missing figure is not a small one, so nulls sink whichever way we sort.
      const dir = sortDir === 'asc' ? 1 : -1;
      // Derived from the loan's structures rather than read off the row, so it sinks on
      // null for the same reason a missing column does — the structures may not be in yet.
      if (key === 'utilization') {
        const ua = loanUtilization(a);
        const ub = loanUtilization(b);
        if (ua === null) return ub === null ? 0 : dir;
        if (ub === null) return -dir;
        return ua - ub;
      }
      const x = a[key];
      const y = b[key];
      if (x === null || x === undefined) return (y === null || y === undefined) ? 0 : dir;
      if (y === null || y === undefined) return -dir;
      if (typeof x === 'number' && typeof y === 'number') return x - y;
      return String(x).localeCompare(String(y));
    }

    // Lenders come from the fetched rows, so the list only ever offers real choices.
    function renderLenderPicker() {
      const select = document.getElementById('lender-filter');
      const names = Array.from(new Set(loans.map(l => l.lead_lender_name).filter(Boolean))).sort();
      select.innerHTML = [`<option value="">All lenders (${num(names.length)})</option>`]
        .concat(names.map(n => `<option value="${esc(n)}"${n === lender ? ' selected' : ''}>${esc(n)}</option>`))
        .join('');
    }

    // The figure ties out; the bar is what makes the column scannable down its length.
    // structureCommitted floors the denominator at the numerator, so the ratio cannot exceed
    // 100 and pct() is left only guarding against float drift.
    function utilizationCell(loan) {
      const u = loanUtilization(loan);
      if (u === null) {
        return `<span class="util-empty">—</span>`;
      }
      // The bar is hidden from assistive tech: the figure beside it already says the number.
      return `<span class="util">` +
        `<span class="util-figure">${num(Math.round(u))}%</span>` +
        `<span class="util-track" aria-hidden="true">` +
          `<span class="util-fill" style="width:${pct(u)}%"></span>` +
        `</span></span>`;
    }

    // Used over committed across the rows on screen — never a mean of the per-loan
    // percentages, which would weight a $15M line the same as an $85M one.
    function portfolioUtilization(rows) {
      let used = 0;
      let committed = 0;
      let known = false;
      rows.forEach(l => {
        const list = structures.get(String(l.loan_id || ''));
        if (!list || !list.length) return;
        known = true;
        list.forEach(s => {
          used += structureUsed(s);
          committed += structureCommitted(s);
        });
      });
      if (!known || !committed) return '—';
      return `${num(Math.round((used / committed) * 100))}%`;
    }

    function renderRows(rows, cc) {
      const tbody = document.getElementById('loan-rows');
      if (!rows.length) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="6">No active loans match</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map(l => {
        const id = String(l.loan_id || '');
        const open = id !== '' && id === openLoanId;
        // The loan name IS the control, per the house rule that entity names are the
        // anchor — never a separate column of chevrons or Open links. It opens the
        // detail panel; the jump out to Loan Operations lives in that panel's header.
        return `
          <tr class="loan-row${open ? ' is-open' : ''}" data-loan-id="${esc(id)}">
            <td class="name" title="${esc(l.loan_name)}">
              <button type="button" class="loan-name" data-loan-id="${esc(id)}"
                      aria-controls="loan-panel"
                      aria-expanded="${open}">${esc(l.loan_name)}</button>
            </td>
            <td class="name" title="${esc(l.borrower_name)}">${esc(l.borrower_name)}</td>
            <td class="name" title="${esc(l.lead_lender_name)}">${esc(l.lead_lender_name)}</td>
            <td class="num">${moneyExact(l.committed, cc)}</td>
            <td class="num">${moneyExact(l.outstanding, cc)}</td>
            <td class="num">${utilizationCell(l)}</td>
          </tr>`;
      }).join('');
    }

    // Totals for what is on screen, in the one currency on screen.
    function renderFooter(rows, cc) {
      const foot = document.getElementById('loan-totals');
      if (!rows.length) {
        foot.hidden = true;
        return;
      }
      const sum = key => rows.reduce((acc, l) => acc + (Number(l[key]) || 0), 0);
      document.getElementById('total-label').textContent = rows.length === loans.length
        ? `Total — ${num(rows.length)} active loans`
        : `Filtered total — ${num(rows.length)} of ${num(loans.length)} active loans`;
      document.getElementById('total-committed').textContent = moneyExact(sum('committed'), cc);
      document.getElementById('total-outstanding').textContent = moneyExact(sum('outstanding'), cc);
      document.getElementById('total-utilization').textContent = portfolioUtilization(rows);
      foot.hidden = false;
    }

    // A cap that is not stated reads as "this is all of them".
    function renderCount(shown, cc) {
      document.getElementById('loans-heading').textContent = shown === loans.length
        ? `${num(shown)} active ${shown === 1 ? 'loan' : 'loans'} in ${cc}`
        : `${num(shown)} of ${num(loans.length)} active loans in ${cc}`;
      const note = document.getElementById('loans-note');
      const odd = staleCommitmentStructures();
      if (odd) {
        note.textContent = `${num(odd)} structure${odd === 1 ? '' : 's'} show draws above the recorded` +
          ' commitment — an add-on advance the commitment snapshot has not caught up with.';
        note.hidden = false;
      } else if (skippedRows) {
        note.textContent = `${num(skippedRows)} row${skippedRows === 1 ? '' : 's'} could not be read` +
          " — the response didn't match its own columns, so those loans are missing from this view.";
        note.hidden = false;
      } else if (skippedDetailRows) {
        note.textContent = `${num(skippedDetailRows)} detail row${skippedDetailRows === 1 ? '' : 's'}` +
          " could not be read — the response didn't match its own columns, so some loans are" +
          ' missing terms, balances or draws.';
        note.hidden = false;
      } else if (truncated) {
        note.textContent = `Showing the first ${num(loans.length)} loans — the portfolio is larger than this view fetches.`;
        note.hidden = false;
      } else {
        // Cleared, not just hidden — a stale note must not reappear if the row is shown.
        note.textContent = '';
        note.hidden = true;
      }
    }

    function renderView() {
      const rows = visibleRows();
      renderRows(rows, currency);
      renderTiles();
      renderLenderPicker();
      renderFooter(rows, currency);
      renderCount(rows.length, currency);
      markSortedColumn();
      renderPanel(currency);
    }

    function markSortedColumn() {
      SORTABLE.forEach(key => {
        const th = document.getElementById('sort-' + key);
        if (!th) return;
        th.setAttribute('aria-sort', key === sortKey ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
        const ind = document.getElementById('ind-' + key);
        // A neutral caret on every other column, so a sortable header reads as sortable
        // before it is clicked.
        if (ind) {
          ind.innerHTML = key === sortKey
            ? inkIcon(sortDir === 'asc' ? 'up-carat' : 'down-carat', 10)
            : inkIcon('sort-carat', 10);
        }
      });
    }

    // Same column toggles direction; a new one starts descending for figures.
    function sortOn(key) {
      if (sortKey === key) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortKey = key;
        sortDir = (key === 'loan_name' || key === 'borrower_name') ? 'asc' : 'desc';
      }
      renderView();
    }

    // The aggregate counts every loan, but the table lists active ones only. A currency
    // whose loans are all inactive therefore offered a switch that emptied the table and
    // changed nothing else, so it is not a choice — it is not offered.
    function selectableCurrencies() {
      const withActive = byCurrency.filter(r => Number(r.active_loans) > 0);
      return withActive.length ? withActive : byCurrency;
    }

    // Every picker option names its own scope, so no total can be misread.
    function renderCurrencyPicker(cc) {
      const controls = document.getElementById('controls');
      const select = document.getElementById('currency');
      const banner = document.getElementById('currency-banner');
      const bannerText = document.getElementById('currency-banner-text');
      const options = selectableCurrencies();
      // One currency to choose from is not a choice; the tiles and heading already name it.
      // The banner is the same call — nothing to disambiguate if there is only one scope.
      if (options.length < 2) {
        controls.hidden = true;
        if (banner) banner.hidden = true;
        return;
      }
      controls.hidden = false;
      select.innerHTML = options.map(r =>
        `<option value="${esc(r.currency_code)}"${r.currency_code === cc ? ' selected' : ''}>` +
        `${esc(r.currency_code)} (${num(r.total_loans)})</option>`
      ).join('');
      const otherCodes = options.filter(r => r.currency_code !== cc).map(r => r.currency_code);
      const others = otherCodes.length;
      if (banner && bannerText) {
        banner.hidden = false;
        bannerText.innerHTML =
          `Every figure below — KPI tiles, the loan table, loan detail — is scoped to ` +
          `<strong>${esc(cc)}</strong> only. This portfolio also holds loans in ` +
          `<strong>${otherCodes.map(esc).join(', ')}</strong>; switch the Currency picker ` +
          `below to see ${others === 1 ? 'them' : 'those'}.`;
      }
    }

    // Switching currency starts a new load while the old one is still in flight. The
    // token says which load owns the display: a stale one returns rather than rendering
    // one currency's rows under another's code. Comparing `currency` alone would not do
    // — switching away and straight back re-selects the same code with two loads live.
    let showToken = 0;

    function superseded(token) {
      return token !== showToken;
    }

    // Rows already fetched this session, keyed by currency. Switching back to a currency
    // you just left refetched every page — the same paginated round trip, for data that had
    // not moved. Lives for the life of the view; reopening the artifact refetches.
    const loanCache = new Map();

    async function show(code) {
      const cc = safeCurrency(code);
      if (!cc) throw new Error('unrecognized currency code');
      const token = ++showToken;
      currency = cc;
      renderCurrencyPicker(cc);

      const hit = loanCache.get(cc);
      if (hit) {
        loans = hit.rows;
        truncated = hit.truncated;
        skippedRows = hit.skipped;
        openLoanId = null;
        // Restore this currency's own terms/balances/draws, not whatever currency's
        // detail maps happen to be sitting in memory from the last one shown.
        const detailHit = detailCache.get(cc);
        if (detailHit) restoreDetail(detailHit);
        renderView();
        status('');
        progress(null);
        // No detail cached yet for this currency (its first load was superseded before
        // finishing) — fetch it now rather than leaving the panel on stale maps.
        if (!detailHit) loadDetails(cc, token).catch(err => console.warn(err));
        return;
      }

      renderTiles();
      status('Loading loans…');
      const loaded = await queryAll(loansSql(cc), (count, total) => {
        status(total ? `Loading loans… ${num(count)} of ${num(total)}` : `Loading loans… ${num(count)}`);
        progress(count, total);
      }, partial => {
        // Paint what has arrived. A stale load must not overwrite the current one.
        if (superseded(token)) return;
        // Checked on every page, not just at the end: a scope change mid-load would
        // otherwise be painted before anything noticed.
        loans = assertFirm(partial);
        // The panel is keyed by loan, so a page that re-sorts underneath it keeps
        // describing the loan the reader opened rather than whatever took its place.
        renderView();
      });
      if (superseded(token)) return;
      loans = assertFirm(loaded.rows);
      truncated = loaded.truncated;
      skippedRows = loaded.skipped || 0;
      // Only a complete fetch is cached. A truncated one would serve a silent subset back
      // on every later switch, with nothing on screen saying it was partial.
      if (!loaded.truncated) {
        loanCache.set(cc, { rows: loaded.rows, truncated: false, skipped: loaded.skipped || 0 });
      }
      renderView();
      status('');
      progress(null);
      // Detail loads in the background: the table is usable while it fills in.
      loadDetails(cc, token).catch(err => console.warn(err));
    }

    // The connector gates every command behind welcome, and an unresolved session answers
    // with no rows rather than an error. Pinning the firm afterwards is what makes the
    // rows belong to THIS dashboard's firm rather than the viewer's last-used one.
    async function ensureSession() {
      if (!welcomeCalled) {
        try {
          const res = await callCartaTool(WELCOME_TOOL, {});
          if (!res || !res.isError) welcomeCalled = true;
        } catch (err) {
          console.warn('welcome failed: ' + (err && err.message ? err.message : err));
        }
      }
      if (!FIRM_CONTEXT_ID) return;
      try {
        const ctx = await callCartaTool('set_context', { firm_id: FIRM_CONTEXT_ID });
        if (ctx && ctx.isError) console.warn('could not pin the firm context; rows may be another firm\'s');
      } catch (err) {
        console.warn('could not pin the firm context: ' + (err && err.message ? err.message : err));
      }
    }

    async function init() {
      document.getElementById('scope').textContent = CONFIG.firm_name || '';
      // Before the connector gate, which polls up to 2s: the skeleton has to be on the
      // first frame or that wait is a blank page.
      status('Loading loan portfolio…');
      progress(0);
      showSkeleton();
      if (!(await mcpNamespace())) {
        fail(new Error('this dashboard reads live data, and no Carta connector is available in this view'));
        return;
      }
      await ensureSession();
      try {
        // Independent queries, so they go together — serially this cost a full extra
        // round trip before the first tile could render.
        const [kpi, due] = await Promise.all([
          query(kpiSql()),
          // Paginated: one row per LOAN now, not one per currency, so a large book runs
          // past a single page. Absent obligations data drops the tile rather than failing
          // the dashboard.
          OBLIGATIONS
            ? queryAll(paymentsSql()).catch(err => {
                console.warn('scheduled payments unavailable: ' + err.message);
                return { rows: [] };
              })
            : Promise.resolve({ rows: [] }),
        ]);
        byCurrency = kpi.rows;
        payments = due.rows;
        if (!byCurrency.length) {
          // Clears the tiles too — this path only ever replaced the rows, so the KPI
          // placeholder shimmered on beside "No loans in scope".
          clearSkeleton();
          progress(null);
          document.getElementById('loan-rows').innerHTML =
            `<tr class="empty-row"><td colspan="6">No loans in scope</td></tr>`;
          status('No data in scope.');
          return;
        }
        document.getElementById('currency').addEventListener('change', ev => {
          show(ev.target.value).catch(fail);
        });
        document.getElementById('payment-window').addEventListener('change', ev => {
          paymentWindow = parseInt(ev.target.value, 10) || 30;
          renderTiles();
        });
        document.getElementById('lender-filter').addEventListener('change', ev => {
          lender = ev.target.value || '';
          renderView();
        });
        document.getElementById('loan-rows').addEventListener('click', ev => {
          // The name button carries the id; a click anywhere else on the row reads it off
          // the row, so the whole row stays a target without needing its own id lookup.
          const btn = ev.target && ev.target.closest && ev.target.closest('.loan-name');
          const row = ev.target && ev.target.closest && ev.target.closest('tr.loan-row');
          const id = (btn && btn.dataset.loanId) || (row && row.dataset.loanId);
          if (id) showPanel(id);
        });
        // The tab strip and the Loan Operations link both live in the panel.
        document.getElementById('loan-panel').addEventListener('click', ev => {
          const link = ev.target && ev.target.closest && ev.target.closest('a.loan-link');
          if (link) {
            // A modifier-click already means "new tab"; leave it to the browser.
            if (ev.metaKey || ev.ctrlKey || ev.shiftKey) return;
            // Never let the default run: a host that blocks target="_blank" can land the
            // navigation on this frame instead, replacing the dashboard with one loan.
            ev.preventDefault();
            openExternal(link.href);
            return;
          }
        });
        document.getElementById('panel-scope-select').addEventListener('change', ev => {
          openTab = parseInt(ev.target.value, 10) || 0;
          renderView();
        });
        document.getElementById('panel-asof-date').addEventListener('change', ev => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(ev.target.value)) return;
          balanceDate = ev.target.value;
          forgetFailedBalance();
          renderView();
        });
        document.getElementById('panel-balance-lender').addEventListener('change', ev => {
          balanceLender = String(ev.target.value || '');
          renderView();
        });
        document.getElementById('panel-close').addEventListener('click', closePanel);
        // Escape is the one gesture every reader expects of an overlay.
        document.addEventListener('keydown', ev => {
          if (ev.key === 'Escape' && openLoanId) {
            ev.preventDefault();
            closePanel();
          }
        });
        document.getElementById('loan-filter').addEventListener('input', ev => {
          filterText = ev.target.value || '';
          renderView();
        });
        SORTABLE.forEach(key => {
          const th = document.getElementById('sort-' + key);
          if (th) th.addEventListener('click', () => sortOn(key));
        });
        // Open on a currency that has rows to show, not merely the largest by loan count.
        await show(selectableCurrencies()[0].currency_code);
      } catch (err) {
        fail(err);
      }
    }

    init();
  </script>
</body>
</html>
