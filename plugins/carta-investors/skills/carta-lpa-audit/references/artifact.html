        // row by RECORD_INDEX is the Nth array entry (validated: counts always
        // match). Joining by name instead would miss every unnamed LP.
        let rjLps = rjGet(rawJson, 'parties', 'limited_partners');
        if (!Array.isArray(rjLps)) rjLps = [];

        // The per-field currency_code siblings are rare; most LPAs carry only the free-form value.
        const currencyCode = currencyCodes.length ? currencyCodes[0] : freeformCurrency(rjGet(rawJson, 'currency'));
        const lps = lpRecordIndexes.map((_, lpPos) => {
          const rjLp = rjLps[lpPos] && typeof rjLps[lpPos] === 'object' ? rjLps[lpPos] : {};
          return {
            name: toStr(unwrapEnv(rjLp.name)),
            entityType: toStr(unwrapEnv(rjLp.entity_type)),
            commitmentAmount: toFloat(unwrapEnv(rjLp.commitment_amount)),
            percentageInterest: toFloat(unwrapEnv(rjLp.percentage_interest)),
            address: toStr(unwrapEnv(rjLp.address)),
            // A fund's roster can span several documents, so each LP keeps the
            // currency of the extraction its amount came from.
            currencyCode,
          };
        });

        const feeBasis = rjField(rawJson, ['management_fee', 'management_fee_basis_investment_period'], toStr);
        const terms = termsExtracted ? {
          carriedInterestRate: rjField(rawJson, ['carried_interest', 'carried_interest_rate'], toFloat),
          carryTierRates: rjCarryTierRates(rawJson),
          preferredReturnRate: rjField(rawJson, ['carried_interest', 'preferred_return_rate'], toFloat),
          // A hurdle stated as a multiple of capital (1.6 for 1.6x), beside or instead of a rate.
          preferredReturnMultiple: rjField(rawJson, ['carried_interest', 'preferred_return_multiple'], toFloat),
          waterfallStructure: rjField(rawJson, ['carried_interest', 'distribution_waterfall_type'], toStr),
          mgmtFeeRateInvestmentPeriod: rjFeeRate(rawJson),
          mgmtFeeRatePostInvestment: rjField(rawJson, ['management_fee', 'management_fee_rate_post_investment'], toFloat),
          mgmtFeeBasisInvestmentPeriod: feeBasis,
          mgmtFeeBasisShort: shorten(feeBasis),
          fundTermYears: rjField(rawJson, ['fund_terms', 'fund_term_years'], toFloat),
          investmentPeriodYears: rjField(rawJson, ['fund_terms', 'investment_period_years'], toFloat),
          capitalCallNoticeDays: rjField(rawJson, ['capital_provisions', 'capital_call_notice_days'], toInt),
          initialClosingDate: rjField(rawJson, ['fund_terms', 'initial_closing_date'], toDate10),
        } : {};
        if (terms.preferredReturnMultiple != null && terms.preferredReturnRate == null && terms.carryTierRates
          && !rjHasPreferredReturnTier(rawJson)) {
          terms.preferredReturnMultiple = null;
        }
        // An event row with every term empty states nothing, so it is no more "Full data" than none.
        termsExtracted = termsExtracted && Object.values(terms).some(v => v !== null && v !== undefined && v !== '' && !(Array.isArray(v) && !v.length));
        // Counted before a withheld profit split is cleared: the agreement did state it.
        const headlineTermCount = termsExtracted ? HEADLINE_TERMS.filter(field => terms[field] != null).length : 0;
        const notFundLpa = documentType === OPERATING_AGREEMENT_DOCUMENT_TYPE
          && terms.carriedInterestRate != null && terms.carriedInterestRate > FUND_CARRY_MAX_PCT;
        if (notFundLpa) {
          for (const field of OPERATING_AGREEMENT_WITHHELD_TERMS) terms[field] = null;
        }

        out.set(eid, {
          documentId: rows[0].DOCUMENT_ID,
          extractionId: eid,
          documentType,
          notFundLpa,
          fund: {
            name: rjField(rawJson, ['fund_info', 'fund_name'], toStr),
            stateOfFormation: rjField(rawJson, ['fund_info', 'state_of_formation'], toStr),
            lpaDate: rjField(rawJson, ['fund_info', 'lpa_date'], toDate10),
            masterSeries: rjField(rawJson, ['fund_info', 'master_series'], toStr),
            fundPurpose: rjField(rawJson, ['fund_info', 'fund_purpose'], toStr),
            // RAW_JSON only -- ATTRIBUTES never carries these three.
            registeredAgent: toStr(rjGet(rawJson, 'fund_info', 'registered_agent_name')),
            principalOffice: toStr(rjGet(rawJson, 'fund_info', 'principal_office_address')),
            governingLaw: toStr(rjGet(rawJson, 'document_metadata', 'governing_law')),
          },
          generalPartner: {
            name: rjField(rawJson, ['parties', 'general_partner', 'name'], toStr),
            entityType: rjField(rawJson, ['parties', 'general_partner', 'entity_type'], toStr),
            stateOfFormation: rjField(rawJson, ['parties', 'general_partner', 'state_of_formation'], toStr),
            commitmentAmount: rjField(rawJson, ['parties', 'general_partner', 'commitment_amount'], toFloat),
            commitmentPercentage: rjField(rawJson, ['parties', 'general_partner', 'commitment_percentage'], toFloat),
            address: rjField(rawJson, ['parties', 'general_partner', 'address'], toStr),
            // RAW_JSON only -- ATTRIBUTES never carries it.
            managingMembers: rjMemberNames(rawJson, 'parties', 'general_partner', 'members'),
          },
          limitedPartners: lps,
          currencyCode,
          termsExtracted,
          headlineTermCount,
          terms,
          termFlags: termFlags(terms),
          boundingBoxes: bboxes,
          createdAt: createdAts.length ? createdAts.slice().sort()[0] : null,
        });
      }

      return out;
    }

    // ── Side letter extraction assembly ───────────────────────────────────────
    // Groups side letter rows by EXTRACTION_ID and pairs each LP entity row with
    // the NEXT side_letter event row. Each extraction contains a repeating
    // pattern: fund entity row (once) → LP entity → event → LP entity → event…
    function buildSideLetters(slRows) {
      const grouped = new Map();
      for (const row of slRows) {
        const eid = row.EXTRACTION_ID;
        if (!eid) continue;
        if (!grouped.has(eid)) grouped.set(eid, []);
        grouped.get(eid).push(row);
      }

      const out = [];
      for (const [eid, rowsRaw] of grouped) {
        // Sort by RECORD_INDEX so LP/event pairs stay adjacent. Array.sort is
        // stable (ES2019+), matching Python's stable list.sort(). This order
        // also lines up 1:1 with RAW_JSON's side_letters[] array (validated:
        // cardinality always matches on real data).
        const rows = rowsRaw.slice().sort((a, b) => (toInt(a.RECORD_INDEX) || 0) - (toInt(b.RECORD_INDEX) || 0));
        let rawJson = {};
        for (const row of rows) {
          const rj = loadRawJson(row);
          if (rj && Object.keys(rj).length) { rawJson = rj; break; }
        }
        let rjSideLetters = rjGet(rawJson, 'side_letters');
        if (!Array.isArray(rjSideLetters)) rjSideLetters = [];

        // Extraction-level, same for every side letter in this extraction.
        const fundName = toStr(rjGet(rawJson, 'issuer_name'));

        // Pair each LP entity with the next side_letter event row; slIdx
        // tracks that row's position for the positional RAW_JSON join.
        let pendingLp = null;
        let slIdx = 0;
        for (const row of rows) {
          const rt = (row.RECORD_TYPE || '').toLowerCase();
          const kind = (row.KIND || '').toLowerCase();
          const attrs = loadAttrs(row);
          if (rt === 'limited_partner' && kind === 'entity') {
            pendingLp = attrs;
          } else if (rt === 'side_letter' && kind === 'event') {
            const slObj = slIdx < rjSideLetters.length ? rjSideLetters[slIdx] : null;
            slIdx++;

            const slField = (key, caster) => caster(slObj && typeof slObj === 'object' ? unwrapEnv(slObj[key]) : null);
            const provisionSummary = (key) => {
              const obj = slObj && typeof slObj === 'object' ? slObj[key] : null;
              return obj && typeof obj === 'object' ? toStr(unwrapEnv(obj.summary)) : null;
            };

            // capital_commitment: ATTRIBUTES is pre-formatted ("$1,000,000"),
            // RAW_JSON a bare number -- stays ATTRIBUTES-only.
            out.push({
              documentId: rows[0].DOCUMENT_ID,
              extractionId: eid,
              fundName: fundName,
              lpName: slField('investor', toStr),
              lpCapitalCommitment: pendingLp ? toStr(pendingLp.capital_commitment) : null,
              // From RAW_JSON (~6.7% coverage) — see SKILL.md Caveats.
              currencyCode: cleanCurrency(row.DOCUMENT_CURRENCY_CODE),
              issueDate: slField('issue_date', toDate10),
              executedByInvestor: slField('executed_by_investor', toBool),
              executedByIssuer: toBool(rjGet(rawJson, 'executed_by_issuer')),
              hasDraftMarkings: toBool(rjGet(rawJson, 'has_draft_markings')),
              hasUnfilledPlaceholders: toBool(rjGet(rawJson, 'has_unfilled_placeholders')),
              economicProvisions: loadProvisions(attrs.economic_provisions),
              // RAW_JSON only -- no ATTRIBUTES counterpart. Tiered or IRR-based fee
              // and carry terms land in complex_* rather than in economic_provisions.
              complexManagementFee: provisionSummary('complex_management_fee'),
              complexCarry: provisionSummary('complex_carry'),
              mfnProvision: provisionSummary('mfn_provision'),
              excuseRight: provisionSummary('excuse_right'),
              transferRestrictionModification: provisionSummary('transfer_restriction_modification'),
              createdAt: toStr(row.CREATED_AT),
            });
            pendingLp = null;
          }
        }
      }

      return out;
    }

    // The side letter provisions extracted as a summary sentence: [letter key, label on the page].
    const PROVISION_SUMMARIES = [
      ['complexManagementFee', 'Custom management fee'],
      ['complexCarry', 'Custom carry'],
      ['mfnProvision', 'MFN'],
      ['excuseRight', 'Excuse right'],
      ['transferRestrictionModification', 'Transfer'],
    ];

    // True when the letter carries any extracted provision, economic or not.
    function hasProvisions(sl) {
      return !!(sl.economicProvisions && sl.economicProvisions.length) || PROVISION_SUMMARIES.some(([key]) => sl[key]);
    }

    // Collapse duplicate side letter extractions of the same underlying letter —
    // an LPA + side letter package is often re-uploaded per investor's
    // subscription bundle. Groups by (counterparty, issueDate, role), folds a
    // letter's unsigned copies into it, and keeps the "cleanest" extraction per the 4-key tiebreak: has provisions, not
    // drafty, not unfilled, most recent createdAt. Ties fall through in order —
    // first pass at the maximum tuple wins, mirroring Python's max().
    function dedupeSideLetters(sls) {
      // Counterparty compared modulo case and punctuation. Then a counterparty's one
      // signed, dated letter absorbs its undated, draft, unfilled or fund-unsigned
      // copies; two signed letters on different dates stay apart.
      const groups = new Map();
      const parts = new Map();
      for (const sl of sls) {
        const p = [lpKey(sl.counterpartyName), (sl.issueDate || '').trim(), (sl.role || '').trim()];
        const key = p.join('\u0001');
        if (!groups.has(key)) { groups.set(key, []); parts.set(key, p); }
        groups.get(key).push(sl);
      }
      const finalsByParty = new Map();
      for (const [key, group] of groups) {
        const [party, date, role] = parts.get(key);
        if (party && date && group.some(isFinalLetter)) {
          const pk = party + '\u0001' + role;
          if (!finalsByParty.has(pk)) finalsByParty.set(pk, []);
          finalsByParty.get(pk).push(key);
        }
      }
      for (const key of [...groups.keys()]) {
        const [party, date, role] = parts.get(key);
        const finals = finalsByParty.get(party + '\u0001' + role) || [];
        if (finals.length !== 1 || key === finals[0]) continue;
        if (!date || !groups.get(key).some(isFinalLetter)) {
          groups.get(finals[0]).push(...groups.get(key));
          groups.delete(key);
        }
      }

      function cleanliness(sl) {
        const hasProv = hasProvisions(sl) ? 1 : 0;
        const notDrafty = sl.hasDraftMarkings ? 0 : 1;
        const notUnfilled = sl.hasUnfilledPlaceholders ? 0 : 1;
        return [hasProv, notDrafty, notUnfilled, sl.createdAt || ''];
      }
      function compareCleanliness(a, b) {
        for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) return a[i] - b[i]; }
        return a[3] < b[3] ? -1 : a[3] > b[3] ? 1 : 0;
      }

      const out = [];
      for (const group of groups.values()) {
        if (group.length === 1) { out.push(group[0]); continue; }
        let best = group[0];
        let bestKey = cleanliness(best);
        for (let i = 1; i < group.length; i++) {
          const key = cleanliness(group[i]);
          if (compareCleanliness(key, bestKey) > 0) { best = group[i]; bestKey = key; }
        }
        out.push(best);
      }
      return out;
    }

    // A signed copy: no draft markings, no blanks, and not marked unsigned by the fund.
    function isFinalLetter(sl) {
      return !sl.hasDraftMarkings && !sl.hasUnfilledPlaceholders && sl.executedByIssuer !== false;
    }

    // Secondary attribution for GP-entity side letters — the extraction pipeline
    // sometimes stores the GP LLC name in the fund field rather than the LP fund
    // vehicle. Tries LP-name lookup first, then an issue-date window (±7 days);
    // first one that resolves to exactly one fund wins.
    function gpEntityFallback(unattributed, fundsOut) {
      const fundLpNorms = new Map();
      const fundLpaDates = new Map();
      for (const fund of fundsOut) {
        const fn = fund.fundName;
        const lpa = fund.lpa;
        if (lpa) {
          const set = new Set();
          for (const lp of (lpa.limitedPartners || [])) {
            if (lp.name) set.add(normName(lp.name));
          }
          fundLpNorms.set(fn, set);
          const terms = lpa.terms || {};
          fundLpaDates.set(fn, (lpa.fund && lpa.fund.lpaDate) || terms.initialClosingDate || null);
        } else {
          fundLpNorms.set(fn, new Set());
          fundLpaDates.set(fn, null);
        }
      }

      const unresolved = [];
      for (const sl of unattributed) {
        const lpName = sl.lpName;
        const issueDate = sl.issueDate;
        let matchedFund = null;
        let method = 'unresolved';

        if (lpName) {
          const normLp = normName(lpName);
          if (normLp) {
            const lpMatches = [];
            for (const [fn, lpSet] of fundLpNorms) {
              if (lpSet.has(normLp)) lpMatches.push(fn);
            }
            if (lpMatches.length === 1) { matchedFund = lpMatches[0]; method = 'lp-name'; }
          }
        }

        if (matchedFund === null) {
          const dateMatches = [];
          for (const [fn, d] of fundLpaDates) {
            if (dateWithinWindow(issueDate, d)) dateMatches.push(fn);
          }
          if (dateMatches.length === 1) { matchedFund = dateMatches[0]; method = 'date-inferred'; }
        }

        const attributedSl = { ...sl, role: 'issuer', counterpartyName: lpName, attributionMethod: method };
        if (matchedFund !== null) {
          for (const fund of fundsOut) {
            if (fund.fundName === matchedFund) {
              fund.sideLetters.push(attributedSl);
              fund.sideLetterCount += 1;
              break;
            }
          }
        } else {
          unresolved.push(attributedSl);
        }
      }
      return unresolved;
    }

    // Identity of an LP across LPA copies: the name modulo case and punctuation.
    // Deliberately stricter than normName, which also drops legal forms and
    // parentheticals — merging two different investors would hide one of them.
    function lpKey(name) {
      return (name || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
    }

    // One LP roster for a fund, across every LPA document that resolved to it.
    // Funds collect an executed copy of the LPA per investor, so any one copy
    // names only its own signatory. A named LP appears once, preferring the entry
    // that carries a commitment. Unnamed entries come from the selected LPA only,
    // so N copies cannot multiply them.
    function mergeLpRosters(selectedEid, hitEids, lpas) {
      const roster = [];
      const position = new Map();
      for (const eid of [selectedEid, ...hitEids.filter(e => e !== selectedEid)]) {
        for (const lp of lpas.get(eid).limitedPartners) {
          const key = lpKey(lp.name);
          if (!key) {
            if (eid === selectedEid) roster.push(lp);
            continue;
          }
          if (!position.has(key)) {
            position.set(key, roster.length);
            roster.push(lp);
          } else if (roster[position.get(key)].commitmentAmount === null && lp.commitmentAmount !== null) {
            roster[position.get(key)] = lp;
          }
        }
      }
      return roster;
    }

    // ── Firm-fund matching + coverage assembly ────────────────────────────────
    // For each of the firm's funds, resolves the LPA extraction + side letter
    // list. Returns fund objects in the order firmFundNames was supplied.
    function matchFunds(firmFundNames, lpas, sideLetters) {
      return matchAll(firmFundNames, lpas, sideLetters).funds;
    }

    // matchFunds, plus what it did not use: the extraction ids a fund claimed and the
    // side-letter keys a fund received. The rest is listed as unmatched, not dropped.
    const slKeyOf = sl => (sl.extractionId || '') + '\u0001' + (sl.lpName || '');
    function matchAll(firmFundNames, lpas, sideLetters) {
      const resolved = new Map();
      const resolve = (name) => {
        if (!resolved.has(name)) resolved.set(name, resolveFund(name, firmFundNames));
        return resolved.get(name);
      };

      // Each LPA resolves to at most one fund, so "Fund IV Holdings" never also
      // lands on "Fund IV". Copies of one LPA resolve together by name.
      const lpaHits = new Map();
      const possibleNames = new Map();
      // Series left without their own agreement while the parent LLC's is on file.
      const parentAgreements = new Map();
      const governing = new Set();
      for (const [eid, lpa] of lpas) {
        const lpaName = lpa.fund.name;
        if (!lpaName) continue;
        let { funds, tier, tied } = resolve(lpaName);
        if (funds.length > 1) {
          const series = seriesForAgreement(funds, lpa);
          if (isParentAgreement(funds, lpa)) {
            for (const fund of funds) {
              if (!parentAgreements.has(fund)) parentAgreements.set(fund, []);
              const refs = parentAgreements.get(fund);
              if (series.includes(fund)) continue;
              governing.add(eid);
              if (!refs.some(r => r.name === lpaName)) refs.push({ name: lpaName, documentId: lpa.documentId });
            }
            tied = [];
          } else if (!series.length) {
            tied = funds;
          }
          funds = series;
        }
        // [extraction, tier, names this fund's series]
        const namesSeries = new Set(agreementSeries(funds, lpa));
        for (const fund of funds) {
          if (!lpaHits.has(fund)) lpaHits.set(fund, []);
          lpaHits.get(fund).push([eid, tier, namesSeries.has(fund)]);
        }
        for (const t of tied) {
          if (!possibleNames.has(t)) possibleNames.set(t, []);
          const names = possibleNames.get(t);
          if (!names.includes(lpaName)) names.push(lpaName);
        }
      }

      // The firm's fund is the issuer (grants terms to an LP) or the investor (got
      // terms from another manager's fund). Issuer resolves first so a letter never
      // counts twice. A portfolio company's round letter naming the fund as investor
      // stays unclaimed: sideLetterSummary counts it as a company letter.
      const slsByFund = new Map();
      const attributedSlKeys = new Set();
      for (const sl of sideLetters) {
        const fundName = sl.fundName;
        const lpName = sl.lpName;
        const issuer = fundName ? resolve(fundName) : { funds: [], tier: null, tied: [] };
        let targets = [], attributed = null, letterName = null;
        if (issuer.funds.length) {
          targets = issuer.funds;
          attributed = { ...sl, role: 'issuer', counterpartyName: lpName };
          letterName = fundName;
        } else if (!issuer.tied.length && lpName && !isCompanyLetter(sl)) {
          targets = resolve(lpName).funds;
          attributed = { ...sl, role: 'investor', counterpartyName: fundName };
          letterName = lpName;
        }
        if (!targets.length) continue;
        if (targets.length > 1) targets = narrowToNamedSeries(targets, letterName, attributed);
        for (const target of targets) {
          if (!slsByFund.has(target)) slsByFund.set(target, []);
          slsByFund.get(target).push({ ...attributed });
        }
        attributedSlKeys.add(slKeyOf(sl));
      }

      const fundsOut = [];
      for (const firmName of firmFundNames) {
        // Prefer the agreement stating the most headline terms, then any populated terms, then an
        // agreement naming this fund's series, then the stronger name match, then recency.
        // First maximum wins, mirroring Python's max().
        let matchedEid = null, matchedLpa = null, matchTier = null;
        const hits = lpaHits.get(firmName) || [];
        if (hits.length) {
          const keyOf = ([eid, tier, namesSeries]) => [lpas.get(eid).headlineTermCount, lpas.get(eid).termsExtracted ? 1 : 0, namesSeries ? 1 : 0, tier, lpas.get(eid).createdAt || ''];
          const cmpKey = (x, y) => (x[0] - y[0]) || (x[1] - y[1]) || (x[2] - y[2]) || (x[3] - y[3]) || (x[4] < y[4] ? -1 : x[4] > y[4] ? 1 : 0);
          let best = hits[0];
          let bestKey = keyOf(best);
          for (let i = 1; i < hits.length; i++) {
            const key = keyOf(hits[i]);
            if (cmpKey(key, bestKey) > 0) { best = hits[i]; bestKey = key; }
          }
          [matchedEid, matchTier] = best;
          matchedLpa = {
            ...lpas.get(matchedEid),
            limitedPartners: mergeLpRosters(matchedEid, hits.map(([eid]) => eid), lpas),
          };
        }

        let matchingSls = [...(slsByFund.get(firmName) || [])];

        // Collapse duplicate uploads, then sort so side letters with extracted
        // provisions float to the top (date-desc within each group). Both .sort()
        // calls are stable, so this reproduces process.py's chained sort exactly.
        matchingSls = dedupeSideLetters(matchingSls);
        matchingSls.sort((a, b) => {
          const da = a.issueDate || '', db = b.issueDate || '';
          return da === db ? 0 : (da < db ? 1 : -1);
        });
        matchingSls.sort((a, b) => (hasProvisions(a) ? 0 : 1) - (hasProvisions(b) ? 0 : 1));

        const parentRefs = matchedLpa ? [] : (parentAgreements.get(firmName) || []);
        let status;
        if (!matchedLpa && parentRefs.length) status = 'PARENT_AGREEMENT';
        else if (!matchedLpa) status = 'MISSING';
        else if (!matchedLpa.headlineTermCount) status = 'PARTIAL';
        else status = 'EXTRACTED';

        fundsOut.push({
          fundName: firmName,
          lpaStatus: status,
          sideLetterCount: grantedCount(matchingSls),
          documentId: matchedLpa ? matchedLpa.documentId : null,
          lpa: matchedLpa,
          lpaMatch: matchTier === null ? null : (matchTier === FUND_MATCH_EXACT ? 'exact' : 'close'),
          possibleLpaNames: matchedLpa === null ? (possibleNames.get(firmName) || []) : [],
          parentAgreements: parentRefs,
          sideLetters: matchingSls,
        });
      }

      // GP-entity fallback: side letters whose fundName looks like "Firm GP, LLC"
      // don't match any fund vehicle by name.
      const gpSls = sideLetters.filter(sl =>
        isGpEntity(sl.fundName) && !attributedSlKeys.has(slKeyOf(sl))
      );
      if (gpSls.length) {
        gpEntityFallback(gpSls, fundsOut);
      }

      const claimed = new Set();
      for (const hits of lpaHits.values()) for (const [eid] of hits) claimed.add(eid);
      for (const eid of governing) claimed.add(eid);
      for (const fund of fundsOut) for (const sl of fund.sideLetters) attributedSlKeys.add(slKeyOf(sl));
      return { funds: fundsOut, claimed, attributedSlKeys };
    }

    // Side letters a fund granted its own LPs; ones it received as an investor in a
    // portfolio company stay on the fund, listed apart, but are not counted.
    function grantedCount(sls) {
      return sls.filter(sl => sl.role !== 'investor').length;
    }

    // Every letter the firm's funds granted, once: a letter shown on each series of
    // an LLC (sharedAcrossSeries) is one letter.
    function grantedLetters(funds) {
      const seen = new Set();
      return funds.flatMap(f => f.sideLetters).filter(sl => {
        if (sl.role === 'investor') return false;
        if (!sl.sharedAcrossSeries) return true;
        const key = [fundKey(sl.fundName)[0].join(' '), lpKey(sl.counterpartyName), sl.issueDate || ''].join('\u0001');
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    // Words every manager's names share, so a match on one says nothing about whose fund it is.
    const GENERIC_NAME_WORDS = new Set([
      'THE', 'AND', 'OF', 'FUND', 'FUNDS', 'CAPITAL', 'VENTURE', 'VENTURES', 'PARTNERS', 'PARTNERSHIP',
      'MANAGEMENT', 'GROUP', 'HOLDINGS', 'INVESTMENTS', 'INVESTMENT', 'ADVISORS', 'EQUITY', 'GROWTH',
      'OPPORTUNITIES', 'OPPORTUNITY', 'COMPANY', 'SERIES', 'SPV', 'LP', 'LLC', 'GP', 'INC', 'LTD', 'CO', 'CORP',
      // Words that name the type of vehicle, not the manager.
      'PARALLEL', 'GLOBAL', 'OFFSHORE', 'CAYMAN', 'FEEDER', 'MASTER', 'LIMITED', 'INVESTORS', 'ASSOCIATES',
      'PARTNER', 'INTERNATIONAL', 'AIV', 'AGGREGATOR', 'BLOCKER', 'TRUST',
      // Words that name a manager's role, not which manager.
      'MANAGER', 'MANAGERS', 'ADVISOR', 'ADVISER', 'ADVISERS', 'GENERAL',
    ]);
    // A word in at least this many of the firm's entity names is its fund family's
    // ("Summit", "Northstar"): a document sharing only that word could be any of the family.
    const FAMILY_WORD_MIN_NAMES = 3;

    // The distinctive words of a manager or fund name ("Acme" in "Acme Venture Partners").
    // A fund number ("III") is never one: it ties Acme Fund III to every manager's Fund III.
    function brandWords(name) {
      return new Set(fundTokens(name || '').filter(w =>
        w.length > 2 && !/^\d+$/.test(w) && !Object.prototype.hasOwnProperty.call(ROMAN_NUMERALS, w) && !GENERIC_NAME_WORDS.has(w)));
    }

    // The distinctive words of the firm's and its entities' names.
    function ownWordsOf(firmNames) {
      return new Set(firmNames.flatMap(n => [...brandWords(n)]));
    }

    // The compact view of an extraction the report lists; no roster or terms.
    function documentEntry(lpa) {
      return {
        documentId: lpa.documentId,
        extractionId: lpa.extractionId,
        documentType: lpa.documentType,
        fundName: lpa.fund.name,
        gpName: lpa.generalPartner.name,
        lpaDate: lpa.fund.lpaDate,
        termsExtracted: lpa.termsExtracted,
      };
    }

    // A GP, manager or adviser entity: its operating agreement governs the manager, never a fund.
    const MANAGER_ENTITY_RE = /\b(GP|General Partner|Managers?|Management|Advis[eo]rs?)\b(?:[\s-]*(?:[IVX]+|\d+))?(?:\s+(?:Company|Co\.?))?\s*,?\s*(LLC|L\.L\.C\.?|LTD\.?|LIMITED|LLP|LP|L\.P\.?|CORP\.?|CORPORATION|INC\.?|CO\.?)?\s*$/i;

    // Whether an agreement's investor roster names one of the firm's entities, even one it cannot tell from a sibling.
    function investsIn(lpa, firmNames) {
      return lpa.limitedPartners.some(lp => {
        if (!lp.name) return false;
        const r = resolveFund(lp.name, firmNames);
        return r.funds.length > 0 || r.tied.length > 0;
      });
    }

    // Sorts extractions no fund claimed into { unmatched, received from other managers }.
    // One that shares a distinctive word with the firm's or its entities' names (in the fund or
    // GP name) is most likely the firm's own fund under a name Carta does not use, so a rebrand
    // shows as "didn't match" for the user to link by hand. The rest are other managers'
    // agreements: listed as received when their roster names one of the firm's entities as an
    // investor, and otherwise dropped: nothing ties them to the firm, so the report neither lists
    // nor counts them. An agreement whose fund name is a GP, manager or adviser entity's ("Acme
    // Fund I GP, LLC") is dropped too: it governs the manager, so linking it to a fund is never the fix.
    function splitUnclaimed(lpas, claimed, firmNames) {
      const ownWords = ownWordsOf(firmNames);
      const unmatched = [], received = [];
      for (const [eid, lpa] of lpas) {
        if (claimed.has(eid) || MANAGER_ENTITY_RE.test((lpa.fund.name || '').trim())) continue;
        const words = [...brandWords(lpa.fund.name), ...brandWords(lpa.generalPartner.name)];
        if (words.some(w => ownWords.has(w))) unmatched.push(documentEntry(lpa));
        else if (investsIn(lpa, firmNames)) received.push(documentEntry(lpa));
      }
      return { unmatched, received };
    }

    // The words the firm's own name and its fund family share, which point at no one fund.
    function familyWords(firmName, entityNames) {
      const counts = new Map();
      for (const name of entityNames) for (const w of brandWords(name)) counts.set(w, (counts.get(w) || 0) + 1);
      const family = brandWords(firmName);
      for (const [w, n] of counts) if (n >= FAMILY_WORD_MIN_NAMES) family.add(w);
      return family;
    }

    // Each way to collapse one run of 2+ consecutive alphabetic words to its initials, as
    // JSON strings. A number is never part of a run.
    function initialsVariants(words) {
      const variants = new Set();
      for (let start = 0; start < words.length; start++) {
        for (let end = start + 2; end <= words.length; end++) {
          const run = words.slice(start, end);
          if (!run.every(w => /^[A-Za-z]+$/.test(w))) break;
          variants.add(JSON.stringify([...words.slice(0, start), run.map(w => w[0]).join(''), ...words.slice(end)]));
        }
      }
      return variants;
    }

    // One name is the other with a run of words written as initials ("AV" for "Acme Ventures").
    function sameNameByInitials(fundName, documentName) {
      const fundWords = fundKey(fundName)[0], documentWords = fundKey(documentName)[0];
      return initialsVariants(documentWords).has(JSON.stringify(fundWords)) ||
        initialsVariants(fundWords).has(JSON.stringify(documentWords));
    }

    // The one fund whose name is this one with a run of words as initials, either way round; empty when none or
    // several are. A GP or manager entity's name is never read this way: it is not a fund's agreement.
    function namedByInitials(name, firmFundNames) {
      if (!name || isGpEntity(name)) return [];
      const named = firmFundNames.filter(f => !isGpEntity(f) && sameNameByInitials(f, name));
      return named.length === 1 ? named : [];
    }

    // An unmatched document could be this fund's under another name: it shares a word
    // naming this fund rather than its family ("Widgets"), or the fund's number. An
    // unmatched document already shares a word with the firm, so "Summit Secondary VP
    // VII" may be "Acme Venture Partners VII" before a rename. A GP or manager entity is
    // never a fund's agreement, and "I" alone is too common a number to say anything: a
    // number counts from 2 up. A document whose name is the fund's with a run of words
    // written as initials is the fund's too ("AV Global I" for "Acme Ventures Global I").
    function couldBeFund(fundName, doc, family) {
      if (isGpEntity(doc.fundName)) return false;
      if (sameNameByInitials(fundName, doc.fundName || '')) return true;
      const words = new Set([...brandWords(doc.fundName), ...brandWords(doc.gpName)]);
      if ([...brandWords(fundName)].some(w => !family.has(w) && words.has(w))) return true;
      const number = seriesNum(fundName);
      return number !== null && number >= 2 && number === seriesNum(doc.fundName || '');
    }

    // Splits MISSING into why. NO_DOCUMENTS: the firm has no LPA or operating agreement
    // extractions at all. NAME_MISMATCH: this fund has no document, but an LPA tied between
    // it and a sibling, or an unmatched document could be its (see couldBeFund); the
    // candidates' fund names go in possibleLpaNames. MISSING stays for a fund with no sign of a document among the firm's own. An unmatched
    // document elsewhere at the firm is no sign: a firm that invests in other managers'
    // funds always has some.
    function assignCoverageStates(funds, lpas, unmatched, firmName, entityNames) {
      const family = familyWords(firmName, entityNames);
      for (const fund of funds) {
        if (fund.lpaStatus !== 'MISSING') continue;
        if (!lpas.size) fund.lpaStatus = 'NO_DOCUMENTS';
        else {
          const candidates = unmatched.filter(d => d.fundName && couldBeFund(fund.fundName, d, family)).map(d => d.fundName);
          if (candidates.length || fund.possibleLpaNames.length) {
            fund.lpaStatus = 'NAME_MISMATCH';
            fund.possibleLpaNames = [...new Set([...fund.possibleLpaNames, ...candidates])];
          }
        }
      }
    }

    // Series that share one master agreement point at it instead of repeating it. Every
    // series resolves to the same document, so each would otherwise repeat its terms and
    // LP roster. The master is the fund the agreement names itself; the others keep their
    // terms and say whose roster it is.
    function markInherited(funds) {
      const byDoc = new Map();
      for (const fund of funds) {
        if (!fund.lpa) continue;
        if (!byDoc.has(fund.lpa.extractionId)) byDoc.set(fund.lpa.extractionId, []);
        byDoc.get(fund.lpa.extractionId).push(fund);
      }
      for (const group of byDoc.values()) {
        if (group.length < 2) continue;
        const keyOf = name => JSON.stringify(fundKey(name));
        const agreementKey = keyOf(group[0].lpa.fund.name);
        const master = group.find(f => keyOf(f.fundName) === agreementKey) || group[0];
        for (const fund of group) {
          if (fund === master) continue;
          fund.inheritedFromMaster = master.fundName;
          // The roster stays so side letters still resolve commitments against it;
          // renderLpSection shows the master's note instead of listing it again.
          fund.lpa = { ...fund.lpa, limitedPartnerCount: fund.lpa.limitedPartners.length };
        }
      }
    }

    // Legal forms an operating company takes. Funds take them too (an offshore "Ltd.", a blocker or
    // fund "Inc."), so a name with a fund or vehicle word is never a company's.
    const COMPANY_FORMS = new Set(['INC', 'CORP', 'PBC', 'PLC', 'LTD']);
    const FUND_WORDS = new Set(['FUND', 'FUNDS', 'CAPITAL', 'PARTNERS', 'VENTURES', 'INVESTMENTS', 'HOLDINGS', 'SICAV']);
    // Forms companies take outside the US and UK. fundKey does not strip them, so they are read as
    // the name's last word ("Anyfin AB", "Universal Diagnostics, S.A.", "Mondu GmbH").
    const FOREIGN_COMPANY_FORMS = new Set(['AB', 'AG', 'GMBH', 'SA', 'SAS', 'SPA', 'SRL', 'BV', 'NV', 'OY', 'OYJ', 'ASA', 'KK']);

    // Whether a side letter's issuer is an operating company: a portfolio company's round, not a fund's LPA.
    function isCompanyLetter(sl) {
      const name = sl.fundName || '';
      if (VEHICLE_NAME.test(name) || fundTokens(name).some(t => FUND_WORDS.has(t))) return false;
      if (COMPANY_FORMS.has(fundKey(name)[1])) return true;
      const words = fundTokens(mainName(name));
      return words.length > 1 && FOREIGN_COMPANY_FORMS.has(words[words.length - 1]);
    }

    // Whether an unclaimed letter could be the firm's: its issuer is unnamed, a party is one of the
    // firm's names written with initials ("AV Global I SPV" for "Acme Ventures Global I SPV", which
    // has no distinctive word left), or a party shares a distinctive word with the firm.
    function namesTheFirm(sl, firmNames, ownWords) {
      if (!sl.fundName) return true;
      const parties = [sl.fundName, sl.lpName].filter(Boolean);
      if (firmNames.some(name => parties.some(party => sameNameByInitials(name, party)))) return true;
      return parties.some(party => [...brandWords(party)].some(w => ownWords.has(w)));
    }

    // Letters granted, received, from companies and unmatched, and the unmatched ones. Raw rows run
    // above what lands on a fund because duplicate uploads fold together. A letter whose issuer is a
    // company is a portfolio company's round: no fund receives it, and it is counted apart from, and
    // never listed with, the unmatched ones. A letter no fund claimed whose parties could not be the
    // firm is between another manager's fund and its investors: it is dropped, neither listed nor
    // counted, and left out of `extracted` too. firmNames are the firm's and its entities' names.
    function sideLetterSummary(funds, sideLetters, attributed, firmNames) {
      const unclaimed = sideLetters.filter(sl => !attributed.has(slKeyOf(sl)));
      const notCompany = unclaimed.filter(sl => !isCompanyLetter(sl));
      const ownWords = ownWordsOf(firmNames);
      const unmatched = notCompany.filter(sl => namesTheFirm(sl, firmNames, ownWords));
      const otherParties = notCompany.length - unmatched.length;
      const received = new Set(funds.flatMap(f => f.sideLetters).filter(sl => sl.role === 'investor').map(slKeyOf));
      return {
        counts: {
          granted: grantedLetters(funds).length,
          received: received.size,
          company: unclaimed.length - notCompany.length,
          unmatched: unmatched.length,
          extracted: sideLetters.length - otherParties,
        },
        unmatched,
      };
    }

    // Words in a name that say the entity pools money for a main fund or a single deal. "Holdings"
    // and "Opportunity" are left out: both also name main funds.
    const VEHICLE_WORDS = [
      'aggregator', 'feeder', 'blocker', 'side[ -]?fund', 'aiv', 'alternative investment vehicle',
      'co[ -]?invest(?:ment)?', 'spv',
    ];
    const VEHICLE_NAME = new RegExp('\\b(?:' + VEHICLE_WORDS.join('|') + ')\\b', 'i');
    const SPV_TYPE = /\bSPV\b/i;
    // A 0 fee or carry is the agreement saying there is none, so only a non-zero value counts.
    const ECONOMIC_TERMS = ['mgmtFeeRateInvestmentPeriod', 'mgmtFeeRatePostInvestment', ...OPERATING_AGREEMENT_WITHHELD_TERMS];

    // A vehicle whose agreement carries no fee, carry, hurdle or waterfall. SPVs, aggregators,
    // feeders, blockers and side funds distribute pro rata or take their economics from the main
    // fund's agreement, so blank terms there are by design, not a gap. A vehicle that states carry
    // or a fee keeps EXTRACTED, and an operating agreement whose profit split was withheld is not one.
    function isVehicleAgreement(fund) {
      const lpa = fund.lpa;
      if (!['EXTRACTED', 'PARTIAL'].includes(fund.lpaStatus) || !lpa || lpa.notFundLpa) return false;
      const isVehicle = SPV_TYPE.test(fund.entityType || '') ||
        [fund.fundName, lpa.fund.name].some(name => VEHICLE_NAME.test(name || ''));
      return isVehicle && !ECONOMIC_TERMS.some(field => lpa.terms[field]);
    }

    // Needs entityType, so runs after splitAudited.
    function markVehicleAgreements(funds) {
      for (const fund of funds) {
        if (isVehicleAgreement(fund)) fund.lpaStatus = 'VEHICLE_AGREEMENT';
      }
    }

    function coverageCounts(funds) {
      const count = status => funds.filter(f => f.lpaStatus === status).length;
      return {
        totalFunds: funds.length,
        extracted: count('EXTRACTED'),
        vehicleAgreement: count('VEHICLE_AGREEMENT'),
        partial: count('PARTIAL'),
        parentAgreement: count('PARENT_AGREEMENT'),
        missing: count('MISSING'),
        nameMismatch: count('NAME_MISMATCH'),
        noDocuments: count('NO_DOCUMENTS'),
        totalSideLetters: grantedLetters(funds).length,
      };
    }

    // Everything the page shows that comes from the extractions: the fund list with its
    // coverage states, what no fund claimed, and the side-letter split.
    function assembleReport(firmName, entities, lpas, sideLetters) {
      const names = entities.map(e => e.name);
      const firmNames = [firmName, ...names];
      const { funds: matched, claimed, attributedSlKeys } = matchAll(names, lpas, sideLetters);
      const { unmatched, received } = splitUnclaimed(lpas, claimed, firmNames);
      assignCoverageStates(matched, lpas, unmatched, firmName, names);
      markInherited(matched);
      const { funds, notAudited } = splitAudited(matched, entities, firmName);
      markVehicleAgreements(funds);
      const letters = sideLetterSummary(funds, sideLetters, attributedSlKeys, firmNames);
      return {
        coverage: coverageCounts(funds),
        funds,
        notAudited,
        unmatchedDocuments: unmatched,
        receivedDocuments: received,
        sideLetterCounts: letters.counts,
        unmatchedSideLetters: letters.unmatched,
      };
    }

    // ── Bootstrap ─────────────────────────────────────────────────────────────

    async function bootstrap() {
      if (!FIRM_UUID) {
        showError('This report is missing its firm. Re-run the LPA audit skill to rebuild it.');
        return;
      }
      if (!CARTA_MCP_SERVER) {
        showError('This report is missing its Carta connection. Re-run the LPA audit skill to rebuild it.');
        return;
      }
      if (!FIRM_FUND_NAMES || !FIRM_FUND_NAMES.length) {
        showError('This report has no funds to audit. Re-run the LPA audit skill to rebuild it.');
        return;
      }

      // Pin firm context before any query. The warehouse views are firm-scoped
      // secure views, so an unpinned or wrong context returns zero rows rather
      // than an error — which would render as "every fund missing" and read as
      // fact.
      try {
        const contextResult = await callMcpWithWelcomeRetry(SET_CONTEXT_TOOL, { firm_id: FIRM_UUID });
        if (contextResult && contextResult.isError) {
          throw new Error(errorText(contextResult) || '<no message>');
        }
      } catch (error) {
        showError(
          'You may not have access to ' + FIRM_NAME + ' in Carta, or your session has expired. ' +
          'Reconnect the Carta connector, then reload. If it keeps happening, contact Carta Support.',
          error.message,
          [{ label: 'Contact Carta Support', url: CARTA_SUPPORT_URL }]
        );
        return;
      }

      let lpaRows, oaRows, slRows;
      try {
        const loadingMessage = 'Loading LPAs and side letters from Carta…';
        setLoadingStatus(loadingMessage);
        const progress = loadProgress(['Query T', 'Query O', 'Query L'], loadingMessage);
        [lpaRows, oaRows, slRows] = await Promise.all([
          fetchAllRows(buildLpaRowsSql, 'Query T', progress('Query T')),
          fetchAllRows(buildOperatingAgreementRowsSql, 'Query O', progress('Query O')),
          fetchAllRows(buildSideLetterRowsSql, 'Query L', progress('Query L')),
        ]);
      } catch (error) {
        showError(
          "Couldn't load your LPA data just now. Try reloading in a moment. " +
          'If it keeps happening, contact Carta Support.',
          error.message,
          [{ label: 'Contact Carta Support', url: CARTA_SUPPORT_URL }]
        );
        return;
      }

      // Zero LPA rows is NOT an error — every fund correctly lands in NO_DOCUMENTS.
      // Either none have been uploaded, or this firm's extractions predate the
      // FIRM_ID backfill (see SKILL.md Caveats). Same for zero side-letter rows.
      setLoadingStatus('Building your report…');

      const lpas = new Map([
        ...buildLpas(lpaRows, LPA_DOCUMENT_TYPE),
        ...buildLpas(oaRows, OPERATING_AGREEMENT_DOCUMENT_TYPE),
      ]);
      const sideLetters = buildSideLetters(slRows);
      const report = assembleReport(FIRM_NAME, FIRM_FUNDS, lpas, sideLetters);

      const now = new Date();
      const generatedAt = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      DATA = {
        meta: {
          firmId: FIRM_UUID,
          firmName: FIRM_NAME,
          firmCartaId: FIRM_CARTA_ID,
          generatedAt,
        },
        ...report,
      };

      renderHeader();
      renderSummaryTiles();
      renderFilterBar();
      renderFundTable();
      renderNotAudited();
      renderUnclaimed();
      renderPageFooter();
      showContent();
    }

    // Entity types that never carry an LPA. Filtered after matching, so matching
    // and side-letter attribution are unchanged; one with side letters stays visible.
    const NOT_AUDITED_TYPES = new Set(['GP Entity', 'Management Co', 'Elimination Entity']);

    // Carta entity names that mark a record as something other than a fund vehicle, each
    // with the reason shown for it. Kept in step with NON_FUND_NAME_PATTERNS in process.py.
    const NON_FUND_NAME_PATTERNS = [
      ['wire instructions', ['\\bwire instructions?\\b']],
      ['custodial account', ['\\bF/?B/?O\\b', 'for the benefit of', '\\bCust(odian)?\\b\\.?']],
      ['trust', ['\\btrust\\b', '\\bEMBT\\b', '\\bdeed of (donation|trust)\\b']],
      ['duplicate', ['\\bdupe\\b', '\\bduplicate\\b']],
      ['combined entry', [
        '(?:\\bLP\\b|\\bL\\.P\\.|\\bLLC\\b|\\bL\\.L\\.C\\.|\\bFund \\w+\\b).*\\s(and|&)\\s.*(?:\\bLP\\b|\\bL\\.P\\.|\\bLLC\\b|\\bL\\.L\\.C\\.|\\bFund\\b)',
      ]],
    ];
    const NON_FUND_NAME_RES = NON_FUND_NAME_PATTERNS.map(([reason, sources]) => [reason, sources.map(p => new RegExp(p, 'i'))]);

    // Why a Carta entity name marks a non-fund record, or null for a name that could be a fund.
    function nonFundNameReason(name, firmName) {
      for (const [reason, regexes] of NON_FUND_NAME_RES) {
        if (regexes.some(r => r.test(name))) return reason;
      }
      const firmWords = fundKey(firmName)[0];
      // fundKey drops a series and the word "Fund", so a series of an LLC named for the firm,
      // or the firm's unnumbered "<Firm> Fund", would otherwise have the firm's key.
      const addsFund = fundTokens(mainName(name)).includes('FUND') && !fundTokens(firmName).includes('FUND');
      if (firmWords.length && dashSeries(name) === null && !addsFund
          && JSON.stringify(fundKey(name)[0]) === JSON.stringify(firmWords)) {
        return 'the firm itself';
      }
      return null;
    }

    // An entity of a type in NOT_AUDITED_TYPES is set aside unless a side letter landed on it;
    // any other entity is set aside when its name matches NON_FUND_NAME_PATTERNS or is the
    // firm's own, and no agreement (its own or a parent's) and no side letter matched it.
    // The fund with every currency its agreement leaves unknown set to the fund's Carta
    // currency (fa__list__entities' `currency`): the GP commitment and each LP row. A side
    // letter's roster-backed commitment is read from those rows (sideLetterCommitment), so
    // it follows. A currency a document states is never replaced. Returns a copy: funds can
    // share one agreement's LP rows. Port of process.py fill_fund_currency.
    function fillFundCurrency(fund, currency) {
      if (!currency || !fund.lpa) return fund;
      const lpa = {
        ...fund.lpa,
        currencyCode: fund.lpa.currencyCode || currency,
        limitedPartners: (fund.lpa.limitedPartners || []).map(lp => ({ ...lp, currencyCode: lp.currencyCode || currency })),
      };
      return { ...fund, lpa };
    }

    function splitAudited(matched, entities, firmName) {
      const byName = new Map(entities.map(e => [e.name, e]));
      const funds = [], notAudited = [];
      for (const fund of matched) {
        const entity = byName.get(fund.fundName) || {};
        const entityType = entity.entity_type ?? null;
        let reason = null;
        if (NOT_AUDITED_TYPES.has(entityType) && !fund.sideLetterCount) reason = 'entity type';
        else if (!fund.lpa && !fund.parentAgreements.length && !fund.sideLetterCount) reason = nonFundNameReason(fund.fundName, firmName);
        if (reason) notAudited.push({ name: fund.fundName, entityType, reason });
        else funds.push({ ...fillFundCurrency(fund, entity.currency ?? null), cartaId: entity.carta_id ?? null, entityType });
      }
      return { funds, notAudited };
    }

    // ── UI layer ────────────────────────────────────────────────────────────
    // All render functions below read from DATA, which bootstrap() assembles
    // before calling any of them.

    // ---------- Formatters ----------
    // ccy is the extraction's currencyCode (from RAW_JSON, else the fund's Carta currency;
    // see fillFundCurrency), or null when neither is known: then the amount renders bare,
    // never with an assumed currency.
    function fmtAmount(n, ccy) {
        if (n === null || n === undefined) return '—';
        const prefix = ccy ? (CCY_SYMBOL[ccy] || (ccy + ' ')) : '';
        if (n === 0) return prefix + '0';
        const v = Math.round(n);
        return v < 0
            ? '(' + prefix + Math.abs(v).toLocaleString() + ')'
            : prefix + v.toLocaleString();
    }
    function fmtNum(n) {
        if (n === null || n === undefined) return '—';
        return n.toLocaleString();
    }
    function fmtPctSmart(n) {
        // The pipeline stores these rates as whole percentages (2.0 means
        // 2.00%, 0.5 means 0.50%) — never as a 0–1 fraction. A sub-1% rate
        // (a real LPA term: access funds/SPVs commonly charge < 1% on
        // invested capital) is a whole percentage too, not a fraction that
        // needs scaling — confirmed against RAW_JSON citation source text for
        // several Delta-v funds (e.g. "multiplied by 0.5000%" → value 0.5).
        if (n === null || n === undefined) return '—';
        return n.toFixed(2) + '%';
    }
    // A term computed from dates ("10.3753424657534") reads as one decimal.
    const roundYears = n => Math.round(n * 10) / 10;
    function fmtYears(n) {
        if (n === null || n === undefined) return '—';
        const y = roundYears(n);
        return y + (y === 1 ? ' yr' : ' yrs');
    }
    function fmtYearsFull(n) {
        if (n === null || n === undefined) return '—';
        const y = roundYears(n);
        return y + (y === 1 ? ' year' : ' years');
    }
    function fmtDays(n) {
        if (n === null || n === undefined) return '—';
        return n + (n === 1 ? ' day' : ' days');
    }
    function fmtDate(s) {
        if (!s || s === '—') return '—';
        const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!m) return s;
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return months[parseInt(m[2], 10) - 1] + ' ' + parseInt(m[3], 10) + ', ' + m[1];
    }
    function fmtBool(b) {
        if (b === null || b === undefined) return '—';
        return b ? 'Yes' : 'No';
    }
    function esc(s) {
        return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escAttr(s) {
        return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }

    // ---------- External links ----------
    // Cowork Live Artifacts run in a real browser context, so a plain
    // window.open() works — no save-server / POST /open-url plumbing needed
    // (that existed only to escape the Claude Desktop preview pane's sandbox).
    function openExternal(url) {
        window.open(url, '_blank');
    }

    // ---------- Status metadata ----------
    const STATUS = {
        EXTRACTED: { label: 'Full data',   badge: 'executed',   filterLabel: 'Full data' },
        // Says what the agreement states, not what the vehicle charges: with no terms row, nothing was read.
        VEHICLE_AGREEMENT: { label: 'Vehicle agreement', badge: 'vehicle', filterLabel: 'Vehicle agreement',
                     noEconomics: 'states no fee or carry of its own' },
        PARTIAL:   { label: 'Partial data', badge: 'unexecuted', filterLabel: 'Partial data' },
        // gap is the table row's text; detail is the fund panel's, for the states with no LPA.
        PARENT_AGREEMENT: { label: 'Parent agreement', badge: 'unexecuted', filterLabel: 'Governed by parent agreement',
                     gap: 'Governed by parent agreement · series-specific terms not on file', detail: '' },
        MISSING:   { label: 'Missing LPA', badge: 'missing',    filterLabel: 'Missing LPA',
                     gap: 'No LPA on file', detail: '' },
        NAME_MISMATCH: { label: 'Name mismatch', badge: 'unexecuted', filterLabel: 'Name mismatch',
                     gap: 'No document matches this name · see unmatched documents below',
                     detail: 'The firm has documents that matched no fund. Check the unmatched documents below the table. ' },
        NO_DOCUMENTS:  { label: 'No documents',  badge: 'none',       filterLabel: 'No documents',
                     gap: 'No documents extracted for this firm',
                     detail: 'No LPA or operating agreement has been extracted for this firm. ' },
    };
    // The states that explain a gap are listed only when a fund is in one.
    const ALWAYS_LISTED = new Set(['EXTRACTED', 'PARTIAL', 'MISSING']);
    const STATUS_ORDER = { EXTRACTED: 0, VEHICLE_AGREEMENT: 1, PARTIAL: 2, PARENT_AGREEMENT: 3, NAME_MISMATCH: 4, MISSING: 5, NO_DOCUMENTS: 6 };

    function badgeHtml(status) {
        const s = STATUS[status] || STATUS.MISSING;
        return '<span class="bucket-badge ' + s.badge + '">' + esc(s.label) + '</span>';
    }

    // Flags an LPA matched on a near-identical fund name, so the GP can confirm it.
    function similarNameTag(fund) {
        if (fund.lpaMatch !== 'close' || !fund.lpa) return '';
        const lpaName = (fund.lpa.fund && fund.lpa.fund.name) || '';
        return '<span class="chip" title="' +
            escAttr('Matched to the LPA for "' + lpaName + '". The names differ slightly. Confirm it is this fund\'s LPA.') +
            '">Similar name</span>';
    }

    // A series that shares its master's agreement shows the master's terms; say whose.
    function inheritedTag(fund) {
        if (!fund.inheritedFromMaster) return '';
        return '<span class="chip" title="' + escAttr('Terms and LP roster come from the agreement of "' + fund.inheritedFromMaster + '".') +
            '">Inherited from master</span>';
    }

    // An LPA that tied between this fund and a sibling goes to neither; say so.
    function possibleLpaNote(fund) {
        const possible = fund.possibleLpaNames || [];
        if (!possible.length) return '';
        return 'An LPA for <strong>' + esc(possible[0]) + '</strong>' +
            (possible.length > 1 ? ' (+' + (possible.length - 1) + ' more)' : '') +
            ' could belong to this fund or a similarly named one. Check which fund it covers.';
    }

    // A series whose own agreement is not on file is governed by its parent LLC's.
    function parentAgreementNote(fund) {
        const refs = fund.parentAgreements || [];
        if (!refs.length) return '';
        return 'Governed by the <strong>' + esc(refs[0].name) + '</strong> agreement' +
            (refs.length > 1 ? ' (+' + (refs.length - 1) + ' more)' : '') +
            '. Series-specific terms are not on file.';
    }

    // Rates arrive as whole percentages already (see fmtPctSmart) — this just
    // gives sorting and deltas a null-safe numeric value on that same scale.
    function pctValue(n) {
        if (n === null || n === undefined) return null;
        return n;
    }
    // A 0% fee, carry or hurdle is a stated term (an SPV that charges no fee), not a gap.
    function fmtTermRate(n) {
        if (n === null || n === undefined) return '—';
        return pctValue(n) === 0 ? 'None' : fmtPctSmart(n);
    }
    // A fee of 0 is the LPA stating no fee is charged; a missing fee is '—'.
    function fmtFeeRate(n) {
        return n === 0 ? 'No fee (per LPA)' : fmtTermRate(n);
    }
    // A hurdle is a rate, a multiple of capital, or both ("8.00% · 1.50x").
    function fmtHurdle(t) {
        const multiple = t.preferredReturnMultiple;
        if (multiple === null || multiple === undefined) return fmtTermRate(t.preferredReturnRate);
        const parts = [multiple.toFixed(2) + 'x'];
        if (t.preferredReturnRate) parts.unshift(fmtTermRate(t.preferredReturnRate));
        return parts.join(' · ');
    }
    const termsOf = f => (f.lpa && f.lpa.termsExtracted) ? f.lpa.terms : null;
    const TERM_LABELS = {
        mgmtFeeRateInvestmentPeriod: 'Management fee', mgmtFeeRatePostInvestment: 'Mgmt fee after investment period',
        carriedInterestRate: 'Carried interest', preferredReturnRate: 'Hurdle', fundTermYears: 'Fund term',
        investmentPeriodYears: 'Investment period', capitalCallNoticeDays: 'Capital call notice',
    };
    const flagsOf = f => (f.lpa && f.lpa.termFlags) || [];
    function termCheckChip(fund, field) {
        return checkChip(flagsOf(fund).filter(fl => fl.field === field).map(fl => fl.reason));
    }
    function checkChip(reasons) {
        return reasons.length
            ? ' <span class="chip chip-check" title="' + escAttr('Check the LPA: ' + reasons.join('; ')) + '">Check</span>'
            : '';
    }
    const docsUrl = () => CARTA_BASE_URL + '/investors/firm/' + encodeURIComponent(DATA.meta.firmCartaId) + '/portfolio/documents/';
    // DOCUMENT_ID is the fund-admin document's own id, so it opens that document's page.
    const documentUrl = documentId => documentId ? docsUrl() + encodeURIComponent(documentId) : null;
    const documentLink = (documentId, text) => documentId
        ? '<a class="carta-link" href="' + escAttr(documentUrl(documentId)) + '" data-external>' + text + '</a>'
        : text;
    function fundUrl(fund) {
        // cartaId is digits-only by render-artifact.py's validation; re-checked
        // here because it is concatenated into an href.
        if (!/^[0-9]+$/.test(String(fund.cartaId || ''))) return null;
        return CARTA_BASE_URL + '/investors/firm/' + encodeURIComponent(DATA.meta.firmCartaId) +
            '/portfolio/fund/' + fund.cartaId + '/overview/';
    }

    // ---------- Header + summary tiles ----------
    function renderHeader() {
        const m = DATA.meta;
        document.getElementById('page-header').innerHTML =
            '<h1>Fund terms &amp; LPAs</h1>' +
            '<p class="page-subtitle">' + esc(m.firmName) +
            ' · Extracted from LPA and side letter documents · Data as of ' + esc(m.generatedAt) + '</p>';
    }

    // Only provisions that move what an LP pays count toward the side-letter
    // tile: the typed economic provisions, and a custom fee or carry schedule.
    // An MFN or other non-economic clause is still listed on the letter.
    const ECONOMIC_TYPES = new Set([
        'REDUCED_MANAGEMENT_FEE', 'REDUCED_CARRIED_INTEREST', 'WAIVED_MANAGEMENT_FEE',
        'WAIVED_CARRIED_INTEREST', 'INCREASED_PREFERRED_RETURN', 'INCREASED_HURDLE',
    ]);
    const changesEconomics = sl =>
        !!(sl.complexManagementFee || sl.complexCarry) ||
        (sl.economicProvisions || []).some(p => ECONOMIC_TYPES.has(String(p.provision_type || '').toUpperCase()));

    function renderSummaryTiles() {
        const c = DATA.coverage;
        const ofTotal = 'of ' + c.totalFunds + ' fund' + (c.totalFunds === 1 ? '' : 's');
        const letters = grantedLetters(DATA.funds);
        const withEconomics = letters.filter(changesEconomics).length;
        // Side letters on a fund with no LPA can't be compared against anything.
        const withoutLpa = DATA.funds.filter(f => !f.lpa).reduce((s, f) => s + (f.sideLetterCount || 0), 0);
        const lc = DATA.sideLetterCounts || { received: 0, unmatched: 0 };
        const unmatchedDocs = (DATA.unmatchedDocuments || []).length;

        const tile = (key, label, value, sub) => {
            const inner = '<span class="tile-label">' + esc(label) + '</span>' +
                '<span class="tile-value">' + esc(value) + '</span>' +
                '<span class="tile-sub">' + esc(sub) + '</span>';
            return key
                ? '<button type="button" class="tile" data-filter="' + key + '" aria-pressed="' + (ACTIVE_FILTER === key) + '">' + inner + '</button>'
                : '<div class="tile">' + inner + '</div>';
        };
        document.getElementById('summary-tiles').innerHTML =
            tile('EXTRACTED', 'Full data', c.extracted, ofTotal) +
            (c.vehicleAgreement ? tile('VEHICLE_AGREEMENT', 'Vehicle agreements', c.vehicleAgreement,
                capitalized(STATUS.VEHICLE_AGREEMENT.noEconomics) + ' · ' + ofTotal) : '') +
            // A gap tile shows only when there is a gap; Missing also stays for side letters on a fund with no LPA.
            (c.partial ? tile('PARTIAL', 'Partial data', c.partial, 'On file · no headline terms in the documents') : '') +
            (c.missing || withoutLpa ? tile('MISSING', 'Missing an LPA', c.missing,
                ofTotal + (withoutLpa ? ' · ' + withoutLpa + ' side letter' + (withoutLpa === 1 ? '' : 's') + ' without one' : '')) : '') +
            (c.parentAgreement ? tile('PARENT_AGREEMENT', 'Governed by parent', c.parentAgreement,
                'Series terms not on file · ' + ofTotal) : '') +
            (c.nameMismatch ? tile('NAME_MISMATCH', 'Name mismatch', c.nameMismatch,
                unmatchedDocs + ' document' + (unmatchedDocs === 1 ? '' : 's') + ' matched no fund') : '') +
            (c.noDocuments ? tile('NO_DOCUMENTS', 'No documents', c.noDocuments,
                'Nothing extracted for this firm yet') : '') +
            tile(null, 'Side letters', c.totalSideLetters, withEconomics + ' change fee, carry or hurdle · ' +
                lc.received + ' received · ' + lc.unmatched + ' unmatched');
    }

    // ---------- Filter, search, sort ----------
    let ACTIVE_FILTER = 'all';
    let SEARCH_QUERY = '';
    let SORT = null;          // null = default order: status, then name
    let VISIBLE = [];         // the rows as currently filtered and sorted
    let SELECTED_FUND = null;

    function renderFilterBar() {
        let opts = '<option value="all">All funds (' + DATA.funds.length + ')</option>';
        Object.entries(STATUS).forEach(([key, meta]) => {
            const count = DATA.funds.filter(f => f.lpaStatus === key).length;
            if (!count && !ALWAYS_LISTED.has(key)) return;
            opts += '<option value="' + key + '">' + esc(meta.filterLabel) + ' (' + count + ')</option>';
        });
        const select = document.getElementById('filter-select');
        select.innerHTML = opts;
        select.value = ACTIVE_FILTER;
    }
    function setFilter(key) {
        ACTIVE_FILTER = key;
        renderSummaryTiles();
        renderFilterBar();
        renderFundTable();
    }
    function setSearch(q) { SEARCH_QUERY = (q || '').toLowerCase().trim(); renderFundTable(); }

    const COLUMNS = [
        { key: 'name',   label: 'Fund',         get: f => f.fundName || '' },
        { key: 'fee',    label: 'Mgmt fee',     num: true, term: true, field: 'mgmtFeeRateInvestmentPeriod', get: f => termsOf(f) && pctValue(termsOf(f).mgmtFeeRateInvestmentPeriod), fmt: f => fmtFeeRate(termsOf(f).mgmtFeeRateInvestmentPeriod) },
        { key: 'carry',  label: 'Carry',        num: true, term: true, field: 'carriedInterestRate', get: f => termsOf(f) && pctValue(termsOf(f).carriedInterestRate),         fmt: f => fmtTermRate(termsOf(f).carriedInterestRate) + (termsOf(f).carryTierRates ? ' (tiered)' : '') },
        { key: 'hurdle', label: 'Hurdle',       num: true, term: true, field: 'preferredReturnRate', get: f => termsOf(f) && pctValue(termsOf(f).preferredReturnRate),         fmt: f => fmtHurdle(termsOf(f)) },
        { key: 'term',   label: 'Fund term',    num: true, term: true, field: 'fundTermYears', get: f => termsOf(f) && termsOf(f).fundTermYears,                         fmt: f => fmtYears(termsOf(f).fundTermYears) },
        { key: 'ip',     label: 'Inv. period',  num: true, term: true, field: 'investmentPeriodYears', get: f => termsOf(f) && termsOf(f).investmentPeriodYears,                 fmt: f => fmtYears(termsOf(f).investmentPeriodYears) },
        { key: 'sl',     label: 'Side letters', num: true, get: f => f.sideLetterCount || 0 },
    ];
    const TERM_COLUMNS = COLUMNS.filter(c => c.term);
    // An empty extraction can't tell "the agreement has none" from "the agreement wasn't read for it",
    // so a blank term says "Not found" rather than "None". A stated 0 still reads "None" or "No fee (per LPA)".
    const NOT_FOUND_TITLE = 'Not found in the documents on file: the agreement may not state it, or it was not extracted.';
    function termCell(text) {
        if (!text.startsWith('—')) return esc(text);
        return '<span class="not-found" title="' + escAttr(NOT_FOUND_TITLE) + '">Not found</span>' + esc(text.slice(1));
    }
    const isBlank = v => v === null || v === undefined || v === false;

    function sortedFunds() {
        const list = DATA.funds
            .filter(f => ACTIVE_FILTER === 'all' || f.lpaStatus === ACTIVE_FILTER)
            .filter(f => !SEARCH_QUERY || (f.fundName || '').toLowerCase().includes(SEARCH_QUERY));
        const byName = (a, b) => (a.fundName || '').localeCompare(b.fundName || '');
        if (!SORT) {
            return list.sort((a, b) => ((STATUS_ORDER[a.lpaStatus] ?? 99) - (STATUS_ORDER[b.lpaStatus] ?? 99)) || byName(a, b));
        }
        const col = COLUMNS.find(c => c.key === SORT.key);
        const dir = SORT.dir === 'asc' ? 1 : -1;
        return list.sort((a, b) => {
            const va = col.get(a), vb = col.get(b);
            // Unextracted values sink whichever way the column sorts, so a sort
            // never leads with gaps.
            const na = isBlank(va);
            const nb = isBlank(vb);
            if (na && nb) return byName(a, b);
            if (na) return 1;
            if (nb) return -1;
            const cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
            return cmp * dir || byName(a, b);
        });
    }

    // ---------- Fund table ----------
    function renderTableHead() {
        document.getElementById('fund-thead').innerHTML = COLUMNS.map(c => {
            const active = SORT && SORT.key === c.key;
            const ariaSort = active ? (SORT.dir === 'asc' ? 'ascending' : 'descending') : 'none';
            const indicator = active ? (SORT.dir === 'asc' ? '▲' : '▼') : '';
            const cls = [c.key === 'name' ? 'c-fund' : '', c.num ? 'num' : ''].join(' ').trim();
            return '<th scope="col" class="' + cls + '" aria-sort="' + ariaSort + '">' +
                '<button type="button" class="sort-btn" data-sort="' + c.key + '">' + esc(c.label) +
                '<span class="sort-ind" aria-hidden="true">' + indicator + '</span></button></th>';
        }).join('');
    }

    function renderFundTable() {
        renderTableHead();
        VISIBLE = sortedFunds();
        const tbody = document.getElementById('fund-tbody');
        if (!VISIBLE.length) {
            const empty = SEARCH_QUERY ? 'No funds match "' + esc(SEARCH_QUERY) + '".' : 'No funds in this view.';
            tbody.innerHTML = '<tr><td class="empty-bucket" colspan="' + COLUMNS.length + '">' + empty + '</td></tr>';
            syncPanelNav();
            return;
        }
        tbody.innerHTML = VISIBLE.map(renderFundRow).join('');
        syncPanelNav();
    }

    // The name rides in a data attribute read via .dataset. An inline handler would
    // decode &#39; back to a bare ' and break for any fund name with an apostrophe.
    function renderFundRow(fund) {
        const selected = fund.fundName === SELECTED_FUND;
        let cells = '<th scope="row" class="c-fund">' +
            '<button type="button" class="fund-btn" aria-expanded="' + selected + '" aria-controls="fund-panel">' + esc(fund.fundName) + '</button>' +
            '<div class="fund-meta">' + badgeHtml(fund.lpaStatus) + similarNameTag(fund) + inheritedTag(fund) + '</div></th>';
        // Gap rows span the term columns with one message instead of five dashes,
        // but keep their own side-letter cell: letters without an LPA is a real signal.
        if (!fund.lpa) {
            const gap = STATUS[fund.lpaStatus].gap +
                (fund.lpaStatus === 'MISSING' && (fund.possibleLpaNames || []).length ? ' · possible match to check' : '');
            cells += '<td class="c-gap" colspan="' + TERM_COLUMNS.length + '">' + esc(gap) + '</td>';
        } else if (fund.lpaStatus === 'PARTIAL') {
            cells += '<td class="c-gap" colspan="' + TERM_COLUMNS.length + '">On file, but the documents state no headline fee, carry, hurdle or fund-term figures</td>';
        } else if (fund.lpaStatus === 'VEHICLE_AGREEMENT') {
            // Every vehicle row reads the same; a stated 0% fee or a fund term is in its panel, and any check flag stays on the row.
            cells += '<td class="c-gap" colspan="' + TERM_COLUMNS.length + '">Vehicle agreement · ' +
                esc(STATUS.VEHICLE_AGREEMENT.noEconomics) + checkChip(flagsOf(fund).map(fl => fl.reason)) + '</td>';
        } else {
            cells += TERM_COLUMNS.map(c => '<td class="num">' + termCell(c.fmt(fund)) + termCheckChip(fund, c.field) + '</td>').join('');
        }
        cells += '<td class="num">' + esc(fund.sideLetterCount || 0) + '</td>';
        return '<tr data-fund-name="' + escAttr(fund.fundName) + '"' + (selected ? ' class="is-selected"' : '') + '>' + cells + '</tr>';
    }

    function renderNotAudited() {
        const el = document.getElementById('not-audited');
        const list = DATA.notAudited || [];
        if (!list.length) { el.hidden = true; return; }
        el.innerHTML = '<summary>' + list.length + ' entit' + (list.length === 1 ? 'y' : 'ies') +
            ' not audited — ' + (list.length === 1 ? 'it doesn’t' : 'they don’t') + ' carry an LPA</summary><ul>' +
            list.map(e => '<li>' + esc(e.name) + (e.entityType ? ' · ' + esc(e.entityType) : '') + ' · ' + esc(e.reason) + '</li>').join('') + '</ul>';
        el.hidden = false;
    }

    function docLine(d) {
        return documentLink(d.documentId, esc(d.fundName || 'Unnamed fund')) + (d.gpName ? ' · ' + esc(d.gpName) : '') +
            (d.lpaDate ? ' · ' + esc(fmtDate(d.lpaDate)) : '');
    }

    function fillSection(id, items, summary, note, line) {
        const el = document.getElementById(id);
        if (!items.length) { el.hidden = true; return; }
        el.innerHTML = '<summary>' + esc(summary) + '</summary><p>' + esc(note) + '</p><ul>' +
            items.map(item => '<li>' + line(item) + '</li>').join('') + '</ul>';
        el.hidden = false;
    }

    // What the extractions hold that no fund card shows: documents that may be the firm's own
    // under another name, documents received from other managers, and letters no fund received.
    function renderUnclaimed() {
        const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');
        const unmatched = DATA.unmatchedDocuments || [], received = DATA.receivedDocuments || [];
        const letters = DATA.unmatchedSideLetters || [];
        const companyLetters = (DATA.sideLetterCounts || {}).company || 0;
        fillSection('unmatched-docs', unmatched,
            plural(unmatched.length, 'document') + ' didn’t match any fund',
            'These look like this firm’s own agreements, but the name matches no entity in Carta. A renamed fund is the usual cause. Link by asking your Carta team: send them each document and the fund it belongs to, and they will attach it.',
            docLine);
        fillSection('received-docs', received,
            plural(received.length, 'agreement') + ' received from other managers',
            'LPAs of other managers’ funds that name one of this firm’s entities as an investor. They are not errors and not part of the coverage count.',
            docLine);
        fillSection('unmatched-letters', letters,
            plural(letters.length, 'side letter') + ' matched no fund',
            'Side letters on file that may be this firm’s but name none of its funds.' +
                (companyLetters ? ' ' + plural(companyLetters, 'side letter') + ' from portfolio companies’ funding rounds are left out.' : ''),
            sl => documentLink(sl.documentId, esc(sl.fundName || 'Unnamed fund')) + (sl.lpName ? ' · ' + esc(sl.lpName) : '') + (sl.issueDate ? ' · ' + esc(fmtDate(sl.issueDate)) : ''));
    }

    // ---------- Fund details panel ----------
    const documentLabel = lpa => lpa.documentType === OPERATING_AGREEMENT_DOCUMENT_TYPE ? 'operating agreement' : 'LPA';
    const capitalized = text => text.charAt(0).toUpperCase() + text.slice(1);

    function renderTermsSection(fund) {
        let html = '<div class="drawer-section"><h3 class="drawer-section-title">Economic terms</h3>';
        if (fund.lpaStatus === 'PARENT_AGREEMENT') {
            return html + '<div class="drawer-empty">' + parentAgreementNote(fund) + ' ' +
                documentLink(fund.parentAgreements[0].documentId, 'View the parent agreement ↗') + '</div></div>';
        }
        if (!fund.lpa) {
            const possible = possibleLpaNote(fund);
            const why = STATUS[fund.lpaStatus].detail;
            return html + '<div class="drawer-empty">No LPA on file for this fund. ' + esc(why) +
                (possible ? possible + ' ' : '') +
                'Upload the LPA: drop it into this chat, or ' +
                '<a class="carta-link" href="' + escAttr(docsUrl()) + '" data-external>upload it in Carta ↗</a></div></div>';
        }
        const t = termsOf(fund);
        const isVehicle = fund.lpaStatus === 'VEHICLE_AGREEMENT';
        const vehicleText = 'Vehicle agreement on file. It ' + STATUS.VEHICLE_AGREEMENT.noEconomics + ', which is usual for a vehicle that distributes pro rata or takes its economics from the main fund’s agreement.';
        if (!t && isVehicle) {
            return html + '<div class="drawer-empty">' + vehicleText + ' ' +
                '<a class="carta-link" href="' + escAttr(docsUrl()) + '" data-external>Upload the full ' + documentLabel(fund.lpa) + ' ↗</a></div></div>';
        }
        const vehicleNote = isVehicle ? '<div class="drawer-empty">' + vehicleText + '</div>' : '';
        // A Partial fund's documents state none of the headline terms: signature pages from
        // a subscription packet, a short-form agreement, or an agreement stating only terms
        // the table does not show. Any such terms still list below the note.
        const partialNote = fund.lpaStatus === 'PARTIAL'
            ? '<div class="drawer-empty">The documents on file for this fund name it but state no headline fee, carry, hurdle or fund-term figures. ' +
              'They are often signature pages from a subscription packet. ' +
              'Upload the full ' + documentLabel(fund.lpa) + ': drop it into this chat, or ' +
              '<a class="carta-link" href="' + escAttr(docsUrl()) + '" data-external>upload it in Carta ↗</a></div>'
            : '';
        if (!t) return html + partialNote + '</div>';
        const feeBasis = t.mgmtFeeBasisInvestmentPeriod ? ' of ' + esc(t.mgmtFeeBasisInvestmentPeriod) : '';
        // Hyphenated terms ("whole-of-fund", "catch-up") stay on one line; a wrap falls between words.
        const waterfall = t.waterfallStructure
            ? esc(t.waterfallStructure).replace(/(\S*-\S*)/g, '<span class="nowrap">$1</span>')
            : '—';
        // One flat list: fee and carry economics, then timing. Unextracted rows
        // are dropped rather than shown as a dash.
        const rows = [
            [TERM_LABELS.mgmtFeeRateInvestmentPeriod, t.mgmtFeeRateInvestmentPeriod == null ? '—'
                : fmtFeeRate(t.mgmtFeeRateInvestmentPeriod) + (pctValue(t.mgmtFeeRateInvestmentPeriod) === 0 ? '' : feeBasis)],
            [TERM_LABELS.mgmtFeeRatePostInvestment, fmtTermRate(t.mgmtFeeRatePostInvestment)],
            [TERM_LABELS.carriedInterestRate, fmtTermRate(t.carriedInterestRate)],
            ['Carry tiers', t.carryTierRates ? t.carryTierRates.map(fmtPctSmart).join(' → ') : '—'],
            [TERM_LABELS.preferredReturnRate, fmtHurdle(t)],
            ['Waterfall', waterfall],
            [TERM_LABELS.fundTermYears, fmtYearsFull(t.fundTermYears)],
            [TERM_LABELS.investmentPeriodYears, fmtYearsFull(t.investmentPeriodYears)],
            [TERM_LABELS.capitalCallNoticeDays, fmtDays(t.capitalCallNoticeDays)],
            ['Initial closing', fmtDate(t.initialClosingDate)],
        ].filter(([, v]) => v !== '—');
        const notFundLpa = fund.lpa.notFundLpa
            ? '<div class="term-checks"><strong>Operating agreement, not a fund LPA</strong>' +
              '<ul><li>The stated carry is above ' + FUND_CARRY_MAX_PCT + '%, so it is a member profit split rather than fund carry. Carry, hurdle and waterfall are not shown.</li></ul></div>'
            : '';
        const flags = flagsOf(fund);
        const checks = flags.length
            ? '<div class="term-checks"><strong>Check the LPA</strong><ul>' +
              flags.map(fl => '<li>' + esc(TERM_LABELS[fl.field]) + ': ' + esc(fl.reason) + '</li>').join('') + '</ul></div>'
            : '';
        return html + partialNote + vehicleNote + '<dl class="facts">' +
            rows.map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + v + '</dd>').join('') + '</dl>' + notFundLpa + checks + '</div>';
    }

    // Only ~15.7% of side letters state a commitment; the rest backfill from the LPA
    // roster, and fromLpa lets the caller mark that figure as inferred.
    function sideLetterCommitment(sl, lpa) {
        // The letter's own value is a pipeline-formatted string ("MYR 15,000,000").
        if (sl.lpCapitalCommitment) return { text: esc(sl.lpCapitalCommitment), fromLpa: false };
        // Investor-role letters name a portfolio company as the counterparty and
        // this fund as the LP, so neither side matches this fund's own roster.
        if (sl.role === 'investor') return { text: null, fromLpa: false };
        const name = sl.lpName || sl.counterpartyName;
        if (!name || !lpa) return { text: null, fromLpa: false };
        // Only LPs that actually carry an amount are candidates, so a name match
        // against a commitment-less row can't shadow a usable one.
        const byName = new Map();
        for (const lp of (lpa.limitedPartners || [])) {
            if (lp.name && lp.commitmentAmount != null) byName.set(lp.name, lp);
        }
        if (byName.size === 0) return { text: null, fromLpa: false };
        const hit = bestMatch(name, Array.from(byName.keys()));
        if (!hit) return { text: null, fromLpa: false };
        return { text: fmtAmount(byName.get(hit).commitmentAmount, byName.get(hit).currencyCode), fromLpa: true };
    }
