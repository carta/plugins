    // "15%" and "1.75%" are already percentages; a bare fraction ("0.15") is
    // scaled like fmtPctSmart. Returns null when the string holds no number.
    function parseRate(raw) {
        if (raw === null || raw === undefined) return null;
        const s = String(raw);
        const m = s.match(/-?\d+(\.\d+)?/);
        if (!m) return null;
        const v = parseFloat(m[0]);
        return (!s.includes('%') && v < 1) ? v * 100 : v;
    }

    const PROVISION_ACRONYMS = { mfn: 'MFN', lp: 'LP', gp: 'GP' };

    // Known types show the letter's rate and its difference from this fund's LPA
    // term: fees in basis points, carry and hurdle in points.
    function provisionLine(p, lpa) {
        const type = String(p.provision_type || '').toUpperCase();
        const rate = parseRate(p.rate_paid);
        const rateText = rate !== null ? ' ' + esc(rate.toFixed(2) + '%') : (p.rate_paid ? ' ' + esc(p.rate_paid) : '');
        const terms = (lpa && lpa.termsExtracted) ? (lpa.terms || {}) : {};
        const delta = (lpaRaw, unit) => {
            const lpaVal = pctValue(lpaRaw);
            if (rate === null || lpaVal === null) return '';
            const diff = rate - lpaVal;
            const sign = diff > 0 ? '+' : diff < 0 ? '−' : '±';
            const mag = unit === 'bps'
                ? Math.round(Math.abs(diff) * 100) + ' bps'
                : Math.abs(diff).toFixed(2).replace(/\.?0+$/, '') + ' pts';
            return ' <span class="provision-cmp">' + sign + mag + ' vs LPA ' + esc(fmtPctSmart(lpaRaw)) + '</span>';
        };
        switch (type) {
            case 'REDUCED_MANAGEMENT_FEE':
                return '<strong>Reduced management fee</strong>' + rateText + delta(terms.mgmtFeeRateInvestmentPeriod, 'bps');
            case 'REDUCED_CARRIED_INTEREST':
                return '<strong>Reduced carry</strong>' + rateText + delta(terms.carriedInterestRate, 'pts');
            case 'INCREASED_PREFERRED_RETURN':
            case 'INCREASED_HURDLE':
                return '<strong>Increased hurdle</strong>' + rateText +
                    (pctValue(terms.preferredReturnRate) === 0
                        ? ' <span class="provision-cmp">LPA has no hurdle</span>'
                        : delta(terms.preferredReturnRate, 'pts'));
            // A waiver has no rate to show and none to compare against.
            case 'WAIVED_MANAGEMENT_FEE':
                return '<strong>Waived management fee</strong>';
            case 'WAIVED_CARRIED_INTEREST':
                return '<strong>Waived carried interest</strong>';
            default: {
                // Unknown types keep a readable label; a rate-less one renders bare
                // rather than "Label: —", which would read as missing data.
                const words = type.toLowerCase().split('_').filter(Boolean).map(w => PROVISION_ACRONYMS[w] || w);
                const label = words.length ? words.join(' ').replace(/^\w/, ch => ch.toUpperCase()) : 'Provision';
                return '<strong>' + esc(label) + '</strong>' + rateText;
            }
        }
    }

    function renderSideLetter(sl, fund) {
        const chips = [];
        if (sl.attributionMethod === 'lp-name') {
            chips.push('<span class="chip" title="Fund assignment inferred from LP name match — verify against source document.">Fund inferred</span>');
        } else if (sl.attributionMethod === 'date-inferred') {
            chips.push('<span class="chip" title="Fund assignment inferred from issue date match — verify against source document.">Fund inferred (date)</span>');
        }
        if (sl.sharedAcrossSeries) {
            chips.push('<span class="chip" title="The letter names the LLC, not one of its series, so it shows on each series and counts once in the totals.">All series</span>');
        }
        const meta = [esc(fmtDate(sl.issueDate))];
        const commitment = sideLetterCommitment(sl, fund.lpa);
        if (commitment.text) {
            meta.push(commitment.text + ' commitment' + (commitment.fromLpa
                ? ' <span class="chip" title="This side letter does not state a commitment amount. Figure taken from the fund\'s LPA by matching the investor name — verify against the source document.">From LPA</span>'
                : ''));
        }
        const lines = (sl.economicProvisions || []).map(p => provisionLine(p, fund.lpa))
            .concat(PROVISION_SUMMARIES.filter(([key]) => sl[key]).map(([key, label]) => '<strong>' + esc(label) + '</strong> ' + esc(sl[key])));
        return '<div class="sl">' +
            '<div class="sl-top">' + documentLink(sl.documentId, esc(sl.counterpartyName || sl.lpName || '—')) + chips.join('') + '</div>' +
            '<div class="sl-meta">' + meta.join(' · ') + '</div>' +
            (lines.length
                ? '<ul class="provision-list">' + lines.map(line => '<li>' + line + '</li>').join('') + '</ul>'
                : '<div class="provision-none">No provisions extracted</div>') +
            '</div>';
    }

    // Dedup and sort already applied by matchFunds: provision-bearing letters
    // first, then date-descending.
    function renderSideLettersSection(fund) {
        const all = fund.sideLetters || [];
        const own = all.filter(sl => sl.role !== 'investor');
        // The fund received these as an investor in a portfolio company — a
        // different question from what it granted its own LPs.
        const asInvestor = all.filter(sl => sl.role === 'investor');
        let html = '<div class="drawer-section"><h3 class="drawer-section-title">Side letters ' +
            '<span class="drawer-section-count">' + own.length + '</span></h3>';
        html += own.length
            ? '<div class="sl-list">' + own.map(sl => renderSideLetter(sl, fund)).join('') + '</div>'
            : '<div class="drawer-empty">No side letters granted to this fund\'s LPs.</div>';
        if (asInvestor.length) {
            html += '<details class="investor-letters"><summary>' + asInvestor.length + ' side letter' +
                (asInvestor.length === 1 ? '' : 's') + ' this fund received as an investor</summary>' +
                '<div class="sl-list">' + asInvestor.map(sl => renderSideLetter(sl, fund)).join('') + '</div></details>';
        }
        return html + '</div>';
    }

    function renderLpSection(fund) {
        const lps = ((fund.lpa && fund.lpa.limitedPartners) || []).slice()
            .sort((a, b) => (b.commitmentAmount ?? -Infinity) - (a.commitmentAmount ?? -Infinity));
        if (fund.inheritedFromMaster) {
            return '<div class="drawer-section"><h3 class="drawer-section-title">Limited partners</h3><div class="drawer-empty">' +
                'Inherited from the master agreement of <strong>' + esc(fund.inheritedFromMaster) + '</strong>' +
                (fund.lpa.limitedPartnerCount ? ' (' + fund.lpa.limitedPartnerCount + ' LPs)' : '') + '. The roster is not repeated here.</div></div>';
        }
        const priced = lps.filter(lp => lp.commitmentAmount != null);
        // Names with no commitment beside them say nothing the documents don't, so no table.
        if (!priced.length) return '';
        // The roster spans several documents. Amounts in different currencies are
        // never added; a document with no known currency counts as a currency of its own.
        const currencies = new Set(priced.map(lp => lp.currencyCode || ''));
        const sameCurrency = currencies.size <= 1;
        const total = sameCurrency ? priced.reduce((s, lp) => s + lp.commitmentAmount, 0) : null;
        const unpriced = lps.length - priced.length;
        const share = n => (n != null && total) ? (n / total * 100).toFixed(2) + '%' : '—';
        const footNote = !sameCurrency
            ? 'Not totalled: amounts are in more than one currency'
            : unpriced ? 'Excludes ' + unpriced + ' LP' + (unpriced === 1 ? '' : 's') + ' with no extracted commitment' : '';
        return '<div class="drawer-section"><h3 class="drawer-section-title">Limited partners ' +
            '<span class="drawer-section-count">' + lps.length + '</span></h3>' +
            '<table class="lp-table"><thead><tr><th scope="col">Name</th>' +
            '<th scope="col" class="num">Commitment</th><th scope="col" class="num">% of total</th></tr></thead><tbody>' +
            lps.map(lp => '<tr><td>' + esc(lp.name || '—') +
                (lp.entityType ? '<span class="lp-type">' + esc(lp.entityType) + '</span>' : '') + '</td>' +
                '<td class="num">' + fmtAmount(lp.commitmentAmount, lp.currencyCode) + '</td>' +
                '<td class="num">' + share(lp.commitmentAmount) + '</td></tr>').join('') +
            '</tbody><tfoot><tr><td>Total' +
            (footNote ? '<span class="lp-type">' + footNote + '</span>' : '') +
            '</td><td class="num">' + (total === null ? '—' : fmtAmount(total, [...currencies][0])) + '</td><td class="num">' + (total ? '100.00%' : '—') + '</td></tr></tfoot>' +
            '</table></div>';
    }

    function renderIdentitySection(fund) {
        if (!fund.lpa) return '';
        const f = fund.lpa.fund || {};
        const gp = fund.lpa.generalPartner || {};
        // Never parentheses: an amount in them reads as negative.
        const gpCommitment = [
            gp.commitmentPercentage != null && fmtPctSmart(gp.commitmentPercentage),
            gp.commitmentAmount != null && fmtAmount(gp.commitmentAmount, fund.lpa.currencyCode),
        ].filter(Boolean).join(' · ') || null;
        // Unextracted rows are dropped, not shown as a bare em dash.
        const rows = [
            ['Legal name', f.name && esc(f.name)],
            [capitalized(documentLabel(fund.lpa)) + ' date', f.lpaDate && esc(fmtDate(f.lpaDate))],
            ['State of formation', f.stateOfFormation && esc(f.stateOfFormation)],
            ['General partner', gp.name && esc(gp.name) + (gp.entityType ? ' (' + esc(gp.entityType) + ')' : '')],
            ['GP state of formation', gp.stateOfFormation && esc(gp.stateOfFormation)],
            ['GP commitment', gpCommitment],
            ['Fund purpose', f.fundPurpose && esc(f.fundPurpose)],
        ].filter(([, v]) => v);
        if (!rows.length) return '';
        return '<div class="drawer-section"><h3 class="drawer-section-title">Fund identity</h3><div class="kv-table">' +
            rows.map(([k, v]) => '<div class="kv-key">' + esc(k) + '</div><div class="kv-value">' + v + '</div>').join('') +
            '</div></div>';
    }

    function openDetailsPanel(fundName, opts) {
        const moveFocus = !opts || opts.focus !== false;
        const fund = DATA.funds.find(f => f.fundName === fundName);
        if (!fund) return;
        SELECTED_FUND = fundName;

        document.getElementById('fund-panel-title').textContent = fundName;
        const sub = [badgeHtml(fund.lpaStatus) + (similarNameTag(fund) ? ' ' + similarNameTag(fund) : '')];
        const lpaFund = fund.lpa && fund.lpa.fund;
        if (lpaFund && lpaFund.lpaDate) sub.push('<span>' + capitalized(documentLabel(fund.lpa)) + ' dated ' + esc(fmtDate(lpaFund.lpaDate)) + '</span>');
        if (lpaFund && lpaFund.stateOfFormation) sub.push('<span>' + esc(lpaFund.stateOfFormation) + '</span>');
        if (fund.documentId) sub.push(documentLink(fund.documentId, 'View ' + documentLabel(fund.lpa) + ' ↗'));
        const url = fundUrl(fund);
        if (url) sub.push('<a class="carta-link" href="' + escAttr(url) + '" data-external>Open in Carta ↗</a>');
        document.getElementById('fund-panel-sub').innerHTML = sub.join('<span aria-hidden="true">·</span>');

        document.getElementById('fund-panel-body').innerHTML =
            renderTermsSection(fund) + renderSideLettersSection(fund) + renderLpSection(fund) + renderIdentitySection(fund) +
            '<p class="drawer-caveat">Extracted from the LPA and side letter documents. Confirm against the source before acting on any figure.</p>';

        const panel = document.getElementById('fund-panel');
        panel.scrollTop = 0;
        panel.hidden = false;
        document.getElementById('panel-scrim').hidden = false;
        document.getElementById('shell').classList.add('has-panel');

        document.querySelectorAll('#fund-tbody tr[data-fund-name]').forEach(tr => {
            const on = tr.dataset.fundName === fundName;
            tr.classList.toggle('is-selected', on);
            const btn = tr.querySelector('.fund-btn');
            if (btn) btn.setAttribute('aria-expanded', String(on));
            if (on) tr.scrollIntoView({ block: 'nearest' });
        });
        syncPanelNav();
        const title = document.getElementById('fund-panel-title');
        if (moveFocus && title.focus) title.focus({ preventScroll: true });
    }

    function closeDetailsPanel() {
        if (!SELECTED_FUND) return;
        const fundName = SELECTED_FUND;
        SELECTED_FUND = null;
        document.getElementById('fund-panel').hidden = true;
        document.getElementById('panel-scrim').hidden = true;
        document.getElementById('shell').classList.remove('has-panel');
        let returnTo = null;
        document.querySelectorAll('#fund-tbody tr[data-fund-name]').forEach(tr => {
            tr.classList.remove('is-selected');
            const btn = tr.querySelector('.fund-btn');
            if (btn) btn.setAttribute('aria-expanded', 'false');
            if (tr.dataset.fundName === fundName) returnTo = btn;
        });
        // Back to the row that was open, so keyboard users land where they were.
        if (returnTo && returnTo.focus) returnTo.focus();
    }

    function stepPanel(delta) {
        const i = VISIBLE.findIndex(f => f.fundName === SELECTED_FUND);
        if (i < 0) return;
        const next = VISIBLE[i + delta];
        if (next) openDetailsPanel(next.fundName, { focus: false });
    }

    function syncPanelNav() {
        const i = VISIBLE.findIndex(f => f.fundName === SELECTED_FUND);
        document.getElementById('panel-prev').disabled = i <= 0;
        document.getElementById('panel-next').disabled = i < 0 || i >= VISIBLE.length - 1;
        document.getElementById('panel-pos').textContent = i < 0 ? '' : (i + 1) + ' of ' + VISIBLE.length;
    }

    // ---------- Footer ----------
    function renderPageFooter() {
        document.getElementById('page-footer').innerHTML =
            'To add an LPA, drop it into this chat, or ' +
            '<a class="carta-link" href="' + escAttr(docsUrl()) + '" data-external>view or upload LPA documents in Carta ↗</a>';
    }

    // ---------- Wiring ----------
    // Delegated, so every listener survives the innerHTML re-renders that
    // filter, search and sort perform.
    document.getElementById('summary-tiles').addEventListener('click', e => {
        const tile = e.target.closest('[data-filter]');
        if (tile) setFilter(ACTIVE_FILTER === tile.dataset.filter ? 'all' : tile.dataset.filter);
    });
    document.getElementById('filter-select').addEventListener('change', e => setFilter(e.target.value));
    document.getElementById('search-input').addEventListener('input', e => setSearch(e.target.value));
    document.getElementById('fund-thead').addEventListener('click', e => {
        const btn = e.target.closest('[data-sort]');
        if (!btn) return;
        const key = btn.dataset.sort;
        // Numbers open high-to-low (the usual question is "who charges most");
        // names open A–Z. A third click returns to the default order.
        const first = key === 'name' ? 'asc' : 'desc';
        if (!SORT || SORT.key !== key) SORT = { key, dir: first };
        else if (SORT.dir === first) SORT = { key, dir: first === 'asc' ? 'desc' : 'asc' };
        else SORT = null;
        renderFundTable();
    });
    document.getElementById('fund-tbody').addEventListener('click', e => {
        const row = e.target.closest('tr[data-fund-name]');
        if (row) openDetailsPanel(row.dataset.fundName);
    });
    document.getElementById('panel-prev').addEventListener('click', () => stepPanel(-1));
    document.getElementById('panel-next').addEventListener('click', () => stepPanel(1));
    document.getElementById('panel-close').addEventListener('click', closeDetailsPanel);
    document.getElementById('panel-scrim').addEventListener('click', closeDetailsPanel);
    document.addEventListener('click', e => {
        const link = e.target.closest && e.target.closest('a[data-external]');
        if (!link) return;
        e.preventDefault();
        openExternal(link.getAttribute('href'));
    });
    document.addEventListener('keydown', e => {
        if (!SELECTED_FUND) return;
        if (e.key === 'Escape') { closeDetailsPanel(); return; }
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
        // Arrows step between funds unless the reader is typing or scrolling the panel body.
        const active = document.activeElement;
        if (active && (['INPUT', 'SELECT', 'TEXTAREA'].includes(active.tagName) ||
            document.getElementById('fund-panel-body').contains(active))) return;
        e.preventDefault();
        stepPanel(e.key === 'ArrowDown' ? 1 : -1);
    });

    // ---------- Init ----------
    // Nothing renders synchronously: the page opens on the shimmer and bootstrap
    // swaps in the content once Carta answers.
    bootstrap();
  </script>
</body>
</html>
