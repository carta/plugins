<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- This tag names the published artifact: the Artifact tool reads the title from the
       file and only falls back to its `title` parameter when the file has none. -->
  <title>{{PAGE_TITLE}}</title>
  <!-- Every value that differs per company or per build. The page's JS reads only this. -->
  <script>
    window.CAPTABLE_HOME = {
      mcpServer: {{CARTA_MCP_SERVER_JSON}},
      corporationId: "{{CORPORATION_ID}}",
      companyName: {{COMPANY_NAME_JSON}},
      version: "{{ARTIFACT_VERSION}}",
      builtAt: "{{BUILT_AT}}",
      buildId: "{{BUILD_ID}}",
      skillDirectory: {{SKILL_DIRECTORY_JSON}},
      skillOptOuts: {{SKILL_OPT_OUTS_JSON}},
    };
  </script>
  <!-- Everything is inlined: the runtime CSP allows no external script, style or
       connect host, so a CDN reference silently blocks and the charts never draw. -->
  <style>
    /* __CAPTABLE_HOME_CSS__ */
  </style>
</head>
<body>
<!-- __CAPTABLE_HOME_BODY_HTML__ -->
<script>
/* __CAPTABLE_HOME_JS__ */
</script>

</body>
</html>
