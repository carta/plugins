  <h1 data-testid="title" tabindex="-1">Issue securities</h1>
  <p class="sub" data-testid="subtitle"></p>
  <div class="load" data-testid="loading" hidden><span></span></div>

  <div data-testid="blockers"></div>
  <div data-testid="notices"></div>

  <section class="card" data-testid="shared-card">
    <h2 data-testid="shared-heading">Shared terms</h2>
    <div class="grid" data-testid="shared-grid"></div>
  </section>

  <section class="card" data-testid="rows-card">
    <h2>Stakeholders</h2>
    <div data-testid="rows"></div>
    <button class="add" id="add-stakeholder" data-testid="add-stakeholder" type="button">+ Add stakeholder</button>
  </section>

  <section class="card" data-testid="review-card" hidden>
    <h2 data-testid="review-heading">Review before issuing</h2>
    <div data-testid="review"></div>
  </section>

  <section class="card" data-testid="issued-card" hidden>
    <h2 data-testid="issued-heading">What happens next</h2>
    <div data-testid="issued"></div>
  </section>

  <footer>
    <button id="back-to-edit" data-testid="back-to-edit" type="button" hidden>← Back to edit</button>
    <button id="save-draft" data-testid="save-draft" type="button">Save as draft</button>
    <button class="primary" id="confirm-issue" data-testid="confirm-issue" type="button">Review and issue</button>
    <button class="primary" id="issue" data-testid="issue" type="button" hidden>Issue</button>
    <span class="why" data-testid="blocked-reason" aria-live="polite"></span>
  </footer>
  <p class="status" data-testid="status" role="alert" hidden></p>

  <p class="stamp" data-testid="build-stamp">build {{BUILD_ID}}</p>
</div>

<!-- The irreversible write happens from here: the sheet carries the save, the check,
     the one confirmation and the result, so nothing commits off a stale screen. -->
<div class="scrim" data-testid="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title" data-testid="modal-title" tabindex="-1"></h3>
    <div data-testid="modal-body" aria-live="polite"></div>
    <div class="sheet-f">
      <button id="modal-close" data-testid="modal-close" type="button" hidden></button>
      <button class="primary" id="modal-go" data-testid="modal-go" type="button" hidden></button>
    </div>
  </div>
</div>
