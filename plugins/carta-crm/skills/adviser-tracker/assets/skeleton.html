<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adviser Tracker</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--line:#e7e5e0;--grid:#eeece7;--ink:#1b1b1a;--muted:#8a8780;--green:#3f9a5b;--yellow:#d9a92c;--red:#cf4b45;--c-old:#9ca3af;--c-mid:#476ba3;--c-cur:#bf6a48;--serif:Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans)}
.page{max-width:1400px;margin:0 auto;padding:24px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.brand .name{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#2b3350}
.tile{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.tile img{width:100%;height:100%;display:block}
.tile.sm{width:28px;height:28px;border-radius:7px}
.tile.blank{border:1px solid var(--line);background:#fff}
.notice{background:#fff7e0;border:1px solid #ecd9a0;border-radius:8px;padding:8px 12px;margin-bottom:16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-bottom:20px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h2{font:400 22px/1.2 var(--serif);margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px;max-width:1100px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.toggle button{border:0;background:#fff;color:var(--muted);font:inherit;padding:6px 14px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:#000;color:#fff}
.empty{color:var(--muted);padding:24px 0;margin:0}
table{width:100%;border-collapse:collapse}
th{font-weight:400;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;position:relative}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
td.idx{color:var(--muted);width:36px}
td.total{font-weight:600}
tr.tier td{background:#faf9f6;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px}
.bank{display:flex;align-items:center;gap:10px;outline:0}
.bank .n{font-weight:500}
.grey{color:var(--muted);font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:baseline}
.strong{background:var(--green)}.moderate{background:var(--yellow)}.weak{background:var(--red)}
td.hov{outline:0}
.pop{display:none;position:absolute;left:10px;top:100%;z-index:10;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:12px 14px;min-width:260px;font-size:13px;white-space:normal}
td.hov:hover>.pop,td.hov:focus-within>.pop,td.hov:focus>.pop{display:block}
.pop table{width:auto}
.pop th,.pop td{padding:4px 8px;border-bottom:1px solid var(--grid);font-size:12px;white-space:nowrap}
.pop .row{margin:0 0 4px}
.legend{display:flex;gap:18px;margin-top:8px;color:var(--muted);font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
svg{display:block;width:100%;height:auto;font-family:var(--sans)}
svg text{fill:var(--muted);font-size:12px}
svg .val{fill:#7b7870;font-size:11px}
</style>
</head>

<script>
(function () {
  var data = JSON.parse(document.getElementById('tracker-data').textContent);
  var COLORS = ['var(--c-old)', 'var(--c-mid)', 'var(--c-cur)'];
  var STRENGTH = { strong: 'Strong', moderate: 'Moderate', weak: 'Weak' };
  var selectedYear = data.window.to;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function el(id) { return document.getElementById(id); }
  function utc(iso) { return new Date(iso.length === 10 ? iso + 'T00:00:00Z' : iso); }
  function fmtDate(iso) {
    return new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeZone: 'UTC' }).format(utc(iso));
  }

  // Years newest first, from window.to down to window.from.
  function yearsOf(d) {
    var ys = [];
    for (var y = d.window.to; y >= d.window.from; y--) ys.push(y);
    return ys;
  }
  // Every count below derives from dealsByMonth only.
  function byMonth(row) {
    var m = {};
    row.dealsByMonth.forEach(function (e) { m[e.month] = e.count; });
    return m;
  }
  function byQuarter(row, year) {
    var q = [0, 0, 0, 0];
    row.dealsByMonth.forEach(function (e) {
      if (e.month.slice(0, 4) === String(year)) q[Math.floor((+e.month.slice(5, 7) - 1) / 3)] += e.count;
    });
    return q;
  }
  function byYear(row, year) {
    return byQuarter(row, year).reduce(function (a, b) { return a + b; }, 0);
  }
  // Months from January of window.from up to the asOf month.
  function drawnMonths(d) {
    var out = [], last = d.asOf.slice(0, 7);
    for (var y = d.window.from; y <= d.window.to; y++) {
      for (var m = 1; m <= 12; m++) {
        var k = y + '-' + (m < 10 ? '0' : '') + m;
        if (k <= last) out.push(k);
      }
    }
    return out;
  }
  function tierOf(row) {
    return (data.tiers['1'] || []).indexOf(row.adviser.domain) >= 0 ? 1 : 2;
  }
  // The image when a data URI exists, else an empty bordered tile of the same size.
  function logoTile(logo, cls) {
    var c = 'tile ' + (cls || '');
    if (logo && logo.dataUri && logo.dataUri.indexOf('data:image/') === 0) {
      return '<span class="' + c + '"><img alt="" src="' + esc(logo.dataUri) + '"></span>';
    }
    return '<span class="' + c + ' blank"></span>';
  }
  function money(f) {
    if (f.currency == null) return new Intl.NumberFormat().format(f.amount) + ' (currency not recorded)';
    return new Intl.NumberFormat(undefined, { style: 'currency', currency: f.currency, maximumFractionDigits: 0 }).format(f.amount);
  }
  // One amount per currency, never summed.
  function formatFees(row) {
    if (row.fees && row.fees.length) return row.fees.map(money).join(' · ');
    return row.feeUnavailableReason || 'No fees recorded';
  }
  function dot(strength) { return '<span class="dot ' + esc(strength) + '"></span>'; }
  function niceMax(v) {
    var steps = [4, 8, 12, 20, 40, 60, 80, 100, 200, 400, 800, 1000];
    for (var i = 0; i < steps.length; i++) if (v <= steps[i]) return steps[i];
    return Math.ceil(v / 100) * 100;
  }
  function gridlines(top, bottom, left, right, max) {
    var s = '', n = 4;
    for (var i = 0; i <= n; i++) {
      var y = bottom - (bottom - top) * i / n;
      s += '<line x1="' + left + '" x2="' + right + '" y1="' + y + '" y2="' + y + '" style="stroke:var(--grid)"/>' +
        '<text x="' + (left - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + Math.round(max * i / n) + '</text>';
    }
    return s;
  }
  function legend(items) {
    return '<div class="legend">' + items.map(function (i) {
      return '<span><i style="background:' + i[1] + '"></i>' + esc(i[0]) + '</span>';
    }).join('') + '</div>';
  }
  function head(title, sub, extra) {
    return '<div class="card-head"><div><h2>' + esc(title) + '</h2><p class="sub">' + esc(sub) + '</p></div>' + (extra || '') + '</div>';
  }
  function emptyLine() {
    return '<p class="empty">No adviser data to show yet.</p>';
  }
  function asOfText() { return fmtDate(data.asOf); }
  function source() {
    return 'Carta CRM, ' + data.tenant.name + ' tenant, as of ' + asOfText() + '. ' + data.window.to + ' runs to ' + asOfText() + '.';
  }

  function renderHeader() {
    el('brand').innerHTML = logoTile(data.tenant.logo) + '<span class="name">' + esc(data.tenant.name) + '</span>';
  }
  function renderNotice() {
    el('notice').innerHTML = data.notice ? '<div class="notice">' + esc(data.notice) + '</div>' : '';
  }

  function bankCell(r) {
    var a = r.adviser;
    return '<td class="hov" tabindex="0"><div class="bank">' + logoTile(a.logo, 'sm') +
      '<div><div class="n">' + esc(a.name) + '</div><div class="grey">' + esc(a.domain) + '</div></div></div>' +
      '<div class="pop"><p class="row"><b>Fees</b> ' + esc(formatFees(r)) + '</p>' +
      '<p class="row"><b>Notes</b> ' + esc(r.notesCount) + '</p></div></td>';
  }
  function matrixPanel(rel) {
    if (!rel.matrix || !rel.matrix.length) return '<div class="pop"><span class="grey">No interactions recorded</span></div>';
    return '<div class="pop"><table><tr><th>Teammate</th><th>Contact</th><th class="num">Interactions</th><th>Last</th><th></th></tr>' +
      rel.matrix.map(function (m) {
        return '<tr><td>' + esc(m.teammate.name) + '</td><td>' + esc(m.contact.name) + '</td><td class="num">' +
          esc(m.interactions) + '</td><td>' + esc(fmtDate(m.lastInteraction)) + '</td><td>' + dot(m.strength) + '</td></tr>';
      }).join('') + '</table></div>';
  }
  function dataRow(r, i, year) {
    var q = byQuarter(r, year), rel = r.relationship, tc = rel.topContact;
    return '<tr><td class="idx">' + i + '</td>' + bankCell(r) +
      q.map(function (n) { return '<td class="num">' + n + '</td>'; }).join('') +
      '<td class="num total">' + byYear(r, year) + '</td>' +
      '<td class="hov" tabindex="0">' + dot(rel.strength) + esc(STRENGTH[rel.strength] || rel.strength) + matrixPanel(rel) + '</td>' +
      '<td>' + (tc ? '<div>' + esc(tc.name) + '</div><div class="grey">' + esc(tc.interactions) + ' interactions</div>' : '<span class="grey">No contact</span>') + '</td></tr>';
  }
  function renderTable(year) {
    var toggle = '<div class="toggle" role="group" aria-label="Year">' + yearsOf(data).map(function (y) {
      return '<button type="button" data-year="' + y + '" aria-pressed="' + (y === year) + '">' + y + '</button>';
    }).join('') + '</div>';
    var sub = 'Deals created per quarter of the selected year, per bank. ' + source() +
      ' Top contact is the person with the most emails and meetings with anyone on our team.';
    var body;
    if (!data.rows.length) {
      body = emptyLine();
    } else {
      var n = 0;
      body = '<table><thead><tr><th>#</th><th>Investment bank</th><th class="num">Q1</th><th class="num">Q2</th><th class="num">Q3</th><th class="num">Q4</th>' +
        '<th class="num">Year total</th><th>Relationship strength</th><th>Top contact</th></tr></thead><tbody>';
      [1, 2].forEach(function (t) {
        var rs = data.rows.filter(function (r) { return tierOf(r) === t; });
        if (!rs.length) return;
        body += '<tr class="tier"><td colspan="9">Tier ' + t + '</td></tr>';
        rs.forEach(function (r) { body += dataRow(r, ++n, year); });
      });
      body += '</tbody></table>';
    }
    var card = el('card-table');
    card.innerHTML = head(data.title, sub, toggle) + body;
    card.querySelectorAll('[data-year]').forEach(function (b) {
      b.addEventListener('click', function () { selectedYear = +b.getAttribute('data-year'); renderTable(selectedYear); });
    });
  }

  // Two lines under each group when they fit, else one rotated line.
  function bankLabel(name, cx, y, gw) {
    if (gw < 70) {
      return '<text x="' + cx + '" y="' + y + '" text-anchor="end" transform="rotate(-35 ' + cx + ' ' + y + ')">' + esc(name) + '</text>';
    }
    var words = name.split(' '), half = Math.ceil(words.length / 2);
    return '<text text-anchor="middle"><tspan x="' + cx + '" y="' + y + '">' + esc(words.slice(0, half).join(' ')) +
      '</tspan><tspan x="' + cx + '" y="' + (y + 15) + '">' + esc(words.slice(half).join(' ')) + '</tspan></text>';
  }
  function renderYearChart() {
    var ys = yearsOf(data).slice().reverse(), cur = ys[ys.length - 1];
    var sub = 'Deals created per bank, year over year. ' + source();
    var html = head('Deals by bank, year over year', sub);
    if (!data.rows.length) { el('card-years').innerHTML = html + emptyLine(); return; }
    var W = 1100, H = 380, L = 90, R = 10, T = 16, B = 100, n = data.rows.length;
    var max = 0;
    data.rows.forEach(function (r) { ys.forEach(function (y) { max = Math.max(max, byYear(r, y)); }); });
    max = niceMax(max);
    var gw = (W - L - R) / n, bw = Math.min(18, gw * 0.8 / ys.length), svg = gridlines(T, H - B, L, W - R, max);
    data.rows.forEach(function (r, i) {
      var x0 = L + gw * i + (gw - bw * ys.length) / 2;
      ys.forEach(function (y, k) {
        var v = byYear(r, y), h = (H - B - T) * v / max, x = x0 + bw * k;
        svg += '<rect x="' + x + '" y="' + (H - B - h) + '" width="' + (bw - 1) + '" height="' + h + '" style="fill:' + COLORS[k + COLORS.length - ys.length] + '"/>' +
          (v ? '<text class="val" x="' + (x + (bw - 1) / 2) + '" y="' + (H - B - h - 4) + '" text-anchor="middle">' + v + '</text>' : '');
      });
      var cx = L + gw * i + gw / 2;
      svg += bankLabel(r.adviser.name, cx, H - B + 16, gw);
    });
    var items = ys.map(function (y, k) { return [y === cur ? y + ' (YTD)' : String(y), COLORS[k + COLORS.length - ys.length]]; });
    el('card-years').innerHTML = html + '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Deals by bank, year over year">' + svg + '</svg>' + legend(items);
  }

  function renderMonthChart() {
    var months = drawnMonths(data);
    var sub = 'Total deals created per month across all banks. ' + source();
    var html = head('Deals created per month, last ' + (data.window.to - data.window.from + 1) + ' years', sub);
    if (!data.rows.length) { el('card-months').innerHTML = html + emptyLine(); return; }
    var maps = data.rows.map(byMonth);
    var totals = months.map(function (k) { return maps.reduce(function (a, m) { return a + (m[k] || 0); }, 0); });
    var W = 1100, H = 320, L = 40, R = 10, T = 16, B = 36, max = niceMax(Math.max.apply(null, totals));
    var gw = (W - L - R) / months.length, bw = gw * 0.7, svg = gridlines(T, H - B, L, W - R, max);
    var mon = new Intl.DateTimeFormat(undefined, { month: 'short', timeZone: 'UTC' });
    months.forEach(function (k, i) {
      var h = (H - B - T) * totals[i] / max, x = L + gw * i + (gw - bw) / 2;
      svg += '<rect x="' + x + '" y="' + (H - B - h) + '" width="' + bw + '" height="' + h + '" style="fill:' + COLORS[1] + '"/>' +
        (totals[i] ? '<text class="val" x="' + (x + bw / 2) + '" y="' + (H - B - h - 4) + '" text-anchor="middle">' + totals[i] + '</text>' : '');
      if ((+k.slice(5, 7) - 1) % 3 === 0) {
        svg += '<text x="' + (x + bw / 2) + '" y="' + (H - B + 18) + '" text-anchor="middle">' +
          esc(mon.format(new Date(k + '-01T00:00:00Z')) + " '" + k.slice(2, 4)) + '</text>';
      }
    });
    el('card-months').innerHTML = html + '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Deals created per month">' + svg + '</svg>' +
      legend([['Total, all ' + data.rows.length + ' banks', COLORS[1]]]);
  }

  function render() {
    renderHeader();
    renderNotice();
    renderTable(selectedYear);
    renderYearChart();
    renderMonthChart();
  }
  render();
})();
</script>
</body>
</html>
