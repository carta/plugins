<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adviser Tracker</title>
<style>
:root{--bg:#f7f6f3;--card:#fff;--line:#e7e5e0;--grid:#eeece7;--ink:#1b1b1a;--muted:#8a8780;--green:#3f9a5b;--yellow:#d9a92c;--red:#cf4b45;--c-old:#9ca3af;--c-mid:#476ba3;--c-cur:#bf6a48;--serif:Georgia,"Times New Roman",serif;--sans:"Avenir Next",Avenir,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans)}
.page{max-width:1400px;margin:0 auto;padding:24px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.brand .name{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#2b3350}
.tile{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.tile img{width:100%;height:100%;display:block}
.tile.sm{width:28px;height:28px;border-radius:7px}
.tile.blank{border:1px solid var(--line);background:#fff}
.notice{background:#fff7e0;border:1px solid #ecd9a0;border-radius:8px;padding:8px 12px;margin-bottom:16px;font-size:13px}
.insight{margin:0 0 16px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--c-cur);border-radius:8px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-bottom:20px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
h2{font:400 22px/1.2 var(--serif);margin:0 0 8px}
#card-table h2{font-size:26px;margin-bottom:16px}
.sub{color:var(--muted);font-size:14px;margin:0 0 10px}
.how{margin:0 0 16px;font-size:13px}
.how summary{display:block;width:fit-content;cursor:pointer;color:#2b3350;list-style:none;border:1px solid #cfd3e0;background:#f1f3f9;border-radius:6px;padding:4px 12px;font-weight:600}
.how summary:hover{background:#e7ebf5}
.how summary::-webkit-details-marker{display:none}
.how summary::before{content:"\25B8\00a0"}
.how[open] summary::before{content:"\25BE\00a0"}
.how[open] summary{border-bottom:0;border-radius:6px 6px 0 0;margin-bottom:-1px;position:relative;z-index:1}
.how p{margin:8px 0 0;padding:10px 12px;color:#2b3350;background:#f1f3f9;border:1px solid #cfd3e0;border-radius:6px}
.how[open] p{margin:0;border-top-left-radius:0}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.toggle button+button{border-left:1px solid var(--line)}
.toggle button{border:0;background:#fff;color:var(--muted);font:inherit;padding:6px 14px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:#000;color:#fff}
button:focus-visible,summary:focus-visible{outline:2px solid var(--c-mid);outline-offset:2px}
.empty{color:var(--muted);padding:24px 0;margin:0}
table{width:100%;border-collapse:collapse}
th{font-weight:400;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;position:relative;transition:background-color .15s}
tr:last-child td{border-bottom:0}
tr[data-d]:hover td{background:#f3efe7}
.num{text-align:right;font-variant-numeric:tabular-nums}
.total{padding-right:40px}
td.idx{color:var(--muted);width:36px}
td.total{font-weight:600}
th small{font-size:11px;font-style:italic}
td.chg{animation:flash .8s ease-out}
tr.tier td{background:#faf9f6;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;cursor:default}
.bank{display:flex;align-items:center;gap:10px;text-align:left}
.bank .n{display:block;font-weight:500}
.bank .grey{display:block}
.grey{color:var(--muted);font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:baseline}
.strong{background:var(--green)}.moderate{background:var(--yellow)}.weak{background:var(--red)}
.pop{display:none;z-index:10;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:12px 14px;min-width:260px;font-size:13px;white-space:normal}
.pop .row{margin:0 0 4px}
.tip{position:fixed;left:0;top:0;min-width:0;max-width:320px;pointer-events:none;z-index:50}
.tip.show{display:block}
.tip .row:last-child{margin-bottom:0}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-top:4px;color:var(--muted);font-size:13px;min-height:24px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.scale{margin-left:auto;font-size:12px}
.note{margin:10px 0 0}
.legend i.partial-swatch{background:var(--c-mid);opacity:.55;border:1px dashed var(--c-mid)}
.lg{border:0;background:none;font:inherit;color:inherit;padding:2px 4px;border-radius:4px;cursor:pointer}
.lg[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
svg{display:block;width:100%;height:auto;font-family:var(--sans)}
svg text{fill:var(--muted);font-size:12px}
svg .val{fill:#7b7870;font-size:11px;pointer-events:none}
.bar{transition:filter .15s}
.bar:hover{filter:brightness(1.1)}
.bar.part{opacity:.55;stroke:var(--c-mid);stroke-dasharray:3 2}
.bar:focus{outline:0}
.bar:focus-visible{stroke:#000;stroke-width:2;stroke-dasharray:none}
.bar.zero{fill:transparent}
.grp{transition:opacity .2s}
.tier-card[hidden]{display:none}
/* A mouse click focuses a bar too, so only keyboard focus (:focus-visible) counts, and a click never leaves a highlight behind. */
svg:has(.grp:hover,.bar:focus-visible) .grp:not(:hover):not(:has(.bar:focus-visible)){opacity:.22}
.grp:hover .lbl,.grp:has(.bar:focus-visible) .lbl{font-weight:600;fill:var(--ink)}
.bar{transform-box:fill-box;transform-origin:50% 100%}
.enter .bar{animation:grow .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 1ms)}
.enter .val{animation:fade .4s ease-out .45s both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes flash{from{background:#fbeede}to{background:transparent}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>

(function () {

  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cy = data.window.to, cm = +data.asOf.slice(5, 7);

  var doneM = +data.asOf.slice(8, 10) >= new Date(Date.UTC(cy, cm, 0)).getUTCDate() ? cm : cm - 1;
  var partialM = cm - doneM;
  // The quarter of asOf is partial unless its last month is complete.
  var partialQ = partialM === 0 && cm % 3 === 0 ? -1 : Math.floor((cm - 1) / 3);
  var state = { year: cy, hidden: {} };

  var shown = {};

  var VOLUME_BANDS = [{ min: 6, key: 'strong' }, { min: 3, key: 'moderate' }, { min: 0, key: 'weak' }];

  }

    row.dealsByMonth.forEach(function (e) {

  function dot(strength) { return '<span class="dot ' + esc(strength) + '"></span>'; }
  function niceMax(v) {
    var steps = [4, 8, 12, 20, 40, 60, 80, 100, 200, 400, 800, 1000];
    for (var i = 0; i < steps.length; i++) if (v <= steps[i]) return steps[i];
    return Math.ceil(v / 100) * 100;
  }
  function gridlines(top, bottom, left, right, max) {
    var s = '', n = 4;
    for (var i = 0; i <= n; i++) {
      var y = bottom - (bottom - top) * i / n;
      s += '<line x1="' + left + '" x2="' + right + '" y1="' + y + '" y2="' + y + '" style="stroke:var(--grid)"/>' +
        '<text x="' + (left - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + Math.round(max * i / n) + '</text>';
    }
    return s;
  }
  function head(title, sub, how, extra) {
    return '<div class="card-head"><h2>' + esc(title) + '</h2>' + (extra || '') + '</div>' +
      '<p class="sub">' + esc(sub) + '</p>' +
      '<details class="how"><summary>How to read this</summary><p>' + esc(how) + '</p></details>';
  }
  function emptyLine() {
    return '<p class="empty">No adviser data to show yet.</p>';
  }
  function asOfText() { return fmtDate(data.asOf); }
  function source() {
    return 'Carta CRM, ' + data.tenant.name + ', as of ' + asOfText() + '. ' + cy + ' runs to ' + asOfText() + '.';
  }

  // Tooltip text. One source for the hover panel and the aria-label of a bar.
  function change(cur, prev) {
    return prev ? signed(cur - prev) + ' (' + signed(Math.round((cur - prev) / prev * 100)) + '%)' : 'no deals before, so no change to show';
  }
  function monthSpan(last) { return last === 12 ? 'full year' : last === 1 ? 'Jan' : 'Jan to ' + MON[last - 1]; }
  // Year over year compares whole years, or for the current year its complete months only.
  function yearTip(row, y) {
    var n = toDate(row, y), lines = [];
    if (y === cy) lines.push('YTD to ' + asOfText() + (partialM ? ', the last month is partial' : ''));
    if (y > data.window.from) {
      var last = y === cy ? doneM : 12, prev = sumMonths(row, y - 1, last);
      if (!last) {
        lines.push('No complete month yet to compare');
      } else {
        lines.push('Compared on ' + monthSpan(last) + ': ' + sumMonths(row, y, last) + ' vs ' + prev + ' in ' + (y - 1) + ', ' + change(sumMonths(row, y, last), prev));
      }
    }
    return { title: row.adviser.name + ', ' + y + ': ' + deals(n) + ' created', lines: lines };
  }
  function isPartial(k) { return partialM > 0 && k === data.asOf.slice(0, 7); }
  function monthTip(k) {
    var total = 0, list = [], lines = [];
    data.rows.forEach(function (r) {
      var n = byMonth(r)[k] || 0;
      total += n;
      if (n) list.push([r.adviser.name, n]);
    });
    list.sort(function (a, b) { return b[1] - a[1]; });
    if (isPartial(k)) lines.push('Partial month, to ' + asOfText());
    list.slice(0, 3).forEach(function (e) { lines.push(e[0] + ': ' + e[1]); });
    return {
      title: MON[+k.slice(5, 7) - 1] + ' ' + k.slice(0, 4) + ': ' + deals(total) + ' created across the ' + data.rows.length + ' banks shown',
      lines: lines
    };
  }
  function tipOf(d) {
    return d.kind === 'y' ? yearTip(data.rows[+d.i], +d.y) : monthTip(d.m);
  }
  function labelOf(d) {
    var t = tipOf(d);
    return [t.title].concat(t.lines).join('. ');
  }
  // A bar with no deals keeps a transparent hit area so it still takes hover and focus.
  function barTag(d, attrs, x, y, w, h, fill, delay) {
    var zero = h <= 0;
    return '<rect class="bar' + (zero ? ' zero' : '') + (d.kind === 'm' && isPartial(d.m) ? ' part' : '') + '" tabindex="0" role="img" aria-label="' +
      esc(labelOf(d)) + '" data-kind="' + d.kind + '" ' + attrs + ' x="' + x + '" y="' + (zero ? y - 14 : y) + '" width="' + w + '" height="' + (zero ? 14 : h) +
      '" style="' + (zero ? '' : 'fill:' + fill + ';') + '--d:' + delay + '"/>';
  }

  // Headline rules. A line is shown only when all of these hold:
  // 1. It states a fact the page recomputes from the data on screen, with its basis in the same line.
  // 2. Its deal counts are the table's Year total of the selected year (yearTotal), never another count.
  // 3. It says what was counted, never why: no causal wording, and no ranking by a quality the data
  //    does not measure ("best", "fastest").
  // 4. Growth compares complete months of both periods only, needs at least MIN_BASE deals in the
  //    earlier period, and names the base and both periods.
  // 5. A tie names every tied bank.
  // 6. When no claim passes (no deals, no complete months, no banks), the result is '' and the
  //    headline stays hidden. A weak line is never shown instead.
  function headline(year) {
    var parts = [], most = mostDeals(year), growth = growthLeaders(year);
    if (most) {
      parts.push('Most deals created in ' + year + (year === cy ? ' so far (to ' + asOfText() + ')' : '') + ': ' +
        listNames(most.names) + (most.names.length > 1 ? ' tied (' + most.n + ' each)' : ' (' + most.n + ')'));
    }
    if (growth) {
      parts.push('Highest percentage increase in deals created, ' + growth.now + ' against ' + growth.before +
        ', among banks with ' + MIN_BASE + ' or more deals in the earlier period: ' + growth.leaders.map(function (g) {
          return g.name + ' (' + g.cur + ' against ' + g.prev + ')';
        }).join(' and ') + (growth.leaders.length > 1 ? ' tied at ' : ' ') + '+' + growth.pct + '%');
    }
    return parts.join('; ');
  }
  function periodText(last, year) { return last === 12 ? String(year) : monthSpan(last) + ' ' + year; }
  function listNames(names) {
    return names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names[0];
  }
  // The banks with the highest Year total of `year`, or null when no bank has a deal.
  function mostDeals(year) {
    var n = 0, names = [];
    data.rows.forEach(function (r) {
      var t = yearTotal(r, year);
      if (t > n) { n = t; names = []; }
      if (t === n && n > 0) names.push(r.adviser.name);
    });
    return n ? { n: n, names: names } : null;
  }
  // The banks with the highest rise over the same complete months a year earlier, among those with a
  // large enough earlier base. Null when there is no earlier year, no complete month or no rise.
  function growthLeaders(year) {
    var last = year === cy ? doneM : 12, best = null, leaders = [];
    if (year <= data.window.from || !last) return null;
    data.rows.forEach(function (r) {
      var cur = sumMonths(r, year, last), prev = sumMonths(r, year - 1, last);
      if (prev < MIN_BASE || cur <= prev) return;
      // Compare cur / prev exactly, without rounding.
      var cmp = best ? cur * best.prev - best.cur * prev : 1;
      if (cmp > 0) { best = { cur: cur, prev: prev }; leaders = []; }
      if (cmp >= 0) leaders.push({ name: r.adviser.name, cur: cur, prev: prev });
    });
    if (!best) return null;
    return {
      leaders: leaders, pct: Math.round((best.cur - best.prev) / best.prev * 100),
      now: periodText(last, year), before: periodText(last, year - 1)
    };
  }

  function renderHeader() {
    el('brand').innerHTML = logoTile(data.tenant.logo) + '<span class="name">' + esc(data.tenant.name) + '</span>';
  }
  function renderNotice() {
    el('notice').innerHTML = data.notice ? '<div class="notice">' + esc(data.notice) + '</div>' : '';
  }
  function renderInsight() {
    var text = headline(state.year);
    el('insight').hidden = !text;
    el('insight').textContent = text;
  }

  function bankCell(r) {
    var a = r.adviser;
    return '<td><div class="bank">' + logoTile(a.logo, 'sm') +
      '<span><span class="n">' + esc(a.name) + '</span><span class="grey">' + esc(a.domain) + '</span></span></div></td>';
  }
  function numCell(domain, col, v, cls) {
    return '<td class="num ' + cls + '" data-k="' + esc(domain) + '|' + col + '" data-v="' + v + '">' + v + '</td>';
  }
  // Only the quarter of asOf in the current year is partial.
  function isPartialCol(col) { return state.year === cy && col === partialQ; }
  function dataRow(r, i, year) {
    var q = byQuarter(r, year), rel = r.relationship, tc = rel.topContact, d = r.adviser.domain;
    var total = yearTotal(r, year), band = volumeStrength(total);
    return '<tr data-d="' + esc(d) + '"><td class="idx">' + i + '</td>' + bankCell(r) +
      q.map(function (n, c) { return numCell(d, c, n, ''); }).join('') +
      numCell(d, 4, total, 'total') +
      '<td>' + dot(band) + esc(STRENGTH[band]) + '</td>' +
      '<td>' + (tc ? '<div>' + esc(tc.name) + '</div><div class="grey">' + esc(tc.interactions) + ' interactions</div>' : '<span class="grey">No contact</span>') + '</td></tr>';
  }
  // Quarter and total cells count from the value shown before to the new one.
  function animateCells(card, from) {
    if (REDUCED) return;
    var items = [];
    card.querySelectorAll('td[data-k]').forEach(function (c) {
      var f = from[c.dataset.k], v = +c.dataset.v;
      if (f != null && f !== v) { items.push([c, f, v]); c.textContent = f; c.classList.add('chg'); }
    });
    if (!items.length) return;
    var t0 = null;
    function step(t) {
      if (t0 == null) t0 = t;
      var p = Math.min(1, (t - t0) / 400), e = 1 - Math.pow(1 - p, 3);
      items.forEach(function (i) { i[0].textContent = Math.round(i[1] + (i[2] - i[1]) * e); });
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  // Tier 1 is the top half of the banks by deals over the whole window, so the tiers do not follow the year.
  function tierRule() {
    return 'Tier 1 is the top half of the banks by deals created over the ' + (data.window.to - data.window.from + 1) +
      ' years, ties broken by deals in ' + data.window.to + ' and then by name: ' + data.tiers['1'].length + ' of ' + data.rows.length + '. Tier 2 is the rest.';
  }
  function renderTable(year) {
    var toggle = '<div class="toggle" role="group" aria-label="Year">' + yearsOf(data).map(function (y) {
      return '<button type="button" data-year="' + y + '" aria-pressed="' + (y === year) + '">' + y + '</button>';
    }).join('') + '</div>';
    var sub = 'Deals created per quarter of the selected year, per bank. ' + source() +
      ' Top contact is the person with the most emails and meetings with anyone on our team.';
    var how = CHOICES + ' The current quarter is partial and shows only the days so far. ' +
      'Relationship strength is the deal volume of the selected year: Strong is ' + VOLUME_BANDS[0].min + ' or more deals, Moderate is ' + VOLUME_BANDS[1].min + ' to ' + (VOLUME_BANDS[0].min - 1) + ', Weak is fewer. ' +
      (data.rows.length ? tierRule() + ' ' : '') +
      'Hover a row to highlight it.';
    var body;
    if (!data.rows.length) {
      body = emptyLine();
    } else {
      var n = 0;
      var cols = [0, 1, 2, 3].map(function (c) {
        return '<th class="num">Q' + (c + 1) + (isPartialCol(c) ? '*' : '') + '</th>';
      }).join('');
      body = '<table><thead><tr><th>#</th><th>Investment bank</th>' + cols +
        '<th class="num total">Year total' + (state.year === cy ? ' <small>YTD</small>' : '') + '</th><th>Relationship strength</th><th>Top contact</th></tr></thead><tbody>';
      [1, 2].forEach(function (t) {
        var rs = rankTier(data.rows.filter(function (r) { return tierOf(r) === t; }), year);
        if (!rs.length) return;
        body += '<tr class="tier"><td colspan="9">Tier ' + t + '</td></tr>';
        rs.forEach(function (r) { body += dataRow(r, ++n, year); });
      });
      body += '</tbody></table>';
      if (partialQ >= 0 && year === cy) body += '<p class="grey note">* Quarter to date, to ' + asOfText() + '</p>';
    }
    var card = el('card-table'), from = shown;
    card.innerHTML = head(data.title, sub, how, toggle) + body;
    shown = {};
    card.querySelectorAll('td[data-k]').forEach(function (c) { shown[c.dataset.k] = +c.dataset.v; });
    card.querySelectorAll('[data-year]').forEach(function (b) {
      b.addEventListener('click', function () { state.year = +b.getAttribute('data-year'); renderTable(state.year); renderInsight(); });
    });
    animateCells(card, from);
  }

  // At most two centred lines that fit the group width. A line that still does not fit ends in an ellipsis.
  function bankLabel(name, cx, y, gw) {
    var max = Math.max(6, Math.floor((gw - 6) / 5.6)), lines = [''];
    name.split(' ').forEach(function (w) {
      var cur = lines[lines.length - 1];
      if (cur && (cur + ' ' + w).length > max && lines.length < 2) lines.push(w);
      else lines[lines.length - 1] = cur ? cur + ' ' + w : w;
    });
    return '<text class="lbl" text-anchor="middle">' + lines.map(function (l, k) {
      return '<tspan x="' + cx + '" y="' + (y + k * 15) + '">' + esc(l.length > max ? l.slice(0, max - 1) + '…' : l) + '</tspan>';
    }).join('') + '</text>';
  }
  // The newest year takes the last colour.
  function colorOf(y) {
    return COLORS[Math.max(0, y - data.window.from + COLORS.length - yearsOf(data).length)];
  }
  // Each tier card fills its width with its own scale, shown on its axis.
  function yearScaleMax(rows) {
    var max = 0;
    rows.forEach(function (r) { yearsOf(data).forEach(function (y) { max = Math.max(max, toDate(r, y)); }); });
    // A multiple of four so the four axis steps are whole numbers.
    return Math.max(4, Math.ceil(max / 4) * 4);
  }
  // Highest deals in `year` first, then highest across all years.
  function rankTier(rows, year) {
    function total(r) { return yearsOf(data).reduce(function (a, y) { return a + toDate(r, y); }, 0); }
    return rows.slice().sort(function (a, b) { return toDate(b, year) - toDate(a, year) || total(b) - total(a); });
  }
  function renderTierChart(t) {
    var card = el('card-years-' + t);
    var rows = rankTier(data.rows.filter(function (r) { return tierOf(r) === t; }), cy);
    card.hidden = !rows.length && !(t === 1 && !data.rows.length);
    var all = yearsOf(data).slice().reverse();
    var ys = all.filter(function (y) { return !state.hidden[y]; });
    var sub = 'Deals created per bank in Tier ' + t + ', year over year. ' + source();
    var how = CHOICES + ' Each group is one bank and each bar is one year. ' + cy + ' runs to ' + asOfText() + ', so its bar is year to date. ' +
      'Each tier card has its own scale, so compare bars within a card. Hover or focus a bar for the change against the same complete months a year earlier. Click a year in the legend to hide it.';
    var html = head('Tier ' + t + ': deals by bank, year over year', sub, how);
    if (!data.rows.length) { card.innerHTML = html + emptyLine(); return; }
    if (card.hidden) return;
    var W = 1100, L = 44, R = 10, T = 20, PH = 300, B = 46, n = rows.length, max = yearScaleMax(rows);
    var gw = (W - L - R) / n, bw = gw * 0.84 / ys.length, base = T + PH, H = base + B;
    var svg = gridlines(T, base, L, W - R, max);
    rows.forEach(function (r, k) {
      var i = data.rows.indexOf(r), x0 = L + gw * k + (gw - bw * ys.length) / 2, g = '';
      ys.forEach(function (y, j) {
        var v = toDate(r, y), h = PH * v / max, x = x0 + bw * j;
        g += barTag({ kind: 'y', i: i, y: y }, 'data-i="' + i + '" data-y="' + y + '"', x, base - h, bw - 1.5, h, colorOf(y), k * 40) +
          (v ? '<text class="val" x="' + (x + (bw - 1.5) / 2) + '" y="' + (base - h - 4) + '" text-anchor="middle">' + v + '</text>' : '');
      });
      g += bankLabel(r.adviser.name, L + gw * k + gw / 2, base + 18, gw);
      svg += '<g class="grp" data-d="' + esc(r.adviser.domain) + '">' + g + '</g>';
    });
    var legend = '<div class="legend">' + all.map(function (y) {
      return '<button type="button" class="lg" data-leg="' + y + '" aria-pressed="' + !state.hidden[y] + '"><i style="background:' + colorOf(y) + '"></i>' +
        (y === cy ? y + ' (YTD)' : y) + '</button>';
    }).join('') + '<span class="scale">Scale 0 to ' + max + ', set for this card</span></div>';
    card.innerHTML = html + '<svg viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="Tier ' + t + ': deals by bank, year over year">' + svg + '</svg>' + legend;
  }
  function renderYearCharts(enter) {
    [1, 2].forEach(renderTierChart);
    if (enter) document.querySelectorAll('.tier-card svg').forEach(function (v) { v.classList.add('enter'); });
  }
  function toggleYear(y, cardId) {
    var visible = yearsOf(data).filter(function (v) { return !state.hidden[v]; });
    if (!state.hidden[y] && visible.length === 1) return;
    state.hidden[y] = !state.hidden[y];
    renderYearCharts(false);
    el(cardId).querySelector('[data-leg="' + y + '"]').focus();
  }

  function renderMonthChart(enter) {
    var months = drawnMonths(data);
    var sub = 'Total deals created per month across all banks. ' + source();
    var how = CHOICES + ' Each bar is all deals in that month across the banks shown. The last bar is a partial month, drawn lighter. Hover or focus a bar to see the top three banks that month.';
    var html = head('Deals created per month, last ' + (data.window.to - data.window.from + 1) + ' years', sub, how);
    if (!data.rows.length) { el('card-months').innerHTML = html + emptyLine(); return; }
    var maps = data.rows.map(byMonth);
    var totals = months.map(function (k) { return maps.reduce(function (a, m) { return a + (m[k] || 0); }, 0); });
    var W = 1100, H = 320, L = 40, R = 10, T = 16, B = 36, max = niceMax(Math.max.apply(null, totals));
    var gw = (W - L - R) / months.length, bw = gw * 0.7, svg = gridlines(T, H - B, L, W - R, max);
    months.forEach(function (k, i) {
      var h = (H - B - T) * totals[i] / max, x = L + gw * i + (gw - bw) / 2;
      svg += barTag({ kind: 'm', m: k }, 'data-m="' + k + '"', x, H - B - h, bw, h, COLORS[1], i * 12) +
        (totals[i] ? '<text class="val" x="' + (x + bw / 2) + '" y="' + (H - B - h - 4) + '" text-anchor="middle">' + totals[i] + '</text>' : '');
      if ((+k.slice(5, 7) - 1) % 3 === 0) {
        svg += '<text x="' + (x + bw / 2) + '" y="' + (H - B + 18) + '" text-anchor="middle">' + MON[+k.slice(5, 7) - 1] + " '" + k.slice(2, 4) + '</text>';
      }
    });
    el('card-months').innerHTML = html + '<svg class="' + (enter ? 'enter' : '') + '" viewBox="0 0 ' + W + ' ' + H +
      '" role="group" aria-label="Deals created per month">' + svg + '</svg><div class="legend" id="month-legend"></div>';
    el('month-legend').innerHTML = '<span><i style="background:' + COLORS[1] + '"></i>Total, all ' + data.rows.length + ' banks</span>' +
      (partialM ? '<span><i class="partial-swatch"></i>Partial month, to ' + asOfText() + '</span>' : '');
    el('card-months').querySelectorAll('.bar').forEach(function (b) { b.setAttribute('aria-label', labelOf(b.dataset)); });
  }

  var tip = el('tip');
  function showTip(bar) {
    var t = tipOf(bar.dataset);
    tip.innerHTML = '<p class="row"><b>' + esc(t.title) + '</b></p>' + t.lines.map(function (l) { return '<p class="row">' + esc(l) + '</p>'; }).join('');
    tip.classList.add('show');
    var r = bar.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    var top = r.top - h - 8;
    if (top < 8) top = Math.min(r.bottom + 8, window.innerHeight - h - 8);
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
    tip.style.top = top + 'px';
  }
  function hideTip() { tip.classList.remove('show'); }
  function closest(node, sel) { return node && node.closest ? node.closest(sel) : null; }

  function bind() {
    var page = document.querySelector('.page');
    page.addEventListener('mouseover', function (e) {
      var bar = closest(e.target, '.bar');
      if (bar) showTip(bar);
    });
    page.addEventListener('mouseout', function (e) {
      var from = closest(e.target, '.bar');
      if (from && from !== closest(e.relatedTarget, '.bar')) hideTip();
    });
    // Only keyboard focus shows the panel. A mouse click also focuses a bar and must not pin the panel.
    page.addEventListener('focusin', function (e) {
      var bar = closest(e.target, '.bar');
      if (bar && bar.matches(':focus-visible')) showTip(bar);
    });
    page.addEventListener('focusout', function (e) {
      if (closest(e.target, '.bar')) hideTip();
    });
    page.addEventListener('click', function (e) {
      var leg = closest(e.target, '[data-leg]');
      if (leg) toggleYear(+leg.dataset.leg, closest(leg, '.card').id);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hideTip(); return; }
      var b = closest(e.target, '.bar');
      if (!b) return;
      if (/^Arrow(Right|Left|Down|Up)$/.test(e.key)) {
        var bars = [].slice.call(b.closest('svg').querySelectorAll('.bar'));
        var next = bars[bars.indexOf(b) + (/Right|Down/.test(e.key) ? 1 : -1)];
        if (next) { e.preventDefault(); next.focus(); }
      }
    });
  }

  function render() {
    renderHeader();
    renderNotice();
    renderInsight();
    renderTable(state.year);
    renderYearCharts(true);
    renderMonthChart(true);
    bind();
  }
  render();
})();
</script>
</body>
</html>
